name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: YAML already fixed (run python3 fix-yaml.py locally and commit)
        run: python3 fix-yaml.py && git diff --exit-code
      - name: Recompute numeric answers
        run: node check-answers.mjs
      - name: Build and lint
        run: node build.mjs
