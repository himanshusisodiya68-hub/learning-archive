# Speed, velocity and acceleration. NCERT questions copied word for word from NCERT Science Grade 7 (Curiosity, reprint 2026-27) Ch 8, NCERT Science Grade 9 (Exploration, 2026-27) Ch 4 and NCERT Physics Class XI (reprint 2026-27) Ch 2. Grades 7 and 9 have no printed answer key, so those solutions are ours; Class XI answers are checked against the printed key. Found, board and main problems are original.

- id: ncert7-it-8-1
  lvl: ncert-intext
  num: "VII 8 · §8.1"
  source: NCERT Grade 7 Science · Ch 8 · §8.1 Measurement of Time
  kind: text
  q: |-
    How was time measured when there were no clocks and watches?
  sol: |
    People used events in nature that repeat after definite intervals: the rising and setting of the Sun (a day), the phases of the Moon, the changing seasons. Calendars came from these cycles.

    For shorter intervals within a day they built devices: **sundials** (the moving shadow of an object), **water clocks** (water flowing out of or into a vessel, or a floating bowl with a hole that fills and sinks), **hourglasses** (sand flowing from one bulb to another) and **candle clocks** (marked candles that burn at a steady rate). In each case something happens at a steady rate or repeats, and equal amounts of it are counted as equal intervals of time.
  check: none

- id: ncert7-it-8-2
  lvl: ncert-intext
  num: "VII 8 · §8.1.1"
  source: NCERT Grade 7 Science · Ch 8 · §8.1.1 A simple pendulum
  kind: text
  q: |-
    Is the pendulum similar to that?
  sol: |
    The question compares the simple pendulum with the eraser hung on a thread in the Grade 6 chapter. Yes: both are an object hung from a thread that moves to and fro about a fixed (mean) position when pulled to the side and released. Both show **oscillatory motion**, and because the path repeats after a fixed interval, the motion is also periodic.
  check: none

- id: ncert7-it-8-3
  lvl: ncert-intext
  num: "VII 8 · Activity 8.2"
  source: NCERT Grade 7 Science · Ch 8 · Activity 8.2: Let us experiment
  kind: text
  q: |-
    Is the time period of your pendulum almost the same every time? What do you conclude from this observation?
  sol: |
    Time 10 oscillations with a stopwatch, repeat 3 or 4 times, and divide each by 10. For a 100 cm string the time period comes out near 2 s each time (our estimate: $T = 2\pi\sqrt{L/g} = 2\pi\sqrt{1.00/9.8} \approx 2.0$ s), with only small differences from reaction time.

    **Conclusion:** the time period of a simple pendulum of a given length is almost the same every time, however long it has been swinging. This steadiness is why a pendulum can be used to measure time.
  check: none

- id: ncert7-it-8-4
  lvl: ncert-intext
  num: "VII 8 · Think like a scientist"
  source: NCERT Grade 7 Science · Ch 8 · Think like a Scientist!
  kind: text
  q: |-
    Suppose you were Galileo experimenting with pendulums, what all would you investigate? What questions could you ask? Would all pendulums have the same time period? How would you test this?
  sol: |
    Questions to investigate: Does the time period depend on the length of the string? On the mass of the bob? On how far the bob is pulled aside (within a small angle)?

    Method: change **one thing at a time**. Keep the same bob and use strings of several lengths, timing 10 oscillations for each. Then fix the length and use bobs of different masses.

    Result given in the book: the time period depends on the **length** (longer pendulum, longer time period) but **not on the mass of the bob**. All pendulums of the same length have the same time period at a given place. So not all pendulums have the same time period: only those with equal lengths do.
  check: none

- id: ncert7-it-8-5
  lvl: ncert-intext
  num: "VII 8 · Activity 8.3"
  source: NCERT Grade 7 Science · Ch 8 · Activity 8.3: Let us identify
  kind: text
  q: |-
    Look at the wall clock shown in Fig. 8.9 carefully. What is the smallest interval of time you can measure with it?
  sol: |
    **One second.** The smallest interval you can measure with a clock is the gap between two neighbouring ticks of its fastest hand; the book states that for this clock it is 1 second. A stopwatch that reads hundredths of a second can measure much shorter intervals.
  check: none

- id: ncert7-it-8-6
  lvl: ncert-intext
  num: "VII 8 · §8.1.2"
  source: NCERT Grade 7 Science · Ch 8 · §8.1.2 (speech bubble)
  kind: text
  q: |-
    For races covering the same distance, we can tell who was faster by measuring time. But how can we tell that when comparing races for different distances?
  sol: |
    Time alone is not enough when the distances differ. Compare **distance covered in unit time**, that is, the speed $\dfrac{\text{distance}}{\text{time}}$. For example, 100 m in 12 s gives $100/12 = 8.3$ m/s and 200 m in 25 s gives $200/25 = 8$ m/s, so the first runner is the faster one even though the races are of different lengths.
  check: none

- id: ncert7-it-8-7
  lvl: ncert-intext
  num: "VII 8 · §8.2"
  source: NCERT Grade 7 Science · Ch 8 · §8.2 Slow or Fast
  kind: text
  q: |-
    How do you decide who is running faster amongst them?
  sol: |
    Look at who has covered more distance in the same time. All players start together; after the same time, the one who is ahead has covered more distance and is running faster. So the runner who covers more distance in the same time interval (the one with the higher speed) is the fastest.
  check: none

- id: ncert7-eg-8-1
  lvl: ncert-intext
  num: "VII Ex 8.1"
  source: NCERT Grade 7 Science · Ch 8 · Example 8.1
  kind: num
  q: |-
    Swati's school is 3.6 km from her house. It took her 15 min to reach her school riding on her bicycle. Calculate the speed of the bicycle in m/s.
  ask: Speed of the bicycle
  unit: m/s
  ans: 4
  tol: 0.01
  verify: 3.6*1000/(15*60)
  sol: |
    $$\text{speed} = \frac{\text{distance}}{\text{time}} = \frac{3.6\times1000\ \text{m}}{15\times60\ \text{s}} = \frac{3600}{900} = 4\ \text{m/s}.$$
  check: code

- id: ncert7-eg-8-2
  lvl: ncert-intext
  num: "VII Ex 8.2"
  source: NCERT Grade 7 Science · Ch 8 · Example 8.2
  kind: num
  q: |-
    Raghav is going to a neighbouring city in a bus moving at a speed of 50 km/h. If it takes him 2 h to reach that city, how far is that city?
  ask: Distance to the city
  unit: km
  ans: 100
  tol: 0.1
  verify: 50*2
  sol: |
    Distance = speed × time $= 50\ \text{km/h}\times2\ \text{h} = 100$ km.
  check: code

- id: ncert7-eg-8-3
  lvl: ncert-intext
  num: "VII Ex 8.3"
  source: NCERT Grade 7 Science · Ch 8 · Example 8.3
  kind: num
  q: |-
    A train is travelling at a speed of 90 km/h. How much time will it take to cover a distance of 360 km?
  ask: Time taken
  unit: h
  ans: 4
  tol: 0.01
  verify: 360/90
  sol: |
    Time = distance / speed $= \dfrac{360\ \text{km}}{90\ \text{km/h}} = 4$ h.
  check: code

- id: ncert7-it-8-8
  lvl: ncert-intext
  num: "VII 8 · §8.4"
  source: NCERT Grade 7 Science · Ch 8 · §8.4 Uniform and Non-uniform Linear Motion
  kind: text
  q: |-
    I once watched a part of marathon on a straight road stretch. I noticed that some people seemed to be running at the same speed during that distance while some people would speed up or slow down. How were their motion different?
  sol: |
    The runners who kept the same speed throughout were in **uniform linear motion**: they covered equal distances in equal intervals of time. The runners who sped up or slowed down were in **non-uniform linear motion**: they covered unequal distances in equal intervals of time.
  check: none

- id: ncert7-it-8-9
  lvl: ncert-intext
  num: "VII 8 · Table 8.3"
  source: NCERT Grade 7 Science · Ch 8 · §8.4 Uniform and Non-uniform Linear Motion (Table 8.3)
  kind: text
  q: |-
    Which of the two trains is in uniform linear motion between 10:00 AM and 11:00 AM?

    Table 8.3: Distances travelled by two trains in equal time intervals of 10 minutes

    | Time (AM) | Train X position (km) | Train X distance (km) | Train Y position (km) | Train Y distance (km) |
    |---|---|---|---|---|
    | 10:00 | 0 | 0 | 0 | 0 |
    | 10:10 | 20 | 20 | 20 | 20 |
    | 10:20 | 40 | 20 | 35 | 15 |
    | 10:30 | 60 | 20 | 50 | 15 |
    | 10:40 | 80 | 20 | 75 | 25 |
    | 10:50 | 100 | 20 | 95 | 20 |
    | 11:00 | 120 | 20 | 120 | 25 |
  sol: |
    Train X covers 20 km in every 10-minute interval, so it covers equal distances in equal intervals of time: it is in **uniform linear motion** at $20/(10/60) = 120$ km/h.

    Train Y covers 20, 15, 15, 25, 20 and 25 km in successive 10-minute intervals. These are unequal, so Train Y is in non-uniform linear motion. Both trains cover 120 km in the hour, so they have the same average speed of 120 km/h.
  check: none

- id: ncert7-ex-8-1
  lvl: ncert-ex
  num: "VII 8 · Q1"
  source: NCERT Grade 7 Science · Ch 8 · Let Us Enhance Our Learning Q1
  kind: num
  q: |-
    Calculate the speed of a car that travels 150 metres in 10 seconds. Express your answer in km/h.
  ask: Speed of the car
  unit: km/h
  ans: 54
  tol: 0.05
  verify: 150/10*3.6
  sol: |
    Speed $= 150/10 = 15$ m/s. To convert m/s to km/h, multiply by $3600/1000 = 3.6$: $15\times3.6 = 54$ km/h.
