- id: b1
  lvl: board
  kind: num
  q: A bus travels 30 km in the first 30 minutes and 60 km in the next 1 hour. Find its average speed for the whole journey. (Original problem.)
  ask: Average speed
  unit: km/h
  ans: 60
  tol: 0.05
  verify: (30+60)/(0.5+1)
  sol: |
    Total distance $= 30 + 60 = 90$ km. Total time $= 0.5 + 1 = 1.5$ h.

    Average speed $= 90/1.5 = 60$ km/h. (The simple mean of 60 km/h and 60 km/h would also give 60 here, but the correct method is always total distance / total time.)
  check: code

- id: b2
  lvl: board
  kind: num
  q: A car increases its speed from 18 km/h to 90 km/h in 8 s along a straight road. Find its average acceleration in m/s². (Original problem.)
  ask: Average acceleration
  unit: m/s²
  ans: 2.5
  tol: 0.01
  verify: (90/3.6-18/3.6)/8
  sol: |
    $u = 18$ km/h $= 5$ m/s, $v = 90$ km/h $= 25$ m/s. Then
    $$a = \frac{v-u}{t} = \frac{25-5}{8} = 2.5\ \text{m s}^{-2}.$$
    The acceleration is in the direction of motion because the speed is increasing.
  check: code

- id: b3
  lvl: board
  kind: num
  q: A man walks 600 m from his house to a shop at 1.5 m/s and returns along the same path at 2.5 m/s. Find his average speed for the whole trip. (Original problem.)
  ask: Average speed
  unit: m/s
  ans: 1.875
  tol: 0.005
  verify: 1200/(600/1.5+600/2.5)
  sol: |
    Going: $600/1.5 = 400$ s. Returning: $600/2.5 = 240$ s. Total time $= 640$ s, total distance $= 1200$ m.

    Average speed $= 1200/640 = 1.875$ m/s. This is not the simple mean of 1.5 and 2.5 (which is 2.0 m/s), because he spends longer at the slower speed. His average velocity over the whole trip is zero.
  check: code

- id: m1
  lvl: main
  kind: num
  q: The position of a particle is x = 2t² + 3t (x in metres, t in seconds). Find its average velocity between t = 1 s and t = 3 s. (Original problem.)
  ask: Average velocity
  unit: m/s
  ans: 11
  tol: 0.01
  verify: ((2*9+3*3)-(2*1+3*1))/(3-1)
  sol: |
    $x(1) = 2 + 3 = 5$ m and $x(3) = 18 + 9 = 27$ m. Average velocity $= \dfrac{27-5}{3-1} = 11$ m/s.

    Check against the instantaneous velocity $v = dx/dt = 4t + 3$: at the midpoint $t = 2$ s, $v = 11$ m/s. For motion with constant acceleration the average velocity over an interval equals the instantaneous velocity at its midpoint.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A car covers the first half of a journey (by distance) at 40 km/h and the second half at 60 km/h. Find its average speed for the whole journey. (Original problem.)
  ask: Average speed
  unit: km/h
  ans: 48
  tol: 0.05
  verify: 2*40*60/(40+60)
  sol: |
    Let the total distance be $2d$. Time for the first half $= d/40$, for the second half $= d/60$. Total time $= d\left(\tfrac1{40}+\tfrac1{60}\right) = d\cdot\dfrac{5}{120} = \dfrac{d}{24}$.

    Average speed $= \dfrac{2d}{d/24} = 48$ km/h.

    In general, $\dfrac{2v_1v_2}{v_1+v_2}$ (the harmonic mean), which is less than the simple mean 50 km/h because more time is spent at the lower speed.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A ball hits a wall horizontally at 12 m/s and rebounds along the same line at 8 m/s. The contact lasts 0.02 s. Find the magnitude of its average acceleration during contact. (Original problem.)
  ask: Magnitude of average acceleration
  unit: m/s²
  ans: 1000
  tol: 0.5
  verify: (8+12)/0.02
  sol: |
    Take the initial direction as positive. Then $u = +12$ m/s and $v = -8$ m/s, because the ball reverses.

    $$a = \frac{v-u}{t} = \frac{-8-12}{0.02} = -1000\ \text{m s}^{-2}.$$
    The magnitude is $1000$ m s$^{-2}$, about 100 $g$, directed away from the wall. Forgetting the sign change (using 12 − 8) would give the wrong value 200 m s$^{-2}$.
  check: code
