- id: b3
  lvl: board
  kind: text
  q: Two bodies of different masses have equal kinetic energies and are brought to rest by the same constant retarding force. Which one travels the greater distance before stopping? Explain. (Original problem.)
  sol: |
    Neither: they stop in the **same distance**. By the work-energy theorem, $F\,d = K$, so $d = K/F$. The kinetic energy and the force are the same for both, so the distance is the same, whatever the masses. (The lighter body is faster and stops sooner in time; the heavier one is slower and takes longer, but the distance is equal.)
  check: none

- id: b4
  lvl: board
  kind: num
  q: A car travelling at 36 km/h can be stopped by its brakes in 8 m. In what minimum distance can it be stopped when it travels at 72 km/h, with the same braking force? (Original problem.)
  ask: Stopping distance at 72 km/h
  unit: m
  ans: 32
  tol: 0.1
  verify: 8*(72/36)**2
  sol: |
    $Fd = \tfrac12mv^2$, so $d \propto v^2$ for the same force and mass. Doubling the speed multiplies the stopping distance by 4:
    $$d = 8\times4 = 32\ \text{m}.$$
  check: code

- id: m1
  lvl: main
  kind: num
  q: A 4 kg block at rest on a rough floor is pushed by a constant horizontal force of 20 N through 5 m. The coefficient of kinetic friction is 0.25. Find its final speed. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Final speed
  unit: m/s
  ans: 5.05
  tol: 0.02
  verify: sqrt(2*(20-0.25*4*9.8)*5/4)
  sol: |
    Friction: $f = \mu mg = 0.25\times4\times9.8 = 9.8$ N. Net force: $20 - 9.8 = 10.2$ N.

    Net work: $W = 10.2\times5 = 51$ J. By the work-energy theorem, $\tfrac12(4)v^2 = 51$, so
    $$v = \sqrt{25.5} = 5.05\ \text{m s}^{-1}.$$
  check: code

- id: m2
  lvl: main
  kind: num
  q: A 2 kg block moving at 3 m/s on a smooth surface enters a region where it feels a retarding force $F = -2x$ N, where $x$ is the distance in metres into the region. Find its speed after it has moved 2 m in the region. (Original problem.)
  ask: Speed at $x = 2$ m
  unit: m/s
  ans: 2.24
  tol: 0.01
  verify: sqrt(2*(0.5*2*3**2-2**2)/2)
  sol: |
    The work done by the variable force is
    $$W = \int_0^2(-2x)\,dx = -x^2\Big|_0^2 = -4\ \text{J}.$$
    $K_i = \tfrac12(2)(3)^2 = 9$ J, so $K_f = 9 - 4 = 5$ J. Then $\tfrac12(2)v^2 = 5$, giving $v = \sqrt5 = 2.24\ \text{m s}^{-1}$.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A raindrop of mass 2.0 g falls from a cloud 1.5 km above the ground and reaches the ground at 20 m/s. How much work does the air resistance do on it? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Work done by air resistance
  unit: J
  ans: -29
  tol: 0.05
  verify: 0.5*0.002*20**2-0.002*9.8*1500
  sol: |
    $\Delta K = \tfrac12(0.002)(20)^2 - 0 = 0.4$ J and $W_g = mgh = 0.002\times9.8\times1500 = 29.4$ J. With $\Delta K = W_g + W_{\text{air}}$,
    $$W_{\text{air}} = 0.4 - 29.4 = -29.0\ \text{J}.$$
    Over 98% of the energy given by gravity is lost to the air. Without drag the drop would hit at $\sqrt{2gh} = 171$ m/s, far faster than rain really does.
  check: code

- id: m4
  lvl: main
  kind: num
  q: A 3 kg particle starts from rest at $x = 0$ under a force $F = (12 - 3x)$ N along the x-axis ($x$ in metres). Find its speed at $x = 4$ m. (Original problem.)
  ask: Speed at $x = 4$ m
  unit: m/s
  ans: 4
  tol: 0.01
  verify: sqrt(2*(12*4-1.5*4**2)/3)
  sol: |
    $$W = \int_0^4(12-3x)\,dx = \Big[12x - \tfrac32x^2\Big]_0^4 = 48 - 24 = 24\ \text{J}.$$
    By the work-energy theorem $\tfrac12(3)v^2 = 24$, so $v^2 = 16$ and $v = 4\ \text{m s}^{-1}$.

    The same work is the area of the triangle under the $F$-$x$ graph (base 4 m, height 12 N): $\tfrac12\times4\times12 = 24$ J. The force falls to zero at $x = 4$ m, so the particle has gained as much speed as it can.
  check: code
