- id: f2
  lvl: found
  kind: mcq
  q: A moving car is brought to rest by its brakes. The work done by the braking force is (Original problem.)
  opts: ["positive and equal to the initial kinetic energy", "negative and equal in magnitude to the initial kinetic energy", "zero, since the car ends at rest", "negative and equal in magnitude to the final kinetic energy"]
  ans: 1
  sol: |
    The braking force opposes the motion, so its work is negative. The work-energy theorem gives $W = K_f - K_i = 0 - K_i = -K_i$, so the work is negative with magnitude equal to the initial kinetic energy.
