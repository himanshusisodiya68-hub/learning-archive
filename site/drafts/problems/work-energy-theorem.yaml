- id: b2
  lvl: board
  kind: num
  q: A 0.5 kg hammer moving at 8 m/s strikes a nail and drives it 1.0 cm into a wooden plank, coming to rest. Find the average force the nail exerts on the hammer. (Original problem.)
  ask: Average force on the hammer
  unit: N
  ans: 1600
  tol: 2
  verify: 0.5*0.5*8**2/0.01
  sol: |
