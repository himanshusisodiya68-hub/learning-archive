- id: f3
  lvl: found
  kind: mcq
  q: |-
    The same constant force acts for the same time on a light trolley and a heavy trolley, both starting from rest on a smooth floor. Which statement is true? (Original problem.)
  opts: ["The light trolley gains more momentum.", "The heavy trolley gains more momentum.", "Both gain the same momentum, and the light trolley gains more speed.", "Both gain the same speed, and the heavy trolley gains more momentum."]
  ans: 2
  sol: |
    Impulse $= F\Delta t$ is the same for both, and impulse equals the change in momentum, so both gain the same momentum. Since $p = mv$, the lighter trolley must have the larger speed.
  check: none

