- id: b2
  lvl: board
  kind: num
  q: |-
    A fielder catches a 0.16 kg cricket ball moving at 30 m s$^{-1}$. He brings it to rest in 0.02 s with his hands held fixed. Another time he draws his hands back and takes 0.10 s. Find the average force on the ball in the second case, and compare. (Original problem.)
  ask: Force when the hands are drawn back
  unit: N
  ans: 48
  tol: 0.1
  verify: 0.16*30/0.10
  sol: |
    The change of momentum is the same in both catches: $\Delta p = 0.16 \times 30 = 4.8$ kg m s$^{-1}$.

    Hands fixed: $F = 4.8/0.02 = 240$ N. Hands drawn back: $F = 4.8/0.10 = 48$ N, one-fifth as large. By the third law the force on the hands is the same size, so drawing the hands back reduces the hurt. This is the principle behind airbags and landing mats.
  check: code

- id: b3
  lvl: board
  kind: num
  q: |-
    A 5 kg body at rest is acted on by a constant 20 N force for 3 s, after which the force is removed. What is the final speed of the body, on a smooth surface? (Original problem.)
  ask: Final speed
  unit: m s⁻¹
  ans: 12
  tol: 0.05
  verify: 20*3/5
  sol: |
    Impulse $= F t = 20 \times 3 = 60$ N s $= mv - 0$, so $v = 60/5 = 12$ m s$^{-1}$. After the force is removed there is no net force on a smooth surface, so the speed stays 12 m s$^{-1}$ (first law).
  check: code

- id: b4
  lvl: board
  kind: text
  q: |-
    State Newton's second law in terms of momentum and deduce $F = ma$ for a body of constant mass. Why does a person in a car crash suffer less injury with a seat belt and airbag? (Original problem.)
  sol: |
    The rate of change of momentum of a body is directly proportional to the net applied force and takes place in the direction of the force: $\vec F = k\, d\vec p/dt$. In SI units $k = 1$. For constant mass, $\vec p = m\vec v$, so $\vec F = m\, d\vec v/dt = m\vec a$.

    In a crash the passenger's momentum must be taken to zero. The seat belt and airbag make this take longer than a hard stop against the dashboard. The change of momentum is the same, so a longer time $\Delta t$ means a smaller average force $F = \Delta p/\Delta t$ and so less injury.
  check: none

- id: m1
  lvl: main
  kind: num
  q: |-
    A force $F = 6t$ newton (with $t$ in seconds) acts on a 3 kg body, initially at rest, along a straight line. Find its speed at $t = 4$ s. (Original problem.)
  ask: Speed at t = 4 s
  unit: m s⁻¹
  ans: 16
  tol: 0.05
  verify: 3*4**2/3
  sol: |
    The impulse is the area under the force-time graph: $J = \int_0^4 6t\,dt = 3t^2\Big|_0^4 = 48$ N s. Since the body starts from rest, $mv = 48$ and $v = 48/3 = 16$ m s$^{-1}$. (Here $F$ is not constant, so $F = ma$ with the kinematic equations does not apply; the impulse method does.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: |-
    Water leaves a horizontal hose at 10 m s$^{-1}$ at 2 kg per second and strikes a vertical wall at right angles, stopping dead without rebounding. Find the average force on the wall. How would it change if the water rebounded with the same speed? (Original problem.)
  ask: Force when the water stops dead
  unit: N
  ans: 20
  tol: 0.05
  verify: 2*10
  sol: |
    In one second a mass 2 kg loses its momentum $2 \times 10 = 20$ kg m s$^{-1}$, so the average force on the water by the wall is $F = \Delta p/\Delta t = 20$ N, and by the third law the force on the wall is 20 N, in the direction of the jet.

    If the water rebounded at the same speed, its momentum would change by $2 \times 20 = 40$ kg m s$^{-1}$ per second, so the force would double to 40 N.
  check: code

- id: m3
  lvl: main
  kind: num
  q: |-
    A machine gun fires 20 g bullets at 400 m s$^{-1}$, ten bullets every second. What average force must the shooter exert on the gun to hold it in place? (Original problem.)
  ask: Average force
  unit: N
  ans: 80
  tol: 0.1
  verify: 0.02*400*10
  sol: |
    Each bullet leaves with momentum $0.020 \times 400 = 8$ kg m s$^{-1}$, so the gun gets an equal and opposite momentum 8 kg m s$^{-1}$ per bullet. In one second ten bullets give a total momentum $80$ kg m s$^{-1}$, so the average recoil force on the gun is $F = 80$ N. The shooter must push forward with 80 N on average to hold the gun still.
  check: code

- id: m4
  lvl: main
  kind: num
  q: |-
    A 0.2 kg ball strikes a smooth vertical wall at 10 m s$^{-1}$ with its path making $60^\circ$ with the normal to the wall, and rebounds at the same speed and same angle on the other side of the normal. The contact lasts 0.01 s. Find the average force exerted by the wall on the ball. (Original problem.)
  ask: Average force
  unit: N
  ans: 200
  tol: 0.5
  verify: 2*0.2*10*cos(rad(60))/0.01
  sol: |
    The wall is smooth, so it exerts force only along the normal, and the momentum component parallel to the wall is unchanged. Only the normal component reverses: from $+mu\cos 60^\circ$ to $-mu\cos 60^\circ$. Impulse $= 2mu\cos 60^\circ = 2 \times 0.2 \times 10 \times 0.5 = 2$ N s, along the normal and away from the wall. Then $F = 2/0.01 = 200$ N.
  check: code
