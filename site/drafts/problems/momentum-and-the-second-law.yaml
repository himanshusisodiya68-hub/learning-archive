# Momentum and the second law (force, impulse, conservation of momentum). NCERT questions copied word for word from NCERT Science Grade 9 (Exploration, 2026-27) Ch 6 and NCERT Physics Class XI (reprint 2026-27) Ch 4. Grade 9 has no answer key, so those solutions are ours. Found, board and main problems are original.

- id: ncert9-eg-6-4
  lvl: ncert-intext
  num: "IX Ex 6.4"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.4
  kind: num
  q: |-
    A weight lifter is holding a barbell with mass of 10 kg fixed on each side of the bar (Fig. 6.8). The mass of the bar itself is 10 kg. How much force is she applying to keep the barbell steady?
  ask: Force applied by the weightlifter
  unit: N
  ans: 294
  tol: 0.5
  verify: 30*9.8
  sol: |
    Total mass $= 10 + 10 + 10 = 30$ kg. Its weight is $mg = 30 \times 9.8 = 294$ N downward. The barbell is steady, so $a = 0$ and the net force is zero: the weightlifter must push upward with 294 N.
  check: code

- id: ncert9-eg-6-5
  lvl: ncert-intext
  num: "IX Ex 6.5"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.5
  kind: num
  q: |-
    A student is trying to push a stationary block of 25 kg on a horizontal floor. The maximum force of friction opposing this motion is 50 N. Determine the displacement of the block in 2 seconds if Rahul pushes it with a constant force of (i) 50 N and (ii) 55 N in the forward direction.
  ask: Displacement in 2 s in case (ii)
  unit: m
  ans: 0.4
  tol: 0.005
  verify: 0.5*((55-50)/25)*2**2
  sol: |
    (i) With 50 N the push equals the maximum friction, so the net force is zero and the block stays at rest: displacement 0.

    (ii) Net force $= 55 - 50 = 5$ N, so $a = F/m = 5/25 = 0.2$ m s$^{-2}$. Starting from rest, $s = \tfrac12 a t^2 = \tfrac12 \times 0.2 \times 2^2 = 0.4$ m, forward.
  check: code

- id: ncert9-eg-6-6
  lvl: ncert-intext
  num: "IX Ex 6.6"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.6
  kind: num
  q: |-
    A sports car of mass 1500 kg is moving towards the east and its velocity-time graph is shown in Fig. 6.21. Calculate the force acting on the car during (i) 0 s to 5 s (ii) 5 s to 10 s (iii) 10 s to 15 s
  ask: Force during 0 s to 5 s
  unit: N
  ans: 3000
  tol: 1
  verify: 1500*(10-0)/5
  sol: |
    The graph (as described in the book's solution): the velocity rises uniformly from 0 to 10 m s$^{-1}$ in 0 to 5 s, stays at 10 m s$^{-1}$ from 5 s to 10 s, then falls uniformly to 0 in 10 s to 15 s.

    (i) $a = (10 - 0)/5 = 2$ m s$^{-2}$, so $F = ma = 1500 \times 2 = 3000$ N towards the east.

    (ii) The velocity is constant, $a = 0$, so the net force is zero.

    (iii) $a = (0 - 10)/5 = -2$ m s$^{-2}$, so $F = 1500 \times (-2) = -3000$ N: 3000 N towards the west, opposite to the motion.
  check: code

- id: ncert9-it-6-6
  lvl: ncert-intext
  num: "IX 6 · PP6"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 6
  kind: num
  q: |-
    A toy car of mass 100 g is moving with a constant velocity of 0.5 m s$^{-1}$. What is the net force acting on the toy car?
  ask: Net force
  unit: N
  ans: 0
  tol: 0.001
  verify: 0.1*0
  sol: |
    Constant velocity means $a = 0$, so $F = ma = 0.1 \times 0 = 0$. The net force is zero, whatever the mass and speed.
  check: code

- id: ncert9-it-6-7
  lvl: ncert-intext
  num: "IX 6 · PP7"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 7
  kind: text
  q: |-
    Two children of different masses are sitting on identical swings. To impart identical initial acceleration, for which child would you require to apply a larger force? Explain why.
  sol: |
    You need the larger force for the heavier child. By the second law $F = ma$, so for the same acceleration $a$ the force is proportional to the mass: a child of twice the mass needs twice the force.
  check: none

- id: ncert9-it-6-8
  lvl: ncert-intext
  num: "IX 6 · PP8"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 8
  kind: text
  q: |-
    How are glass items packed for transportation using a bubble wrap or hay protected from damage?
  sol: |
    If a packed glass item is jolted or dropped, the wrap compresses and lengthens the time over which its velocity changes. The same change of momentum over a longer time means a smaller acceleration and so, by $F = \Delta p/\Delta t$, a smaller force on the glass, which therefore does not break. The wrap also spreads the force over a larger area.
  check: none

- id: ncert9-ex-6-5
  lvl: ncert-ex
  num: "IX 6 · Q5"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q5
  kind: mcq
  q: |-
    When a net force acts on an object, we observe that the object accelerates:
  opts: ["opposite to the direction of force, with acceleration proportional to the force acting on the object.", "opposite to the direction of force, with acceleration proportional to the mass of the object.", "in the direction of force, with acceleration inversely proportional to the force acting on the object.", "in the direction of force, with acceleration proportional to the force acting on the object."]
  ans: 3
  sol: |
    The second law gives $\vec a = \vec F/m$: the acceleration is in the direction of the net force and proportional to its magnitude (and inversely proportional to the mass). Option (iv).
  check: none

- id: ncert9-ex-6-8
  lvl: ncert-ex
  num: "IX 6 · Q8"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q8
  kind: text
  q: |-
    During a high jump event, a landing mat or sand bed is placed for the athlete to fall upon (Fig. 6.39). Explain the reason behind it.
  sol: |
    The athlete lands with a certain speed and must be brought to rest, a fixed change of momentum. On a soft mat or sand the stopping takes much longer than on hard ground. The same change in momentum over a longer time means a smaller average force, $F = \Delta p/\Delta t$ (equivalently a smaller deceleration, $F = ma$), so the athlete is not injured.
  check: none

- id: ncert9-ex-6-10
  lvl: ncert-ex
  num: "IX 6 · Q10"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q10
  kind: num
  q: |-
    The acceleration-mass graph for the acceleration produced by a force on objects of different masses is plotted in Fig. 6.40. Plot the force-mass graph for this case.
  ask: Force (constant, for every mass)
  unit: N
  ans: 10
  tol: 0.2
  verify: 10*1
  sol: |
    [Inference] Values read from the plotted curve (the figure is a printed graph): $a \approx 10$ m s$^{-2}$ at $m = 1$ kg, 5 at 2 kg, about 3.3 at 3 kg, 2.5 at 4 kg and 2 at 5 kg. The product $ma$ is the same at every point:

    | $m$ (kg) | 1 | 2 | 3 | 4 | 5 |
    |---|---|---|---|---|---|
    | $a$ (m s$^{-2}$) | 10 | 5 | 3.3 | 2.5 | 2 |
    | $F = ma$ (N) | 10 | 10 | 10 | 10 | 10 |

    So the same force of 10 N acts on every object, and the force-mass graph is a horizontal straight line at $F = 10$ N (force on the vertical axis, mass on the horizontal axis). The acceleration-mass curve is the hyperbola $a = 10/m$.
  check: code

- id: ncert9-ex-6-11
  lvl: ncert-ex
  num: "IX 6 · Q11"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q11
  kind: num
  q: |-
    The velocity-time graph of an object of mass 10 kg moving along a straight line is shown in Fig. 6.41. Calculate the force acting on the object by using the graph.
  ask: Force
  unit: N
  ans: 25
  tol: 0.1
  verify: 10*(30-10)/8
  sol: |
    [Inference] Read from the printed graph: a straight line from $v = 10$ m s$^{-1}$ at $t = 0$ to $v = 30$ m s$^{-1}$ at $t = 8$ s.

    The slope is the acceleration: $a = (30 - 10)/8 = 2.5$ m s$^{-2}$. The line is straight, so the acceleration and force are constant: $F = ma = 10 \times 2.5 = 25$ N in the direction of motion.
  check: code

- id: ncert9-ex-6-12
  lvl: ncert-ex
  num: "IX 6 · Q12"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q12
  kind: num
  q: |-
    A bullet of mass 50 g moving with a speed of 100 m s$^{-1}$ enters a heavy stationary wooden block and stops after penetrating a distance of 50 cm. Estimate the stopping force acting on the bullet (assume that the bullet undergoes constant acceleration within the block).
  ask: Stopping force
  unit: N
  ans: 500
  tol: 1
  verify: 0.05*100**2/(2*0.5)
  sol: |
    $v^2 = u^2 + 2as$ with $v = 0$, $u = 100$ m s$^{-1}$, $s = 0.50$ m gives $a = -u^2/(2s) = -10\,000/1 = -10\,000$ m s$^{-2}$. The force is $F = ma = 0.050 \times 10\,000 = 500$ N, opposite to the bullet's motion.
  check: code

- id: ncert9-ex-6-13
  lvl: ncert-ex
  num: "IX 6 · Q13"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q13
  kind: num
  q: |-
    An ace footballer converted a penalty shot by kicking the football with a speed of 108 km h$^{-1}$. The estimated force they imparted was 800 N. The mass of the football was 0.4 kg. Calculate the time of contact between their foot and the ball.
  ask: Time of contact
  unit: ms
  ans: 15
  tol: 0.1
  verify: 0.4*(108/3.6)/800*1000
  sol: |
    $108$ km h$^{-1}$ $= 108/3.6 = 30$ m s$^{-1}$. The ball starts from rest, so the acceleration is $a = F/m = 800/0.4 = 2000$ m s$^{-2}$ and $t = v/a = 30/2000 = 0.015$ s $= 15$ ms. (Equivalently, impulse $Ft = mv$.)
  check: code

- id: ncert9-ex-6-15
  lvl: ncert-ex
  num: "IX 6 · Q15"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q15
  kind: proof
  q: |-
    A tractor pulls a harrow (a ploughing tool) of mass $m_1$ with a net force $F$ resulting in an acceleration of $a_1$. The same tractor pulls a trolley of mass $m_2$ with a force $F$ producing an acceleration of $a_2$. If the tractor now pulls the trolley with the harrow placed on it (with the same force $F$), then obtain an expression for the resulting acceleration in terms of $a_1$ and $a_2$. Ignore friction.
  hints: ["Write the masses in terms of F and the two accelerations: m1 = F/a1 and m2 = F/a2.", "The total mass being pulled is m1 + m2.", "Substitute into a = F/(m1 + m2) and simplify."]
  sol: |
    From $F = m_1 a_1$ we get $m_1 = F/a_1$, and from $F = m_2 a_2$ we get $m_2 = F/a_2$. With the harrow on the trolley the mass pulled is $m_1 + m_2$ and the force is the same $F$, so

    $$a = \frac{F}{m_1 + m_2} = \frac{F}{F/a_1 + F/a_2} = \frac{1}{\dfrac{1}{a_1} + \dfrac{1}{a_2}} = \frac{a_1 a_2}{a_1 + a_2}.$$

    Check: if $a_1 = a_2$, the mass doubles and the acceleration halves: $a_1^2/(2a_1) = a_1/2$. The result is smaller than both $a_1$ and $a_2$, as it must be.
  check: none

- id: ncert11-eg-4-2
  lvl: ncert-intext
  num: "XI Ex 4.2"
  source: NCERT XI Physics · Ch 4 · Example 4.2
  kind: num
  q: |-
    A bullet of mass 0.04 kg moving with a speed of 90 m s$^{-1}$ enters a heavy wooden block and is stopped after a distance of 60 cm. What is the average resistive force exerted by the block on the bullet?
  ask: Average resistive force
  unit: N
  ans: 270
  tol: 1
  verify: 0.04*90**2/(2*0.6)
  sol: |
    The retardation (assumed constant) is $a = -u^2/(2s) = -(90 \times 90)/(2 \times 0.6) = -6750$ m s$^{-2}$. By the second law the retarding force is $F = 0.04 \times 6750 = 270$ N. The real resistive force need not be uniform, so 270 N is only the average.
  answer_key: 270 N (worked answer of Example 4.2).
  check: both

- id: ncert11-eg-4-3
  lvl: ncert-intext
  num: "XI Ex 4.3"
  source: NCERT XI Physics · Ch 4 · Example 4.3
  kind: text
  q: |-
    The motion of a particle of mass $m$ is described by $y = ut + \tfrac12 gt^2$. Find the force acting on the particle.
  sol: |
    Differentiate twice: $v = dy/dt = u + gt$ and $a = dv/dt = g$. The acceleration is constant, so by the second law $F = ma = mg$. The equation describes a particle falling under gravity, with $y$ measured along the direction of $g$.
  answer_key: F = ma = mg (worked answer of Example 4.3).
  check: ncert-key

- id: ncert11-eg-4-4
  lvl: ncert-intext
  num: "XI Ex 4.4"
  source: NCERT XI Physics · Ch 4 · Example 4.4
  kind: num
  q: |-
    A batsman hits back a ball straight in the direction of the bowler without changing its initial speed of 12 m s$^{-1}$. If the mass of the ball is 0.15 kg, determine the impulse imparted to the ball. (Assume linear motion of the ball)
  ask: Impulse
  unit: N s
  ans: 3.6
  tol: 0.01
  verify: 2*0.15*12
  sol: |
    Take the initial direction as positive. Initial momentum $= 0.15 \times 12 = +1.8$ kg m s$^{-1}$; final momentum $= -1.8$ kg m s$^{-1}$. Impulse $=$ change in momentum $= -1.8 - 1.8 = -3.6$ kg m s$^{-1}$, that is, 3.6 N s directed from the batsman towards the bowler. The force and the contact time are hard to know separately, but the impulse is easy to find.
  answer_key: 3.6 N s, in the direction from the batsman to the bowler (worked answer of Example 4.4).
  check: both

- id: ncert11-eg-4-5
  lvl: ncert-intext
  num: "XI Ex 4.5"
  source: NCERT XI Physics · Ch 4 · Example 4.5
  kind: num
  q: |-
    Two identical billiard balls strike a rigid wall with the same speed but at different angles, and get reflected without any change in speed, as shown in Fig. 4.6. What is (i) the direction of the force on the wall due to each ball? (ii) the ratio of the magnitudes of impulses imparted to the balls by the wall?
  ask: Ratio of impulses, case (a) : case (b)
  unit: ""
  ans: 1.15
  tol: 0.01
  verify: 2/sqrt(3)
  sol: |
    [Inference] The figure is not in the extracted text. Case (a): the ball hits the wall along the normal. Case (b): the ball hits at 30° to the normal (taken from the book's solution, which uses $\cos 30^\circ$).

    Take $x$ along the normal to the wall. Find the impulse on each ball by the wall from the change in its momentum, then use the third law for the force on the wall.

    Case (a): $p_x$ changes from $+mu$ to $-mu$; $p_y = 0$ throughout. Impulse $= -2mu$ along $x$, and zero along $y$.

    Case (b): $p_x$ changes from $+mu\cos 30^\circ$ to $-mu\cos 30^\circ$, while $p_y = -mu\sin 30^\circ$ does not change. Impulse $= -2mu\cos 30^\circ$ along $x$, zero along $y$.

    (i) In both cases the impulse on the ball is along the normal, away from the wall, so by Newton's third law the force on the wall is normal to the wall in both cases (it is not inclined in case b). Its magnitude cannot be found as the contact time is not given.

    (ii) Ratio of magnitudes $= 2mu/(2mu\cos 30^\circ) = 1/\cos 30^\circ = 2/\sqrt 3 \approx 1.15$. The book writes it as about 1.2.
  answer_key: (i) Normal to the wall in both cases. (ii) 2/√3 ≈ 1.2 (worked answer of Example 4.5).
  check: both

- id: ncert11-ex-4-2
  lvl: ncert-ex
  num: "XI 4.2"
  source: NCERT XI Physics · Ch 4 · Exercise 4.2
  kind: num
  q: |-
    A pebble of mass 0.05 kg is thrown vertically upwards. Give the direction and magnitude of the net force on the pebble, (a) during its upward motion, (b) during its downward motion, (c) at the highest point where it is momentarily at rest. Do your answers change if the pebble was thrown at an angle of 45° with the horizontal direction? Ignore air resistance.
  ask: Magnitude of the net force
  unit: N
  ans: 0.5
  tol: 0.005
  verify: 0.05*10
  sol: |
    Ignoring air resistance the only force on the pebble is its weight, $mg = 0.05 \times 10 = 0.5$ N, vertically downward.

    (a) 0.5 N downward while it rises (it is slowing down).

    (b) 0.5 N downward while it falls (it is speeding up).

    (c) 0.5 N downward at the highest point too. Zero velocity at an instant does not mean zero force: the acceleration there is still $g$.

    The answers do not change for a throw at 45°. The force depends only on the situation (the Earth's pull), not on the direction of motion; the pebble is not at rest at the top of its path but has a constant horizontal velocity component.
  answer_key: The only force in each case is the force of gravity, equal to 0.5 N vertically downward. The answers do not change, even if the motion of the pebble is not along the vertical. The pebble is not at rest at the highest point. It has a constant horizontal component of velocity throughout its motion.
  check: both

- id: ncert11-ex-4-3
  lvl: ncert-ex
  num: "XI 4.3"
  source: NCERT XI Physics · Ch 4 · Exercise 4.3
  kind: num
  q: |-
    Give the magnitude and direction of the net force acting on a stone of mass 0.1 kg,
    (a) just after it is dropped from the window of a stationary train,
    (b) just after it is dropped from the window of a train running at a constant velocity of 36 km/h,
    (c) just after it is dropped from the window of a train accelerating with 1 m s$^{-2}$,
    (d) lying on the floor of a train which is accelerating with 1 m s$^{-2}$, the stone being at rest relative to the train.
    Neglect air resistance throughout.
  ask: Net force in case (d)
  unit: N
  ans: 0.1
  tol: 0.001
  verify: 0.1*1
  sol: |
    (a) Only gravity acts: $mg = 0.1 \times 10 = 1$ N vertically downward.

    (b) Same, 1 N downward: a constant velocity of the train adds no horizontal force.

    (c) Same, 1 N downward. The force at an instant depends on what acts on the stone at that instant, not on its earlier history. After it leaves the window nothing pushes it horizontally, so only gravity acts, even though the train is accelerating.

    (d) The stone moves with the train, so its acceleration is 1 m s$^{-2}$ in the direction of the train's motion, and the net force is $ma = 0.1 \times 1 = 0.1$ N in that direction. It is the friction of the floor that supplies this force (the weight and the normal force cancel).
  answer_key: (a) 1 N vertically downwards. (b) same as in (a). (c) same as in (a); force at an instant depends on the situation at that instant, not on history. (d) 0.1 N in the direction of motion of the train.
  check: both

- id: ncert11-ex-4-5
  lvl: ncert-ex
  num: "XI 4.5"
  source: NCERT XI Physics · Ch 4 · Exercise 4.5
  kind: num
  q: |-
    A constant retarding force of 50 N is applied to a body of mass 20 kg moving initially with a speed of 15 m s$^{-1}$. How long does the body take to stop?
  ask: Time to stop
  unit: s
  ans: 6
  tol: 0.01
  verify: 15/(50/20)
  sol: |
    The deceleration is $a = F/m = 50/20 = 2.5$ m s$^{-2}$, so $a = -2.5$ m s$^{-2}$. From $v = u + at$: $0 = 15 - 2.5t$, giving $t = 6.0$ s.
  answer_key: a = −2.5 m s⁻². Using v = u + at, 0 = 15 − 2.5t, i.e., t = 6.0 s.
  check: both

- id: ncert11-ex-4-6
  lvl: ncert-ex
  num: "XI 4.6"
  source: NCERT XI Physics · Ch 4 · Exercise 4.6
  kind: num
  q: |-
    A constant force acting on a body of mass 3.0 kg changes its speed from 2.0 m s$^{-1}$ to 3.5 m s$^{-1}$ in 25 s. The direction of the motion of the body remains unchanged. What is the magnitude and direction of the force?
  ask: Magnitude of the force
  unit: N
  ans: 0.18
  tol: 0.001
  verify: 3*(3.5-2.0)/25
  sol: |
    $a = (3.5 - 2.0)/25 = 0.06$ m s$^{-2}$ and $F = ma = 3.0 \times 0.06 = 0.18$ N, in the direction of motion (the speed increases and the direction does not change, so the force is along the velocity).
  answer_key: a = 1.5/25 = 0.06 m s⁻²; F = 3 × 0.06 = 0.18 N in the direction of motion.
  check: both

- id: ncert11-ex-4-7
  lvl: ncert-ex
  num: "XI 4.7"
  source: NCERT XI Physics · Ch 4 · Exercise 4.7
  kind: num
  q: |-
    A body of mass 5 kg is acted upon by two perpendicular forces 8 N and 6 N. Give the magnitude and direction of the acceleration of the body.
  ask: Magnitude of the acceleration
  unit: m s⁻²
  ans: 2
  tol: 0.01
  verify: sqrt(8**2+6**2)/5
  sol: |
    The resultant of perpendicular forces is $\sqrt{8^2 + 6^2} = 10$ N, at an angle $\tan^{-1}(6/8) = \tan^{-1}(3/4) \approx 37^\circ$ to the 8 N force. By the second law $a = F/m = 10/5 = 2$ m s$^{-2}$, in the direction of the resultant force (37° from the 8 N force, towards the 6 N force).
  answer_key: Resultant force = 10 N at an angle of tan⁻¹(3/4) = 37° with the direction of 8 N force. Acceleration = 2 m s⁻² in the direction of the resultant force.
  check: both

- id: ncert11-ex-4-8
  lvl: ncert-ex
  num: "XI 4.8"
  source: NCERT XI Physics · Ch 4 · Exercise 4.8
  kind: num
  q: |-
    The driver of a three-wheeler moving with a speed of 36 km/h sees a child standing in the middle of the road and brings his vehicle to rest in 4.0 s just in time to save the child. What is the average retarding force on the vehicle? The mass of the three-wheeler is 400 kg and the mass of the driver is 65 kg.
  ask: Average retarding force
  unit: N
  ans: 1162.5
  tol: 1
  verify: (400+65)*(36/3.6)/4.0
  sol: |
    $36$ km/h $= 10$ m s$^{-1}$. The deceleration is $a = 10/4.0 = 2.5$ m s$^{-2}$. The driver moves with the vehicle, so the mass being stopped is $400 + 65 = 465$ kg, and $F = 465 \times 2.5 = 1162.5$ N, which the answer key rounds to $1.2 \times 10^3$ N.
  answer_key: a = −2.5 m s⁻², Retarding force = 465 × 2.5 = 1.2 × 10³ N
  check: both

- id: ncert11-ex-4-9
  lvl: ncert-ex
  num: "XI 4.9"
  source: NCERT XI Physics · Ch 4 · Exercise 4.9
  kind: num
  q: |-
    A rocket with a lift-off mass 20,000 kg is blasted upwards with an initial acceleration of 5.0 m s$^{-2}$. Calculate the initial thrust (force) of the blast.
  ask: Initial thrust
  unit: N
  ans: 300000
  tol: 100
  verify: 20000*(10+5.0)
  sol: |
    Two forces act on the rocket: thrust $F$ upward and weight $mg = 20\,000 \times 10 = 2.0 \times 10^5$ N downward (taking $g = 10$ m s$^{-2}$, as the exercise sets). The second law, taking up as positive: $F - mg = ma$, so $F = m(g + a) = 20\,000 \times 15 = 3.0 \times 10^5$ N.
  answer_key: F − 20,000 × 10 = 20000 × 5.0, i.e., F = 3.0 × 10⁵ N
  check: both

- id: ncert11-ex-4-10
  lvl: ncert-ex
  num: "XI 4.10"
  source: NCERT XI Physics · Ch 4 · Exercise 4.10
  kind: num
  q: |-
    A body of mass 0.40 kg moving initially with a constant speed of 10 m s$^{-1}$ to the north is subject to a constant force of 8.0 N directed towards the south for 30 s. Take the instant the force is applied to be $t$ = 0, the position of the body at that time to be $x$ = 0, and predict its position at $t$ = –5 s, 25 s, 100 s.
  ask: Position at t = 100 s (north positive)
  unit: km
  ans: -50
  tol: 0.1
  verify: (10*30-0.5*20*30**2+(10-20*30)*70)/1000
  sol: |
    Take north as positive. The force gives $a = -8.0/0.40 = -20$ m s$^{-2}$ for $0 \le t \le 30$ s.

    $t = -5$ s: the force is not yet acting, so the velocity is constant: $x = ut = 10 \times (-5) = -50$ m.

    $t = 25$ s: $x = ut + \tfrac12 a t^2 = 10 \times 25 - 10 \times 625 = -6000$ m $= -6$ km.

    $t = 100$ s: for the first 30 s, $x_1 = 10 \times 30 - 10 \times 900 = -8700$ m and the velocity at 30 s is $v = 10 - 20 \times 30 = -590$ m s$^{-1}$. The force then stops, so the body moves uniformly for 70 s: $x_2 = -590 \times 70 = -41\,300$ m. Total $x = x_1 + x_2 = -50\,000$ m $= -50$ km (50 km south of the starting point).
  answer_key: a = −20 m s⁻², 0 ≤ t ≤ 30 s. t = −5 s: x = ut = −10 × 5 = −50 m. t = 25 s: x = ut + (1/2)at² = (10 × 25 − 10 × 625) m = −6 km. t = 100 s: x₁ = 10 × 30 − 10 × 900 = −8700 m; at t = 30 s, v = 10 − 20 × 30 = −590 m s⁻¹; x₂ = −590 × 70 = −41300 m; x = x₁ + x₂ = −50 km.
  check: both

- id: ncert11-ex-4-14
  lvl: ncert-ex
  num: "XI 4.14"
  source: NCERT XI Physics · Ch 4 · Exercise 4.14
  kind: num
  q: |-
    Figure 4.16 shows the position-time graph of a particle of mass 4 kg. What is the (a) force on the particle for $t < 0$, $t > 4$ s, $0 < t < 4$ s? (b) impulse at $t = 0$ and $t = 4$ s? (Consider one-dimensional motion only).
  ask: Impulse at t = 0
  unit: kg m s⁻¹
  ans: 3
  tol: 0.01
  verify: 4*(3/4)
  sol: |
    The graph (Fig. 4.16): $x = 0$ for $t < 0$, a straight line rising from 0 to 3 m between $t = 0$ and $t = 4$ s, then constant at 3 m for $t > 4$ s.

    (a) The graph is straight in each interval, so the velocity is constant in each and the acceleration is zero. The force is zero for $t < 0$, for $0 < t < 4$ s and for $t > 4$ s.

    (b) The velocity is 0 for $t < 0$, then $3/4 = 0.75$ m s$^{-1}$ for $0 < t < 4$ s, then 0 again. At $t = 0$ the impulse is the momentum change $4 \times (0.75 - 0) = +3$ kg m s$^{-1}$; at $t = 4$ s it is $4 \times (0 - 0.75) = -3$ kg m s$^{-1}$. (These abrupt changes are idealisations: they would need infinite force acting for zero time.)

    [Note] The printed answer key labels the parts as (a), (b), (c) while the question has only (a) and (b); the key's "(b) 3 kg m s⁻¹ at t = 0" and "(c) −3 kg m s⁻¹ at t = 4 s" are the two impulses of part (b).
  answer_key: (a) In all the three intervals, acceleration and, therefore, force are zero. (b) 3 kg m s⁻¹ at t = 0; (c) −3 kg m s⁻¹ at t = 4 s.
  check: both

- id: ncert11-ex-4-17
  lvl: ncert-ex
  num: "XI 4.17"
  source: NCERT XI Physics · Ch 4 · Exercise 4.17
  kind: proof
  q: |-
    A nucleus is at rest in the laboratory frame of reference. Show that if it disintegrates into two smaller nuclei the products must move in opposite directions.
  hints: ["No external force acts on the nucleus during the disintegration, so what is conserved?", "What is the total momentum before?", "Two momentum vectors that add to zero must be related how?"]
  sol: |
    The nucleus is at rest, so its momentum before the disintegration is zero. The forces in the disintegration are internal (equal and opposite by the third law), so the total momentum is conserved: $\vec p_1 + \vec p_2 = 0$. Hence $\vec p_2 = -\vec p_1$: the two momenta are equal in magnitude and opposite in direction. Since momentum is mass times velocity and mass is positive, the two products move in opposite directions. Their speeds are inversely proportional to their masses, $v_1/v_2 = m_2/m_1$.
  answer_key: By momentum conservation principle, total final momentum is zero. Two momentum vectors cannot sum to a null momentum unless they are equal and opposite.
  check: ncert-key

- id: ncert11-ex-4-18
  lvl: ncert-ex
  num: "XI 4.18"
  source: NCERT XI Physics · Ch 4 · Exercise 4.18
  kind: num
  q: |-
    Two billiard balls each of mass 0.05 kg moving in opposite directions with speed 6 m s$^{-1}$ collide and rebound with the same speed. What is the impulse imparted to each ball due to the other ?
  ask: Magnitude of impulse
  unit: kg m s⁻¹
  ans: 0.6
  tol: 0.005
  verify: 0.05*(6+6)
  sol: |
    Take the initial direction of one ball as positive. Its momentum changes from $+0.05 \times 6 = +0.30$ to $-0.30$ kg m s$^{-1}$, so the impulse on it is $-0.60$ kg m s$^{-1}$, that is, magnitude $0.05 \times 12 = 0.6$ kg m s$^{-1}$. The other ball gets an impulse of the same size in the opposite direction ($+0.6$), as the third law requires.
  answer_key: Impulse on each ball = 0.05 × 12 = 0.6 kg m s⁻¹ in magnitude. The two impulses are opposite in direction.
  check: both

- id: ncert11-ex-4-19
  lvl: ncert-ex
  num: "XI 4.19"
  source: NCERT XI Physics · Ch 4 · Exercise 4.19
  kind: num
  q: |-
    A shell of mass 0.020 kg is fired by a gun of mass 100 kg. If the muzzle speed of the shell is 80 m s$^{-1}$, what is the recoil speed of the gun ?
  ask: Recoil speed of the gun
  unit: cm s⁻¹
  ans: 1.6
  tol: 0.01
  verify: 0.020*80/100*100
  sol: |
    Gun and shell start at rest, so the total momentum is zero both before and after the firing: $100\,v + 0.020 \times 80 = 0$ in magnitude, $v = 0.020 \times 80/100 = 0.016$ m s$^{-1}$ $= 1.6$ cm s$^{-1}$, opposite to the shell's motion.
  answer_key: Use momentum conservation: 100 v = 0.02 × 80, v = 0.016 m s⁻¹ = 1.6 cm s⁻¹
  check: both

- id: ncert11-ex-4-20
  lvl: ncert-ex
  num: "XI 4.20"
  source: NCERT XI Physics · Ch 4 · Exercise 4.20
  kind: num
  q: |-
    A batsman deflects a ball by an angle of 45° without changing its initial speed which is equal to 54 km/h. What is the impulse imparted to the ball ? (Mass of the ball is 0.15 kg.)
  ask: Magnitude of impulse (as the answer key obtains it)
  unit: kg m s⁻¹
  ans: 4.2
  tol: 0.05
  verify: 2*0.15*15*cos(rad(22.5))
  sol: |
    $54$ km/h $= 15$ m s$^{-1}$. The speed is unchanged, so the initial and final momenta have the same magnitude $p = 0.15 \times 15 = 2.25$ kg m s$^{-1}$. The impulse is the change of the momentum vector, $\vec J = \vec p_f - \vec p_i$, directed along the bisector of the final direction and the reverse of the initial direction.

    If $\varphi$ is the angle between the final momentum and the *reversed* initial momentum, $J = 2p\cos(\varphi/2)$. With $\varphi = 45^\circ$: $J = 2 \times 2.25 \times \cos 22.5^\circ = 4.2$ kg m s$^{-1}$, the printed answer.

    [Note] The wording "deflects ... by an angle of 45°" is ambiguous. The answer key reads it as the angle between the outgoing path and the line back along the incoming path, so that the ball is turned through $135^\circ$. If the deflection is taken in the usual sense (the velocity vector turns through 45°), then $J = 2p\sin(45^\circ/2) = 2 \times 2.25 \times 0.383 = 1.7$ kg m s$^{-1}$. We have followed the printed key.
  answer_key: Impulse is directed along the bisector of the initial and final directions. Its magnitude is 0.15 × 2 × 15 × cos 22.5° = 4.2 kg m s⁻¹
  check: both

