- id: f2
  lvl: found
  kind: num
  q: |-
    A 0.5 kg ball hits a floor at 8 m s$^{-1}$ and rebounds vertically at 6 m s$^{-1}$. What is the impulse given to the ball by the floor? (Original problem.)
  ask: Impulse
  unit: N s
  ans: 7
  tol: 0.01
  verify: 0.5*(8+6)
  sol: |
    Take upward as positive. Initial velocity $-8$ m s$^{-1}$, final $+6$ m s$^{-1}$. Impulse $= m(v_f - v_i) = 0.5 \times (6 - (-8)) = 7$ N s, upward. The speeds add because the direction reverses.
