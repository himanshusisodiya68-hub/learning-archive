- id: f3
  lvl: found
  kind: num
  q: A force of 10 N acts on a block at $60^\circ$ above the horizontal, and the block moves 4 m along the horizontal floor. Find the work done by this force. (Original problem.)
  ask: Work done
  unit: J
  ans: 20
  tol: 0.1
  verify: 10*4*cos(rad(60))
  sol: |
    Only the component of the force along the displacement does work:
    $$W = Fs\cos\theta = 10\times4\times\cos60^\circ = 40\times0.5 = 20\ \text{J}.$$
