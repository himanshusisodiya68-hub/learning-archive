- id: b1
  lvl: board
  kind: num
  q: A boy pulls a sled with a rope that makes $30^\circ$ with the horizontal ground. The tension in the rope is 80 N and the sled moves 25 m. How much work does the rope do on the sled? (Original problem.)
  ask: Work done by the rope
  unit: J
  ans: 1732
  tol: 1
  verify: 80*25*cos(rad(30))
  sol: |
    $$W = T\,s\cos30^\circ = 80\times25\times0.866 = 1732\ \text{J}\ (\approx 1.73\ \text{kJ}).$$
  check: code

- id: b2
  lvl: board
  kind: num
  q: A labourer lifts a 12 kg bag of rice slowly through 1.5 m. Find the work done by gravity on the bag, and state its sign. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Work done by gravity
  unit: J
  ans: -176.4
  tol: 0.5
  verify: -12*9.8*1.5
  sol: |
    Gravity acts downward and the bag moves up, so the work is negative:
    $$W_g = -mgh = -12\times9.8\times1.5 = -176.4\ \text{J}.$$
    The labourer does $+176.4$ J on the bag, so the net work is zero and the bag gains no kinetic energy (it moves slowly).
  check: code

- id: b3
  lvl: board
  kind: num
  q: A force on an object rises uniformly from 0 to 30 N over the first 0.6 m of displacement, then stays constant at 30 N for the next 0.4 m. Find the total work done over the 1.0 m. (Original problem.)
  ask: Total work done
  unit: J
  ans: 21
  tol: 0.1
  verify: 0.5*0.6*30+30*0.4
  sol: |
    Work is the area under the force-displacement graph. The graph is a triangle then a rectangle:
    $$W = \tfrac12(0.6)(30) + (30)(0.4) = 9 + 12 = 21\ \text{J}.$$
  check: code

- id: b4
  lvl: board
  kind: text
  q: A crate rests on the flat bed of a truck that is speeding up along a straight road, and the crate does not slip. Does friction do positive, negative or zero work on the crate, as seen from the road? Explain. (Original problem.)
  sol: |
    **Positive.** The only horizontal force on the crate is static friction from the truck bed. The crate speeds up with the truck, so its acceleration, and therefore the friction force, points forward, in the direction of the crate's displacement (as seen from the road). Force and displacement are parallel, so the work is positive, and it equals the gain in the crate's kinetic energy. So friction does not always do negative work.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A particle moves from the point (1, 2, 0) m to the point (4, −2, 3) m under a constant force $\mathbf F = (2\hat i - \hat j + 4\hat k)$ N. Find the work done by the force. (Original problem.)
  ask: Work done
  unit: J
  ans: 22
  tol: 0.1
  verify: 2*(4-1)+(-1)*(-2-2)+4*(3-0)
  sol: |
    The displacement is $\mathbf d = (4-1,\,-2-2,\,3-0) = (3,-4,3)$ m. Then
    $$W = \mathbf F\cdot\mathbf d = 2(3) + (-1)(-4) + 4(3) = 6 + 4 + 12 = 22\ \text{J}.$$
    For a constant force only the end points matter, not the path taken.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A force $F(x) = (3x^2 + 2)$ N, with $x$ in metres, acts on a particle moving along the x-axis. Find the work done as the particle moves from $x = 1$ m to $x = 3$ m. (Original problem.)
  ask: Work done
  unit: J
  ans: 30
  tol: 0.1
  verify: (27+6)-(1+2)
  sol: |
    For a variable force, $W = \int_{x_i}^{x_f}F\,dx$:
    $$W = \int_1^3(3x^2+2)\,dx = \Big[x^3 + 2x\Big]_1^3 = (27+6) - (1+2) = 30\ \text{J}.$$
  check: code

- id: m3
  lvl: main
  kind: num
  q: A 2 kg block slides 4 m down a rough incline of angle $30^\circ$. The coefficient of kinetic friction is 0.2. Find the work done by friction on the block. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Work done by friction
  unit: J
  ans: -13.58
  tol: 0.05
  verify: -0.2*2*9.8*cos(rad(30))*4
  sol: |
    The normal force is $N = mg\cos30^\circ$, so the kinetic friction is
    $$f = \mu mg\cos30^\circ = 0.2\times2\times9.8\times0.866 = 3.395\ \text{N},$$
    directed up the incline, opposite to the 4 m displacement. Hence
    $$W_f = -f\,s = -3.395\times4 = -13.6\ \text{J}.$$
    For comparison, gravity does $+mg\sin30^\circ\times4 = +39.2$ J, so the net work is $+25.6$ J.
  check: code

- id: m4
  lvl: main
  kind: text
  q: A student says, "The normal force never does work." Give a situation where the normal force on an object does non-zero work, and say whether it is positive or negative. (Original problem.)
  sol: |
    The student is right only when the surface is at rest and the object slides along it, since then the normal force is perpendicular to the displacement. In general it is wrong.

    **Example.** A person stands in a lift that is accelerating upward. The normal force from the floor on the person is upward, and the person moves upward, so this force does **positive** work: it is what raises the person's kinetic and potential energy. When the lift decelerates while moving up, the normal force (now smaller than $mg$) still points up but the person's speed falls, so it still does positive work while gravity does a larger negative amount. If the lift moves down, the normal force does negative work.

    Another case: a block on a wedge that is pushed sideways, so that the wedge's normal force on the block has a component along the block's displacement.
  check: none
