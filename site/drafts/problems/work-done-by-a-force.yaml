- id: f2
  lvl: found
  kind: mcq
  q: A porter carries a 20 kg suitcase at constant speed along a level platform. The work done on the suitcase by the porter's upward supporting force is (Original problem.)
  opts: ["positive", "negative", "zero", "positive only if he walks faster"]
  ans: 2
  sol: |
    **Zero.** The supporting force is vertical, the suitcase moves horizontally, so the angle between force and displacement is $90^\circ$ and $\cos 90^\circ = 0$. Speed does not matter as long as the motion stays horizontal.
