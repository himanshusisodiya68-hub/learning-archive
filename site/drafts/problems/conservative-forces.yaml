  q: Which of the following forces is NOT conservative? (Original problem.)
  opts: ["the weight of a body near the Earth's surface", "the force of a stretched ideal spring", "kinetic friction between two surfaces", "the electrostatic force between two fixed charges"]
  ans: 2
  sol: |
    **Kinetic friction.** The work it does depends on the path (a longer path means more negative work), and the work around a closed loop is not zero. The other three forces have a potential energy function, so the work they do depends only on the end points.
