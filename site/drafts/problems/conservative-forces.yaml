- id: b2
  lvl: board
  kind: num
  q: A pendulum bob on a string 1.0 m long is released from rest when the string makes $60^\circ$ with the vertical. Find the speed of the bob at the lowest point. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Speed at the lowest point
  unit: m/s
  ans: 3.13
  tol: 0.02
  verify: sqrt(2*9.8*1.0*(1-cos(rad(60))))
  sol: |
    The bob is lower at the bottom by $h = L(1-\cos60^\circ) = 1.0\times0.5 = 0.50$ m. The tension does no work, so
    $$v = \sqrt{2gh} = \sqrt{2\times9.8\times0.50} = 3.13\ \text{m s}^{-1}.$$
  check: code

- id: b3
  lvl: board
  kind: num
  q: A roller-coaster car is released from rest at a point 25 m above the ground on a frictionless track. What is its speed at a point 5 m above the ground? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Speed at the 5 m point
  unit: m/s
  ans: 19.8
  tol: 0.1
  verify: sqrt(2*9.8*(25-5))
  sol: |
    Only the height *difference* matters: $h = 25 - 5 = 20$ m. Then
    $$v = \sqrt{2gh} = \sqrt{2\times9.8\times20} = 19.8\ \text{m s}^{-1}.$$
    The shape of the track, and the mass of the car, are irrelevant when friction is negligible.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A 2 kg block slides from rest down a rough incline whose top is 3.0 m above its bottom, and it reaches the bottom with a speed of 6.0 m/s. How much work does friction do on it? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Work done by friction
  unit: J
  ans: -22.8
  tol: 0.1
  verify: 0.5*2*6**2-2*9.8*3
  sol: |
    Gravity gives $W_g = mgh = 2\times9.8\times3.0 = 58.8$ J (a conservative force, depends only on height). The kinetic energy gained is $\tfrac12(2)(6)^2 = 36$ J. With $\Delta K = W_g + W_f$,
    $$W_f = 36 - 58.8 = -22.8\ \text{J}.$$
    So 22.8 J of mechanical energy became thermal energy; $\Delta E_{\text{mech}} = W_{nc} = -22.8$ J.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A small ball is attached to a light string of length 0.80 m and moves in a vertical circle. What is the minimum speed it must have at the lowest point to just complete the circle with the string remaining taut? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Minimum speed at the bottom
  unit: m/s
  ans: 6.26
  tol: 0.02
  verify: sqrt(5*9.8*0.80)
  sol: |
    At the top, the string is just taut when the tension is zero and gravity alone gives the centripetal force: $mg = mv_T^2/L$, so $v_T^2 = gL$.

    Energy conservation from bottom to top (rise $2L$): $\tfrac12mv_B^2 = \tfrac12mv_T^2 + mg(2L)$, giving
    $$v_B^2 = gL + 4gL = 5gL,\qquad v_B = \sqrt{5\times9.8\times0.80} = 6.26\ \text{m s}^{-1}.$$
  check: code

- id: m3
  lvl: main
  kind: num
  q: A 1.0 kg block is released from rest 0.50 m above the free end of a vertical spring of force constant 400 N/m, which stands on the floor. Find the maximum compression of the spring. Take $g = 9.8\ \text{m s}^{-2}$ and ignore friction. (Original problem.)
  ask: Maximum compression
  unit: m
  ans: 0.183
  tol: 0.001
  verify: (9.8+sqrt(9.8**2+4*200*9.8*0.5))/400
  sol: |
    The block falls $0.50 + x$ in total before it momentarily stops at the maximum compression $x$. Energy conservation (gravity and spring, both conservative):
    $$mg(0.50 + x) = \tfrac12kx^2$$
    $$200x^2 - 9.8x - 4.9 = 0.$$
    Taking the positive root,
    $$x = \frac{9.8 + \sqrt{9.8^2 + 4(200)(4.9)}}{400} = \frac{9.8 + 63.4}{400} = 0.183\ \text{m}.$$
    Note that the block falls an extra $x$ while the spring is compressing, so ignoring that term (using $x = \sqrt{2mgh/k} = 0.157$ m) would underestimate the compression by about 15%.
  check: code

- id: m4
  lvl: main
  kind: num
  q: A 1.0 kg block is pushed slowly once around a square loop of side 1.0 m on a rough horizontal table, with coefficient of kinetic friction 0.20. Find the work done by friction in one complete loop and decide whether friction is conservative. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Work done by friction around the loop
  unit: J
  ans: -7.84
  tol: 0.02
  verify: -0.2*1*9.8*4
  sol: |
    Friction has magnitude $\mu mg = 0.20\times1.0\times9.8 = 1.96$ N and always opposes the motion. Around the loop (path length 4.0 m),
    $$W_f = -1.96\times4.0 = -7.84\ \text{J}.$$
    The block returns to its starting point, yet the work is not zero. For a conservative force the work around any closed path is zero, so **friction is not conservative**: the work depends on the path length, and no potential energy can be defined for it.
  check: code
