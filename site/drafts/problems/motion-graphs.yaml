- id: f3
  lvl: found
  kind: num
  q: The velocity-time graph of a car is a straight line from (0 s, 0 m/s) to (10 s, 20 m/s). Find the distance covered in these 10 s using the graph. (Original problem.)
  ask: Distance covered
  unit: m
  ans: 100
  tol: 0.05
  verify: 0.5*10*20
  sol: |
    The distance is the area under the line, a triangle with base 10 s and height 20 m/s: $\tfrac12\times10\times20 = 100$ m.

    The slope of the line is the acceleration, $20/10 = 2$ m s$^{-2}$.
  check: code

- id: b1
  lvl: board
  kind: num
  q: A car speeds up uniformly from rest to 12 m/s in 6 s, moves at 12 m/s for the next 10 s, and then slows down uniformly to rest in 4 s. Draw its velocity-time graph and find the total distance travelled. (Original problem.)
  ask: Total distance travelled
  unit: m
  ans: 180
  tol: 0.1
  verify: 0.5*6*12+12*10+0.5*4*12
  sol: |
    The graph is a trapezium: a rising line from $(0, 0)$ to $(6, 12)$, a flat line to $(16, 12)$, and a falling line to $(20, 0)$.

    - Speeding up: $\tfrac12\times6\times12 = 36$ m
    - Constant velocity: $12\times10 = 120$ m
    - Slowing down: $\tfrac12\times4\times12 = 24$ m

    Total $= 36 + 120 + 24 = 180$ m. (Check with the trapezium formula: $\tfrac12(20 + 10)\times12 = 180$ m.)
  check: code

- id: b2
  lvl: board
  kind: num
  q: On a position-time graph an object goes in a straight line from x = 0 at t = 0 to x = 20 m at t = 5 s, stays at rest until t = 8 s, then returns to x = 0 at t = 12 s. Find its average speed over the 12 s. (Original problem.)
  ask: Average speed
  unit: m/s
  ans: 3.333
  tol: 0.005
  verify: (20+20)/12
  sol: |
    The slopes of the three parts give the velocities: $+20/5 = +4$ m/s (0 to 5 s), 0 (5 to 8 s), and $-20/4 = -5$ m/s (8 to 12 s).

    Total distance $= 20 + 0 + 20 = 40$ m, so average speed $= 40/12 = 3.33$ m/s.

    The object ends where it started, so its displacement is zero and its average velocity is zero.
