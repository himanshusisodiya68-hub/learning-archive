- id: m1
  lvl: main
  kind: num
  q: A car A starts from rest at t = 0 and speeds up uniformly at 2 m/s². At the same instant it is passed by a car B that moves at a constant 10 m/s along the same straight road. At what time does A catch up with B? Use areas under the velocity-time graphs. (Original problem.)
  ask: Time at which A catches B
  unit: s
  ans: 10
  tol: 0.01
  verify: 2*10/2
  sol: |
    A catches B when the two have covered the same distance, that is, when the areas under their velocity-time graphs are equal.

    Car B: a horizontal line at 10 m/s, area $= 10t$. Car A: a line $v = 2t$, whose area up to time $t$ is the triangle $\tfrac12\times t\times2t = t^2$.

    Setting $t^2 = 10t$ gives $t = 10$ s (the root $t = 0$ is the start). At that time each has gone 100 m, and A's speed is 20 m/s, twice that of B, so A passes B.

    On the graph, the lines cross at $t = 5$ s (when $2t = 10$): this is when the two have the same speed and the gap between them is largest (25 m), not when A catches up.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A particle moving in a straight line has a velocity-time graph that is a triangle. The velocity rises uniformly from zero to a maximum in 8 s and then falls uniformly to zero in 12 s. The total distance covered is 200 m. Find the maximum velocity. (Original problem.)
  ask: Maximum velocity
  unit: m/s
  ans: 20
  tol: 0.02
  verify: 2*200/(8+12)
  sol: |
    The area of the triangle is the distance: $\tfrac12\times(\text{base})\times(\text{height})$, with base $8 + 12 = 20$ s and height $v_{max}$.

    $200 = \tfrac12\times20\times v_{max}$, so $v_{max} = 20$ m/s.

    Accelerations: $20/8 = 2.5$ m s$^{-2}$ in the first part and $-20/12 = -1.67$ m s$^{-2}$ in the second.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A particle starts from rest on a straight line. Its acceleration is +4 m/s² for the first 3 s, zero for the next 5 s, and −6 m/s² until it stops. Find the total distance it travels. (Original problem.)
  ask: Total distance
  unit: m
  ans: 90
  tol: 0.1
  verify: 0.5*4*9+12*5+12*12/(2*6)
  sol: |
    Turn the acceleration-time information into a velocity-time graph.

    - **0 to 3 s:** $v = 4t$, reaching $12$ m/s. Distance $= \tfrac12\times3\times12 = 18$ m.
    - **3 to 8 s:** constant $12$ m/s. Distance $= 12\times5 = 60$ m.
    - **From 8 s:** $a = -6$ m/s², so it stops after $12/6 = 2$ s (at $t = 10$ s). Distance $= \tfrac12\times2\times12 = 12$ m.

    Total $= 18 + 60 + 12 = 90$ m. The graph is a trapezium with parallel sides 10 s and 5 s and height 12 m/s: $\tfrac12(10+5)\times12 = 90$ m.
  check: code
