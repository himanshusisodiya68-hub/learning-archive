- id: b3
  lvl: board
  kind: num
  q: The velocity-time graph of a ball thrown vertically upwards at 14.7 m/s is a straight line of slope −9.8 m/s² (upward taken positive). Use the area under the graph above the time axis to find the maximum height reached. (Original problem.)
  ask: Maximum height
  unit: m
  ans: 11.025
  tol: 0.01
  verify: 0.5*(14.7/9.8)*14.7
  sol: |
    The line starts at $(0, 14.7)$ and falls to zero velocity when $t = 14.7/9.8 = 1.5$ s. The ball rises while the line is above the axis, and the area of that triangle is the height: $\tfrac12\times1.5\times14.7 = 11.0$ m.

    After 1.5 s the line goes below the axis (velocity downward) and the area below the axis counts as downward displacement. At $t = 3$ s the two areas are equal and cancel, so the ball is back at the starting height.
