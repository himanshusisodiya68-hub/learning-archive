- id: cs
  name: Computer Science
  what: 'Computer science asks what can be computed and how to do it well. A computer is a machine that follows very simple instructions extremely fast; everything from a calculator to Instagram is built by stacking simple ideas into layers, each hiding the details of the one below.


    The same few ideas (represent the data, choose a structure, follow an algorithm, trade time against space, split big problems into small ones) appear at every layer, from a single function to a system serving a billion people.'
  split: 'Bottom-up, the way the layers are built: how the machine thinks, how we instruct it, how we organise data and procedures, how one machine shares itself, how machines talk, how data is stored at scale, how software and products are built, how big systems are designed and run, and how machines learn. Levels follow the career ladder: Foundations, SDE-1, SDE-2, SDE-3.'
  links: <b>How the pillars connect.</b> Data structures and algorithms are the core every other pillar reuses. Operating systems and networks are where they meet hardware. Databases and system design are the same structures (hash tables, trees, logs) spread across many machines. AI is algorithms that learn from data.
  pillars:
  - id: how-computers-work
    name: How computers work
    tag: Bits, logic and the machine that runs your code.
    what: Everything a computer stores is a pattern of bits, and everything it does is built from a few logic operations. Understanding this layer removes the magic from every layer above.
    split: Represent information, then compute with logic, then the machine that executes programs.
    branches:
    - id: information
      name: Representing information
      tag: Binary, numbers, text and images as bits.
      leaves:
      - {id: bits-and-binary, name: 'Bits and binary', from: BEG}
      - {id: numbers-in-a-computer, name: 'How computers store numbers', from: BEG}
      - {id: text-images-sound, name: 'Text, images and sound as bits', from: BEG}
    - id: machine
      name: The machine
      tag: Logic gates, the CPU and memory.
      leaves:
      - {id: logic-gates, name: 'Logic gates and Boolean algebra', from: BEG}
      - {id: cpu-and-instructions, name: 'How a CPU runs a program', from: INT}
      - {id: memory-hierarchy, name: 'Memory hierarchy and caches', from: INT}
  - id: programming
    name: Programming fundamentals
    tag: The ideas every language shares.
    what: All programming languages express the same handful of ideas - values, names, decisions, repetition, functions and data. Learn them once and every language is a new spelling of the same thoughts. We use Python to learn (closest to plain English) and JavaScript/TypeScript for the web.
    split: Core ideas, then organising programs, then languages and tools.
    branches:
    - id: core-ideas
      name: Core ideas
      tag: Values, variables, decisions, loops and functions.
      leaves:
      - {id: values-and-types, name: 'Values and types', from: BEG}
      - {id: variables-and-memory, name: 'Variables and memory', from: BEG}
      - {id: control-flow, name: 'Decisions and loops', from: BEG}
      - {id: functions, name: 'Functions', from: BEG}
      - {id: recursion, name: 'Recursion', from: INT}
    - id: organising-programs
      name: Organising programs
      tag: Collections, objects, errors and modules.
      leaves:
      - {id: collections, name: 'Lists, dictionaries and sets', from: BEG}
      - {id: objects-and-classes, name: 'Objects and classes', from: INT}
      - {id: errors-and-testing, name: 'Errors and testing', from: INT}
      - {id: functional-ideas, name: 'Functional programming ideas', from: INT}
    - id: languages
      name: Languages and tools
      tag: How languages differ, compile and run.
      leaves:
      - {id: language-landscape, name: 'The language landscape (Python, JavaScript, Java, C++, Go)', from: BEG}
      - {id: compilers-and-interpreters, name: 'Compilers and interpreters', from: INT}
      - {id: git-and-the-command-line, name: 'Git and the command line', from: BEG}
  - id: data-structures
    name: Data structures
    tag: Ways to organise data so the right questions are fast.
    what: A data structure is a way to arrange data so that some operations are fast. Every structure is a trade-off - fast lookup costs memory, fast insertion costs order. Choosing well is most of engineering.
    split: Linear structures, then key-based lookup, then hierarchies, then networks, then probabilistic tricks.
    branches:
    - id: linear
      name: Linear structures
      tag: Arrays, linked lists, stacks and queues.
      leaves:
      - {id: arrays, name: 'Arrays and dynamic arrays', from: BEG}
      - {id: linked-lists, name: 'Linked lists', from: INT}
      - {id: stacks-and-queues, name: 'Stacks and queues', from: INT}
    - id: lookup
      name: Fast lookup
      tag: Hash tables and probabilistic structures.
      leaves:
      - {id: hash-tables, name: 'Hash tables', from: INT}
      - {id: bloom-filters, name: 'Bloom filters', from: ADV}
    - id: hierarchies
      name: Trees and heaps
      tag: Hierarchical data and priorities.
      leaves:
      - {id: trees, name: 'Trees and binary search trees', from: INT}
      - {id: balanced-trees-and-b-trees, name: 'Balanced trees and B-trees', from: ADV}
      - {id: heaps, name: 'Heaps and priority queues', from: INT}
      - {id: tries, name: 'Tries', from: ADV}
    - id: networks
      name: Graphs
      tag: Things connected to things.
      leaves:
      - {id: graphs, name: 'Graphs and their representations', from: INT}
  - id: algorithms
    name: Algorithms and problem solving
    tag: Step-by-step methods, and how to judge them.
    what: An algorithm is a precise recipe. We judge recipes by how their cost grows with the input, because a method that is fine for 100 items can be hopeless for a billion.
    split: Measuring cost, then classic techniques, then problem-solving patterns.
    branches:
    - id: analysis
      name: Measuring algorithms
      tag: Big-O, time and space.
      leaves:
      - {id: big-o, name: 'Big-O and growth of cost', from: BEG}
    - id: techniques
      name: Classic techniques
      tag: Searching, sorting and paradigms.
      leaves:
      - {id: searching-and-binary-search, name: 'Searching and binary search', from: BEG}
      - {id: sorting, name: 'Sorting', from: INT}
      - {id: divide-and-conquer, name: 'Divide and conquer', from: INT}
      - {id: greedy, name: 'Greedy algorithms', from: INT}
      - {id: dynamic-programming, name: 'Dynamic programming', from: ADV}
      - {id: graph-algorithms, name: 'Graph algorithms: BFS, DFS, shortest paths', from: ADV}
    - id: patterns
      name: Problem-solving patterns
      tag: The moves behind most interview and real problems.
      leaves:
      - {id: two-pointers-and-sliding-window, name: 'Two pointers and sliding window', from: INT}
      - {id: problem-solving-method, name: 'A method for any problem', from: BEG}
  - id: operating-systems
    name: Operating systems
    tag: How one machine shares itself among many programs.
    what: 'An operating system is the referee between programs and hardware. It decides who runs, who gets memory, and who may touch which file. Every app you write lives inside these decisions.'
    split: Running programs, then memory and storage, then doing many things at once.
    branches:
    - id: processes
      name: Running programs
      tag: Processes, threads and scheduling.
      leaves:
      - {id: processes-and-threads, name: 'Processes and threads', from: INT}
      - {id: scheduling, name: 'CPU scheduling', from: INT}
      - {id: concurrency, name: 'Concurrency and locks', from: ADV}
    - id: memory-and-storage
      name: Memory and storage
      tag: Virtual memory and file systems.
      leaves:
      - {id: virtual-memory, name: 'Virtual memory', from: ADV}
      - {id: file-systems, name: 'File systems', from: INT}
  - id: networks
    name: Computer networks
    tag: How machines talk, and how to keep the talk safe.
    what: 'A network is a stack of agreements: how to push bits down a wire, how to find a machine, how to deliver a message reliably, and what the message means. The internet is these layers working together.'
    split: The big picture, then the layers bottom-up, then security.
    branches:
    - id: networking
      name: How the internet works
      tag: From a cable to a web page.
      leaves:
      - {id: how-the-internet-works, name: 'How the internet works', from: BEG}
      - {id: tcp-ip, name: 'TCP/IP and the layers', from: INT}
      - {id: dns-and-http, name: 'DNS and HTTP', from: INT}
      - {id: cdns-and-latency, name: 'CDNs and latency', from: ADV}
    - id: security
      name: Security and cryptography
      tag: Secrets, signatures and trust.
      leaves:
      - {id: cryptography-basics, name: 'Hashing, encryption and signatures', from: INT}
      - {id: authentication, name: 'Passwords, sessions and OAuth', from: INT}
      - {id: web-security, name: 'Common attacks and defences', from: ADV}
  - id: data-systems
    name: Data and databases
    tag: Storing data reliably, from one disk to many data centres.
    what: Data outlives code. Databases are data structures (logs, hash indexes, B-trees) made durable, shared and spread across machines - the subject of Designing Data-Intensive Applications.
    split: One database, then many machines, then data in motion.
    branches:
    - id: databases
      name: Databases
      tag: Relational model, SQL, indexes and transactions.
      leaves:
      - {id: relational-model-and-sql, name: 'Relational model and SQL', from: BEG}
      - {id: indexes, name: 'Indexes: hash, B-tree and LSM-tree', from: INT}
      - {id: transactions, name: 'Transactions and isolation', from: ADV}
      - {id: nosql-and-data-models, name: 'Document, key-value and graph models', from: INT}
    - id: distributed-data
      name: Distributed data
      tag: Replication, partitioning and consistency.
      leaves:
      - {id: replication, name: 'Replication', from: ADV}
      - {id: partitioning, name: 'Partitioning and sharding', from: ADV}
      - {id: consistency-and-consensus, name: 'Consistency and consensus', from: SDE}
    - id: data-in-motion
      name: Data in motion
      tag: Batch and stream processing.
      leaves:
      - {id: batch-and-stream, name: 'Batch and stream processing', from: ADV}
  - id: software-engineering
    name: Building software
    tag: Turning code into products people rely on.
    what: Real software is written by teams, changes for years and must not break. Engineering is the set of habits that make that possible.
    split: Design the code, then the interfaces, then the front and back ends.
    branches:
    - id: design
      name: Software design
      tag: Clean code, principles and patterns.
      leaves:
      - {id: clean-code, name: 'Clean code and abstraction', from: INT}
      - {id: design-principles-and-patterns, name: 'Design principles and patterns', from: ADV}
  - id: web-and-apps
    name: Web and app development
    tag: Building what users actually see and tap.
    what: 'Every product is a front end (what the user sees and taps) talking to a back end (servers and databases that hold the truth) through an API. Websites and mobile apps share this shape; only the front end changes.'
    split: Front end, then back end, then mobile, then putting it all together.
    branches:
    - id: frontend
      name: Front end
      tag: HTML, CSS, JavaScript and frameworks.
      leaves:
      - {id: html-css, name: 'HTML and CSS: structure and style', from: BEG}
      - {id: javascript-in-the-browser, name: 'JavaScript in the browser', from: BEG}
      - {id: frontend-frameworks, name: 'Components and frameworks (React)', from: INT}
      - {id: web-performance-and-accessibility, name: 'Performance and accessibility', from: ADV}
    - id: backend
      name: Back end
      tag: Servers, APIs, authentication and data.
      leaves:
      - {id: apis, name: 'APIs (REST and beyond)', from: INT}
      - {id: backend, name: 'Servers and back ends', from: INT}
      - {id: app-databases, name: 'Using a database from an app', from: INT}
    - id: mobile
      name: Mobile apps
      tag: Native and cross-platform apps.
      leaves:
      - {id: how-mobile-apps-work, name: 'How mobile apps work', from: BEG}
      - {id: cross-platform-apps, name: 'Native vs cross-platform (React Native, Flutter)', from: INT}
    - id: full-stack
      name: Full stack
      tag: From an idea to a product people use.
      leaves:
      - {id: full-stack-project, name: 'Building a full-stack app end to end', from: ADV}
  - id: system-design
    name: System design and architecture
    tag: Designing systems for millions of users.
    what: At scale, the problem is no longer one algorithm but many machines that fail, disagree and wait for each other. System design is choosing structures and trade-offs so the whole stays fast and reliable.
    split: Building blocks, then trade-offs, then real case studies.
    branches:
    - id: building-blocks
      name: Building blocks
      tag: Load balancers, caches, queues and services.
      leaves:
      - {id: scalability, name: 'Scaling up and scaling out', from: INT}
      - {id: caching, name: 'Caching', from: INT}
      - {id: load-balancing, name: 'Load balancing', from: INT}
      - {id: message-queues, name: 'Message queues and events', from: ADV}
      - {id: microservices, name: 'Monoliths and microservices', from: ADV}
    - id: case-studies
      name: Case studies
      tag: How real systems are built.
      leaves:
      - {id: design-url-shortener, name: 'Designing a URL shortener', from: ADV}
      - {id: design-username-check, name: 'Checking a username among a billion', from: ADV}
      - {id: design-news-feed, name: 'Designing a news feed', from: SDE}
      - {id: reliability-and-sre, name: 'Reliability, failures and on-call', from: SDE}
  - id: cloud-devops
    name: Cloud and DevOps
    tag: Where software runs, and how it gets there.
    what: Code is useless until it runs somewhere reliably. Cloud and DevOps are how software is packaged, shipped, scaled and watched.
    split: The machine (Linux), then packaging, then the cloud, then shipping and watching.
    branches:
    - id: running-software
      name: Running software
      tag: Linux, containers, cloud and CI/CD.
      leaves:
      - {id: linux-and-shell, name: 'Linux and the shell', from: BEG}
      - {id: containers, name: 'Containers and Docker', from: INT}
      - {id: kubernetes, name: 'Orchestration and Kubernetes', from: ADV}
      - {id: cloud-basics, name: 'The cloud: compute, storage, networking', from: INT}
      - {id: ci-cd, name: 'CI/CD and deployment', from: INT}
      - {id: observability, name: 'Logs, metrics and tracing', from: ADV}
  - id: ai
    name: AI and machine learning
    tag: Programs that learn from data.
    what: Instead of writing rules, we show a program examples and let it adjust millions of numbers until its answers are good. That one idea, learning by reducing error, powers everything from spam filters to large language models.
    split: What learning means, then classic models, then neural networks, then LLMs and using AI well.
    branches:
    - id: learning-basics
      name: Learning from data
      tag: Regression, classification and gradient descent.
      leaves:
      - {id: what-is-learning, name: 'What it means for a machine to learn', from: BEG}
      - {id: linear-regression, name: 'Linear regression and gradient descent', from: INT}
      - {id: classification, name: 'Classification and evaluation', from: INT}
    - id: deep-learning
      name: Deep learning
      tag: Neural networks to transformers.
      leaves:
      - {id: neural-networks, name: 'Neural networks', from: ADV}
      - {id: transformers-and-llms, name: 'Transformers and large language models', from: ADV}
      - {id: using-ai-well, name: 'Using AI tools well (prompts, agents, limits)', from: BEG}
  - id: competitive-programming
    name: Competitive programming
    tag: 'Contest problems, solved by recognising the pattern.'
    what: 'Experts are fast because they have seen the problem before, in disguise. This pillar catalogues the patterns behind most contest problems; each lesson is one idea, with the family of problems it solves and the clues that reveal it.'
    split: 'Read the constraints, then the pattern families from simplest to deepest, then contest craft.'
    branches:
    - id: cp-foundations
      name: Constraints and complexity
      tag: 'What the input size tells you about the solution.'
      leaves:
      - {id: cp-reading-constraints, name: 'Reading constraints: n tells you the algorithm', from: INT}
      - {id: cp-prefix-sums, name: 'Prefix sums and difference arrays', from: INT}
      - {id: cp-binary-search-on-answer, name: 'Binary search on the answer', from: ADV}
    - id: cp-patterns
      name: Pattern families
      tag: 'Greedy, DP, graphs, maths, strings and range queries.'
