      leaves:
      - {id: expected-value, name: 'Expected value and decisions', from: LIFE}
      - {id: misleading-statistics, name: 'How statistics mislead', from: LIFE}
  - id: olympiad-toolkit
    name: Olympiad toolkit
    tag: Problem-solving techniques beyond the syllabus.
    what: 'Olympiad problems are not harder versions of textbook exercises. They test ways of thinking: find an invariant,
      consider the extreme case, count in two ways, use induction. This pillar collects those techniques, following books
      such as Zeitz and Engel.'
    split: Two classic fields where the techniques are used most.
    branches:
    - id: number-theory
      name: Number theory
      tag: Remainders and divisibility, made powerful.
      what: Modular arithmetic turns divisibility questions into calculations; Fermat's and Euler's theorems are its main
        tools.
      leaves:
      - id: modular-arithmetic
        name: Modular arithmetic
        from: OLY
      - id: fermat-and-euler-theorems
        name: Fermat and Euler theorems
        from: OLY
    - id: combinatorics
      name: Combinatorics
      tag: Counting and arrangement arguments.
      what: 'Pigeonhole, invariants, the extremal principle, induction and graph theory: arguments that prove something must
        happen without computing it.'
      leaves:
      - id: pigeonhole-principle
        name: Pigeonhole principle
        from: OLY
      - id: invariants
        name: Invariants
        from: OLY
      - id: induction
        name: Induction
        from: C11
      - id: graph-theory-basics
        name: Graph theory basics
        from: OLY
- id: chem
  name: Chemistry
  what: 'Chemistry asks why substances are what they are, and how one substance turns into another. Everything you touch is a few kinds of atoms joined in different patterns; change the pattern and you change the stuff: wood into ash, food into energy, sand into a phone screen.


    Physics tells you the rules for charges and energy; chemistry uses those rules to explain cooking, medicine, batteries, fuels and life itself.'
  split: First count and describe matter, then look inside the atom and at how atoms join, then ask which changes happen and how fast, then meet the families of elements, then carbon, the element of life, and finally chemistry in daily life.
  links: <b>How the pillars connect.</b> The atom's structure explains bonding; bonding explains properties; energy explains which reactions go; carbon chemistry is the same rules applied to one very flexible atom.
  pillars:
  - id: matter-and-measurement
    name: Matter and measurement
    tag: What stuff is made of, and how chemists count atoms.
    what: Before explaining matter we must describe it, separate it into pure substances, and count its particles. The mole lets us count atoms by weighing.
    split: Describe, then separate, then count.
    branches:
    - id: states-and-mixtures
      name: States and mixtures
      tag: Solids, liquids, gases; pure substances and how to separate mixtures.
      leaves:
      - {id: states-of-matter, name: 'States of matter', from: C6}
      - {id: mixtures-and-separation, name: 'Mixtures and their separation', from: C6}
      - {id: elements-compounds-mixtures, name: 'Elements, compounds and mixtures', from: C8}
    - id: counting-atoms
      name: Counting atoms
      tag: The mole, formulas and balanced equations.
      leaves:
      - {id: atoms-and-molecules, name: 'Atoms and molecules', from: C9}
      - {id: the-mole, name: 'The mole and molar mass', from: C11}
      - {id: stoichiometry, name: 'Stoichiometry and limiting reagent', from: C11}
      - {id: concentration, name: 'Concentration of solutions', from: C11}
  - id: atoms-and-bonding
    name: Atoms and bonding
    tag: Inside the atom, the periodic table, and why atoms stick together.
    what: All of chemistry follows from electrons arranged around a nucleus. Their arrangement explains the periodic table, and their sharing or transfer explains every bond.
    split: The atom, then its pattern across elements, then bonds and shapes.
    branches:
    - id: structure-of-atom
      name: Structure of the atom
      tag: Electrons, protons, neutrons and quantum shells.
      leaves:
      - {id: discovering-the-atom, name: 'Discovering the atom', from: C9}
      - {id: bohr-model, name: 'Bohr model and spectra', from: C11}
      - {id: quantum-model, name: 'Orbitals and quantum numbers', from: C11}
      - {id: electron-configuration, name: 'Electron configuration', from: C11}
    - id: periodic-table
      name: The periodic table
      tag: Why elements repeat their behaviour.
      leaves:
      - {id: periodic-classification, name: 'Periodic classification', from: C10}
      - {id: periodic-trends, name: 'Periodic trends', from: C11}
    - id: chemical-bonding
      name: Chemical bonding
      tag: Ionic, covalent and metallic bonds; molecular shapes.
      leaves:
      - {id: ionic-and-covalent-bonds, name: 'Ionic and covalent bonds', from: C10}
      - {id: vsepr-and-shapes, name: 'VSEPR and molecular shapes', from: C11}
      - {id: hybridisation, name: 'Hybridisation', from: C11}
      - {id: molecular-orbitals, name: 'Molecular orbital theory', from: C11}
      - {id: intermolecular-forces, name: 'Intermolecular forces and hydrogen bonds', from: C11}
  - id: energy-and-change
    name: Energy and change
    tag: Which reactions happen, how far, and how fast.
    what: A reaction goes if it lowers the free energy of the universe, stops at equilibrium, and takes as long as its slowest step. These three ideas, energy, equilibrium and rate, decide every chemical change.
    split: Describe reactions, then ask if they go (energy), how far (equilibrium), how fast (kinetics), and how to run them with electricity.
    branches:
    - id: reactions
      name: Chemical reactions
      tag: Types of reactions and redox.
      leaves:
      - {id: physical-and-chemical-changes, name: 'Physical and chemical changes', from: C7}
      - {id: chemical-reactions-and-equations, name: 'Chemical reactions and equations', from: C10}
      - {id: redox-reactions, name: 'Redox reactions', from: C11}
    - id: chemical-thermodynamics
      name: Chemical thermodynamics
      tag: Enthalpy, entropy and Gibbs energy.
      leaves:
      - {id: enthalpy, name: 'Enthalpy and Hess''s law', from: C11}
      - {id: entropy-and-gibbs, name: 'Entropy and Gibbs energy', from: C11}
    - id: equilibrium
      name: Equilibrium
      tag: Reactions that stop halfway, and acids and bases.
      leaves:
      - {id: chemical-equilibrium, name: 'Chemical equilibrium', from: C11}
      - {id: acids-bases-and-salts, name: 'Acids, bases and salts', from: C7}
      - {id: ionic-equilibrium, name: 'pH, buffers and ionic equilibrium', from: C11}
    - id: solutions-and-electrochemistry
      name: Solutions and electrochemistry
      tag: Dissolving, cells and batteries.
      leaves:
      - {id: solutions, name: 'Solutions and colligative properties', from: C12}
      - {id: electrochemistry, name: 'Electrochemical cells and batteries', from: C12}
    - id: kinetics
      name: Chemical kinetics
      tag: How fast reactions go, and why heat speeds them up.
      leaves:
      - {id: rate-laws, name: 'Rate laws and order', from: C12}
      - {id: activation-energy, name: 'Activation energy and catalysts', from: C12}
  - id: elements-and-families
    name: Elements and their families
    tag: Metals, non-metals and the blocks of the periodic table.
    what: Elements in the same group behave alike because their outer electrons match. Knowing the family tells you most of an element's chemistry.
    split: Metals and non-metals first, then each block of the table, then complexes of transition metals.
    branches:
    - id: metals-nonmetals
      name: Metals and non-metals
      tag: Properties, reactivity and extraction.
      leaves:
      - {id: metals-and-non-metals, name: 'Metals and non-metals', from: C7}
      - {id: extraction-of-metals, name: 'Extraction of metals', from: C10}
    - id: blocks
      name: The blocks
      tag: s, p, d and f block elements.
      leaves:
      - {id: s-block, name: 's-block elements', from: C11}
      - {id: p-block, name: 'p-block elements', from: C11}
      - {id: d-and-f-block, name: 'd- and f-block elements', from: C12}
      - {id: coordination-compounds, name: 'Coordination compounds', from: C12}
  - id: carbon-chemistry
    name: Carbon chemistry
    tag: The chemistry of life, fuels and plastics.
    what: Carbon forms four strong bonds and long chains, so it builds millions of compounds. Organic chemistry is learning a few reaction patterns that repeat across all of them.
    split: Basic principles, then hydrocarbons, then each functional group, then the molecules of life and of industry.
    branches:
    - id: organic-basics
      name: Organic basics
      tag: Naming, isomers and reaction mechanisms.
      leaves:
      - {id: carbon-and-its-compounds, name: 'Carbon and its compounds', from: C10}
      - {id: iupac-naming, name: 'Naming organic compounds', from: C11}
      - {id: isomerism, name: 'Isomerism', from: C11}
      - {id: electron-movement, name: 'Inductive, resonance and reaction mechanisms', from: C11}
    - id: functional-groups
      name: Functional groups
      tag: Hydrocarbons to amines.
      leaves:
      - {id: hydrocarbons, name: 'Hydrocarbons', from: C11}
      - {id: haloalkanes, name: 'Haloalkanes and haloarenes', from: C12}
      - {id: alcohols-phenols-ethers, name: 'Alcohols, phenols and ethers', from: C12}
      - {id: carbonyl-compounds, name: 'Aldehydes, ketones and carboxylic acids', from: C12}
      - {id: amines, name: 'Amines', from: C12}
    - id: molecules-of-life
      name: Molecules of life and industry
      tag: Biomolecules and polymers.
      leaves:
      - {id: biomolecules-chem, name: 'Biomolecules', from: C12}
      - {id: polymers, name: 'Polymers and plastics', from: C12}
  - id: chemistry-in-life
    name: Chemistry in daily life
    tag: Kitchen, medicine cabinet and environment.
    what: The same reactions run in your kitchen, your body and the atmosphere. This pillar applies the others to choices you make every day.
    split: Home, body, planet.
    branches:
    - id: everyday-chemistry
      name: Everyday chemistry
      tag: Soaps, food, medicines and fuels.
      leaves:
      - {id: soaps-and-detergents, name: 'Soaps and detergents', from: C10}
      - {id: food-and-cooking-chemistry, name: 'Food and cooking chemistry', from: LIFE}
      - {id: medicines-and-drugs, name: 'How medicines work', from: LIFE}
      - {id: fuels-and-combustion, name: 'Fuels and combustion', from: C8}
    - id: environmental-chemistry
      name: Environmental chemistry
      tag: Air, water and climate.
      leaves:
      - {id: air-and-water-pollution, name: 'Air and water pollution', from: C8}
      - {id: greenhouse-and-ozone, name: 'Greenhouse effect and ozone', from: LIFE}
- id: bio
  name: Biology
  what: 'Biology asks what makes something alive, and how living things work, grow, reproduce and change. Every living thing is made of cells, runs on chemistry, stores its instructions in DNA, and has been shaped by evolution.


    Understanding biology means understanding your own body, your food, your health, and the planet you live on.'
  split: Start with the cell, then the variety of life, then how plants and animals work, then how life is passed on, then life and human welfare, then life together in ecosystems.
  links: <b>How the pillars connect.</b> The cell is the unit of every pillar; DNA links reproduction to evolution; energy flows from photosynthesis through every food chain; evolution explains why the diversity pillar looks the way it does.
  pillars:
  - id: cells-and-molecules
    name: Cells and molecules
    tag: The unit of life and the molecules it runs on.
    what: Every living thing is one cell or many. A cell is a bag of chemistry that copies itself; understanding it explains every other pillar.
    split: Cell structure, then its molecules, then how it divides.
    branches:
    - id: the-cell
      name: The cell
      tag: Structure and organelles.
      leaves:
      - {id: cell-the-unit-of-life, name: 'Cell: the unit of life', from: C8}
      - {id: tissues, name: 'Tissues', from: C9}
      - {id: biomolecules, name: 'Biomolecules and enzymes', from: C11}
      - {id: cell-cycle-and-division, name: 'Cell cycle and cell division', from: C11}
  - id: diversity-of-life
    name: Diversity of life
    tag: Naming and grouping millions of species.
    what: There are millions of species. Classification groups them by shared ancestry, so knowing one member tells you a lot about the rest.
    split: Principles, then kingdoms, then plants and animals.
    branches:
    - id: classification
      name: Classification
      tag: The living world and its kingdoms.
      leaves:
      - {id: the-living-world, name: 'The living world', from: C11}
      - {id: biological-classification, name: 'Biological classification', from: C11}
      - {id: plant-kingdom, name: 'Plant kingdom', from: C11}
      - {id: animal-kingdom, name: 'Animal kingdom', from: C11}
  - id: how-plants-work
    name: How plants work
    tag: Structure, food-making and growth.
    what: Plants make their own food from light, water and air. Their structure, from roots to leaves, is designed around that one job.
    split: Structure, then energy, then growth.
    branches:
    - id: plant-structure
      name: Plant structure
      tag: Morphology and anatomy.
      leaves:
      - {id: morphology-of-flowering-plants, name: 'Morphology of flowering plants', from: C11}
      - {id: anatomy-of-flowering-plants, name: 'Anatomy of flowering plants', from: C11}
    - id: plant-physiology
      name: Plant physiology
      tag: Photosynthesis, respiration, transport and growth.
      leaves:
      - {id: photosynthesis, name: 'Photosynthesis', from: C7}
      - {id: respiration-in-plants, name: 'Respiration in plants', from: C11}
      - {id: plant-growth, name: 'Plant growth and development', from: C11}
  - id: human-body
    name: How the human body works
    tag: Organ systems, from food to thought.
    what: Your body is about 37 trillion cells cooperating. Organ systems deliver food and oxygen, remove waste, move you, and coordinate it all.
    split: Supply (food, air, blood), then waste, then movement, then control.
    branches:
    - id: life-processes
      name: Life processes
      tag: Nutrition, breathing, circulation and excretion.
      leaves:
      - {id: nutrition, name: 'Nutrition and digestion', from: C7}
      - {id: breathing, name: 'Breathing and exchange of gases', from: C11}
      - {id: circulation, name: 'Body fluids and circulation', from: C11}
      - {id: excretion, name: 'Excretion', from: C11}
    - id: movement-and-control
      name: Movement and control
      tag: Muscles, nerves and hormones.
      leaves:
      - {id: locomotion, name: 'Locomotion and movement', from: C11}
      - {id: neural-control, name: 'Neural control and coordination', from: C10}
      - {id: chemical-coordination, name: 'Hormones and chemical coordination', from: C10}
  - id: reproduction-and-heredity
    name: Reproduction and heredity
    tag: How life copies itself and changes over time.
    what: Living things make copies of themselves, and the copies differ slightly. Heredity explains the copying; variation plus selection explains evolution.
    split: Reproduction, then inheritance, then DNA, then evolution.
    branches:
    - id: reproduction
      name: Reproduction
      tag: In plants and humans.
      leaves:
      - {id: reproduction-in-plants, name: 'Sexual reproduction in flowering plants', from: C12}
      - {id: human-reproduction, name: 'Human reproduction', from: C12}
      - {id: reproductive-health, name: 'Reproductive health', from: C12}
    - id: genetics-and-evolution
      name: Genetics and evolution
      tag: Mendel, DNA and natural selection.
      leaves:
      - {id: inheritance-and-variation, name: 'Principles of inheritance and variation', from: C10}
      - {id: molecular-basis-of-inheritance, name: 'Molecular basis of inheritance', from: C12}
      - {id: evolution, name: 'Evolution', from: C12}
  - id: life-and-welfare
    name: Life and human welfare
    tag: Health, microbes and biotechnology.
    what: 'Biology becomes power when we use it: to fight disease, grow food and make medicines.'
    split: Health, then microbes, then biotechnology.
    branches:
    - id: health
      name: Health and biotechnology
      tag: Disease, microbes and gene technology.
      leaves:
      - {id: human-health-and-disease, name: 'Human health and disease', from: C12}
      - {id: microbes-in-human-welfare, name: 'Microbes in human welfare', from: C12}
