  - id: calculus
    name: Calculus
    tag: Instantaneous change and accumulation.
    what: 'Calculus answers two questions: how fast is something changing at this instant (the derivative), and how much has
      built up over time (the integral)? The fundamental theorem shows they are inverse operations. Physics, engineering and
      optimisation in machine learning all rest on it.'
    split: Rates of change first, then accumulation.
    branches:
    - id: differential
      name: Differential
      tag: Limits, derivatives and their uses.
      what: The limit makes "instantaneous" precise. Derivatives give slopes, rates, maxima and minima.
      leaves:
      - id: limits
        name: Limits
        from: C11
      - id: derivatives
        name: Derivatives
        from: C11
      - id: applications-of-derivatives
        name: Applications of derivatives
        from: C12
    - id: integral
      name: Integral
      tag: Areas, accumulation, differential equations.
      what: Integration reverses differentiation and computes areas and totals. Differential equations state laws as rates
        and solve for the behaviour.
