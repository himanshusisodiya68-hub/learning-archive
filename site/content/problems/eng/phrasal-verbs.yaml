# Phrasal verbs. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "Complete the sentence: The match was ___ because of heavy rain."
  opts: ["called off", "called on", "called up", "called at"]
  ans: 0
  sol: |
    *Call off* means cancel. Heavy rain is a reason to cancel a match, so *called off* is right. *Called on* means visited, and *called up* means telephoned or summoned. *Called at* does not form a phrasal verb here.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Complete the sentence: Please ___ your shoes before you enter the house."
  opts: ["take off", "take after", "take up", "take in"]
  ans: 0
  sol: |
    *Take off* means remove (clothes or shoes). *Take after* means resemble a relative, *take up* means begin a hobby, and *take in* means understand or deceive.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Complete the sentence: My grandmother ___ us whenever our parents are away."
  opts: ["looks after", "looks for", "looks up", "looks into"]
  ans: 0
  sol: |
    *Look after* means take care of, which is what a grandmother does for children. *Looks for* means searches for, *looks up* means checks in a book, and *looks into* means investigates.
  check: none

- id: f4
  lvl: found
  kind: mcq
  q: "What does the phrasal verb in this sentence mean? \"Neha gave up chocolate for a month.\""
  opts: ["stopped eating it", "handed it out", "paid it back", "bought a lot of it"]
  ans: 0
  sol: |
    *Give up* followed by a habit or thing means stop doing or having it. So Neha stopped eating chocolate for a month. *Give out* would mean distribute, and the other options have nothing to do with the phrase.
  check: none

- id: f5
  lvl: found
  kind: text
  q: "Write the meaning of each phrasal verb in one or two words, then use any two of them in sentences of your own: (a) turn up, (b) put off, (c) carry on, (d) run out of."
  sol: |
    Model answer.

    (a) turn up = arrive or appear. (b) put off = postpone. (c) carry on = continue. (d) run out of = have none left.

    Sample sentences: *Only half of the guests turned up for the meeting.* *We ran out of sugar, so Mum went to the shop.*

    Any correct sentence that shows the meaning is acceptable. Note that the verb may change for tense (*turned up*, *ran out of*) but the particle stays.
  check: none

- id: b1
  lvl: board
  kind: text
  q: "Rewrite each sentence, replacing the underlined word or words with a suitable phrasal verb. (a) The principal __postponed__ the meeting. (b) Rohan __resembles__ his father. (c) The firemen __extinguished__ the fire. (d) I cannot __tolerate__ such rudeness."
  sol: |
    Model answer: (a) put off, (b) takes after, (c) put out, (d) put up with.

    (a) The principal put off the meeting. (b) Rohan takes after his father. (c) The firemen put out the fire. (d) I cannot put up with such rudeness.

    Note that *takes after* needs the -s for Rohan, a singular subject. This is a model answer written for this archive, not an official board key.
  check: none

- id: b2
  lvl: board
  kind: mcq
  q: "Choose the correct option to fill the blank: The car ___ on the highway, so we reached the wedding very late."
  opts: ["broke down", "broke out", "broke in", "broke up"]
  ans: 0
  sol: |
    A car that stops working has *broken down*. *Broke out* is for a fire, a war or a disease starting suddenly; *broke in* means entered by force; *broke up* means ended or fell apart. Only *broke down* explains why they were late.
  check: none

- id: b3
  lvl: board
  kind: text
  q: "Fill each blank with one word from the box: up / off / out / after / down. (1) The fire alarm went ___ in the middle of the lesson. (2) Please look ___ the little ones while I am away. (3) When did the war break ___? (4) He turned ___ the offer because the salary was too low. (5) We were so tired that we gave ___ the climb."
  sol: |
    Model answer: (1) off, (2) after, (3) out, (4) down, (5) up.

    (1) An alarm *goes off* (rings). (2) *Look after* means take care of. (3) A war *breaks out*. (4) *Turn down* means refuse. (5) *Give up* means stop trying, here, stop the climb.

    This is a model answer written for this archive, not an official board key.
  check: none

- id: b4
  lvl: board
  kind: text
  q: "Each line has one error. Rewrite the line correctly. (a) I am looking forward to meet you next week. (b) He asked me to turn off it. (c) We ran out our sugar yesterday. (d) She could not put up him any longer."
  sol: |
    Model answer.

    (a) I am looking forward to meeting you next week. (To is a preposition here, so -ing follows.)
    (b) He asked me to turn it off. (Turn off is separable, so the pronoun goes in the middle.)
    (c) We ran out of our sugar yesterday. (The three-word verb needs of. If the supply is the subject, say: Our sugar ran out.)
    (d) She could not put up with him any longer. (The last word, with, was missing.)

    This is a model answer written for this archive, not an official board key.
  check: none

- id: b5
  lvl: board
  kind: text
  q: |
    Read the passage and answer. "When the power cut began, we expected it to last an hour. It dragged on for the whole evening. Dad dug out the old lantern from the cupboard, and Mum, who never gives in to gloom, set about telling stories. By ten o'clock the lights came on again." Pick the word or phrase from the passage that means: (a) continued for a long time, (b) found and took out, (c) surrenders, (d) began doing something energetically.
  sol: |
    Model answer: (a) dragged on, (b) dug out, (c) gives in (to), (d) set about.

    In each case the answer is a phrasal verb, so the clue is a two-word phrase. *Drag on* is used for something that lasts longer than people want. *Dig out* is to find something kept away in a store or cupboard. *Give in* means yield. *Set about* means start to do something with purpose.

    This is a model answer written for this archive, not an official board key.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "The phrasal verb take off has more than one meaning. Write three sentences of your own, each showing a different meaning of take off."
  sol: |
    Model answer, one possible answer.

    1. Remove: *He took off his raincoat at the door.*
    2. Leave the ground: *The plane took off ten minutes late.*
    3. Become popular or successful: *Her little bakery really took off after the festival.*

    Another meaning is to copy someone's style or voice: *He can take off the teacher perfectly.* The sentence tells you which meaning is meant; the particle alone does not.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "A committee notice says: \"The committee has called off the trip, because too many students have pulled out and the funds have run out.\" Rewrite it in a formal style, replacing each phrasal verb with a single formal verb."
  sol: |
    Model answer: "The committee has cancelled the trip, because too many students have withdrawn and the funds have been exhausted."

    called off = cancelled; pulled out = withdrawn; run out = been exhausted (or "have been used up", but that is again a phrasal verb). The formal version suits a letter or a report, and the casual version suits a message to friends.

    This is one possible answer.
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: "Choose the sentence that is grammatically correct."
  opts: ["I cannot put up with his rudeness.", "I cannot put up his rudeness with.", "I cannot put with up his rudeness.", "I cannot put up to his rudeness."]
  ans: 0
  sol: |
    *Put up with* (tolerate) is a three-word phrasal verb. Its words stay together, in order, and the object follows. The other options split it, reorder it, or use the wrong last word.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "Complete each sentence with a noun made from the phrasal verb in brackets. Write it as one word. (a) The ___ of the engine delayed us for hours. (break down) (b) There was an ___ of cholera in the village. (break out) (c) The flood was a serious ___ for the project. (set back) (d) The ___ was smooth and we saw the whole city below. (take off)"
  sol: |
    Model answer: (a) breakdown, (b) outbreak, (c) setback, (d) takeoff (take-off is also acceptable in some dictionaries).

    The verb is two words (the engine broke down; cholera broke out); the noun is one word. Note that *outbreak* reverses the order of the parts: out + break, not break + out. [Unverified: dictionaries differ on takeoff vs take-off.]

    This is a model answer.
  check: none

- id: m5
  lvl: main
  kind: text
  q: "Write a paragraph of 60 to 80 words about a day when your plans went wrong. Use at least five different phrasal verbs and underline them."
  sol: |
    Model answer, one possible answer.

    We had **set out** early for the lake, but the bus **broke down** halfway. While we waited, Dad **looked into** the engine and Mum **handed out** biscuits. A kind driver **picked** us **up** and we finally **turned up** at noon, only to find that the boat trips had been **called off** because of the wind. We **gave up** the lake, **carried on** to the temple and ended up having a lovely day anyway.

    Count: set out, broke down, looked into, handed out, picked up, turned up, called off, gave up, carried on (nine). Check the tense is consistent (past), the object is correctly placed (picked us up, with the pronoun in the middle) and the length stays within 60 to 80 words. Other answers are possible.
  check: none

- id: m6
  lvl: main
  kind: mcq
  q: "In which sentence does look down on mean 'think you are better than someone'?"
  opts: ["He looks down on people who work with their hands.", "He looked down on the valley from the hilltop.", "He looked down on the page to find the answer.", "He looks down on the floor to check for the key."]
  ans: 0
  sol: |
    In the first sentence *looks down on* is idiomatic: it describes an attitude of superiority. In the others, *looked down on* describes a physical glance downward, the literal meaning of the words. Compare *look up to*, which means respect.
  check: none
