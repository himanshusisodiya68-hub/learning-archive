  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about the text
  kind: text
  q: |
    What made the woman in the control centre look at the narrator strangely?
  sol: |
    One possible answer: The narrator asked her about the other pilot and the other aeroplane that had guided him. She looked at him strangely because no other aeroplane had been flying in the storm that night. The radar showed only his Dakota, so what he said did not make sense to her. She even laughed, thinking he must be mistaken.
