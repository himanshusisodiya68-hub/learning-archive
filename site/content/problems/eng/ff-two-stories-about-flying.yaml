- id: ncert10-ff-3-16
  lvl: ncert-ex
  num: "FF 3 · II TL III"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about language, III
  kind: text
  q: |
    We know that the word ‘fly’ (of birds/insects) means to move through air using wings. Tick the words which have the same or nearly the same meaning.

    swoop   flit   paddle   flutter
    ascend   float   ride   skim
    sink   dart   hover   glide
    descend   soar   shoot   spring
    stay   fall   sail   flap
  sol: |
    Model answer (a few are judgement calls, marked [Inference]; check with a dictionary):

    Tick: swoop, flit, flutter, ascend, float, skim, dart, hover, glide, descend, soar, shoot, sail, flap.

    Do not tick: paddle (moving through water with paddle or hands), ride (sit on something that carries you), sink (go down in water), spring (jump up or forward, usually without wings), stay (remain in one place), fall (drop without control).

    Notes: *swoop* = dive down fast; *flit* = move lightly and quickly; *flutter* = flap wings lightly; *ascend* = go up; *float* and *sail* = drift smoothly through air or water [Inference: they count here for gliding in air]; *skim* = pass just above a surface; *dart* and *shoot* = move fast; *hover* = stay in the air in one place; *glide* = move smoothly without effort; *descend* = go down; *soar* = rise high; *flap* = beat the wings.
  check: none

- id: ncert10-ff-3-17
  lvl: ncert-ex
  num: "FF 3 · II WR"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Writing
  kind: text
  q: |
    Have you ever been alone or away from home during a thunderstorm? Narrate your experience in a paragraph.
  sol: |
    One possible model paragraph (personal; yours will differ):

    Last July I was alone at my grandmother's house when the afternoon sky turned the colour of a bruise. First came the wind, banging every door in the house. Then the lights went out, and a clap of thunder shook the windows so hard that the glasses rattled in the kitchen. I sat on the sofa with a blanket over my knees, counting the seconds between the lightning flash and the thunder, as my father had taught me. When the count reached ten, I knew the storm was moving away. My heart slowed down. I made a cup of tea by candlelight, listened to the rain, and by the time my grandmother came home, wet and laughing, the street outside was shining like a river and I was almost sorry it was over.
