# Two Stories about Flying. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 3 (I. His First Flight, II. The Black Aeroplane). No NCERT answer key exists: all answers are model answers written for this archive. Section names (Thinking about the text, Thinking about language, Speaking, Writing) are inferred from the content because headings are missing from the text layer [Inference]. Found, board and main problems are original.

- id: ncert10-ff-3-1
  lvl: ncert-ex
  num: "FF 3 · BYR"
  source: NCERT X English · First Flight · Ch 3 · Before you read
  kind: text
  q: |
    Since the earliest times, humans have dreamt of conquering the skies. Here are two stories about flying.

    I. A young seagull is afraid to fly. How does he conquer his fear?

    II. A pilot is lost in storm clouds. Does he arrive safe? Who helps him?
  sol: |
    One possible answer (a prediction, before reading): the seagull may be helped by his parents, who teach, coax or even trick him into trying, and he finds the fear was bigger than the flight. The pilot may reach safety because some unexpected helper guides him, perhaps another plane or another pilot. The stories show what actually happens.
  check: none

- id: ncert10-ff-3-2
  lvl: ncert-ex
  num: "FF 3 · I TT Q1"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Thinking about the text
  kind: text
  q: |
    Why was the young seagull afraid to fly? Do you think all young birds are afraid to make their first flight, or are some birds more timid than others? Do you think a human baby also finds it a challenge to take its first steps?
  sol: |
    One possible answer: The seagull had taken a run to the brink of the ledge before, but each time he looked at the sea far below, "miles down" in his fear, and felt certain his wings would not hold him. He had never tried, so he could not know that they would. Not all young birds are likely to feel the same. Some may jump almost at once, while others, like this one, need time or a push, just as people differ in how boldly they try new things. A human baby also finds first steps a real challenge: it wobbles, falls, cries and is afraid, yet it tries again, helped by cheering parents.
  check: none

- id: ncert10-ff-3-3
  lvl: ncert-ex
  num: "FF 3 · I TT Q2"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Thinking about the text
  kind: text
  q: |
    “The sight of the food maddened him.” What does this suggest? What compelled the young seagull to finally fly?
  sol: |
    One possible answer: The line suggests that his hunger was so strong that it drove out his fear and made him almost wild. He had not eaten since the night before, and he was watching his mother tear at the fish. What finally compelled him to fly was this hunger together with his mother's trick. She flew across with a piece of fish and stopped in mid-air, just out of reach, so he dived at it without thinking and his wings opened.
  check: none

- id: ncert10-ff-3-4
  lvl: ncert-ex
  num: "FF 3 · I TT Q3"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Thinking about the text
  kind: text
  q: |
    “They were beckoning to him, calling shrilly.” Why did the seagull’s father and mother threaten him and cajole him to fly?
  sol: |
    One possible answer: A seagull must be able to fly to catch fish and survive, so the parents could not let him stay on the ledge. They threatened him with starvation to frighten him into trying, and cajoled (coaxed) him with calls and by beckoning, as on the green sea at the end, to give him courage. Their harshness and their coaxing both came from the same wish: that he would learn to fly like the rest of the family.
  check: none

- id: ncert10-ff-3-5
  lvl: ncert-ex
  num: "FF 3 · I TT Q4"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Thinking about the text
  kind: text
  q: |
    Have you ever had a similar experience, where your parents encouraged you to do something that you were too scared to try? Discuss this in pairs or groups.
  sol: |
    One possible answer (personal; yours will differ): When I was seven I was afraid to put my face in the water at the swimming pool. My father stood in the water beside me, held my hands and said he would count to three and let go only when I nodded. I nodded after a long time, he let go, and I found that I could float. I was proud and could not stop laughing. In pairs, listen to each other's stories and notice what the parents did: they stayed close, did not laugh at the fear, and let the child take the final step.
  check: none

- id: ncert10-ff-3-6
  lvl: ncert-ex
  num: "FF 3 · I TT Q5"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Thinking about the text
  kind: text
  q: |
    In the case of a bird flying, it seems a natural act, and a foregone conclusion that it should succeed. In the examples you have given in answer to the previous question, was your success guaranteed, or was it important for you to try, regardless of a possibility of failure?
  sol: |
    One possible answer: In my example, success was not guaranteed. I could have swallowed water, panicked and failed on the first try, and some children do. A bird's flight comes from instinct, so it nearly always works once the bird begins, but a human skill like swimming or cycling has to be learned through wobbling and mistakes. It was important to try regardless of the chance of failure, because nobody learns a skill without a first attempt, and each failure teaches something. Trying also showed me that the fear was bigger than the danger.
  check: none

