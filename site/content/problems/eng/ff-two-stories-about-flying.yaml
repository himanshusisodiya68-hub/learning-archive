- id: ncert10-ff-3-13
  lvl: ncert-ex
  num: "FF 3 · II TT Q5"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about the text
  kind: text
  q: |
    Who do you think helped the narrator to reach safely? Discuss this among yourselves and give reasons for your answer.
  sol: |
    One possible answer (an opinion; another view is equally acceptable if supported): I think a guardian presence guided him, such as a ghost or protective spirit. The black plane appeared in a storm where no other plane was flying, it had no lights, it led him to the runway just as fuel ran out, and then vanished. The controller's radar showed no second aeroplane. The other possibility is that, tired and frightened, the pilot imagined a guide, but this would not explain how he found the runway without a compass or radio. The story does not decide, and that is its charm.
  check: none

- id: ncert10-ff-3-14
  lvl: ncert-ex
  num: "FF 3 · II TL I"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about language, I
  kind: text
  q: |
    Study the sentences given below.

    (a) They looked like black mountains.
    (b) Inside the clouds, everything was suddenly black.
    (c) In the black clouds near me, I saw another aeroplane.
    (d) The strange black aeroplane was there.

    The word ‘black’ in sentences (a) and (c) refers to the very darkest colour. But in (b) and (d) (here) it means without light/with no light. ‘Black’ has a variety of meanings in different contexts. For example:

    (a) ‘I prefer black tea’ means ‘I prefer tea without milk’.
    (b) ‘With increasing pollution the future of the world is black’ means ‘With increasing pollution the future of the world is very depressing/without hope’.

    Now, try to guess the meanings of the word ‘black’ in the sentences given below. Check the meanings in the dictionary and find out whether you have guessed right.

    1. Go and have a bath; your hands and face are absolutely black.

    2. The taxi-driver gave Ratan a black look as he crossed the road when the traffic light was green.

    3. The bombardment of Hiroshima is one of the blackest crimes against humanity.

    4. Very few people enjoy Harold Pinter’s black comedy.

    5. Sometimes shopkeepers store essential goods to create false scarcity and then sell these in black.

    6. Villagers had beaten the criminal black and blue.
  sol: |
    Model answers (check against a dictionary, as the question asks):

    1. black = very dirty.
    2. a black look = an angry, disapproving or hostile look.
    3. the blackest crimes = the most wicked, evil crimes.
    4. black comedy = comedy that treats grim, dark or disturbing subjects in a humorous way.
    5. sell in black = sell illegally, in the black market, usually at a high price and without paying tax.
    6. beaten black and blue = beaten until the body was covered in dark bruises.
  check: none

