  q: |
    Read the extract and answer the questions that follow.

    He stepped slowly out to the brink of the ledge, and standing on one leg with the other leg hidden under his wing, he closed one eye, then the other, and pretended to be falling asleep.

    (a) Who is 'he'? Where is he, and why is he doing this?
    (b) What does the action show about his state of mind?
    (c) Find a word in the extract that means 'edge'.
  sol: |
    (a) 'He' is the young seagull. He is on his ledge, hungry and alone, and he pretends to sleep so that his family will stop watching and teasing him, and perhaps notice his hunger.
    (b) It shows that he is frightened and avoiding the problem; he would rather pretend to sleep than try to fly. It also shows a trace of cunning, since he hopes to win attention or food.
    (c) 'Brink'.
