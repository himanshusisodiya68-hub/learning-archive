- id: b3
  lvl: board
  kind: text
  q: |
    Answer in about 100-120 words: Describe what happens to the pilot inside the storm clouds in 'The Black Aeroplane'. How does the mysterious plane help him?
  sol: |
    One possible model answer: As soon as the Dakota enters the storm, everything turns black and the aeroplane is thrown about. The pilot looks at the compass and sees it spinning round and round. The other instruments die and the radio is silent, so he is lost with almost no fuel. Then another plane appears beside him with no lights. Its pilot waves and says 'Follow me', then turns north so that the narrator can follow. Half an hour later, as the last fuel is nearly gone, the strange plane goes down and he sees two lines of runway lights. He lands safely, but the black plane has vanished, and the control woman says her radar showed no other plane that night.
  check: none

- id: b4
  lvl: board
  kind: text
  q: |
    Answer in about 100-120 words: 'Both stories show a hero who is helped when he can do nothing for himself.' Do you agree? Give evidence from both stories.
  sol: |
    One possible model answer: I agree in part. The seagull cannot move because of fear, and the help comes from outside: his mother holds a fish just out of reach, and his hunger makes him dive. Without that push he would still be on the ledge. The pilot is also helpless once the compass and radio die, and the black aeroplane leads him to the runway when his fuel is nearly gone. However, there is a difference. The seagull still has to dive and open his wings himself, so he helps himself as well. The pilot, on the other hand, only follows, and his helper may not even be real. So the idea is true, but the seagull's story gives more credit to the hero.
  check: none

- id: m1
  lvl: main
  kind: text
  q: |
    Compare the endings of 'His First Flight' and 'The Black Aeroplane'. Why might the writers have chosen to end them in such different ways? Answer in about 120 words.
  sol: |
    One possible model answer: The first story ends with a short, definite line: he had made his first flight. The seagull is fed and praised, and the problem is solved. The second ends with the pilot's questions about who the other pilot was, and the reader is left uncertain. The first writer wants the reader to feel the joy of a fear overcome, so a clear ending suits the theme: starting is the hard part and once done, it is complete. The second writer wants wonder and a shiver of mystery, and a solved puzzle would spoil it. The open ending also lets each reader supply an explanation, whether a spirit, imagination or luck, which makes the story linger longer in memory. (Our reasons about the writers' intentions are an inference.)
  check: none

- id: m2
  lvl: main
  kind: text
  q: |
    The seagull sees the sea as 'a vast green sea' and later as 'green flooring'. How does this mistake add humour and meaning to the end of the story?
  sol: |
    One possible model answer: The seagull has never flown or seen the sea from above, so he takes the water for solid ground and puts his legs down to stand. His feet sink and he screams, which is comic because the reader knows what he does not. The mistake also shows how new everything is to him: a creature who feared the sea for a day now has to learn to float on it. The sea he feared at the start becomes the surface that safely holds him in the end, so the fear is turned upside down by the experience. (An interpretation; the text only states what happens.)
  check: none

- id: m3
  lvl: main
  kind: text
  q: |
    Write a short analysis (about 120 words) of how the writer builds suspense in 'The Black Aeroplane'. Refer to at least three details.
  sol: |
    One possible model answer: The writer starts with calm: a clear sky, a moon and thoughts of breakfast, so the storm is a shock. The clouds are 'black mountains', and the pilot chooses the risk on purpose, so the reader fears the result. Inside the clouds the tension rises with each failure: the plane twists, the compass spins 'round and round', the instruments die and the radio goes silent. The sentences become short and sharp. The kindly plane appears, but the fuel is nearly gone, which adds another ticking clock. Finally the plane vanishes, and the controller's words raise the greatest question. Because the narrator tells the story himself, we share his fear and his confusion.
  check: none

- id: m4
  lvl: main
  kind: text
  q: |
    'Fear is often bigger than the thing we fear.' Show how this idea applies to the young seagull. Then give an example from your own life or reading. Answer in about 120 words.
  sol: |
    One possible model answer: The seagull imagines the sea is 'miles down' and is certain he will fall, so he stays on the ledge for a day and a night. When he finally dives, the fall lasts only a moment of terror before his wings spread. He finds flying easy and joyful, and soon forgets that he ever could not do it. His fear was much larger than the real danger. In my own life, I was afraid to speak in front of the class for months. When I finally stood up, my voice shook for the first sentence, but after that I felt fine and my classmates even clapped. The waiting was worse than the speaking. (The example is personal; give your own.)
  check: none
