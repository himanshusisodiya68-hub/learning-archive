- id: ncert10-ff-3-8
  lvl: ncert-ex
  num: "FF 3 · I WR"
  source: NCERT X English · First Flight · Ch 3 · I. His First Flight · Writing
  kind: text
  q: |
    Write a short composition on your initial attempts at learning a skill. You could describe the challenges of learning to ride a bicycle or learning to swim. Make it as humorous as possible.
  sol: |
    One possible model answer (about 150 words):

    My Bicycle and I

    When I was eight, my uncle announced that I would learn to ride a bicycle, and I agreed, because I did not yet know how bicycles think. Mine thought mostly about the ground. Uncle held the seat and ran behind me shouting, "Pedal! Look ahead! Do not look at your feet!" I looked at my feet. The bicycle then went where my feet were looking, which was a hedge.

    On the third day Uncle let go without telling me. I sailed on for twenty glorious metres, then turned to wave, found no one holding me, and fell into a puddle with great speed and no dignity. Our neighbour clapped. The bicycle lay beside me, looking innocent.

    Now I can ride without hands. Uncle says I fall less often than he did. I have not asked how he knows.

    (A good humorous piece uses exaggeration, short sentences and a gentle joke against yourself.)
  check: none

- id: ncert10-ff-3-9
  lvl: ncert-ex
  num: "FF 3 · II TT Q1"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about the text
  kind: text
  q: |
    “I’ll take the risk.” What is the risk? Why does the narrator take it?
  sol: |
    One possible answer: The risk is flying his old Dakota straight into a huge storm. He cannot fly over the clouds, and he does not have enough fuel to go around them to the north or south, so the only safe choice would have been to turn back to Paris. He takes the risk because he badly wants to get home to his family and to a big English breakfast, and he does not want the delay. He risks his life for a small reason.
  check: none

- id: ncert10-ff-3-10
  lvl: ncert-ex
  num: "FF 3 · II TT Q2"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about the text
  kind: text
  q: |
    Describe the narrator’s experience as he flew the aeroplane into the storm.
  sol: |
    One possible answer: As soon as he entered the clouds, everything went black and he could not see anything outside. The old aeroplane jumped and twisted in the air. Then the compass began spinning round and round and stopped working, and the other instruments died too. He tried the radio and called Paris Control, but there was no answer. He was lost in the storm with no compass, no radio and no view, and he felt helpless and frightened.
  check: none

- id: ncert10-ff-3-11
  lvl: ncert-ex
  num: "FF 3 · II TT Q3"
  source: NCERT X English · First Flight · Ch 3 · II. The Black Aeroplane · Thinking about the text
  kind: text
  q: |
    Why does the narrator say, “I landed and was not sorry to walk away from the old Dakota…”?
  sol: |
    One possible answer: The narrator says this because the flight had been terrifying. The old aeroplane had carried him through a storm in which its compass and radio died and its fuel almost ran out, and he was relieved to be safe on the ground. He had come close to disaster, so he was glad to get away from the plane and did not feel any sadness at leaving it.
  check: none

- id: ncert10-ff-3-12
