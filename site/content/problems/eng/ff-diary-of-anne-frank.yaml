- id: ncert10-ff-4-17
  lvl: ncert-ex
  num: "FF 4 · TT Q6"
  source: NCERT X English · First Flight · Ch 4 · Thinking about the text
  kind: text
  q: Anne says teachers are most unpredictable. Is Mr Keesing unpredictable? How?
  sol: |
    One possible answer: Yes. After he laughs at the first essay, he sets a second, and after two quiet lessons he loses patience on the third and sets a ridiculous title. When Anne answers with a poem, he does not get angry; he reads it to several classes and stops punishing her. In fact he starts making jokes himself. His reactions are not what Anne expects, so her remark about teachers fits him.
