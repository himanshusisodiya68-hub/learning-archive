  kind: text
  q: |
    There are some examples of diary or journal entries in the 'Before You Read' section. Compare these with what Anne writes in her diary. What language was the diary originally written in? In what way is Anne's diary different?
  sol: |
    One possible answer: The sample entries are short and factual: one records a late morning and a scolding, one lists appointments with times, one summarises a trip and one recalls a film role. Anne's entry is longer and more personal. She writes to a named friend, explains her feelings, tells a story in full, and shows her humour and character. The diary was originally written in Dutch. It differs because it is addressed to an imagined friend, Kitty, and mixes memory, reflection and comedy in one voice.
