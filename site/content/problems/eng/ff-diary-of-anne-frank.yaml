  q: |
    The text you've just read has a number of phrasal verbs commonly used in English. Look up the following in a dictionary for their meanings (under the entry for the italicised word).

    (i) plunge (right) in
    (ii) kept back
    (iii) ramble on
    (iv) get along with
  sol: |
    One possible answer (dictionary-style meanings as used in the text):
    (i) plunge in: begin something suddenly and without preparation; here, go straight to the subject.
    (ii) kept back: not promoted to the next class; stayed in the same class. (The verb keep back also means hold something back or not share it.)
    (iii) ramble on: talk or write for a long time in an aimless way.
    (iv) get along with: have a friendly relationship with someone.
