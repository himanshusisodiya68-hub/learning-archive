    (ii) not to lose heart = not to give up hope or become discouraged.
    (iii) for ages = for a very long time (not literally ages).
    (iv) play a joke on me = try to make a fool of me; the joke was on him = he would be the one who looks foolish in the end, because the joke would turn against him.
