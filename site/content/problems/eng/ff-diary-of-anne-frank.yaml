- id: ncert10-ff-4-21
  lvl: ncert-ex
  num: "FF 4 · TL II.2"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, II (Phrasal verbs), item 2
  kind: text
  q: |
    Now find the sentences in the lesson that have the phrasal verbs given below. Match them with their meanings. (You have already found out the meanings of some of them.) Are their meanings the same as that of their parts? (Note that two parts of a phrasal verb may occur separated in the text.)

    (i) plunge in
    (ii) kept back
    (iii) move up
    (iv) ramble on
    (v) get along with
    (vi) calm down
    (vii) stay in
    (viii) make up for
    (ix) hand in

    Meanings: speak or write without focus; stay indoors; make (them) remain quiet; have a good relationship with; give an assignment (homework) to a person in authority (the teacher); compensate; go straight to the topic; go to the next grade; not promoted
  sol: |
    One possible answer:
    (i) plunge in = go straight to the topic ("if I were to plunge right in")
    (ii) kept back = not promoted ("who'll be kept back")
    (iii) move up = go to the next grade
    (iv) ramble on = speak or write without focus
    (v) get along with = have a good relationship with ("I get along pretty well with all my teachers")
    (vi) calm down = make (them) remain quiet ("can't calm them down")
    (vii) stay in = stay indoors ("whether to stay in or go out")
    (viii) make up for = compensate ("was intended to make up for the other")
    (ix) hand in = give an assignment (homework) to a person in authority, the teacher ("I handed it in")

    Are the meanings the same as their parts? Only for stay in, and partly for move up (a physical idea becomes a school idea). For kept back, ramble on, get along with and make up for the meaning is quite different from the separate words, so they must be learnt as units. Calm and them are separated in calm them down, showing that the two parts of a phrasal verb may be split.
  check: none

