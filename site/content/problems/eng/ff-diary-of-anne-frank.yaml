  source: NCERT X English · First Flight · Ch 4 · Thinking about the text
  kind: text
  q: |
    How does Anne feel about her father, her grandmother, Mrs Kuperus and Mr Keesing? What do these tell you about her?
  sol: |
    One possible answer: She calls her father "the most adorable father I've ever seen", so she admires and loves him. She loves her grandmother deeply and thinks of her often even after her death. She and Mrs Kuperus, her headmistress, were both in tears at their farewell, so she was fond of her. Towards Mr Keesing she feels mock annoyance (she calls him an old fogey) but also respect and amusement, as he takes her joke well. These feelings show that Anne is affectionate, loyal, emotional and good-humoured.
