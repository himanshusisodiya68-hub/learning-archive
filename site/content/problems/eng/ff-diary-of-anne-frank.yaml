# From the Diary of Anne Frank. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 4 (the poem 'Amanda!' that shares the PDF is out of scope). No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-ff-4-1
  lvl: ncert-ex
  num: "FF 4 · BYR Activity 1"
  source: NCERT X English · First Flight · Ch 4 · Before you read, Activity 1
  kind: text
  q: |
    Do you keep a diary? Given below under 'A' are some terms we use to describe a written record of personal experience. Can you match them with their descriptions under 'B'? (You may look up the terms in a dictionary if you wish.)

    A: (i) Journal, (ii) Diary, (iii) Log, (iv) Memoir(s)

    B:
    – A book with a separate space or page for each day, in which you write down your thoughts and feelings or what has happened on that day
    – A full record of a journey, a period of time, or an event, written every day
    – A record of a person's own life and experiences (usually, a famous person)
    – A written record of events with times and dates, usually official
  sol: |
    One possible answer (the matching, by meaning):
    - (i) Journal = a full record of a journey, a period of time, or an event, written every day.
    - (ii) Diary = a book with a separate space or page for each day, in which you write your thoughts and feelings or what has happened that day.
    - (iii) Log = a written record of events with times and dates, usually official.
    - (iv) Memoir(s) = a record of a person's own life and experiences (usually a famous person's).

    Whether you keep a diary is a personal answer.
  check: none

- id: ncert10-ff-4-2
  lvl: ncert-ex
  num: "FF 4 · BYR Activity 2"
  source: NCERT X English · First Flight · Ch 4 · Before you read, Activity 2
  kind: text
  q: |
    Here are some entries from personal records. Use the definitions above to decide which of the entries might be from a diary, a journal, a log or a memoir.

    (i) I woke up very late today and promptly got a scolding from Mum! I can't help it — how can I miss the FIFA World Cup matches?

    (ii) 10:30 a.m. Went to the office of the Director; 01:00 p.m. Had lunch with Chairman; 05:45 p.m. Received Rahul at the airport; 09:30 p.m. Dinner at home

    (iii) The ride to Ooty was uneventful. We rested for a while every 50 km or so, and used the time to capture the magnificent landscape with my HandyCam. From Ooty we went on to Bangalore. What a contrast! The noise and pollution of this once-beautiful city really broke my heart.

    (iv) This is how Raj Kapoor found me — all wet and ragged outside R.K.Studios. He was then looking for just someone like this for a small role in Mera Naam Joker, and he cast me on the spot. The rest, as they say, is history!
  sol: |
    One possible answer:
    - (i) A diary: it is a personal account of one day with feelings ("I can't help it").
    - (ii) A log: it lists events with times and dates, in a brief, official style. (A busy person could also keep it as a diary of appointments, but the time-stamped list points to a log.)
    - (iii) A journal: it is a record of a journey, written as the trip goes on.
    - (iv) A memoir: it looks back on a life experience, a famous person's recollection of how he got a role.
  check: none

- id: ncert10-ff-4-3
  lvl: ncert-ex
  num: "FF 4 · OC1 Q1"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the opening section)
  kind: text
  q: What makes writing in a diary a strange experience for Anne Frank?
  sol: |
    One possible answer: Anne has never written anything before, so keeping a diary is new to her. She also thinks it strange because she believes that neither she nor anyone else will later be interested in the musings of a thirteen-year-old schoolgirl. Yet she feels she wants to write and needs to get all kinds of things off her chest.
  check: none

- id: ncert10-ff-4-4
  lvl: ncert-ex
  num: "FF 4 · OC1 Q2"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the opening section)
  kind: text
  q: Why does Anne want to keep a diary?
  sol: |
    One possible answer: Anne wants a diary because she has no true friend. She has loving parents, a sister, aunts, a good home and about thirty people she calls friends, but with them she can talk only about ordinary things and they never become close. She wants the diary to be her friend, someone she can confide in, so she names it Kitty. She also has a "great need to get all kinds of things off my chest" (opening paragraph).
  check: none

- id: ncert10-ff-4-5
  lvl: ncert-ex
  num: "FF 4 · OC1 Q3"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the opening section)
  kind: text
  q: Why did Anne think she could confide more in her diary than in people?
  sol: |
    One possible answer: Anne recalls that paper has more patience than people. A notebook does not interrupt, judge, laugh or repeat what it hears, and she does not plan to let anyone read it unless she finds a real friend. With her friends she cannot get beyond ordinary everyday talk, and she suspects the fault may be partly her own. So she feels the diary, which she imagines as a friend, will hear what people never do.
  check: none

