- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) Compare the opening of Anne's entry with the ordinary sample entries in 'Before You Read'. In about 150 words, say what extra things a diary needs to be read with interest by strangers decades later."
  sol: |
    One possible model answer: The sample entries are fine records but say little about the writer. A line about a scolding or a list of appointments tells us what happened, not who the person is. Anne's entry gives a voice, a reason for writing, a few vivid scenes and, above all, a listener. She talks to Kitty, explains herself honestly and lets her faults show. For a stranger to enjoy a diary, it should have specific detail (the swan and the ducklings, the bets on who will pass), honesty about feelings, humour or a distinct personality, and a sense of time and place. The diary becomes a document when it captures an ordinary life so truly that later readers can see a world through it.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) The chapter's introduction tells us what happened to Anne after this entry. Does knowing that change how you read her jokes about essays and exams? Answer in about 120 words, referring to the text."
  sol: |
    One possible model answer: Yes, it does. Anne is worried about passing maths and teasing Mr Keesing. A reader who knows that her family will soon go into hiding, and that she will die in a camp, sees the ordinary school worries as precious and fragile. This is dramatic irony: the reader knows more than the writer. Her boldness ("I'd make sure the joke was on him") and her hopes for a friend feel poignant. The laughter does not become less funny, but it is shadowed. It also reminds us that an ordinary young person lived in the world that was destroyed, which is why the diary moves millions of readers. (Another reader may argue the jokes should be enjoyed on their own terms; the key is to use evidence.)
  check: none

- id: m3
  lvl: main
  kind: text
  q: |
    (Original problem, change of register.) Rewrite this diary note as a short formal paragraph for a school magazine, using full forms and complete sentences.

    "Got to school late again. Bus broke down, can't blame anyone. Mrs Rao's not angry, thank goodness. Handed in my poem, she's pleased. Too bad about maths, though."
  sol: |
    One possible model answer: I reached school late again today because the bus broke down on the way. Fortunately, Mrs Rao was not angry. I handed in my poem and she was pleased with it. Unfortunately, my maths test did not go as well.

    What changed: subjects and verbs were added (I reached, she was); contractions were expanded (can't, Mrs Rao's); fragments became sentences; chatty phrases ("thank goodness", "Too bad") became formal ones ("fortunately", "unfortunately"). Note that "can't blame anyone" was dropped because it adds nothing in a formal piece.
