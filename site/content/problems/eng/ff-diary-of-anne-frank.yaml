- id: ncert10-ff-4-10
  lvl: ncert-ex
  num: "FF 4 · OC3 Q3"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the 20 June entry)
  kind: text
  q: Do you think Mr Keesing was a strict teacher?
  sol: |
    One possible answer: Mr Keesing was firm but not harsh. He warned Anne several times, then gave her essays to write each time she talked. That shows he wanted discipline. But his punishment was an essay, not shouting or a beating, he laughed at her arguments and finally enjoyed her poem. So he was strict enough to act, yet fair and good-humoured. (Another reader might call him strict because he punished her three times; the evidence decides.)
  check: none

- id: ncert10-ff-4-11
  lvl: ncert-ex
  num: "FF 4 · OC3 Q4"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the 20 June entry)
  kind: text
  q: What made Mr Keesing allow Anne to talk in class?
  sol: |
    One possible answer: Anne wrote the third essay, 'Quack, Quack, Quack, Said Mistress Chatterbox', as a poem, with her friend Sanne's help. It was about a mother duck and a father swan whose three ducklings were bitten to death for quacking too much. Mr Keesing took the joke the right way, read the poem to the class and to other classes, and from then on let her talk and gave no more extra homework.
  check: none

- id: ncert10-ff-4-12
  lvl: ncert-ex
  num: "FF 4 · TT Q1"
  source: NCERT X English · First Flight · Ch 4 · Thinking about the text
  kind: text
  q: Was Anne right when she said that the world would not be interested in the musings of a thirteen-year-old girl?
  sol: |
    One possible answer: No, she was wrong. Her diary became one of the most widely read books in the world, was translated from Dutch into many languages and inspired films, plays and even an opera. Readers value its honest picture of daily life under Nazi occupation, and it was described as the work of a mature and insightful mind. A teenager's feelings, written honestly, turned out to be of universal interest.
  check: none

