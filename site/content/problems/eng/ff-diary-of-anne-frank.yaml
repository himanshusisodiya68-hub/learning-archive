- id: ncert10-ff-4-18
  lvl: ncert-ex
  num: "FF 4 · TT Q7"
  source: NCERT X English · First Flight · Ch 4 · Thinking about the text
  kind: text
  q: |
    What do these statements tell you about Anne Frank as a person?

    (i) We don't seem to be able to get any closer, and that's the problem. Maybe it's my fault that we don't confide in each other.

    (ii) I don't want to jot down the facts in this diary the way most people would, but I want the diary to be my friend.

    (iii) Margot went to Holland in December, and I followed in February, when I was plunked down on the table as a birthday present for Margot.

    (iv) If you ask me, there are so many dummies that about a quarter of the class should be kept back, but teachers are the most unpredictable creatures on earth.

    (v) Anyone could ramble on and leave big spaces between the words, but the trick was to come up with convincing arguments to prove the necessity of talking.
  sol: |
    One possible answer:
    (i) Anne is honest and self-aware. She names the problem, is ready to blame herself and does not just complain.
    (ii) She is imaginative and original. She wants writing to be a relationship, not a list of facts, and so turns her diary into a friend.
    (iii) She is witty and does not take herself too seriously; she jokes about her own arrival.
    (iv) She is confident, outspoken and a little cheeky, with a sharp tongue and a love of exaggeration.
    (v) She is clever and resourceful. She knows that quality lies in good arguments, not in length, and she enjoys a challenge.
  check: none

- id: ncert10-ff-4-19
  lvl: ncert-ex
  num: "FF 4 · TL I"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, I (Compound words)
  kind: text
  q: |
    Look at the following words.

    headmistress, long-awaited, homework, notebook, stiff-backed, outbursts

    These words are compound words. They are made up of two or more words. Compound words can be:
    • nouns: headmistress, homework, notebook, outbursts
    • adjectives: long-awaited, stiff-backed
    • verbs: sleep-walk, baby-sit

    Match the compound words under 'A' with their meanings under 'B'. Use each in a sentence.

    A: 1. Heartbreaking, 2. Homesick, 3. Blockhead, 4. Law-abiding, 5. Overdo, 6. Daydream, 7. Breakdown, 8. Output

    B:
    – obeying and respecting the law
    – think about pleasant things, forgetting about the present
    – something produced by a person, machine or organisation
    – producing great sadness
    – an occasion when vehicles/machines stop working
    – an informal word which means a very stupid person
    – missing home and family very much
    – do something to an excessive degree
  sol: |
    One possible answer (meaning, then a sentence of our own):
    1. Heartbreaking = producing great sadness. The news of the flood was heartbreaking.
    2. Homesick = missing home and family very much. She felt homesick in the first week at the hostel.
    3. Blockhead = an informal word which means a very stupid person. "Don't be a blockhead," he said, "read the question first."
    4. Law-abiding = obeying and respecting the law. Law-abiding citizens stop at a red light.
    5. Overdo = do something to an excessive degree. Do not overdo the exercise on the first day.
    6. Daydream = think about pleasant things, forgetting about the present. He likes to daydream in the last period.
    7. Breakdown = an occasion when vehicles or machines stop working. A breakdown on the highway delayed the bus.
    8. Output = something produced by a person, machine or organisation. The factory has doubled its output this year.
  check: none

- id: ncert10-ff-4-20
  lvl: ncert-ex
  num: "FF 4 · TL II.1"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, II (Phrasal verbs), item 1
