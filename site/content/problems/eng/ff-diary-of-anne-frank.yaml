  num: "FF 4 · OC3 Q2"
  source: NCERT X English · First Flight · Ch 4 · Oral Comprehension Check (after the 20 June entry)
  kind: text
  q: How did Anne justify her being a chatterbox in her essay?
  sol: |
    One possible answer: Anne argued that talking is a student's trait and that she would do her best to keep it under control, but that she would never be able to cure herself of the habit. Her mother talked as much as she did, if not more, and there is not much you can do about inherited traits.
