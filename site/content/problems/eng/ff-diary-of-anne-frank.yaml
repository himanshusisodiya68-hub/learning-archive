- id: ncert10-ff-4-24
  lvl: ncert-ex
  num: "FF 4 · TL IV"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, IV (Using a dictionary for idiomatic expressions)
  kind: text
  q: |
    Do you know how to use a dictionary to find out the meanings of idiomatic expressions? Take, for example, the expression caught my eye in the story. Where — under which word — would you look for it in the dictionary? [Look for it under the first word. But if the first word is a 'grammatical' word like a, the, for, etc., then take the next word. That is, look for the first 'meaningful' word in the expression. In our example, it is the word caught. But you won't find caught in the dictionary, because it is the past tense of catch. You'll find caught listed under catch. So you must look under catch for the expression caught my eye. Which other expressions with catch are listed in your dictionary?] (A partial entry for the noun 'eye' from the Oxford Advanced Learner's Dictionary, 2005, is printed in the book.)

    You have read the expression 'not to lose heart' in this text. Now find out the meanings of the following expressions using the word 'heart'. Use each of them in a sentence of your own.

    1. break somebody's heart
    2. close/dear to heart
    3. from the (bottom of your) heart
    4. have a heart
    5. have a heart of stone
    6. your heart goes out to somebody
  sol: |
    One possible answer. For caught my eye, look under catch (the first meaningful word, in its base form). Other expressions found under catch in a typical dictionary: catch fire, catch sight of, catch somebody's eye, catch one's breath, catch up with, catch cold. [Unverified: the exact list depends on your dictionary.]

    Meanings and sentences:
    1. break somebody's heart = cause someone deep sorrow. The news of the old dog's death broke her heart.
    2. close/dear to heart = very important to you. Saving the school library is close to my heart.
    3. from the (bottom of your) heart = with deep sincerity. I thank you from the bottom of my heart.
    4. have a heart = be kind and sympathetic (often said when asking someone to be less strict). Have a heart, sir, the bus broke down.
    5. have a heart of stone = be unfeeling. Only someone with a heart of stone could ignore a crying child.
    6. your heart goes out to somebody = you feel deep sympathy for them. My heart goes out to the families who lost their homes in the floods.
  check: none

- id: ncert10-ff-4-25
  lvl: ncert-ex
  num: "FF 4 · TL V.1"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, V (Contracted forms), item 1
  kind: text
  q: |
    Make a list of the contracted forms in the text. Rewrite them as full forms of two words. For example: I've = I have
  sol: |
    One possible list from the text (the first lines of the entry and the sketch, then later lines):
    - I've (never written) = I have
    - doesn't = does not
    - I'm (not planning, back, not so worried, not sure) = I am
    - won't = will not
    - don't = do not
    - they're (not liable to change) = they are
    - that's (the problem, just how things are) = that is
    - didn't = did not
    - can't = cannot (can not)
    - I'd (better provide; worry; finished; make sure) = I had / I would (see next question)
    - who'll = who will
    - you're (going to pass) = you are
    - we'll = we will
    - there's (not much you can do) = there is
    - he'd (finally had enough) = he had
    - Mr Keesing's (always making jokes) = Mr Keesing is
    - I've (been allowed) = I have; haven't (been assigned) = have not

    Grandma's candle is not a contraction; the 's shows possession. [Unverified: a complete list needs a line-by-line check of your copy.]
  check: none

- id: ncert10-ff-4-26
  lvl: ncert-ex
  num: "FF 4 · TL V.2"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, V (Contracted forms), item 2
  kind: text
  q: |
    We have seen that some contracted forms can stand for two different full forms: I'd = I had or I would. Find in the text the contracted forms that stand for two different full forms, and say what these are.
  sol: |
    One possible answer: I'd stands for either I had or I would.
    - I had: "I'd better provide a brief sketch" (had better); "after I'd finished the rest of my homework"; "I'd nearly exhausted my ingenuity".
    - I would: "I'd worry about that later"; "I'd make sure the joke was on him".
    Similarly, he'd stands for he had in "he'd finally had enough" (it could stand for he would in other sentences), and 's can stand for is or has (here is: "that's the problem", "Mr Keesing's always making jokes").
  check: none

- id: ncert10-ff-4-27
  lvl: ncert-ex
  num: "FF 4 · TL Contracted forms in a play"
  source: NCERT X English · First Flight · Ch 4 · Thinking about language, V (Contracted forms), the one-act play extract
  kind: text
  q: |
    Here is an extract adapted from a one-act play. In this extract, angry neighbours who think Joe the Inventor's new spinning machine will make them lose their jobs come to destroy Joe's model of the machine. You've just seen how contracted forms can make a written text sound like actual speech. Try to make this extract sound more like a real conversation by changing some of the verbs back into contracted forms. Then speak out the lines.

    [The door is flung open, and several men tramp in. They carry sticks, and one of them, HOB, has a hammer.]

    MOB: Now where is your husband, mistress?
    MARY: In his bed. He is sick, and weary. You would not harm him!
    HOB: We are going to smash his evil work to pieces. Where is the machine?
    SECOND MAN: On the table yonder.
    HOB: Then here is the end of it!
    [HOB smashes the model. MARY screams.]
    HOB: And now for your husband!
    MARY: Neighbours, he is a sick man and almost a cripple. You would not hurt him!
    HOB: He is planning to take away our daily bread… We will show him what we think of him and his ways!
    MARY: You have broken his machine… You have done enough…
  sol: |
    One possible answer (verbs contracted):
    MOB: Now where's your husband, mistress?
    MARY: In his bed. He's sick, and weary. You wouldn't harm him!
    HOB: We're going to smash his evil work to pieces. Where's the machine?
    SECOND MAN: On the table yonder.
    HOB: Then here's the end of it!
    HOB: And now for your husband!
    MARY: Neighbours, he's a sick man and almost a cripple. You wouldn't hurt him!
    HOB: He's planning to take away our daily bread… We'll show him what we think of him and his ways!
    MARY: You've broken his machine… You've done enough…

    Read the lines aloud with the stress on the meaning words (husband, smash, machine), letting the contractions run quickly and the anger rise in Hob's lines.
