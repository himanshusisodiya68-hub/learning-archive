- id: b3
  lvl: board
  kind: text
  q: "(Original problem, CBSE-style long answer, about 100–120 words.) Write a character sketch of Anne Frank on the basis of the extract from her diary."
  sol: |
    One possible model answer: Anne Frank, as she appears in this extract, is a lively and sensitive thirteen-year-old. Though she has a loving family and about thirty friends, she is lonely because she has no one true friend, and she is honest enough to wonder whether this is partly her fault. Her answer is imaginative: she makes her diary a friend and calls it Kitty. She is affectionate; she loves her father, mourns her grandmother and weeps at parting from her headmistress. She is also witty and resourceful. When Mr Keesing punishes her for talking, she argues cleverly and finally writes a verse essay that wins him over. Anne is, in short, honest, warm, spirited and full of humour.
