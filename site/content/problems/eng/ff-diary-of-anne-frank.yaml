  kind: text
  q: |
    Why does Anne need to give a brief sketch about her family? Does she treat 'Kitty' as an insider or an outsider?
  sol: |
    One possible answer: Anne gives the sketch because Kitty would not understand her stories without knowing who her family is and where she comes from. In giving details a close friend would already know, she treats Kitty as an outsider at first, someone to be told everything from the start. But the whole point of the diary is that Kitty should become an insider, a real friend, and telling her about her life is the first step in making her one.
