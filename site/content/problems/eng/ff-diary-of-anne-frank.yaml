  q: Why does Anne provide a brief sketch of her life?
  sol: |
    One possible answer: Anne is writing to Kitty as if to a friend, and she feels Kitty could not follow her stories without some background. So, although she dislikes doing it, she gives a short sketch of her family and her life: her parents' marriage, her sister, the move from Germany to Holland, her school and her grandmother, up to the present date.
