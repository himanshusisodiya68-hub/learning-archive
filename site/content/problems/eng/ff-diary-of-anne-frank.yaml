  q: What tells you that Anne loved her grandmother?
  sol: |
    One possible answer: Anne says "No one knows how often I think of her and still love her" (family sketch, about her grandmother). She also mentions that her grandmother's candle was lit along with the rest on her 1942 birthday, to make up for the quiet one the year before. Remembering her after her death, thinking of her often and including her at the celebration show that she loved her.
