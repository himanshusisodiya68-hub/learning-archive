- id: m5
  lvl: main
  kind: text
  q: "You meet an unfamiliar word in this sentence: 'Her ebullient mood was infectious; within minutes the whole queue was laughing and chatting.' Without a dictionary, work out the likely meaning of ebullient, naming each clue you use and the substitution test you apply. Then say why a word-part guess alone would not be enough."
  sol: |
    Model answer.
    Clues: (1) Cause and effect. Her mood was "infectious" and made "the whole queue laughing and chatting". So the mood is lively and spreads to others. (2) The structure of the sentence: a mood that makes people laugh must be positive and energetic.
    Prediction: ebullient is probably cheerful and full of energy.
    Substitution: "Her cheerful, energetic mood was infectious; within minutes the whole queue was laughing and chatting." The sentence holds together, and its tone is unchanged, so the guess is supported.
    Word parts: the ending *-ent* only marks an adjective and tells nothing about the meaning, and the beginning does not suggest a known prefix to most readers. [Unverified: the word is often linked to a Latin root for bubbling; I have not checked this.] Parts alone would therefore be unreliable, but the sentence's clues are enough.
    [Note] This is a model answer written for this archive.
  check: none
