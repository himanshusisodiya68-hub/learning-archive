  q: |
    Read the passage and answer the questions.

    For six months of the year the road to the village of Dhar is little more than a rumour. Landslides swallow it after every storm, and the nearest hospital, sixty kilometres away, might as well be on the moon. Nurse Kavita arrived with a bag of bandages and a stubborn smile, and found the villagers wary. They were used to promises from the plains that evaporated with the first rain. So she began small: a weekly check on the old, a lesson on boiling water. By winter, mothers who had once hidden from her were queueing outside her one-room clinic.

    (i) What does the writer mean by "little more than a rumour"?
    (ii) Which word in the passage means "cautious and distrustful"?
    (iii) Which word in the passage means "disappeared"? Pick the one used in a comparison with rain.
    (iv) Why were the villagers wary of Nurse Kavita?
    (v) What does the change in the mothers' behaviour by winter show?
  sol: |
    Model answer.
    (i) The road is so often blocked that it barely exists; one hears of it more than one can use it. The next sentence (landslides swallow it) supports this.
    (ii) wary.
    (iii) evaporated.
    (iv) They had been let down before: earlier promises from outsiders vanished quickly, so they did not expect Kavita's help to last. This is inferred from "used to promises from the plains that evaporated".
    (v) It shows that trust had been earned. Small, steady actions (the weekly check, the lesson) proved she meant to stay, so the mothers who hid now came openly.
    [Note] This is a model answer written for this archive, not an official board key.
  check: none

