  q: "In each sentence, name the type of context clue (definition, synonym, contrast, example or cause and effect) and say what the underlined word means. (a) The soldier was so parched that he drank the whole jug at once. (b) Unlike the lenient teacher next door, Mr Rao punished every late arrival. (c) She enjoys hobbies such as chess, kite-flying and birdwatching."
