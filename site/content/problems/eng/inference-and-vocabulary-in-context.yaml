- id: f2
  lvl: found
  kind: mcq
  q: "Use the prefix to decide. The teacher asked us to rewrite the paragraph. What does rewrite mean?"
  opts: ["write again", "write wrongly", "stop writing", "write before"]
  ans: 0
  sol: |
    The prefix *re-* means again, so *rewrite* is to write again. *Mis-* would give "write wrongly", and *pre-* would give "before".
