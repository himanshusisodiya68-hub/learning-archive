- id: b1
  lvl: board
  kind: text
  q: |
    Read the passage and answer the questions.

    Every evening at five, Coach Ibrahim's ground in Nashik filled with boys in torn shoes and borrowed pads. He had no money for a net, so he hung an old fishing net from two bamboo poles and called it the stadium. The parents smiled at the contraption, but the boys practised there until the light faded. Three years later, two of them were chosen for the state team. Asked for his secret, the coach shrugged. "I only gave them a place to be stubborn," he said.

    (i) Choose the option that best gives the meaning of "contraption" as used in the passage: (a) a clever machine (b) a makeshift device (c) a famous building (d) a game.
    (ii) Find a word in the passage that means "taken for a short time on the understanding that it will be returned".
    (iii) Find a word in the passage that is opposite in meaning to "emptied".
    (iv) Why did the parents smile at the contraption?
    (v) What does the coach's remark "a place to be stubborn" suggest about his view of success?
  sol: |
    Model answer.
    (i) (b) a makeshift device. A fishing net hung on bamboo poles and called a stadium is a rough, improvised arrangement; the parents' smile also shows it is not impressive.
    (ii) borrowed ("borrowed pads").
    (iii) filled ("the ground ... filled with boys").
    (iv) They found it amusing and doubted that a fishing net on poles could serve as a proper practice ground. This is inferred from "smiled" together with the net's makeshift nature.
    (v) He believes success comes from the players' own persistence; his part was only to give them space and time to keep trying. The word "only" shows he gives little credit to himself.
    [Note] This is a model answer written for this archive, not an official board key.
  check: none

- id: b2
  lvl: board
