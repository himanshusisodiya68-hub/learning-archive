  kind: mcq
  q: "Unlike his talkative brother, Sam was taciturn and spoke only when asked. What does taciturn mean?"
  opts: ["quiet and reserved", "rude", "very clever", "lazy"]
  ans: 0
  sol: |
    "Unlike" signals a contrast. His brother is talkative, so Sam, who speaks only when asked, is the opposite: quiet and reserved. Nothing in the sentence suggests rudeness, cleverness or laziness.
