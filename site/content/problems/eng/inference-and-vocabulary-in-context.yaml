  q: "The shopkeeper said, 'Let me see what I can do,' glanced at the clock and began counting the notes in the till. What can you infer?"
  opts: ["He is unlikely to give the discount.", "He will certainly give a big discount.", "He is about to close the shop for the year.", "He did not hear the customer."]
