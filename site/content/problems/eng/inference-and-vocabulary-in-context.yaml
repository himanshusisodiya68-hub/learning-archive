- id: m1
  lvl: main
  kind: text
  q: "Arrange each group of words from most favourable to least favourable in connotation, and explain what the choice would tell a reader about the writer's attitude. (a) slim, skinny, thin (b) determined, stubborn, persistent (c) thrifty, stingy, careful"
  sol: |
    One possible model answer.
    (a) slim, thin, skinny. All three denote a lack of body weight; "slim" admires, "thin" is neutral, "skinny" suggests too little.
    (b) persistent, determined, stubborn. "Persistent" praises keeping going; "determined" is positive but neutral; "stubborn" suggests refusing to listen.
    (c) careful, thrifty, stingy. "Careful" and "thrifty" approve of sensible spending; "stingy" blames.
    If a writer chooses the last word in each group for a person, the writer is criticising that person. The facts have not changed, but the attitude, or tone, has.
    [Note] The ordering of neutral words (thin, determined, thrifty) is a judgement and could be argued either way; this is a model answer written for this archive.
  check: none

