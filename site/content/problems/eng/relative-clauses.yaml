- id: b1
  lvl: board
  kind: text
  q: "Join each pair of sentences into one, using the relative pronoun in brackets. (a) I know a man. He plays the sitar. (who) (b) The bag was expensive. I bought it yesterday. (which) (c) Rohan is my neighbour. His sister is a doctor. (whose) (d) This is the park. We played cricket here as children. (where)"
  sol: |
    (a) *I know a man who plays the sitar.*

    (b) *The bag which I bought yesterday was expensive.* (*That* or no pronoun also works: *The bag I bought yesterday was expensive.* It is a defining clause and the pronoun is an object.)

    (c) *Rohan, whose sister is a doctor, is my neighbour.* The name is already specific, so the clause is non-defining and sits between commas.

    (d) *This is the park where we played cricket as children.*

    [Note] Model answers written for this archive, not an official board key.
  check: none

- id: b2
  lvl: board
