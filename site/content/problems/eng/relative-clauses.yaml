  q: "Choose the correct sentence."
  opts: ["Mumbai, that is a large city, is on the coast.", "Mumbai, which is a large city, is on the coast.", "Mumbai which is a large city, is on the coast.", "Mumbai, which is a large city is on the coast."]
  ans: 1
  sol: |
    Mumbai is a name, so the clause is non-defining. That means commas on both sides and *which*, never *that*. The first option uses *that* after a comma, and the third and fourth each miss one comma.
