# Relative clauses. All problems are original (no NCERT items for this leaf). All answers are model answers written by us for this archive; there is no NCERT answer key.

- id: f1
  lvl: found
  kind: mcq
  q: "Complete the sentence: The teacher ___ taught us grammar has moved to another school."
  opts: ["which", "who", "whose", "whom"]
  ans: 1
  sol: |
    The antecedent *teacher* is a person, and the pronoun is the subject of *taught* (she taught us), so *who* is correct. *Which* is for things, *whose* needs a noun after it, and *whom* is an object form.
  check: none

