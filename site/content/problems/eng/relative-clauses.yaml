- id: b4
  lvl: board
  kind: text
  q: "Each sentence has one error in the relative clause. Find it and correct it. (a) The girl which won the prize is my cousin. (b) The film, that we saw on Sunday, was boring. (c) The friend with who I travelled lives in Goa. (d) The pen which I bought it is leaking."
  sol: |
    (a) *which* should be *who*: the antecedent is a person. "The girl who won the prize is my cousin."

    (b) *that* should be *which*: a non-defining clause between commas cannot take *that*. "The film, which we saw on Sunday, was boring."

    (c) *with who* should be *with whom*: after a preposition the pronoun must be *whom*. "The friend with whom I travelled lives in Goa."

    (d) Delete *it*: the pronoun *which* already stands for the pen. "The pen which I bought is leaking."

    [Note] Model answers written for this archive.
  check: none

- id: b5
  lvl: board
  kind: mcq
  q: "In which sentence can the relative pronoun be omitted?"
  opts: ["The man who called you is waiting.", "The song that she sang was beautiful.", "The bus which stops here goes to the airport.", "Anyone who has a ticket may enter."]
  ans: 1
  sol: |
    The pronoun can be dropped only if it is the object of its own clause, with a noun or pronoun after it. In "The song that she sang", *that* is the object of *sang*, and *she* follows it. In the other three sentences a verb follows the pronoun (*called*, *stops*, *has*), so the pronoun is the subject and must stay.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "Combine each pair into one sentence, using a relative clause. Use commas where the clause is non-defining. (a) The scientist won an award. She discovered the comet. (b) My grandmother is eighty. She still walks to the market every day. (c) The horse was a champion. We saw the horse at the fair. (d) The teacher praised Seema. Seema's essay was the best."
  sol: |
    (a) *The scientist who discovered the comet won an award.* The clause tells us which scientist, so it is defining and takes no commas.

    (b) *My grandmother, who is eighty, still walks to the market every day.* Or *My grandmother, who still walks to the market every day, is eighty.* The noun is specific, so the clause is non-defining.

    (c) *The horse that we saw at the fair was a champion.* (*Which*, or no pronoun, is also correct.)

    (d) *The teacher praised Seema, whose essay was the best.* The name is specific, so the clause is non-defining with *whose*.

    [Note] More than one arrangement is possible in (b). A model answer written for this archive.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "Rewrite each sentence with the preposition moved before the relative pronoun, as in formal English. (a) The woman who I spoke to is the principal. (b) The pen that he wrote with was borrowed. (c) The village which they live in has no hospital. (d) The man whose house we stayed in was very kind."
  sol: |
    (a) *The woman to whom I spoke is the principal.*

    (b) *The pen with which he wrote was borrowed.*

    (c) *The village in which they live has no hospital.*

    (d) *The man in whose house we stayed was very kind.*

    After a preposition, people take *whom* and things take *which*; *who* and *that* are not used there. *Whose* can follow a preposition directly.

    [Note] A model answer written for this archive.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "The paragraph below has six errors involving relative clauses (one per line). Find and correct each. (1) I have a friend which lives in Shimla. (2) Her house, that is on a hill, has a lovely garden. (3) The garden, in that she grows roses, is famous. (4) The roses whom she grows are red. (5) My friend, who I met in 2018 is a painter. (6) She sold a painting that I liked it."
  sol: |
    (1) *which* should be *who*: the antecedent *friend* is a person.

    (2) *that* should be *which*: the clause is non-defining (between commas), where *that* is not allowed.

    (3) *in that* should be *in which*: after a preposition, *that* cannot be used.

    (4) *whom* should be *which* (or *that*): *roses* are things, and *whom* is for people.

    (5) A comma is missing after *2018*: "My friend, who I met in 2018, is a painter." (*Whom* is the formal form.) Both commas must enclose the non-defining clause.

    (6) Delete *it*: "She sold a painting that I liked." The pronoun *that* already stands for the painting.

    [Note] Model answer written for this archive.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "Explain the difference in meaning between the two sentences, and say how many cousins the speaker probably has in each case. (a) My cousin who lives in Chennai is a lawyer. (b) My cousin, who lives in Chennai, is a lawyer."
  sol: |
    In (a) the clause is defining: it tells us which cousin is meant. That suggests the speaker has more than one cousin, and the one who lives in Chennai is a lawyer.

    In (b) the commas make the clause non-defining: it only adds a fact about the cousin, who is already identified. That suggests the speaker has one cousin (at least one cousin in mind), who happens to live in Chennai.

    So the commas are not decoration: they change how many people the writer has in mind.

    [Note] The implied number of cousins is an inference from the usual convention, not a strict rule: a speaker could use (b) for one chosen cousin among several. [Inference]
  check: none
