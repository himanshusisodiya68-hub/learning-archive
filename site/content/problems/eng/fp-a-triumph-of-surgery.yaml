- id: b4
  lvl: board
  kind: text
  q: |
    Explain the irony in the title "A Triumph of Surgery" in two to three sentences. (About 50 words.)
  sol: |
    Model answer (about 50 words): Mrs Pumphrey thinks the vet's skilful surgery has saved her dog, so she thanks him for "a triumph of surgery". In fact he performed no operation and gave no medicine; Tricki recovered through plain food and exercise. The gap between her belief and the facts makes the title ironic.
  check: none

- id: m1
  lvl: main
  kind: text
  q: |
    The narrator tells the story in the first person. Choose any two sentences from the story where his private thoughts add humour, and explain how the first-person voice helps the effect. (Quote no more than a short phrase.)
  sol: |
    One possible model answer: Two examples are the narrator's description of the "extras" (his dry comment that Tricki's "only fault was greed", and the line where he and his partners realise "the real possibilities of the situation" when the wine begins to arrive). In the first, he gives a short, flat verdict and leaves the reader to see how the owner has made it worse. In the second, he confesses his own pleasure with a straight face. Because he speaks as "I", the reader gets his private amusement directly, and he can be gently comic about himself as well as about Mrs Pumphrey.
  check: none

- id: m2
  lvl: main
  kind: text
  q: |
    Compare how the story uses similes for Tricki in the first and second halves. What does the pair of comparisons show, and which technique is it (simile, metaphor or hyperbole)?
  sol: |
    Model answer: At the start Tricki is "like a bloated sausage with a leg at each corner", and later he fights "like a tiger" for his share of food. Both are similes, because each uses the word "like" to compare. The first makes him look helpless, round and almost comic; the second shows him strong, fierce and in command. Placing the two side by side marks his transformation from a pampered, overfed pet to a lean and lively dog, without the narrator needing to explain the change. The second is also mildly hyperbolic, because a small dog is not really a tiger.
  check: none

