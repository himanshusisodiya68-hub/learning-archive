- id: b3
  lvl: board
  kind: text
  q: |
    Answer in about 120 words.
    "Mrs Pumphrey is foolishly indulgent but not cruel." Do you agree? Support your answer with evidence from the story.
  sol: |
    Model answer (about 120 words): I agree. Mrs Pumphrey is foolishly indulgent because she gives Tricki cream cakes, chocolates and Horlicks, and she cannot bear to refuse him anything even after the vet's warning. She dresses him in a wardrobe of coats and keeps beds and bowls for every hour of the day. Yet she is not cruel. She truly loves him: she is "distraught" when he stops eating, rings the surgery a dozen times a day, and weeps with joy when he returns. Her fault is lack of sense, not lack of feeling. The story laughs at her kindly, and shows that love needs judgement to do real good.
