  kind: text
  q: |
    Answer in about 100 to 120 words.
    Describe how Tricki changed during his stay at the surgery, and why.
  sol: |
    Model answer (about 110 words): At the start, Tricki was fat, listless and bloodshot-eyed. For two days he was given only water; on the third day he began to take interest in the other dogs. Soon he was running with them, tumbling in their rough games and fighting for his share of food, even hunting rats at night. He took no medicine at all. The change came about because he was away from rich food and cushions, and was free to run, play and eat ordinary dog meals. After two weeks he was lean, muscular and cheerful, so lively that he leaped from the vet's arms into Mrs Pumphrey's lap.
