  q: |
    What would you have done if you were:
    (i) a member of the staff in Mrs Pumphrey's household,
    (ii) a neighbour? What would your life have been like, in general?
  sol: |
    One possible model answer: (i) As a member of staff I would have found it hard to disagree with my employer, but I would have tried to hint politely that Tricki needed fewer treats and more walks, perhaps by offering to take him out myself. My life would have been comfortable but tiring, and I would have been running errands for a dog's every whim. (ii) As a neighbour I would have tried a friendly word, perhaps by praising Tricki's coat and suggesting a game outdoors. I would have kept my distance from the fuss, but I would also have felt sorry for her loneliness and for the dog.
