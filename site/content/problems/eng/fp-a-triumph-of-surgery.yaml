# A Triumph of Surgery. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 1. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-1-1
  lvl: ncert-ex
  num: "FP 1 · RF1 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (first set)
  kind: text
  q: Why is Mrs Pumphrey worried about Tricki?
  sol: |
    One possible model answer: Mrs Pumphrey is worried because Tricki seems listless and weak, with no energy. She thinks he is suffering from malnutrition. Later he refuses all food, vomits and lies panting on a rug, which alarms her still more. (In fact the real cause of his illness is overeating and lack of exercise.)
  check: none

- id: ncert10-fp-1-2
  lvl: ncert-ex
  num: "FP 1 · RF1 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (first set)
  kind: text
  q: What does she do to help him? Is she wise in this?
  sol: |
    One possible model answer: She gives him "little extras" between meals: malt, cod-liver oil, a bowl of Horlicks at night, cream cakes and chocolates. She also keeps him in comfortable coats and does not make him exercise. She is not wise, because the extra food makes an already greedy dog even fatter, and the narrator, a vet, has already told her to cut down on sweet things and give him exercise. Her love is real, but her judgement is poor.
  check: none

- id: ncert10-fp-1-3
  lvl: ncert-ex
  num: "FP 1 · RF1 Q3"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (first set)
  kind: text
  q: Who does 'I' refer to in this story?
  sol: |
    'I' refers to the narrator, Mr Herriot, the veterinary surgeon. He tells the story in the first person, so we see Tricki's illness, the cure and Mrs Pumphrey's behaviour through his eyes. (The chapter is signed James Herriot, the author.)
  check: none

- id: ncert10-fp-1-4
  lvl: ncert-ex
  num: "FP 1 · RF2 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (second set)
  kind: text
  q: Is the narrator as rich as Tricki's mistress?
  sol: |
    One possible model answer: No. Mrs Pumphrey is wealthy: she has servants, a chauffeur and a car about thirty feet long, and she can order eggs, wine and brandy by the dozen. The narrator is an ordinary country vet who shares his work with partners, and the gifts feel like a treat to his household. His comfort comes from her generosity, not from his own wealth.
  check: none

- id: ncert10-fp-1-5
  lvl: ncert-ex
  num: "FP 1 · RF2 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (second set)
  kind: text
  q: How does he treat the dog?
  sol: |
    One possible model answer: He treats Tricki kindly and sensibly. He wraps him in a blanket, speaks gently to him ("Poor old lad"), gives him water but no food for two days, and puts him in a warm loose box. Then he lets him run with the other dogs and eat ordinary meals. He gives no medicine at all. He treats Tricki as a dog, not as a spoiled baby.
  check: none

- id: ncert10-fp-1-6
  lvl: ncert-ex
  num: "FP 1 · RF2 Q3"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (second set)
  kind: text
  q: Why is he tempted to keep Tricki on as a permanent guest?
  sol: |
    One possible model answer: While Tricki stays at the surgery, Mrs Pumphrey sends gifts to build up his strength: fresh eggs by the dozen, then bottles of wine, then brandy. The vet and his partners enjoy two eggs each for breakfast, wine at lunch and brandy by the fire. These were "days of deep content", so he is tempted to keep Tricki longer so the gifts would go on arriving. He only phones her because he knows she is suffering.
  check: none

- id: ncert10-fp-1-7
  lvl: ncert-ex
  num: "FP 1 · RF2 Q4"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Read and find out (second set)
  kind: text
  q: Why does Mrs Pumphrey think the dog's recovery is "a triumph of surgery"?
  sol: |
    One possible model answer: Mrs Pumphrey sees only that her dog went to the vet's surgery very ill and came back healthy, and she assumes the vet cured him by some skilful treatment. She does not know that Tricki was simply starved for two days, then allowed to exercise and eat plain food with the other dogs. So she credits "surgery" for what was really common sense. The phrase is ironic, since there was no operation.
  check: none

- id: ncert10-fp-1-8
  lvl: ncert-ex
  num: "FP 1 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Think about it
  kind: text
  q: What kind of a person do you think the narrator, a veterinary surgeon, is? Would you say he is tactful as well as full of common sense?
  sol: |
    One possible model answer: The narrator is a practical, kind and good-humoured man who knows his job and understands people as well as animals. He is full of common sense because he sees at once that Tricki is ill from overfeeding and lack of exercise, and cures him by taking away the cause. He is tactful because he never mocks Mrs Pumphrey. He speaks to her politely, tries to sound firm without being rude, hospitalises the dog "for observation" instead of blaming her, and gives her cheerful bulletins. He is also honest enough to enjoy the gifts openly, which makes him a believable human being.
  check: none

- id: ncert10-fp-1-9
