  source: NCERT X English · Footprints Without Feet · Ch 1 · Think about it
  kind: text
  q: Do you think Tricki was happy to go home? What do you think will happen now?
  sol: |
    One possible model answer: Tricki was probably delighted to see Mrs Pumphrey, since he leaped from the vet's arms into her lap and licked her face. But after two weeks of freedom with the other dogs, he may not be happy to return to a life of cushions and coats. As for what happens next, there are two likely futures. Either Mrs Pumphrey, glad to have him fit, will keep him on the new diet and take him for walks. Or, being Mrs Pumphrey, she will start spoiling him again, and Mr Herriot will have another case of the same illness. This is a prediction, not a fact from the text.
