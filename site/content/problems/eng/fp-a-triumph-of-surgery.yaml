- id: m4
  lvl: main
  kind: text
  q: |
    "The rich woman in the story is shown with gentle satire, not scorn." Write a short paragraph (about 100 words) explaining what the writer gains by choosing gentle satire. Refer to two details.
  sol: |
    One possible model answer: Gentle satire lets the reader laugh at Mrs Pumphrey's foolishness without hating her. The writer exaggerates details such as the thirty-foot car, the maids rushing out with beds and bowls, and the wardrobe of coats, which makes her seem comic. But he also lets us see her tears, her trembling lips and her real love, so we pity her too. Because we are amused, not angry, the lesson that love without sense does harm arrives more easily. Scorn would turn her into a villain and make the story harsher and less true to life.
  check: none
