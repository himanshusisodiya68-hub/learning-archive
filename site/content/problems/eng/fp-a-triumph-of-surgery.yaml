  lvl: ncert-ex
  num: "FP 1 · TA Q4"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Talk about it
  kind: text
  q: What would you have done if you were in the narrator's place?
  sol: |
    One possible model answer: I would have given the same advice, but I would have explained it more plainly: "Tricki is ill because he eats too much and does not move enough." I would also have asked Mrs Pumphrey to help with the cure, for example by walking him daily, so she would feel useful. I would have told her the truth when she praised my "surgery", gently, so she would not repeat the mistake, and I would have politely refused the gifts. That is one possible answer; the narrator himself chooses to enjoy the gifts and keep quiet.
