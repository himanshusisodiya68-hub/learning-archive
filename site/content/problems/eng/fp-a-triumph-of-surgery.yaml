- id: ncert10-fp-1-11
  lvl: ncert-ex
  num: "FP 1 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Talk about it
  kind: text
  q: This episode describes the silly behaviour of a rich woman who is foolishly indulgent, perhaps because she is lonely. Do you think such people are merely silly, or can their actions cause harm to others?
  sol: |
    One possible model answer: I think such people can cause real harm, although they mean well. Mrs Pumphrey nearly ruins Tricki's health, and the household staff must run around obeying her whims. Indulgence also spreads: it teaches others to flatter and not to speak the truth. Loneliness explains her behaviour, and deserves sympathy, but it does not excuse it. A silly habit that harms someone who cannot say no, like a dog or a child, is more than merely silly.
  check: none

- id: ncert10-fp-1-12
  lvl: ncert-ex
  num: "FP 1 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 1 · Talk about it
  kind: text
  q: Do you think there are also parents like Mrs Pumphrey?
  sol: |
    One possible model answer: Yes, there are. Some parents cannot refuse their children anything: sweets, gadgets, money, or being let off chores and homework. They do it out of love, or because they are busy or guilty, and they find it hard to say no. Like Tricki, such children may become unhealthy or unable to cope with disappointment. Of course, many parents do balance love with firmness, and no parent is perfect.
  check: none

