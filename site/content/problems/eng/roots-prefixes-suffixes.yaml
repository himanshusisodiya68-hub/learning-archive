- id: m2
  lvl: main
  kind: text
  q: "A sign says 'INFLAMMABLE: keep away from fire'. A traveller says, 'The prefix in- means not, so it must be safe near fire.' Explain what is wrong, and give the safe wording used today."
  sol: |
    Model answer: The traveller is wrong because *in-* has two meanings. In *incorrect* it means "not", but in *inflammable* it means "in" or "into": the word comes from setting something in flames, so it means "easily set on fire". *Inflammable* and *flammable* mean the same.

    Because the confusion could be dangerous, safety signs today use **flammable** (can burn) and **non-flammable** (cannot burn). *Invaluable* is a similar trap: it means very valuable, not worthless.

    [Note] This is a model answer written for this archive.
  check: none

