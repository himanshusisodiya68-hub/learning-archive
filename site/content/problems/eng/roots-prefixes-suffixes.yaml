- id: b1
  lvl: board
  kind: text
  q: "Fill each gap with the correct form of the word in brackets. (1) Her ___ act saved three children. (courage) (2) The new rule caused great ___ among the students. (confuse) (3) He spoke ___ to the guest. (rude) (4) The scientist's ___ changed medicine. (discover) (5) The exam was so long that finishing it in an hour was ___. (possible)"
  sol: |
    Model answer: (1) courageous, (2) confusion, (3) rudely, (4) discovery, (5) impossible.

    (1) A noun (*act*) follows, so an adjective is needed: *courage* + *-ous* = courageous.
    (2) After *great*, a noun: *confuse* becomes *confusion*.
    (3) The word describes the verb *spoke*, so an adverb: *rude* + *-ly* = rudely.
    (4) After the possessive *scientist's* a noun is needed: *discover* becomes *discovery*.
    (5) The sentence says finishing was out of the question, so the opposite of *possible* is needed: *impossible* (in- before p becomes im-).

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

- id: b2
  lvl: board
  kind: mcq
  q: "Read the sentence: 'The old well was inexhaustible; it never ran dry even in the hottest summer.' The word 'inexhaustible' means:"
  opts: ["easily emptied", "that cannot be used up", "very tired", "not clean"]
  ans: 1
  sol: |
    Cut the word: *in-* (not) + *exhaust* (use up, drain) + *-ible* (can be). So it means "that cannot be used up", which the rest of the sentence ("never ran dry") confirms. *Very tired* uses the other sense of exhausted and ignores the prefix.
