  q: "Which word is the correct opposite of 'possible'?"
  opts: ["unpossible", "impossible", "dispossible", "inpossible"]
  ans: 1
  sol: |
    The prefix *in-* (not) changes to *im-* before the letters b, m and p, so the opposite is *impossible*. The other three are not English words.
