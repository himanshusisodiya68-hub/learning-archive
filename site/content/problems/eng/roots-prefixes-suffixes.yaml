- id: b3
  lvl: board
  kind: text
  q: "Read the passage: 'At the village fair, Mohan was a visible figure, always generous with sweets and quick to agree to any plan. His brother, in contrast, was reserved and often unwilling to join.' Find a word in the passage that means the opposite of each: (a) invisible, (b) stingy, (c) disagree, (d) willing."
  sol: |
    Model answer: (a) visible, (b) generous, (c) agree, (d) unwilling.

    (a) *invisible* is *in-* + *visible*; the passage uses the base word *visible*.
    (b) *stingy* has no prefix pair; the passage gives *generous* as its opposite.
    (c) *dis-* + *agree* is *disagree*, so the opposite is the base word *agree*.
    (d) *un-* + *willing* is *unwilling*, so the opposite of *willing* is *unwilling*, which the passage uses for the brother.

    [Note] This is a model answer written for this archive.
