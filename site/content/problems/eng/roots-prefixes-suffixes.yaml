- id: b5
  lvl: board
  kind: text
  q: "Each sentence has one error in the form of a word. Find and correct it. (a) He is very carefull about money. (b) The teacher was unsatisfy with the answers. (c) She happyly accepted the gift. (d) It was an unforgetable trip."
  sol: |
    Model answer: (a) carefull should be *careful* (-ful has one l). (b) unsatisfy should be *dissatisfied* (or *unsatisfied*), an adjective is needed after *was*. (c) happyly should be *happily* (y changes to i before -ly). (d) unforgetable should be *unforgettable* (forget doubles its t before a vowel suffix).

