- id: m4
  lvl: main
  kind: text
  q: "Join the prefix and the root and write the word that results. Say what happens at the joint in each case. (a) ad + tract, (b) con + lect, (c) in + mature, (d) sub + press, (e) in + rational."
  sol: |
    Model answer: (a) *attract*: the d of ad- becomes t before t. (b) *collect*: the n of con- becomes l before l. (c) *immature*: in- becomes im- before m. (d) *suppress*: the b of sub- becomes p before p. (e) *irrational*: in- becomes ir- before r.

    This process is called **assimilation**: the last sound of the prefix becomes like the first sound of the root, which makes the word easier to say.

    [Note] This is a model answer written for this archive.
  check: none

- id: m5
  lvl: main
  kind: text
  q: "A student says: 'Decimate comes from the Latin word for ten, so it must mean to kill one in ten. Writing that a flood decimated the village is a mistake.' Respond in a short paragraph. What does the example teach about using roots?"
  sol: |
    Model answer: The root gives the word's origin, not its present meaning. Decimate did once refer to killing one in ten (the Roman practice is usually cited, though I am not certain of the details [Unverified]), but through use it has widened to mean destroying a large part of something. Many careful writers still prefer the narrower sense, so in a formal answer it is safe to use a clearer verb such as *devastated*. Still, the student is wrong to treat a word's history as a rule for today.

    The lesson is that a root is a clue that gives a good first guess, and the sentence and a dictionary confirm it. The same is true of *awful*, which once meant full of awe.

    [Note] This is one possible model answer written for this archive; the point about formal usage is a matter of style, not a fixed rule.
  check: none
