  q: "The suffix -less in 'careless' means:"
  opts: ["full of", "without", "again", "able to be"]
  ans: 1
  sol: |
    *-less* means without, so *careless* is without care. *-ful* is the suffix that means full of (*careful*), *re-* means again, and *-able* means able to be.
