  q: "Match each situation with the most suitable proverb from the box. Box: Pride goes before a fall / Make hay while the sun shines / Look before you leap / Too many cooks spoil the broth. (i) Kabir invested all his savings in a company without reading a single page about it and lost most of them. (ii) A shop sells umbrellas, and the owner stocks up in June, just before the rains. (iii) Six students quarrelled over how to design the school magazine cover, and the cover was never finished. (iv) A cricketer who claimed that no bowler could get him out was bowled first ball."
  sol: |
    Model answer.

    (i) Look before you leap. He acted without thinking about the result.
    (ii) Make hay while the sun shines. He prepares for the season in which sales will be good.
    (iii) Too many cooks spoil the broth. Too many people with their own plans ruined the work.
    (iv) Pride goes before a fall. His boast was followed by failure.

    Method: strip each story to a rule first (think before acting; use the season; too many managers; boasting ends badly), then pick the proverb that states it.

