- id: m1
  lvl: main
  kind: text
  q: "'Look before you leap' and 'He who hesitates is lost' seem to say opposite things. Explain, with one example for each, how both can be sensible advice."
  sol: |
    One possible model answer.

    Each proverb is a rule of thumb that holds within a range of situations, not a law that holds everywhere.

    *Look before you leap* suits decisions that are big and hard to undo. Before choosing a stream in Class 11, or lending a large sum to a friend, it pays to check the facts first, because a wrong step is costly and cannot easily be taken back.

    *He who hesitates is lost* suits situations in which the chance is about to close. If a cricketer sees a clear run-out chance and stops to think, the batter is safe by the time he throws.

    So the question to ask is: What is at stake, and is the chance about to close? If the cost of a mistake is high and there is time, look first; if the moment is passing and the cost of trying is small, act.

    This is one possible model answer written for this archive, not an official board key.
  check: none

- id: m2
  lvl: main
