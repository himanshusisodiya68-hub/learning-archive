  q: "Give the English proverb that is the equivalent of each Hindi saying, not a word-for-word translation. (a) Jiski lathi uski bhains. (b) Ek aur ek gyarah. (c) Bahut jogi math ujad. (d) Jo garajte hain woh barasate nahi."
  sol: |
    Model answer.

    (a) Might is right. The one with power gets his way, whatever the justice of it.
    (b) Union is strength. Two together are much stronger than two separate ones (one plus one is eleven, not two).
    (c) Too many cooks spoil the broth. Too many people in charge ruin the work.
    (d) Barking dogs seldom bite. Those who make the loudest threats rarely carry them out.

    Equivalents carry the same lesson in a different image. Translating (a) as "He who has the stick owns the buffalo" would be correct as a translation but would not count as the English equivalent.

