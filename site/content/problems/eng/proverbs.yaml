- id: b4
  lvl: board
  kind: text
  q: "Write the opening paragraph (about 80 words) of an article on the topic 'Honesty is the best policy'. Begin with the proverb and explain it in your own words."
  sol: |
    One possible model answer.

    "Honesty is the best policy," as the old saying goes. It means that telling the truth and playing fair may sometimes cost us a little today, but in the end they bring us trust, and trust is worth more than any quick gain. A shopkeeper who gives the right change keeps his customers for life. A student who owns up to a mistake earns the teacher's respect. In a world full of shortcuts, honesty is still the road that takes us furthest.

    Marking checklist: the proverb is quoted exactly (1); its meaning is explained in the writer's own words (1); at least one concrete example (1); a clear link to the topic and a closing sentence (1); correct grammar and spelling (1).

