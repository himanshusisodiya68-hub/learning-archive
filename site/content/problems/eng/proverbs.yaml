- id: m3
  lvl: main
  kind: text
  q: "Report each sentence in indirect speech. (a) The teacher said, 'A stitch in time saves nine.' (b) My grandfather said to me, 'You were late yesterday, and honesty is the best policy.' Explain why the tense of the proverb does or does not change."
  sol: |
    Model answer.

    (a) The teacher said that a stitch in time saves nine.

    (b) My grandfather told me that I had been late the day before and that honesty is the best policy.

    A proverb states a general truth, which is true now as well as then. When the reported words are a universal truth, the tense does not shift back even if the reporting verb is in the past. Ordinary facts do shift: *you were late yesterday* becomes *I had been late the day before*. The proverb in (b) stays in the present.

    This is a model answer written for this archive, not an official board key.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "'Spare the rod and spoil the child' is an old proverb. In about 100 words, say what it means, what is true in it, and why many people today disagree with it."
  sol: |
    One possible model answer.

    "Spare the rod and spoil the child" means that if a child is never punished, he or she will grow up badly behaved. The wise part of it is that children do need firm limits and clear rules; without them they do not learn to care about others. But the proverb is usually taken to mean beating, and many people now disagree. Studies and experience suggest that fear teaches children to hide mistakes, not to avoid them. Calm explanation, fair consequences and the example of adults teach more lastingly. Discipline is necessary, but discipline need not mean pain.

    Checklist: states the meaning (1); identifies what is true (1); a reasoned objection (1); a balanced conclusion (1). Origin of the saying is often credited to the Bible, [Unverified], and is not needed for the answer.

    This is one possible model answer written for this archive, not an official board key.
  check: none

- id: m5
  lvl: main
  kind: mcq
  q: "Which of these situations is best described by the proverb 'Too many cooks spoil the broth'?"
  opts: ["Twenty villagers together lift a fallen tree off the road in a minute.", "Four members of a quiz team each shout a different answer at the last moment, and the team loses the point.", "A family saves a little every month to buy a car.", "A shopkeeper returns a wallet he found."]
  ans: 1
  sol: |
    The rule is that too many people trying to decide one thing at once spoils the result. Option B shows that: four people give four different answers on a single question and the team loses. Option A is a case of *many hands make light work* (a task that divides well), C is about steady saving, and D about honesty.
  check: none
