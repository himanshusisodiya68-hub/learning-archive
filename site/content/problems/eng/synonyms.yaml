- id: f5
  lvl: found
  kind: text
  q: "Give two synonyms for each word, and say in a few words how the two synonyms differ in strength or feeling: (a) begin (b) tired."
  sol: |
    One possible model answer.

    (a) *begin*: *start* and *commence*. Start is everyday and informal; commence is formal and fits official writing ("The meeting will commence at ten").

    (b) *tired*: *weary* and *exhausted*. Weary suggests a long, drawn-out tiredness; exhausted is stronger and means completely drained of energy.

    [Note] Other pairs are also correct, for example *launch* or *embark* for begin, and *sleepy* or *drained* for tired, as long as the difference is explained.
  check: none

- id: b1
  lvl: board
  kind: text
  q: "Read the passage and answer the questions that follow. Meena's village had suffered a long drought, and the harvest was meagre. Most families were reluctant to spend even a small sum, but the schoolteacher, a diligent and cheerful woman, persuaded them to dig a shared well. Within a month the villagers, who had been bewildered by their misfortune, were working together, and soon there was ample water for every field. Find a word or phrase from the passage that means the same as: (a) hardworking (b) scanty (c) unwilling (d) confused (e) more than enough."
  sol: |
    Model answer.

    (a) **diligent**: "a diligent and cheerful woman" describes someone who works with care and effort. It is an adjective, as *hardworking* is.

    (b) **meagre**: "the harvest was meagre" means the harvest was small in amount. Both are adjectives.

    (c) **reluctant**: "reluctant to spend" means not willing to spend.

    (d) **bewildered**: "bewildered by their misfortune" means puzzled and confused. Note that the word is taken in the form it has in the passage.

    (e) **ample**: "ample water for every field" means more than enough.

    [Note] This is a model answer written for this archive, not an official board key. The passage is original.
  check: none

