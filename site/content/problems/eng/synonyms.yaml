- id: b3
  lvl: board
  kind: text
  q: "Replace each underlined phrase with a single, more precise verb from the same family. (a) The child *said softly* in the dark corridor, \"Is anyone there?\" (b) The soldiers *walked in a steady rhythm* across the parade ground. (c) The boy *looked angrily* at the umpire."
  sol: |
    One possible model answer.

    (a) *whispered*: speaking very softly, often to avoid being heard.

    (b) *marched*: walking in step, in a firm and regular rhythm.

    (c) *glared*: looking at someone angrily for a moment or longer.

    Each new verb carries the manner of the action inside it, so the adverb is no longer needed. *Murmured* for (a) is also acceptable.
  check: none

