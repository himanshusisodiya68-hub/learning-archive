- id: b5
  lvl: board
  kind: text
  q: "(a) Write one sentence each for *famous* and *notorious* to show how they differ. (b) Explain why the sentence \"The thief robbed the jewellery\" is wrong and correct it."
  sol: |
    One possible model answer.

    (a) *The famous cricketer was welcomed by thousands of fans.* (Famous is neutral or positive: known by many.) *The notorious smuggler was finally arrested.* (Notorious: known widely for something bad.)

    (b) *Rob* is followed by the person or place that is robbed, not by the thing taken. *Steal* is followed by the thing taken. The corrected sentence is "The thief stole the jewellery" or "The thief robbed the shop".
  check: none

- id: m1
  lvl: main
  kind: text
  q: "Arrange these five words from the weakest to the strongest feeling of happiness: ecstatic, content, delighted, pleased, happy. Then say which pair of neighbours is hardest to separate and why."
  sol: |
    One possible model answer: content, pleased, happy, delighted, ecstatic.

    *Content* is a quiet satisfaction, *pleased* a mild positive reaction, *happy* a general good feeling, *delighted* strong and showing outwardly, and *ecstatic* an extreme joy.

    The hardest pair to separate is *pleased* and *happy*, since many speakers would swap their order and the difference depends on how a word is used in the sentence. This is a judgement, and the main point is that a ladder gives a reasonable order, not a fixed one.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "A company announces that it is \"releasing talent\" and \"rightsizing the workforce\". (a) Name the figure of speech. (b) Translate the announcement into plain words. (c) Why might the company prefer the softer phrase?"
  sol: |
    Model answer.

    (a) Euphemism: a softer phrase put in place of a harsh one.

    (b) "The company is sacking some of its employees" (or "ending the jobs of some employees").

    (c) The soft phrase lessens the shock and may protect the company's image, but it can also hide the human cost, so a careful reader translates it back to the plain version.
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: "A science report calls the same liquid \"the solution\" in one sentence, \"the fluid\" in the next and \"the mixture\" in the third. What is the main fault?"
  opts: ["The reader may think three different substances are meant.", "The words are too long for a report.", "The report should use more adjectives.", "Synonyms are never allowed in English."]
  ans: 0
  sol: |
    In technical writing, a changed word signals a changed thing. *Solution*, *fluid* and *mixture* mean different things in science, so swapping them for variety may leave the reader unsure what is being described. Fixed terms should stay fixed. The other options are not true statements about the problem.
  check: none

