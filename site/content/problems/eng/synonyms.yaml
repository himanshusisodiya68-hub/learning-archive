- id: m5
  lvl: main
  kind: text
  q: "Give a suitable synonym for *dull* in each sentence, and say why the three synonyms cannot replace one another. (a) The knife was too dull to cut the rope. (b) The lecture was so dull that half the class fell asleep. (c) It was a dull morning, with grey clouds covering the sky."
  sol: |
    Model answer.

    (a) *blunt*: not sharp.
    (b) *boring* (or *tedious*): not interesting.
    (c) *overcast* (or *grey*): cloudy and without sunlight.

    The word *dull* has several senses (polysemy), and each sense has its own synonyms. "A boring knife" or "a blunt lecture" makes no sense, since each synonym fits only the sense it replaces. This is why you must decide the sense in the sentence before searching for a synonym.
  check: none
