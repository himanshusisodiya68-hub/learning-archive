  source: Original
  kind: text
  q: |
    Look at these two sentences written in the style of the chapter (the first is a paraphrase, the second is close to the text). In each, name the pair of ideas that are contrasted and the word or phrase that signals the contrast, and say why the contrast makes the sentence stronger.

    (a) Only moments before, the generals saluted him; not so many years before, they would have arrested him.
    (b) Perhaps it requires such depths of oppression to create such heights of character.
  sol: |
    (a) Contrast: saluting him and arresting him (present loyalty against past hostility). Signal: "Only moments before" set against "not so many years before". The contrast measures how far the country has come and makes the salute more striking.
    (b) Contrast: depths and heights, that is, the lowest point of cruelty and the highest point of human character. The opposite words give the sentence its balance. Placing them side by side makes the idea that great suffering can reveal great character strong and memorable.
