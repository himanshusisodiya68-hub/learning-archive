  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (second set)
  kind: text
  q: |
    How does Mandela describe the systems of government in his country (i) in the first decade, and (ii) in the final decade, of the twentieth century?
  sol: |
    Model answer: (i) In the first decade of the twentieth century, white South Africans settled their differences after the Anglo-Boer war and built a system of racial domination against the dark-skinned people of their own land. He calls it the basis of one of the harshest, most inhumane societies the world has known.
    (ii) In the final decade, that system had been overturned for ever and replaced by one that recognised the rights and freedoms of all peoples, regardless of the colour of their skin.
