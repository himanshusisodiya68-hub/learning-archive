  q: Mandela says the oppressor must be liberated "just as surely as the oppressed". Explain what he means, and say whether you agree. Answer in about 120 words.
  sol: |
    One possible answer: Mandela believes that a person who takes away another's freedom is not himself free. He is a prisoner of hatred, locked behind the bars of prejudice and narrow-mindedness. Oppressor and oppressed are alike robbed of their humanity, so no one is truly free until everyone is. This is why Mandela refuses to seek revenge on his old enemies and instead invites them into the new nation.

    I agree. A person who keeps others down must live in fear and suspicion and must keep defending his privilege. He also loses the chance to see others as equals and as friends. A society that allows only some people to be free is divided and unstable. Freeing the oppressor from hatred is therefore not kindness only to him; it is the condition for a lasting peace. (about 125 words)
