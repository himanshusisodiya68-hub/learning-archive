- id: ncert10-ff-2-12
  lvl: ncert-ex
  num: "FF 2 · OC2 Q4"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (second set)
  kind: text
  q: |
    What does courage mean to Mandela?
  sol: |
    Model answer: To Mandela courage does not mean having no fear. He learnt from his comrades, who stood up to attacks and torture without breaking, that courage is the triumph over fear. A brave person is not someone who feels no fear but someone who conquers it and acts anyway.
