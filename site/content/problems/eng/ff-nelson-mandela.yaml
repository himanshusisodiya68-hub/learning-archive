- id: ncert10-ff-2-19
  lvl: ncert-ex
  num: "FF 2 · TT Q3"
  source: NCERT X English · First Flight · Ch 2 · Thinking about the text
  kind: text
  q: |
    Would you agree that the "depths of oppression" create "heights of character"? How does Mandela illustrate this? Can you add your own examples to this argument?
  sol: |
    One possible answer (an opinion question, so other well-argued views are also acceptable): Partly. Mandela does not say oppression is good; he calls apartheid a deep wound. His point is that it had an unintended effect, producing leaders such as Oliver Tambo, Walter Sisulu, Chief Luthuli, Yusuf Dadoo, Bram Fischer and Robert Sobukwe, whose courage, wisdom and generosity may never be matched. Men and women risked their lives for an idea and withstood torture without breaking. My own examples: leaders of India's freedom struggle, and B. R. Ambedkar, who faced severe discrimination and became chairman of the Drafting Committee of the Constitution [general knowledge, not from the chapter]. A fair argument adds that oppression does not turn everyone into a hero. It breaks some people, so the character shown by those who rise above it deserves special praise.
  check: none

- id: ncert10-ff-2-20
  lvl: ncert-ex
  num: "FF 2 · TT Q4"
  source: NCERT X English · First Flight · Ch 2 · Thinking about the text
  kind: text
  q: |
    How did Mandela's understanding of freedom change with age and experience?
  sol: |
    Model answer: As a boy he thought freedom meant playing and roaming his village, and later he saw this was an illusion because it had already been taken from him. As a student he wanted only transitory freedoms for himself, such as staying out late and reading what he liked. In Johannesburg he wanted the basic and honourable freedoms: to achieve his potential, earn a living and have a family. Finally he realised that his own freedom was meaningless while his people were not free, because freedom is indivisible. His hunger for personal freedom grew into a hunger for the freedom of all his people, and he came to believe that even the oppressor has to be freed from hatred.
  check: none

- id: ncert10-ff-2-21
  lvl: ncert-ex
  num: "FF 2 · TT Q5"
  source: NCERT X English · First Flight · Ch 2 · Thinking about the text
  kind: text
  q: |
    How did Mandela's 'hunger for freedom' change his life?
  sol: |
    Model answer: It transformed him from a frightened young man into a bold one. A law-abiding attorney became a so-called criminal, a family-loving husband became a man without a home, and a life-loving man was forced to live like a monk. He joined the African National Congress, lived a secret life apart from his family and gave up the ordinary freedoms he was allowed, because he could not enjoy them while his people were not free.
  check: none

