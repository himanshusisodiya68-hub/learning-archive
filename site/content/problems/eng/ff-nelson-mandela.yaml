  lvl: ncert-ex
  num: "FF 2 · TT Q2"
  source: NCERT X English · First Flight · Ch 2 · Thinking about the text
  kind: text
  q: |
    What does Mandela mean when he says he is "simply the sum of all those African patriots" who had gone before him?
  sol: |
    Model answer: He means that he is not a lone hero. Everything he did rests on the courage and sacrifice of the many patriots who struggled before him, and he carries their work forward. The long line of those fighters ended with him and began again with him. He regrets that they could not see what their sacrifices achieved, and the phrase shows his humility.
