- id: ncert10-ff-2-9
  lvl: ncert-ex
  num: "FF 2 · OC2 Q1"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (second set)
  kind: text
  q: |
    What do the military generals do? How has their attitude changed, and why?
  sol: |
    Model answer: The highest generals of the defence force and police salute Mandela and pledge their loyalty to him and to the new government. Not many years earlier they would not have saluted him but arrested him. Their attitude has changed because South Africa now has a government that was freely and fairly elected, and they accept the authority of democracy over the old order of racial rule.
  check: none

- id: ncert10-ff-2-10
  lvl: ncert-ex
  num: "FF 2 · OC2 Q2"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (second set)
  kind: text
  q: |
    Why were two national anthems sung?
  sol: |
    Model answer: Two anthems were sung because the country was made of two groups who had long been on opposite sides. Blacks sang 'Die Stem', the old anthem of the Republic, and whites sang 'Nkosi Sikelel' iAfrika'. Singing each other's song showed the coming together of the two communities in the new nation, even though neither group yet knew the other's words.
  check: none

