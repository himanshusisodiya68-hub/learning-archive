- id: ncert10-ff-2-32
  lvl: ncert-ex
  num: "FF 2 · Homophones"
  source: NCERT X English · First Flight · Ch 2 · Homophones
  kind: text
  q: |
    Can you find the words below that are spelt similarly, and sometimes even pronounced similarly, but have very different meanings? Check their pronunciation and meaning in a dictionary.

    • The bandage was wound around the wound.
    • The soldier decided to desert his dessert in the desert.
  sol: |
    Model answer.
    - wound (said "wownd", the past tense of wind) means wrapped; wound (said "woond") is an injury. Same spelling, different sound and meaning.
    - desert (verb, stress on the second syllable) means to abandon; dessert (a sweet dish at the end of a meal) sounds the same as that verb but is spelt with double s; desert (noun, stress on the first syllable) is a dry, sandy region.
    So in the sentence: the bandage was wrapped around the injury, and the soldier decided to abandon his sweet dish in the dry region. Check pronunciations in a dictionary [Unverified].
