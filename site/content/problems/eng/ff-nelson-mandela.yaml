  source: Original
  kind: text
  q: |
    Mandela writes: "I learned that courage was not the absence of fear, but the triumph over it." Argue, with one example from the chapter and one from your own life or reading, why this is a better idea of courage than "being fearless". Write about 150 words.
  sol: |
    One possible answer: If courage meant having no fear, then only people who cannot feel fear would be brave, and what they did would not be an achievement. Mandela's idea fits real life better. In the chapter he describes comrades who stood up to attacks and torture without breaking. They felt pain and fear as we do, yet they held on, and that made them brave. Their strength was a victory over their own fear.

    The same is true in everyday life. A student who is terrified of speaking on stage but goes up and speaks shows more courage than one who is carefree about it. The fear is still there, and so the act means something. This also gives hope to ordinary people: since we all feel fear, we can all learn courage by acting despite it. (about 150 words)
  check: none

- id: m2
