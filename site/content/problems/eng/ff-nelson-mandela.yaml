- id: m3
  lvl: main
  num: ""
  source: Original
  kind: text
  q: |
    "No one is born hating another person." Write a short speech (about 150 words) for your school assembly using this idea to argue that prejudice can be unlearnt. Include one example from the chapter.
  sol: |
    One possible answer: Good morning, everyone. Have you ever seen a baby refuse to play with another baby because of religion, language or colour? Never. Babies do not hate. We teach them to, with jokes, with silence and with what we say about others when we think they are not listening.

    Nelson Mandela understood this. He spent years in prison, yet he wrote that people must learn to hate, and if they can learn to hate, they can be taught to love. Even in the worst times he saw a glimmer of humanity in a guard, and it was enough to keep him going.

    What was learnt can be unlearnt. Let us begin here, in our own school. Let us sit with someone new in the canteen, stop the unkind joke and speak to the one left out. A free country begins with free hearts. Thank you. (about 150 words)
