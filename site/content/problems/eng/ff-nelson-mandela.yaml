- id: ncert10-ff-2-15
  lvl: ncert-ex
  num: "FF 2 · OC3 Q2"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (third set)
  kind: text
  q: |
    What did being free mean to Mandela as a boy, and as a student? How does he contrast these "transitory freedoms" with "the basic and honourable freedoms"?
  sol: |
    Model answer: As a boy, freedom meant running in the fields, swimming in the stream, roasting corn and riding bulls, as long as he obeyed his father and the customs of his tribe. As a student it meant staying out at night, reading what he pleased and going where he chose. These are transitory freedoms: temporary and only for himself. The basic and honourable freedoms, which he wanted as a young man in Johannesburg, are the freedom to achieve one's potential, to earn one's living, to marry and have a family, and not to be obstructed in a lawful life. These are lasting and concern a person's dignity.
  check: none

- id: ncert10-ff-2-16
  lvl: ncert-ex
  num: "FF 2 · OC3 Q3"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (third set)
  kind: text
  q: |
    Does Mandela think the oppressor is free? Why/Why not?
  sol: |
    Model answer: No. Mandela says the person who takes away another's freedom is a prisoner of hatred, locked behind the bars of prejudice and narrow-mindedness. The oppressor and the oppressed are both robbed of their humanity, so the oppressor must be liberated just as surely as the oppressed.
