# Nelson Mandela: Long Walk to Freedom. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 2. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-ff-2-1
  lvl: ncert-ex
  num: "FF 2 · BYR Q1"
  source: NCERT X English · First Flight · Ch 2 · Before you read
  kind: text
  q: |
    'Apartheid' is a political system that separates people according to their race. Can you say which of the three countries named below had such a political system until very recently?

    (i) United States of America     (ii) South Africa  (iii) Australia
  sol: |
    Model answer: (ii) South Africa. Apartheid was the official system there until the early 1990s, when the first democratic elections were held in 1994.
