- id: ncert10-ff-2-27
  lvl: ncert-ex
  num: "FF 2 · Speaking"
  source: NCERT X English · First Flight · Ch 2 · Speaking
  kind: text
  q: |
    In groups, discuss the issues suggested in the box below. Then prepare a speech of about two minutes on the following topic. (First make notes for your speech in writing.)

    True liberty is freedom from poverty, deprivation and all forms of discrimination.

    • causes of poverty and means of overcoming it
    • discrimination based on gender, religion, class, etc.
    • constitutionally guaranteed human rights
  sol: |
    One possible speech (about 250 words, roughly two minutes). Notes first: poverty (low income, no schooling, no work) / discrimination (gender, religion, class) / rights (equality, education, speech).

    Good morning. We often say a country is free because it is not ruled by foreigners. But is a person free if she cannot read, or he cannot eat? True liberty goes further. It is freedom from poverty, deprivation and all forms of discrimination.

    Poverty has many causes: too little work, poor schooling, ill health and unequal land and wealth. It is overcome by education, jobs, fair wages and public health care. A hungry child cannot enjoy any other freedom.

    Discrimination is just as binding. A girl kept from school because of her gender, a family refused a house because of its religion, a worker looked down on because of his class: each of them is held back by an unseen chain. Mandela's words apply here: the chains on one are chains on all.

    Our Constitution guarantees equality before the law, freedom of speech and the right to education [Unverified: check article numbers before quoting]. These rights are a promise, and a promise means work for every citizen.

    So let us not be satisfied with the freedom of the flag. Let us work for the freedom of the table and the classroom. Thank you.
  check: none

