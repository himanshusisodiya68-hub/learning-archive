    Why did such a large number of international leaders attend the inauguration? What did it signify the triumph of?
  sol: |
    Model answer: The leaders came because the day marked the end of one of the harshest systems of racial rule in the world, and many countries had earlier broken off relations with South Africa for its policy of apartheid. Their presence honoured the new, non-racial government. The event signified the triumph of justice, peace and human dignity over racial oppression, which Mandela calls a common victory shared with the world.
