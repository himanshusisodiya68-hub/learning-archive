  num: "FF 2 · OC1 Q2"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (after the speech)
  kind: text
  q: |
    Can you say how 10 May is an 'autumn day' in South Africa?
  sol: |
    Model answer: South Africa is in the southern hemisphere, where the seasons are the opposite of those in the northern hemisphere. When it is spring in India, it is autumn in South Africa, so 10 May falls in autumn there.
