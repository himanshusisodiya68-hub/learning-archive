  num: "FF 2 · Writing III"
  source: NCERT X English · First Flight · Ch 2 · Writing, III (Expressing Your Opinion)
  kind: text
  q: |
    Do you think there is colour prejudice in our own country? Discuss this with your friend and write a paragraph of about 100 to 150 words about this. You have the option of making your paragraph a humorous one. (Read the short verse given below.)

    When you were born you were pink
    When you grew up you became white
    When you are in the sun you are red
    When you are sick you are yellow
    When you are angry you are purple
    When you are shocked you are grey
    And you have the cheek to call me 'coloured'.
  sol: |
    One possible answer (about 120 words; this is an opinion question, so other views are acceptable):

    Yes, I think colour prejudice exists in our country, though it is quieter than apartheid. We see it in advertisements for creams that promise to make skin fairer, and in matrimonial columns that ask for a "fair" bride. Many children grow up believing that a lighter skin means a better life. Yet no one is born with such a thought: like hatred, it is learnt, as Mandela says. And the verse shows how silly it is. If a person turns pink, white, red, yellow, purple and grey in a single day, who is truly "coloured"? Perhaps we should all laugh a little at ourselves and then change what we teach our children. Skin has a colour; character has none.
