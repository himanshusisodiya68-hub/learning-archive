    At the beginning of his speech, Mandela mentions "an extraordinary human disaster". What does he mean by this? What is the "glorious … human achievement" he speaks of at the end?
  sol: |
    Model answer: The "extraordinary human disaster" is apartheid, the long period of racial oppression in South Africa, which lasted far too long and caused great suffering. The "glorious human achievement" is the end of that system and the birth of a free, democratic, non-racial society, a victory won through the sacrifices of many people.
