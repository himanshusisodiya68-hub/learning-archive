  kind: text
  q: |
    Which does he think is natural, to love or to hate?
  sol: |
    Model answer: He thinks love is more natural. No one is born hating another person; people have to learn to hate, and if they can learn to hate they can be taught to love, because love comes more naturally to the human heart. He adds that goodness can be hidden but never extinguished.
