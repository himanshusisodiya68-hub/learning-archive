  kind: text
  q: |
    What ideals does he set out for the future of South Africa?
  sol: |
    Model answer: He sets out these ideals: to free all people from the continuing bondage of poverty, deprivation, suffering and discrimination based on gender and other grounds; to build a society of which all humanity can be proud; to make sure that this land never again experiences the oppression of one by another; and to let freedom reign.
