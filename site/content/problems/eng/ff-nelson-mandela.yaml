  q: |
    Read the lines and answer.

    "Man's goodness is a flame that can be hidden but never extinguished." (Nelson Mandela: Long Walk to Freedom, near the end of the extract)

    (a) What kind of figure of speech is "a flame"? (b) Where does Mandela say he saw a glimmer of goodness? (c) What does the line suggest about human nature?
  sol: |
    (a) It is a metaphor: goodness is not literally a flame, but is compared to one without using "like" or "as".
    (b) He saw a glimmer of humanity in a guard, even if only for a second, in the grimmest times in prison.
    (c) It suggests that human nature is basically good: a person's kindness may be covered by fear, anger or the pressure of a cruel system, but it cannot be destroyed, so even harsh people may show it again.
