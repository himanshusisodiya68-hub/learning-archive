- id: ncert10-ff-2-2
  lvl: ncert-ex
  num: "FF 2 · BYR Q2"
  source: NCERT X English · First Flight · Ch 2 · Before you read
  kind: text
  q: |
    Have you heard of Nelson Mandela? Mandela, and his African National Congress, spent a lifetime fighting against apartheid. Mandela had to spend thirty years in prison. Finally, democratic elections were held in South Africa in 1994, and Mandela became the first black President of a new nation.

    In this extract from his autobiography, Long Walk to Freedom, Mandela speaks about a historic occasion, 'the inauguration'. Can you guess what the occasion might be? Check your guess with this news item (from the BBC) of 10 May 1994.
  sol: |
    One possible answer: the occasion is Mandela's swearing-in as South Africa's first black president, the ceremony at which he formally took office after the 1994 elections. The BBC news item confirms this: it reports that the inauguration took place in the Union Buildings amphitheatre in Pretoria, attended by dignitaries from more than 140 countries.

    Note: the book says Mandela spent thirty years in prison; most biographies give about twenty-seven years [Unverified here].
  check: none

- id: ncert10-ff-2-3
  lvl: ncert-ex
  num: "FF 2 · BYR Activity"
  source: NCERT X English · First Flight · Ch 2 · Before you read, Activity
  kind: text
  q: |
    In Column A are some expressions you will find in the text. Make a guess and match each expression with an appropriate meaning from Column B.

    Column A: (i) A rainbow gathering of different colours and nations; (ii) The seat of white supremacy; (iii) Be overwhelmed with a sense of history; (iv) Resilience that defies the imagination; (v) A glimmer of humanity; (vi) A twilight existence

    Column B: A great ability (almost unimaginable) to remain unchanged by suffering (not losing hope, goodness or courage) / A half-secret life, like a life lived in the fading light between sunset and darkness / A sign of human feeling (goodness, kindness, pity, justice, etc.) / A beautiful coming together of various peoples, like the colours in a rainbow / The centre of racial superiority / Feel deeply emotional, remembering and understanding all the past events that have led up to the moment
  sol: |
    Model answer.
    (i) A rainbow gathering of different colours and nations: a beautiful coming together of various peoples, like the colours in a rainbow.
    (ii) The seat of white supremacy: the centre of racial superiority.
    (iii) Be overwhelmed with a sense of history: feel deeply emotional, remembering and understanding all the past events that have led up to the moment.
    (iv) Resilience that defies the imagination: a great ability (almost unimaginable) to remain unchanged by suffering (not losing hope, goodness or courage).
    (v) A glimmer of humanity: a sign of human feeling (goodness, kindness, pity, justice, etc.).
    (vi) A twilight existence: a half-secret life, like a life lived in the fading light between sunset and darkness.
  check: none

