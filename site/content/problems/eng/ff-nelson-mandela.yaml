  num: "FF 2 · OC3 Q1"
  source: NCERT X English · First Flight · Ch 2 · Oral Comprehension Check (third set)
  kind: text
  q: |
    What "twin obligations" does Mandela mention?
  sol: |
    Model answer: The first obligation is to one's family: parents, wife and children. The second is to one's people, community and country. In a humane society a person can meet both, but under apartheid a man of Mandela's colour could not, because serving his people took him away from his family.
