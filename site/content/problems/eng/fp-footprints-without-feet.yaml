- id: b1
  lvl: board
  kind: text
  q: "(Original problem.) Read the extract and answer the questions: 'Mrs Hall almost fell down the stairs in hysterics. She was convinced that the room was haunted by spirits, and that the stranger had somehow caused these to enter into her furniture.' (a) What had frightened Mrs Hall? (b) Why was she convinced the room was haunted? (c) Find a word from the extract that means 'wild, uncontrolled emotion'. (d) Why is the situation humorous for the reader?"
  sol: |
    Model answer: (a) A hat leapt into her face and a chair charged at her and her husband and pushed them out of the room. (b) She could not see the cause of the movement, so she believed spirits had entered her furniture. (c) hysterics. (d) We know the true cause, an invisible man, while she does not, so her fear and her grief for her mother's chair seem comic. This is dramatic irony.
  check: none

