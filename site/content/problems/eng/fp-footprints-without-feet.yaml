- id: ncert10-fp-5-5
  lvl: ncert-ex
  num: "FP 5 · OC2 Q3"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Read and find out (second part)
  kind: text
  q: |
    What other extraordinary things happen at the inn?
  sol: |
    One possible answer: Mrs Hall and her husband find the scientist's door open and his room empty, with his clothes and bandages lying about. Mrs Hall hears a sniff close to her ear, a hat leaps from the bedpost into her face, and a chair springs up and charges at her, pushing both of them out of the room before the door seems to slam and lock itself. Later the scientist appears from the empty bedroom, throws off his bandages, whiskers, spectacles and nose, and the people in the bar see a headless man. The constable is then knocked unconscious by blows that come from nowhere.
