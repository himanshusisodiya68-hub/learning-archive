- id: ncert10-fp-5-6
  lvl: ncert-ex
  num: "FP 5 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Think about it
  kind: text
  q: |
    "Griffin was rather a lawless person." Comment.
  sol: |
    One possible answer: A lawless person pays no attention to the rules of society, and Griffin shows this again and again. He burnt down his landlord's house to get his own back, broke into a London store to take clothes, food and wine, attacked a shopkeeper from behind and robbed him, took the clergyman's housekeeping money, and knocked out the constable who tried to arrest him. His crimes are not planned; each one follows from the last problem he has caused for himself. So the narrator's word is fair: he is clever but has no respect for law or for other people.
  check: none

- id: ncert10-fp-5-7
  lvl: ncert-ex
  num: "FP 5 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Think about it
  kind: text
  q: |
    How would you assess Griffin as a scientist?
  sol: |
    One possible answer: As a researcher Griffin is outstanding, because he carried out "experiment after experiment" and succeeded in making a human body invisible, a discovery no one else had made. But as a scientist he is poor in judgement and ethics. He did not think about the practical results of his discovery: cold weather, clothes, food, shelter, or how to become visible again. He used his knowledge for crime and revenge, not for human good. So he is brilliant in skill and weak in wisdom. (This is an opinion; another answer with evidence is acceptable.)
  check: none

- id: ncert10-fp-5-8
  lvl: ncert-ex
  num: "FP 5 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Talk about it
  kind: text
  q: |
    Would you like to become invisible? What advantages and disadvantages do you foresee, if you did?
  sol: |
    One possible answer: Yes, for a short time and for a good purpose. Advantages: I could watch wild animals without disturbing them, escape danger, or surprise a friend on a birthday. Disadvantages: I could be knocked over because nobody sees me, I would still need food and warmth, as Griffin learns, I might be tempted to misuse the power, and I would be lonely, since people could not see me or talk to me normally. On balance, I would want the ability only if I could switch it on and off.
  check: none

- id: ncert10-fp-5-9
  lvl: ncert-ex
  num: "FP 5 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Talk about it
  kind: text
  q: |
    Are there forces around us that are invisible, for example, magnetism? Are there aspects of matter that are 'invisible' or not visible to the naked eye? What would the world be like if you could see such forces or such aspects of matter?
  sol: |
    One possible answer: Yes. Magnetism, gravity, static electricity, sound waves, radio waves and wind are all invisible; we notice them only through their effects. In matter, atoms, molecules, germs and cells are too small for the naked eye. If we could see them, the world would look crowded and busy: magnetic fields would curve around magnets and the Earth, germs would swarm over every surface, and air would be a rushing mass of tiny particles. It would be fascinating but overwhelming, which is why our eyes are tuned to the scale of everyday life.
  check: none

- id: ncert10-fp-5-10
  lvl: ncert-ex
  num: "FP 5 · TA Q3"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Talk about it
  kind: text
  q: |
    What makes glass or water transparent (what is the scientific explanation for this)? Do you think it would be scientifically possible for a man to become invisible, or transparent? (Keep in mind that writers of science fiction have often turned out to be prophetic in their imagination!)
  sol: |
    One possible answer: Light passes through glass and clear water because they do not absorb visible light and do not scatter it much; their atoms are arranged evenly, so the light travels on in nearly a straight line. We can still see them because light bends and partly reflects where it enters from air, owing to a difference in refractive index [Unverified here, from general science knowledge]. For a man to become invisible, every part of his body would have to let light pass and match the refractive index of the air, which is extremely hard for a body made of skin, fat, muscle and blood. Also, an eye that lets all light pass could not see. So with today's knowledge it is not possible, although science fiction has sometimes anticipated real inventions. (Opinion-based; one possible answer.)
  check: none

