  kind: text
  q: |
    What curious episode occurs in the study?
  sol: |
    One possible answer: Very early one morning a clergyman and his wife hear noises and the chink of money in the study. The clergyman rushes in with a poker, but the room looks empty. They search under the desk, behind the curtains and even up the chimney and find nobody, yet the desk has been opened and the housekeeping money is gone.
