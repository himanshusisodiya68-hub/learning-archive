# Footprints without Feet. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 5. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-5-1
  lvl: ncert-ex
  num: "FP 5 · OC1 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Read and find out (first part)
  kind: text
  q: |
    How did the invisible man first become visible?
  sol: |
    One possible answer: Griffin stepped in some mud while walking down the steps of a London house. The mud stuck to his bare feet and left fresh muddy footprints. Two boys saw the prints appear one after another with no one making them, and followed them until they faded and disappeared.
  check: none

- id: ncert10-fp-5-2
  lvl: ncert-ex
  num: "FP 5 · OC1 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 5 · Read and find out (first part)
  kind: text
  q: |
    Why was he wandering the streets?
  sol: |
    One possible answer: Griffin had set fire to his landlord's house in revenge for being thrown out. To escape without being seen he had to remove his clothes. That left him homeless, without clothes or money, so he wandered the streets of London looking for warmth and shelter.
  check: none

