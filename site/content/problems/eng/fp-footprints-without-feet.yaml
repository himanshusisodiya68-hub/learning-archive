- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) Write a paragraph of about 120 words on the question: 'Does invisibility give Griffin power or only problems?' Support your answer with evidence from the chapter."
  sol: |
    One possible model answer: Griffin's invisibility gives him freedom from being seen, but not real power. It lets him slip out of the burning house and break into a store at night, but he cannot stay warm without clothes. He is cold in the midwinter air and must steal food, a disguise and money. Each crime brings new trouble: the assistants chase him out of the store, a shopkeeper is attacked, and the whole village turns on him. At the inn he must wrap himself up like an ordinary man to be accepted. In the end, with the constable unconscious and the crowd hunting him, he is more hunted than powerful. The gift is real, but he uses it badly.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Explain two ways in which the narrator creates humour in the chapter. Quote a short phrase for each."
  sol: |
    One possible model answer: First, understatement. The narrator reports shocking events in a calm tone, as when he says "Extraordinary affair!" was the clergyman's repeated comment, or says the constable is "quite surprised" to arrest a man without a head. The mild words make the situation funnier. Second, dramatic irony. We know the cause of the mystery, an invisible man, while the villagers think of witchcraft, so their fear and their detailed searches, even up the chimney, become comic.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) 'A man who is truly invisible could not see.' Explain this statement with reference to how the eye works, and say what it shows about the chapter as science fiction."
  sol: |
    One possible model answer: The eye sees by catching light on the retina, which absorbs it and turns it into signals for the brain. If the retina were perfectly transparent, light would pass through without being absorbed and no signal would form, so the man would be blind. In the chapter Griffin sees perfectly, which shows the story is imagination, not strict science. [Inference from general science knowledge, not from the chapter.] This does not spoil the story, which is mainly interested in the human results of invisibility.
  check: none

