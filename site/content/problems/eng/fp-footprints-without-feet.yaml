  q: |
    Why does Mrs Hall find the scientist eccentric?
  sol: |
    One possible answer: Griffin arrives in winter with his face wrapped in bandages and dark glasses, says he wants solitude and does not want to be disturbed in his work, blames "an accident" for his face, is irritable and quick-tempered, and keeps his room locked. Mrs Hall does not guess the truth, so she decides he is an odd scientist and excuses his habits because he has paid in advance.
  check: none

