- id: m1
  lvl: main
  kind: text
  q: |
    "Bholi is not only a story about a girl who finds her voice; it is also a story about a society that must learn to listen." Discuss, using at least three pieces of evidence from the story.
  sol: |
    Model answer (one possible answer): The story does show Bholi's personal journey, from stammering fear to a clear, loud "Pitaji!", but it is equally a criticism of the people around her. Evidence 1: the family decides about her future without asking her, her mother calling her a "dumb cow" who will say nothing. Evidence 2: Ramlal and his wife treat daughters as a marriage problem while sending the sons to the city to study. Evidence 3: Bishamber turns the wedding into a bargain and the family pays. Bholi's last speech makes the guests realise that the "harmless dumb cow" has opinions of her own. The ending suggests that those who ignore girls' voices are the ones who lose out, and that society must listen.
