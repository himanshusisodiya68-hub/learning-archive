- id: ncert10-fp-8-10
  lvl: ncert-ex
  num: "FP 8 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Talk about it
  kind: text
  q: |
    Bholi's teacher helped her overcome social barriers by encouraging and motivating her. How do you think you can contribute towards changing the social attitudes illustrated in this story?
  sol: |
    One possible answer: I can start by treating everyone around me with respect, whatever their looks, speech or marks, and by not joining in when others tease someone. I can encourage a classmate who is shy or struggling, as the teacher did, by praising effort. I can speak up against practices such as dowry and against the idea that girls need education less than boys, at home and with friends, and I can support campaigns and events in school that spread these messages. Small changes in how we talk and behave slowly change what a community thinks is normal.
  check: none

- id: ncert10-fp-8-11
  lvl: ncert-ex
  num: "FP 8 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Talk about it
  kind: text
  q: |
    Should girls be aware of their rights, and assert them? Should girls and boys have the same rights, duties and privileges? What are some of the ways in which society treats them differently? When we speak of 'human rights', do we differentiate between girls' rights and boys' rights?
  sol: |
    One possible answer: Yes. Girls should know their rights and be able to claim them, since a right that nobody knows about cannot be used. Girls and boys should have the same rights, duties and privileges, including the right to education, health, safety, a say in decisions and a choice in marriage, and the same duties at home and in society.

    In many places society treats them differently: sons may be given better schooling and more freedom while daughters are given more housework and earlier marriage, girls may be told what to wear or when to come home, and some families see dowry as a burden of having girls. Human rights belong to every person, so there is no separate set of rights for girls and boys. Differences in treatment are social habits, not rights, and they should be questioned.
  check: none

