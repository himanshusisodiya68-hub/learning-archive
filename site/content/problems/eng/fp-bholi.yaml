# Bholi. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 8. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-8-1
  lvl: ncert-ex
  num: "FP 8 · Intro"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Chapter opener
  kind: text
  q: |
    From her very childhood Bholi was neglected at home. Why did her teacher take special interest in her? Did Bholi measure up to her teacher's expectation?
  sol: |
    One possible answer: The teacher saw a frightened, ridiculed child who had never been spoken to kindly, and she understood that Bholi's difficulty was fear, not lack of ability. She took special interest because Bholi needed patience and encouragement more than anyone else in the class. Bholi did measure up to her expectation. She learnt to speak without stammering, found courage, and on her wedding day refused a greedy bridegroom in a clear, loud voice. The teacher's satisfaction at the end shows her hopes were fulfilled.
  check: none

- id: ncert10-fp-8-2
  lvl: ncert-ex
  num: "FP 8 · RF1"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Read and find out (first set)
  kind: text
  q: |
    Why is Bholi's father worried about her?
    For what unusual reasons is Bholi sent to school?
  sol: |
    One possible answer: Ramlal is worried about Bholi because she has neither good looks nor intelligence. Smallpox has left deep pock-marks on her body, she stammers, and the family thinks her mind was damaged by a fall in infancy. He fears that it will be very hard to find her a husband, unlike her sisters.

    She is sent to school for unusual reasons. The Tehsildar tells Ramlal, as a government representative in the village, to set an example by sending his daughters to the new school, and Ramlal does not have the courage to disobey. His wife adds that Bholi has little chance of marriage anyway, so she may as well go and let the teachers worry about her. Neither parent expects her to learn anything.
  check: none

- id: ncert10-fp-8-3
  lvl: ncert-ex
  num: "FP 8 · RF2"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Read and find out (second set)
  kind: text
  q: |
    Does Bholi enjoy her first day at school?
    Does she find her teacher different from the people at home?
  sol: |
    One possible answer: At first she does not. She is terrified on the way, thinking of the cow Lakshmi who was sold, and in class she cries and stammers when asked her name, believing the other girls are laughing at her. But by the end of the day she is happy. The teacher's kind encouragement, the first book with coloured pictures and the promise that she will learn to speak without fear fill her with hope.

    Yes, the teacher is very different. At home Bholi is neglected, her clothes are not mended, and she is called a fool and a dumb cow. The teacher speaks in a soft, soothing voice, calls her by name, says "Well done" for each small effort, and treats her as a person who can learn.
  check: none

- id: ncert10-fp-8-4
  lvl: ncert-ex
  num: "FP 8 · RF3"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Read and find out (third set)
  kind: text
  q: |
    Why do Bholi's parents accept Bishamber's marriage proposal?
    Why does the marriage not take place?
  sol: |
    One possible answer: Bholi's parents accept because Bishamber is a well-off grocer with a big shop, a house and money in the bank, and he is not asking for any dowry. They also think that, with her pock-marks and her supposed lack of sense, Bholi may never get another proposal, and he comes from another village so he does not know about her face. They overlook that he is almost as old as her father, limps and has grown-up children.

    The marriage does not take place because, at the ceremony, Bishamber sees her pock-marks and demands five thousand rupees. Ramlal begs and finally pays, but Bholi, hearing and seeing this greed, flings the garland into the fire and refuses to marry such a mean, greedy and contemptible man. Bishamber and his party leave.
  check: none

- id: ncert10-fp-8-5
  lvl: ncert-ex
  num: "FP 8 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Think about it
  kind: text
  q: |
    Bholi had many apprehensions about going to school. What made her feel that she was going to a better place than her home?
  sol: |
    One possible answer: Bholi was frightened because she connected school with the old cow Lakshmi being turned out and sold. But several things made her feel she was going somewhere better. For the first time she was given a clean dress, was bathed, and had oil rubbed into her matted hair, so she began to believe that she was being taken to a place better than home. At school she saw many girls of her own age and hoped one might become her friend, and the bright pictures of animals on the wall fascinated her. Above all, the teacher spoke to her gently and called her by name, which no one at home had done.
  check: none

- id: ncert10-fp-8-6
  lvl: ncert-ex
  num: "FP 8 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Think about it
  kind: text
  q: |
    How did Bholi's teacher play an important role in changing the course of her life?
  sol: |
    One possible answer: The teacher was patient and kind. She waited until the other girls had gone, spoke softly, and helped Bholi say her own name by praising every attempt. She told Bholi that if she put the fear out of her heart she could speak like everyone else, and promised that she would soon read books and become more learned than anyone else in the village, so that nobody would laugh at her again. She gave Bholi a book and a goal, and a reason to come to school every day. This gave Bholi hope, confidence and the ability to speak clearly. Because of this change Bholi could refuse an unfair marriage and plan a future of her own as a teacher.
  check: none

- id: ncert10-fp-8-7
  lvl: ncert-ex
  num: "FP 8 · TT Q3"
  source: NCERT X English · Footprints Without Feet · Ch 8 · Think about it
  kind: text
  q: |
    Why did Bholi at first agree to an unequal match? Why did she later reject the marriage? What does this tell us about her?
  sol: |
    One possible answer: Bholi at first agreed, for the sake of her father's izzat (honour), to marry a man much older than herself who limped. She knew that her family thought no one else would marry her, and she did not want to disgrace them. She rejected the marriage when Bishamber saw her pock-marks and demanded five thousand rupees as the price of going ahead. His greed, and the sight of her father humiliated and in tears, showed her that he was mean and a coward. She would not accept a husband who treated marriage as a bargain.

    This tells us that Bholi has changed from a frightened, silent girl into a brave and self-respecting woman who thinks for herself. She is willing to sacrifice for her family, but not to sacrifice her dignity, and she has the voice to say so.
  check: none

