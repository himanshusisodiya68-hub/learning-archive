- id: m2
  lvl: main
  kind: text
  q: |
    Explain how the writer uses the cow, the veil and the sacred fire as symbols in the story. Which do you find the most effective, and why?
  sol: |
    Model answer (one possible answer): The cow Lakshmi first stands for being cast out and sold, which frightens Bholi on her way to school, then becomes a comforting picture in her book, and finally becomes the insult "dumb cow" that Bholi turns on those who used it. The veil first hides her scarred face and her shame; when she throws it away she shows she will no longer hide. The sacred fire usually witnesses a marriage vow; here it burns the garland, so the ritual is used to witness her refusal, a vow to herself. I find the fire most effective because it takes a solemn tradition and uses it to challenge a harmful custom, making the climax visual and unforgettable.
  check: none

- id: m3
  lvl: main
  kind: text
  q: |
    The story ends with the teacher compared to an artist who has completed her masterpiece. Is the comparison fully fair to Bholi? Argue both sides in about 120 words.
  sol: |
    Model answer (one possible answer): For the comparison: the teacher saw potential in Bholi when nobody else did, gave her patient care, a book, a goal and the belief that she could speak, just as an artist shapes raw material, and the final scene shows her satisfaction. Against: calling Bholi a masterpiece makes her the passive material of someone else's work. It was Bholi who came to school every day, practised, overcame her fear and, at the wedding, took the decision alone, with no help from anyone in that crowd. A fair reading is that the teacher provided the tools and Bholi made the final stroke. The image honours teaching but should not cancel Bholi's own courage and effort.
  check: none
