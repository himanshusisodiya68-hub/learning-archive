- id: b3
  lvl: board
  kind: text
  q: |
    Write a character sketch of Bholi in about 100 to 120 words.
  sol: |
    Model answer (one possible answer): Bholi, whose real name is Sulekha, is the youngest child of a prosperous farmer. A childhood fall and smallpox left her thought of as a simpleton, scarred and stammering, and her family neglects her. At school her teacher's kindness reveals a hopeful, eager and determined girl who tries again and again to say her name. Years later she has become confident and clear-spoken. At her wedding she sees that Bishamber is greedy and cowardly, throws the garland into the fire and refuses him, even though it may mean never marrying. She also promises to look after her parents and to teach in her old school. Bholi shows how education and kindness can turn fear into courage and self-respect.
  check: none

- id: b4
  lvl: board
  kind: text
  q: |
    Do you think Ramlal is a cruel father? Give reasons from the story in about 80 words.
  sol: |
    Model answer (one possible answer): Ramlal is not cruel but weak. He worries about Bholi's future, cannot bring himself to disobey the Tehsildar and is led by his wife, who treats Bholi as a burden. He accepts Bishamber's proposal to settle her, and at the wedding places his turban at the groom's feet and weeps as he pays. He cares more about izzat than about Bholi's feelings, and so he fails her, but the story shows him as a man trapped by social pressure rather than as a villain.
