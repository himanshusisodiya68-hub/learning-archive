  source: Original problem for this archive
  kind: text
  q: In three or four sentences, retell what happens after Hari Singh leaves Anil's room with the money and before he returns.
  sol: |
    Model answer: Hari Singh runs to the station but hesitates and misses the Lucknow Express. He has nowhere to spend the night, so he walks through the bazaar, sits on a bench in the maidan, and then shelters under the clock tower while it rains. As he thinks about Anil's face and about the lessons he will lose, he decides to go back and return the notes.
