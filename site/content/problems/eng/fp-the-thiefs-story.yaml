# The Thief's Story (Ruskin Bond). NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 2. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-2-1
  lvl: ncert-ex
  num: "FP 2 · RF1"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Read and find out (before the story)
  kind: text
  q: |
    • Who does 'I' refer to in this story?
    • What is he "a fairly successful hand" at?
    • What does he get from Anil in return for his work?
  sol: |
    Model answer: 'I' is Hari Singh, a fifteen-year-old thief who tells the story (Hari Singh is an assumed name; he changes it every month). He is a fairly successful hand at thieving. In return for his work (making tea, shopping, later cooking) he gets food and a place to sleep on the balcony of Anil's room, and Anil promises to teach him to cook, to write his name and then whole sentences. At the end Anil also offers him regular pay.
  check: none

- id: ncert10-fp-2-2
  lvl: ncert-ex
  num: "FP 2 · RF2"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Read and find out (before the theft scene)
  kind: text
  q: |
    • How does the thief think Anil will react to the theft?
    • What does he say about the different reactions of people when they are robbed?
    • Does Anil realise that he has been robbed?
  sol: |
    Model answer: The thief expects Anil's face to show only a touch of sadness, not for the money but for the loss of trust. He says he has studied men's faces after a loss: the greedy man shows fear, the rich man anger, and the poor man acceptance. Anil does realise he has been robbed. His wet fifty-rupee note and his words "Today we'll start writing sentences" show that he knows, though he says nothing.
  check: none

- id: ncert10-fp-2-3
  lvl: ncert-ex
  num: "FP 2 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Think about it
  kind: text
  q: |
    What are Hari Singh's reactions to the prospect of receiving an education? Do they change over time? (Hint: Compare, for example, the thought: "I knew that once I could write like an educated man there would be no limit to what I could achieve" with these later thoughts: "Whole sentences, I knew, could one day bring me more than a few hundred rupees. It was a simple matter to steal — and sometimes just as simple to be caught. But to be a really big man, a clever and respected man, was something else.") What makes him return to Anil?
  sol: |
    Model answer: At first Hari Singh is grateful for the lessons but sees education only as a tool: once he can write like an educated man, he thinks, he will be able to cheat and steal more cleverly. After the theft his view changes. Sitting alone under the clock tower, he sees that stealing is easy and also easy to be caught at, while being a clever and respected man is a far bigger prize. So education becomes a way to build a respectable life, not just a trick.

    What makes him return is a mixture of these things: the chance to learn to read and write, loneliness (Anil is the only person he knows well), and an inner stirring of conscience, which began when he hesitated and missed the train. He goes back and slips the notes under the mattress.
  check: none

- id: ncert10-fp-2-4
  lvl: ncert-ex
  num: "FP 2 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Think about it
  kind: text
  q: |
    Why does not Anil hand the thief over to the police? Do you think most people would have done so? In what ways is Anil different from such employers?
  sol: |
    Model answer: Anil knows that the boy has returned the money and he sees that he wants to change. Handing him to the police would end the lessons and probably push the boy back into crime, while silence gives him a fresh start with his dignity intact. So Anil pays him a wage and begins the writing lesson as promised.

    Most people would probably have called the police, or at least thrown the boy out and lectured him, since the loss of 600 rupees would matter to them. Anil is different from such employers because he trusts easily, values the person over the property, and treats a servant as someone who can learn and improve. He never mentions the theft, and that gentleness is what reforms the boy. (One possible answer.)
  check: none

- id: ncert10-fp-2-5
  lvl: ncert-ex
  num: "FP 2 · TK Q1"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Talk about it
  kind: text
  q: |
    Do you think people like Anil and Hari Singh are found only in fiction, or are there such people in real life?
  sol: |
    One possible answer: Both kinds of people exist in real life, although a story gathers their qualities into one dramatic episode. There are kind employers and teachers who believe in a second chance, and there are children who steal because no one has taught or protected them. Charities that teach street children, and shopkeepers who forgive a small theft, show that Anil-like trust is real. Hari Singh's mix of cleverness, loneliness and hidden conscience is also common among young people who grow up without support.
  check: none

- id: ncert10-fp-2-6
  lvl: ncert-ex
  num: "FP 2 · TK Q2"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Talk about it
  kind: text
  q: |
    Do you think it a significant detail in the story that Anil is a struggling writer? Does this explain his behaviour in any way?
  sol: |
    One possible answer: Yes, it is significant. Anil's money comes in fits and starts, so he is used to uncertainty and does not treat cash as sacred; he borrows one week and lends the next. He also earns his living by understanding people, so he can read the boy's face and guess what happened. His own life is hard, which may make him sympathetic to someone poorer. It explains why he can forgive the loss and why he values writing enough to teach it. [Inference: the story does not say this outright.]
  check: none

- id: ncert10-fp-2-7
  lvl: ncert-ex
  num: "FP 2 · TK Q3"
  source: NCERT X English · Footprints Without Feet · Ch 2 · Talk about it
  kind: text
  q: |
    Have you met anyone like Hari Singh? Can you think and imagine the circumstances that can turn a fifteen-year-old boy into a thief?
  sol: |
    One possible answer (open-ended; answer from your own experience): I have seen children in railway stations and markets who beg or pick pockets to eat. Circumstances that can turn a boy into a thief include having no family or being abandoned, poverty and hunger, no schooling, bad company or older criminals who use him, and no one who trusts him enough to give honest work. Such a boy learns that lying and cunning are the only ways to survive, which is why Hari Singh takes a new name every month. Understanding the causes does not excuse theft, but it shows why kindness and education matter.
  check: none

