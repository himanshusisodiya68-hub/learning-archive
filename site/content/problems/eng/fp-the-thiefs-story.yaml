- id: b4
  lvl: board
  num: "Original (board style)"
  source: Original problem in the style of CBSE Class 10 long-answer questions (100-120 words)
  kind: text
  q: Write a character sketch of Anil in about 100-120 words, with evidence from the story.
  sol: |
    One possible model answer: Anil is a young writer of about twenty-five, tall, lean and easy-going. He is generous: he gives a hungry stranger a place to sleep, shares his food, and promises to teach him to cook and write. He is trusting: he gives the boy a key and leaves his money under the mattress. He is also wise. He ignores the small cheating on the shopping, and when the thief returns the money he never mentions the theft. He gives him a fifty-rupee note and starts the writing lesson instead. Anil believes in people. His silent forgiveness shows that trust can reform a person better than punishment, and it is the moral centre of the story.
  check: none

- id: m1
  lvl: main
  num: "Original (beyond the board)"
  source: Original problem for this archive
  kind: text
  q: The story is told by the thief in the first person. How does this choice of narrator affect what we know about Anil, and what would be lost if Anil told the story?
  sol: |
    One possible model answer: With Hari Singh as narrator we see his plans, doubts and excuses from the inside, so we understand why he steals and why he comes back. We know about Anil only from outside, through his actions, and we are never told what he thinks. That makes his silence at the end powerful: the reader, like the boy, can only guess that he knows and has forgiven. If Anil told the story, we would learn his feelings directly, but the thief's inner struggle and the surprise of the quiet ending would be weaker.
  check: none

- id: m2
  lvl: main
  num: "Original (beyond the board)"
  source: Original problem for this archive
  kind: text
  q: Explain two examples of irony in The Thief's Story. For each, say what is expected and what actually happens.
  sol: |
    One possible model answer: (1) Situational irony: the thief expects a successful robbery and a ride to Lucknow, but he ends up returning the money because he cannot bear to lose the lessons. (2) Reversal of roles: the victim, not the thief, gives a gift, the fifty-rupee note, and treats the thief with respect. A further example is that Hari Singh calls himself an experienced hand and a good judge of faces, yet he cannot explain his own hesitation at the station.
  check: none

- id: m3
  lvl: main
  num: "Original (beyond the board)"
  source: Original problem for this archive
  kind: text
  q: At the end, the thief's smile "came by itself, without any effort". Compare this with the smile earlier in the story and say what the writer wants us to see.
  sol: |
    One possible model answer: Earlier the smile is a trick. Hari Singh puts it on his face, his "most appealing" one, to win Anil's liking and avoid blame, and it is deliberate. At the end the same smile comes naturally because he feels gratitude and relief for being forgiven. The repeated gesture shows how he has changed from a person who performs feelings to one who has them. The writer says this quietly, in a single detail, instead of stating a moral.
  check: none

- id: m4
  lvl: main
  num: "Original (beyond the board)"
  source: Original problem for this archive
  kind: text
  q: Would the story be as effective if Anil had spoken to the thief about the theft? Argue your view in about 100 words.
  sol: |
    One possible model answer (an opinion; other views are valid with reasons): No, it would be weaker. If Anil spoke, the scene would become a lecture or a quarrel, and the boy would have to defend himself or feel shame. By staying silent, Anil lets the thief keep his pride, and the boy arrives at the right choice himself. The wet note and the line about writing sentences say everything without words. Silence also lets the reader share in the understanding between the two characters, which is more moving than any speech.
  check: none
