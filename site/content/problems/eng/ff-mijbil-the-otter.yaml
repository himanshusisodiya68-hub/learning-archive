- id: m1
  lvl: main
  num: "Original m1"
  source: Original problem for this archive
  kind: text
  q: |
    Maxwell never says in plain words that Mij is playful, yet readers are sure of it. Explain how the writer achieves this, choosing at least three examples from the extract and saying what each one shows.
  sol: |
    One possible model answer: The writer shows playfulness through actions, not labels, so readers draw the conclusion themselves. First, Mij dribbles a rubber ball with all four feet, like a footballer, which shows skill and a love of games. Second, he juggles marbles on his belly while lying on his back, which shows concentration and pleasure. Third, he invents the suitcase game, hiding to ambush the ball, which shows imagination. Fourth, he gallops along the school wall every day on the way home, which shows high spirits and habit. By listing such precise details and adding comic comparisons, Maxwell lets us see a mischievous animal.
  check: none

- id: m2
  lvl: main
  num: "Original m2"
  source: Original problem for this archive
  kind: text
  q: |
    "Wild animals should never be kept as pets." Write a paragraph of about 120 words either supporting or opposing this view. Use at least one reason from the story, and answer one objection.
  sol: |
    One possible model answer (supporting): Wild animals belong to the wild, and the story itself shows why. Mij is loved, fed and entertained, yet the moment he is shut in a box he tears the lining until he bleeds. A creature built for marshes and rivers cannot be happy in a flat or an aeroplane. Some will say that Maxwell treated Mij with great love and care, and I agree that the bond is real. But love does not give an animal the space, water and company it was shaped for, and it does nothing to protect the wild population when more animals are taken. It is kinder to enjoy wild animals in their own habitat.
  check: none

- id: m3
  lvl: main
  num: "Original m3"
  source: Original problem for this archive
  kind: text
  q: |
    Maxwell's narrative mixes comedy and worry. Pick one scene from the extract in which both moods appear, and explain, in about 80 words, how the writer moves between them.
  sol: |
    One possible model answer: In the aircraft scene, worry and comedy share the same few lines. Maxwell has just seen the bleeding otter and dreads another disaster, so his relief at the hostess's kindness is real. Then Mij escapes, a woman screams that there is a rat, and Maxwell dives for his tail and gets curry on his face. The comedy comes from the sudden shift from calm to chaos and from his own embarrassment. The worry returns while he searches, but Mij's loving return to his knee closes the scene on warmth, so both moods end up serving the same affection.
  check: none
