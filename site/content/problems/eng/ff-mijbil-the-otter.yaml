- id: b2
  lvl: board
  num: "Original b2"
  source: Original problem for this archive · CBSE-style long answer (about 100–120 words)
  kind: text
  q: |
    Write a character sketch of Mij in about 100 to 120 words, using evidence from the text.
  sol: |
    One possible model answer: Mij is an intelligent, playful and affectionate otter. At first he is aloof, but by the second night he sleeps in the crook of Maxwell's knees and soon follows him without a lead. His cleverness is clear when he turns on the bathroom tap within a minute, and his skill when he juggles marbles lying on his back. He loves water and plays with joyful abandon. He also invents games, such as chasing a ping-pong ball down a sloping suitcase. Yet the torn box shows that he is a wild creature who fears confinement, and his dash down the aircraft shows his fearlessness. When he returns to Maxwell and nuzzles him, we see his loyal heart.
  check: none

