  source: NCERT X English · First Flight · Ch 6 · Oral Comprehension Check (Part I–II)
  kind: text
  q: |
    Why does he go to Basra? How long does he wait there, and why?
  sol: |
    He goes to Basra, with a friend, to the Consulate-General to collect and answer his mail from Europe. His friend's mail had arrived but his had not. He cabled to England and waited three days, then tried to telephone; the call had to be booked a day ahead, and for three days the line was out of order, the exchange was closed for a holiday and there was another breakdown. His friend left, and his mail finally arrived five days later. So he waited roughly eleven days in all [Inference: the days are added up from the text], for his mail to come.
