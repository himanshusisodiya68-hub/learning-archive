  kind: text
  q: |
    What are 'compulsive habits'? What does Maxwell say are the compulsive habits of
    (i) school children
    (ii) Mij?
  sol: |
    Compulsive habits are habits that a person or animal cannot help repeating or resist.

    (i) School children, on their way to and from school, must put their feet squarely on the centre of each paving block, touch every seventh upright of the iron railings, or pass to the outside of every second lamp post.

    (ii) On his way home (but never on the way out), Mij would tug Maxwell to a low wall opposite the flat, jump on it, and gallop its full length of thirty yards, to the despair of the school's pupils and staff.
