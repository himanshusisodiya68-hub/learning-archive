- id: ncert10-ff-6-3
  lvl: ncert-ex
  num: "FF 6 · BR Q3"
  source: NCERT X English · First Flight · Ch 6 · Before you read, Activity 3
  kind: text
  q: |
    Otters are found in large numbers in the marshes (i.e. wet areas near lakes, rivers or seas) near Basra, a town in Iraq. Imagine you wanted to bring an otter from Iraq to London, as a pet. What special arrangements would you need to make for your pet otter? You would need to find a place with lots of water, for example. What other points should you think about? The information about Iraq and London given below may help you.

    Iraq: Iraq has mostly broad plains and marshes along the Iranian border in the south, with large flooded areas. A large part of Iraq's land area is desert, so it has cool winters and dry, hot and cloudless summers. The mountain areas near Iran and Turkey have cold winters. There is heavy snowfall there, and when the snow melts in spring, it causes floods in central and southern Iraq.

    London: London has a large population and is a very busy city. In addition to multi-storeyed buildings, however, it has many open spaces or parks. It has a temperate climate (i.e. it is neither very hot, nor very cold), with regular but generally light rainfall or snow throughout the year. The warmest month is July, and the coolest month is January. February is the driest month. Snow is not very common in London.
  sol: |
    One possible answer: An otter needs a lot of water, so I would arrange a large tub or pool, a garden with a stream or pond, and a place to swim every day. London is cooler and damper than the Iraqi marshes but its climate is temperate, so a warm, dry sleeping place and shelter from cold would suffice. I would also need a safe box for travel, permission from the authorities to bring the animal, regular food (fish), room for play, and a vet who knows wild animals. I would also check whether keeping an otter as a pet is allowed by law.
  check: none

