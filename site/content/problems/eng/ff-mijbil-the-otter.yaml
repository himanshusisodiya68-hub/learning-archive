  q: |
    What things does Mij do which tell you that he is an intelligent, friendly and fun-loving animal who needs love?
  sol: |
    Intelligent: he turns on the bathroom tap himself within a minute; he invents the suitcase-and-ball game; he juggles marbles on his belly without dropping one.
    Friendly: he comes to Maxwell's bed on the second night; he follows him without a lead and answers to his name; he runs back to his knee on the plane and nuzzles him.
    Fun-loving: he spends hours at play, dribbling a ball with all four feet, splashing in the bath, galloping along the school wall.
    Needs love: he whimpers and clings to Maxwell's leg after the box ordeal, and he goes back to Maxwell for comfort on the plane.
