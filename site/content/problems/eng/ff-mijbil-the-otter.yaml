    You have seen how Maxwell describes Mij the otter's feelings and thoughts by watching him. Play the game of dumb charades. Take turns to express a feeling or thought silently, through gestures. Let the class speak out their guesses about the feelings or thoughts you are trying to express.
  sol: |
    This is a class game and has no written answer. One possible way to take part: choose a feeling such as "I am nervous before the exam" and show it with a frown, quick breathing and tapping fingers; or a thought such as "I am hungry" with a hand on the stomach. Watch which gestures the class understands, and note how Maxwell reads Mij's feelings in the same way: from what Mij does (nuzzling, chittering, splashing) rather than from words.
  check: none

- id: ncert10-ff-6-30
  lvl: ncert-ex
  num: "FF 6 · WR"
  source: NCERT X English · First Flight · Ch 6 · Writing
  kind: text
  q: |
    Write a description of a person or an animal (such as a pet) that you know very well and love very much. Questions (4) and (5) in 'Thinking about the Text' will have given you some idea about how to do this. Mention some things the person or animal does, what you think the person or animal feels, etc.
  sol: |
    One possible model answer (about 120 words):

    My grandmother's cat, Moti, is small and white, with one grey ear. In the morning she sits on the window sill and watches the sparrows, her tail twitching as if she is counting them. When my grandmother starts her prayers, Moti curls beside her and purrs, and I think she believes she is helping. She hates the rain: she stares at it through the glass with such offended eyes that we laugh. If I come home late, she jumps onto my bag and sniffs it all over, as though checking where I have been. After a long day I always find her at the door, and I think she is simply glad to see me. I love how she makes our house feel lived in.
  check: none

- id: ncert10-ff-6-31
  lvl: ncert-ex
  num: "FF 6 · WYCD Q1"
  source: |
    NCERT X English · First Flight · Ch 6 · What you can do (What we have done: narrated a story about an interesting and unusual pet)
  kind: text
  q: |
    The events narrated in this text took place over half-a-century ago. Discuss with your class what changes have taken place over these years in
    (i) what animals we can keep as pets (some species are protected under the laws for wildlife preservation)
    (ii) the laws for exporting and importing or trading in animals
    (iii) rules for transporting goods, pets, etc. on aircraft.
    The class might wish to do their own research on these questions and report their findings in class.
  sol: |
    One possible answer (discussion points, to be checked by your own research [Unverified]):
    (i) Many wild species, including several kinds of otter, are now protected by national and international law, so it is often illegal to capture and keep them; people mostly keep domestic animals such as dogs, cats, fish and birds that are permitted by law.
    (ii) International agreements and national wildlife laws now control, license or ban the export, import and trade of many animals, and animals need permits and health certificates.
    (iii) Airlines now follow detailed rules on carriers, sizes, ventilation, health papers and sometimes cargo-hold travel for pets; today it would be very unlikely that a wild animal could travel in the cabin.
  check: none

- id: ncert10-ff-6-32
  lvl: ncert-ex
  num: "FF 6 · WYCD Q2"
  source: NCERT X English · First Flight · Ch 6 · What you can do
  kind: text
  q: |
    Ask students if they know of other examples of unusual pets or of wild animals which are trained to work for or amuse humans (eg dancing bears, lions and tigers in a circus, elephants trained to work or take part in ceremonies). Then lead students into a discussion about the ethics of keeping wild animals as pets: What are the difficulties these may entail? According to the students, what will the animal miss most when it is taken away from its natural habitat? Do they think that it is 'cute' to see Mij the otter on a leash? Get them to look at the situation from all points of view.
  sol: |
    One possible answer: Other examples are performing monkeys, parrots kept in cages, and elephants used in temple processions. Difficulties include finding the right food, space and climate, the animal's fear and stress, danger to people, and the cost. The animal will miss most its freedom, its own kind and the natural habitat it is built for (for an otter, flowing water and the marsh). On the leash, Mij seems cute to Londoners, but he is being made to follow human habits of walking on a lead, which may not be fair to him. Seen from Maxwell's side, he loves and protects Mij; seen from the animal's side, it would rather live in the wild; seen from society's side, wildlife laws protect species. A fair view weighs all three.
  check: none

