- id: ncert10-ff-6-23
  lvl: ncert-ex
  num: "FF 6 · TT Q5"
  source: NCERT X English · First Flight · Ch 6 · Thinking about the text
  kind: text
  q: |
    Read the story and find the sentences where Maxwell describes his pet otter. Then choose and arrange your sentences to illustrate those statements below that you think are true.

    Maxwell's description
    (i) makes Mij seem almost human, like a small boy.
    (ii) shows that he is often irritated with what Mij does.
    (iii) shows that he is often surprised by what Mij does.
    (iv) of Mij's antics is comical.
    (v) shows that he observes the antics of Mij very carefully.
    (vi) shows that he thinks Mij is a very ordinary otter.
    (vii) shows that he thinks the otter is very unusual.
  sol: |
    One possible answer (the sentences are described, not copied):

    (i) true: Maxwell compares Mij's habits on walks to the rituals of children going to school (stepping on the centre of paving blocks).
    (iii) true: he watches "amazed" as Mij turns the tap on within a minute.
    (iv) true: the bath that makes "enough slosh and splash for a hippo", the face covered in curry, and the Londoners' wild guesses are all comic.
    (v) true: the ball dribbled with all four feet, the exact route of the ball down the suitcase, the thirty-yard wall, the habit that happens "on his way home, but never on his way out".
    (vii) true: Maxwell describes the first sight of Mij as a "medievally-conceived dragon", and calls the creature a race unknown to science.
    (ii) is only weakly supported. Maxwell is worried and anxious at times (in the box scene) but mostly amused, so I would not say he is often irritated. It is Mij who shows irritation at the tap.
    (vi) is false: Maxwell clearly thinks Mij is extraordinary.
  check: none

- id: ncert10-ff-6-24
  lvl: ncert-ex
  num: "FF 6 · TL I"
  source: NCERT X English · First Flight · Ch 6 · Thinking about language, I. Describing a Repeated Action in the Past
  kind: text
  q: |
    To talk about something that happened regularly in the past, but does not happen any longer, we use would or used to. Both would and used to can describe repeated actions in the past.
    (a) Mij would follow me without a lead and come to me when I called his name.
    (b) He would play for hours with a selection of toys.
    (c) On his way home… Mij would tug me to this wall.
    (d) When I was five years old, I used to follow my brother all over the place.
    (e) He used to tease me when Mother was not around.
    To describe repeated states or situations in the past, however, we use only used to. (We cannot use would for states or situations in the past.) So we do not use would with verbs like be, have, believe, etc. Look at the following sentences.
    (a) When we were young, we used to believe there were ghosts in school. (Note: believe shows a state of mind.)
    (b) Thirty years ago, more women used to be housewives than now. (Note: be here describes a situation.)
    From the table below, make as many correct sentences as you can using would and/or used to, as appropriate. (Hint: First decide whether the words in italics show an action, or a state or situation, in the past.) Then add two or three sentences of your own to it.

    Emperor Akbar | be fond of musical evenings.
    Every evening we | take long walks on the beach.
    Fifty years ago, very few people | own cars.
    Till the 1980s, Shanghai | have very dirty streets.
    My uncle | spend his holidays by the sea.
    (would / used to)
  sol: |
    One possible answer:
    - Emperor Akbar used to be fond of musical evenings. (state: only used to)
    - Every evening we would take long walks on the beach. / Every evening we used to take long walks on the beach. (action: both)
    - Fifty years ago, very few people used to own cars. (own is a state: only used to)
    - Till the 1980s, Shanghai used to have very dirty streets. (state: only used to)
    - My uncle would spend his holidays by the sea. / My uncle used to spend his holidays by the sea. (action: both)
    Own sentences: When I was small, I would climb the mango tree every afternoon. Our grandmother used to live in a village near the river. On Sundays my father would take us to the market.
    [Unverified] The table in the text layer has lost its italics, so which words are italic is inferred from the sentence meanings.
  check: none

