- id: m1
  lvl: main
  kind: text
  q: "Give a suitable opposite of sharp in each sentence: (a) a sharp knife (b) a sharp mind (c) a sharp bend in the road (d) a sharp rise in prices."
  sol: |
    One possible set of model answers: (a) blunt, (b) dull, (c) gentle, (d) gradual (or slight).

    A word has a separate antonym for each sense. In (a) *sharp* means able to cut, so the opposite is *blunt*. In (b) it means quick to understand, so *dull*. In (c) it means a sudden turn, so *gentle*. In (d) it means sudden and large, so *gradual* or *slight*.

    [Note] This is one possible model answer.
