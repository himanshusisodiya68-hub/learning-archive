    When Meena returned to her village after ten years, she found the old library abandoned. The roof had fallen in, the shelves were bare, and the courtyard, once noisy with children, was silent. Meena did not complain. She asked every household to donate a book, and within a month hundreds had arrived. Some neighbours were doubtful at first, but they were soon convinced as the walls rose. By winter the shelves were full again and the silence had given way to laughter.

    Find a word or phrase from the passage that is the opposite of each of the following.
