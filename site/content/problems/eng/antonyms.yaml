- id: m2
  lvl: main
  kind: mcq
  q: "A cylinder is labelled inflammable. What does the label warn you about?"
  opts: ["It cannot burn", "It catches fire easily", "It has already burnt", "It is very cold"]
  ans: 1
  sol: |
    *Inflammable* means easily set on fire, the same as *flammable*. The prefix in- here does not mean not (it comes from the sense of "into", as in *inflame*) [Unverified]. Because many people read it as "not flammable", safety labels now prefer *flammable*, and the true opposite is *non-flammable*.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "Explain the difference between disinterested and uninterested. Write one sentence for each word to show the difference."
  sol: |
    Model answer: *Uninterested* means not interested: *Rohan was uninterested in the cricket match and read a book.* *Disinterested* means impartial, with no personal gain at stake: *A disinterested judge decides the case only on the evidence.*

    In everyday speech many people use *disinterested* to mean uninterested, but in careful or formal writing the two are kept apart.

    [Note] This is a model answer written for this archive.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "Explain why 'She is not unhappy' is not the same as 'She is happy'. Name the figure of speech used."
  sol: |
    Model answer: *Happy* and *unhappy* are gradable opposites, with a middle ground of "neither very happy nor sad". Saying *not unhappy* only rules out the sad end of the scale; it leaves the person somewhere between content and happy, and it sounds like an understatement. *She is happy* is a plain, stronger claim.

    The figure of speech is **litotes**: affirming something by denying its opposite, usually to understate.

    [Note] This is a model answer written for this archive.
  check: none

- id: m5
  lvl: main
  kind: text
  q: "The word sanction can have two opposite meanings. Write two sentences that show them, and say what kind of word this is."
  sol: |
    Model answer: (1) *The principal sanctioned the school trip* (she gave permission). (2) *The world sanctioned the country for breaking the treaty* (it punished the country).

    A word with two opposite meanings is a **contronym**. A reader decides which meaning is meant from the rest of the sentence, so a writer should add a clear word if there is any risk of confusion.

    [Note] This is a model answer written for this archive.
  check: none

- id: m6
  lvl: main
  kind: mcq
  q: "Which sentence contains an oxymoron?"
  opts: ["The hall was silent, and the silence was heavy.", "The teacher's praise was a deafening silence.", "United we stand, divided we fall.", "The room was as quiet as a mouse."]
  ans: 1
  sol: |
    An oxymoron joins two opposite words in a single phrase. In the second option the phrase *deafening silence* puts a very loud word beside the word for no sound. The third is an antithesis, which balances opposite ideas across a whole sentence. The fourth is a simile, and the first has no clash of opposites.
  check: none
