- id: f1
  lvl: found
  kind: mcq
  q: "Choose the word that is opposite in meaning to ancient."
  opts: ["old", "modern", "historic", "broken"]
  ans: 1
  sol: |
    *Ancient* means belonging to a very distant past, so its opposite is *modern*. *Old* and *historic* are close in meaning to ancient, and *broken* has nothing to do with age.
