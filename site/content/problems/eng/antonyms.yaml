- id: f2
  lvl: found
  kind: mcq
  q: "Which pair is a complementary pair, with no middle point between the two words?"
  opts: ["hot and cold", "alive and dead", "buy and sell", "big and small"]
  ans: 1
  sol: |
    Something is either alive or dead, with nothing in between, so this is a complementary pair. Hot and cold are gradable (warm and cool lie between), big and small are gradable too, and buy and sell are relational, because each needs the other.
  check: none

