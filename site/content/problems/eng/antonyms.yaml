  q: "Add the correct prefix to form the opposite: (a) possible (b) legal (c) regular (d) honest (e) mature (f) visible."
  sol: |
    Model answer: (a) impossible, (b) illegal, (c) irregular, (d) dishonest, (e) immature, (f) invisible.

