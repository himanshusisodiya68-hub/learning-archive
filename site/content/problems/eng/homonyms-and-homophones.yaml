- id: b1
  lvl: board
  kind: text
  q: "Editing. Each line below has one error. Find the error and write the correct word. (a) Last Sunday our school took us to the sight of an old fort. (b) Our principle, Mrs Rao, spoke to us before we left. (c) She gave us some advise about staying together. (d) Everyone accept Ravi arrived on time. (e) We could not decide weather to carry umbrellas."
  sol: |
    Model answer:

    (a) *sight* should be *site* (a place where something stands). *Sight* means the ability to see.
    (b) *principle* should be *principal* (the head of the school, a person).
    (c) *advise* should be *advice* (a noun is needed after *some*; the noun takes c).
    (d) *accept* should be *except* (meaning "apart from").
    (e) *weather* should be *whether* (meaning "if").

    All five wrong words are real words, so the clue is the meaning and the part of speech, not the spelling. [Note] This is a model answer written for this archive, not an official board key.
  check: none

