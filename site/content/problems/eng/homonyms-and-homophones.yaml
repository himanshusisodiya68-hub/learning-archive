- id: f1
  lvl: found
  kind: mcq
  q: "Which word is a homophone of 'knight'?"
  opts: ["night", "kite", "knit", "nigh"]
  ans: 0
  sol: |
    A homophone sounds the same but is spelt differently and means something different. *Night* sounds exactly like *knight* (the silent k is not pronounced). *Kite* and *knit* sound different, and *nigh* (meaning near) rhymes with *high*, not with *knight*.
  check: none

