- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) Is Lencho's faith a strength or a weakness? Write a long answer of about 100-120 words, supporting your view with evidence from the story."
  sol: |
    One possible answer (about 110 words): Lencho's faith is both. It is a strength because it gives his family hope after the hailstorm has destroyed everything. While others would collapse in despair, he sits down and writes a letter, which is an act of courage. However, his faith is also a weakness, since it makes him blind. He is so sure that God cannot err that he does not question the shortage of money. He immediately blames the post office employees, who had helped him. Thus his faith helps him survive the crisis but blocks him from understanding the kindness of the people around him. The balance, then, is that faith without thought becomes a flaw.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Describe the postmaster's character, and say why you admire or do not admire his actions. Write about 100-120 words."
  sol: |
    One possible answer (about 110 words): The postmaster is warm-hearted, practical and respectful. At first he laughs with the postman at an address to God, but he becomes serious and wishes he had Lencho's faith. Rather than dismissing it, he decides to protect that faith by replying. He collects money from his staff, adds part of his own salary and asks friends, but can reach only a little over half. I admire him because he gives without expecting thanks. He acts on a stranger's behalf and is repaid with an insult. His quiet kindness shows that real charity does not need credit, and it makes him the moral centre of the story.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) 'The ending of the story is funny and sad at the same time.' Discuss, with reference to irony. Write about 100-120 words."
  sol: |
    One possible answer (about 110 words): The ending is funny because Lencho, after receiving help, complains that God's helpers are crooks and asks that the rest be sent by some other route than the mail. We, the readers, know the truth and smile at his certainty. This is dramatic irony. It is sad because the postmaster and his friends have given generously and are insulted for it. Lencho's blind faith prevents him from seeing human kindness, and he will never know who helped him. The situation is ironic because the people accused are exactly the ones who have been most generous. The story therefore leaves a smile mixed with unease.
  check: none
