# A Letter to God. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 1. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-ff-1-1
  lvl: ncert-ex
  num: "FF 1.1"
  source: NCERT X English · First Flight · Ch 1 · Before you read
  kind: text
  q: |
    They say faith can move mountains. But what should we put our faith in? This is the question this story delicately poses.

    Lencho is a farmer who writes a letter to God when his crops are ruined, asking for a hundred pesos. Does Lencho's letter reach God? Does God send him the money? Think what your answers to these questions would be, and guess how the story continues, before you begin to read it.
  sol: |
    One possible answer: Lencho's letter does not reach God in the literal sense, but it does reach a human reader. Someone may open it, be moved, and send some money. The story may then turn on how Lencho reacts to what he receives. (A prediction is a guess; the story itself shows what happens.)
  check: none

- id: ncert10-ff-1-2
  lvl: ncert-ex
  num: "FF 1.2"
  source: NCERT X English · First Flight · Ch 1 · Before you read, Activity 1
  kind: text
  q: |
    One of the cheapest ways to send money to someone is through the post office. Have you ever sent or received money in this way? Here's what you have to do. (As you read the instructions, discuss with your teacher in class the meanings of these words: counter, counter clerk, appropriate, acknowledgement, counterfoil, record. Consult a dictionary if necessary. Are there words corresponding to these English words in your languages?)
  sol: |
    One possible answer: counter = the long table or window at which customers are served; counter clerk = the official who sits behind it; appropriate = suitable; acknowledgement = written proof that something has been received; counterfoil = the part of a form or receipt kept by the issuer as a record; record = a written account kept for later reference. Your own languages will have matching words (for example, Hindi "kaaryaalay" for office, "rasid" for receipt). The printed instructions and form are in the book.
  check: none

