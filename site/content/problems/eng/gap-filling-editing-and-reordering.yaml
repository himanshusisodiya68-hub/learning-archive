- id: f3
  lvl: found
  kind: mcq
  q: "Which order of the jumbled parts makes a correct sentence? (P) to school (Q) walks (R) every day (S) Rina"
  opts: ["SQPR", "SPQR", "QSPR", "RSQP"]
  ans: 0
  sol: |
    Subject first (S, Rina), then the verb (Q, walks), then the place phrase (P, to school), then the time phrase (R, every day): "Rina walks to school every day." The other orders break the subject, verb, object backbone.
