- id: f4
  lvl: found
  kind: text
  q: |
    Fill each blank with one suitable word.
    Meena lives (1) ___ a small town (2) ___ the bank of (3) ___ river.
  sol: |
    Model answer: (1) in, (2) on, (3) a (or the, if a particular river is meant).

    (1) A place inside a town takes *in*. (2) *On the bank of* is the fixed phrase. (3) The river has not been named earlier, so *a* is the natural article; *the* is also acceptable if the river is known to the reader.

