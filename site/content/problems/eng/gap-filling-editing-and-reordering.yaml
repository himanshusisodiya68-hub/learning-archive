# Gap filling, editing and reordering. All problems are original (no NCERT items for this leaf). The board has no published key for these; every answer is a model answer written by us for this archive.

- id: f1
  lvl: found
  kind: mcq
  q: "Choose the word that fits the gap: Mohan is taller ___ his brother."
  opts: ["than", "then", "that", "from"]
  ans: 0
  sol: |
    A comparative adjective (*taller*) is followed by *than*. *Then* is about time, *that* is a pronoun or conjunction, and *different from* (not *taller from*) is a separate pattern.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Find the part with the error: She is (a) one of (b) the best (c) player (d) in the school."
  opts: ["(a) one of", "(b) the best", "(c) player", "(d) in the school"]
  ans: 2
  sol: |
    After *one of the best*, the noun is plural: *players*. The correct sentence is "She is one of the best players in the school." Parts (a), (b) and (d) are right.
