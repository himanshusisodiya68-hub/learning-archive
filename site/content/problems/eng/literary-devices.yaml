- id: m3
  lvl: main
  kind: text
  q: "A satirical story describes a king who boasts that nothing can harm him. The narrator praises his courage in grand language, but the events show him afraid of a small cat. (a) Which devices are at work? (b) What is the writer's real attitude? (c) How would the story change if told in first person by the king?"
  sol: |
    One possible model answer:

    (a) **Irony** (the gap between the narrator's praise and the king's real fear), **hyperbole** (the grand language of praise) and **satire** (their combined purpose is to mock).
    (b) The writer's real attitude is mocking: he wants the reader to see that the king's boasting is hollow and to laugh at pride.
    (c) In first person, the king would probably tell the story to flatter himself and might leave out or excuse the cat. The reader would then have to read between the lines, and the irony would be dramatic: we would see what the narrator refuses to admit. The tone would turn from open satire to the quieter humour of an unreliable narrator.

    This is one possible answer, written for this archive.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "Rewrite the plain sentence below in two different ways, one using personification and one using a simile, and then say which version you prefer for a sad story and why.\n\nPlain sentence: \"The house was empty after the family left.\""
  sol: |
    One possible model answer:

    Personification: *The house sighed as the last door closed behind the family.* (The house is given a human feeling.)
    Simile: *The house stood empty, like a shell after the sea has taken its creature.* (A comparison with something hollow and abandoned.)

    For a sad story, the personification may be better, because it makes the house itself seem to grieve and keeps the reader inside the feeling, while the simile paints a picture but keeps a little more distance. Either choice is acceptable if the reasoning is given: the point is that the device must suit the mood.

    This is one possible answer, written for this archive.
  check: none

- id: m5
  lvl: main
  kind: text
  q: "In a short story, a woman scorns an old brooch that she inherits, calling it cheap, and leaves it in a drawer. Years later, in a time of trouble, the brooch turns out to be worth a lot. (a) What device is this, and what kind? (b) Suggest one early detail that could foreshadow this turn. (c) Write a two-sentence flashback that explains why the brooch mattered to her grandmother."
  sol: |
    One possible model answer:

    (a) **Situational irony**: she dismisses the brooch, and it turns out to be what saves her, the opposite of what she (and the reader) expected.
    (b) An early detail such as a jeweller glancing twice at the brooch before saying it was "not for sale", or her grandmother wearing it only on special days, would foreshadow its true value without giving the secret away.
    (c) *Forty years earlier, a young bride had wept on a railway platform as her mother pinned the brooch to her sari. It was the last gift she carried from the home she would never see again.* The scene goes back in time and explains the brooch's hidden value.

    This is one possible answer, written for this archive.
  check: none
