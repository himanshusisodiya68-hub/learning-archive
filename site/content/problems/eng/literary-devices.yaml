# Literary devices. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "Which sentence contains a simile? "
  opts: ["The classroom was a zoo after the bell.", "Her smile was bright as the morning sun.", "The old clock groaned as it struck twelve.", "I have told you a million times."]
  ans: 1
  sol: |
    A simile compares two unlike things using *like* or *as*. "Bright as the morning sun" uses *as*, so option 2 is the simile. Option 1 says the classroom *was* a zoo (metaphor), option 3 gives the clock a human groan (personification), and option 4 is an exaggeration (hyperbole).
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "\"The wind whispered through the empty street.\" Which figure of speech is this?"
  opts: ["Simile", "Personification", "Alliteration", "Oxymoron"]
  ans: 1
  sol: |
    Whispering is something people do. The sentence gives the wind a human action, so it is personification. There is no *like* or *as* (not a simile), no repeated starting sound (not alliteration; *wind* and *whispered* share a sound only loosely), and no pair of opposites (not an oxymoron). The effect is a quiet, lonely mood.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "A story is told by a character who says \"I\" and describes only what she sees and feels. What is the point of view?"
  opts: ["First person", "Third person omniscient", "Third person limited", "Second person"]
  ans: 0
  sol: |
    A narrator who uses *I* and tells the events from inside her own experience is first person. The reader knows only what she knows or chooses to say.
