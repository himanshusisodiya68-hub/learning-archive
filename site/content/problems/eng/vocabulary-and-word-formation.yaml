- id: b4
  lvl: board
  kind: text
  q: "The paragraph below is vague. Rewrite it, replacing the underlined words (here shown in capitals) with exact verbs, nouns or adjectives. 'It was a NICE day, so we WENT to the fair. There was a VERY BIG crowd. I GOT a toy, and my sister GOT some sweets. The food was GOOD, and we had a lot of THINGS to do.'"
  sol: |
    One possible model answer (many versions are acceptable):

    "It was a crisp, sunny morning, so we strolled to the fair. A vast crowd, thousands strong, filled the grounds. I won a toy at the ring-toss stall, and my sister bought some sweets. The food was hot and fragrant, and we had dozens of rides, games and stalls to try."

    What was changed: *nice* became *crisp, sunny* (a detail instead of a label); *went* became *strolled* (the verb shows how); *very big* became *vast* and was given a number; *got* became *won* and *bought* (two different actions that *got* had hidden); *good* became *hot and fragrant*; *things* became a list of exact nouns.

    [Note] This is one possible answer written for this archive.
  check: none

- id: b5
  lvl: board
  kind: text
  q: "You are writing a leave application to your principal. Rewrite each informal line in a formal register. (1) I want to ask for a day off. (2) I got sick yesterday. (3) My mum will send a doctor's note. (4) The kids in my class say I need to rest."
  sol: |
    One possible model answer:

    (1) I would like to request leave for one day.
    (2) I was unwell yesterday.
    (3) My mother will send a medical certificate. (or "a doctor's certificate")
    (4) My classmates have advised me to rest. (In a real letter you would leave this out; what matters here is *kids* becoming *classmates*.)

    What changed: *ask for* became *request*, *got sick* became *was unwell*, *mum* became *mother*, and *kids* became *classmates*. The point is not to use bigger words but to remove casual ones. Formal writing is still plain and polite.

    [Note] Model answer written for this archive.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "Choose the right word from each pair and give a one-line reason. (a) The company introduced an (economic / economical) car that uses little fuel. (b) The (historic / historical) match ended with India's first win at the ground. (c) She is a very (sensible / sensitive) girl; a harsh word upsets her. (d) After three (successful / successive) defeats, the coach resigned."
  sol: |
    Model answer:

    (a) *economical*: it saves fuel, which means saving resources. *Economic* would mean "about the economy".
    (b) *historic*: it was an important moment worth remembering. *Historical* would only say that the match belongs to the past.
    (c) *sensitive*: the clue is that a harsh word upsets her. *Sensible* means having good sense.
    (d) *successive*: three defeats one after another. *Successful* would not suit defeats.

    [Note] Model answer written for this archive.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "Write one sentence each for stubborn, determined and thrifty, using the word in a context in which the feeling it carries is clear. Then explain in one line why you cannot swap stubborn and determined without changing the message."
  sol: |
    One possible model answer:

    - *Stubborn:* My uncle was stubborn about the route and refused to listen when we said the road was closed. (negative: refuses good advice)
    - *Determined:* Anita was determined to finish the marathon, and she kept going despite the heat. (positive: keeps going toward a goal)
    - *Thrifty:* My grandmother is thrifty; she saves jars and reuses them. (positive: careful with resources)

    Stubborn and determined both describe someone who will not give up, but stubborn suggests a person who is unreasonable and does not listen, while determined praises the effort. Swapping them flips whether the writer approves or disapproves. This difference is called connotation.

    [Note] This is one possible answer written for this archive.
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: "In which sentence is the word 'record' pronounced with the stress on its second syllable (reCORD)?"
  opts: ["She holds the school record in the high jump.", "Please record the lecture on your phone.", "His record at work is spotless.", "The record was broken in 2019."]
  ans: 1
  sol: |
    *Record* as a verb (to record) is stressed on the second syllable: *reCORD*. In the other three sentences it is a noun (a record), stressed on the first syllable: *REcord*. This noun-verb stress difference is a strong tendency in English (present, object, import, increase), not an exceptionless rule.
  check: none

- id: m4
