  kind: text
  q: "Mira starts a word bank. Every Sunday she copies 40 words and their dictionary meanings from a thesaurus into a notebook and re-reads them once. Give three improvements to her method and show one model entry for the word 'reluctant'."
  sol: |
    One possible model answer.

    Improvements: (1) Take fewer words, about three a day, and from texts she actually reads, so each word arrives in context. (2) Write each meaning in her own words and her own sentence, not the dictionary's. (3) Review by recall (cover the meaning, say it, check it) after a day, a week and a month, instead of re-reading once. [Unverified] The exact intervals vary between methods; the principle is spacing plus recall.

