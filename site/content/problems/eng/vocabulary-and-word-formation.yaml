- id: b1
  lvl: board
  kind: text
  q: "Fill in the blanks with the correct form of the word given in brackets. Write only the answers, numbered (a) to (e). Last month our town held a (a) ___ (celebrate) of its hundredth year. People from every part of the district gathered in the park to see the (b) ___ (perform) of local artists. The (c) ___ (organise) had worked very (d) ___ (hard) for weeks, and the result was a (e) ___ (memory) evening."
  sol: |
    Model answer: (a) celebration, (b) performance (or performances), (c) organisers, (d) hard, (e) memorable.

    (a) "a ___ of" needs a singular noun: *celebration*.
    (b) "the ___ of local artists" needs a noun: *performance* (the plural *performances* is also acceptable).
    (c) "The ___ had worked" needs a plural noun for people: *organisers*.
    (d) *Hard* is both the adjective and the adverb. It describes how they worked, so the bracket word stays as it is. Not every gap changes the word, and *hardly* would mean "almost not" and spoil the meaning.
    (e) "a ___ evening" needs an adjective: *memorable*. *Memorial* (a monument) and *memorised* do not fit.

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

