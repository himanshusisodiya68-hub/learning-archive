# Vocabulary and word formation. All problems are original (no NCERT items for this leaf), modelled on CBSE Class 10 gap-filling, editing and writing tasks. All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "Complete the sentence: The ___ of the new library took place on Monday. (open)"
  opts: ["opens", "opening", "opened", "openly"]
  ans: 1
  sol: |
    "The ___ of" is a noun slot: the word after *the* names a thing (an event). The noun made from *open* is *opening*. *Opens* and *opened* are verb forms, and *openly* is an adverb.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Complete the sentence: Priya answered every question ___. (confident)"
  opts: ["confident", "confidence", "confidently", "confidences"]
  ans: 2
  sol: |
    The gap tells us how she answered, so it describes an action: an adverb is needed. The adverb of *confident* is *confidently*. *Confident* is an adjective, and *confidence* and *confidences* are nouns.
