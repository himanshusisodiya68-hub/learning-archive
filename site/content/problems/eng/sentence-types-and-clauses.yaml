# Sentence types and clauses. All problems are original (no NCERT items for this leaf). There is no NCERT answer key: every answer is a model answer written by us.

- id: f1
  lvl: found
  kind: mcq
  q: "What type of sentence is this by purpose? \"What a wonderful goal that was!\""
  opts: ["Declarative", "Interrogative", "Imperative", "Exclamatory"]
  ans: 3
  sol: |
    It expresses strong feeling and begins with *what*, so it is exclamatory. It does not simply state a fact, ask a question or give a command.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Which group of words is a clause?"
  opts: ["under the old bridge", "to reach the station early", "the children were singing", "a bowl of fresh fruit"]
  ans: 2
  sol: |
    *The children were singing* has a subject (the children) and a finite verb (were singing). The other three have no finite verb of their own, so they are phrases.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Which of these is a simple sentence?"
  opts: ["Ravi opened the window and looked outside.", "Ravi opened the window, and he looked outside.", "When Ravi opened the window, he looked outside.", "Ravi opened the window, but nobody looked outside."]
  ans: 0
  sol: |
    Option 1 has one subject (*Ravi*) with two verbs, so it is one clause with a compound predicate: a simple sentence. Option 2 and option 4 each have two main clauses (compound). Option 3 has a subordinate clause (complex).
  check: none

