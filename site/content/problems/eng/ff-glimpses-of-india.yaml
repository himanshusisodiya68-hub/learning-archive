  kind: text
  q: |
    Can you say which parts of India grow (i) tea, (ii) coffee?
  sol: |
    One possible answer: (i) Tea: Assam, Darjeeling and the Dooars in the north-east, and the Nilgiris in the south. (ii) Coffee: the hill districts of Karnataka (Coorg or Kodagu, Chikmagalur), plus parts of Kerala and Tamil Nadu. The chapter itself places tea in Assam and coffee in Coorg.
