  kind: text
  q: |
    What images — of people and of places — come to your mind, when you think of our country?
  sol: |
    One possible answer: crowded railway platforms and tea sellers, farmers in paddy fields, women in colourful saris and turbans, school children in uniform; places such as the Himalayan peaks, the long coastline, desert forts, busy bazaars, temples, mosques and churches side by side. Any honest set of images you really associate with India is acceptable.
