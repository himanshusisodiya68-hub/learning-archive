  q: |
    Rajvir and Pranjol see the same tea garden, yet react differently. What does this tell us about how familiarity affects the way we see things? Answer in about 80 words, using the story and one example from your own life.
  sol: |
    One possible answer: Rajvir is thrilled by the green sea of bushes because it is new, while Pranjol, born on a plantation, shrugs it off and even says there are enough gardens to last a lifetime. Familiarity dulls wonder. The same happens when a Delhi resident walks past India Gate without a glance, while a visitor takes a dozen photographs. Rajvir's reading also shows that preparation and curiosity can bring back some of that wonder, since knowing the history of tea makes an ordinary scene interesting.
