- id: ncert10-ff-5-18
  lvl: ncert-ex
  num: "FF 5 · TL Q1"
  source: NCERT X English · First Flight · Ch 5 · A Baker from Goa · Thinking about language (comparison)
  kind: text
  q: |
    Compare the piece from the text (on the left below) with the other piece on Goan bakers (on the right). What makes the two texts so different? Are the facts the same? Do both writers give you a picture of the baker?

    [The two extracts are printed side by side in the book. Left: the opening of the chapter, "Our elders are often heard reminiscing nostalgically about those good old Portuguese days ... the son still carries on the family profession." Right, adapted from Nandakumar Kamat's 'The Unsung Lives of Goan Paders': "After Goa's liberation, people used to say nostalgically that the Portuguese bread vanished with the paders. But the paders have managed to survive because they have perfected the art of door-to-door delivery service. The paders pick up the knowledge of bread-making from traditions in the family. The leavened, oven-baked bread is a gift of the Portuguese to India."]
  sol: |
    One possible answer: The two texts differ in voice and purpose. The first is a personal, nostalgic pen-portrait full of sounds and memories ("our elders", "thud and jingle"). The second is a short, factual, impersonal report that explains why the paders survived (door-to-door delivery, family knowledge) and credits the Portuguese with leavened bread. The basic facts are the same: the paders and their trade survive and the skill passes within families. Both give some picture of the baker, but the first lets you see and feel him, while the second explains his trade.
  check: none

