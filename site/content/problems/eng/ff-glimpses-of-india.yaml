  num: "FF 5 · SP Q1"
  source: NCERT X English · First Flight · Ch 5 · A Baker from Goa · Speaking (group work)
  kind: text
  q: |
    In groups, collect information on how bakeries bake bread now and how the process has changed over time.
  sol: |
    One possible answer for a group report. Then: dough was mixed and shaped by hand and baked in wood-fired furnaces, and the baker sold door to door. Now: large bakeries use machines to mix and knead, controlled electric or gas ovens, slicing and packing machines, and deliver through shops and vans. Changes: faster and larger production, uniform quality, longer shelf life with packaging and preservatives, and more varieties (multigrain, sliced, filled). Some small bakeries still use traditional wood-fired ovens for their taste. (Facts here are general knowledge; verify them against your group's research.)
  check: none

