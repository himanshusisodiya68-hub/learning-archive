  kind: text
  q: |
    You may know that apart from the British, the Dutch and the French, the Portuguese have also played a part in the history of our country. Can you say which parts of India show French and Portuguese influences?
  sol: |
    One possible answer: Puducherry (Pondicherry) and Karaikal show French influence in their street layout, architecture and cuisine. Goa, Daman and Diu show Portuguese influence in churches, houses, food (bread, sweets) and names. [Unverified] Chandannagar in West Bengal was also a French settlement.
