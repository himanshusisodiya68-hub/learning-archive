- id: m1
  lvl: main
  num: "Original"
  source: Original problem (analysis)
  kind: text
  q: |
    "Glimpses of India" shows places through a memory, a travel guide and a dialogue. Pick two of the three and explain how the form changes what the reader learns. Support each point with a detail from the text.
  sol: |
    One possible answer: In "A Baker from Goa" the memory form lets us feel the place: the jhang of the bamboo staff, the fragrance of loaves, the pencilled accounts on a wall, so we learn what a baker meant to a child and a village but nothing about distances or routes. In "Coorg" the travel-guide form packs in facts (smallest district of Karnataka, thirty per cent rainforest, airports at Mangalore and Bangalore) and ends with a fact file, so we learn how to go and what to do, though the writer's voice appears only briefly ("I prefer to step aside for wild elephants"). The memory gives feeling, the guide gives use. Neither is better; each has a different reader in mind.
  check: none

