- id: m3
  lvl: main
  num: "Original"
  source: Original problem (language)
  kind: text
  q: |
    Rewrite each sentence correcting the -ing / -ed error, and explain in one line why it is wrong.

    (a) The trek was very tired, so we slept early.
    (b) She was boring during the long lecture.
    (c) I found the documentary fascinated.
  sol: |
    (a) The trek was very tiring, so we slept early. The trek causes the tiredness, so the -ing form describes it. (Or: We were very tired after the trek.)
    (b) She was bored during the long lecture. The lecture was boring, but she is the person who feels it, so -ed is right.
    (c) I found the documentary fascinating. The documentary causes the interest, so -ing is right.
  check: none

