  q: |
    When would the baker come everyday? Why did the children run to meet him?
  sol: |
    He came at least twice a day: once in the morning when he set out on his selling round, and again when he returned after emptying his huge basket. The children ran to meet him because of the bread-bangles (and sometimes special sweet bread), which they chose carefully. They did not run for the loaves, which were bought by the maid-servant.
