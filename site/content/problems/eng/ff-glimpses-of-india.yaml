    Incorrect: (iii) the writer says the eaters of loaves might have vanished but the makers are still there; (iv) the long frock (kabai) belonged to the Portuguese days, and later bakers wore shirt and trousers; (vii) the text says the baker and his family never starved, and nothing says they do now.

    (vi) is not supported: the text says baking was profitable in the old days and does not say how profitable it is now, so it cannot be marked correct from the passage. [Inference]
