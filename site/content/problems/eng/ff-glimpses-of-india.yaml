  num: "FF 5 · CO Q2"
  source: NCERT X English · First Flight · Ch 5 · Coorg · Questions (label inferred), Q2
  kind: text
  q: |
    What is the story about the Kodavu people's descent?
  sol: |
    The Kodavus are possibly of Greek or Arabic descent. One story says a part of Alexander's army moved south along the coast and settled in Coorg when return became impractical. The soldiers married local women, and their culture shows in the martial traditions, marriage and religious rites, which differ from the Hindu mainstream. The Arab theory is supported by the long black coat with an embroidered waist-belt (kuppia) that resembles the Arab kuffia.
  check: none

- id: ncert10-ff-5-24
  lvl: ncert-ex
  num: "FF 5 · CO Q3"
  source: NCERT X English · First Flight · Ch 5 · Coorg · Questions (label inferred), Q3
  kind: text
  q: |
    What are some of the things you now know about

    (i) the people of Coorg?
    (ii) the main crop of Coorg?
    (iii) the sports it offers to tourists?
    (iv) the animals you are likely to see in Coorg?
    (v) its distance from Bangalore, and how to get there?
  sol: |
    (i) They are fiercely independent, martial, hospitable and proud of their sons' and fathers' valour. The Coorg Regiment is among the most decorated in the Indian Army, General Cariappa was a Coorgi, and Kodavus may carry firearms without a licence.

    (ii) Coffee, grown on estates under tree canopies.

    (iii) River rafting, canoeing, rappelling, rock climbing and mountain biking, plus trekking on the walking trails.

    (iv) Macaques, Malabar squirrels, langurs, slender loris, birds, bees and butterflies, and wild elephants (and mahaseer fish in the Kaveri).

    (v) Coorg is about 250 to 260 km from Bangalore by road, by two almost equal routes, the more frequented via Mysore. The nearest airports are Bangalore (260 km) and Mangalore (135 km); the railheads are Mysore, Mangalore and Hassan; the only gateway is Madikeri.
  check: none

