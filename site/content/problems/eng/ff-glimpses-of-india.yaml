    (b) • a pleasant person   • a pleasant pillow
  sol: |
    Strike out the odd ones: (a) 'How young are you?' and (b) a pleasant pillow. 'How old are you?' and 'a pleasant person' are the usual combinations. (A pillow is usually described as soft or comfortable.)
