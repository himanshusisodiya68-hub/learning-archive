  source: NCERT X English · First Flight · Ch 5 · A Baker from Goa · Speaking (group presentation)
  kind: text
  q: |
    There are a number of craft-based professions which are dying out. Pick one of the crafts below. Make a group presentation to the class about the skills required, and the possible reasons for the decline of the craft. Can you think of ways to revive these crafts?

    (i) Pottery
    (ii) Batik work
    (iii) Dhurri (rug) weaving
    (iv) Embroidery
    (v) Carpentry
    (vi) Bamboo weaving
    (vii) Making jute products
    (viii) Handloom
  sol: |
    One possible answer, for (viii) Handloom. Skills: preparing yarn, setting up the loom, weaving patterns by hand, and a good eye for colour and design. Reasons for decline: power looms make cloth faster and cheaper; younger people see little income in the work; raw material costs rise; middlemen take much of the profit. Ways to revive: market handloom as premium and eco-friendly; sell online directly to buyers; run training schemes and design workshops; make school and office uniforms from handloom; give weavers fair prices and easier credit.
