  q: |
    Read the paragraph and answer the question.

    > The new bridge opened in June. It cut the journey time between the two villages from an hour to twenty minutes, which delighted the people on both banks. However, they soon found that it could not take heavy trucks, and these had to keep using the old road, which was narrow and often blocked.

    In the last sentence, "these" refers to:
  opts: ["the two villages", "the people on both banks", "heavy trucks", "the old road"]
  ans: 2
  sol: |
    A pronoun refers back to the nearest noun that fits. The sentence says the bridge "could not take heavy trucks, and these had to keep using the old road". Only the trucks can "use the old road" because the bridge cannot take them, so "these" means heavy trucks. Villages, people and the old road do not fit the meaning of the sentence.
