# Unseen passages. All problems and all passages are original, written for this archive (no NCERT items for this leaf; the places, people and figures in the passages are invented for practice). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: text
  q: |
    Read the passage and answer the questions.

    > Every Sunday, before the sun has fully risen, the road behind our colony turns into a market. By six o'clock the sellers have arrived with their carts and cloth sheets. Shanta Bai spreads her bangles on a blue tarpaulin; two lanes down, old Mr Joseph unfolds a table of second-hand books, each priced at ten rupees. Near the tea stall, a man weighs green chillies on a brass scale and shouts the day's price to nobody in particular.
    >
    > By eight, the lane is so crowded that one can only move at the speed of the crowd. Children are tugged along by their mothers. A boy balances a tray of glasses of sugarcane juice and somehow never spills a drop. The smell of frying jalebis rolls over everything, and the sound of bargaining rises and falls like waves.
    >
    > What surprises visitors is that nothing here is written down. There are no price tags, no bills and no signboards. Sellers remember their regular customers and who owes them a rupee. A woman who buys vegetables every week may quietly be handed an extra bunch of coriander. The market runs on memory and trust.
    >
    > By noon the sellers begin to pack up. Unsold fruit is sold cheap, then cheaper still, and by one o'clock the municipal van arrives to sweep the lane. When the last cart rolls away, the road is only a road again, as quiet as any other afternoon, waiting for the following Sunday.

    (a) Choose the best title: (i) Shopping for Bangles; (ii) A Market That Lives for One Morning; (iii) The Municipal Van; (iv) How to Bargain.
    (b) At what time does the lane become very crowded?
    (c) What is the price of each second-hand book at Mr Joseph's table?
    (d) According to the passage, what surprises visitors to the market?
    (e) True, False or Not given: "The municipal van comes to the lane every day of the week."
  sol: |
    Model answers, written for this archive.

    (a) (ii) A Market That Lives for One Morning. The passage follows the market from the early setting-up to the packing-up and ends with the road returning to normal. Option (i) and (iii) are single details (too narrow) and (iv) is not discussed.

    (b) By eight o'clock (paragraph 2, first sentence). This is a scanning question: look for a clock time near the idea of a crowd.

    (c) Ten rupees (paragraph 1).

    (d) That nothing is written down: there are no price tags, bills or signboards, and the market works on the sellers' memory and trust (paragraph 3).

    (e) Not given. The passage says that the van arrives at one o'clock after the Sunday market, but it does not say how often it comes to the lane on other days.
  check: none

