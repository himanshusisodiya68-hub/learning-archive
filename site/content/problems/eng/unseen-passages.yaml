- id: b5
  lvl: board
  kind: mcq
  q: |
    Read the passage and answer the question.

    > A school's survey found that 40 per cent of its students cycled to school in 2023. In 2024 the figure rose to 50 per cent. The principal described this as "a rise of ten per cent".

    Which statement is the most accurate description of the change?
  opts: ["The share of students who cycle rose by 10 percentage points, from 40 to 50 per cent", "The number of students who cycle rose by exactly 10", "The share of students who cycle did not change", "Half of the students who did not cycle in 2023 began to cycle in 2024"]
  ans: 0
  sol: |
    The share moved from 40 per cent to 50 per cent, a rise of 10 *percentage points*. The principal's "ten per cent" is loose wording: as a proportion of the earlier figure the rise is 10 / 40 = 25 per cent, but the plain statement of what the survey found is the first option. The second option confuses a share with a head-count, since the passage gives no numbers of students. The third contradicts the passage. The fourth is wrong too: of the 60 per cent who did not cycle in 2023, only about one-sixth (10 out of 60) would have started, if the school's size stayed the same.
  check: none

- id: m1
  lvl: main
  kind: text
  q: |
    Read the passage and answer the questions.

    > **Specialist or generalist?**
    >
    > Every few years a new list appears of the careers of the future, and every list says roughly the same thing: the world is changing too fast for anyone to be sure which skills will matter. It is odd, then, to find so many young people being urged to specialise early. Choose a stream at fifteen, a branch at seventeen, a speciality at twenty-two, say the advisers, and become the best in the country at one thing.
    >
    > The case for specialisation is strong, and it is easy to see why it persuades. Depth takes time. A surgeon, a violinist or a chip designer is made over thousands of hours, and no one reaches that level by sampling a little of everything. Specialists are also easier to hire, for an employer can see at once what they can do.
    >
    > But the generalist has her own case, and it deserves a hearing. Those who range widely tend to notice connections that a specialist, with her eyes on a narrow field, can miss: an engineer who has studied music may hear a pattern in a vibration, and a doctor who has read history may spot an old mistake being repeated. When a field is shaken by a sudden change, it is often an outsider who sees the way forward, because he is not attached to the old way of doing things.
    >
    > The real danger, however, may lie not in either path but in choosing too soon and too firmly. A teenager who commits to a narrow track on the strength of one good result, or her parents' preference, may discover at thirty that she has built a house on ground she never chose. Equally, someone who never commits at all may end with a thin acquaintance with many things and mastery of none.
    >
    > Perhaps the most useful advice is the least dramatic: go deep in something, but keep the windows open. A person who has one subject she knows thoroughly and several she is curious about has a way of learning how to learn, which no list of future careers can take away.

    1. Why does the writer begin by mentioning lists of "careers of the future"?
    2. According to the second paragraph, what makes the case for specialisation strong? Give two reasons.
    3. What point is made by the example of the engineer who has studied music?
    4. Explain "built a house on ground she never chose".
    5. Which statement would the writer most probably agree with? (a) Students should delay choosing any subject until the age of thirty; (b) A person should gain real depth in one subject while staying curious about others; (c) Specialists are less useful than generalists; (d) Lists of future careers are a reliable guide.
    6. Is the writer's tone one-sided or balanced? Support your answer with a phrase from the passage.
  sol: |
    Model answers, written for this archive.

    1. To show that nobody can be sure which skills will matter in the future, which makes early, narrow specialisation look risky ("it is odd, then...").

    2. Depth takes a long time (thousands of hours to become a surgeon, a violinist or a chip designer), and specialists are easier for employers to hire because their skills are clear.

    3. That people with wide interests notice connections that someone focused on a narrow field may miss.

    4. A person who commits too early may build her whole career on a choice that was not truly her own (made on one good result, or to please parents), and may realise this only years later when it is hard to change.

    5. (b). This is the advice in the last paragraph ("go deep in something, but keep the windows open"). (a) and (c) are extreme: the writer values depth and does not call specialists less useful. (d) is the opposite of the first paragraph.

    6. Balanced. The writer gives the specialist's case fairly ("The case for specialisation is strong") and then says the generalist's case "deserves a hearing"; the danger is placed in choosing too early, not in either path. Phrases such as "Perhaps the most useful advice" show a measured, not a dogmatic, tone.
  check: none

- id: m2
  lvl: main
  kind: text
  q: |
    Read the notice and answer the questions. (Case-based factual passage with a table.)

    > **Sunrise Public School: Annual Science Fair.** The fair will be held on Friday, 14 November in the school hall and on the playground. Visitors are welcome from 10 a.m. to 4 p.m. and must register at the gate. Parking is limited to 60 vehicles.

    | Event | Time | Venue |
    |---|---|---|
    | Opening address | 10:00 a.m. | Hall |
    | Model exhibition (Classes 6 to 8) | 10:15 a.m. to 12:00 noon | Hall |
    | Lunch break (coupon Rs 30) | 12:00 noon to 12:30 p.m. | Playground |
    | Project demonstrations (Classes 9 and 10) | 12:30 p.m. to 2:30 p.m. | Hall |
    | Rocket launch | 2:30 p.m. | Playground |
    | Prize distribution | 3:30 p.m. | Hall |

    > **Revised notice, 12 November.** Because rain is forecast for Friday afternoon, the rocket launch has been moved to 11:30 a.m. All other timings are unchanged.

    1. What is the last event of the day, and when does it begin?
    2. After the revised notice, how long will visitors have between the end of the model exhibition and the first project demonstration?
    3. A parent arrives at 12:15 p.m. hoping to see the Class 7 model exhibition. Can she? Give a reason.
    4. A visitor wishes to see both the rocket launch and the Class 10 demonstrations. Is this possible after the revision? Explain.
    5. True, False or Not given: "Visitors must pay an entry fee at the gate."
    6. How many events in the table are described as costing money?
  sol: |
    Model answers, written for this archive.

    1. The prize distribution, which begins at 3:30 p.m.

    2. 30 minutes: the exhibition ends at 12:00 noon and the demonstrations begin at 12:30 p.m. (that half hour is the lunch break, unchanged in the revised notice).

    3. No. The model exhibition for Classes 6 to 8 ends at 12:00 noon, and the lunch break begins at that time, so by 12:15 p.m. it has ended.

    4. Yes. After the revision the rocket launch is at 11:30 a.m. on the playground, and the Class 9 and 10 demonstrations begin at 12:30 p.m. in the hall, so a visitor can see the launch first and the demonstrations afterwards, with lunch in between.

    5. Not given. The notice says visitors "must register at the gate" but does not mention any fee, so we cannot say that one is charged.

    6. One: only the lunch break is marked with a price (a coupon of Rs 30).
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: |
    Read the passage and answer the question.

    > Some people say that rivers in cities are too dirty to be saved. The experience of the Lakshmi, a small river that flows through our town, suggests otherwise. Ten years ago it was little better than a drain. Then residents stopped dumping rubbish into it, the council built a sewage plant, and a school's nature club began monthly clean-ups. Today children paddle in it again, although it is still not safe to drink. Success took patience: for the first three years there was little visible change.

    Which statement best expresses the writer's view?
  opts: ["City rivers can never be saved.", "The Lakshmi is now safe to drink from.", "A dirty city river can recover, but it takes combined effort and time.", "The school's nature club alone cleaned the Lakshmi."]
  ans: 2
  sol: |
    The third option sums up the passage: recovery is possible ("suggests otherwise"), required effort from residents, the council and the club, and needed patience (three years of little change).

    The first option is the view the writer is arguing against (and uses the extreme word "never"). The second contradicts the passage ("still not safe to drink"). The fourth is too narrow and gives all the credit to one group, although the passage names three. Each wrong option is a different type of distractor: reversal, contradiction and a too-narrow detail.
  check: none

- id: m4
  lvl: main
  kind: text
  q: |
    Read the paragraph.

    > The Anand Bakery opens at five in the morning, long before most shops on the street. Mr Anand learned the trade from his father and still uses the old brick oven, although his sons have urged him to buy an electric one. He says the oven gives the bread a flavour that no machine can copy. By seven the shelves are empty, and customers who arrive late go home with nothing but the smell.

    Frame three questions on this paragraph: one multiple-choice question, one short-answer question, and one True / False / Not given statement. Give the correct answer to each. (This is an open-ended task; one possible set of questions and model answers is given.)
  sol: |
    One possible answer, written for this archive. Other well-framed questions are equally acceptable.

    **MCQ.** Why does Mr Anand not buy an electric oven? (a) He cannot afford one; (b) His sons do not want one; (c) He believes the old oven gives the bread a flavour a machine cannot copy; (d) The shop is too small. Answer: (c). Options (a), (b) and (d) are not given in the passage; (b) is also the reverse of what it says, since the sons urge him to buy one.

    **Short answer.** What happens to customers who come after seven o'clock? Answer: They find the shelves empty and go home with nothing but the smell of bread.

    **True / False / Not given.** "Mr Anand's sons want him to replace the brick oven." Answer: True (they have "urged him to buy an electric one").

    What makes these good questions: each can be answered from one place in the paragraph, has one clear answer, and (for the MCQ) the wrong options are plausible but can be shown wrong from the text.
  check: none

- id: m5
  lvl: main
  kind: text
  q: |
    Read the passage and answer the questions.

    > The council has announced that the avenue of old neem trees outside the railway station will be cut down to widen the road. It is a decision taken with great speed and little discussion. The notice was displayed for three days; the trees have stood for ninety years. No survey of traffic was published, and no plan to plant new trees was mentioned. We are told that the wider road will save five minutes on the journey to the market. It seems that we have found a very costly way to reach the shops sooner.

    1. What is the writer's purpose: to inform, to entertain or to criticise? Explain in a sentence.
    2. Which word best describes the tone: (a) cheerful; (b) neutral; (c) critical and ironic; (d) fearful?
    3. Quote a sentence that shows that the decision was hasty.
    4. What does the last sentence suggest about the writer's view of the plan?
  sol: |
    Model answers, written for this archive.

    1. To criticise. The writer sets the council's speed and the short notice against the age of the trees, and points out what the plan leaves out (no survey, no replanting), so the passage is a protest, not a plain report.

    2. (c) critical and ironic. The last sentence calls the plan "a very costly way to reach the shops sooner", which says the opposite of praise, in a sharp, restrained way.

    3. "It is a decision taken with great speed and little discussion." (A second proof: "The notice was displayed for three days; the trees have stood for ninety years.")

    4. That the writer thinks the price (ninety-year-old trees) is far too high for the benefit (about five minutes saved), so the plan is a poor bargain.
  check: none
