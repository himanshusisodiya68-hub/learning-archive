- id: b1
  lvl: board
  kind: text
  q: |
    Read the passage and answer the questions. (Discursive passage, in the style of the CBSE paper.)

    > **Handwriting in the age of keyboards**
    >
    > When did you last write a full page by hand? For many students the honest answer is "in the last exam". Keyboards and touchscreens have taken over so much of our writing that some schools have begun to wonder whether handwriting deserves a place on the timetable at all. The argument against it is easy to state: typing is faster, neater and easier to correct, and the world of work runs on screens.
    >
    > There is, however, another side. Many teachers point out that writing by hand is slow, and that this slowness is useful. A student who copies a lecture word for word on a laptop can finish with pages of notes and very little understanding, because the fingers have done the work without the mind. A student writing by hand cannot keep up with the speaker and must choose what matters, rephrasing as she goes. In effect, she begins studying while she is still taking notes.
    >
    > Handwriting may also help young children learn to read. Forming the shape of a letter with one's own hand gives the child a physical memory of it, which looking at a picture or pressing a key does not. Teachers report that children who write their letters often recognise them sooner.
    >
    > None of this means that keyboards should be banished. A child who finds handwriting painful should be free to type, and a long report is better typed than scrawled. The sensible position is not to choose one tool for ever but to match the tool to the task. A shopping list, a diary entry or the first rough notes of an idea might belong on paper; a polished essay, a spreadsheet or an email may belong on a screen.
    >
    > What would be a pity is for handwriting to vanish through neglect rather than choice. Like cycling or swimming, it is a skill that stays with us only if it is practised, and a person who has not written a letter by hand for years may find that their own writing has become hard to read, even to themselves.

    1. What is the passage mainly about? (a) Why keyboards should replace handwriting; (b) Why handwriting still has value and how to use both tools; (c) How children learn to read; (d) Why long reports should be typed.
    2. According to paragraph 1, what is the argument against teaching handwriting?
    3. Why does the writer say that the slowness of handwriting is "useful"?
    4. The phrase "the fingers have done the work without the mind" suggests that the student: (a) typed with great skill; (b) recorded the words without really thinking about them; (c) disliked the lecture; (d) wrote more neatly than others.
    5. Which of these does the writer NOT say? (a) A long report is better typed; (b) Handwriting may help children to recognise letters; (c) Handwriting should be taught only to adults; (d) Writing by hand makes a student choose what matters.
    6. What does the writer mean by "match the tool to the task"?
    7. Why does the writer compare handwriting with cycling or swimming?
    8. Find a word in the fourth paragraph that means "sent away" or "driven out".
  sol: |
    Model answers, written for this archive.

    1. (b). The passage weighs the case against handwriting but mostly argues for keeping it and for choosing the right tool. (a) and (c) and (d) are each only a part of the passage.

    2. Typing is faster, neater and easier to correct, and work today is done on screens (paragraph 1, last sentence).

    3. Because it forces the student to pick what is important and put it in her own words, so she starts understanding the lecture while taking notes (paragraph 2).

    4. (b). The sentence contrasts copying "word for word" with understanding: the fingers moved but the student did not think about the words.

    5. (c). The writer never says handwriting is only for adults; the passage is about children and students. The other three options are stated.

    6. Use handwriting or the keyboard depending on what you are doing: paper for lists, diaries and rough notes; a screen for polished essays, spreadsheets and emails (paragraph 4).

    7. To show that handwriting is a skill that is kept only by practice, and that it fades if left unused, just as cycling or swimming would (last paragraph).

    8. *Banished* (paragraph 4, "keyboards should be banished").
  check: none

- id: b2
  lvl: board
  kind: text
  q: |
    Read the passage and answer the questions. (Case-based factual passage, in the style of the CBSE paper.)

    > The city of Nandgaon launched a public bicycle-sharing scheme, Pedal Nandgaon, on 2 October last year. Riders unlock a bicycle from any of the 40 docking stations using a mobile app and return it to any station. The first 30 minutes of each ride are free; after that the charge is Rs 5 for every extra 15 minutes or part of it. The city council published these figures after the first twelve months.

    | Quarter | Rides (in thousands) | Average ride (minutes) |
    |---|---|---|
    | October to December | 48 | 22 |
    | January to March | 66 | 25 |
    | April to June | 54 | 19 |
    | July to September | 32 | 17 |

    > The report notes that the scheme was used most in the cool months and least in the monsoon. Surveys at the stations showed that 52 per cent of riders used a bicycle to reach a bus stop or metro station, 31 per cent used it for shopping or errands, and the rest for exercise. Because the first half hour is free and the average ride is shorter than that, most riders pay nothing. This worries the council's finance committee: the scheme costs Rs 1.2 crore a year to run, but only Rs 15 lakh came from fees. The transport officer disagrees. She argues that a public service should be judged by the car trips it replaces, not by the money it earns. The council will review the fee structure in December, but no change has yet been announced.

    1. In which quarter was the average ride longest? (a) October to December; (b) January to March; (c) April to June; (d) July to September.
    2. How many rides were taken between April and September, in all?
    3. What percentage of riders used the bicycles for exercise?
    4. Why do most riders pay nothing?
    5. True, False or Not given: "The council has decided to raise the fees."
    6. Roughly what fraction of the yearly running cost was met by fees? (Take 1 crore = 100 lakh.)
    7. On what basis does the transport officer say the scheme should be judged?
  sol: |
    Model answers, written for this archive.

    1. (b) January to March: 25 minutes, the largest value in the third column.

    2. April to June and July to September: 54 thousand + 32 thousand = 86 thousand rides (86,000).

    3. 52 + 31 = 83 per cent used it for a bus stop or metro, or for shopping or errands, so the remaining 100 - 83 = 17 per cent used it for exercise.

    4. Because the first 30 minutes of each ride are free and the average ride (17 to 25 minutes) is shorter than 30 minutes.

    5. False. The passage says the council will review the fee structure in December and that no change has yet been announced. (It is not "Not given", because the passage speaks about it and says that no change has been announced.)

    6. Running cost = Rs 1.2 crore = Rs 120 lakh; fees = Rs 15 lakh. 15 / 120 = 1/8, so about one-eighth (12.5 per cent).

    7. By the number of car trips it replaces, not by the money it earns.
  check: none

