- id: ncert10-fp-6-4
  lvl: ncert-ex
  num: "FP 6 · RF2 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Read and find out (2)
  kind: text
  q: |
    What lesson does Ebright learn when he does not win anything at a science fair?
  sol: |
    One possible answer: In the seventh grade he showed slides of frog tissues under a microscope and won nothing. He realised that the winners had tried to do real experiments and had not simply made a neat display. He decided that for the next fair he would do a real experiment, and so he turned to the insect work he knew best.
  check: none

- id: ncert10-fp-6-5
  lvl: ncert-ex
  num: "FP 6 · RF2 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Read and find out (2)
  kind: text
  q: |
    What experiments and projects does he then undertake?
  sol: |
    One possible answer: In the eighth grade he tested whether a beetle carries the virus that kills monarch caterpillars; he found no real results but showed his attempt and won. Next he tested whether birds eat monarchs, to check the idea that viceroys copy them; a starling ate all the monarchs it could get, and the project placed first in zoology. In high school he studied the twelve gold spots on a monarch pupa and found that they produce a hormone needed for development. He then grew monarch wing cells in a culture, worked in army and agriculture laboratories, and identified the hormone's chemical structure.
  check: none

- id: ncert10-fp-6-6
  lvl: ncert-ex
  num: "FP 6 · RF2 Q3"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Read and find out (2)
  kind: text
  q: |
    What are the qualities that go into the making of a scientist?
  sol: |
    One possible answer: The author says to start with a first-rate mind, add curiosity, and mix in the will to win for the right reasons. The story adds persistence, such as years of experiments and long hours of research; willingness to do real experiments and accept a null result; and the support of a mother, a scientist who suggested projects and a teacher who opened his mind.
  check: none

- id: ncert10-fp-6-7
  lvl: ncert-ex
  num: "FP 6 · Think Q1"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Think about it, Question 1
  kind: text
  q: |
    How can one become a scientist, an economist, a historian... ? Does it simply involve reading many books on the subject? Does it involve observing, thinking and doing experiments?
  sol: |
    One possible answer: Reading is necessary because it gives a person the knowledge others have built, but it is not enough. Ebright's story shows that a scientist also observes carefully, asks a simple question, designs an experiment to test it, and thinks about the result, even when the result is no result. A historian similarly checks sources and compares accounts, and an economist collects and examines data. Curiosity, patience, help from teachers and mentors, and the habit of testing ideas all matter along with books.
  check: none

- id: ncert10-fp-6-8
  lvl: ncert-ex
  num: "FP 6 · Think Q2"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Think about it, Question 2
  kind: text
  q: |
    You must have read about cells and DNA in your science books. Discuss Richard Ebright's work in the light of what you have studied. If you get an opportunity to work like Richard Ebright on projects and experiments, which field would you like to work on and why?
  sol: |
    One possible answer: Your science books say that DNA in the nucleus of a cell carries the instructions for its form and function, and that hormones are chemical messengers. Ebright found that the gold spots on a monarch pupa make a hormone needed for full development, and later put forward a theory of how a cell reads its DNA blueprint. If proved, the theory could help in preventing some cancers and other diseases. Second part, a personal answer: I would like to work on plant science and crop disease, because failed harvests affect many families, and experiments with seeds and soils can be done with simple equipment. Give your own field and your own reason.
  check: none

- id: ncert10-fp-6-9
  lvl: ncert-ex
  num: "FP 6 · Talk Q1"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Talk about it, Question 1
  kind: text
  q: |
    Children everywhere wonder about the world around them. The questions they ask are the beginning of scientific inquiry. Given below are some questions that children in India have asked Professor Yash Pal and Dr Rahul Pal as reported in their book, Discovered Questions (NCERT, 2006).

    (i) What is DNA fingerprinting? What are its uses?

    (ii) How do honeybees identify their own honeycombs?

    (iii) Why does rain fall in drops?

    Can you answer these questions? You will find Professor Yash Pal's and Dr Rahul Pal's answers (as given in Discovered Questions) on page 75.
  sol: |
    [Unverified] The book's printed answers on page 75 are not in the text layer. These are model answers from general science.

    (i) Every person's DNA has stretches that differ from other people's. DNA fingerprinting reads a pattern of these stretches from a small sample such as blood, hair or skin. Unrelated people have different patterns, relatives share some. It is used to identify criminals or clear the innocent, to settle questions of parentage, and to identify remains.

    (ii) One possible answer: bees recognise their own hive and comb mainly by smell. Members of a colony share a colony scent, and guards at the entrance turn away strangers. They also remember the position and look of the hive.

    (iii) Water in a cloud collects round tiny specks as small droplets. Surface tension pulls a free blob of water into a round shape, and small droplets join into bigger ones until they are heavy enough to fall. Air resistance keeps the falling drop in a drop shape, and very large drops break up on the way down.
  check: none

- id: ncert10-fp-6-10
  lvl: ncert-ex
  num: "FP 6 · Talk Q2"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Talk about it, Question 2
  kind: text
  q: |
    You also must have wondered about certain things around you. Share these questions with your class, and try and answer them.
  sol: |
    One possible answer: Questions might include why the sky turns red at sunset, why leaves change colour in autumn, or how a mobile phone finds a signal. A model attempt at the first: sunlight has to pass through more air at sunset, and the air scatters the blue light away from your eyes, leaving the red and orange. Your own questions and answers will differ, and discussing them with the class is the point of the activity.
