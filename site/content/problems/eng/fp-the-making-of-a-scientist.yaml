- id: m1
  lvl: main
  kind: text
  q: |
    What does the author mean when he says that Richard Ebright is competitive 'but not in a bad sense'? Use evidence from Mr Weiherer's comments to explain, in about 100 words.
  sol: |
    One possible answer: Mr Weiherer says Ebright did not want to win for winning's sake or to collect prizes. He wanted to do the best job he could and wanted to be the best for the right reasons. The evidence is his extra effort, since he spent three or four hours a night on debate research beside all his butterfly work. So the competitiveness is a drive for excellence, with no unfair treatment of others, not a hunger for glory. It is also the third ingredient in the author's recipe for a scientist.
  check: none

- id: m2
  lvl: main
  kind: text
  q: |
    'Everyone assumed the spots were just ornamental. But Dr Urquhart didn't believe it.' Explain how this one question shows the difference between a scientist and an ordinary observer.
  sol: |
    One possible answer: An ordinary observer is satisfied with the easy explanation that the spots are decoration. A scientist asks what they are for, then builds a way to test it. Dr Urquhart doubted the assumption and Ebright designed a device to show that the spots produce a hormone needed for full development. The question led to a new discovery, then to the hormone's structure, and finally to a theory about cells. So the difference lies in refusing to assume, and in turning a doubt into an experiment.
  check: none

- id: m3
  lvl: main
  kind: text
  q: |
    Does the chapter suggest that anyone can become a scientist if they try hard enough? Write a short argument (100-120 words) using evidence from the chapter and your own view.
  sol: |
    One possible answer: Partly. The chapter stresses effort, curiosity and doing real experiments, which anyone can practise. Yet it also lists advantages: a first-rate mind, a mother with time and money for equipment, a scientist who answered a child's letter, and a teacher who opened his mind. Not every child has these. I would argue that hard work and curiosity are necessary, but support matters too, so schools and communities should supply what a family cannot. Ebright's story shows what is possible when both effort and opportunity meet. [Opinion; other well-argued views are equally acceptable.]
  check: none

- id: m4
  lvl: main
  kind: text
  q: |
    Write a paragraph of about 120 words on 'Display versus experiment' using Ebright's seventh-grade and eighth-grade science fair projects as evidence.
  sol: |
    One possible answer: A display shows what is already known, while an experiment tests what is not. In the seventh grade Ebright showed slides of frog tissues under a microscope, which looked neat but asked no question, and he won nothing. He saw that the winners had done real experiments. In the eighth grade he asked whether a beetle spreads the virus that kills monarch caterpillars, raised caterpillars with beetles, and found nothing. Yet he won, because he had tried a real test and honestly reported it. The two fairs show that science is judged by the quality of the question and the honesty of the method, not by decoration or by a successful result.
  check: none
