# The Making of a Scientist. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 6. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-6-1
  lvl: ncert-ex
  num: "FP 6 · RF1 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Read and find out (1)
  kind: text
  q: |
    How did a book become a turning point in Richard Ebright's life?
  sol: |
    One possible answer: By the second grade Ebright had collected all twenty-five butterfly species of his town and might have stopped there. His mother then gave him a children's book, The Travels of Monarch X, which told how monarchs migrate to Central America. At its end it invited readers to help by tagging butterflies for Dr Urquhart. This turned a collector into a young researcher, so the book opened the world of science to him.
  check: none

- id: ncert10-fp-6-2
  lvl: ncert-ex
  num: "FP 6 · RF1 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 6 · Read and find out (1)
  kind: text
  q: |
    How did his mother help him?
  sol: |
    One possible answer: She encouraged his curiosity in many ways. She took him on trips and bought him telescopes, microscopes, cameras and mounting materials. She spent evenings with him at the dining table and found learning tasks when he had nothing to do. She also brought home friends for him after he started school. When the book invited readers to help Dr Urquhart, she wrote to him, and that led to the tagging work.
  check: none

