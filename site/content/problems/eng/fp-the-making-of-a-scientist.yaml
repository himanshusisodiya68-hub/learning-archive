- id: b1
  lvl: board
  kind: text
  q: |
    Read the extract and answer. 'Ebright's project was to see whether, in fact, birds would eat monarchs. He found that a starling would not eat ordinary bird food. It would eat all the monarchs it could get.' (a) What theory was Ebright testing? (b) What did the starling's behaviour show about the monarch? (Answer in about 30 words each.)
  sol: |
    One possible answer. (a) He was testing the idea that viceroys look like monarchs because monarchs taste bad to birds and viceroys do not, so a viceroy that looks like a monarch is safer. (b) Taken at face value the starling's eagerness to eat monarchs seems to go against the theory, but the chapter does not explain the result and says later research by others showed that viceroys probably do copy the monarch. [Inference] The starling's result may have come from the particular bird or the test conditions.
  check: none

- id: b2
  lvl: board
  kind: text
  q: |
    Describe the part played by Ebright's mother in his growth as a scientist. (about 120 words)
  sol: |
    One possible answer: Ebright's mother was the first and steadiest source of support. After his father died, when Richie was in third grade, she became his closest companion and spent almost every evening with him at the dining table. If he had nothing to do, she found learning tasks for him, not physical work. She took him on trips and bought telescopes, microscopes, cameras and mounting materials. When he had completed his collection she gave him The Travels of Monarch X, a book that opened the world of science to him. When the book asked readers to help with butterfly research, she wrote to Dr Urquhart, which brought him into real research. Her work shows that a curious child needs time, materials and a path to experts.
  check: none

