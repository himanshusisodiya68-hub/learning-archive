- id: b2
  lvl: board
  kind: text
  q: "(Original problem.) In about 80 to 100 words, explain how the lady makes Horace believe that she is the owner of the house."
  sol: |
    One possible answer: The lady acts exactly as a person at home would. She appears from the doorway calmly and speaks as if the room is hers. She identifies his hay fever and recommends a doctor, which gives her an air of kind authority. The dog, Sherry, rubs against her, and she says anyone would think she had been away for a month. She straightens the ornaments and talks of her husband and her jewels. Her story is believable, and Horace is so afraid of prison that he does not ask for proof. Her behaviour gives him all the evidence he wants.
