- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) 'A Question of Trust' ends with the narrator saying that Horace 'gets very angry when anyone talks about honour among thieves'. In about 120 words, discuss how this final sentence changes the way we read the story's opening saying about thieves."
  sol: |
    One possible answer: At the start we are given two sayings, one that you should set a thief to catch a thief and the other that there is honour among thieves, and we are asked which the story illustrates. The final sentence answers that: the phrase now makes Horace angry because he was cheated by another thief, so the story shows that honour among thieves is not to be counted on. The anger is also comic, since he is the victim of the same kind of trick he plays on others. The ending also gives a small twist to the first saying: a thief did catch a thief, but she caught him for her own gain, not for the law. The final line therefore sums up both the theme and the irony in one short sentence.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Compare Lencho in 'A Letter to God' with Horace Danby. Both trust someone. In about 120 words, say what each trusts in, what happens to that trust, and what the two endings suggest about trust."
  sol: |
    One possible answer: Lencho trusts God completely, and his trust is answered by a kind postmaster who sends part of the money. Horace trusts a stranger who is really a thief, and that trust is betrayed, costing him his freedom. Lencho's trust is innocent and comes from faith; Horace's comes from fear and a wish to escape. Both endings are ironic. Lencho accuses the very people who helped him, while Horace is cheated by a person he thought was helping him. Together they suggest that trust without checking is risky, and that people can be kind or cruel regardless of what the truster believes. Good trust is trust that is earned.
  check: none

