  sol: |
    One possible answer (a creative task, so other versions are acceptable if they match the story):

    Tuesday, 9 p.m. A very easy afternoon. I found the house quiet and the drawing room open, and in the middle of it a man in gloves, sneezing over the flowers. It was clear at once that he was a thief and that he feared prison more than anything. I only had to be calm, name his hay fever, and speak as if the house belonged to me. The dog helped by rubbing against my leg. He was so eager to please that he took off his gloves to give me a light. By evening I had the jewels and he had all my thanks. I almost feel sorry for him, but a safe is a safe, and he knows the rules of the trade better than I do.
