  q: "(Original problem.) Read the extract and answer the questions that follow. Horace Danby was about fifty years old and unmarried, and he lived with a housekeeper who worried over his health. He made locks and was successful at his business. Yes, he was good and respectable but not completely honest. (i) What is the difference between 'respectable' and 'honest' as used here? (ii) Why does the writer say 'Yes' at the start of the last sentence? (iii) Name one fact in the story that shows Horace is 'not completely honest'. (iv) Find a word from the extract that means 'liked by others for good behaviour'."
  sol: |
    (i) 'Respectable' is about how others see you (a decent, successful man). 'Honest' is about what you actually do, in private as well as in public. Horace looks respectable but robs a safe every year.
    (ii) 'Yes' is a pause in which the writer admits and confirms the point: the narrator wants the reader to take the first part as true and then be surprised by the 'but'.
    (iii) He robs a safe each year to buy rare books.
    (iv) respectable.
    (This is a model answer for an original question.)
