- id: b3
  lvl: board
  kind: text
  q: "(Original problem.) Horace thinks, 'How foolish people are when they own valuable things.' Show how this thought turns out to be ironic by the end of the story. Write in 60 to 80 words."
  sol: |
    One possible answer: Horace laughs at owners who are careless, for example when a magazine prints the plan of a house and the place of its safe. Yet he proves just as foolish. He studies the building but not the family, trusts a stranger without proof, and takes off his gloves. The man who smiles at others' foolishness is tricked by a cleverer thief and ends in prison. The irony is that the foolishness he sees in his victims is exactly what he shows himself.
  check: none

