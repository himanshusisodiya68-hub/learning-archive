- id: ncert10-fp-4-6
  lvl: ncert-ex
  num: "FP 4 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Think about it
  kind: text
  q: |
    Did you begin to suspect, before the end of the story, that the lady was not the person Horace Danby took her to be? If so, at what point did you realise this, and how?
  sol: |
    One possible answer: yes, I began to suspect it when she asked Horace to open her own safe. A real owner would have the numbers or a spare key, or would simply call a locksmith, and she offers no proof of who she is. I was also struck by her remark "I have always liked the wrong kind of people", which sounds like a hint. A reader who answers no is also reasonable, since each detail (the friendly dog, the tidied ornaments, the believable story about the party) fits a real owner. The question has no single right answer; the point is to give a reason from the text.
  check: none

- id: ncert10-fp-4-7
  lvl: ncert-ex
  num: "FP 4 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Think about it
  kind: text
  q: |
    What are the subtle ways in which the lady manages to deceive Horace Danby into thinking she is the lady of the house? Why doesn't Horace suspect that something is wrong?
  sol: |
    One possible answer: the lady behaves in every way like a person at home. She speaks from the doorway without fear, names his hay fever and suggests a cure, straightens the ornaments by the fireplace, and talks to the dog, which rubs against her. She says that she has just returned, mentions her husband and her jewels, and gives a reason why she cannot open the safe herself (she forgot the numbers). She also says she will have the safe mended before her husband returns, which removes his worry.

    Horace does not suspect her for several reasons. He is afraid of prison and badly wants a way out, so he is ready to believe her. She is young, calm and amused, not angry, and he does not imagine that a thief could behave so calmly. He had studied the house but not the family, so he has nothing to compare her with. He is also flattered by being treated as a skilled worker and he is eager to please her, so much so that he takes off his gloves.
  check: none

- id: ncert10-fp-4-8
  lvl: ncert-ex
  num: "FP 4 · TT Q3"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Think about it
  kind: text
  q: |
    “Horace Danby was good and respectable — but not completely honest”. Why do you think this description is apt for Horace? Why can't he be categorised as a typical thief?
  sol: |
    One possible answer: the description is apt because it names both sides of Horace. He seems good and respectable to everyone: he is a successful lock-maker, polite, about fifty, and looked after by a housekeeper. But in secret he robs a safe every year, so he is not completely honest.

    He cannot be called a typical thief for several reasons. He steals only once a year, only from the very rich, and only enough for twelve months. He steals for a passion for rare books, not out of greed or need, and he plans carefully. He is not violent: when he says he might make sure she could do nothing for some time, he admits he was only trying to frighten her. He is also afraid of prison and promises to give up crime if he is let go. All of this makes him more like a polite collector who breaks the law than a hardened criminal.
  check: none

- id: ncert10-fp-4-9
  lvl: ncert-ex
  num: "FP 4 · TT Q4"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Think about it
  kind: text
  q: |
    Horace Danby was a meticulous planner but still he faltered. Where did he go wrong and why?
  sol: |
    One possible answer: Horace planned the robbery of the house in detail, studying the rooms, wiring, paths and garden for two weeks, but he went wrong in other places. First, he did not find out about the family, so he could not tell whether the woman was the owner's wife. Second, he assumed the house would be empty because the servants had gone out. Third, when the woman appeared he trusted her without a single question, because he was afraid of prison and wanted to be let off. Fourth, he took off his gloves to give her his lighter and then opened the safe bare-handed, leaving his fingerprints all over the room. Fifth, his hay fever, set off by the flowers, gave away his presence and distracted him.

    The reason, in one line: his planning covered the place but not the people, and fear and the wish to please made him careless at the one moment that mattered.
  check: none

- id: ncert10-fp-4-10
  lvl: ncert-ex
  num: "FP 4 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Talk about it
  kind: text
  q: |
    Do you think Horace Danby was unfairly punished, or that he deserved what he got?
  sol: |
    One possible answer (an opinion question, so other views are also acceptable if supported): he deserved to be punished, though not for the robbery he was convicted of. He had broken into the house to steal, and he had been stealing every year, so he had broken the law and should expect a penalty. But there is also an unfairness. The jewels were taken by the woman, who walked away with them, while he was blamed for the whole offence and no one believed his story. A fair view is that he was rightly punished for being a thief but not for the crime he was arrested for, and the one who deserved to be caught was never found.
  check: none

- id: ncert10-fp-4-11
  lvl: ncert-ex
  num: "FP 4 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Talk about it
  kind: text
  q: |
    Do intentions justify actions? Would you, like Horace Danby, do something wrong if you thought your ends justified the means? Do you think that there are situations in which it is excusable to act less than honestly?
  sol: |
    One possible answer (this is a discussion question, so your own view with reasons is what counts): a good intention does not justify a harmful action. Horace tells himself his reason is a good one, but the reason is a taste for books, and the people he robs do not agree to it. If every person decided for themselves which wrong acts were justified, there would be no trust at all. I would not copy Horace.

    There may still be rare situations where being less than honest is excusable, for example, hiding the truth for a short time to protect someone from harm, or telling a polite white lie that hurts no one. The test is whether anyone is harmed and whether I would accept the same behaviour from others towards me. Horace fails that test, and the story shows him on the receiving end.
  check: none

