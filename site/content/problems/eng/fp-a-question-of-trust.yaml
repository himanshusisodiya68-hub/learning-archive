# A Question of Trust. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 4. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-4-1
  lvl: ncert-ex
  num: "FP 4 · Opening Q"
  source: NCERT X English · Footprints Without Feet · Ch 4 · Chapter opener
  kind: text
  q: |
    It is said that you must set a thief to catch a thief. But it is also said that there is honour among thieves. Which saying does this story illustrate?
  sol: |
    One possible answer: the story illustrates neither saying in a straightforward way, but it comes closest to showing that "honour among thieves" is false. A thief (the lady) cheats another thief (Horace) and leaves him to take the blame, and Horace is angry whenever the phrase is used. It also touches the first saying in a twisted form, because a clever thief catches a thief, though she does it for her own gain and not to catch him for the law.
  check: none

