# Punctuation and paragraphs. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "Which sentence is correctly punctuated?"
  opts: ["Where do you live.", "Where do you live?", "where do you live?", "Where do you live!"]
  ans: 1
  sol: |
    A direct question starts with a capital letter and ends with a question mark: *Where do you live?* The first option ends a question with a full stop, the third lacks the capital, and the fourth uses an exclamation mark for an ordinary question.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Choose the correct word: The cat licked ___ paw."
  opts: ["it's", "its", "its'", "it is"]
  ans: 1
  sol: |
    *Its* (no apostrophe) means belonging to it. *It's* is only the short form of *it is* or *it has*, and *its'* does not exist. Test: "The cat licked it is paw" makes no sense, so the apostrophe form is wrong.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Which phrase correctly shows that the hostel belongs to many girls?"
  opts: ["the girl's hostel", "the girls hostel", "the girls' hostel", "the girls's hostel"]
  ans: 2
  sol: |
    Many owners means a plural noun, *girls*, and a plural ending in s takes only an apostrophe after the s: *the girls' hostel*. *The girl's hostel* shows one owner, and *the girls hostel* has no ownership mark at all.
  check: none

- id: f4
  lvl: found
  kind: mcq
  q: "Where should the comma go? \"Thank you Meera\""
  opts: ["Thank, you Meera", "Thank you, Meera", "Thank you Meera,", "No comma is needed"]
  ans: 1
  sol: |
    Meera is the person being addressed, so a comma separates the name from the rest: *Thank you, Meera.* This is the comma of direct address.
