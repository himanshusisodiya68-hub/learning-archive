- id: f5
  lvl: found
  kind: text
  q: "Write the following with the correct capital letters and end marks: \"what a lovely morning it is said ravi are you coming to the park\" (Do not add or remove words. Treat it as two sentences spoken by Ravi.)"
  sol: |
    Model answer: *"What a lovely morning it is!" said Ravi. "Are you coming to the park?"*

    The first spoken sentence is an exclamation and ends with an exclamation mark, placed inside the quotation marks. The tag *said Ravi* is not part of the speech and continues the same sentence, so *said* has a small letter, while *Ravi* needs a capital as a name. The second spoken sentence is new, so it begins with a capital letter and ends with a question mark.

    [Note] This is one possible model answer written for this archive; a full stop instead of an exclamation mark after *is* is also acceptable if the writer reads it as a calm remark.
  check: none

- id: b1
  lvl: board
  kind: text
  q: "Punctuate the passage, adding capital letters where needed: \"the monsoon arrived early this year in kerala the farmers were delighted they said that the rains would fill the ponds and the wells\""
  sol: |
    Model answer: *The monsoon arrived early this year in Kerala. The farmers were delighted. They said that the rains would fill the ponds and the wells.*

    Reasoning: there are three complete ideas, so three sentences, each beginning with a capital letter. *Kerala* is a place name and needs a capital. *They said that...* is reported speech, so no quotation marks are needed.

    [Note] One possible model answer written for this archive. A comma after *Kerala* is also acceptable if the first two sentences are joined: *The monsoon arrived early this year in Kerala, and the farmers were delighted.*
