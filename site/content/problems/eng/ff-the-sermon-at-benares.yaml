- id: ncert10-ff-8-5
  lvl: ncert-ex
  num: "FF 8 · TT Q2"
  source: NCERT X English · First Flight · Ch 8 · Thinking about the text
  kind: text
  q: |
    Kisa Gotami again goes from house to house after she speaks with the Buddha. What does she ask for, the second time around? Does she get it? Why not?
  sol: |
    One possible answer: the second time she asks for a handful of mustard seed from a house where no one has lost a child, husband, parent or friend. She does not get it. People are willing to give seed, but every house has lost someone, so none meets the Buddha's condition.
  check: none

- id: ncert10-ff-8-6
  lvl: ncert-ex
  num: "FF 8 · TT Q3"
  source: NCERT X English · First Flight · Ch 8 · Thinking about the text
  kind: text
  q: |
    What does Kisa Gotami understand the second time that she failed to understand the first time? Was this what the Buddha wanted her to understand?
  sol: |
    One possible answer: the second time she understands that death is common to all, that every family loses someone, and that her grief is not hers alone. The first time she only saw her own loss. Yes, this is what the Buddha wanted her to understand, and he set the task so that she would find it out herself.
  check: none

- id: ncert10-ff-8-7
  lvl: ncert-ex
  num: "FF 8 · TT Q4"
  source: NCERT X English · First Flight · Ch 8 · Thinking about the text
  kind: text
  q: |
    Why do you think Kisa Gotami understood this only the second time? In what way did the Buddha change her understanding?
  sol: |
    One possible answer: the first time her grief was so strong that she could not hear anyone; to her, "the boy is dead" was something that only happened to her. The Buddha did not argue. He gave her a hopeful task, so she went among people again with a new question, and each house told her about its own dead. Seeing it with her own eyes changed her view from "why me?" to "death comes to all", so she accepted the truth because she discovered it, not because she was told.
  check: none

- id: ncert10-ff-8-8
  lvl: ncert-ex
  num: "FF 8 · TT Q5"
  source: NCERT X English · First Flight · Ch 8 · Thinking about the text
  kind: text
  q: |
    How do you usually understand the idea of 'selfishness'? Do you agree with Kisa Gotami that she was being 'selfish in her grief '?
  sol: |
    One possible answer: usually selfishness means thinking only of one's own interest and ignoring others' needs. Kisa Gotami uses the word more gently. She had been so wrapped up in her own sorrow that she had forgotten that every family faces the same loss. I partly agree: her grief is natural and not wrong, but it had narrowed her view until she could not see anyone else's pain. (This is an opinion question; another reasoned view, such as that grief cannot be called selfish, is also acceptable.)
  check: none

- id: ncert10-ff-8-9
  lvl: ncert-ex
  num: "FF 8 · TL Q1"
  source: NCERT X English · First Flight · Ch 8 · Thinking about language, I
  kind: text
  q: |
    This text is written in an old-fashioned style, for it reports an incident more than two millennia old. Look for the following words and phrases in the text, and try to rephrase them in more current language, based on how you understand them.

    • give thee medicine for thy child
    • Pray tell me
    • Kisa repaired to the Buddha
    • there was no house but someone had died in it
    • kinsmen
    • Mark!
  sol: |
    One possible answer:
    - give thee medicine for thy child = give you medicine for your child
    - Pray tell me = Please tell me
    - Kisa repaired to the Buddha = Kisa went to the Buddha
    - there was no house but someone had died in it = there was no house where someone had not died (every house had lost someone)
    - kinsmen = relatives, family members
    - Mark! = Look! / Take note!
  check: none

- id: ncert10-ff-8-10
  lvl: ncert-ex
  num: "FF 8 · TL Q2"
  source: NCERT X English · First Flight · Ch 8 · Thinking about language, II
  kind: text
  q: |
    You know that we can combine sentences using words like and, or, but, yet and then. But sometimes no such word seems appropriate. In such a case we can use a semicolon (;) or a dash ( —) to combine two clauses.

    She has no interest in music; I doubt she will become a singer like her mother.

    The second clause here gives the speaker's opinion on the first clause.

    Here is a sentence from the text that uses semicolons to combine clauses. Break up the sentence into three simple sentences. Can you then say which has a better rhythm when you read it, the single sentence using semicolons, or the three simple sentences?

    For there is not any means by which those who have been born can avoid dying; after reaching old age there is death; of such a nature are living beings.
  sol: |
    One possible answer. Three simple sentences:
    1. There is not any means by which those who have been born can avoid dying.
    2. After reaching old age there is death.
    3. Of such a nature are living beings.

    Rhythm: the single sentence with semicolons reads better here. Each clause adds weight to the one before, so the whole sounds like one slow, solemn truth, which suits a sermon. The three short sentences stop and start and sound like separate announcements. (Which has the "better" rhythm is a matter of judgement; a reasoned view is acceptable.)
  check: none

- id: ncert10-ff-8-11
  lvl: ncert-ex
  num: "FF 8 · SP Q1"
  source: NCERT X English · First Flight · Ch 8 · Speaking
  kind: text
  q: |
    The Buddha's sermon is over 2500 years old. Given below are two recent texts on the topic of grief. Read the texts, comparing them with each other and with the Buddha's sermon. Do you think the Buddha's ideas and way of teaching continue to hold meaning for us? Or have we found better ways to deal with grief? Discuss this in groups or in class.
  sol: |
    One possible answer (the two texts are in the book and are not reproduced here). The first text, "A Guide to Coping with the Death of a Loved One", lists common feelings after a death (sadness, anger, guilt, anxiety, loneliness, fatigue, disbelief) and advises patience and support for those who grieve. The second, "Good Grief" by Amitai Etzioni, says there is no set or "right" way to grieve, that anger is allowed, and that what survivors do for one another is the only consolation.

    Comparison: the modern texts accept many feelings and stress company and practical help; the Buddha stresses seeing that death is common to all and letting go of clinging grief. His ways still hold meaning, because Kisa Gotami's discovery that others have lost too is what support groups and shared mourning do today, and his teaching by experience still works. But modern writing adds what he does not: patience with each person's pace and permission to feel anger. We have not so much found better ways as added to his. (A discussion question: any reasoned view that uses the texts is acceptable.)
  check: none

- id: ncert10-ff-8-12
  lvl: ncert-ex
  num: "FF 8 · WR Q1"
  source: NCERT X English · First Flight · Ch 8 · Writing
  kind: text
  q: |
    Write a page (about three paragraphs) on one of the following topics. You can think about the ideas in the text that are relevant to these topics, and add your own ideas and experiences to them.

    1. Teaching someone to understand a new or difficult idea
    2. Helping each other to get over difficult times
    3. Thinking about oneself as unique, or as one among billions of others
  sol: |
    One possible model answer, on topic 2 (about 150 words):

    Hard times feel heavier when we face them alone. In the story of Kisa Gotami, a mother cannot be comforted until she sees that every house has known loss. What helped her was not advice but company, even the company of strangers who shared their grief.

    I saw something similar when my cousin failed a board exam last year. He stopped meeting friends, until a classmate told him that he too had failed once and had retaken it. My cousin sat up and began to talk. It was not a clever sentence that helped; it was knowing he was not the only one.

    So helping each other through difficult times means listening before advising, sharing our own stumbles, and staying near without hurrying the person to feel better. Like the Buddha, we can sometimes do more by leading someone gently to see the truth than by announcing it.
  check: none

