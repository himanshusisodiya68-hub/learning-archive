- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) Describe how Kisa Gotami changes in the course of the chapter. Write about 100-120 words."
  sol: |
    One possible answer (about 110 words): At the start Kisa Gotami is desperate and cut off from reason. She carries her dead child from door to door, asking for medicine, and the people think she has lost her senses. After meeting the Buddha she is full of hope, and goes again from house to house, now with a question that opens other people's hearts. As each home tells her of its own dead, her hope falls away; weary, she sits by the road and thinks. There she understands that death is common to all and that she was selfish in her grief. She ends calm and thoughtful, ready to listen to the Buddha's sermon. Her journey is from private sorrow to shared understanding.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) \"The Buddha does not tell Kisa Gotami the truth; he lets her find it.\" Discuss whether this is a good way to teach a hard idea. Write about 100-120 words."
  sol: |
    One possible answer (about 110 words): It is a very good way, though it needs patience. If the Buddha had simply said that everyone dies, Kisa Gotami, blinded by grief, would have felt he did not understand her. By giving her a task he treats her with respect and keeps her hope alive until she is ready. What she learns from the people she meets is vivid and personal, so she remembers it. The method has limits: it takes time, and it works only if the learner is willing to search. A teacher also has to trust the learner. In the end, the truth she finds herself is the one she accepts.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) Compare the single semicolon-joined sentence about death in the sermon with the same content in three short sentences. Which would you use in a speech at a solemn gathering, and which in a quick note? Give reasons in about 80 words."
  sol: |
    One possible answer (about 85 words): For a solemn speech I would use the semicolon sentence: "...avoid dying; after reaching old age there is death; of such a nature are living beings." The clauses pile up like steps, giving the sentence weight and a slow, calm rhythm that suits a serious subject and a listening audience. In a quick note I would use short sentences, because they are easy to read at a glance and nothing needs to sound grand. Both are correct; the difference is the effect I want on my reader or listener.
  check: none
