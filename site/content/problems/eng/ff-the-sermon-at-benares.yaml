  source: NCERT X English · First Flight · Ch 8 · Thinking about the text
  kind: text
  q: |
    When her son dies, Kisa Gotami goes from house to house. What does she ask for? Does she get it? Why not?
  sol: |
    One possible answer: she asks her neighbours for medicine to bring her dead son back to life. She does not get it, because nobody has a medicine for death; the people think she has lost her senses, since the boy is dead.
