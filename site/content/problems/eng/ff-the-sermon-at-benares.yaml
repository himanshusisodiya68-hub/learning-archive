  kind: text
  q: "(Original problem.) In two or three sentences, say why the Buddha adds a condition after Kisa Gotami promises to bring the mustard seed."
  sol: |
    The condition (a house where no one has died) turns an easy errand into a search that cannot succeed. The Buddha wants her to find out for herself that death visits every home, because she would not accept this if she were simply told.
