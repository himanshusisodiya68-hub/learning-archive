# The Sermon at Benares. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 8. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original. The two teacher-facing extracts at the end of the chapter (Gibran, Tagore) are not questions and are not included.

- id: ncert10-ff-8-1
  lvl: ncert-ex
  num: "FF 8 · BYR Q1"
  source: NCERT X English · First Flight · Ch 8 · Before you read, Activity 1
  kind: text
  q: |
    Use a dictionary or ask for your teacher's help as you discuss the following questions in groups.

    1. What is a sermon? Is it different from a lecture or a talk? Can this word also be used in a negative way or as a joke (as in "my mother's sermon about getting my work done on time…")?
  sol: |
    One possible answer: a sermon is a religious or moral talk, usually given by a preacher or teacher to a group. A lecture aims to teach facts or an academic subject, and a talk is any spoken address; a sermon aims to guide how people should live or feel. Yes, the word can be used negatively or as a joke, for a long, preachy telling-off, as in the example given.
  check: none

