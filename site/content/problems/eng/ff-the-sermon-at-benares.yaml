  kind: text
  q: |
    Find out the meanings of the words and phrases given in the box.

    afflicted with, be composed, desolation, lamentation, procure, be subject to
  sol: |
    One possible answer: afflicted with = affected by suffering, disease or pain; be composed = be calm and in control of one's feelings; desolation = a state of great sorrow and emptiness; lamentation = an open expression of sorrow; procure = obtain with some effort; be subject to = be under the power or control of (for example, "all living beings are subject to death").
  check: none

