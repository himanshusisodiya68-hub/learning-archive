- id: b2
  lvl: board
  kind: text
  q: "(Original problem.) Pick out any two images the Buddha uses in his sermon and say what each shows about human life."
  sol: |
    One possible answer: (1) "ripe fruits" that are early in danger of falling show that every mortal is always in danger of death, the older the nearer; (2) "earthen vessels" made by the potter that end up broken show that every life, however carefully made, will end. (The ox led to the slaughter, which shows that relatives can only watch, is also acceptable.)
