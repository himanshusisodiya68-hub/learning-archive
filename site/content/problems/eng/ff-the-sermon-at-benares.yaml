- id: b4
  lvl: board
  kind: text
  q: "(Original problem.) \"Not from weeping nor from grieving will anyone obtain peace of mind.\" Explain, in about 40 words, what the Buddha means."
  sol: |
    One possible answer (about 45 words): The Buddha says that crying and grieving cannot bring peace; instead they increase pain and make the body sick, and they do not save the dead. Real peace comes only when a person draws out the arrow of sorrow and becomes calm, accepting that death is part of life.
