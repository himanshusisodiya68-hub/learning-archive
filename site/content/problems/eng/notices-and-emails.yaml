# Notices and emails. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "Which of these should NOT appear in a school notice?"
  opts: ["The name of the school at the top", "The date of issue", "The greeting 'Dear students,'", "The writer's name and designation"]
  ans: 2
  sol: |
    A notice goes to everyone and is not addressed to any one reader, so it has no salutation. It has the issuer's name, the word NOTICE, a date, a heading, a body, and the writer's name and designation.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "A notice says: 'The annual day will be held in the school hall. All students are invited.' Which essential fact is missing?"
  opts: ["The date and time", "The name of the hall", "A greeting", "A closing phrase"]
  ans: 0
  sol: |
    A reader cannot act without knowing when to come. The date and time are the first things a notice must give. The place (the school hall) and the people (all students) are already given, and a notice needs neither a greeting nor a closing phrase.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "You are writing to 'The Manager' and do not know the name. Which salutation and closing match?"
  opts: ["Dear Sir/Madam ... Yours faithfully", "Dear Sir/Madam ... Yours sincerely", "Dear Manager ... Love", "Hi ... Cheers"]
  ans: 0
  sol: |
    When the reader's name is unknown, the standard formal pair is Dear Sir/Madam with Yours faithfully. Yours sincerely goes with a named reader (Dear Mr Rao). Love, Hi and Cheers are informal.
  check: none

- id: f4
  lvl: found
  kind: text
  q: "List the five questions that the body of a notice should answer, in one line each."
  sol: |
    Model answer:
    1. What is happening? (the event or the message)
    2. When? (date and time)
    3. Where? (venue)
    4. Who is it for? (the people who may or must attend)
    5. What must the reader do? (register, bring something, contact a person, by a date)

    A notice that answers all five lets the reader act without asking anyone.
  check: none

- id: f5
  lvl: found
  kind: mcq
  q: "Which is the best subject line for an email asking the principal for permission for a field trip on 5 December?"
  opts: ["Request", "Please read this", "Permission for Class X field trip on 5 December", "Hello sir"]
  ans: 2
  sol: |
    A good subject line names the topic and the date, so the reader knows what the email is about before opening it. 'Request', 'Please read this' and 'Hello sir' say nothing about the subject.
  check: none

- id: b1
  lvl: board
  kind: text
  q: "The annual school picnic fixed for Saturday, 5 December 2026 has been postponed because of a forecast of heavy rain. As Kavita Rao, Vice Principal of Sunrise Public School, Pune, write a notice in not more than 50 words."
  sol: |
    Model answer (one possible answer; the details are invented, as the question gives none):

    SUNRISE PUBLIC SCHOOL, PUNE

    NOTICE

    30 November 2026

    Annual Picnic Postponed

    The annual picnic fixed for Saturday, 5 December 2026, stands postponed because heavy rain is forecast. The new date will be announced soon. Students who have paid should keep their receipts, as the amount will be adjusted. The reporting time and venue remain unchanged.

    Kavita Rao
    Vice Principal

    The body has 44 words. It gives what changed, the old date, the reason, what will happen next, what students must do and what stays the same. There is no Dear and no closing phrase.

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

