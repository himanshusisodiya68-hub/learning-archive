- id: b3
  lvl: board
  kind: text
  q: "You are Riya Sen, captain of Class X-B. Write an email to the Principal, Mr A. K. Rao, requesting permission to hold a science exhibition in the school hall. Write in 100 to 120 words."
  sol: |
    Model answer (one possible answer; details invented):

    To: principal@sunriseschool.example
    Subject: Permission for Class X-B science exhibition on 12 December

    Dear Sir,

    I am the captain of Class X-B. On behalf of my classmates, I request your permission to hold a science exhibition in the school hall on Saturday, 12 December 2026, from 10 a.m. to 1 p.m.

    Students will display working models and charts, and junior classes and parents will be invited to see them. Our science teacher, Mr Nair, has agreed to guide us. We shall keep the hall clean and finish all clearing work by 2 p.m.

    I would be grateful for your reply by 25 November 2026, so that we can begin our preparations. Thank you for your kind consideration.

    Yours faithfully,
    Riya Sen
    Class X-B

    The body has about 100 words. Format: To and Subject lines, salutation, three short paragraphs, closing and name. Content: who is asking, what, when, where, who will attend, support from a teacher, a promise about the hall and a reply deadline. Tone is formal, with polite modals and no contractions.

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

- id: b4
  lvl: board
  kind: text
  q: "Garbage has not been collected in your colony, Green Park, for a week. You are Meera Joshi, a resident. Write an email of about 100 words to the Municipal Commissioner, complaining and asking for action."
  sol: |
    Model answer (one possible answer; details invented):

    To: commissioner@citymunicipal.example
    Subject: Uncollected garbage in Green Park for one week: action requested

    Dear Sir/Madam,

    I am a resident of Green Park, Block C. Garbage has not been collected from our lane since 9 November 2026. Piles of waste now block the road, attract stray dogs and give off a foul smell, and several children have complained of stomach upsets. Residents have reported the matter twice to the ward office, but nothing has been done.

    I request you to direct the sanitation staff to clear the garbage at once and to restore daily collection. I would be grateful if you could confirm the action taken by 20 November 2026.

    Yours faithfully,
    Meera Joshi
    Green Park, Block C

    The email is about 95 words. It states the place, the fault, the length of time and the harm, makes one clear request and sets a date for a reply. The tone is firm but polite, with no abuse.

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

- id: b5
  lvl: board
  kind: text
  q: "You are Aarav. Write an informal email of about 100 words to your cousin Tanvi, inviting her to spend the winter vacation with you in Pune. Then, in one or two sentences, say what changes between this email and a formal one."
  sol: |
    Model answer (one possible answer):

    To: tanvi.cousin@example.com
    Subject: Come to Pune this winter!

    Hi Tanvi,

    How are you? I hope your exams went well. Mine ended yesterday, and I am so relieved!

    Our winter vacation starts on 21 December, and I really want you to spend it with us in Pune. Mum and Dad have already said yes. We can visit Sinhagad Fort, try the street food on FC Road and see two new films. Dadi is also looking forward to meeting you.

    Please tell me by the end of this week if you can come, so that we can book your train tickets.

    Take care, and say hello to everyone.

    Love,
    Aarav

    What changes: in an informal email the salutation (Hi), contractions, friendly questions and a warm closing (Take care, Love) are allowed. In a formal email the language is polite and impersonal, with Dear Sir/Madam, no contractions and a formal closing such as Yours faithfully.

    [Note] This is a model answer written for this archive, not an official board key.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "Rewrite each weak subject line so that it tells the reader the topic and, where possible, the action and the date. (a) 'Meeting' (the team meeting moves to Thursday 3 p.m., Room B). (b) 'Urgent!!!' (you need a manager's approval of a travel budget by Friday 5 p.m.). (c) 'Question' (you want to know which date the Q3 audit is on)."
  sol: |
    Model answer (wording may differ):
    (a) Team meeting moved to Thursday, 3 p.m., Room B
    (b) Approval needed by Friday, 5 p.m.: travel budget
    (c) Question: which date is the Q3 audit?

    In each one the main words come first, the date or deadline is included, and a short tag (Question) or a plain statement tells the reader what to do. 'Urgent!!!' fails because it says nothing about the topic and every sender claims urgency.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "Rewrite this rambling email so that a busy manager can act on it. 'Subject: Hi. Hello sir, I hope you are well. I was thinking about the budget, and also about the vendor, and there is a problem with the laptop, so I wanted to ask whether you could approve the 40,000 rupee spend for the vendor and let me know about the laptop soon, as the vendor needs the money before the end of the month.'"
  sol: |
    Model answer (one possible rewrite):

    Subject: Approval needed by 25 Oct: Rs 40,000 payment to vendor

    Dear Sir,

    Could you approve the Rs 40,000 payment to the vendor by 25 October? The vendor needs it before the month ends.

    Separately, my laptop is faulty. I will email IT about it and keep you informed.

    Thank you,
    [Name]

    What was changed: the subject line now names the action, the amount and the date; the ask comes in the first line; the laptop problem is moved to a separate line and sent to the right place; and the filler (Hi, I hope you are well, I was thinking about) is removed. Mentioning the laptop here is optional; a stricter version would send a second email.
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: "You are emailing a decision to your manager, who must approve it, and to three colleagues, who only need to know. How should you address the email?"
  opts: ["Everyone in To", "Manager in To, colleagues in Cc", "Manager in Cc, colleagues in To", "Manager in Bcc, colleagues in To"]
  ans: 1
  sol: |
    The person who must act goes in To. People who only need to be kept informed go in Cc. Putting everyone in To blurs who has to act, and Bcc hides people for privacy, which is not what is wanted here.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "You work in a small firm. A client call you organised for Monday 9 November at 11 a.m. must move to Tuesday 10 November at 3 p.m. because the client's team is travelling. Write the email to your colleague Priya (about 70 words), asking her to confirm she can attend and to update the shared calendar."
  sol: |
    Model answer (one possible answer):

    To: priya@firm.example
    Subject: Client call moved to Tue 10 Nov, 3 p.m.: please confirm

    Hi Priya,

    The client's team is travelling on Monday, so we must move the call from Monday, 9 November, 11 a.m. to Tuesday, 10 November, 3 p.m. The link stays the same.

    Could you:
    1. confirm by tomorrow, 5 p.m., that you can attend;
    2. update the shared calendar?

    If 3 p.m. does not suit you, tell me today so that I can ask the client for another slot.

    Thanks,
    [Name]

    Why it works: the subject line carries the change, the date and the action; the reason is one clause; the two asks are numbered and have a deadline; and the email offers a plan if Priya cannot attend. It is friendly but still precise.
  check: none

- id: m5
  lvl: main
  kind: text
  q: "For each situation, decide whether a notice, an email, or both is the better format, and give one reason. (a) The society will cut off water for tank cleaning next Sunday from 9 a.m. to 1 p.m. (b) You need the school office to correct a spelling error on your certificate. (c) The school has a new holiday for Diwali and parents must be told."
  sol: |
    Model answer:
    (a) A notice. It goes to every resident at once, nobody needs to reply, and it can be pinned at the gate and the lift. A reminder by message is a useful extra.
    (b) An email. It is one request to one office, needs a reply, and should carry your name, class, certificate number and the exact correction wanted.
    (c) Both. A notice goes up in school so children see it, and an email or circular goes to parents so the news reaches homes. The notice announces the fact; the email can add what parents must do (for example, send a reply to confirm).

    The rule behind all three: a notice announces to a group; an email asks or tells one reader and invites a reply.
  check: none
