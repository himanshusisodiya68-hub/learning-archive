# The Book That Saved the Earth. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 9. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-9-1
  lvl: ncert-ex
  num: "FP 9 · RF Q1"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Read and find out (Scene 1)
  kind: text
  q: |
    Why was the twentieth century called the 'Era of the Book'?
  sol: |
    One possible answer: The Historian says that in the twentieth century there were books about everything, from ant eaters to Zulus. Books taught people how, when, where and why to do things, so the age was named the Era of the Book.
  check: none

- id: ncert10-fp-9-2
  lvl: ncert-ex
  num: "FP 9 · RF Q2"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Read and find out (Scene 1)
  kind: text
  q: |
    Who tried to invade the earth in the twenty-first century?
  sol: |
    One possible answer: The Martians tried to invade the Earth, in the year 2040, under their commander-in-chief, the Great and Mighty Think-Tank. The invasion never happened, because a book of nursery rhymes made him give up the plan.
  check: none

- id: ncert10-fp-9-3
  lvl: ncert-ex
  num: "FP 9 · RF Q3"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Read and find out (Scene 2)
  kind: text
  q: |
    What guesses are made by Think–Tank about the books found on earth?
  sol: |
    One possible answer: Think-Tank first decides that the room is a crude refreshment stand and the books are sandwiches, the main food of Earthlings. When Noodle says the Earthlings did not eat them, he says they are communication sandwiches and orders the crew to listen to them. When that fails, he says they are meant for eye communication, and that the marks in the big book are a code to be broken. (Earlier, Oop guesses hats and Iota guesses a storage barn.)
  check: none

- id: ncert10-fp-9-4
  lvl: ncert-ex
  num: "FP 9 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Think about it
  kind: text
  q: |
    Noodle avoids offending Think-Tank but at the same time he corrects his mistakes. How does he manage to do that?
  sol: |
    One possible answer: Noodle is always respectful. He bows, uses grand titles such as "your Brilliance", and begs pardon before he speaks. He calls his own idea a small, insignificant bit of data that has floated into his mind. He does not say that the commander is wrong; he only mentions what he saw on the surveyor films, for example that Earthlings did not eat the books but opened and watched them. Think-Tank then announces the correction as his own next point, so his pride is safe and the mistake is fixed.
  check: none

- id: ncert10-fp-9-5
  lvl: ncert-ex
  num: "FP 9 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Think about it
  kind: text
  q: |
    If you were in Noodle's place, how would you handle Think-Tank's mistakes?
  sol: |
    One possible answer (an opinion question): I would copy Noodle's politeness but be a little more direct. I would choose a calm moment and ask a question instead of making a statement, such as "Sir, have the films shown the Earthlings eating these?" I would give a reason or a fact, offer to check it, and let Think-Tank decide. If a mistake were dangerous, such as ordering a whole fleet to run away, I would speak up clearly and not worry about who gets the credit.
  check: none

- id: ncert10-fp-9-6
  lvl: ncert-ex
  num: "FP 9 · TT Q3"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Think about it
  kind: text
  q: |
    Do you think books are being replaced by the electronic media? Can we do away with books altogether?
  sol: |
    One possible answer (an opinion question): Electronic media are growing fast, since e-books, audiobooks and websites are quick, searchable and easy to carry. Even so, I do not think books can be done away with altogether. A printed book needs no battery or signal, is easy on the eyes, can be read slowly and without distraction, and can be passed from one person to another. Books and screens do different jobs, so they are likely to exist side by side.
  check: none

- id: ncert10-fp-9-7
  lvl: ncert-ex
  num: "FP 9 · TT Q4"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Think about it
  kind: text
  q: |
    Why are books referred to as a man's best companion? Which is your favourite book and why? Write a paragraph about that book.
  sol: |
    One possible answer (the choice of book is personal): A book is a companion that is always available. It does not argue, it waits until you pick it up, it teaches and comforts you, and it never grows tired of being read again. My favourite book is "Wings of Fire" by A. P. J. Abdul Kalam. It tells the story of a boy from a small town who becomes a scientist, and it shows that hard work and curiosity matter more than where you begin. I like it because it makes big dreams seem possible, and each time I read it I notice a new line to remember. [Unverified: the book is named from memory; any book you love will do.]
  check: none

- id: ncert10-fp-9-8
  lvl: ncert-ex
  num: "FP 9 · TA Q1"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Talk about it
  kind: text
  q: |
    In what ways does Think-Tank misinterpret innocent nursery rhymes as threats to the Martians? Can you think of any incidents where you misinterpreted a word or an action? How did you resolve the misunderstanding?
  sol: |
    One possible answer: Think-Tank takes the garden rhyme to mean that Earthlings can grow silver and explosives, so he thinks they combine farming and mining. The rhyme about the cat and the cow convinces him that Earthling animals are taught music and space travel and that cows may attack. At Humpty Dumpty he sees a picture that looks like himself, and the line about a great fall seems to him a plan to capture Mars. A personal example (one possible answer): once a friend said, "I'll see you later," and I thought she was ignoring me; I asked her what she meant, and she explained she had to leave early. I resolved it by asking politely instead of assuming.
  check: none

- id: ncert10-fp-9-9
  lvl: ncert-ex
  num: "FP 9 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 9 · Talk about it
  kind: text
  q: |
    The aliens in this play speak English. Do you think this is their language? What could be the language of the aliens?
  sol: |
    One possible answer (an opinion question): Probably not. The play gives the aliens English so that an English-speaking audience can follow it, which is a comic convention of such stories. A real alien language, if there is one, might not be spoken at all. It could use light, colour, smell, touch or radio signals, and it might have no grammar like ours. The Martian crew in the play may be using a translating disk, since Omega speaks into a disk on a chain, but that is [Inference], as the play does not say.
  check: none

