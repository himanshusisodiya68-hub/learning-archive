  q: "(Original problem.) What is a stage direction? Give one example from the play."
  sol: |
    A stage direction is a note, usually in brackets, that tells actors how to speak or move and helps readers picture the scene. Examples: (peevishly), (smacking mirror) or (saluting). It is not spoken aloud.
