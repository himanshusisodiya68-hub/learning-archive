- id: b1
  lvl: board
  kind: text
  q: "(Original problem.) In about 30 to 40 words, say why Think-Tank decides to flee from Mars after seeing the picture of Humpty Dumpty."
  sol: |
    One possible answer (about 40 words): Think-Tank sees that the picture of Humpty Dumpty looks like his own egg-shaped head. Together with the words "a great fall", it seems to him to prove that the Earthlings plan to capture him and Mars Central Control, so he flees.
  check: none

- id: b2
  lvl: board
  kind: text
  q: "(Original problem.) Read the line and answer. When the Martians say together \"Great and Mighty Think-Tank is never wrong\", what does this show about the Martian society? Answer in 30 to 40 words."
  sol: |
    One possible answer (about 40 words): It shows that nobody is allowed to question the leader, because everyone has to repeat his claim of perfection. Such a society rewards flattery and obedience, so mistakes are not corrected and they grow into serious ones, such as the plan to invade Earth.
  check: none

- id: b3
  lvl: board
  kind: text
  q: "(Original problem.) Complete the table in your notebook by writing what Think-Tank believes each rhyme shows. Rhymes: (a) Mistress Mary (b) Hey Diddle Diddle (c) Humpty Dumpty."
  sol: |
    (a) Mistress Mary: Earthlings combine farming and mining and can grow crops of silver and other metals, and high explosives. (b) Hey Diddle Diddle: they have taught domestic animals music and space skills and may launch a cow attack. (c) Humpty Dumpty: the picture looks like Think-Tank, and "a great fall" means a plan to capture him and Mars.
  check: none

- id: b4
  lvl: board
  kind: text
  q: "(Original problem.) Rewrite in the active voice: \"It shall be done, sir.\" Then say why the passive suits the way the Martians speak."
  sol: |
    Active: "I shall do it, sir." (or "We shall do it, sir.") The passive form drops the doer and puts the task first. It sounds formal and obedient, which suits soldiers and an apprentice speaking to their commander: what matters is that the order is carried out.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) \"The play is a satire on leaders who cannot bear to be corrected.\" Do you agree? Write a long answer of about 100-120 words, with evidence from the play."
  sol: |
    One possible answer (about 110 words): I agree. The writer makes Think-Tank a comic figure, with a huge head and a mirror that must flatter him on time. He forces his crew to repeat that he is never wrong, and he takes credit for ideas that Noodle has quietly given him. As a result, each correct fact is wrapped in a wrong explanation, from sandwiches to silver gardens. His fear of looking foolish makes him see a threat in Humpty Dumpty, and he runs from a nursery rhyme. The play laughs at him, but its point is serious: if a leader cannot take correction, a whole fleet may follow a mistake. Noodle, who is allowed to think, ends up the wise ruler.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Explain the irony in the title and in the ending of \"The Book That Saved the Earth\". Write about 100-120 words."
  sol: |
    One possible answer (about 105 words): The title is ironic because we expect a planet to be saved by weapons or brave soldiers, not by a book of nursery rhymes. The book does not even try to save anyone; it works only because the Martian commander misreads it. This is situational irony, since the result is the opposite of what we expect, and also dramatic irony, since we know the rhymes are harmless while Think-Tank thinks they are war plans. The ending has a further twist: the Martians learn to read and become friends with Earth, yet there is still one book, Mother Goose, that they cannot bring themselves to read.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) Noodle becomes a wise ruler at the end of the play. Using evidence from the scenes, write about 100-120 words on why he deserves the position."
  sol: |
    One possible answer (about 105 words): Noodle deserves it because he notices what others miss. It is he who remembers that Earthlings did not eat the books but used them to communicate, and later that they opened them and watched them, and he shapes these clues so that the commander can accept them. He is polite and patient, and he serves his leader loyally, while keeping his own judgement. These are the qualities a ruler needs, unlike Think-Tank's vanity. His tact also shows that he understands people. A good ruler listens to correction, and Noodle has spent the play learning how correction is given.
  check: none
