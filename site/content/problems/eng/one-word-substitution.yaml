- id: m3
  lvl: main
  kind: text
  q: "You have not met these words before, but you know the roots: xeno- (stranger), pyro- (fire), anglo- (English), -phobia (fear), -mania (craze), -phile (lover). Work out a likely meaning for each: (a) xenophobia (b) pyromaniac (c) Anglophile. Then say one thing that could go wrong with this method."
  sol: |
    One possible model answer.

    (a) *Xenophobia*: xeno- + -phobia, so a fear (or dislike) of strangers or foreigners. (b) *Pyromaniac*: pyro- + mania, so a person with an uncontrollable urge to set things on fire. (c) *Anglophile*: Anglo- + -phile, so a lover of England or of English things.

    What can go wrong: roots can mislead when a word's meaning has drifted from its parts, or when a word has an unusual history. For example, *inflammable* looks as though it should mean "cannot burn", but it means the opposite. So use roots to get a first guess, then check it against the sentence or a dictionary.
  check: none

