- id: b6
  lvl: board
  kind: mcq
  q: "A warning sign in a petrol store reads \"INFLAMMABLE\". What does the word mean?"
  opts: ["cannot be set on fire", "easily set on fire", "not harmful", "cannot be seen"]
  ans: 1
  sol: |
    *Inflammable* means easily set on fire. The prefix in- here comes from the Latin word for "in" (as in inflame), not from "not". To say that something will not burn, use *non-flammable*. Because the word can mislead, many safety labels now use *flammable*.
  check: none

- id: m1
  lvl: main
  kind: text
  q: "Explain the difference between an epidemic, a pandemic and an endemic disease. Give one sentence for each."
  sol: |
    One possible model answer.

    An *epidemic* is a disease that spreads quickly through a community or region: for example, a dengue outbreak in one city. A *pandemic* is a disease that spreads across countries or the whole world, such as the Covid-19 outbreak that began in 2019. An *endemic* disease is regularly found in a particular region or group, for example malaria in some tropical regions.

    The three words differ in how far and how fast the disease spreads (epidemic, pandemic) and in whether it is always present (endemic).
  check: none

