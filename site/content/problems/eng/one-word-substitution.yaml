- id: m5
  lvl: main
  kind: mcq
  q: "A school magazine is published twice every year. The most exact word for its frequency is:"
  opts: ["annual", "biennial", "biannual", "centenary"]
  ans: 2
  sol: |
    *Biannual* means twice a year. *Biennial* means every two years, *annual* means once a year, and *centenary* is a hundredth anniversary. Note that some writers use *biannual* loosely for either meaning, so in real writing it helps to say "twice a year" or "every two years" if there could be doubt.
  check: none

- id: m6
  lvl: main
  kind: text
  q: "A student writes: \"The match ended in a draw, and the omniscient crowd went home happy.\" Another student claims that one-word substitutes always improve a sentence. Give two reasons why they do not, with an example from this lesson."
  sol: |
    One possible model answer.

    First, the word must fit exactly. In the sentence above, *omniscient* means all-knowing, so it does not suit a crowd that has simply watched a match. A near-fit word is worse than a plain phrase.

    Second, the reader must know the word. A notice for young children saying "do not bring inflammable items" is harder than "do not bring anything that can be set on fire", and *inflammable* can even mislead. A good writer chooses the word that the reader will understand at once.

    A third reason can be tone: *miser* is an insult, while "someone who spends very little" is neutral.
  check: none
