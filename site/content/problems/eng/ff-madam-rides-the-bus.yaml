  q: What does Valli mean when she says, "I was just agreeing with what you said about things happening without our knowledge."
  sol: |
    One possible answer: Valli's mother had said that so many things happen around us and in the wide world that we cannot know them all, and that even when we know something we may not understand it fully. Valli says "Oh, yes!" because that matches her day. Her secret journey happened without her mother and aunt knowing. More deeply, she had always known that creatures die, but only when she saw the cow, so full of life earlier, lying dead, did she begin to understand it. She cannot say this aloud, so she explains it simply as agreement.
