- id: ncert10-ff-7-17
  lvl: ncert-ex
  num: "FF 7 · TT Q3"
  source: NCERT X English · First Flight · Ch 7 · Thinking about the text
  kind: text
  q: |
    What kind of a person is Valli? To answer this question, pick out the following sentences from the text and fill in the blanks. The words you fill in are the clues to your answer.

    (i) "Stop the bus! Stop the bus!" And a tiny hand was raised ____.

    (ii) "Yes, I ____ go to town," said Valli, still standing outside the bus.

    (iii) "There's nobody here ____," she said haughtily. "I've paid my thirty paise like everyone else."

    (iv) "Never mind," she said, "I can ____. You don't have to help me." "I'm not a child, I tell you," she said, ____.

    (v) "You needn't bother about me. I ____," Valli said, turning her face toward the window and staring out.

    (vi) Then she turned to the conductor and said, "Well, sir, I hope ____."
  sol: |
    Model answer, from the story: (i) commandingly. (ii) simply have to. (iii) who's a child. (iv) get on by myself; irritably. (v) can take care of myself. (vi) to see you again.

    Together these clues show that Valli is determined and bold (she demands the bus stop and says she simply has to go), proud and independent (she will not be called a child or helped), self-reliant (she can take care of herself), quick to anger when teased, and friendly in the end (she hopes to see the conductor again). She is a spirited, confident child.
  check: none

