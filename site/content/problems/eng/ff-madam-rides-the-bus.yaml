- id: b4
  lvl: board
  kind: text
  q: |
    Answer in about 100–120 words.

    "Oh, yes!" breathed Valli. What does this response show about what she has learned from her bus ride? How does the ending of the story connect the cow with her mother's words?
  sol: |
    One possible model answer (about 115 words): Valli's mother says that many things happen around us without our knowledge, and that even what we know, we may not fully understand. Valli answers "Oh, yes!" because her day shows both ideas. Her secret journey took place without her family's knowledge. More importantly, the cow that was full of life on the way to town lay dead on the way back, and Valli, who knew only in a general way that creatures die, now felt it. She keeps this understanding to herself and smiles privately when her aunt calls her a chit of a girl. The ending shows her quiet step towards maturity.
