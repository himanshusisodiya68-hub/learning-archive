- id: m1
  lvl: main
  kind: text
  q: |
    Answer in about 150 words.

    The cow appears twice in the story. Compare the two appearances and explain how the repetition shapes the reader's response and the story's meaning.
  sol: |
    One possible model answer (about 150 words): The first cow (Part III) is a young animal running at full speed with its tail high, right in front of the bus. Its terror is comic to Valli, who laughs until she cries. The second (Part IV) is the same young cow, lying dead beside the road, its eyes fixed and blood around it. Repeating one image in two moods makes us feel Valli's shock because we, too, enjoyed the first scene. The contrast also carries the theme: the same road and the same child give a different afternoon, and the line between playful life and sudden death is thin. The writer does not comment; Valli's silence and her refusal to look out of the window do the work. The structure thus teaches the reader what the mother's remark states in words, that knowing and understanding are different things.
  check: none

- id: m2
  lvl: main
  kind: text
  q: |
    Answer in about 150 words.

    "The story is told entirely from a child's point of view, and that is why the humour and the sadness both work." Discuss, with at least three pieces of evidence.
  sol: |
    One possible model answer (about 150 words): The narrator stays close to Valli and shows the world as she sees it. The humour comes from her perspective: the bus seems to gobble up vehicles, trees run towards it and stop, thirty paise is a fortune, and the old woman is judged by her earrings. We smile at her grave pride, as when she asserts she is eight years old and no child. The same closeness makes the sadness work. Because we see the road, the cow and the conversation through her eyes, her silence on the way back strikes us harder than any description of grief. If an adult narrator had explained death, the effect would have been weaker. The child's point of view lets the story hold laughter and loss in one afternoon.
