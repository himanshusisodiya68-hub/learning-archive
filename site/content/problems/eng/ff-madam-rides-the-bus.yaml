  num: "FF 7 · OC2 Q4"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part II)
  kind: text
  q: Why didn't Valli want to make friends with the elderly woman?
  sol: |
    Model answer: Valli found the woman repulsive. She disliked the big holes in her ear lobes with ugly earrings in them, and she could smell the betel nut the woman was chewing and see the juice about to spill over her lips. The woman also asked many questions about where Valli was going. Valli, proud of managing alone, felt she did not need her and answered curtly.
