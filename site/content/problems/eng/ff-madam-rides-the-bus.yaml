  kind: text
  q: |
    Answer in about 150 words.

    Compare Valli in "Madam Rides the Bus" with Lencho in "A Letter to God". What does each learn, or fail to learn, and what does the narrator want the reader to notice?
  sol: |
    One possible model answer (about 150 words): Both characters act with total conviction. Lencho believes God will send money, and Valli believes she can make the journey on her own. Lencho, however, learns nothing: he blames the post office for the shortfall, and the irony is that he cannot see what the reader sees. Valli does learn something. She sees the cow's death and starts to grasp what her mother means about knowing and understanding. Lencho's story ends with a wry smile at his blindness, Valli's with her own quiet smile at what she has gained. In both, the narrator does not preach. The reader is asked to notice the gap between belief and fact in the first story, and between knowledge and understanding in the second.
