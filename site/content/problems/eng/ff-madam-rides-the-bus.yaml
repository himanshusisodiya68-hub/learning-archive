- id: ncert10-ff-7-14
  lvl: ncert-ex
  num: "FF 7 · OC3 Q4"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part III)
  kind: text
  q: Why didn't Valli want to go to the stall and have a drink? What does this tell you about her?
  sol: |
    Model answer: She said she did not have enough money for a drink, and she also refused the conductor's offer to buy her one, saying firmly "please, no". This tells us that she is careful with money, plans strictly and will not take a favour from a stranger. She has self-respect and independence, and she is sensible about her safety even though she is bold enough to travel alone.
  check: none

