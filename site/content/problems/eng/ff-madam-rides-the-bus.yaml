- id: ncert10-ff-7-24
  lvl: ncert-ex
  num: "FF 7 · WR Q1"
  source: NCERT X English · First Flight · Ch 7 · Writing
  kind: text
  q: |
    Write a page — about three paragraphs — on one of the following topics.

    1. Have you ever planned something entirely on your own, without taking grown-ups into your confidence? What did you plan, and how? Did you carry out your plan?
    2. Have you made a journey that was unforgettable in some way? What made it memorable?
    3. Are you concerned about traffic and road safety? What are your concerns? How would you make road travel safer and more enjoyable?
  sol: |
    One possible answer (Topic 3), about 170 words:

    Every morning on my way to school I see how risky our roads can be. Two-wheelers weave between buses, many riders wear no helmet, and children cross wherever there is a gap. Stray cattle wander onto busy roads, and speeding vehicles do not slow down near school gates. I am worried that one day someone I know will be hurt.

    I would begin with small, firm steps. Every crossing near a school should have a zebra marking, a signal and a person on duty at the opening and closing hours. Helmets and seat belts should be checked strictly, and drivers who use phones should be fined. Speed breakers with clear warning boards would slow traffic near markets, and strays should be moved to shelters.

    Safer roads would also be more enjoyable. Footpaths free of stalls, clean bus stops with shade, and polite drivers would make the walk to school pleasant. If every one of us follows the rules, a journey will become a happy part of the day instead of a worry.
  check: none

- id: ncert10-ff-7-25
  lvl: ncert-ex
  num: "FF 7 · WYCD Q1"
  source: NCERT X English · First Flight · Ch 7 · What you can do, 1
  kind: text
  q: |
    The students should be given two or three days to collect old (used) tickets from their friends, relatives and acquaintances: they could be bus tickets, train tickets, plane tickets, cinema tickets, tickets to cultural events, etc. By the time they finish the lesson they should be able to get a good collection in place. Get them to make a collage using as many as possible of the tickets collected, on a sheet of poster paper. This can then form the basis for many interesting activities: classification according to type of tickets (for what?) or price (how much?), etc; the most desirable tickets, the tickets no one wants, etc. — let students think of more ways to classify them. Get students to write a paragraph with the collage as base, and their imagination as guide.
  sol: |
    One possible answer: Stick the collected tickets on a poster in groups, for example bus, train, cinema and museum. Sort them again by price, from the cheapest to the dearest. Then write: "My collage holds a twenty-rupee bus ticket from my uncle's village, a torn cinema stub from a birthday outing and a train ticket to Jaipur. Each one is a small proof that someone went somewhere. If I could pick one ticket to use again, it would be the Jaipur one, for the fort at sunset." Other ways to classify: by colour, by date, by the distance travelled, or by how much you would like to use it.
  check: none

