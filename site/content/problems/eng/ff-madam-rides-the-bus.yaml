  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part III)
  kind: text
  q: How did Valli save up money for her first journey? Was it easy for her?
  sol: |
    Model answer: She saved up whatever stray coins came her way, resisting every temptation to buy peppermints, toys or balloons, until she had sixty paise. It was not easy. It was especially hard at the village fair, where she had the money but stifled a strong desire to ride the merry-go-round.
  check: none

- id: ncert10-ff-7-12
  lvl: ncert-ex
  num: "FF 7 · OC3 Q2"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part III)
  kind: text
  q: What did Valli see on her way that made her laugh?
  sol: |
    Model answer: She saw a young cow running very fast down the middle of the road, tail in the air, right in front of the bus. The driver honked again and again, but the louder he honked, the more frightened the animal became and the faster it galloped. Valli found this very funny and laughed until tears came to her eyes.
  check: none

- id: ncert10-ff-7-13
  lvl: ncert-ex
  num: "FF 7 · OC3 Q3"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part III)
  kind: text
  q: Why didn't she get off the bus at the bus station?
  sol: |
    Model answer: Valli had come only for the ride, not to see the town. She had saved just enough for the return fare, and she was too afraid to wander about the strange town alone. So she stayed in her seat, paid another thirty paise and waited for the bus to start back.
