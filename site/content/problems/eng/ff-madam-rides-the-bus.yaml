- id: b3
  lvl: board
  kind: text
  q: |
    Answer in about 100–120 words.

    Write a character sketch of Valli. Support each trait with evidence from the story.
  sol: |
    One possible model answer (about 115 words): Valli, an eight-year-old village girl, is curious, determined and independent. Her curiosity shows in how she watches the street every day and quietly collects facts about the bus. Her determination is clear from her careful plan and from how she saves sixty paise and refuses even the merry-go-round. She is fiercely independent: she refuses the conductor's help, insists she is "not a child", and says she can take care of herself. She is also proud and quick-tempered, snapping at the old man and woman. Yet she is sensitive, as the dead cow's sight saddens her deeply. She is a spirited child who is growing up through experience.
