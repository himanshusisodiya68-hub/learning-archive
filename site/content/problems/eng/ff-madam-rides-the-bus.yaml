# Madam Rides the Bus. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 7. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original. This chapter has no "Thinking about language" section in this reprint. The poem that shares the PDF is out of scope.

- id: ncert10-ff-7-1
  lvl: ncert-ex
  num: "FF 7 · BYR A1"
  source: NCERT X English · First Flight · Ch 7 · Before you read, Activity 1
  kind: text
  q: |
    Look at the words and phrases given below. Then put a tick against the ones you think you will find in the text.

    a set of passengers; get on the bus; get off the bus; platform; Tickets, please; a roar and a rattle; a row of seats; slowing down to a crawl; blowing a whistle
  sol: |
    One possible answer, checked against the story: you will find "a set of passengers" (the bus is filled with "a new set of passengers"), "get on the bus", "get off the bus", "a roar and a rattle" (the train at the crossing), "slowing down to a crawl" (the bus slows when Valli calls) and "blowing a whistle" (the conductor blows it twice). You will not find "platform", "Tickets, please" or "a row of seats" in those words. Before reading, a guess is enough; the story settles it.
  check: none

- id: ncert10-ff-7-2
  lvl: ncert-ex
  num: "FF 7 · BYR A2"
  source: NCERT X English · First Flight · Ch 7 · Before you read, Activity 2
  kind: text
  q: |
    You must have travelled by bus more than once. What can you see from a fast-moving bus? Given below are some suggestions. Speak briefly about some of these scenes, or about other such scenes that you have seen; or write a sentence or two about them.

    rivers; green fields; hills; roadside shops; market places; railway tracks; moving trains; vehicles on the road; trees; a crowd; clothes in shops; animals
  sol: |
    One possible answer: From a fast-moving bus I have seen green fields that seem to spin slowly past while the nearby trees rush by. At a railway crossing we waited as a long train thundered across, and in the market place the roadside shops were packed with clothes and vegetables while a crowd pushed along the edge. Once a cow strolled calmly across the road and the driver had to slow down.
  check: none

- id: ncert10-ff-7-3
  lvl: ncert-ex
  num: "FF 7 · OC1 Q1"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part I)
  kind: text
  q: What was Valli's favourite pastime?
  sol: |
    Model answer: Valli's favourite pastime was standing in the front doorway of her house and watching what was happening in the street. She had no playmates of her own age in the street, so this was nearly all she had to do, and she found it as enjoyable as any elaborate game.
  check: none

- id: ncert10-ff-7-4
  lvl: ncert-ex
  num: "FF 7 · OC1 Q2"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part I)
  kind: text
  q: What was a source of unending joy for Valli? What was her strongest desire?
  sol: |
    Model answer: The bus that ran between her village and the nearest town was a source of unending joy for Valli. It passed through her street every hour, always full of a new set of passengers. Her strongest desire was to ride on that bus, even if only once.
  check: none

- id: ncert10-ff-7-5
  lvl: ncert-ex
  num: "FF 7 · OC1 Q3"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part I)
  kind: text
  q: What did Valli find out about the bus journey? How did she find out these details?
  sol: |
    Model answer: Valli found out that the town was six miles from her village, that the fare was thirty paise one way, and that the trip took forty-five minutes. She also learned that if she stayed in her seat on reaching town and paid another thirty paise, she could return on the same bus. She found out all this over many days and months by listening carefully to the conversations between her neighbours and regular bus users, and by asking a few discreet questions here and there.
  check: none

- id: ncert10-ff-7-6
  lvl: ncert-ex
  num: "FF 7 · OC1 Q4"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part I)
  kind: text
  q: What do you think Valli was planning to do?
  sol: |
    One possible answer: Valli was planning to take the one-o'clock afternoon bus to town, stay in her seat, pay a second fare and ride back on the same bus, getting home at about a quarter to three. She was calculating and recalculating the timings and the money, so she must have meant to do it secretly and on her own.
  check: none

- id: ncert10-ff-7-7
  lvl: ncert-ex
  num: "FF 7 · OC2 Q1"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part II)
  kind: text
  q: Why does the conductor call Valli 'madam'?
  sol: |
    Model answer: The conductor is a jolly man, fond of joking. He is amused to see a small girl insisting on getting on by herself, paying her own fare and behaving like a grown-up. So he teases her by calling her "my fine madam" and making the other passengers laugh, though without meaning to hurt her.
  check: none

- id: ncert10-ff-7-8
  lvl: ncert-ex
  num: "FF 7 · OC2 Q2"
  source: NCERT X English · First Flight · Ch 7 · Oral Comprehension Check (after Part II)
  kind: text
  q: Why does Valli stand up on the seat? What does she see now?
  sol: |
    Model answer: A canvas blind covers the lower part of her window and cuts off her view, so Valli stands on the seat and peers over it. She now sees the bus travelling along a canal bank. On one side are the canal, palm trees, grassland, distant mountains and the blue sky. On the other side are a deep ditch and acres of green fields.
  check: none

