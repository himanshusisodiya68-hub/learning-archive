  q: What does Valli tell the elderly man when he calls her a child?
  sol: |
    Model answer: Valli tells him haughtily that there is nobody there who is a child, and that she has paid her thirty paise like everyone else. Later, when he and the conductor persist, she says she is not a child and is eight years old.
