    Rewrite the scene in which Valli refuses the conductor's offer of a cold drink (Part III) as a short passage of narrated prose in the past tense, using at least three manner adverbs to show how each person speaks. Do not copy the original lines.
  sol: |
    One possible model answer (about 120 words): The bus stood empty and quiet in the sun. "Wouldn't you like something cold to drink?" the conductor asked kindly, pointing to a stall across the road. Valli shook her head and answered nervously, "I couldn't." He smiled and offered again, this time more gently: "It's my treat." She looked at her fingers, then said firmly, "No, thank you." He shrugged, amused at her sensible little speech, and went off to chat with the driver. Valli, left alone, watched the crowds from her seat and sat very straight, as if the bus belonged to her. Note: adverbs used are kindly, nervously, gently and firmly; each one tells us how the speaker feels.
