- id: ncert10-ff-7-16
  lvl: ncert-ex
  num: "FF 7 · TT Q2"
  source: NCERT X English · First Flight · Ch 7 · Thinking about the text
  kind: text
  q: How did Valli plan her bus ride? What did she find out about the bus, and how did she save up the fare?
  sol: |
    Model answer: Valli planned in secret and in detail. She listened to the neighbours and regular passengers and asked a few discreet questions. She found out that the town was six miles away, the fare was thirty paise one way, the journey took forty-five minutes, and she could come back on the same bus by paying another thirty paise. She chose the one-o'clock bus because her mother slept from about one to four. To save the fare she gathered stray coins and resisted peppermints, toys, balloons and even the merry-go-round until she had sixty paise.
