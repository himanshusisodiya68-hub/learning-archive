# Pronouns. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive; there is no NCERT answer key.

- id: f1
  lvl: found
  kind: mcq
  q: "Complete the sentence: Ravi and ___ went to the market."
  opts: ["me", "I", "myself", "mine"]
  ans: 1
  sol: |
    Drop Ravi and test: "___ went to the market." The pronoun is the doer, so the subject form *I* is needed. *Me* is the object form, *myself* is reflexive and needs a doer to bend back to, and *mine* is a possessive.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Complete the sentence: The book on the table is ___."
  opts: ["my", "mine", "me", "myself"]
  ans: 1
  sol: |
    The pronoun stands alone after *is*, with no noun after it, so the standalone possessive *mine* is needed. *My* must come before a noun (*my book*).
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Complete the sentence: The dog wagged ___ tail."
  opts: ["it's", "its", "it", "itself"]
  ans: 1
  sol: |
    The possessive of *it* is *its*, with no apostrophe. *It's* is only a short form of *it is* or *it has*.
  check: none

- id: f4
  lvl: found
  kind: mcq
  q: "Complete the sentence: She hurt ___ while cutting vegetables."
  opts: ["her", "herself", "hers", "she"]
  ans: 1
  sol: |
    The doer and the one hurt are the same person, so the reflexive pronoun *herself* is used. *Her* would suggest someone else was hurt.
  check: none

- id: f5
  lvl: found
  kind: text
  q: "Name the kind of each pronoun in the sentences below (personal, possessive, reflexive, demonstrative, interrogative, relative or indefinite). (a) They arrived late. (b) The red scooter is mine. (c) Who broke the vase? (d) Those are my shoes. (e) She taught herself chess. (f) The boy who sat beside me was kind. (g) Nobody knew the answer."
  sol: |
    Model answer: (a) They: personal (subject form). (b) mine: possessive. (c) Who: interrogative. (d) Those: demonstrative. (e) herself: reflexive. (f) who: relative (it joins "sat beside me" to boy). (g) Nobody: indefinite.

    [Note] A model answer written for this archive.
  check: none

- id: b1
  lvl: board
  kind: text
  q: "Each sentence has one pronoun error. Find it and correct it. (a) Between you and I, the plan is risky. (b) Each of the girls have brought her pen. (c) The boy which won the prize is my cousin. (d) The decision is their's. (e) He taught hisself to swim."
  sol: |
    (a) *you and I* should be *you and me*. Between is a preposition and takes the object form: "Between you and me, the plan is risky."

    (b) *have* should be *has*. Each is singular: "Each of the girls has brought her pen."

    (c) *which* should be *who*. The antecedent is a person, and the pronoun is the doer of won: "The boy who won the prize is my cousin."

    (d) *their's* should be *theirs*. Possessive pronouns take no apostrophe: "The decision is theirs."

    (e) *hisself* should be *himself*. There is no word hisself: "He taught himself to swim."
  check: none

- id: b2
  lvl: board
  kind: mcq
  q: "Choose the correct word: This is the girl ___ I met at the fair."
  opts: ["who", "whom", "whose", "which"]
  ans: 1
  sol: |
    Answer the clause: "I met her." The relative pronoun is the object of *met*, so the formal object form *whom* is expected. *Who* is common in speech but a formal key prefers whom. *Whose* shows ownership, and *which* is for things.
  check: none

- id: b3
  lvl: board
  kind: mcq
  q: "Choose the correct word: Each of the boys collected ___ certificate."
  opts: ["their", "his", "her", "its"]
  ans: 1
  sol: |
    *Each* is singular, and the group named is boys, so the matching singular pronoun is *his*. *Her* is the wrong gender, *its* is for things, and *their* is plural. [Inference] Some modern writers accept singular *their*, but a traditional key prefers *his* for an all-boy group.
  check: none

- id: b4
  lvl: board
  kind: mcq
  q: "Choose the correct word: I know the girl ___ bag was stolen."
  opts: ["who", "whom", "whose", "which"]
  ans: 2
  sol: |
    The bag belongs to the girl, so the pronoun of ownership *whose* is needed. Who and whom do not show possession, and which is for things.
