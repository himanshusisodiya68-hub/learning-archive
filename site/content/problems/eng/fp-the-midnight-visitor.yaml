  q: |
    How does Ausable say he got in?
  sol: |
    Model answer: The question is printed in the book as "he", but the story only gives Max's entry (a passkey) and Ausable's claim about how someone could enter. [Inference] The question most likely means "How does Ausable say Max got in?" Ausable says that somebody has got into his room "through that nuisance of a balcony" for the second time in a month. He says the balcony belongs to the next apartment and can be reached from an empty room two doors down. This is the lie he invents.
