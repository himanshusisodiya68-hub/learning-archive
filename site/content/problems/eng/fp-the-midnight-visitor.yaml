  q: |
    Who is Fowler and what is his first authentic thrill of the day?
  sol: |
    Model answer: Fowler is a young, romantic writer who has come to meet a real secret agent, hoping for adventure. His first authentic thrill of the day comes when Ausable switches on the light in his room and Fowler sees a man, Max, standing halfway across the room with a small automatic pistol in his hand.
