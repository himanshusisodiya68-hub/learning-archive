- id: ncert10-fp-3-1
  lvl: ncert-ex
  num: "FP 3 · RF Q1"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Read and find out (first box)
  kind: text
  q: |
    How is Ausable different from other secret agents?
  sol: |
    Model answer: Ausable does not look or behave like the spies of books and films. He is very fat, wheezes when he speaks, still has his American (Boston) accent after twenty years in Paris, and lives in a small, plain hotel room on the top floor. He spends his evenings at a music hall and receives only a dull telephone call, not secret messages from beauties. His strength is not glamour but a calm, quick mind.
  check: none

