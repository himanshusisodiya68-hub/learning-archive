- id: b2
  lvl: board
  kind: text
  q: "(Original problem.) Answer in about 100 to 120 words. Write a character sketch of Ausable, supporting each quality with evidence from the story."
  sol: |
    One possible model answer: Ausable looks like the opposite of a secret agent, yet he is the cleverest man in the room. He is fat and wheezy, and still speaks with a Boston accent after twenty years in Paris, so Fowler and Max both judge him lightly. Underneath he is calm: facing a pistol, he sits down heavily and grumbles about the management as if nothing were wrong. He is observant and quick-witted, for he joins the dark window, the top floor, an expected knock and a made-up balcony into one trap. He is also patient, since he waits thirty-one minutes and does not hurry the lie. His success shows that ability lies in the mind, not in looks. (A sketch earns marks for qualities with evidence, a clear structure and correct language.)
