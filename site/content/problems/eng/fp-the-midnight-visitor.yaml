- id: ncert10-fp-3-5
  lvl: ncert-ex
  num: "FP 3 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Think about it
  kind: text
  q: |
    “Ausable did not fit any description of a secret agent Fowler had ever read.” What do secret agents in books and films look like, in your opinion? Discuss in groups or in class some stories or movies featuring spies, detectives and secret agents, and compare their appearance with that of Ausable in this story. (You may mention characters from fiction in languages other than English. In English fiction you may have come across Sherlock Holmes, Hercule Poirot, or Miss Marple. Have you watched any movies featuring James Bond?)
  sol: |
    One possible answer: Spies in films are usually slim, fit, stylishly dressed and good with gadgets and fights, like James Bond. Fictional detectives are often sharp-eyed and unusual: Sherlock Holmes is tall and thin with a pipe, and Hercule Poirot is neat and fussy. Hindi and Bengali detectives such as Byomkesh Bakshi and Feluda are ordinary-looking people whose strength is observation. Ausable is fat, wheezes and has a plain room, so he looks like the opposite of the film spy. But like Holmes and Feluda, he wins by thinking, not by fighting, which is the story's point: ability is not shown by looks.
  check: none

- id: ncert10-fp-3-6
  lvl: ncert-ex
  num: "FP 3 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Think about it
  kind: text
  q: |
    How does Ausable manage to make Max believe that there is a balcony attached to his room? Look back at his detailed description of it. What makes it a convincing story?
  sol: |
    Model answer: Ausable complains, as an annoyed hotel resident would, that someone has entered through "that nuisance of a balcony" for the second time in a month. When Max says he used a passkey and did not know about a balcony, Ausable explains in detail: the room was once part of a larger unit, the next room used to be the living room and had the balcony, the balcony extends under his window, and it can be reached from the empty room two doors down. He adds that someone did this last month and the management promised to block it but has not.

    The story is convincing for several reasons. It is full of ordinary, specific facts (rooms, a history, a location, a month) that sound like real memory. It is told in an irritated, offhand tone, which makes it sound true rather than rehearsed. It explains something Max did not know, so he accepts it as useful information. The window shows only blackness, so Max cannot check. Finally, the knock at the door gives Max no time to think, so he chooses the escape the story has built for him.
  check: none

- id: ncert10-fp-3-7
  lvl: ncert-ex
  num: "FP 3 · TT Q3"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Think about it
  kind: text
  q: |
    Looking back at the story, when do you think Ausable thought up his plan for getting rid of Max? Do you think he had worked out his plan in detail right from the beginning? Or did he make up a plan taking advantage of events as they happened?
  sol: |
    One possible answer: Ausable probably did not have the whole plan from the beginning, but he was prepared. The drink "for when you returned" had been ordered, so a waiter, Henry, was due to arrive; this suggests some forethought about the late hour. When he saw Max, he seems to have grasped quickly that the single window, the top-floor height, the dark night and the expected knock could be combined. He then made up the balcony, tested it on Max, and used the knock as the final push. So the plan was largely made up on the spot, taking advantage of events, but it rested on preparation. The text does not say exactly when he decided, so any firm claim is a reading, not a fact.
  check: none

- id: ncert10-fp-3-8
  lvl: ncert-ex
  num: "FP 3 · TK Q1"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Talk about it
  kind: text
  q: |
    In this story, Ausable shows great ‘presence of mind,’ or the ability to think quickly, and act calmly and wisely, in a situation of danger and surprise. Give examples from your own experience, or narrate a story, which shows someone’s presence of mind.
  sol: |
    One possible answer: Last monsoon, the lights in our building went off while a small boy was playing on the stairs. His older sister did not panic. She called out to him to sit still, switched on her phone torch, walked down slowly and held his hand to bring him to the landing. She thought quickly, stayed calm and took the safe option, which is presence of mind. (This is an invented example; use a true one from your own life in class.)
  check: none

- id: ncert10-fp-3-9
  lvl: ncert-ex
  num: "FP 3 · TK Q2"
  source: NCERT X English · Footprints Without Feet · Ch 3 · Talk about it
  kind: text
  q: |
    Discuss what you would do in the situations described below. Remember that presence of mind comes out of a state of mental preparedness. If you have thought about possible problems or dangers, and about how to act in such situations, you have a better chance of dealing with such situations if they do arise.

    • A small fire starts in your kitchen.
    • A child starts to choke on a piece of food.
    • An electrical appliance starts to hiss and gives out sparks.
    • A bicycle knocks down a pedestrian.
    • It rains continuously for more than twenty-four hours.
    • A member of your family does not return home at the usual or expected time.

    You may suggest other such situations.
  sol: |
    One possible answer (general safety advice, not a substitute for proper training):
    - Small kitchen fire: switch off the gas or power if it is safe, cover the pan with a lid or damp cloth, never throw water on an oil fire, call for help and leave if it spreads.
    - Child choking: ask whether the child can cough or speak; if not, call for emergency help at once and use first-aid back blows or abdominal thrusts only if you have been trained.
    - Appliance sparks: switch off at the main switch without touching the appliance, unplug only when the power is off, keep everyone away and call an electrician.
    - Bicycle hits a pedestrian: stop, check if the person is hurt, call for help or an ambulance if needed, and do not move a badly injured person.
    - Twenty-four hours of rain: stay indoors, keep a torch, phone charged and drinking water ready, avoid flooded streets and open drains, and listen to local warnings.
    - Family member late: call them, then friends or neighbours, check the route, and contact the police if there is no news after a reasonable time.
    Other situations: a power cut at night, a stranger at the door, a lost phone.
  check: none

