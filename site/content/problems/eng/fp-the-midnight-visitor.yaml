- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) Answer in about 150 words. 'Appearance is a poor guide to ability.' Discuss with reference to Ausable, Max and Fowler."
  sol: |
    One possible model answer: The story is built on mistaken judgments. Fowler expects a romantic spy and decides, after the dull evening, that Ausable is a disappointment. Max sees a fat, wheezing, unarmed man and assumes he is harmless, so he leaves him free to talk. Both are wrong. Ausable's size and accent hide a calm, observant mind that can turn a casual knock and a dark window into a trap. Max, by contrast, has everything a film spy has: a slim figure, a weapon and a confident manner. He loses because he accepts a detailed story without checking it and because he is in too great a hurry to think. Even Fowler learns a lesson: the "drama" he wanted is really there, but it is in the quiet exchange of words, not in guns. The author therefore mocks the glamorous picture of the spy and honours the observant, patient person. A good answer should name all three characters and give evidence for each.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Ausable's lie works partly because it is told casually. Explain, with two examples from the story, how tone and detail together can make a false statement believable."
  sol: |
    One possible model answer: Tone makes the speaker look innocent; detail makes the claim look checkable. Ausable's tone is irritated: he says he will "raise the devil with the management", as a hotel resident might, and he calls the balcony a "nuisance". An annoyed person is not usually thought to be inventing. The detail is the history of the room, the balcony's position under the window, the empty room two doors down, and the fact that it happened last month. These facts would take effort to invent, so they sound remembered. Together the casual tone and the specific detail persuade Max that Ausable is merely complaining, not plotting. (The phrases quoted are from the story, in the section where Ausable first mentions the balcony.)
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) The story is told from outside, staying close to Fowler, and we do not see Ausable's thoughts. What does the author gain by this choice? What would be lost if the narrator revealed Ausable's plan in the middle?"
  sol: |
    One possible model answer: By staying with Fowler, the author makes the reader as puzzled as Fowler is. We see Ausable's remarks but not their purpose, so we accept the balcony just as Max does, and the last line is a real surprise. It also makes the story feel like a spy's secret: only the hero knows. If the narrator revealed the plan halfway, the suspense would turn into waiting for something we already know, the twist would disappear, and the reader would watch Max's mistake from a superior position, not share the shock. The story would still be clever but much less effective.
  check: none
