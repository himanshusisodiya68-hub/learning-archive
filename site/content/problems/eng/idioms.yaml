- id: b1
  lvl: board
  kind: mcq
  q: "Read the sentence and choose the meaning of the underlined idiom. When the new teacher made a joke about her own handwriting, it broke the ice, and the students began to talk freely."
  opts: ["made people feel at ease", "made the room cold", "made the class angry", "ended the lesson"]
  ans: 0
  sol: |
    To break the ice is to remove the stiffness at a first meeting so that people relax. The clue is the second half of the sentence: the students "began to talk freely", which is what happens once awkwardness goes. "Made the room cold" is the literal trap.
