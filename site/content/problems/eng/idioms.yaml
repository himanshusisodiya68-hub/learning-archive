# Idioms. All problems are original (no NCERT items for this leaf). All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "What does the idiom 'a piece of cake' mean in this sentence? The geography quiz was a piece of cake."
  opts: ["very easy", "very sweet", "very long", "very strange"]
  ans: 0
  sol: |
    An idiom is read as a whole, not word by word. A piece of cake is something that takes almost no effort, so the quiz was very easy. The other options are traps built from the literal words (cake is sweet) or from guesses unrelated to the situation.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Choose the meaning of 'spill the beans'."
  opts: ["to reveal a secret", "to cook a meal", "to make a mess", "to waste food"]
  ans: 0
  sol: |
    To spill the beans is to give away a secret, often by accident. The picture is of beans escaping from a container; the meaning is that hidden information gets out. Cooking, mess and waste are literal readings of the words.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Which of these is a proverb, not an idiom?"
  opts: ["Look before you leap", "Cold feet", "Under the weather", "A black sheep"]
  ans: 0
  sol: |
    A proverb is a complete saying that gives advice or states a truth. "Look before you leap" is a whole sentence advising care. The other three are phrases that fit inside a sentence ("She has cold feet", "He is under the weather", "He is the black sheep of the family"), so they are idioms.
  check: none

- id: f4
  lvl: found
  kind: mcq
  q: "Choose the correct sentence."
  opts: ["He let the cat out of the bag.", "He let the dog out of the bag.", "He let out the cat of the bag.", "He let a cat out from a bag."]
  ans: 0
  sol: |
    An idiom keeps its words and its order. Only the first option keeps "let the cat out of the bag" intact. Changing the animal, the order or the articles breaks the idiom and leaves only the literal sentence, if that.
  check: none

