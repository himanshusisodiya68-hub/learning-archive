# Subject-verb agreement. All problems are original (no NCERT items for this leaf). There is no NCERT answer key: every answer is a model answer written for this archive.

- id: f1
  lvl: found
  kind: mcq
  q: "Complete the sentence: The boys in my class ___ very friendly."
  opts: ["is", "are", "was", "has been"]
  ans: 1
  sol: |
    The subject is *boys*, which is plural, so the verb is *are*. The phrase *in my class* only tells us which boys. *Is*, *was* and *has been* are all singular.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Complete the sentence: She ___ not like spicy food."
  opts: ["do", "does", "are", "have"]
  ans: 1
  sol: |
    *She* is third-person singular, so the helper is *does*: "She does not like spicy food." *Do* goes with I, you, we and they.
  check: none

