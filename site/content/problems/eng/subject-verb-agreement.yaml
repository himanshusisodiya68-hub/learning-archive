- id: f4
  lvl: found
  kind: mcq
  q: "Complete the sentence: Everyone in the hall ___ clapping."
  opts: ["were", "are", "was", "have been"]
  ans: 2
  sol: |
    *Everyone* is singular, however many people it stands for, so the verb is *was* ("Everyone in the hall was clapping"). *Were*, *are* and *have been* are plural forms.
  check: none

- id: b1
  lvl: board
  kind: mcq
  q: "Choose the correct form: The teacher, along with her students, ___ going on a trip tomorrow."
  opts: ["are", "is", "were", "have been"]
  ans: 1
  sol: |
    *Along with* does not join subjects; it starts a side phrase. The subject is *the teacher*, which is singular, so the verb is *is*. Compare "The teacher and her students *are* going".
  check: none

- id: b2
  lvl: board
  kind: mcq
  q: "Choose the correct form: Neither the manager nor his assistants ___ aware of the change."
  opts: ["was", "is", "were", "has been"]
  ans: 2
  sol: |
    With *neither ... nor* the verb agrees with the nearer subject. The nearer subject is *assistants*, which is plural, so the verb is *were*.
  check: none

- id: b3
  lvl: board
  kind: mcq
  q: "Choose the correct form: A number of students ___ absent today."
  opts: ["is", "was", "are", "has been"]
  ans: 2
  sol: |
