- id: m4
  lvl: main
  kind: text
  q: "Compose a formal email (subject line and body, 90-110 words) to the customer care of an online grocery service. Your order of 12 items, number 88231, placed on 3 October for delivery by 7 pm, arrived at 11 pm with the milk and eggs missing and the bill charging you for them (Rs 160). You want the Rs 160 refunded within three working days. You are Rina Bose."
  sol: |
    One possible model answer.

    **Subject:** Order 88231: items missing, refund of Rs 160 requested

    Dear Customer Care Team,

    I placed order 88231 for twelve items on 3 October, with delivery promised by 7 pm. The order reached me at 11 pm, four hours late, and the milk and eggs were missing from the package, although the bill includes them at Rs 160.

    I request you to refund Rs 160 to my original payment method within three working days. Please also confirm by return email that the matter has been recorded, so that I can use the confirmation if the refund is delayed. I have attached a photograph of the delivered items and the invoice.

    Thank you for your help.

    Yours sincerely,\
    Rina Bose

    What carries over from the letter: the subject line names the order and the problem; the facts are dated and numbered; the request has a remedy and a deadline. What differs: no sender's address block and a named greeting are normal in an email, so *Yours sincerely* is used. (About 100 words in the body.)
  check: none

- id: m5
  lvl: main
  kind: text
  q: "This letter body has about 165 words, over the limit. Cut it to about 110 words without losing the facts or the request. 'I am writing this letter to you today because I want to complain about the very, very bad condition of the road that goes from Sector 5 to Sector 9 in our city. This road has been in a terrible condition for the last three months and nobody is doing anything about it. There are more than fifteen big potholes on it and when it rains they fill with water so that you cannot see them. Last week an old man on a scooter fell into one and broke his arm. All the people who live here are very angry and upset about this. I would like to request you very kindly, if it is possible for you, to please repair the road as soon as possible so that no more accidents happen and we can travel safely. I will be extremely grateful to you for your kind help and I hope you will not ignore my letter.'"
  sol: |
    One possible model answer (about 105 words).

    "I wish to bring to your notice the poor condition of the road between Sector 5 and Sector 9. For the last three months, it has had more than fifteen potholes, and during rain they fill with water and become invisible. Last week an elderly scooter rider fell into one and broke his arm. Residents are angry that no repair has been made.

    I therefore request you to repair the road within a fortnight so that no more accidents occur. I shall be grateful for your prompt action."

    How the cut was made: the purpose is stated in the first sentence (the opening *I am writing this letter to you today because I want to* was filler); *very, very bad* and *terrible* became facts; *nobody is doing anything* was shortened; the request now has a deadline and no repeated pleas; the closing hope was folded into one sentence. Every fact (location, three months, fifteen potholes, rain, the injured man, the request) survives.
  check: none
