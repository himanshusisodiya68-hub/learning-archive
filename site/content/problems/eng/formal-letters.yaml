- id: m1
  lvl: main
  kind: text
  q: "Rewrite this chatty complaint in a formal register, keeping all its facts: 'Hi! I got a washing machine from your shop on 1 June and it's already broken. It makes a horrible noise and leaks. Your guys said they'd come but nobody did. Fix it now or give my money back or I'll go to the consumer court!'"
  sol: |
    One possible model answer.

    "Sir, I bought a washing machine from your shop on 1 June, and it has developed two faults. It makes a loud noise while running, and it leaks water. Your staff promised to send a technician, but no one has come. I therefore request you to repair or replace the machine within seven days or refund its price. If I receive no reply, I shall be compelled to approach the consumer forum."

    What was changed: the greeting *Hi!* became *Sir*; *it's already broken* became a precise description (noise and leakage); *your guys said they'd come* became a polite, impersonal sentence; the threat is calm and conditional; all contractions and exclamation marks are gone. The facts (1 June, washing machine, noise, leakage, no visit, the remedy and the consumer authority) are all kept. (The chatty draft said 'consumer court'; the formal version uses *consumer forum*, which is the usual term in the model letters of this lesson.)
  check: none

- id: m2
  lvl: main
  kind: text
  q: "A student's letter to the editor reads: 'To The Editor. Dear sir, I'm writing about the drains in my area which are really bad!!! The smell is awful and everyone is falling ill. Do something fast. Thanks. Yours sincerely, Raj.' List at least six faults, naming the part of the letter each belongs to."
  sol: |
    One possible model answer.

    1. **No sender's address or date** at the top.
    2. **No subject line.**
    3. **Salutation:** *Dear sir* should be *Sir* (or *Sir or Madam*) with a capital S and a comma.
    4. **Closing:** *Yours sincerely* does not match the unnamed greeting; it should be *Yours faithfully*.
    5. **Register:** the contraction *I'm*, the slang-like *really bad* and the three exclamation marks are informal.
    6. **Vague content:** no area name, no date, no number of residents affected, no description of the effect beyond *falling ill*.
    7. **Request:** *Do something fast* is a demand, not a polite, specific request. It should name the authority and the action (clean the drains, spray disinfectant) and say how soon.
    8. **Length and structure:** a single clumsy paragraph, far below the 100-120 word target, with no opening line such as *Through the columns of your esteemed daily* and no closing hope for publication.
  check: none

