# Formal letters. All problems are original (no NCERT items for this leaf). The board-format problems mirror the CBSE Class 10 writing task as remembered (100-120 words) [Unverified]. All answers are model answers written for this archive, not an official board key.

- id: f1
  lvl: found
  kind: mcq
  q: "A letter begins 'Dear Mr Rao,'. Which closing is correct?"
  opts: ["Yours faithfully,", "Yours sincerely,", "Your loving friend,", "Thanking you, bye,"]
  ans: 1
  sol: |
    The greeting names the receiver, so the closing is *Yours sincerely*. *Yours faithfully* goes with the unnamed greeting *Sir or Madam*. The other two are informal and do not belong in a formal letter.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: "Which sentence suits a letter of complaint to a shop manager?"
  opts: ["Your guys are useless!", "I'm so fed up with this junk.", "I request you to replace the faulty item within seven days.", "Fix it ASAP or else!"]
  ans: 2
  sol: |
    A formal letter uses a polite request verb, no contractions, no slang and no exclamation marks. Only the third option has all of these and also names a remedy and a time limit. The others are rude, informal or both.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: "Which is the correct order of parts in a formal letter?"
  opts: ["Salutation, subject line, receiver's address, body", "Sender's address and date, receiver's address, subject line, salutation, body", "Subject line, body, salutation, date", "Body, salutation, date, receiver's address"]
  ans: 1
  sol: |
    The order is: sender's address, date, receiver's address (below To), subject line, salutation, body, closing phrase, signature. Only the second option keeps the parts in this order. In all the others a part appears before the one that should come first.
  check: none

- id: f4
  lvl: found
  kind: mcq
  q: "You are writing to the Municipal Commissioner about a blocked drain on MG Road that has overflowed since 2 August. Which is the best subject line?"
  opts: ["Complaint", "Blocked drain on MG Road overflowing since 2 August", "Sir, please help me, I am very upset about the drain", "Drain."]
  ans: 1
  sol: |
    A good subject line names the problem, the place and the date in a short phrase. The second option does all three. *Complaint* and *Drain* are too vague, and the third is a sentence about feelings, not a subject line.
  check: none

- id: f5
  lvl: found
  kind: text
  q: "Rewrite each informal sentence in a formal register for a letter. (a) I'm writing because the bus never comes on time. (b) Please sort it out ASAP! (c) Thanks a lot for reading this."
  sol: |
    One possible model answer:

    (a) I wish to bring to your notice that the bus on Route 14 does not arrive on time.
    (b) I request you to look into the matter at the earliest.
    (c) I shall be grateful for your prompt attention to this matter.

    Notice what changed: the contraction *I'm* became *I wish*, the slang *sort it out* and *ASAP* became a polite request, the exclamation mark went, and a vague complaint received a specific route (any real or invented route is fine).
  check: none

- id: b1
  lvl: board
  kind: text
  q: "You are Karan Singh of 40, Lake View Colony, Udaipur. The lake near your colony is filling up with plastic bags and bottles thrown by visitors. Write a letter to the editor of a newspaper about it, suggesting what should be done. (100-120 words)"
  sol: |
    One possible model answer (body: about 100 words).

    > 40, Lake View Colony\
    > Udaipur\
    > 20 October 2026
    >
    > To\
    > The Editor\
    > The Mewar Times\
    > Udaipur
    >
    > Subject: Plastic waste in the lake
    >
    > Sir,
    >
    > Through the columns of your esteemed daily, I wish to draw the attention of the authorities to the plastic waste that is choking our lake.
    >
    > Every weekend, visitors leave bags, bottles and food packets along the shore, and much of it floats into the water. Fish are dying, the water smells, and the beauty that draws tourists to our city is fading fast.
    >
    > I request the municipal corporation to place dustbins every fifty metres, fine those who litter and run regular clean-up drives. Citizens, too, must carry their waste home.
    >
    > I hope you will publish this letter so that action follows soon.
    >
    > Yours faithfully,\
    > Karan Singh

    Why it scores: the layout is complete; the subject line names the matter; paragraph 2 gives facts and effects; paragraph 3 gives actions to both authorities and citizens. [Unverified: the actual marking split of the board.]
  check: none

- id: b2
  lvl: board
  kind: text
  q: "You are Neha Arora of 7, Civil Lines, Kanpur. On 5 September you ordered a school bag and a lunch box worth Rs 1,890 online from 'Bagwala Online', Mumbai (order no. 4521). The parcel arrived on 20 September with the lunch box missing, and the bag has a broken zip. The customer care helpline has not helped. Write a letter of complaint to the manager. (100-120 words)"
  sol: |
    One possible model answer (body: about 100 words).

    > 7, Civil Lines\
    > Kanpur\
    > 22 September 2026
    >
    > To\
    > The Manager\
    > Bagwala Online\
    > Andheri, Mumbai
    >
    > Subject: Incomplete and damaged delivery of order no. 4521
    >
    > Sir,
    >
    > On 5 September, I ordered a school bag and a lunch box worth Rs 1,890 from your website (order no. 4521). The parcel reached me on 20 September, fifteen days after my order.
    >
    > To my dismay, the lunch box was missing, and the bag has a broken zip. I called your helpline twice, on 20 and 21 September, but I received no help.
    >
