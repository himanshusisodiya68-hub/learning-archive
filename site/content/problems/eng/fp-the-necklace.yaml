- id: b4
  lvl: board
  q: |
    Write a short character sketch (about 80 words) of M. Loisel using at least two pieces of evidence from the story.
  kind: text
  sol: |
    Model answer (one possible answer): M. Loisel is a loving, thrifty and loyal husband. He is pleased by simple things such as the potpie and tries to make his wife happy by bringing the invitation to the ball. He gives her the four hundred francs he had saved to buy a gun, and he suggests borrowing jewels from her friend. When the necklace is lost he searches the streets and goes to the police. He never blames his wife and for ten years he works evenings and nights to repay the debt. He is perhaps too ready to hide the loss instead of urging honesty.
