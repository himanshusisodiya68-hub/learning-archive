- id: m1
  lvl: main
  q: |
    The story opens by saying Matilda was "born as if through an error of destiny" (first paragraph). How does the opening prepare the reader for the rest of the story? Discuss in about 120 words.
  kind: text
  sol: |
    Model answer (one possible answer): The opening tells us at once that Matilda believes she was born into the wrong life. "An error of destiny" shows her sense of being cheated, and the word "clerks" fixes her place in a modest class. From the first lines we see her as discontent, and this discontent explains each later choice: she weeps over the invitation, insists on a dress and then on jewels, and hurries away from the ball ashamed of her wraps. The narrator also reports her thoughts in a calm, slightly ironic tone, and this distance hints that her view of herself is not the whole truth. The opening therefore plants the character flaw that drives the plot and prepares the reader for the irony of the ending, where her dream of riches is paid for by a lifetime of work.
  check: none

- id: m2
  lvl: main
  q: |
    "How small a thing will ruin or save one!" Explain this remark in the light of the whole story. Do you think chance or choice is more responsible for the Loisels' fate? Give reasons.
  kind: text
  sol: |
    Model answer (one possible answer, since it asks for an opinion): The remark says that a trivial event can change a life. Here a clasp or a pocket, a missing cab number, and a necklace nobody examined decide ten years. Chance did play a part, since the necklace was lost without warning. But choice carried the larger share. Matilda chose to borrow the most costly piece, to rush off so as not to be seen in her cheap wraps, and above all to hide the loss. Loisel chose to go along with the lie and to borrow the money. At each step an honest option existed. So chance started the trouble, but the Loisels' decisions turned a small loss into a long punishment.
  check: none

- id: m3
  lvl: main
  q: |
    Identify two examples of foreshadowing or suspense in the story and explain how each prepares the reader for the twist at the end.
  kind: text
  sol: |
    Model answer (one possible answer): First, Mme Forestier lends the necklace at once and without any worry, and later does not open the jewel-box when it is returned. A reader may wonder why she is so careless with an apparently valuable piece. Second, Matilda is afraid that her friend will notice the substitution, which builds suspense and makes us expect a bitter scene, but the scene never comes. Both details show that the real value of the necklace is never examined, and they prepare us for the last line, which reveals that the original was only paste. In this way the twist feels surprising yet fair.
  check: none
