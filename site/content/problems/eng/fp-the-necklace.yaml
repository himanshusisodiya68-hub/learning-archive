- id: ncert10-fp-7-5
  lvl: ncert-ex
  num: "FP 7 · RF3 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Read and find out (third passage)
  kind: text
  q: |
    What do M. and Mme Loisel do next?
  sol: |
    One possible model answer: When they discover the necklace is gone, they search the folds of her dress and cloak and her pockets. Then M. Loisel goes back over the route they had walked, finds nothing, and next goes to the police and the cab offices and puts a reward advertisement in the newspapers. Following his advice, Mme Loisel also writes to her friend that the clasp is broken and being repaired, in order to gain time.
  check: none

- id: ncert10-fp-7-6
  lvl: ncert-ex
  num: "FP 7 · RF3 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Read and find out (third passage)
  kind: text
  q: |
    How do they replace the necklace?
  sol: |
    One possible model answer: After a week without hope, they find a diamond necklace that looks exactly like the lost one in a shop of the Palais-Royal. It is valued at forty thousand francs but they can get it for thirty-six thousand. M. Loisel uses the eighteen thousand francs his father left him and borrows the rest from moneylenders, making ruinous promises. They then return the new necklace to Mme Forestier without telling her the truth.
  check: none

- id: ncert10-fp-7-7
  lvl: ncert-ex
  num: "FP 7 · TT Q1"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Think about it
  kind: text
  q: |
    The course of the Loisels' life changed due to the necklace. Comment.
  sol: |
    One possible model answer: Before the loss the Loisels were poor but secure. They had a maid, a home and a husband's steady job. To repay the huge debt for the replacement necklace they sent away the maid, moved to an attic, and did all the hard work themselves. Mme Loisel washed dishes and linen, carried water and haggled over every coin, while her husband worked evenings keeping books and nights copying. After ten years they had paid everything, but she had aged, her hands were red and she had become a strong, hard woman. The necklace thus took ten years of their youth and comfort. The irony is that it was only a cheap imitation worth less than five hundred francs.
  check: none

- id: ncert10-fp-7-8
  lvl: ncert-ex
  num: "FP 7 · TT Q2"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Think about it
  kind: text
  q: |
    What was the cause of Matilda's ruin? How could she have avoided it?
  sol: |
    One possible model answer: The immediate cause was the loss of the borrowed necklace, but the deeper causes were her vanity and her discontent. She was not satisfied with her life, wanted to look rich at the ball, and so borrowed expensive jewels. When she lost them she made her second and greater mistake: she did not tell her friend the truth and chose to replace the necklace instead. She could have avoided the ruin by being content with her simple dress (or flowers, as her husband suggested) and, above all, by confessing the loss to Mme Forestier at once. Her friend would have told her the necklace was false.
  check: none

- id: ncert10-fp-7-9
  lvl: ncert-ex
  num: "FP 7 · TT Q3"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Think about it
  kind: text
  q: |
    What would have happened to Matilda if she had confessed to her friend that she had lost her necklace?
  sol: |
    One possible model answer: Mme Forestier would probably have told her at once that the necklace was only an imitation, worth no more than five hundred francs. Matilda would have felt embarrassed, perhaps been scolded, but the matter would have ended there. She would not have borrowed thirty-six thousand francs, and she and her husband would have been spared ten years of hard labour and poverty. [Inference: the story shows Mme Forestier as a kind and generous friend, so she would most likely have forgiven the loss.]
  check: none

- id: ncert10-fp-7-10
  lvl: ncert-ex
  num: "FP 7 · TT Q4"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Think about it
  kind: text
  q: |
    If you were caught in a situation like this, how would you have dealt with it?
  sol: |
    One possible model answer (opinion, so yours may differ): I would search the way back carefully, and the same day I would tell my friend honestly what had happened and say how sorry I was. I would offer to pay for the necklace or to share the cost, and I would ask her what it was worth. Telling the truth early would save me the cost of a long lie, keep our friendship, and perhaps show that the loss was far smaller than I feared.
  check: none

