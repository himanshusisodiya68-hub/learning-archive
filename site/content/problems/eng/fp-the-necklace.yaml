# The Necklace. NCERT questions copied word for word from NCERT Class X English Footprints Without Feet (reprint 2026-27), Ch 7. This chapter has no Thinking about language, Speaking or Writing section in the text. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-fp-7-1
  lvl: ncert-ex
  num: "FP 7 · RF1 Q1"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Read and find out (first passage)
  kind: text
  q: |
    What kind of a person is Mme Loisel — why is she always unhappy?
  sol: |
    One possible model answer: Mme Loisel is pretty, proud and discontented. She was born into a family of clerks and married a petty clerk, but she feels she was meant for luxury. She is always unhappy because she compares her life with the lives of rich people. She suffers over her shabby apartment and worn chairs, her plain dinners, and her lack of frocks and jewels, and she even avoids her rich convent friend because each visit makes her weep. She is so busy longing for what she lacks that she cannot enjoy what she has.
  check: none

- id: ncert10-fp-7-2
  lvl: ncert-ex
  num: "FP 7 · RF1 Q2"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Read and find out (first passage)
  kind: text
  q: |
    What kind of a person is her husband?
  sol: |
    One possible model answer: M. Loisel is a kind, simple and loving man. He is content with his small job and his plain meals, and he is delighted by an ordinary potpie. He tries hard to please his wife: he brings her the invitation, gives up the four hundred francs he had saved for a gun, and suggests borrowing jewels from her friend. He never blames her for the loss of the necklace and later works extra hours at night to repay the debt.
  check: none

