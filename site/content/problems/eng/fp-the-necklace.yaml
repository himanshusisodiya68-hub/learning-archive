- id: b1
  lvl: board
  q: |
    Describe in about 100 words what changes in Matilda Loisel's character between the beginning of the story and the end. Support your answer with evidence from the text.
  kind: text
  sol: |
    Model answer (one possible answer): At the start Matilda is vain and discontented. She is born into a family of clerks yet she dreams of luxury, weeps over her shabby apartment, and ignores the love of her husband. She throws down the Minister's invitation because she has no dress, and she hurries away from the ball to hide her plain wraps. After the necklace is lost she faces the debt bravely. She dismisses the maid, moves to an attic, scrubs floors and carries water, and she pays "completely, heroically", in the narrator's words. At the end she is old and rough, but she is honest and proud of having paid every franc. Her looks fade, but her character grows stronger.
  check: none

