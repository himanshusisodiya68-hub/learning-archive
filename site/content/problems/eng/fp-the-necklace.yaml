- id: ncert10-fp-7-12
  lvl: ncert-ex
  num: "FP 7 · TA Q2"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Talk about it (discussion topic)
  kind: text
  q: |
    Honesty is the best policy.
  sol: |
    One possible model answer: I agree. In the story, the Loisels paid ten years for hiding a small mishap. Had Matilda told Mme Forestier on the day, the loss would have been explained in minutes and the false necklace would have been replaced by a small sum, if at all. Honesty may be uncomfortable for a moment, but dishonesty grows into a larger burden with time. It also keeps trust, which is worth more than any jewel. A fair counter-view: honesty can sometimes hurt, so it should be told kindly and with a plan.
  check: none

- id: ncert10-fp-7-13
  lvl: ncert-ex
  num: "FP 7 · TA Q3"
  source: NCERT X English · Footprints Without Feet · Ch 7 · Talk about it (discussion topic)
  kind: text
  q: |
    We should be content with what life gives us.
  sol: |
    One possible model answer: Partly. Matilda's unhappiness began long before the necklace; she could not enjoy a loving husband, a home and a secure income because she kept comparing herself with the rich. Contentment would have saved her from the debt. However, being content should not mean giving up effort. We should be thankful for what we have and still work honestly to improve our lives. The balance is to enjoy what we have while we try to grow, and not to chase the look of wealth.
  check: none

