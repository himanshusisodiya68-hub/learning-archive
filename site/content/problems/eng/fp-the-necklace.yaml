  q: |
    The characters in this story speak in English. Do you think this is their language? What clues are there in the story about the language its characters must be speaking in?
  sol: |
    One possible model answer: No, English is probably not their own language. The story is set in Paris, and the English text is a translation of a French story. The clues are the French titles and names (M. for Monsieur and Mme for Madame, Palais-Royal, Champs-Elysees, Jeanne), the French money (francs and sous), and the French places and customs. The glossary also explains Mme and M. as French forms of address. So the characters were almost certainly speaking French. [The author's name, Guy de Maupassant, is also French.]
