- id: m1
  lvl: main
  kind: text
  q: "(Original problem.) \"The Proposal\" is called a farce. Write a long answer of about 100-120 words, using at least three features of a farce from the play."
  sol: |
    One possible answer (about 110 words): A farce is a fast, exaggerated comedy, and "The Proposal" has every feature. First, the cause of the quarrels is trivial: a meadow worth about 300 roubles and two dogs lead to threats of court cases and shooting. Second, characters are exaggerated. Lomov has palpitations, a twitching eyebrow and numb feet whenever he gets excited, and Chubukov is ready to cut his throat over a daughter's marriage. Third, repetition and reversal drive the humour: "Mine!" and "Ours!" are shouted again and again, Natalya moves from fury to tears in a line, and the couple argue about the dogs again immediately after getting engaged. We laugh because no one is truly harmed.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "(Original problem.) Explain dramatic irony, with two examples from the play. Write about 100 words."
  sol: |
    One possible answer (about 100 words): Dramatic irony occurs when the audience knows something that a character does not. In "The Proposal", we know from the start that Lomov has come to ask for Natalya's hand, but she does not. She insults him over the Meadows while we watch her ruin her own match. Again, Chubukov wrongly believes in an aside that Lomov has come to borrow money, but we soon learn the truth. Each time the gap between what the characters believe and what the audience knows produces laughter, and because we are one step ahead, the characters' stubbornness seems more foolish and more comic.
  check: none

- id: m3
  lvl: main
  kind: text
  q: "(Original problem.) Is the match between Lomov and Natalya likely to be a happy one? Give reasons from the play in about 100-120 words."
  sol: |
    One possible answer (about 110 words): The marriage looks unlikely to be peaceful. Lomov wants a wife for convenience, because he is thirty-five and wants a quiet life, and Natalya wants a husband because she is twenty-five. Neither speaks of love. More importantly, they cannot spend a few minutes together without quarrelling: first over the Meadows, then over the dogs, and again right after the engagement. Chubukov's last words, calling for champagne to drown out the argument, are a joke about how things will go. Yet there is hope: the quarrels never carry real hatred, and both are quickly reconciled. Their match may be noisy but not unhappy.
  check: none

- id: m4
  lvl: main
  kind: text
  q: "(Original problem.) Write a short script of five exchanges in which two neighbours quarrel over a trivial matter, such as a cricket ball that has broken a window. Include at least three stage directions."
  sol: |
    One possible answer.

    RAVI: [knocking, holding a cricket ball] Mr Sharma, your son broke my window!
    SHARMA: [opens the door, folds his arms] Impossible. My son was at tuition.
    RAVI: [waves the ball] Then whose ball is this, with his name written on it?
    SHARMA: [takes the ball, looks closely] Anyone can write a name. You're making a fuss over nothing!
    RAVI: [shouts] Nothing! That was a new window!
    SHARMA: [calmly, to himself] Perhaps I should pay. [aloud] Never! Your own dog broke it!
    [A pause. Both stare at each other and then at the ball.]
  check: none
