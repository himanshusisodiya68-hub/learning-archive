- id: ncert10-ff-9-16
  lvl: ncert-ex
  num: "FF 9 · Homophones"
  source: NCERT X English · First Flight · Ch 9 · Homophones
  kind: text
  q: |
    Can you find the words below that are spelt similarly, and sometimes even pronounced similarly, but have very different meanings? Check their pronunciation and meaning in a dictionary.
    • They were too close to the door to close it.
    • Since there is no time like the present, she thought it was time to present the present.
  sol: |
    One possible answer. In the first sentence, "close" (adjective, rhymes with "dose": near) and "close" (verb, rhymes with "nose": to shut) are spelt the same but pronounced differently. In the second, "present" has three uses: "the present" (noun, the current time, stress on the first syllable), "to present" (verb, to give, stress on the second syllable) and "the present" (noun, a gift, stress on the first syllable). Words spelt alike but with different meanings are homonyms; those that are also pronounced alike are homophones as well, and those pronounced differently are sometimes called heteronyms.
  check: none

