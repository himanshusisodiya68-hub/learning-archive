  q: |
    You must have noticed that when we report someone's exact words, we have to make some changes in the sentence structure. In the following sentences fill in the blanks to list the changes that have occurred in the above pairs of sentences. One has been done for you.

    1. To report a question, we use the reporting verb asked (as in Sentence Set 1).
    2. To report a statement, we use the reporting verb ____.
    3. The adverb of place here changes to ____.
    4. When the verb in direct speech is in the present tense, the verb in reported speech is in the ____ tense (as in Sentence Set 3).
    5. If the verb in direct speech is in the present continuous tense, the verb in reported speech changes to ____ tense. For example, ____ changes to was getting.
    6. When the sentence in direct speech contains a word denoting respect, we add the adverb ____ in the reporting clause (as in Sentence Set 1).
    7. The pronouns I, me, our and mine, which are used in the first person in direct speech, change according to the subject or object of the reporting verb such as ____, ____, ____ or ____ in reported speech.
  sol: |
    One possible answer.

    2. said (or declared, as in Sentence Set 5).
    3. there.
    4. past tense. Sentence Set 4 turns "What's the matter?" into "what the matter was", present to past. Sentence Set 3 turns the present perfect "haven't been" into the past perfect "hadn't been", so the exact word the book expects here is [Unverified].
    5. past continuous tense. For example, "am getting" changes to was getting.
    6. respectfully.
    7. he, she, him or her (also his or their, depending on who is speaking).
