- id: ncert10-ff-9-8
  lvl: ncert-ex
  num: "FF 9 · TL I.3"
  source: NCERT X English · First Flight · Ch 9 · Thinking about language, I. Question 3
  kind: text
  q: |
    Look up the following phrases in a dictionary to find out their meaning, and then use each in a sentence of your own.
    (i) You may take it that
    (ii) He seems to be coming round
    (iii) My foot's gone to sleep
  sol: |
    One possible answer.

    (i) "You may take it that" means you can be sure that, or you can assume that. Sentence: You may take it that the match will go on, even if it rains.

    (ii) "Coming round" means regaining consciousness, or being persuaded to change one's mind. Sentence: The patient seems to be coming round after the operation.

    (iii) "My foot's gone to sleep" means the foot feels numb and tingly because the blood flow was cut off for a while. Sentence: I sat cross-legged so long that my foot has gone to sleep and I cannot stand up.
  check: none

