    This play has been translated into English from the Russian original. Are there any expressions or ways of speaking that strike you as more Russian than English? For example, would an adult man be addressed by an older man as my darling or my treasure in an English play? Read through the play carefully, and find expressions that you think are not used in contemporary English, and contrast these with idiomatic modern English expressions that also occur in the play.
  sol: |
    One possible answer. Expressions that sound old or foreign: "my darling", "my treasure", "my angel", "my precious" for an adult man; "honoured Stepan Stepanovitch" and "I have the honour to ask"; "egad"; "Tfoo!"; "Devil take him!"; "I implore you"; "to trouble you with a request". Idiomatic modern English also occurs: "Spit it out!", "Well, I never!", "I can't make head or tail of", "have me on", "off my balance", "a weight off my shoulders", "He seems to be coming round", "My foot's gone to sleep". The contrast shows a translation that mixes the formality of the original with everyday phrases that an English reader can follow.
