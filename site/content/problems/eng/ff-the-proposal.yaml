# The Proposal. NCERT questions copied word for word from NCERT Class X English First Flight (reprint 2026-27), Ch 9. No NCERT answer key exists: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert10-ff-9-1
  lvl: ncert-ex
  num: "FF 9 · BYR Q1"
  source: NCERT X English · First Flight · Ch 9 · Before you read, Activity 1
  kind: text
  q: |
    The word 'proposal' has several meanings. Can you guess what sort of proposal the play is about?
    (i) a suggestion, plan or scheme for doing something
    (ii) an offer for a possible plan or action
    (iii) the act of asking someone's hand in marriage
  sol: |
    One possible answer: (iii). The chapter introduction and the title make it clear that the play is about a man who comes to ask for a woman's hand in marriage. (The first two meanings are the general senses of the word, and a marriage offer is a special case of an offer, but (iii) is the one that fits the play.)
  check: none

- id: ncert10-ff-9-2
  lvl: ncert-ex
  num: "FF 9 · BYR Q2"
  source: NCERT X English · First Flight · Ch 9 · Before you read, Activity 2 (A Russian Wedding)
  kind: text
  q: |
    Do you think Indian and Russian weddings have any customs in common? With the help of a partner, fill in the table below.

    Wedding Ceremonies in Russia and India
    Customs similar to Indian ones | Customs different from Indian ones
  sol: |
    One possible answer, based on the article printed in the book about a Russian wedding (the article is not reproduced here).

    | Customs similar to Indian ones | Customs different from Indian ones |
    |---|---|
    | The wedding can last for days and is a big family occasion | The groom must answer questions at each landing of the stairs to reach the bride, and pays money for wrong answers |
    | The bride's and groom's friends play a large part with games and teasing | The bride is 'stolen' during the reception and the groom must pay to get her back |
    | The couple are welcomed with a feast and good wishes | Guests drink a toast with wine, and the couple takes a city tour before the reception |
    | Friends take the bride's shoe and ask for money, like the Indian custom of hiding the groom's shoes | The couple go through a civil registration |

    Your own family's customs may add more entries.
  check: none

- id: ncert10-ff-9-3
  lvl: ncert-ex
  num: "FF 9 · TT Q1"
  source: NCERT X English · First Flight · Ch 9 · Thinking about the text, Question 1
  kind: text
  q: |
    What does Chubukov at first suspect that Lomov has come for? Is he sincere when he later says "And I've always loved you, my angel, as if you were my own son"? Find reasons for your answer from the play.
  sol: |
    One possible answer: Chubukov first suspects that Lomov has come to borrow money. He says so in an aside: "He's come to borrow money. Shan't give him any!" The moment Lomov mentions marriage to Natalya, Chubukov becomes warm, embraces him and speaks of loving him like a son. His affection looks insincere. It appears only once he learns that the match will unite two estates, and a few minutes later, when the Meadows are questioned, he calls Lomov a villain and a scarecrow and tells him never to enter the house again. His warmth follows his interest and not his feelings for Lomov.
  check: none

- id: ncert10-ff-9-4
  lvl: ncert-ex
  num: "FF 9 · TT Q2"
  source: NCERT X English · First Flight · Ch 9 · Thinking about the text, Question 2
  kind: text
  q: |
    Chubukov says of Natalya: "... as if she won't consent! She's in love; egad, she's like a lovesick cat…" Would you agree? Find reasons for your answer.
  sol: |
    One possible answer: No, the play does not show that Natalya is in love. She greets Lomov casually, talks about peas and hay, and takes him for a "merchant" come for goods. She picks an argument about Oxen Meadows within minutes. She is upset only when she hears that he came to propose, and what troubles her seems to be losing a suitable husband, since she is twenty-five. Even after the engagement she goes back to quarrelling about the dogs. Her father's claim shows what he wants to believe, not what he has observed.
  check: none

- id: ncert10-ff-9-5
  lvl: ncert-ex
  num: "FF 9 · TT Q3"
  source: NCERT X English · First Flight · Ch 9 · Thinking about the text, Question 3
  kind: text
  q: |
    (i) Find all the words and expressions in the play that the characters use to speak about each other, and the accusations and insults they hurl at each other. (For example, Lomov in the end calls Chubukov an intriguer; but earlier, Chubukov has himself called Lomov a "malicious, doublefaced intriguer." Again, Lomov begins by describing Natalya as "an excellent housekeeper, not bad-looking, well-educated.")

    (ii) Then think of five adjectives or adjectival expressions of your own to describe each character in the play.

    (iii) Can you now imagine what these characters will quarrel about next?
  sol: |
    One possible answer.

    (i) Chubukov on Lomov: first "my dear fellow", "my angel", "my darling", "my treasure"; later "villain", "scarecrow", "blind hen", "turnip-ghost", "stuffed sausage", "wizen-faced frump", "pettifogger", "malicious, doublefaced intriguer", "boy", "pup", "milksop", "fool". Natalya on Lomov: "rascal", "monster", "impudent", "low", "dishonest", "mean". Lomov on them: "grabber", "intriguer", "old rat", "Jesuit". Lomov on Natalya at first: "excellent housekeeper, not bad-looking, well-educated". Natalya also says Lomov has "a demon of contradiction" and is a hunter who knows least. Family insults: drunkard grandfather, runaway aunt, lunacy in the family, a hump-backed mother, a gambling father, a grandfather tried for embezzlement, a wife who beat her husband.

    (ii) Lomov: nervous, hypochondriac, suspicious, stubborn, awkward. Natalya: practical, proud, hot-tempered, domestic, competitive. Chubukov: loud, selfish, affectionate in words, impulsive, quarrelsome.

    (iii) Possibly the date and cost of the wedding, whose relatives get the better seat, who owns the next piece of disputed land, or whose horse or gun is better.
  check: none

