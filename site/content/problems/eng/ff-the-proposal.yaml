- id: ncert10-ff-9-10
  lvl: ncert-ex
  num: "FF 9 · TL III"
  source: NCERT X English · First Flight · Ch 9 · Thinking about language, III
  kind: text
  q: |
    Here is an excerpt from an article from the Times of India dated 27 August 2006. Rewrite it, changing the sentences in direct speech into reported speech. Leave the other sentences unchanged.

    (The excerpt is printed in the book, p. 137. It is an interview with the 90-year-old actor A. K. Hangal; the sentences in quotation marks are the ones to change.)
  sol: |
    One possible answer, with the direct sentences changed one by one and the narrator's own sentences left as they are in the book.

    - Direct: "Why do you want to know my age? If people know I am so old, I won't get work!" Reported: Laughing, he asked why we wanted to know his age and said that if people knew he was so old, he would not get work.
    - Direct: "What's the secret?" we ask. Reported: We ask him what the secret is. (Or: We asked what the secret was.)
    - Direct: "My intake of everything is in small quantities. And I walk a lot." Reported: He replies that his intake of everything is in small quantities and that he walks a lot.
    - Direct: "I joined the industry when people retire. I was in my 40s." Reported: He says that he joined the industry when people retire, in his 40s. He adds that he does not miss being called a star, because he is still respected and given work, while actors of his age are living in poverty and without work, and that he has no complaints.
    - Direct: "but yes, I have always been underpaid." Reported: He adds, however, that he has always been underpaid.
    - Direct: "No doubt I am content today, but money is important. I was a fool not to understand the value of money earlier." Reported: He regrets that, though he was undoubtedly content now, money was important and that he had been a fool not to understand its value earlier. (Because he speaks of his present feelings, the present tense can also stay: he says he is content but that money is important.)

    Choosing the tense: when the reporting verb is in the present (says, replies), the tenses inside the reported clause need not move back.
  check: none

- id: ncert10-ff-9-11
  lvl: ncert-ex
  num: "FF 9 · SW Q1"
  source: NCERT X English · First Flight · Ch 9 · Speaking and Writing, Question 1
  kind: text
  q: |
    Anger Management: As adults, one important thing to learn is how to manage our temper. Some of us tend to get angry quickly, while others remain calm. Can you think of three ill effects that result from anger? Note them down. Suggest ways to avoid losing your temper in such situations. Are there any benefits from anger?
  sol: |
    One possible answer. Ill effects: (1) we say hurtful things that we cannot take back, as Lomov and Chubukov do; (2) anger harms health, with a racing heart, headaches and sleeplessness; (3) it spoils friendships and makes people avoid us. Ways to avoid losing your temper: pause and count to ten; breathe slowly; walk away from the argument and return when calm; speak about the problem and not about the person; exercise or listen to music. Benefits: mild anger can be a signal that something is unfair, and it can give the energy to protest against injustice or to work harder, provided it is controlled.
  check: none

- id: ncert10-ff-9-12
  lvl: ncert-ex
  num: "FF 9 · SW Q2"
  source: NCERT X English · First Flight · Ch 9 · Speaking and Writing, Question 2
  kind: text
  q: |
    In pairs, prepare a script based on the given excerpt from The Home and the World by Rabindranath Tagore. You may write five exchanges between the characters with other directions such as movements on stage and way of speaking, etc.
  sol: |
    One possible answer (the excerpt in the book describes a husband called to his wife's room, where she asks him to clear foreign goods from his market and he refuses to force anyone, so this script is our own and does not reproduce the excerpt).

    SCENE: A small room. NIKHIL sits at his desk, looking at papers. A servant enters.

    SERVANT: [bows] The Chota Rani has sent for you, sir.
    NIKHIL: [looks up, surprised] The Chota Rani? Are you sure?
    SERVANT: [nods] She is waiting in your room.
    [NIKHIL rises slowly and walks to the inner door. BIMALA is standing by the window, dressed carefully. She turns and plays with her bangles.]
    BIMALA: [quickly] Is it right that ours should be the only market that allows foreign goods?
    NIKHIL: [calmly] What would you like me to do?
    BIMALA: [firmly] Order them to be cleared out.
    NIKHIL: [gently, shaking his head] The goods are not mine to throw out. The market belongs more to those who trade in it.
    BIMALA: [angry, steps forward] How dare they! Are you not the master here?
    NIKHIL: [picks up his papers, turns to go] I will not tyrannise, even for a good cause. I am busy this afternoon; we can talk later.
    [He exits. BIMALA stands alone, clenching her fists.]
  check: none

- id: ncert10-ff-9-13
  lvl: ncert-ex
  num: "FF 9 · SW Q3"
  source: NCERT X English · First Flight · Ch 9 · Speaking and Writing, Question 3
  kind: text
  q: |
    In groups, discuss the qualities one should look for in a marriage partner. You might consider the following points.
    • Personal qualities – Appearance or looks – Attitudes and beliefs – Sense of humour
    • Value system – Compassion and kindness – Tolerance, ambition – Attitude to money and wealth
    • Education and professional background
  sol: |
    One possible answer (this is a discussion topic, so there is no single right view). Many people would put compassion, honesty and respect first, because these keep a marriage steady when looks and money change. A shared sense of humour helps in hard times, and similar attitudes to money prevent daily quarrels. Appearance matters less over time. Education and a job give security, but being willing to share work at home and to support each other's careers counts as much. Lomov and Natalya are a useful warning: they look at property and age and never ask whether they can talk to each other without a fight.
  check: none

- id: ncert10-ff-9-14
  lvl: ncert-ex
  num: "FF 9 · SW Q4"
  source: NCERT X English · First Flight · Ch 9 · Speaking and Writing, Question 4
  kind: text
  q: |
    Are there parts of the play that remind you of film scenes from romantic comedies? Discuss this in groups, and recount to the rest of the class episodes similar to those in the play.
  sol: |
    One possible answer. The play resembles romantic comedies in several ways: the nervous hero who rehearses his lines and cannot say them; the couple who seem to dislike each other and quarrel but end up together; the parent who is too eager for the match; the sudden fainting or "near death" followed by a quick recovery; and the final scene in which the couple are still arguing. Many Hindi films also have a heroine who is furious with the hero in one scene and pleading for him in the next. (Name a film you know from your own viewing and say which of these scenes it shares.)
