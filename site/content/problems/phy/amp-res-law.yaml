- id: ncert12-ex-4-3
  lvl: ncert-ex
  num: "XII 4.3"
  source: NCERT XII Physics · Ch 4 · Exercise 4.3
  kind: num
  q: A long straight wire in the horizontal plane carries a current of 50 A in north to south direction. Give the magnitude and direction of B at a point 2.5 m east of the wire.
  ask: Magnitude of B
  unit: T
  ans: 4e-6
  tol: 1e-9
  verify: 2e-7*50/2.5
  sol: |
    $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{2\times10^{-7}\times50}{2.5} = 4\times10^{-6}$ T. Direction: the right-hand thumb rule with the thumb pointing south: at a point to the east, the fingers point **vertically upward**.
  answer_key: 4 × 10⁻⁶ T, vertical up
  check: both

- id: ncert12-ex-4-4
  lvl: ncert-ex
  num: "XII 4.4"
  source: NCERT XII Physics · Ch 4 · Exercise 4.4
  kind: num
  q: A horizontal overhead power line carries a current of 90 A in east to west direction. What is the magnitude and direction of the magnetic field due to the current 1.5 m below the line?
  ask: Magnitude of B
  unit: T
  ans: 1.2e-5
  tol: 1e-8
  verify: 2e-7*90/1.5
  sol: |
    $B = \dfrac{2\times10^{-7}\times90}{1.5} = 1.2\times10^{-5}$ T. With the current towards the west and the point below the line, the right-hand rule gives a field pointing **towards the south**. (This agrees with Example 12.1 of the Class X chapter.)
  answer_key: 1.2 × 10⁻⁵ T, towards south
  check: both

- id: ncert12-ex-4-8
  lvl: ncert-ex
  num: "XII 4.8"
  source: NCERT XII Physics · Ch 4 · Exercise 4.8
  kind: num
  q: A closely wound solenoid 80 cm long has 5 layers of windings of 400 turns each. The diameter of the solenoid is 1.8 cm. If the current carried is 8.0 A, estimate the magnitude of B inside the solenoid near its centre.
  ask: Field inside
  unit: T
  ans: 0.0251
  tol: 0.0001
  verify: 4e-7*Math.PI*(5*400/0.8)*8
  sol: |
    The total number of turns is $5\times400 = 2000$ over 0.80 m, so $n = 2500$ turns/m, and $l/a \gg 1$. $B = \mu_0nI = 4\pi\times10^{-7}\times2500\times8.0 = 8\pi\times10^{-3} = 2.5\times10^{-2}$ T. (The diameter is not needed.)
  answer_key: 8π × 10⁻³ T ≃ 2.5 × 10⁻² T
  check: both

