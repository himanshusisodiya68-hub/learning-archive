- id: b2
  lvl: board
  kind: num
  q: A toroid has 1000 turns and a mean radius of 10 cm and carries 1 A. Find the field inside it at the mean radius. (Original problem.)
  ask: Field
  unit: mT
  ans: 2
  tol: 0.005
  verify: 2e-7*1000*1/0.1*1000
  sol: Ampère's law on a circle of radius $r$ inside the toroid gives $B(2\pi r) = \mu_0NI$, so $B = \dfrac{\mu_0NI}{2\pi r} = \dfrac{2\times10^{-7}\times1000\times1}{0.1} = 2\times10^{-3}$ T $= 2$ mT.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A long straight wire of radius 1 cm carries 10 A uniformly distributed over its cross-section. Find the field at a distance of 0.5 cm from the axis. (Original problem.)
  ask: Field
  unit: µT
  ans: 100
  tol: 0.1
  verify: 2e-7*10*0.005/0.01**2*1e6
  sol: Inside, $B = \dfrac{\mu_0Ir}{2\pi a^2} = 2\times10^{-7}\times\dfrac{10\times0.005}{(0.01)^2} = 10^{-4}$ T $= 100$ µT.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A long solenoid has 400 turns per metre and carries 5 A. Find the field at the centre of one of its ends, on the axis. (Original problem.)
  ask: Field at the end
  unit: mT
  ans: 1.2566
  tol: 0.005
  verify: 4e-7*Math.PI*400*5/2*1000
  sol: |
    At the end of a long solenoid the field on the axis is half of that deep inside: $B = \tfrac12\mu_0nI = \tfrac12\times4\pi\times10^{-7}\times400\times5 = 1.26\times10^{-3}$ T. (Half of the field lines have already spread out.)
  check: code
