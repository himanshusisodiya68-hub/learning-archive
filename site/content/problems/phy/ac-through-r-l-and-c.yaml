# AC applied to a resistor, an inductor and a capacitor (reactance and phase). NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 7, §7.2–7.5 and Exercises 7.3–7.5. The printed text writes µF as "mF"; µF is used here. Found, board and main problems are original.

- id: ncert12-eg-7-2
  lvl: ncert-intext
  num: "XII Ex 7.2"
  source: NCERT XII Physics · Ch 7 · Example 7.2
  kind: num
  q: A pure inductor of 25.0 mH is connected to a source of 220 V. Find the inductive reactance and rms current in the circuit if the frequency of the source is 50 Hz.
  ask: rms current
  unit: A
  ans: 28
  tol: 0.1
  verify: 220/(2*Math.PI*50*25e-3)
  sol: |
    $X_L = 2\pi\nu L = 2\times3.14\times50\times25\times10^{-3} = 7.85\ \Omega$. The rms current is $I = V/X_L = 220/7.85 = 28$ A. (This is the current through a pure inductor: no resistance, so no power is dissipated.)
  check: code

- id: ncert12-eg-7-3
  lvl: ncert-intext
  num: "XII Ex 7.3"
  source: NCERT XII Physics · Ch 7 · Example 7.3
  kind: text
  q: A lamp is connected in series with a capacitor. Predict your observations for dc and ac connections. What happens in each case if the capacitance of the capacitor is reduced?
  sol: |
    **DC:** the capacitor charges up and then no current flows, so the lamp does not glow. Reducing $C$ makes no difference.

    **AC:** the capacitor offers a capacitive reactance $1/\omega C$ and a current flows, so the lamp shines. If $C$ is reduced the reactance increases and the current falls, so the lamp shines **less brightly**.
  check: none

- id: ncert12-eg-7-4
  lvl: ncert-intext
  num: "XII Ex 7.4"
  source: NCERT XII Physics · Ch 7 · Example 7.4
  kind: num
  q: A 15.0 µF capacitor is connected to a 220 V, 50 Hz source. Find the capacitive reactance and the current (rms and peak) in the circuit. If the frequency is doubled, what happens to the capacitive reactance and the current?
  ask: Capacitive reactance
  unit: Ω
  ans: 212.2
  tol: 0.2
  verify: 1/(2*Math.PI*50*15e-6)
  sol: |
    $X_C = \dfrac{1}{2\pi\nu C} = \dfrac{1}{2\pi\times50\times15.0\times10^{-6}} = 212\ \Omega$. The rms current is $I = V/X_C = 220/212 = 1.04$ A and the peak current is $i_m = \sqrt2I = 1.47$ A. The current oscillates between $+1.47$ A and $-1.47$ A and is **ahead of the voltage by $\pi/2$**.

    If the frequency is doubled, $X_C$ is halved and the current is doubled.
  check: code

- id: ncert12-eg-7-5
  lvl: ncert-intext
  num: "XII Ex 7.5"
  source: NCERT XII Physics · Ch 7 · Example 7.5
  kind: text
  q: |
    A light bulb and an open coil inductor are connected to an ac source through a key as shown in Fig. 7.9. The switch is closed and after sometime, an iron rod is inserted into the interior of the inductor. The glow of the light bulb (a) increases; (b) decreases; (c) is unchanged, as the iron rod is inserted. Give your answer with reasons. [Fig. 7.9 as described in the text: a bulb and an inductor coil in series with an ac source and a key.]
  sol: |
    **(b) decreases.** The iron rod is magnetised by the field of the coil and increases the magnetic field inside it, so the inductance $L$ increases. The inductive reactance $X_L = \omega L$ therefore increases, and a larger fraction of the applied ac voltage appears across the inductor. That leaves less voltage across the bulb, so it glows less.
  check: none

