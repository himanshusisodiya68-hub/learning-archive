- id: ncert12-ex-7-4
  lvl: ncert-ex
  num: "XII 7.4"
  source: NCERT XII Physics · Ch 7 · Exercise 7.4
  kind: num
  q: A 60 µF capacitor is connected to a 110 V, 60 Hz ac supply. Determine the rms value of the current in the circuit.
  ask: rms current
  unit: A
  ans: 2.49
  tol: 0.01
  verify: 110*2*Math.PI*60*60e-6
  sol: $X_C = \dfrac{1}{2\pi\nu C} = \dfrac{1}{2\pi\times60\times60\times10^{-6}} = 44.2\ \Omega$, so $I_{rms} = 110/44.2 = 2.49$ A.
