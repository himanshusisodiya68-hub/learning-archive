- id: ncert12-ex-7-5
  lvl: ncert-ex
  num: "XII 7.5"
  source: NCERT XII Physics · Ch 7 · Exercise 7.5
  kind: text
  q: In Exercises 7.3 and 7.4, what is the net power absorbed by each circuit over a complete cycle. Explain your answer.
  sol: |
    **Zero in each case.** In a pure inductor or a pure capacitor the current and the voltage are $90^\circ$ out of phase, so the average power $P = VI\cos\phi = VI\cos90^\circ = 0$. Energy is stored in the field during one quarter of the cycle and returned to the source in the next, so there is no net absorption over a full cycle.
  answer_key: Zero in each case.
  check: ncert-key

- id: f1
  lvl: found
  kind: mcq
  q: In a purely capacitive AC circuit, the current
  opts: ["leads the voltage by π/2", "lags the voltage by π/2", "is in phase with the voltage", "is zero"]
  ans: 0
  sol: |
    $q = Cv$, so $i = dq/dt = C\,dv/dt$: the current is maximum when $v$ passes through zero, a quarter cycle before $v$ peaks. It leads by $\pi/2$.
  check: none

