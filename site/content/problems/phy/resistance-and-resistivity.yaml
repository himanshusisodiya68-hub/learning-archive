# Resistance and resistivity. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 11, §11.5. Found, board and main problems are original.

- id: ncert-it11-5-1
  lvl: ncert-intext
  num: "§11.5 Q1"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q1
  kind: text
  q: On what factors does the resistance of a conductor depend?
  sol: |
    It depends on (i) its **length** $l$ (directly proportional), (ii) its **area of cross-section** $A$ (inversely proportional) and (iii) the **nature of its material**, through the resistivity $\rho$: $R = \rho\,l/A$. It also varies with temperature.
  check: none

- id: ncert-it11-5-2
  lvl: ncert-intext
  num: "§11.5 Q2"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q2
  kind: text
  q: Will current flow more easily through a thick wire or a thin wire of the same material, when connected to the same source? Why?
  sol: |
    Through the **thick wire**. For the same material and length, $R = \rho l/A$ is smaller when the area $A$ is larger. With the same potential difference, $I = V/R$ is then larger, so current flows more easily.
  check: none

- id: ncert-it11-5-3
  lvl: ncert-intext
  num: "§11.5 Q3"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q3
  kind: text
  q: Let the resistance of an electrical component remains constant while the potential difference across the two ends of the component decreases to half of its former value. What change will occur in the current through it?
  sol: |
    With $R$ constant, $I = V/R$ is proportional to $V$. If $V$ becomes $V/2$, the current also becomes **half** of its former value.
  check: none

- id: ncert-it11-5-4
  lvl: ncert-intext
  num: "§11.5 Q4"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q4
  kind: text
  q: Why are coils of electric toasters and electric irons made of an alloy rather than a pure metal?
  sol: |
    The resistivity of an alloy is generally higher than that of its constituent metals, so a short length of alloy wire gives enough resistance to produce a large amount of heat. Alloys also do not oxidise (burn) readily at high temperatures, so the coil lasts a long time at red heat.
  check: none

- id: ncert-it11-5-5
  lvl: ncert-intext
  num: "§11.5 Q5"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q5
  kind: text
  q: |-
    Use the data in Table 11.2 to answer the following –
    (a) Which among iron and mercury is a better conductor?
    (b) Which material is the best conductor?
  sol: |
    From Table 11.2: iron $10.0\times10^{-8}\ \Omega\,\text{m}$, mercury $94.0\times10^{-8}\ \Omega\,\text{m}$, silver $1.60\times10^{-8}\ \Omega\,\text{m}$.

    (a) **Iron** is the better conductor, because its resistivity is lower than mercury's.

    (b) **Silver** is the best conductor in the table, since it has the lowest resistivity.
  check: none

- id: ncert-eg11-5
  lvl: ncert-intext
  num: "Ex 11.5"
  source: NCERT X Science · Ch 11 · Example 11.5
  kind: num
  q: Resistance of a metal wire of length 1 m is 26 Ω at 20°C. If the diameter of the wire is 0.3 mm, what will be the resistivity of the metal at that temperature? Using Table 11.2, predict the material of the wire.
  ask: Resistivity
  unit: Ω m
  ans: 1.84e-6
  tol: 5e-9
  verify: 26*Math.PI*(0.3e-3)**2/(4*1)
  sol: |
    $R = 26\ \Omega$, $d = 0.3\ \text{mm} = 3\times10^{-4}$ m, $l = 1$ m. The area is $A = \pi d^2/4$, so

    $$\rho = \frac{RA}{l} = \frac{R\pi d^2}{4l} = \frac{26\times3.14\times(3\times10^{-4})^2}{4\times1} \approx 1.84\times10^{-6}\ \Omega\,\text{m}.$$

    In Table 11.2 this is the resistivity of **manganese**, so the wire is probably manganese.
  check: code

- id: ncert-eg11-6
  lvl: ncert-intext
  num: "Ex 11.6"
  source: NCERT X Science · Ch 11 · Example 11.6
  kind: num
  q: A wire of given material having length l and area of cross-section A has a resistance of 4 Ω. What would be the resistance of another wire of the same material having length l/2 and area of cross-section 2A?
  ask: New resistance
  unit: Ω
  ans: 1
  tol: 0.001
  verify: 4*(0.5)/2
  sol: |
    $R_1 = \rho l/A = 4\ \Omega$. For the second wire $R_2 = \rho\,(l/2)/(2A) = \tfrac14\rho l/A = \tfrac14 R_1 = 1\ \Omega$. Halving the length halves $R$; doubling the area halves it again.
  check: code

- id: ncert-ex11-6
  lvl: ncert-ex
  num: 6
  source: NCERT X Science · Ch 11 · Exercise 6
  kind: num
  q: A copper wire has diameter 0.5 mm and resistivity of 1.6 × 10⁻⁸ Ω m. What will be the length of this wire to make its resistance 10 Ω? How much does the resistance change if the diameter is doubled?
  ask: Length of the wire
  unit: m
  ans: 122.7
  tol: 0.1
  verify: 10*Math.PI*(0.5e-3)**2/4/1.6e-8
  sol: |
    $d = 0.5$ mm, so $A = \pi d^2/4 = 3.14\times(0.5\times10^{-3})^2/4 = 1.96\times10^{-7}\ \text{m}^2$. From $R = \rho l/A$,

    $$l = \frac{RA}{\rho} = \frac{10\times1.96\times10^{-7}}{1.6\times10^{-8}} \approx 122.7\ \text{m}.$$

    Doubling the diameter multiplies the area by 4, so the resistance falls to one quarter: from 10 Ω to 2.5 Ω (a decrease of 7.5 Ω).
  answer_key: 122.7 m; ¼ times
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: A wire has resistance R. Another wire of the same material and area, but twice the length, has resistance
  opts: ["R/2", "R", "2R", "4R"]
  ans: 2
  sol: Resistance is proportional to length, $R = \rho l/A$. Doubling $l$ doubles $R$.
  check: none

- id: f2
  lvl: found
  kind: num
  q: A copper wire is 100 m long and has a cross-sectional area of 1 mm². Taking the resistivity of copper as 1.6 × 10⁻⁸ Ω m, find its resistance. (Original problem.)
  ask: Resistance
  unit: Ω
  ans: 1.6
  tol: 0.005
  verify: 1.6e-8*100/1e-6
  sol: $A = 1\ \text{mm}^2 = 10^{-6}\ \text{m}^2$, so $R = \rho l/A = 1.6\times10^{-8}\times100/10^{-6} = 1.6\ \Omega$.
  check: code

- id: b1
  lvl: board
  kind: num
  q: A wire of resistance 5 Ω is stretched uniformly to three times its original length. What is its new resistance? (Original problem.)
  ask: New resistance
  unit: Ω
  ans: 45
  tol: 0.01
  verify: 5*9
  sol: |
    The volume $Al$ stays constant. If $l \to 3l$, then $A \to A/3$, so $R = \rho l/A \to \rho(3l)/(A/3) = 9R = 45\ \Omega$.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A nichrome wire of resistivity 100 × 10⁻⁶ Ω m is 2 m long and 0.4 mm in diameter. Find its resistance. (Original problem.)
  ask: Resistance
  unit: Ω
  ans: 1591.5
  tol: 0.5
  verify: 100e-6*2/(Math.PI*(0.2e-3)**2)
  sol: |
    $A = \pi r^2 = \pi(0.2\times10^{-3})^2 = 1.257\times10^{-7}\ \text{m}^2$, so $R = \rho l/A = 10^{-4}\times2/(1.257\times10^{-7}) \approx 1.59\times10^{3}\ \Omega$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A uniform wire is stretched so that its length increases by 10%, its volume remaining constant. By what percentage does its resistance increase? (Original problem.)
  ask: Percentage increase in R
  unit: "%"
  ans: 21
  tol: 0.01
  verify: (1.1**2-1)*100
  sol: |
    Constant volume gives $A \to A/1.1$ when $l \to 1.1\,l$, so $R \to \rho(1.1\,l)/(A/1.1) = 1.21R$. The increase is 21%.
  check: code

- id: m2
  lvl: main
  kind: num
  q: The resistance of a copper wire is given by $R = R_0[1 + \alpha(T - T_0)]$ with $\alpha = 4\times10^{-3}\ \text{K}^{-1}$. A coil of this wire has $R = 10\ \Omega$ at $20\,^\circ$C. Find its resistance at $70\,^\circ$C. (Original problem; the value of $\alpha$ is given, not taken from NCERT.)
  ask: Resistance
  unit: Ω
  ans: 12
  tol: 0.01
  verify: 10*(1+4e-3*50)
  sol: $R = 10[1 + 4\times10^{-3}\times50] = 10\times1.2 = 12\ \Omega$. Resistance of metals rises with temperature because the lattice ions vibrate more and scatter the electrons more often.
  check: code
