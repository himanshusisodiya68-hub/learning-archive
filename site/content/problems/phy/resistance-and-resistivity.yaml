# Resistance and resistivity. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 11, §11.5. Found, board and main problems are original.

- id: ncert-it11-5-1
  lvl: ncert-intext
  num: "§11.5 Q1"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q1
  kind: text
  q: On what factors does the resistance of a conductor depend?
  sol: |
    It depends on (i) its **length** $l$ (directly proportional), (ii) its **area of cross-section** $A$ (inversely proportional) and (iii) the **nature of its material**, through the resistivity $\rho$: $R = \rho\,l/A$. It also varies with temperature.
  check: none

- id: ncert-it11-5-2
  lvl: ncert-intext
  num: "§11.5 Q2"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q2
  kind: text
  q: Will current flow more easily through a thick wire or a thin wire of the same material, when connected to the same source? Why?
  sol: |
    Through the **thick wire**. For the same material and length, $R = \rho l/A$ is smaller when the area $A$ is larger. With the same potential difference, $I = V/R$ is then larger, so current flows more easily.
  check: none

- id: ncert-it11-5-3
  lvl: ncert-intext
  num: "§11.5 Q3"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q3
  kind: text
  q: Let the resistance of an electrical component remains constant while the potential difference across the two ends of the component decreases to half of its former value. What change will occur in the current through it?
  sol: |
    With $R$ constant, $I = V/R$ is proportional to $V$. If $V$ becomes $V/2$, the current also becomes **half** of its former value.
  check: none

- id: ncert-it11-5-4
  lvl: ncert-intext
  num: "§11.5 Q4"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q4
  kind: text
  q: Why are coils of electric toasters and electric irons made of an alloy rather than a pure metal?
  sol: |
    The resistivity of an alloy is generally higher than that of its constituent metals, so a short length of alloy wire gives enough resistance to produce a large amount of heat. Alloys also do not oxidise (burn) readily at high temperatures, so the coil lasts a long time at red heat.
  check: none

- id: ncert-it11-5-5
  lvl: ncert-intext
  num: "§11.5 Q5"
  source: NCERT X Science · Ch 11 · In-text questions after §11.5 · Q5
  kind: text
  q: |-
    Use the data in Table 11.2 to answer the following –
    (a) Which among iron and mercury is a better conductor?
    (b) Which material is the best conductor?
  sol: |
    From Table 11.2: iron $10.0\times10^{-8}\ \Omega\,\text{m}$, mercury $94.0\times10^{-8}\ \Omega\,\text{m}$, silver $1.60\times10^{-8}\ \Omega\,\text{m}$.

    (a) **Iron** is the better conductor, because its resistivity is lower than mercury's.

    (b) **Silver** is the best conductor in the table, since it has the lowest resistivity.
  check: none

- id: ncert-eg11-5
  lvl: ncert-intext
  num: "Ex 11.5"
  source: NCERT X Science · Ch 11 · Example 11.5
  kind: num
  q: Resistance of a metal wire of length 1 m is 26 Ω at 20°C. If the diameter of the wire is 0.3 mm, what will be the resistivity of the metal at that temperature? Using Table 11.2, predict the material of the wire.
  ask: Resistivity
  unit: Ω m
  ans: 1.84e-6
  tol: 5e-9
  verify: 26*Math.PI*(0.3e-3)**2/(4*1)
  sol: |
    $R = 26\ \Omega$, $d = 0.3\ \text{mm} = 3\times10^{-4}$ m, $l = 1$ m. The area is $A = \pi d^2/4$, so

    $$\rho = \frac{RA}{l} = \frac{R\pi d^2}{4l} = \frac{26\times3.14\times(3\times10^{-4})^2}{4\times1} \approx 1.84\times10^{-6}\ \Omega\,\text{m}.$$

    In Table 11.2 this is the resistivity of **manganese**, so the wire is probably manganese.
  check: code

- id: ncert-eg11-6
  lvl: ncert-intext
  num: "Ex 11.6"
  source: NCERT X Science · Ch 11 · Example 11.6
  kind: num
  q: A wire of given material having length l and area of cross-section A has a resistance of 4 Ω. What would be the resistance of another wire of the same material having length l/2 and area of cross-section 2A?
  ask: New resistance
  unit: Ω
  ans: 1
  tol: 0.001
  verify: 4*(0.5)/2
  sol: |
    $R_1 = \rho l/A = 4\ \Omega$. For the second wire $R_2 = \rho\,(l/2)/(2A) = \tfrac14\rho l/A = \tfrac14 R_1 = 1\ \Omega$. Halving the length halves $R$; doubling the area halves it again.
  check: code

- id: ncert-ex11-6
  lvl: ncert-ex
  num: 6
  source: NCERT X Science · Ch 11 · Exercise 6
  kind: num
  q: A copper wire has diameter 0.5 mm and resistivity of 1.6 × 10⁻⁸ Ω m. What will be the length of this wire to make its resistance 10 Ω? How much does the resistance change if the diameter is doubled?
  ask: Length of the wire
  unit: m
  ans: 122.7
  tol: 0.1
  verify: 10*Math.PI*(0.5e-3)**2/4/1.6e-8
  sol: |
    $d = 0.5$ mm, so $A = \pi d^2/4 = 3.14\times(0.5\times10^{-3})^2/4 = 1.96\times10^{-7}\ \text{m}^2$. From $R = \rho l/A$,

    $$l = \frac{RA}{\rho} = \frac{10\times1.96\times10^{-7}}{1.6\times10^{-8}} \approx 122.7\ \text{m}.$$

    Doubling the diameter multiplies the area by 4, so the resistance falls to one quarter: from 10 Ω to 2.5 Ω (a decrease of 7.5 Ω).
  answer_key: 122.7 m; ¼ times
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: A wire has resistance R. Another wire of the same material and area, but twice the length, has resistance
  opts: ["R/2", "R", "2R", "4R"]
  ans: 2
  sol: Resistance is proportional to length, $R = \rho l/A$. Doubling $l$ doubles $R$.
  check: none

- id: f2
  lvl: found
  kind: num
  q: A copper wire is 100 m long and has a cross-sectional area of 1 mm². Taking the resistivity of copper as 1.6 × 10⁻⁸ Ω m, find its resistance. (Original problem.)
  ask: Resistance
  unit: Ω
  ans: 1.6
  tol: 0.005
  verify: 1.6e-8*100/1e-6
  sol: $A = 1\ \text{mm}^2 = 10^{-6}\ \text{m}^2$, so $R = \rho l/A = 1.6\times10^{-8}\times100/10^{-6} = 1.6\ \Omega$.
  check: code

- id: b1
  lvl: board
  kind: num
  q: A wire of resistance 5 Ω is stretched uniformly to three times its original length. What is its new resistance? (Original problem.)
  ask: New resistance
  unit: Ω
  ans: 45
  tol: 0.01
  verify: 5*9
  sol: |
    The volume $Al$ stays constant. If $l \to 3l$, then $A \to A/3$, so $R = \rho l/A \to \rho(3l)/(A/3) = 9R = 45\ \Omega$.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A nichrome wire of resistivity 100 × 10⁻⁶ Ω m is 2 m long and 0.4 mm in diameter. Find its resistance. (Original problem.)
  ask: Resistance
  unit: Ω
  ans: 1591.5
  tol: 0.5
  verify: 100e-6*2/(Math.PI*(0.2e-3)**2)
  sol: |
    $A = \pi r^2 = \pi(0.2\times10^{-3})^2 = 1.257\times10^{-7}\ \text{m}^2$, so $R = \rho l/A = 10^{-4}\times2/(1.257\times10^{-7}) \approx 1.59\times10^{3}\ \Omega$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A uniform wire is stretched so that its length increases by 10%, its volume remaining constant. By what percentage does its resistance increase? (Original problem.)
  ask: Percentage increase in R
  unit: "%"
  ans: 21
  tol: 0.01
  verify: (1.1**2-1)*100
  sol: |
    Constant volume gives $A \to A/1.1$ when $l \to 1.1\,l$, so $R \to \rho(1.1\,l)/(A/1.1) = 1.21R$. The increase is 21%.
  check: code

- id: m2
  lvl: main
  kind: num
  q: The resistance of a copper wire is given by $R = R_0[1 + \alpha(T - T_0)]$ with $\alpha = 4\times10^{-3}\ \text{K}^{-1}$. A coil of this wire has $R = 10\ \Omega$ at $20\,{}^\circ$C. Find its resistance at $70\,{}^\circ$C. (Original problem; the value of $\alpha$ is given, not taken from NCERT.)
  ask: Resistance
  unit: Ω
  ans: 12
  tol: 0.01
  verify: 10*(1+4e-3*50)
  sol: $R = 10[1 + 4\times10^{-3}\times50] = 10\times1.2 = 12\ \Omega$. Resistance of metals rises with temperature because the lattice ions vibrate more and scatter the electrons more often.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A copper wire (resistivity 1.7 × 10⁻⁸ Ω m) is 2.0 m long and tapers uniformly from a radius of 0.50 mm at one end to 1.0 mm at the other. Find its resistance in milliohm. (Original problem.)
  ask: Resistance
  unit: mΩ
  ans: 21.6
  tol: 0.1
  verify: 1.7e-8*2/(Math.PI*0.5e-3*1e-3)*1e3
  sol: |
    Slice the wire into discs of thickness $dx$. With $r = a + (b-a)x/L$, $dx = L\,dr/(b-a)$ and

    $$R = \int_a^b \frac{\rho}{\pi r^2}\frac{L\,dr}{b-a} = \frac{\rho L}{\pi a b} = \frac{1.7\times10^{-8}\times2.0}{\pi\times0.50\times10^{-3}\times1.0\times10^{-3}} = 2.16\times10^{-2}\ \Omega.$$

    That is about 21.6 mΩ. Check: the answer equals a uniform wire of radius $\sqrt{ab} = 0.707$ mm.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A carbon resistor (temperature coefficient −5.0 × 10⁻⁴ K⁻¹) is connected in series with a copper coil (temperature coefficient 4.0 × 10⁻³ K⁻¹). The total resistance is 100 Ω and, to first order, does not change with temperature. Find the resistance of the copper coil. (Original problem.)
  ask: Resistance of the copper coil
  unit: Ω
  ans: 11.1
  tol: 0.05
  verify: 100/(1+4e-3/5e-4)
  sol: |
    Total $= R_c(1 + \alpha_c\Delta T) + R_{cu}(1 + \alpha_{cu}\Delta T)$. The $\Delta T$ term vanishes when $R_c\alpha_c + R_{cu}\alpha_{cu} = 0$, so $R_c = R_{cu}\,\alpha_{cu}/|\alpha_c| = 8R_{cu}$.

    Then $9R_{cu} = 100\ \Omega$, giving $R_{cu} = 11.1\ \Omega$ and $R_c = 88.9\ \Omega$.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: The tungsten filament of a lamp rated 100 W, 220 V has a resistance of 40 Ω at 20 °C. Assuming the linear law R = R₀[1 + α(T − 20 °C)] with α = 4.5 × 10⁻³ K⁻¹ holds all the way, estimate the filament temperature when the lamp works at its rating. (Original problem.)
  ask: Filament temperature
  unit: °C
  ans: 2487
  tol: 2
  verify: 20+(220**2/100/40-1)/4.5e-3
  sol: |
    At its rating the hot resistance is $R = V^2/P = 220^2/100 = 484\ \Omega$. Then

    $$1 + \alpha\Delta T = \frac{484}{40} = 12.1 \;\Rightarrow\; \Delta T = \frac{11.1}{4.5\times10^{-3}} = 2467\ \text{K},$$

    so $T \approx 2487\,{}^\circ$C. This is only an estimate: tungsten's resistivity is not exactly linear over so wide a range. The answer is reasonable for a filament, well below tungsten's melting point (about 3400 °C).
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A coaxial cable 10 m long has a core of radius 1.0 mm and a metal sheath of inner radius 5.0 mm. The space between them is filled with insulation of resistivity 1.0 × 10¹³ Ω m. Find the leakage resistance between core and sheath, in gigaohm. (Original problem.)
  ask: Leakage resistance
  unit: GΩ
  ans: 256
  tol: 1
  verify: 1e13*Math.log(5)/(2*Math.PI*10)/1e9
  sol: |
    Leakage current flows radially. A cylindrical shell of radius $r$, thickness $dr$ and length $L$ has resistance $\rho\,dr/(2\pi r L)$, and the shells are in series:

    $$R = \frac{\rho}{2\pi L}\ln\frac{b}{a} = \frac{1.0\times10^{13}\times\ln 5}{2\pi\times10} = \frac{1.609\times10^{13}}{62.83} = 2.56\times10^{11}\ \Omega \approx 256\ \text{G}\Omega.$$
  check: code

- id: o2
  lvl: oly
  kind: num
  q: An earthing electrode is a metal hemisphere of radius 0.50 m buried flat side up, level with the ground surface, in soil of uniform resistivity 100 Ω m. Find the resistance between the electrode and a very distant point in the soil. (Original problem.)
  ask: Earth resistance
  unit: Ω
  ans: 31.8
  tol: 0.1
  verify: 100/(2*Math.PI*0.5)
  sol: |
    Current spreads radially into the soil. A hemispherical shell of radius $r$ and thickness $dr$ has area $2\pi r^2$, so

    $$R = \int_a^\infty \frac{\rho\,dr}{2\pi r^2} = \frac{\rho}{2\pi a} = \frac{100}{2\pi\times0.50} = 31.8\ \Omega.$$

    Half of this ($\int_a^{2a}$) lies in the first 0.5 m of soil around the electrode, which is why improving the soil right next to an earth electrode helps so much.
  check: code

- id: o3
  lvl: oly
  kind: num
  q: A rod of length 1.0 m and uniform cross-section 1.0 mm² is made of a graded material whose conductivity rises linearly from 1.0 × 10⁶ S/m at one end to 2.0 × 10⁶ S/m at the other. Find the resistance between the ends. (Original problem.)
  ask: Resistance
  unit: Ω
  ans: 0.693
  tol: 0.002
  verify: 1/(1e6*1e-6)*Math.log(2)
  sol: |
    Write $\sigma(x) = \sigma_0(1 + x/L)$ with $\sigma_0 = 1.0\times10^6$ S/m. Slices are in series, each with $dR = dx/(\sigma A)$:

    $$R = \int_0^L \frac{dx}{\sigma_0 A(1 + x/L)} = \frac{L}{\sigma_0 A}\ln 2 = \frac{1.0}{10^6\times10^{-6}}\times0.693 = 0.693\ \Omega.$$

    Check: it lies between the values for uniform rods of the two end conductivities (1.0 Ω and 0.5 Ω), and below the 0.75 Ω you would get by averaging the resistivities naively.
  check: code

- id: o4
  lvl: oly
  kind: num
  q: Aluminium has resistivity 2.65 × 10⁻⁸ Ω m and 1.81 × 10²⁹ free electrons per cubic metre (three per atom). Using the free-electron model, estimate the mean time between collisions, in units of 10⁻¹⁵ s. Take m = 9.11 × 10⁻³¹ kg and e = 1.60 × 10⁻¹⁹ C. (Original problem.)
  ask: Mean free time
  unit: × 10⁻¹⁵ s
  ans: 7.42
  tol: 0.05
  verify: 9.11e-31/(1.81e29*(1.60e-19)**2*2.65e-8)/1e-15
  sol: |
    From $v_d = eE\tau/m$ and $J = nev_d$, $\rho = m/(ne^2\tau)$, so

    $$\tau = \frac{m}{ne^2\rho} = \frac{9.11\times10^{-31}}{1.81\times10^{29}\times(1.60\times10^{-19})^2\times2.65\times10^{-8}} = \frac{9.11\times10^{-31}}{1.228\times10^{-16}} \approx 7.42\times10^{-15}\ \text{s}.$$

    This is about three times shorter than for copper, even though aluminium's resistivity is only 1.6 times higher, because aluminium has more free electrons per unit volume.
  check: code

- id: ncert12-eg-3-3
  lvl: ncert-intext
  num: "XII Ex 3.3"
  source: NCERT XII Physics · Ch 3 · Example 3.3
  kind: num
  q: An electric toaster uses nichrome for its heating element. When a negligibly small current passes through it, its resistance at room temperature (27.0 °C) is found to be 75.3 Ω. When the toaster is connected to a 230 V supply, the current settles, after a few seconds, to a steady value of 2.68 A. What is the steady temperature of the nichrome element? The temperature coefficient of resistance of nichrome averaged over the temperature range involved, is 1.70 × 10⁻⁴ °C⁻¹.
  ask: Steady temperature
  unit: °C
  ans: 847
  tol: 1
  verify: 27+(85.8-75.3)/(75.3*1.7e-4)
  sol: |
    With a negligible current the element is at room temperature, $T_1 = 27.0\,{}^\circ$C, $R_1 = 75.3\ \Omega$. At the steady state $R_2 = 230/2.68 = 85.8\ \Omega$. From $R_2 = R_1[1 + \alpha(T_2 - T_1)]$,

    $$T_2 - T_1 = \frac{85.8 - 75.3}{75.3\times1.70\times10^{-4}} = 820\,{}^\circ\text{C},\qquad T_2 = 847\,{}^\circ\text{C}.$$

    At this temperature the heat produced equals the heat lost to the surroundings.

    [Inference] Using the unrounded $R_2 = 85.82\ \Omega$ gives about 849 °C; the book's 847 °C comes from rounding $R_2$ to 85.8 Ω first.
  check: code

- id: ncert12-eg-3-4
  lvl: ncert-intext
  num: "XII Ex 3.4"
  source: NCERT XII Physics · Ch 3 · Example 3.4
  kind: num
  q: The resistance of the platinum wire of a platinum resistance thermometer at the ice point is 5 Ω and at steam point is 5.23 Ω. When the thermometer is inserted in a hot bath, the resistance of the platinum wire is 5.795 Ω. Calculate the temperature of the bath.
  ask: Temperature of the bath
  unit: °C
  ans: 345.65
  tol: 0.01
  verify: (5.795-5)/(5.23-5)*100
  sol: |
    $R_0 = 5\ \Omega$, $R_{100} = 5.23\ \Omega$, $R_t = 5.795\ \Omega$. With $R_t = R_0(1 + \alpha t)$ the resistance is linear in $t$, so

    $$t = \frac{R_t - R_0}{R_{100} - R_0}\times100 = \frac{5.795 - 5}{5.23 - 5}\times100 = \frac{0.795}{0.23}\times100 = 345.65\,{}^\circ\text{C}.$$
  check: code

- id: ncert12-ex-3-3
  lvl: ncert-ex
  num: "XII 3.3"
  source: NCERT XII Physics · Ch 3 · Exercise 3.3
  kind: num
  q: At room temperature (27.0 °C) the resistance of a heating element is 100 Ω. What is the temperature of the element if the resistance is found to be 117 Ω, given that the temperature coefficient of the material of the resistor is 1.70 × 10⁻⁴ °C⁻¹.
  ask: Temperature
  unit: °C
  ans: 1027
  tol: 1
  verify: 27+(117-100)/(100*1.7e-4)
  sol: |
    $R_2 = R_1[1 + \alpha(T_2 - T_1)]$ gives $T_2 - T_1 = \dfrac{117 - 100}{100\times1.70\times10^{-4}} = 1000\,{}^\circ$C, so $T_2 = 1027\,{}^\circ$C.
  answer_key: 1027 °C
  check: both

- id: ncert12-ex-3-4
  lvl: ncert-ex
  num: "XII 3.4"
  source: NCERT XII Physics · Ch 3 · Exercise 3.4
  kind: num
  q: A negligibly small current is passed through a wire of length 15 m and uniform cross-section 6.0 × 10⁻⁷ m², and its resistance is measured to be 5.0 Ω. What is the resistivity of the material at the temperature of the experiment?
  ask: Resistivity
  unit: Ω m
  ans: 2.0e-7
  tol: 1e-9
  verify: 5.0*6.0e-7/15
  sol: $\rho = \dfrac{RA}{l} = \dfrac{5.0\times6.0\times10^{-7}}{15} = 2.0\times10^{-7}\ \Omega\,\text{m}$.
  answer_key: 2.0 × 10⁻⁷ Ω m
  check: both

- id: ncert12-ex-3-5
  lvl: ncert-ex
  num: "XII 3.5"
  source: NCERT XII Physics · Ch 3 · Exercise 3.5
  kind: num
  q: A silver wire has a resistance of 2.1 Ω at 27.5 °C, and a resistance of 2.7 Ω at 100 °C. Determine the temperature coefficient of resistivity of silver.
  ask: Temperature coefficient
  unit: "°C⁻¹"
  ans: 0.0039
  tol: 0.0001
  verify: (2.7/2.1-1)/(100-27.5)
  sol: |
    Taking $R_1 = 2.1\ \Omega$ at $T_1 = 27.5\,{}^\circ$C and $R_2 = 2.7\ \Omega$ at $T_2 = 100\,{}^\circ$C, $R_2 = R_1[1 + \alpha(T_2 - T_1)]$ gives

    $$\alpha = \frac{R_2/R_1 - 1}{T_2 - T_1} = \frac{0.6/2.1}{72.5} = 3.9\times10^{-3}\ {}^\circ\text{C}^{-1}.$$
  answer_key: 0.0039 °C⁻¹
  check: both

- id: ncert12-ex-3-6
  lvl: ncert-ex
  num: "XII 3.6"
  source: NCERT XII Physics · Ch 3 · Exercise 3.6
  kind: num
  q: A heating element using nichrome connected to a 230 V supply draws an initial current of 3.2 A which settles after a few seconds to a steady value of 2.8 A. What is the steady temperature of the heating element if the room temperature is 27.0 °C? Temperature coefficient of resistance of nichrome averaged over the temperature range involved is 1.70 × 10⁻⁴ °C⁻¹.
  ask: Steady temperature
  unit: °C
  ans: 867
  tol: 1
  verify: 27+(230/2.8-230/3.2)/((230/3.2)*1.7e-4)
  sol: |
    The initial current flows while the element is still at room temperature: $R_1 = 230/3.2 = 71.9\ \Omega$ at 27.0 °C. At the steady state $R_2 = 230/2.8 = 82.1\ \Omega$. Then

    $$T_2 - T_1 = \frac{R_2 - R_1}{R_1\alpha} = \frac{82.1 - 71.9}{71.9\times1.70\times10^{-4}} \approx 840\,{}^\circ\text{C},\qquad T_2 \approx 867\,{}^\circ\text{C}.$$
  answer_key: 867 °C
  check: both
