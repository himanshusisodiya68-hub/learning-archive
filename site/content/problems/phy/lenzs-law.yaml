- id: b1
  lvl: board
  kind: text
  q: A magnet is dropped through a long vertical copper tube and falls much more slowly than through a plastic tube of the same size. Explain. (Original problem.)
  sol: |
    As the magnet falls, the flux through each ring of the tube changes, so eddy currents are induced in the copper. By Lenz's law these currents oppose the motion of the magnet: they create a force on it directed upward. The magnet reaches a small terminal speed at which the retarding force equals the weight. The mechanical energy is dissipated as heat in the tube. A plastic tube has no conduction, so no currents and no retarding force.
  check: none

- id: b2
  lvl: board
  kind: text
  q: A loop in the plane of the page is in a uniform field directed out of the page and the field is decreasing. In which sense does the induced current flow? (Original problem.)
  sol: |
    The outward flux decreases, so the induced current must produce a field out of the page (supporting the field). By the right-hand rule that requires an **anticlockwise** current as seen from the viewer.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A conducting ring of radius 5 cm and resistance 0.2 Ω is in a field of 0.4 T perpendicular to its plane that falls to zero in 0.1 s at a steady rate. What is the induced current? (Original problem.)
  ask: Induced current
  unit: A
  ans: 0.157
  tol: 0.001
