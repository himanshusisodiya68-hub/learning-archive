- id: m2
  lvl: main
  kind: text
  q: A magnet falls through a copper tube at terminal speed. Where does the lost gravitational potential energy go, and why does the terminal speed rise if the wall of the tube is made thinner? (Original problem.)
  sol: |
    The energy goes into Joule heating of the induced currents in the tube: at terminal speed the power $mgv$ equals the heat produced. A thinner wall has a larger resistance for the induced currents, so the currents and the retarding force are smaller for a given speed, and a larger speed is needed before the retarding force balances the weight.
  check: none

- id: a1
  lvl: adv
  kind: num
  q: A square wire loop of side 10 cm, mass 50 g and resistance 0.02 Ω slides without friction on a horizontal table at 2.0 m/s towards a region of uniform vertical magnetic field 0.5 T with a straight boundary parallel to its leading edge. Find its speed once it is completely inside the field. Ignore the loop's self-inductance. (Original problem.)
  ask: Speed when fully inside
  unit: m/s
  ans: 1.75
  tol: 0.005
  verify: 2.0-0.5**2*0.1**3/(0.05*0.02)
  hints: ["Write m dv/dt = −B²L²v/R and change the variable to x using dv/dt = v dv/dx."]
  sol: |
    While the loop enters, $\varepsilon = BLv$, $I = BLv/R$, and the force on the leading edge (by Lenz's law, against the motion) is $F = ILB = B^2L^2v/R$. So
    $$m\,v\frac{dv}{dx} = -\frac{B^2L^2v}{R}\quad\Rightarrow\quad \frac{dv}{dx} = -\frac{B^2L^2}{mR}.$$
    The speed falls linearly with distance. Over the full entry, $x = L$:
    $$\Delta v = \frac{B^2L^3}{mR} = \frac{0.25\times10^{-3}}{0.05\times0.02} = 0.25\ \text{m/s},$$
    so $v = 2.0 - 0.25 = 1.75$ m/s. Once fully inside, the flux is constant and the loop coasts at 1.75 m/s. The kinetic energy lost, $\tfrac12(0.05)(2.0^2-1.75^2) \approx 0.023$ J, is the Joule heat.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A square loop of side 10 cm, mass 20 g and resistance 0.5 Ω hangs in a vertical plane with its lower edge horizontal. Below a horizontal line there is a uniform horizontal magnetic field of 1.0 T perpendicular to the loop; above the line there is no field. The loop is released from rest above the line and falls into the field. If the field region were tall enough and the loop large enough that its upper edge stayed outside the field for a long time, what terminal speed would the loop approach? (g = 9.8 m/s²) (Original problem.)
  ask: Terminal speed
  unit: m/s
  ans: 9.8
  tol: 0.05
  verify: 0.02*9.8*0.5/(1.0**2*0.1**2)
  sol: |
    While the lower edge is in the field and the upper edge outside, the flux increases at the rate $BLv$. The induced current $I = BLv/R$ flows so as to oppose the increase, and the force on the lower edge is $ILB = B^2L^2v/R$ upward. Terminal speed when this equals the weight:
    $$v_t = \frac{mgR}{B^2L^2} = \frac{0.02\times9.8\times0.5}{1.0\times0.01} = 9.8\ \text{m/s}.$$
    [Inference] With the loop only 10 cm tall, the loop would in practice be entirely inside the field long before reaching this speed (it falls freely once fully inside), so 9.8 m/s is the limiting speed of the model, not one actually reached by this loop.
  check: code

- id: a3
  lvl: adv
  kind: mcq
  q: A long bar magnet is held vertically. A horizontal copper ring is released from rest above it and falls along the axis, down over the magnet and off the bottom. Which statement about the ring's acceleration a is correct? (Original problem.)
  opts: ["a < g throughout the fall", "a < g above and below the middle of the magnet, a = g at the instant the ring passes the middle", "a > g while leaving the magnet, because the ring is attracted back", "a = g throughout, because the magnet is fixed"]
  ans: 1
  sol: |
    Whenever the flux through the ring is changing, the induced current opposes the relative motion, so the magnetic force on the falling ring is upward and $a < g$. That holds both while the flux rises (approaching the magnet) and while it falls (leaving). Near the middle of a long magnet the flux through the ring passes through its maximum, so $d\Phi/dt = 0$ there for an instant: no current, no force and $a = g$. Option (c) confuses the direction: the ring "attracts the magnet back" means the force on the ring is upward, still slowing it.
  check: none

- id: a4
  lvl: adv
  kind: text
  q: Two identical circular coils are mounted coaxially, a few centimetres apart, and the second coil is free to slide along the axis. A steady current flows in the first coil and the second coil is closed through a resistor. Describe the force on the second coil (a) when the current in the first coil is switched on, (b) while it is steady, (c) when it is switched off, and (d) when the steady first coil is pushed towards the second. (Original problem.)
  sol: |
    (a) **Repulsion.** The flux through the second coil rises, so its induced current circulates opposite to the first coil's current. Antiparallel currents repel.

    (b) **No force.** The flux through the second coil is constant, so it carries no current.

    (c) **Attraction.** The flux falls; the induced current circulates the same way as the first coil's, to keep the flux. Parallel currents attract.

    (d) **Repulsion.** Moving closer raises the flux through the second coil; the induced current opposes the increase and so opposes the approach. In general the induced force always opposes the relative motion or change that causes it.
  check: none

- id: o1
  lvl: oly
  kind: num
  q: A small magnet of mass 7.5 g, modelled as a point magnetic dipole of moment 1.0 A m² pointing along the axis, falls down the axis of a long vertical copper pipe of mean radius 8.0 mm and wall thickness 1.5 mm (conductivity 5.9 × 10⁷ S/m). Treat the wall as a stack of independent thin rings and neglect their self-inductance. Find the terminal speed. (g = 9.8 m/s², μ₀ = 4π × 10⁻⁷ T m/A) (Original problem.)
  ask: Terminal speed
  unit: m/s
  ans: 0.0490
  tol: 0.0005
  verify: 1024*0.0075*9.8*(8e-3)**4/(45*(4e-7*Math.PI)**2*1.0**2*5.9e7*1.5e-3)
  hints: ["By reciprocity, the flux of a dipole through a ring equals m times the axial field the ring would produce per unit current at the dipole.", "Power balance: F v = ε²/R for each ring, with ε = v dΦ/dz.", "∫ z² dz /(a²+z²)⁵ over the whole line is 5π/(128 a⁷)."]
  sol: |
    **Flux.** The ring of radius $a$ with current $I$ makes an axial field $\mu_0Ia^2/2(a^2+z^2)^{3/2}$. By reciprocity of mutual inductance, the flux of the dipole through the ring is
    $$\Phi(z) = \frac{\mu_0ma^2}{2(a^2+z^2)^{3/2}},\qquad \frac{d\Phi}{dz} = -\frac{3\mu_0ma^2z}{2(a^2+z^2)^{5/2}}.$$

    **Drag from one ring.** With $\varepsilon = v\,d\Phi/dz$ and power balance $Fv = \varepsilon^2/R$, $F = (v/R)(d\Phi/dz)^2$.

    **Sum over the pipe.** A ring of height $dz$ has resistance $2\pi a/(\sigma t\,dz)$, so
    $$k = \frac{F}{v} = \frac{\sigma t}{2\pi a}\int_{-\infty}^{\infty}\left(\frac{d\Phi}{dz}\right)^2dz = \frac{\sigma t}{2\pi a}\cdot\frac{9\mu_0^2m^2a^4}{4}\cdot\frac{5\pi}{128a^7} = \frac{45\mu_0^2m^2\sigma t}{1024\,a^4}.$$
    (The integral uses $z = a\tan\theta$: $\int\sin^2\theta\cos^6\theta\,d\theta$ over $(-\pi/2,\pi/2)$ is $5\pi/128$.)

    **Numbers.** $k = 45(1.579\times10^{-12})(1.0)(5.9\times10^7)(1.5\times10^{-3})/(1024\times4.096\times10^{-9}) \approx 1.50$ N s/m, and
    $$v_t = \frac{Mg}{k} = \frac{0.0075\times9.8}{1.50} \approx 0.049\ \text{m/s}.$$
    [Inference] A real magnet of this size is not a point dipole compared with an 8 mm pipe, and the wall is not very thin; the model gives the order of magnitude and the scaling $v_t\propto a^4/(\sigma t m^2)$.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A small magnet of mass 4.0 g, modelled as a point dipole of moment 0.50 A m² along its direction of motion, falls along the axis of a fixed horizontal metal ring of radius 6.0 mm and resistance 4.0 × 10⁻⁴ Ω, passing right through it. Neglecting the ring's self-inductance, by how much is the magnet's final speed (far below the ring) reduced compared with what it would be with no ring? Assume it does pass through. (μ₀ = 4π × 10⁻⁷ T m/A) (Original problem.)
  ask: Reduction in speed
  unit: m/s
  ans: 0.315
  tol: 0.003
  verify: 45*Math.PI*(4e-7*Math.PI)**2*0.5**2/(512*0.004*4e-4*(6e-3)**3)
  hints: ["The magnetic impulse is ∫F dt with F = (v/R)(dΦ/dz)². Note that v dt = dz.", "The answer does not depend on how fast the magnet is moving."]
  sol: |
    As in the pipe problem, $\Phi(z) = \mu_0ma^2/2(a^2+z^2)^{3/2}$ and the drag is $F = (v/R)(d\Phi/dz)^2$, always opposing the motion (the ring repels the approaching magnet and attracts the receding one).

    The equation of motion is $M\,dv/dt = Mg - F$. Gravity contributes $g\,t$ whether or not the ring is there, so at a given time after release the ring's whole effect on the speed is its impulse divided by $M$:
    $$M\,\Delta v_\text{mag} = \int F\,dt = \frac1R\int\left(\frac{d\Phi}{dz}\right)^2 v\,dt = \frac1R\int_{-\infty}^{\infty}\left(\frac{d\Phi}{dz}\right)^2dz = \frac{45\pi\mu_0^2m^2}{512\,R\,a^3}.$$
    The speed has cancelled: the ring removes the same momentum however fast the magnet goes.

    Numbers: $\mu_0^2m^2 = 1.579\times10^{-12}\times0.25 = 3.95\times10^{-13}$; $45\pi\times3.95\times10^{-13} = 5.58\times10^{-11}$; $512\times0.004\times4\times10^{-4}\times(6\times10^{-3})^3 = 1.77\times10^{-10}$. So
    $$\Delta v = \frac{5.58\times10^{-11}}{1.77\times10^{-10}} \approx 0.315\ \text{m/s}.$$

    [Inference] "Reduced compared with no ring" is meant at the same elapsed time after release; comparing at the same height would instead need the energy loss, which does depend on speed. The momentum statement is exact within the model.
  check: code

- id: o3
  lvl: oly
  kind: num
  q: A thin ring of radius 1.0 cm and self-inductance 4.0 × 10⁻⁸ H is cooled until it becomes superconducting while a uniform magnetic field of 0.020 T acts perpendicular to its plane. The field is then switched off. What current now flows in the ring? (Original problem.)
  ask: Persistent current
  unit: A
  ans: 157.1
  tol: 0.5
  verify: 0.020*Math.PI*0.01**2/4e-8
  sol: |
    With zero resistance the emf round the ring must be zero at every instant:
    $$-\frac{d\Phi_\text{ext}}{dt} - L\frac{dI}{dt} = 0 \quad\Rightarrow\quad \Phi_\text{ext} + LI = \text{constant}.$$
    Initially $I = 0$ and $\Phi_\text{ext} = B\pi r^2 = 0.020\times\pi\times10^{-4} = 6.28\times10^{-6}$ Wb. Finally $\Phi_\text{ext} = 0$, so
    $$I = \frac{B\pi r^2}{L} = \frac{6.28\times10^{-6}}{4.0\times10^{-8}} \approx 157\ \text{A},$$
    in the sense that keeps the flux in the original direction (Lenz's law with complete opposition). It persists indefinitely. The stored energy $\Phi^2/2L \approx 0.49$ mJ came from the work done on the ring while the field was being removed.
  check: code

- id: o4
  lvl: oly
  kind: num
  q: In a jumping-ring demonstration the coil carries an alternating current of amplitude 20 A at 50 Hz. The aluminium ring has resistance 2.0 × 10⁻⁴ Ω and self-inductance 1.0 × 10⁻⁶ H (enhanced by the iron core). At the ring's position the mutual inductance between coil and ring is 2.0 × 10⁻⁵ H and it decreases with height at the rate 5.0 × 10⁻⁴ H/m. Find the time-averaged vertical force on the ring. (Original problem; the values are illustrative.)
  ask: Average force
  unit: N
  ans: 1.423
  tol: 0.01
  verify: 5e-4*2e-5*(2*Math.PI*50)**2*1e-6*20**2/(2*(2e-4**2+(2*Math.PI*50*1e-6)**2))
  hints: ["Solve L dI₂/dt + R I₂ = −M dI₁/dt in the steady state.", "The force is I₁ I₂ dM/dz; average the product over a cycle."]
  sol: |
    Let $I_1 = I_0\cos\omega t$. The ring equation $L\dot I_2 + RI_2 = -M\dot I_1 = M\omega I_0\sin\omega t$ has the steady solution
    $$I_2 = \frac{M\omega I_0}{Z}\sin(\omega t-\varphi),\qquad Z = \sqrt{R^2+\omega^2L^2},\ \tan\varphi = \frac{\omega L}{R}.$$
    The interaction energy is $MI_1I_2$, so the vertical force is $F = I_1I_2\,dM/dz$. Using $\langle\cos\omega t\sin(\omega t-\varphi)\rangle = -\tfrac12\sin\varphi$ and $\sin\varphi = \omega L/Z$:
    $$\langle F\rangle = -\frac{dM}{dz}\cdot\frac{M\omega^2L\,I_0^2}{2Z^2}.$$
    Numbers: $\omega = 314.2$ s⁻¹, $\omega L = 3.14\times10^{-4}$ Ω, $Z^2 = 4.0\times10^{-8} + 9.87\times10^{-8} = 1.387\times10^{-7}$ Ω². With $dM/dz = -5.0\times10^{-4}$ H/m,
    $$\langle F\rangle = \frac{5.0\times10^{-4}\times2.0\times10^{-5}\times(314.2)^2\times10^{-6}\times400}{2\times1.387\times10^{-7}} \approx 1.42\ \text{N, upward}.$$
    The force is repulsive only because the ring's inductance makes its current lag; with $L = 0$ the average would be zero.
  check: code
