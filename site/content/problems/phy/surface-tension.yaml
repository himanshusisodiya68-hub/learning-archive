- id: b3
  lvl: board
  kind: text
  q: Why does adding a detergent to water help clean oily clothes? Answer using surface tension and angle of contact. (Original problem.)
  sol: |
    Detergent lowers the surface tension of water and its angle of contact with the fabric and oily dirt, so the solution spreads and wets the cloth instead of beading up, and it penetrates between the fibres. The detergent molecules also cling to oil on one end and to water on the other, so the dirt is lifted off and carried away in the wash water.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A soap bubble is blown from radius 1.0 cm to radius 2.0 cm. If the surface tension of the soap solution is 0.030 N/m, how much work is done against surface tension? (Original problem.)
  ask: Work done
  unit: 10^-4 J
  ans: 2.262
  tol: 0.005
  verify: 0.030*2*4*PI*((2.0e-2)**2-(1.0e-2)**2)*1e4
  sol: |
    The bubble has two surfaces, so its surface area is $2\times4\pi r^2$. The work equals $S\,\Delta A$:
    $$W = S\times2\times4\pi(r_2^2-r_1^2) = 0.030\times8\pi\times(4.0\times10^{-4}-1.0\times10^{-4}) = 2.26\times10^{-4}\ \text{J}.$$
  check: code

- id: m2
  lvl: main
  kind: num
  q: Mercury (surface tension 0.465 N/m, density 13 600 kg/m³, angle of contact 135°) is in a glass capillary of radius 1.0 mm dipped into a mercury bath. By how much is the mercury level in the tube depressed below the level outside? Take g = 9.8 m/s². (Original problem.)
  ask: Depression
  unit: mm
  ans: 4.93
  tol: 0.03
  verify: -2*0.465*cos(rad(135))/(13600*9.8*1.0e-3)*1e3
  sol: |
    Use $h = \dfrac{2S\cos\theta}{\rho g r}$. For $\theta = 135^\circ$, $\cos\theta = -0.707$ is negative, so $h$ is negative: the level falls.
    $$|h| = \frac{2\times0.465\times0.707}{13600\times9.8\times1.0\times10^{-3}} = 4.9\times10^{-3}\ \text{m} = 4.9\ \text{mm}.$$
    The meniscus is convex (obtuse angle of contact) and the mercury in the tube is pushed down.
  check: code

- id: m3
  lvl: main
  kind: num
  q: Eight identical water droplets of radius 1.0 mm merge into one large drop. How much surface energy is released? Surface tension of water 0.072 N/m. (Original problem.)
  ask: Energy released
  unit: 10^-6 J
  ans: 3.619
  tol: 0.01
  verify: 0.072*4*PI*(8*(1e-3)**2-(2e-3)**2)*1e6
  sol: |
    Volume conservation: $\tfrac43\pi R^3 = 8\times\tfrac43\pi r^3$, so $R = 2r = 2.0$ mm. The surface area falls from $8\times4\pi r^2 = 32\pi r^2$ to $4\pi R^2 = 16\pi r^2$, a loss of $16\pi r^2 = 16\pi\times10^{-6} = 5.03\times10^{-5}$ m$^2$. Energy released $=S\,\Delta A = 0.072\times5.03\times10^{-5} = 3.62\times10^{-6}$ J (it appears as a rise in temperature of the drop).
  check: code
