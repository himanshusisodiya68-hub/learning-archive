  q: Water rises in a clean glass capillary tube because the angle of contact between water and glass is
  opts: ["acute, so the surface is concave", "obtuse, so the surface is concave", "acute, so the surface is convex", "obtuse, so the surface is convex"]
  ans: 0
  sol: For water on clean glass the angle of contact is acute, so the meniscus is concave and the pressure just below it is lower than the atmospheric pressure outside, which makes water climb up the tube. (Original problem.)
