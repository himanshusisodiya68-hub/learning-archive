  q: The SI unit of surface tension is
  opts: ["N m⁻¹", "N m⁻²", "N m", "N"]
  ans: 0
  sol: Surface tension is force per unit length, $S = F/l$, so the unit is N/m (equivalently J/m², energy per unit area). (Original problem.)
