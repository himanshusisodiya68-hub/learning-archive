- id: b1
  lvl: board
  kind: num
  q: Water of surface tension 0.072 N/m and density 1000 kg/m³ rises in a clean glass capillary of radius 0.50 mm. The angle of contact is zero. Find the height of the rise. Take g = 9.8 m/s². (Original problem.)
  ask: Height of rise
  unit: cm
  ans: 2.94
  tol: 0.02
  verify: 2*0.072/(1000*9.8*0.50e-3)*100
  sol: $h = \dfrac{2S\cos\theta}{\rho g r} = \dfrac{2\times0.072\times1}{1000\times9.8\times0.50\times10^{-3}} = 2.94\times10^{-2}$ m $=2.94$ cm.
  check: code

