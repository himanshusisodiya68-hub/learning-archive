- id: m3
  lvl: main
  kind: num
  q: A small lamp sits 2.0 m below the surface of a still pond ($n = 4/3$). Light escapes only through a circular patch of the surface. Find the radius of that patch.
  ask: Radius
  unit: m
  ans: 2.27
  tol: 0.03
  verify: 2/sqrt((4/3)**2-1)
  hints: ["Beyond the critical angle, light is totally reflected back into the water.", "r = h tan θc, with sin θc = 1/n."]
  sol: $\sin\theta_c = 3/4$, so $\tan\theta_c = 3/\sqrt7$. Then $r = 2.0 \times 3/\sqrt7 \approx 2.27$ m.
