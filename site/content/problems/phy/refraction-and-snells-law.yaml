- id: m1
  lvl: main
  kind: num
  q: A ray strikes a glass slab 6.0 cm thick ($n = 1.5$) at an angle of incidence of 60°. Find the lateral shift of the emerging ray.
  ask: Lateral shift
  unit: cm
  ans: 3.07
  tol: 0.05
  verify: "(function(){ var r = asin(sin(rad(60))/1.5); return 6*sin(rad(60)-r)/cos(r); })()"
  hints: ["The emerging ray is parallel to the incident ray. First find the angle of refraction r.", "Lateral shift d = t sin(i − r) / cos r."]
  sol: $\sin r = \sin 60^\circ/1.5 = 0.577$, so $r = 35.3^\circ$. Then $d = 6.0 \times \sin 24.7^\circ/\cos 35.3^\circ = 6.0 \times 0.418/0.816 \approx 3.07$ cm.
  check: code

