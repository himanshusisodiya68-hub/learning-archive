# Refraction and Snell's law. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 9.

- id: c8-10-12
  lvl: ncert-ex
  num: "VIII Q12"
  source: NCERT VIII Curiosity · Ch 10 · Q12
  kind: text
  q: Place a pencil behind a transparent glass tumbler (Fig. 10.28a). Now fill the tumbler halfway with water (Fig. 10.28b). How does the pencil appear when viewed through the water? Explain why its shape appears changed.
  sol: Through the water the pencil looks thicker and shifted sideways, so it appears broken at the water line. Light from the pencil refracts as it passes through the curved water surface. A cylindrical tumbler of water acts like a converging lens across its width, so it magnifies and displaces the part seen through the water, while the part above the water is seen normally.
  check: none

- id: ncert-it150-1
  lvl: ncert-intext
  num: "p150 Q1"
  source: NCERT X Science · Ch 9 · In-text questions · p. 150 · Q1
  kind: text
  q: A ray of light travelling in air enters obliquely into water. Does the light ray bend towards the normal or away from the normal? Why?
  sol: It bends **towards the normal**. Water is optically denser than air (refractive index 1.33 against 1.0003), so light slows down on entering it, and a ray entering a medium where it travels more slowly bends towards the normal.
  check: none

- id: ncert-it150-2
