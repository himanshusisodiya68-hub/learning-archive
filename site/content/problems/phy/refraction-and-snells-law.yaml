- id: a1
  lvl: adv
  kind: num
  q: A prism has a refracting angle of 60° and refractive index $\sqrt2$. Find its angle of minimum deviation.
  ask: Minimum deviation
  unit: "°"
  ans: 30
  tol: 0.3
  verify: 2*deg(asin(sqrt(2)*sin(rad(30))))-60
  hints: ["At minimum deviation the ray passes through symmetrically, so r = A/2 = 30°.", "n = sin((A + D)/2) / sin(A/2)."]
  sol: $\sin\frac{60^\circ + D}{2} = \sqrt2\sin 30^\circ = 0.707$, so $\frac{60^\circ + D}{2} = 45^\circ$ and $D = 30^\circ$.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A fish 1.2 m below the water surface ($n = 4/3$) looks straight up at a bird hovering 3.0 m above the surface. How far away does the bird appear to the fish?
  ask: Apparent distance
  unit: m
  ans: 5.2
  tol: 0.05
  verify: 3*4/3+1.2
  hints: ["Seen from inside the denser medium, heights above the surface look multiplied by n.", "Then add the fish's own depth."]
