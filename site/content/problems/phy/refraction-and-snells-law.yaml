  q: Light enters from air to glass having refractive index 1.50. What is the speed of light in the glass? The speed of light in vacuum is $3 \times 10^8$ m s$^{-1}$.
  ask: Speed, in units of 10⁸ m/s
  unit: × 10⁸ m/s
  ans: 2
  tol: 0.01
  verify: 3/1.5
  hints: ["n = c/v, so v = c/n."]
  sol: $v = c/n = (3 \times 10^8)/1.50 = 2 \times 10^8$ m s$^{-1}$.
  check: code

- id: ncert-it150-3
  lvl: ncert-intext
  num: "p150 Q3"
  source: NCERT X Science · Ch 9 · In-text questions · p. 150 · Q3
  kind: text
  q: Find out, from Table 9.3, the medium having highest optical density. Also find the medium with lowest optical density.
  sol: The higher the refractive index, the higher the optical density. **Highest:** diamond ($n = 2.42$). **Lowest:** air ($n = 1.0003$).
  check: none

- id: ncert-it150-4
  lvl: ncert-intext
  num: "p150 Q4"
  source: NCERT X Science · Ch 9 · In-text questions · p. 150 · Q4
  kind: mcq
  q: You are given kerosene, turpentine and water. In which of these does the light travel fastest? Use the information given in Table 9.3.
  opts: ["Kerosene", "Turpentine", "Water"]
  ans: 2
  sol: Speed $v = c/n$ is largest where $n$ is smallest. From Table 9.3, kerosene 1.44, turpentine oil 1.47, water 1.33. Light travels fastest in **water**.
  check: none

- id: ncert-it150-5
  lvl: ncert-intext
  num: "p150 Q5"
  source: NCERT X Science · Ch 9 · In-text questions · p. 150 · Q5
  kind: text
  q: The refractive index of diamond is 2.42. What is the meaning of this statement?
  sol: It means the ratio of the speed of light in vacuum to the speed of light in diamond is 2.42, so light travels 2.42 times more slowly in diamond than in vacuum, at about $3 \times 10^8 / 2.42 \approx 1.24 \times 10^8$ m s$^{-1}$.
  check: none

- id: f1
  lvl: found
  kind: mcq
  q: A ray of light travels from glass into air, striking the boundary at an angle. Which way does it bend?
  opts: ["Towards the normal", "Away from the normal", "It does not bend"]
  ans: 1
  hints: ["Compare the refractive indices: glass is about 1.5 and air about 1.0.", "Light bends towards the normal when it slows down."]
  sol: |
    Light speeds up as it enters air, which has the smaller refractive index, so it bends away from the normal. Snell's law says the same: if $n_1 > n_2$ then $\sin\theta_2 > \sin\theta_1$.
  check: none

