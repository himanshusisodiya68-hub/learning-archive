- id: b2
  lvl: board
  kind: num
  q: A galvanometer of resistance 50 Ω gives full-scale deflection for 5 mA. What shunt converts it into an ammeter reading up to 1 A? (Original problem.)
  ask: Shunt resistance
  unit: Ω
  ans: 0.2513
  tol: 0.001
  verify: 0.005*50/(1-0.005)
  sol: |
    The shunt $S$ in parallel carries $I - I_g = 0.995$ A at the same potential difference as the galvanometer: $S = \dfrac{I_gG}{I - I_g} = \dfrac{0.005\times50}{0.995} = 0.25\ \Omega$.
  check: code

