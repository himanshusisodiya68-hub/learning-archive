  ask: Series resistance
  unit: Ω
  ans: 1950
  tol: 0.01
  verify: 10/0.005-50
  sol: At full scale $I_g(G + R) = 10$ V, so $R = 10/0.005 - 50 = 1950\ \Omega$.
