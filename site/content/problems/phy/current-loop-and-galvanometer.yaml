- id: b2
  lvl: board
  kind: num
  q: A galvanometer of resistance 50 Ω gives full-scale deflection for 5 mA. What shunt converts it into an ammeter reading up to 1 A? (Original problem.)
  ask: Shunt resistance
  unit: Ω
  ans: 0.2513
  tol: 0.001
  verify: 0.005*50/(1-0.005)
  sol: |
    The shunt $S$ in parallel carries $I - I_g = 0.995$ A at the same potential difference as the galvanometer: $S = \dfrac{I_gG}{I - I_g} = \dfrac{0.005\times50}{0.995} = 0.25\ \Omega$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: Convert the same galvanometer (50 Ω, 5 mA) into a voltmeter reading up to 10 V. Find the series resistance. (Original problem.)
  ask: Series resistance
  unit: Ω
  ans: 1950
  tol: 0.01
  verify: 10/0.005-50
  sol: At full scale $I_g(G + R) = 10$ V, so $R = 10/0.005 - 50 = 1950\ \Omega$.
  check: code

- id: m2
  lvl: main
  kind: text
  q: The number of turns in a galvanometer coil is doubled. What happens to its current sensitivity and to its voltage sensitivity? (Original problem.)
  sol: |
    Current sensitivity $\phi/I = NAB/k$ doubles. But the coil's resistance also roughly doubles (twice as much wire), and the voltage sensitivity $\phi/V = NAB/(kR)$ stays about the same.
  check: none
