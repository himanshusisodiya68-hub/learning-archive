# Force between parallel currents, and the definition of the ampere. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 4, §4.8 and Exercise 4.7. Found, board and main problems are original.

- id: ncert12-eg-4-9
  lvl: ncert-intext
  num: "XII Ex 4.9"
  source: NCERT XII Physics · Ch 4 · Example 4.9
  kind: num
  q: The horizontal component of the earth's magnetic field at a certain place is 3.0 ×10⁻⁵ T and the direction of the field is from the geographic south to the geographic north. A very long straight conductor is carrying a steady current of 1A. What is the force per unit length on it when it is placed on a horizontal table and the direction of the current is (a) east to west; (b) south to north?
  ask: Force per unit length in case (a)
  unit: N/m
  ans: 3e-5
  tol: 1e-8
  verify: 1*3.0e-5
  sol: |
    $\mathbf F = I\mathbf l\times\mathbf B$, so $f = F/l = IB\sin\theta$.

    (a) Current east to west, field south to north: $\theta = 90^\circ$, $f = IB = 1\times3\times10^{-5} = 3\times10^{-5}$ N m⁻¹, directed downwards (into the table).

    (b) Current south to north: parallel to the field, $\theta = 0$, so $f = 0$.

    The value in (a) is larger than $2\times10^{-7}$ N m⁻¹ used to define the ampere, so the effect of the Earth's field and other stray fields must be eliminated when standardising the ampere.
  check: code

- id: ncert12-ex-4-7
  lvl: ncert-ex
  num: "XII 4.7"
  source: NCERT XII Physics · Ch 4 · Exercise 4.7
  kind: num
  q: Two long and parallel straight wires A and B carrying currents of 8.0 A and 5.0 A in the same direction are separated by a distance of 4.0 cm. Estimate the force on a 10 cm section of wire A.
  ask: Force on the 10 cm section
  unit: N
  ans: 2e-5
  tol: 1e-8
  verify: 2e-7*8*5*0.1/0.04
  sol: |
    The field of wire B at wire A is $B = \dfrac{\mu_0I_B}{2\pi d} = \dfrac{2\times10^{-7}\times5.0}{0.04} = 2.5\times10^{-5}$ T. The force on a length $l = 0.1$ m of A is $F = I_ABl = 8.0\times2.5\times10^{-5}\times0.1 = 2\times10^{-5}$ N. The currents are in the same direction, so the force is **attractive**, normal to A and directed towards B.
  answer_key: 2 × 10⁻⁵ N; attractive force normal to A towards B
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: Two long parallel wires carry currents in the same direction. They
  opts: ["attract each other", "repel each other", "exert no force", "rotate"]
  ans: 0
  sol: Each wire's field at the other exerts a force towards the first wire (right-hand and left-hand rules), so parallel currents attract and antiparallel currents repel.
