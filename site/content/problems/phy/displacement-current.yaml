- id: b2
  lvl: board
  kind: text
  q: Why did Ampère's circuital law need a correction for a charging capacitor? (Original problem.)
  sol: |
    Take a loop around the wire to the capacitor. Apply Ampère's law to two surfaces bounded by the same loop: a flat disc that the wire crosses (current $I$ passes through it), and a bulging surface that passes between the plates (no conduction current passes through it). The left side $\oint\mathbf B\cdot d\mathbf l$ is the same, but the right-hand side would be $\mu_0I$ for one and $0$ for the other: a contradiction. Maxwell added the displacement current $\varepsilon_0\,d\Phi_E/dt$ in the gap, which carries the same "current" through the second surface, so both give $\mu_0I$.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A displacement current of 0.5 A flows uniformly between circular capacitor plates of radius 5 cm. Find the magnetic field at 2 cm from the axis. (Original problem.)
  ask: Magnetic field
  unit: µT
  ans: 0.8
  tol: 0.001
  verify: 2e-7*0.5*0.02/0.05**2*1e6
  sol: $B = \dfrac{\mu_0i_dr}{2\pi R^2} = \dfrac{2\times10^{-7}\times0.5\times0.02}{(0.05)^2} = 8\times10^{-7}$ T $= 0.8$ µT.
  check: code

- id: m2
  lvl: main
  kind: text
  q: State Maxwell's modification of Ampère's circuital law and explain how it leads to the existence of electromagnetic waves. (Original problem.)
  sol: |
    $\oint\mathbf B\cdot d\mathbf l = \mu_0\left(i_c + \varepsilon_0\dfrac{d\Phi_E}{dt}\right)$. A changing electric field now produces a magnetic field, just as a changing magnetic field produces an electric field (Faraday). Each can regenerate the other: an oscillating field in one region makes the other in the next, and the disturbance travels through empty space at $c = 1/\sqrt{\mu_0\varepsilon_0}$.
  check: none
