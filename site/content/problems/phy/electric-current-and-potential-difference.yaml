# Electric current and potential difference. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 11, §11.1–11.3. Found, board and main problems are original.

- id: ncert-it11-1-1
  lvl: ncert-intext
  num: "§11.1 Q1"
  source: NCERT X Science · Ch 11 · In-text questions after §11.1 · Q1
  kind: text
  q: What does an electric circuit mean?
  sol: |
    An electric circuit is a **continuous and closed path** along which an electric current flows. It normally contains a source of potential difference (a cell or battery), connecting wires, a switch (plug key) and the components that use the current (bulb, resistor and so on). If the circuit is broken anywhere, for example by opening the switch, the current stops everywhere in it.
  check: none

- id: ncert-it11-1-2
  lvl: ncert-intext
  num: "§11.1 Q2"
  source: NCERT X Science · Ch 11 · In-text questions after §11.1 · Q2
  kind: text
  q: Define the unit of current.
  sol: |
    The SI unit of current is the **ampere (A)**. One ampere is the current when one coulomb of charge flows through a cross-section of a conductor every second: $1\ \text{A} = 1\ \text{C} / 1\ \text{s}$.
  check: none

- id: ncert-it11-1-3
  lvl: ncert-intext
  num: "§11.1 Q3"
  source: NCERT X Science · Ch 11 · In-text questions after §11.1 · Q3
  kind: num
  q: Calculate the number of electrons constituting one coulomb of charge.
  ask: Number of electrons
  unit: ""
  ans: 6.25e18
  tol: 1e16
  verify: 1/1.6e-19
  sol: |
    One electron carries a charge of magnitude $e = 1.6\times10^{-19}$ C. The number of electrons in a charge $Q$ is $n = Q/e$:

    $$n = \frac{1\ \text{C}}{1.6\times10^{-19}\ \text{C}} = 6.25\times10^{18}.$$

    The chapter's rounded value, "nearly $6\times10^{18}$ electrons", is consistent with this.
  check: code

- id: ncert-eg11-1
  lvl: ncert-intext
  num: "Ex 11.1"
  source: NCERT X Science · Ch 11 · Example 11.1
  kind: num
  q: A current of 0.5 A is drawn by a filament of an electric bulb for 10 minutes. Find the amount of electric charge that flows through the circuit.
  ask: Charge
  unit: C
  ans: 300
  tol: 0.5
  verify: 0.5*10*60
  sol: |
    $I = 0.5$ A and $t = 10\ \text{min} = 600$ s. From $I = Q/t$,

    $$Q = It = 0.5\ \text{A}\times600\ \text{s} = 300\ \text{C}.$$
  check: code

- id: ncert-it11-2-1
  lvl: ncert-intext
  num: "§11.2 Q1"
  source: NCERT X Science · Ch 11 · In-text questions after §11.2 · Q1
  kind: text
  q: Name a device that helps to maintain a potential difference across a conductor.
  sol: |
    A **cell** or a **battery** (a combination of cells). The chemical action inside the cell keeps a potential difference between its terminals, so charges keep flowing in a closed circuit connected to it.
  check: none

- id: ncert-it11-2-2
  lvl: ncert-intext
  num: "§11.2 Q2"
  source: NCERT X Science · Ch 11 · In-text questions after §11.2 · Q2
  kind: text
  q: What is meant by saying that the potential difference between two points is 1 V?
  sol: |
    It means that **1 joule of work is done to move a charge of 1 coulomb** from one point to the other: $1\ \text{V} = 1\ \text{J}/1\ \text{C}$.
  check: none

- id: ncert-it11-2-3
  lvl: ncert-intext
  num: "§11.2 Q3"
  source: NCERT X Science · Ch 11 · In-text questions after §11.2 · Q3
  kind: num
  q: How much energy is given to each coulomb of charge passing through a 6 V battery?
  ask: Energy per coulomb
  unit: J
  ans: 6
  tol: 0.01
  verify: 6*1
  sol: |
    Potential difference is work per unit charge, $V = W/Q$, so $W = VQ = 6\ \text{V}\times1\ \text{C} = 6\ \text{J}$. Each coulomb gains 6 J of energy as it passes through the battery.
  check: code

- id: ncert-eg11-2
  lvl: ncert-intext
  num: "Ex 11.2"
  source: NCERT X Science · Ch 11 · Example 11.2
  kind: num
  q: How much work is done in moving a charge of 2 C across two points having a potential difference 12 V?
  ask: Work done
  unit: J
  ans: 24
  tol: 0.01
  verify: 12*2
  sol: |
    $Q = 2$ C and $V = 12$ V. From $V = W/Q$,

    $$W = VQ = 12\ \text{V}\times2\ \text{C} = 24\ \text{J}.$$
  check: code

- id: ncert-ex11-5
  lvl: ncert-ex
  num: 5
  source: NCERT X Science · Ch 11 · Exercise 5
  kind: text
  q: How is a voltmeter connected in the circuit to measure the potential difference between two points?
  sol: |
    A voltmeter is connected **in parallel** across the two points. Potential difference is the same across parallel branches, so the voltmeter then reads the potential difference between exactly those two points. (An ammeter, by contrast, goes in series.)
  check: none

- id: f1
  lvl: found
  kind: mcq
  q: Which of these is the SI unit of electric charge?
  opts: ["ampere", "coulomb", "volt", "ohm"]
  ans: 1
  sol: Charge is measured in coulombs (C). The ampere measures current (C/s), the volt measures potential difference (J/C) and the ohm measures resistance.
  check: none

- id: f2
  lvl: found
  kind: num
  q: A steady current of 2 A flows through a wire for 5 s. How much charge passes through a cross-section of the wire? (Original problem.)
  ask: Charge
  unit: C
  ans: 10
  tol: 0.01
  verify: 2*5
  sol: $Q = It = 2\ \text{A}\times5\ \text{s} = 10\ \text{C}$.
  check: code

- id: b1
  lvl: board
  kind: num
  q: In a wire, $3.2\times10^{19}$ electrons cross a section every minute. Find the current. Take $e = 1.6\times10^{-19}$ C. (Original problem.)
  ask: Current
  unit: A
  ans: 0.0853
  tol: 0.0005
  verify: 3.2e19*1.6e-19/60
  sol: |
    Charge per minute $Q = ne = 3.2\times10^{19}\times1.6\times10^{-19} = 5.12$ C in $t = 60$ s, so

    $$I = \frac{Q}{t} = \frac{5.12}{60} \approx 0.085\ \text{A}.$$
  check: code

- id: b2
  lvl: board
  kind: num
  q: A 9 V battery drives a charge of 450 C round a circuit. How much chemical energy does the battery convert into electrical energy? (Original problem.)
  ask: Energy
  unit: J
  ans: 4050
  tol: 1
  verify: 9*450
  sol: $W = VQ = 9\ \text{V}\times450\ \text{C} = 4050\ \text{J}$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A battery is rated 2000 mA h at a terminal voltage of 3.7 V. Treating the voltage as constant, how much electrical energy can it deliver? (Original problem.)
  ask: Energy
  unit: kJ
  ans: 26.64
  tol: 0.05
  verify: 2*3600*3.7/1000
  sol: |
    2000 mA h $=2$ A h. One ampere-hour is $1\ \text{A}\times3600\ \text{s} = 3600$ C, so the battery moves $Q = 2\times3600 = 7200$ C. Each coulomb gains 3.7 J, so $W = QV = 7200\times3.7 = 26\,640$ J $\approx 26.6$ kJ.
  check: code

- id: m2
  lvl: main
  kind: num
  q: In a copper wire the current is $0.8$ A. How many electrons pass a given cross-section per second? Take $e = 1.6\times10^{-19}$ C. (Original problem.)
  ask: Electrons per second
  unit: ""
  ans: 5e18
  tol: 1e15
  verify: 0.8/1.6e-19
  sol: |
    Charge per second is $0.8$ C, and each electron carries $1.6\times10^{-19}$ C, so the rate is $0.8/(1.6\times10^{-19}) = 5\times10^{18}$ electrons per second. Conventional current flows opposite to the electrons' drift.
  check: code
