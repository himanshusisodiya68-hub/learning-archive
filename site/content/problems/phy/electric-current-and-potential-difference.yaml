- id: b1
  lvl: board
  kind: num
  q: In a wire, $3.2\times10^{19}$ electrons cross a section every minute. Find the current. Take $e = 1.6\times10^{-19}$ C. (Original problem.)
  ask: Current
  unit: A
  ans: 0.0853
  tol: 0.0005
  verify: 3.2e19*1.6e-19/60
  sol: |
    Charge per minute $Q = ne = 3.2\times10^{19}\times1.6\times10^{-19} = 5.12$ C in $t = 60$ s, so

    $$I = \frac{Q}{t} = \frac{5.12}{60} \approx 0.085\ \text{A}.$$
  check: code

- id: b2
  lvl: board
  kind: num
  q: A 9 V battery drives a charge of 450 C round a circuit. How much chemical energy does the battery convert into electrical energy? (Original problem.)
  ask: Energy
  unit: J
  ans: 4050
  tol: 1
  verify: 9*450
  sol: $W = VQ = 9\ \text{V}\times450\ \text{C} = 4050\ \text{J}$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A battery is rated 2000 mA h at a terminal voltage of 3.7 V. Treating the voltage as constant, how much electrical energy can it deliver? (Original problem.)
  ask: Energy
  unit: kJ
  ans: 26.64
  tol: 0.05
  verify: 2*3600*3.7/1000
  sol: |
    2000 mA h $=2$ A h. One ampere-hour is $1\ \text{A}\times3600\ \text{s} = 3600$ C, so the battery moves $Q = 2\times3600 = 7200$ C. Each coulomb gains 3.7 J, so $W = QV = 7200\times3.7 = 26\,640$ J $\approx 26.6$ kJ.
  check: code

- id: m2
  lvl: main
  kind: num
  q: In a copper wire the current is $0.8$ A. How many electrons pass a given cross-section per second? Take $e = 1.6\times10^{-19}$ C. (Original problem.)
  ask: Electrons per second
  unit: ""
  ans: 5e18
  tol: 1e15
  verify: 0.8/1.6e-19
  sol: |
    Charge per second is $0.8$ C, and each electron carries $1.6\times10^{-19}$ C, so the rate is $0.8/(1.6\times10^{-19}) = 5\times10^{18}$ electrons per second. Conventional current flows opposite to the electrons' drift.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A copper wire of cross-section 2.0 mm² carries a steady current of 3.0 A. Copper has $8.5\times10^{28}$ free electrons per m³. Find the drift speed of the electrons, and hence the time an electron takes to drift along 1.0 m of the wire. Give the drift speed. Take $e = 1.6\times10^{-19}$ C. (Original problem.)
  ask: Drift speed
  unit: mm/s
  ans: 0.110
  tol: 0.002
  verify: 3/(8.5e28*2e-6*1.6e-19)*1000
  sol: |
    From $I = nAv_de$,
    $$v_d = \frac{I}{nAe} = \frac{3.0}{8.5\times10^{28}\times2.0\times10^{-6}\times1.6\times10^{-19}} = \frac{3.0}{2.72\times10^{4}} \approx 1.10\times10^{-4}\ \text{m/s} = 0.110\ \text{mm/s}.$$
    Time to drift 1.0 m: $1.0/1.10\times10^{-4}\approx 9.1\times10^3$ s, about 2.5 hours. A lamp on such a wire still lights at once, because the field, not the electrons, travels from the source at nearly the speed of light.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A voltmeter across the terminals of a cell reads 1.45 V when the cell supplies 0.50 A, and 1.30 V when it supplies 2.0 A. Find the internal resistance of the cell. (Original problem.)
  ask: Internal resistance
  unit: Ω
  ans: 0.10
  tol: 0.002
  verify: (1.45-1.30)/(2.0-0.5)
  sol: |
    For a discharging cell $V = \varepsilon - Ir$. The two readings give
    $$1.45 = \varepsilon - 0.50\,r,\qquad 1.30 = \varepsilon - 2.0\,r.$$
    Subtracting, $0.15 = 1.5\,r$, so $r = 0.10\ \Omega$. Then $\varepsilon = 1.45 + 0.50\times0.10 = 1.50$ V. The terminal voltage falls by $r$ volts for every extra ampere drawn.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A battery of EMF 12.0 V and internal resistance 0.050 Ω is being charged by a current of 10 A (current enters at its positive terminal). What is the potential difference across its terminals? How much of the charger's power is stored as chemical energy, and how much heats the battery? Give the terminal voltage. (Original problem.)
  ask: Terminal voltage
  unit: V
  ans: 12.5
  tol: 0.01
  verify: 12.0+10*0.050
  sol: |
    While charging, the charger must overcome both the EMF and the drop across the internal resistance:
    $$V = \varepsilon + Ir = 12.0 + 10\times0.050 = 12.5\ \text{V}.$$
    Power from the charger: $VI = 125$ W. Stored as chemical energy: $\varepsilon I = 120$ W. Heat in the battery: $I^2r = 100\times0.050 = 5$ W. Check: $120 + 5 = 125$ W.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: Copper has $8.5\times10^{28}$ free electrons per m³ and resistivity $1.7\times10^{-8}\ \Omega\,$m at room temperature. Using the Drude model ($v_d = eE\tau/m$), estimate the mean time $\tau$ between collisions of a conduction electron. Take $e = 1.6\times10^{-19}$ C and $m = 9.11\times10^{-31}$ kg. (Original problem.)
  ask: Mean free time τ
  unit: × 10⁻¹⁴ s
  ans: 2.46
  tol: 0.03
  verify: 9.11e-31/(8.5e28*1.6e-19**2*1.7e-8)*1e14
  sol: |
    Current density $j = nev_d = ne\cdot\dfrac{eE\tau}{m} = \dfrac{ne^2\tau}{m}E$. Comparing with $j = E/\rho$ (the definition of resistivity) gives
    $$\tau = \frac{m}{ne^2\rho} = \frac{9.11\times10^{-31}}{8.5\times10^{28}\times(1.6\times10^{-19})^2\times1.7\times10^{-8}} = \frac{9.11\times10^{-31}}{3.70\times10^{-17}} \approx 2.46\times10^{-14}\ \text{s}.$$
    With the Fermi speed $v_F\approx1.6\times10^6$ m/s, the mean free path is $v_F\tau\approx 40$ nm, roughly 150 atomic spacings, which shows that electrons are not scattered by every ion; quantum mechanics explains why a perfect lattice does not scatter them at all.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: Electrons leave a hot cathode essentially at rest, are accelerated through a potential difference of 5.0 kV, and form a beam of current 1.0 mA that is fully absorbed by a target. Find the force the beam exerts on the target. Take $e = 1.6\times10^{-19}$ C and $m = 9.11\times10^{-31}$ kg; ignore relativity. (Original problem.)
  ask: Force on target
  unit: × 10⁻⁷ N
  ans: 2.39
  tol: 0.02
  verify: 1e-3*sqrt(2*9.11e-31*5000/1.6e-19)*1e7
  sol: |
    Each electron gains kinetic energy $eV$, so $\tfrac12mv^2 = eV$ and $v = \sqrt{2eV/m} \approx 4.19\times10^7$ m/s.
    Electrons arrive at a rate $I/e$ per second, each bringing momentum $mv$, all absorbed. The force is the momentum delivered per second:
    $$F = \frac{I}{e}\,mv = I\sqrt{\frac{2mV}{e}} = 1.0\times10^{-3}\sqrt{\frac{2\times9.11\times10^{-31}\times5000}{1.6\times10^{-19}}} \approx 2.39\times10^{-7}\ \text{N}.$$
    By contrast the power delivered is $VI = 5.0$ W: a beam can heat its target strongly while pushing it with a negligible force. The linear charge density of the beam is $I/v\approx2.4\times10^{-11}$ C/m, about $1.5\times10^8$ electrons per metre.
  check: code

- id: o3
  lvl: oly
  kind: proof
  q: A long straight cylindrical resistor of radius $a$ and length $L$ carries a steady current $I$, with potential difference $V$ between its ends. Using $\vec S = \vec E\times\vec B/\mu_0$, show that the electromagnetic energy flowing into the resistor through its curved surface per second equals $VI$. (Original problem.)
  hints: ["Inside a uniform resistor the field is along the axis with magnitude V/L, and its tangential component is continuous at the surface.", "Use Ampère's law for B at the surface, then find the direction of E × B.", "Multiply the flux density by the curved area 2πaL."]
  sol: |
    In the steady state the field inside a uniform resistor is uniform and along the axis, $E = V/L$. The tangential component of $\vec E$ is continuous across the surface, so just outside it also has an axial component $V/L$ (surface charges may add a radial component, but that gives no radial Poynting flux).
    By Ampère's law around a circle of radius $a$, $B\cdot2\pi a = \mu_0 I$, so $B = \mu_0I/(2\pi a)$, circling the wire.
    With $\vec E$ along the current and $\vec B$ circling it by the right-hand rule, $\vec E\times\vec B$ points radially **inward**, with magnitude
    $$S = \frac{EB}{\mu_0} = \frac{V}{L}\cdot\frac{I}{2\pi a}.$$
    The power entering through the curved area $2\pi aL$ is $S\cdot2\pi aL = VI$. The end faces contribute nothing, since $\vec E\times\vec B$ has no axial part there from the axial $\vec E$. This equals the Joule heating $VI$, so in steady state all the dissipated energy enters through the sides from the surrounding field.
  check: none

- id: ncert12-eg-3-1
  lvl: ncert-intext
  num: "XII Ex 3.1"
  source: NCERT XII Physics · Ch 3 · Example 3.1
  kind: num
  q: (a) Estimate the average drift speed of conduction electrons in a copper wire of cross-sectional area 1.0 × 10⁻⁷ m² carrying a current of 1.5 A. Assume that each copper atom contributes roughly one conduction electron. The density of copper is 9.0 × 10³ kg/m³, and its atomic mass is 63.5 u. (b) Compare the drift speed obtained above with, (i) thermal speeds of copper atoms at ordinary temperatures, (ii) speed of propagation of electric field along the conductor which causes the drift motion.
  ask: Drift speed, part (a)
  unit: m/s
  ans: 1.1e-3
  tol: 1e-5
  verify: 1.5/(8.5e28*1.6e-19*1.0e-7)
  sol: |
    (a) Electrons drift opposite to the field, towards higher potential. From $I = nevA$, $v_d = I/(neA)$. The electron density equals the number of atoms per cubic metre (one conduction electron per atom): a cubic metre has mass $9.0\times10^{3}$ kg $=9.0\times10^{6}$ g, and $6.0\times10^{23}$ atoms have mass 63.5 g, so

    $$n = \frac{6.0\times10^{23}}{63.5}\times9.0\times10^{6} = 8.5\times10^{28}\ \text{m}^{-3}.$$

    $$v_d = \frac{1.5}{8.5\times10^{28}\times1.6\times10^{-19}\times1.0\times10^{-7}} = 1.1\times10^{-3}\ \text{m s}^{-1} = 1.1\ \text{mm s}^{-1}.$$

    (b)(i) The thermal speed from $\tfrac12 Mv^2 = \tfrac32 k_BT$ is of order $\sqrt{k_BT/M}\approx2\times10^{2}$ m/s for copper at 300 K. The drift speed is about $10^{-5}$ times this.

    (ii) The electric field travels along the conductor at about the speed of an electromagnetic wave, $3.0\times10^{8}$ m s⁻¹, so the drift speed is smaller by a factor of about $10^{-11}$.
  check: code

- id: ncert12-eg-3-2
  lvl: ncert-intext
  num: "XII Ex 3.2"
  source: NCERT XII Physics · Ch 3 · Example 3.2
  kind: text
  q: |-
    (a) In Example 3.1, the electron drift speed is estimated to be only a few mm s⁻¹ for currents in the range of a few amperes? How then is current established almost the instant a circuit is closed?
    (b) The electron drift arises due to the force experienced by electrons in the electric field inside the conductor. But force should cause acceleration. Why then do the electrons acquire a steady average drift speed?
    (c) If the electron drift speed is so small, and the electron's charge is small, how can we still obtain large amounts of current in a conductor?
    (d) When electrons drift in a metal from lower to higher potential, does it mean that all the 'free' electrons of the metal are moving in the same direction?
    (e) Are the paths of electrons straight lines between successive collisions (with the positive ions of the metal) in the (i) absence of electric field, (ii) presence of electric field?
  sol: |
    (a) The electric field is established throughout the circuit almost instantly (at about the speed of light), causing a local electron drift at every point. Current does not have to wait for electrons to travel from one end of the conductor to the other. It does take a little while for the current to reach its steady value.

    (b) Each free electron accelerates, increasing its drift speed until it collides with a positive ion of the metal. It loses its drift speed in the collision, then starts to accelerate again, and so on. On average, therefore, electrons acquire only a steady drift speed.

    (c) Because the electron number density is enormous, about $10^{29}\ \text{m}^{-3}$.

    (d) By no means. The drift velocity is superposed on the large random velocities of the electrons.

    (e) (i) In the absence of an electric field the paths are straight lines between collisions. (ii) In the presence of a field the paths are, in general, curved.
  check: none

- id: ncert12-ex-3-9
  lvl: ncert-ex
  num: "XII 3.9"
  source: NCERT XII Physics · Ch 3 · Exercise 3.9
  kind: num
  q: The number density of free electrons in a copper conductor estimated in Example 3.1 is 8.5 × 10²⁸ m⁻³. How long does an electron take to drift from one end of a wire 3.0 m long to its other end? The area of cross-section of the wire is 2.0 × 10⁻⁶ m² and it is carrying a current of 3.0 A.
  ask: Time to drift along the wire
  unit: s
  ans: 2.72e4
  tol: 100
  verify: 3.0/(3.0/(8.5e28*1.6e-19*2.0e-6))
  sol: |
    The drift speed is $v_d = I/(neA) = \dfrac{3.0}{8.5\times10^{28}\times1.6\times10^{-19}\times2.0\times10^{-6}} = 1.1\times10^{-4}$ m s⁻¹. The time to cover $l = 3.0$ m is

    $$t = \frac{l}{v_d} = \frac{3.0}{1.1\times10^{-4}} = 2.7\times10^{4}\ \text{s} \approx 7.5\ \text{h}.$$

    Exactly, $3.0\times n e A/I = 27\,200$ s; the key's $2.7\times10^{4}$ s is this value rounded to two figures.
  answer_key: 2.7 × 10⁴ s (7.5 h)
  check: both
