- id: f3
  lvl: found
  kind: mcq
  q: A bus slows uniformly from a known speed to rest, and you know the braking acceleration but not the time. Which equation gives the stopping distance directly? (Original problem.)
  opts: ["v = u + at", "s = ut + ½at²", "v² = u² + 2as", "s = ½(u + v)t"]
  ans: 2
  sol: |
    The equation $v^2 = u^2 + 2as$ links $u$, $v$, $a$ and $s$ with no time in it. With $v = 0$ it gives $s = -u^2/2a$ straight away. The other three all contain $t$, which is unknown.
  check: none

- id: b1
  lvl: board
  kind: num
  q: A train travelling at 90 km/h is brought to rest uniformly in a distance of 500 m. Find the magnitude of its retardation. (Original problem.)
  ask: Retardation
  unit: m/s²
  ans: 0.625
  tol: 0.002
  verify: (90/3.6)*(90/3.6)/(2*500)
  sol: |
    $u = 90$ km/h $= 25$ m/s, $v = 0$, $s = 500$ m. From $v^2 = u^2 + 2as$: $0 = 625 + 1000a$, so $a = -0.625$ m s$^{-2}$.

    The retardation is $0.625$ m s$^{-2}$. The time to stop is $t = u/|a| = 25/0.625 = 40$ s.
  check: code

- id: b2
