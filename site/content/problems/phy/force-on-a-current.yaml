- id: m1
  lvl: main
  kind: num
  q: A wire of length 40 cm in the shape of a "U" bent at right angles has a 40 cm base and two 30 cm legs. It carries 10 A in a uniform 0.5 T field perpendicular to its plane. Find the net force on the whole wire. (Original problem.)
  ask: Net force
  unit: N
  ans: 2
  tol: 0.01
  verify: 10*0.4*0.5
  sol: |
    The force on a wire of any shape between two end points equals that on the straight wire joining the ends: $F = BI\,l_{eff}$ where $l_{eff}$ is the straight distance between the ends, here the 40 cm base (the ends of the U are 40 cm apart). So $F = 0.5\times10\times0.4 = 2$ N. (The two legs' forces are equal and opposite and cancel.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: A semicircular wire of radius 20 cm carries 5 A in a uniform field of 0.2 T perpendicular to the plane of the wire. Find the magnitude of the force on the semicircle. (Original problem.)
  ask: Force
  unit: N
  ans: 0.4
  tol: 0.001
  verify: 5*0.4*0.2
  sol: The effective length is the diameter, $2R = 0.4$ m, so $F = BI(2R) = 0.2\times5\times0.4 = 0.4$ N, perpendicular to the diameter in the plane.
  check: code
