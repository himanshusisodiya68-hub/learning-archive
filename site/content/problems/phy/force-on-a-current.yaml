- id: b1
  lvl: board
  kind: num
  q: A rod of mass 50 g and length 25 cm lies perpendicular to a horizontal magnetic field of 0.4 T on two horizontal rails. What current must flow in it to just lift it? Take g = 10 m/s². (Original problem.)
  ask: Current
  unit: A
  ans: 5
  tol: 0.01
  verify: 0.05*10/(0.4*0.25)
  sol: |
    The magnetic force must balance the weight: $BIl = mg$, so $I = \dfrac{mg}{Bl} = \dfrac{0.05\times10}{0.4\times0.25} = 5$ A.
  check: code

- id: b2
  lvl: board
  kind: text
  q: Name three devices that use the force on a current-carrying conductor in a magnetic field, and state the rule used to find the direction of the force. (Original problem.)
  sol: |
    Electric motors, loudspeakers, microphones and measuring instruments (galvanometer, ammeter, voltmeter). The direction is found by Fleming's left-hand rule.
