- id: m1
  lvl: main
  kind: num
  q: Two vectors $\mathbf A$ and $\mathbf B$ have equal magnitude. The magnitude of $\mathbf A + \mathbf B$ is equal to the magnitude of $\mathbf A$. Find the angle between $\mathbf A$ and $\mathbf B$. (Original problem.)
  ask: Angle between A and B
  unit: degrees
  ans: 120
  tol: 0.5
  verify: deg(acos(-0.5))
  sol: |
    Let $|\mathbf A| = |\mathbf B| = a$. Then
    $$|\mathbf A + \mathbf B|^2 = a^2 + a^2 + 2a^2\cos\theta = 2a^2(1 + \cos\theta).$$
    Setting this equal to $a^2$ gives $1 + \cos\theta = \tfrac12$, so $\cos\theta = -\tfrac12$ and $\theta = 120^\circ$. The three vectors $\mathbf A$, $\mathbf B$ and $-(\mathbf A+\mathbf B)$ then form an equilateral triangle.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A particle has initial velocity $(8\,\hat{\mathbf i} + 6\,\hat{\mathbf j})$ m/s and a constant acceleration $(-3\,\hat{\mathbf i} + 1\,\hat{\mathbf j})$ m s⁻². What is the least speed the particle reaches? (Original problem.)
  ask: Least speed
  unit: m/s
  ans: 8.22
  tol: 0.02
  verify: hypot(8-3*1.8, 6+1.8)
  sol: |
    The velocity is $\mathbf v = (8 - 3t)\,\hat{\mathbf i} + (6 + t)\,\hat{\mathbf j}$, so
    $$v^2 = (8-3t)^2 + (6+t)^2 .$$
    The speed is least when $\dfrac{d(v^2)}{dt} = 0$, which is the same as $\mathbf v\cdot\mathbf a = 0$ (velocity perpendicular to acceleration, so the speed is neither rising nor falling):
    $$-6(8 - 3t) + 2(6 + t) = 0 \Rightarrow 20t = 36 \Rightarrow t = 1.8\ \text{s}.$$
    Then $\mathbf v = 2.6\,\hat{\mathbf i} + 7.8\,\hat{\mathbf j}$ and $v_{\min} = \sqrt{2.6^2 + 7.8^2} = \sqrt{67.6} = 8.22\ \text{m s}^{-1}$. (The initial speed is 10 m/s.) The minimum speed is **not zero** because $\mathbf a$ is not antiparallel to $\mathbf v$.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A vector $\mathbf F$ of magnitude 20 units is to be resolved into two components along two directions that are not perpendicular. One direction makes $30^\circ$ with $\mathbf F$ on one side, the other makes $45^\circ$ with $\mathbf F$ on the other side. Find the magnitude of the component along the $30^\circ$ direction. (Original problem.)
  ask: Component along the 30° direction
  unit: units
  ans: 14.6
  tol: 0.05
  verify: 20*sin(rad(45))/sin(rad(105))
  sol: |
    Complete the parallelogram with $\mathbf F$ as the diagonal. The component $P$ along the $30^\circ$ direction and the component $Q$ along the $45^\circ$ direction, together with $\mathbf F$, form a triangle. Its angles are:
    - opposite $Q$: $30^\circ$ (the angle between $P$ and $F$),
    - opposite $P$: $45^\circ$ (the angle between $Q$ and $F$),
    - opposite $F$: $180^\circ - 75^\circ = 105^\circ$.

    By the law of sines,
    $$\frac{P}{\sin45^\circ} = \frac{Q}{\sin30^\circ} = \frac{F}{\sin105^\circ}.$$
    So $P = 20\times\dfrac{0.7071}{0.9659} = 14.6$ units and $Q = 20\times\dfrac{0.5}{0.9659} = 10.35$ units. (Neither is a projection of $\mathbf F$: when the directions are not perpendicular, the components are *not* $F\cos\theta$.)
  check: code
