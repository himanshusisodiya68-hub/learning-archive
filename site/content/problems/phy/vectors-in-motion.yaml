  q: The position of a particle moving in a plane is $\mathbf r = (2t^2)\,\hat{\mathbf i} + (3t - 1)\,\hat{\mathbf j}$ metres, with $t$ in seconds. Find the speed of the particle at $t = 1.5$ s. (Original problem.)
  ask: Speed at t = 1.5 s
  unit: m/s
