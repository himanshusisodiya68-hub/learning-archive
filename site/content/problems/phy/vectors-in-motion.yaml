    Direction: $\tan\alpha = \dfrac{B\sin\theta}{A + B\cos\theta} = \dfrac{7\sin60^\circ}{5 + 7\cos60^\circ} = \dfrac{6.06}{8.5} = 0.713$, so $\alpha = 35.5^\circ$ from the 5 N force toward the 7 N force.
