  sol: |
    $\mathbf v = \dfrac{d\mathbf r}{dt} = 4t\,\hat{\mathbf i} + 3\,\hat{\mathbf j}$ and $\mathbf a = 4\,\hat{\mathbf i}$ m s⁻². At $t = 1.5$ s, $\mathbf v = 6\,\hat{\mathbf i} + 3\,\hat{\mathbf j}$, so
