# Rolling motion. No NCERT example or exercise in Class XI Ch 6 (reprint 2026-27) belongs here: the reprint mentions rolling only in the chapter introduction, without questions. Every problem below is original (found, board and main).

- id: f1
  lvl: found
  kind: num
  q: A wheel of radius 0.40 m rolls without slipping along a straight road, with its centre moving at 6 m/s. Find its angular speed. (Original problem.)
  ask: Angular speed
  unit: rad/s
  ans: 15
  tol: 0.05
  verify: 6/0.4
  sol: |
    Rolling without slipping means the contact point is momentarily at rest, so $v_{cm}=\omega R$. Hence $\omega=v_{cm}/R=6/0.40=15$ rad/s. (Original problem.)
  check: code

- id: f2
  lvl: found
  kind: num
  q: A wheel rolls without slipping and its centre moves at 6 m/s. Find the speed of the topmost point of the wheel relative to the road. (Original problem.)
  ask: Speed of the top point
  unit: m/s
  ans: 12
  tol: 0.05
  verify: 6+6
  sol: |
    The top point has velocity $v_{cm}$ (translation) plus $\omega R=v_{cm}$ (rotation) in the same direction, so $v_{top}=2v_{cm}=12$ m/s. The bottom point has $v_{cm}-\omega R=0$. (Original problem.)
  check: code

- id: f3
  lvl: found
  kind: mcq
  q: A wheel rolls without slipping on a level road. At any instant, the point of the wheel touching the road is (Original problem)
  opts: ["moving forward with the speed of the centre", "moving backward with the speed of the centre", "at rest relative to the road", "moving with twice the speed of the centre"]
  ans: 2
  sol: The velocity of the contact point is the centre's velocity forward ($v_{cm}$) plus the rotational velocity backward ($\omega R=v_{cm}$), which cancel. That is exactly the no-slip condition, and it is why static (not kinetic) friction acts there. (Original problem.)
  check: none

- id: b1
  lvl: board
  kind: num
  q: A solid cylinder of mass 2 kg rolls without slipping along a level surface at 4 m/s. Find its total kinetic energy. (Original problem.)
  ask: Total kinetic energy
  unit: J
  ans: 24
  tol: 0.05
  verify: 0.5*2*4**2+0.5*(0.5*2)*4**2
  sol: |
    Translational part: $\tfrac12mv^2=\tfrac12(2)(16)=16$ J. Rotational part: $\tfrac12I\omega^2=\tfrac12\left(\tfrac12mR^2\right)\left(\tfrac vR\right)^2=\tfrac14mv^2=8$ J. Total $=\tfrac34mv^2=24$ J. (Original problem.)
  check: code

- id: b2
  lvl: board
  kind: num
  q: What fraction of the total kinetic energy of a solid sphere rolling without slipping is rotational? (Original problem.)
  ask: Rotational fraction
  unit: ""
  ans: 0.2857
  tol: 0.001
  verify: 0.4/(1+0.4)
  sol: |
    For a body with $I=kmR^2$ rolling without slipping, $K_{rot}=\tfrac12(kmR^2)(v/R)^2=\tfrac12kmv^2$ and $K_{tr}=\tfrac12mv^2$, so the rotational fraction is $\dfrac{k}{1+k}$. For the solid sphere $k=\tfrac25$: $\dfrac{2/5}{7/5}=\dfrac27\approx0.286$. For comparison a ring ($k=1$) gives $\tfrac12$ and a solid cylinder ($k=\tfrac12$) gives $\tfrac13$. (Original problem.)
  check: code

- id: b3
  lvl: board
  kind: num
  q: A solid cylinder starts from rest at the top of a rough incline of height 1.5 m and rolls down without slipping. Find its speed at the bottom. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Speed at the bottom
  unit: m/s
  ans: 4.43
  tol: 0.01
  verify: sqrt(4*9.8*1.5/3)
  sol: |
    Static friction does no work on a rolling body, so energy is conserved: $mgh=\tfrac12mv^2+\tfrac12I\omega^2=\tfrac34mv^2$ for the solid cylinder. Hence $v=\sqrt{\dfrac{4gh}{3}}=\sqrt{\dfrac{4(9.8)(1.5)}{3}}=\sqrt{19.6}=4.43$ m/s. A frictionless sliding block would reach $\sqrt{2gh}=5.42$ m/s; the difference went into rotation. The angle of the incline does not matter. (Original problem.)
  check: code

- id: b4
  lvl: board
  kind: num
  q: A ring and a solid sphere, equal in radius, are released together from the top of a long rough incline and roll without slipping. Find the ratio of the time the ring takes to reach the bottom to the time the sphere takes. (Original problem.)
  ask: Ratio $t_{ring}/t_{sphere}$
  unit: ""
  ans: 1.195
  tol: 0.002
  verify: sqrt((5/7)/(1/2))
  sol: |
    Down an incline of angle $\theta$, a body with $I=kmR^2$ rolling without slipping has $a=\dfrac{g\sin\theta}{1+k}$. Ring: $k=1$, $a_r=\tfrac12g\sin\theta$. Sphere: $k=\tfrac25$, $a_s=\tfrac57g\sin\theta$. Over the same length $s=\tfrac12at^2$, so $t\propto1/\sqrt a$:
    $$\frac{t_r}{t_s}=\sqrt{\frac{a_s}{a_r}}=\sqrt{\frac{5/7}{1/2}}=\sqrt{\frac{10}{7}}=1.195.$$
    The sphere wins. The ratio depends only on the shapes. (Original problem.)
  check: code

- id: m1
  lvl: main
  kind: num
  q: A uniform solid sphere rolls down a rough incline of angle 30° without slipping. Find its linear acceleration, and the force of friction as a fraction of its weight. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Linear acceleration
  unit: m/s²
  ans: 3.5
  tol: 0.01
  verify: 5/7*9.8*sin(rad(30))
  sol: |
    Along the incline: $mg\sin\theta-f=ma$. About the centre: $fR=I\alpha=\tfrac25mR^2(a/R)$, so $f=\tfrac25ma$. Adding, $mg\sin\theta=\tfrac75ma$ and
    $$a=\tfrac57g\sin\theta=\tfrac57(9.8)(0.5)=3.5\ \text{m/s}^2.$$
    Then $f=\tfrac25m(3.5)=1.4m$ N per kg, i.e. $f/(mg)=1.4/9.8=\tfrac17\approx0.143$. The friction acts up the slope and does no work, since the contact point does not move. (Original problem.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: A solid cylinder is to roll down a 30° incline without slipping. What is the smallest coefficient of static friction between the cylinder and the incline that allows this? (Original problem.)
  ask: Minimum coefficient of static friction
  unit: ""
  ans: 0.1925
  tol: 0.001
  verify: tan(rad(30))/3
  sol: |
    For a solid cylinder, $a=\tfrac23g\sin\theta$ and the friction required is $f=\tfrac12ma=\tfrac13mg\sin\theta$. The normal force is $N=mg\cos\theta$. Rolling without slipping needs $f\le\mu N$:
    $$\mu\ge\frac{\tfrac13mg\sin\theta}{mg\cos\theta}=\tfrac13\tan\theta=\tfrac13\tan30^\circ=0.192.$$
    For a ring, $f=\tfrac12mg\sin\theta$ and $\mu\ge\tfrac12\tan\theta$; for a solid sphere, $\mu\ge\tfrac27\tan\theta$. On a very slippery slope (smaller $\mu$) the body slides and spins at a lower rate instead. (Original problem.)
  check: code

- id: m3
  lvl: main
  kind: num
  q: A bowling ball (a uniform solid sphere) is thrown along a level lane so that it slides with speed 7.0 m/s and no spin. Friction between ball and lane acts until the ball rolls without slipping. Find its final speed of rolling. (Original problem.)
  ask: Final rolling speed
  unit: m/s
  ans: 5
  tol: 0.02
  verify: 5/7*7
  sol: |
    While the ball slides, kinetic friction acts at the contact point. Take angular momentum about a fixed point O on the lane, on the line of travel. The friction force is horizontal and acts at the lane surface, so its moment about O is zero. The weight and the normal force are equal, opposite and in the same vertical line, so their moments cancel. Hence the angular momentum about O is conserved.

    Initially the ball's centre moves at $v_0$ at height $R$ with no spin: $L=mv_0R$. Finally, rolling at $v$ with $\omega=v/R$:
    $$mv_0R=mvR+\tfrac25mR^2\,\frac vR=\tfrac75mvR\ \Rightarrow\ v=\tfrac57v_0=5.0\ \text{m/s}.$$
    The answer is independent of the friction coefficient $\mu$; $\mu$ only fixes the time, $t=\dfrac{2v_0}{7\mu g}$ (about 1.02 s for $\mu=0.20$). Kinetic energy is not conserved: it falls from $\tfrac12m(7.0)^2=24.5m$ to $\tfrac7{10}m(5.0)^2=17.5m$ joules, and the difference is heat from sliding friction. (Original problem.)
  check: code

- id: m4
  lvl: main
  kind: num
  q: A billiard ball is a uniform solid sphere of radius 2.8 cm. It lies on a level table and is struck by a cue with a horizontal impulse along a line in the vertical plane through its centre. At what height above its centre must the cue strike so that the ball begins to roll without slipping immediately? (Original problem.)
  ask: Height of the strike above the centre
  unit: cm
  ans: 1.12
  tol: 0.01
  verify: 0.4*2.8
  sol: |
    Let the impulse be $J$, applied at height $h$ above the centre. The centre gets $mv=J$ and the sphere gets angular momentum about its centre $I\omega=Jh$ with $I=\tfrac25mR^2$. Rolling without slipping from the start requires $v=\omega R$:
    $$\frac Jm=\frac{Jh}{\tfrac25mR^2}\,R\ \Rightarrow\ h=\tfrac25R=\tfrac25(2.8\ \text{cm})=1.12\ \text{cm}.$$
    Strike lower and the ball slides with backspin; strike higher and it has topspin and the table's friction drives it forward. The result is independent of the ball's mass. (Original problem.)
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A thin hoop rolls without slipping along a level floor and then up a smooth-surfaced but rough ramp, rising to a vertical height of 0.90 m before it momentarily stops. Find its speed on the level floor. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Speed on the floor
  unit: m/s
  ans: 2.97
  tol: 0.02
  verify: sqrt(9.8*0.9)
  sol: |
    Rolling without slipping, the friction does no work, so mechanical energy is conserved. For a hoop $k=1$, so the kinetic energy on the floor is $\tfrac12mv^2(1+1)=mv^2$. At the top it has stopped and all of it has become $mgh$. Hence $mv^2=mgh$ and $v=\sqrt{gh}=\sqrt{9.8\times0.90}=2.97$ m/s.

    A sliding block would need only $\sqrt{2gh}=4.2$ m/s, because it has no spin energy to supply. (Original problem.)
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A yo-yo is modelled as a uniform solid disc of mass 3.0 kg and radius 0.20 m, with a light string wound round its rim. The free end of the string is tied to the ceiling and the disc is released. Find the tension in the string while the disc falls. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Tension
  unit: N
  ans: 9.8
  tol: 0.05
  verify: 3*9.8/3
  sol: |
    Let the centre fall with acceleration $a$ and the disc spin with $\alpha=a/R$ (the string does not slip on the rim, so the top of the disc where the string leaves is at rest, as in rolling). Along the vertical, $mg-T=ma$. About the centre only the tension has a torque: $TR=I\alpha=\tfrac12mR^2\cdot a/R$, so $T=\tfrac12ma$.

    Then $mg-\tfrac12ma=ma$ gives $a=\tfrac23g=6.5$ m/s$^2$, and $T=\tfrac12m\cdot\tfrac23g=\tfrac13mg=\tfrac13\times3.0\times9.8=9.8$ N. The yo-yo falls at two thirds of free fall, and the string carries one third of the weight. (Original problem.)
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A wheel rolls without slipping with its centre moving at 4.0 m/s. A point on the rim is at the position where its radius makes an angle of 60° with the upward vertical (the top of the wheel is at 0°). Find the speed of that point relative to the road. (Original problem.)
  ask: Speed of the point
  unit: m/s
  ans: 6.93
  tol: 0.02
  verify: 2*4.0*cos(rad(30))
  sol: |
    At each instant the wheel turns about the contact point, so the speed of a point is $\omega$ times its distance from the contact point. The top is $2R$ away; a rim point at angle $\phi$ from the top is $2R\cos(\phi/2)$ away (by the right angle in a semicircle, the chord from the contact point to the rim point has this length). Its speed is $\omega\cdot2R\cos(\phi/2)=2v\cos(\phi/2)$.

    With $\phi=60^\circ$ and $v=4.0$ m/s: $2\times4.0\times\cos30^\circ=6.93$ m/s. (Original problem.)
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A spool has an outer radius $R=0.10$ m and an axle of radius $r=0.060$ m. A string leaves the bottom of the axle and is pulled with a force at an angle $\theta$ above the horizontal, on a rough table, so that the spool does not slip. Find the angle at which the spool neither rolls towards nor away from the person pulling. (Original problem.)
  ask: Critical angle
  unit: degrees
  ans: 53.13
  tol: 0.05
  verify: deg(acos(0.06/0.10))
  sol: |
    Take torques about the contact point $C$ of the spool with the table. The weight acts through the centre, which is directly above $C$, and the normal force and friction act at $C$ itself, so none of them has a torque about $C$. Only the string's force $F$ has a torque, equal to $F$ times the perpendicular distance from $C$ to the string.

    The string leaves the lower side of the axle, so it is a tangent to the axle circle (centre $O$ at height $R$ above $C$, radius $r$). The line makes angle $\theta$ with the horizontal; the distance from $O$ to it is $r$, and the distance from $C$ to it is $R\cos\theta-r$. The torque vanishes, and the spool stays put, when $R\cos\theta=r$:
    $$\theta=\cos^{-1}\frac rR=\cos^{-1}0.60=53.1^\circ.$$
    Below this angle the spool rolls towards the puller, above it away. (Original problem.)
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A uniform solid sphere of radius $R$ is launched along a rough horizontal floor with a forward speed of 4.0 m/s and a backspin, whose rim speed $\omega_0R$ is 7.0 m/s. Friction acts until the sphere rolls without slipping. Find its final speed and say which way it is moving (give the final speed as positive if it moves forward, negative if backward). (Original problem.)
  ask: Final velocity (forward positive)
  unit: m/s
  ans: 0.857
  tol: 0.005
  verify: (4.0-0.4*7.0)/1.4
  sol: |
    Take angular momentum about a point on the floor beneath the centre. Friction acts along the floor, so it has no torque about that point, and gravity and the normal force cancel. So that angular momentum is conserved.

    Initially the centre moves forward at $v_0=4.0$ m/s, giving $mv_0R$ (clockwise, say, for a ball moving to the right). Backspin turns the ball the other way, giving $-I\omega_0=-\tfrac25mR^2\omega_0$, so $L_i=mR\,(v_0-\tfrac25\omega_0R)$. Finally, rolling forward at $v$, $L_f=mvR+\tfrac25mR^2(v/R)=\tfrac75mvR$. Equating:
    $$v=\frac{v_0-\tfrac25\omega_0R}{1+\tfrac25}=\frac{4.0-2.8}{1.4}=0.857\ \text{m/s}.$$
    It ends up rolling slowly forward. Had the backspin been larger ($\omega_0R>10$ m/s) the answer would be negative: the ball would turn round and come back, as a well-struck "draw" shot in billiards does. (Original problem.)
  check: code
