- id: a2
  lvl: adv
  kind: num
  q: A glass sheet 10 µm thick ($n = 1.5$) is placed in the path of light of wavelength 500 nm. By how many wavelengths does it delay the light compared with the same thickness of air?
  ask: Extra wavelengths
  unit: ""
  ans: 10
  tol: 0.01
  verify: (1.5-1)*10e-6/500e-9
  sol: Extra optical path $(n - 1)t = 0.5 \times 10\ \mu\text{m} = 5\ \mu\text{m}$, which is $5/0.5 = 10$ wavelengths.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: Plane waves of wavelength 500 nm fall on an aperture, and the screen is 1.0 m away. Find the radius of the first Fresnel zone, as seen from the centre of the screen.
  ask: Radius
  unit: mm
  ans: 0.707
  tol: 0.005
  verify: sqrt(500e-9*1.0)*1000
  sol: $r_1 = \sqrt{\lambda L} = \sqrt{5 \times 10^{-7} \times 1.0} = 7.1 \times 10^{-4}$ m $\approx 0.71$ mm.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: Use Huygens' construction to prove the law of reflection for a plane wave meeting a plane mirror.
  hints: ["Let the wavefront AB touch the mirror at A while B is still a distance BC from it.", "In the time B takes to reach C, the wavelet from A grows to radius AE = BC."]
  sol: Let the incident wavefront AB meet the mirror at A, with B still a distance BC from the mirror. In the time B takes to travel BC, the wavelet from A grows to radius AE = BC (same medium, same speed). The reflected wavefront is the tangent from C to this wavelet, touching it at E. Triangles ABC and CEA are right-angled (at B and E), share the hypotenuse AC, and have BC = AE, so they are congruent. Hence the angle the incident wavefront makes with the mirror equals the angle the reflected wavefront makes with it, and since rays are perpendicular to wavefronts, $i = r$.
  check: none
