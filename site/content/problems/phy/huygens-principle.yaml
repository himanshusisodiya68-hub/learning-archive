- id: a1
  lvl: adv
  kind: num
  q: How many wavelengths of light of vacuum wavelength 500 nm fit into a 1.0 mm thick glass plate of refractive index 1.5?
  ask: Number of wavelengths
  unit: ""
  ans: 3000
  tol: 1
  verify: 1e-3*1.5/500e-9
  sol: $nd/\lambda = 1.5 \times 10^{-3}/5 \times 10^{-7} = 3000$.
