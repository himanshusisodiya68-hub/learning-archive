- id: m1
  lvl: main
  kind: num
  q: The hydrogen line at 656.3 nm is observed in the light of a galaxy receding at 1.0% of the speed of light. By how much is the line shifted?
  ask: Shift
  unit: nm
  ans: 6.56
  tol: 0.02
  verify: 656.3*0.01
  sol: $\Delta\lambda = \lambda v/c = 656.3 \times 0.010 = 6.6$ nm towards the red, so the line appears at about 662.9 nm.
  check: code

- id: m2
  lvl: main
  kind: num
  q: Light crosses 2.0 cm of glass ($n = 1.5$) and then 3.0 cm of air. What is the total optical path length?
  ask: Optical path
  unit: cm
  ans: 6
  tol: 0.01
  verify: 2*1.5+3
  sol: $1.5 \times 2.0 + 1.0 \times 3.0 = 6.0$ cm. Light takes as long as it would to cross 6.0 cm of vacuum.
