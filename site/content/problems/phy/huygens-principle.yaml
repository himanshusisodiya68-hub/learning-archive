# Huygens' principle. NCERT questions copied word for word from NCERT Physics Class XII (reprint 2026-27), Ch 10.

- id: ncert12-eg-10-1
  lvl: ncert-intext
  num: "XII Ex 10.1"
  source: NCERT XII Physics · Ch 10 · Example 10.1
  kind: text
  q: (a) When monochromatic light is incident on a surface separating two media, the reflected and refracted light both have the same frequency as the incident frequency. Explain why? (b) When light travels from a rarer to a denser medium, the speed decreases. Does the reduction in speed imply a reduction in the energy carried by the light wave? (c) In the wave picture of light, intensity of light is determined by the square of the amplitude of the wave. What determines the intensity of light in the photon picture of light.
  sol: |
    (a) Reflection and refraction happen because light makes the charged particles in atoms oscillate. A driven oscillator vibrates at the frequency of the driving force, and it radiates at its own frequency of oscillation. So the reflected and refracted light have the same frequency as the incident light.
    (b) No. The energy carried by a wave depends on its amplitude, not on its speed.
    (c) For light of a given frequency, the intensity is set by the number of photons crossing unit area per unit time.
  check: none

- id: ncert12-ex-10-1
  lvl: ncert-ex
  num: "XII 10.1"
  source: NCERT XII Physics · Ch 10 · Exercise 10.1
  kind: num
  q: Monochromatic light of wavelength 589 nm is incident from air on a water surface. What are the wavelength, frequency and speed of (a) reflected, and (b) refracted light? Refractive index of water is 1.33.
  ask: Wavelength of the refracted light
  unit: nm
  ans: 443
  tol: 1.5
  verify: 589/1.33
  sol: |
    (a) Reflected light stays in air: $\lambda = 589$ nm, $\nu = c/\lambda = 3.00 \times 10^8/589 \times 10^{-9} = 5.09 \times 10^{14}$ Hz, speed $3.00 \times 10^8$ m/s.
    (b) Refracted light: the frequency is unchanged, $5.09 \times 10^{14}$ Hz; the speed is $c/n = 2.26 \times 10^8$ m/s; the wavelength is $589/1.33 \approx 443$ nm (NCERT quotes 444 nm).
  answer_key: "(a) λ = 589 nm, ν = 5.09 × 10¹⁴ Hz, c = 3.00 × 10⁸ m s⁻¹ (b) ν = 5.09 × 10¹⁴ Hz, v = 2.26 × 10⁸ m s⁻¹, λ = 444 nm"
  check: both

- id: ncert12-ex-10-2
  lvl: ncert-ex
  num: "XII 10.2"
  source: NCERT XII Physics · Ch 10 · Exercise 10.2
  kind: text
  q: |
    What is the shape of the wavefront in each of the following cases:
    (a) Light diverging from a point source.
    (b) Light emerging out of a convex lens when a point source is placed at its focus.
    (c) The portion of the wavefront of light from a distant star intercepted by the Earth.
  sol: |
    (a) Spherical. (b) Plane: the lens turns the diverging spherical wavefront into a parallel beam. (c) Plane: a small area of a very large sphere is nearly flat.
  answer_key: (a) Spherical (b) Plane (c) Plane (a small area on the surface of a large sphere is nearly planar).
  check: ncert-key

- id: ncert12-ex-10-3
  lvl: ncert-ex
  num: "XII 10.3"
  source: NCERT XII Physics · Ch 10 · Exercise 10.3
  kind: num
  q: (a) The refractive index of glass is 1.5. What is the speed of light in glass? (Speed of light in vacuum is $3.0 \times 10^8$ m s$^{-1}$) (b) Is the speed of light in glass independent of the colour of light? If not, which of the two colours red and violet travels slower in a glass prism?
  ask: Speed in glass, in units of 10⁸ m/s
  unit: × 10⁸ m/s
  ans: 2
  tol: 0.01
  verify: 3/1.5
  sol: (a) $v = c/n = 2.0 \times 10^8$ m/s. (b) No. The refractive index depends on wavelength; glass has a larger index for violet than for red (violet deviates more in a prism), so **violet travels slower**.
  answer_key: (a) 2.0 × 10⁸ m s⁻¹ (b) No; violet travels slower (n_v > n_r).
  check: both

