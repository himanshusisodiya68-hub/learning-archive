- id: a2
  lvl: adv
  kind: num
  q: A bare glass fibre ($n = 1.50$) with no cladding is immersed in water ($n = 1.33$). What is the largest angle to the axis, measured in the water, at which light can enter the end and still be guided?
  ask: Acceptance angle in water
  unit: "°"
  ans: 31.4
  tol: 0.2
  verify: deg(asin(sqrt(1.5**2-1.33**2)/1.33))
  hints: ["Now the outside medium for both the end face and the wall is water: n₀ sin θ = √(n₁² − n₂²)."]
  sol: $1.33\sin\theta_{\max} = \sqrt{1.50^2 - 1.33^2} = 0.694$, so $\sin\theta_{\max} = 0.522$ and $\theta_{\max} \approx 31.4^\circ$.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: In a 1.0 km step-index fibre with core index 1.50 and cladding index 1.45, light travelling along the axis and light bouncing at the critical angle arrive at different times. Estimate the difference.
  ask: Time difference
  unit: ns
  ans: 172
  tol: 1
  verify: (1000*1.5/3e8)*(1.5/1.45-1)*1e9
  hints: ["The zigzag path is longer by the factor 1/sin θc = n₁/n₂."]
  sol: |
    The axial ray takes $t = Ln_1/c = 5.00\ \mu$s. The critical ray's path is longer by $n_1/n_2$, so the difference is $\Delta t = \frac{Ln_1}{c}\left(\frac{n_1}{n_2} - 1\right) = 5.00\ \mu\text{s} \times 0.0345 \approx 172$ ns. Pulses closer together than this blur into each other, limiting the data rate.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: Light of wavelength 600 nm is totally reflected inside glass ($n = 1.50$) at an angle of incidence of 60° on a glass–air surface. Estimate the decay length of the evanescent wave in the air, $\delta = \lambda/(2\pi\sqrt{n^2\sin^2\theta - 1})$.
  ask: Decay length
  unit: nm
  ans: 115
  tol: 1
  verify: 600/(2*PI*sqrt(1.5**2*sin(rad(60))**2-1))
  sol: $n^2\sin^2\theta - 1 = 2.25 \times 0.75 - 1 = 0.6875$, so $\delta = 600/(2\pi \times 0.829) \approx 115$ nm. A second glass surface brought within about this distance lets a significant fraction of the light through.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: Show that light entering the flat end of a fibre (core $n_1$, cladding $n_2$) from a medium of index $n_0$ is guided if and only if $n_0\sin\theta < \sqrt{n_1^2 - n_2^2}$, where $\theta$ is its angle to the axis.
  hints: ["Refraction at the end face gives n₀ sin θ = n₁ sin r.", "TIR at the wall needs n₁ cos r > n₂."]
  sol: At the end face $n_0\sin\theta = n_1\sin r$. The ray then meets the wall at angle $90^\circ - r$ to its normal, and TIR requires $n_1\sin(90^\circ - r) > n_2$, i.e. $n_1\cos r > n_2$. Squaring, $n_1^2(1 - \sin^2 r) > n_2^2$, so $n_1^2\sin^2 r < n_1^2 - n_2^2$, which is $n_0^2\sin^2\theta < n_1^2 - n_2^2$. Each step is reversible, so the condition is necessary and sufficient.
  check: none
