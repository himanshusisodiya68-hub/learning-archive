# Total internal reflection. NCERT questions copied word for word from NCERT Physics Class XII (reprint 2026-27), Ch 9.

- id: ncert12-ex-9-5
  lvl: ncert-ex
  num: "XII 9.5"
  source: NCERT XII Physics · Ch 9 · Exercise 9.5
  kind: num
  q: A small bulb is placed at the bottom of a tank containing water to a depth of 80cm. What is the area of the surface of water through which light from the bulb can emerge out? Refractive index of water is 1.33. (Consider the bulb to be a point source.)
  ask: Area
  unit: m²
  ans: 2.6
  tol: 0.05
  verify: PI*(0.8*tan(asin(1/1.33)))**2
  hints: ["Light reaching the surface beyond the critical angle is totally reflected.", "Radius r = h tan θc."]
  sol: |
    $\sin\theta_c = 1/1.33 = 0.752$, so $\theta_c = 48.8^\circ$ and $\tan\theta_c = 1.14$. The radius of the lit circle is $r = 0.80 \times 1.14 = 0.91$ m, so the area is $\pi r^2 \approx 2.6$ m².
  answer_key: r = 0.8 × tan ic and sin ic = 1/1.33 ≅ 0.75, where r is the radius (in m) of the largest circle from which light comes out; Area = 2.6 m²
  check: both

- id: ncert12-ex-9-17
  lvl: ncert-ex
  num: "XII 9.17"
  source: NCERT XII Physics · Ch 9 · Exercise 9.17
  kind: num
  q: (a) Figure 9.28 shows a cross-section of a 'light pipe' made of a glass fibre of refractive index 1.68. The outer covering of the pipe is made of a material of refractive index 1.44. What is the range of the angles of the incident rays with the axis of the pipe for which total reflections inside the pipe take place, as shown in the figure. (b) What is the answer if there is no outer covering of the pipe?
  ask: Largest angle of incidence for part (a)
  unit: "°"
  ans: 60
  tol: 0.5
  verify: deg(asin(sqrt(1.68**2-1.44**2)))
  hints: ["Critical angle at the core–covering boundary: sin ic′ = 1.44/1.68.", "The refraction angle at the end face must satisfy r ≤ 90° − ic′."]
  sol: |
    (a) $\sin i_c' = 1.44/1.68$, so $i_c' = 59^\circ$. TIR at the wall needs the wall angle $> 59^\circ$, i.e. the refraction angle at the end face $r < 31^\circ$. Then $\sin i_{\max} = 1.68\sin 31^\circ$, giving $i_{\max} \approx 60^\circ$ (equivalently $\sin i_{\max} = \sqrt{1.68^2 - 1.44^2}$). All rays with $0 < i < 60^\circ$ are totally reflected.
    (b) With air outside, $i_c' = \sin^{-1}(1/1.68) = 36.5^\circ$. Even $i = 90^\circ$ gives $r = 36.5^\circ$ and a wall angle of $53.5^\circ > 36.5^\circ$, so every ray entering the end face is totally reflected.
  answer_key: "(a) ic′ = 59°; total internal reflection when r < rmax = 31°; imax ~ 60°, so all incident rays with 0 < i < 60° suffer total internal reflection. (b) ic′ = 36.5°; all incident rays (in the range 53.5° < i < 90°) suffer total internal reflection."
  check: both

- id: f1
