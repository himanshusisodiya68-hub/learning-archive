- id: b2
  lvl: board
  kind: mcq
  q: Why does a well-cut diamond sparkle so much more than glass of the same shape?
  opts: ["It reflects more at its outer surface", "Its small critical angle traps light by repeated total internal reflection", "It emits its own light"]
  ans: 1
  sol: Diamond's critical angle (24.4°) is much smaller than glass's (about 42°), so light inside a cut diamond is totally reflected many times and leaves mainly through the top, in bright flashes.
  check: none

- id: m1
  lvl: main
  kind: num
  q: Light enters a 45°–90°–45° prism normally through one of its short faces. What is the minimum refractive index for which it is totally reflected at the long face?
  ask: Minimum n
  unit: ""
  ans: 1.414
  tol: 0.005
  verify: 1/sin(rad(45))
  sol: Inside the prism the light meets the long face at 45°. TIR needs $45^\circ > \theta_c$, i.e. $\sin 45^\circ > 1/n$, so $n > \sqrt2 \approx 1.414$. Ordinary glass ($n \approx 1.5$) qualifies.
  check: code

- id: m2
  lvl: main
  kind: num
  q: An optical fibre has a core of refractive index 1.50 and a cladding of 1.45. Find the largest angle to the axis at which light in air can enter the end and still be guided.
  ask: Acceptance angle
  unit: "°"
  ans: 22.6
  tol: 0.2
  verify: deg(asin(sqrt(1.5**2-1.45**2)))
  sol: $\sin\theta_{\max} = \sqrt{1.50^2 - 1.45^2} = \sqrt{0.1475} = 0.384$, so $\theta_{\max} \approx 22.6^\circ$.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A diver 3.0 m below a calm water surface ($n = 4/3$) looks up. What is the radius of the circle through which she sees the sky?
  ask: Radius
  unit: m
  ans: 3.4
  tol: 0.03
  verify: 3*tan(asin(3/4))
  sol: $\sin\theta_c = 3/4$, $\tan\theta_c = 3/\sqrt7 = 1.134$, so $r = 3.0 \times 1.134 = 3.4$ m.
  check: code

