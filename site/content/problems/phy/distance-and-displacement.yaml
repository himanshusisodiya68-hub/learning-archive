  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q3
  kind: mcq
  q: |-
    Which of the following is not a standard unit of measuring length?
  opts: ["millimetre", "centimetre", "kilometre", "handspan"]
  ans: 3
  sol: |
    The **handspan** is not a standard unit, because its size differs from person to person. Millimetre, centimetre and kilometre are all fixed multiples or fractions of the SI unit, the metre.
