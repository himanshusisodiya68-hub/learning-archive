  q: The wheel of a bicycle has a circumference of 2.1 m. A counter shows that it turns 500 times between two lamp posts on a straight road. What is the distance between the posts? (Original problem.)
  ask: Distance between the posts
  unit: m
  ans: 1050
  tol: 0.5
  verify: 2.1*500
  sol: |
    Each turn moves the bicycle forward by one circumference, so $\text{distance} = 500\times2.1 = 1050$ m $= 1.05$ km. This is the idea of the bicycle-wheel distance meter at the end of the Class 6 chapter.
