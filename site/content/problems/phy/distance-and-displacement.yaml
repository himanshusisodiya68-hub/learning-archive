- id: b3
  lvl: board
  kind: num
  q: A runner runs half a lap round a circular track of radius 35 m, from one end of a diameter to the other. Find the distance run. Also state the magnitude of her displacement. (Original problem.)
  ask: Distance run
  unit: m
  ans: 109.96
  tol: 0.05
  verify: PI*35
  sol: |
    Half the circumference: $\pi r = \pi\times35 = 109.96 \approx 110$ m.

    The displacement is the straight line joining her start to her finish, which is a diameter: $2r = 70$ m. The distance (110 m) is larger than the magnitude of displacement (70 m) because the path is curved.
