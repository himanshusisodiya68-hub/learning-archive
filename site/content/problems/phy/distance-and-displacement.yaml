# Distance and displacement. NCERT questions copied word for word from NCERT Science Grade 6 (Curiosity, reprint 2026-27) Ch 5, NCERT Science Grade 9 (Exploration, 2026-27) Ch 4 and NCERT Physics Class XI (reprint 2026-27) Ch 2. Grades 6 and 9 have no printed answer key, so those solutions are ours. Found, board and main problems are original.

- id: ncert6-it-5-1
  lvl: ncert-intext
  num: "VI 5 · Intro"
  source: NCERT Grade 6 Science · Ch 5 · Chapter opening questions
  kind: text
  q: |-
    Are the tape and rod similar to the scale that the elder sister has in her geometry box? What did mother mean by char angula?
  sol: |
    All three are length-measuring devices: each has equally spaced markings and is laid against the object, so they work on the same idea. They differ in size and material. The shopkeeper's metal rod and the geometry-box scale are rigid; the tailor's tape is flexible so that it can go round the body.

    *Char angula* means "four angulas". The **angula** is an old Indian unit of length, the width of a finger, so *char angula* is the width of four fingers. The mother is asking the tailor to lengthen the uniform by about four finger-widths.

    [Note] A finger-width differs from person to person, which is exactly the weakness of body-part units that the chapter goes on to discuss.
  check: none

- id: ncert6-it-5-2
  lvl: ncert-intext
  num: "VI 5 · §5.1"
  source: NCERT Grade 6 Science · Ch 5 · §5.1 How do we Measure?
  kind: text
  q: |-
    But why should the number be different?
  sol: |
    Hardeep asks this after the five friends measure the same table with their own handspans and get slightly different counts (Table 5.1: 13, 14, between 13 and 14, and so on).

    The table has one fixed length, but each friend's handspan is a different length. A bigger handspan fits fewer times along the table and a smaller one fits more times. The number of units depends on the size of the unit, and here the unit differs from person to person. This is why a standard unit and a common scale are needed.
  check: none

- id: ncert6-it-5-3
  lvl: ncert-intext
  num: "VI 5 · §5.2"
  source: NCERT Grade 6 Science · Ch 5 · §5.2 Standard Units
  kind: text
  q: |-
    Would it be convenient to use the unit metre to measure larger lengths, such as the length of a railway track between two cities, or to measure smaller lengths, such as the thickness of a page of a book?
  sol: |
    No, not for either. A railway track between two cities is hundreds of thousands of metres long, so the number would be huge and awkward. The thickness of a page is a tiny fraction of a metre, so the number would be a long decimal. It is more convenient to choose a unit close to the size being measured: the **kilometre** (1 km = 1000 m) for the track and the **millimetre** (1 mm = 0.1 cm) for the page.
  check: none

- id: ncert6-it-5-4
  lvl: ncert-intext
  num: "VI 5 · §5.3"
  source: NCERT Grade 6 Science · Ch 5 · §5.2 (speech bubble)
  kind: text
  q: |-
    Suppose we all measure the length of the table again, but this time using a metre scale. Will the results still be different?
  sol: |
    The results will agree far more closely than with handspans, because everyone is now using the same unit with the same markings. Small differences can still remain, for example from placing the scale a little crookedly, from reading it with the eye off the correct position, or from the smallest division being 1 mm. The big disagreement caused by different units disappears.
  check: none

- id: ncert6-it-5-5
  lvl: ncert-intext
  num: "VI 5 · §5.3"
  source: NCERT Grade 6 Science · Ch 5 · §5.3 Correct Way of Measuring Length
  kind: text
  q: |-
    Why are some length measuring devices made up of flexible materials?
  sol: |
    Some things cannot be measured with a rigid straight scale: the girth of a tree, the size of a chest, a curved line. A flexible material such as the cloth or plastic of a tailor's tape can bend to follow the curve, while a rigid metre scale cannot. The material must still not stretch, or the markings would no longer be equally spaced.
  check: none

- id: ncert6-it-5-6
  lvl: ncert-intext
  num: "VI 5 · §5.4"
  source: NCERT Grade 6 Science · Ch 5 · §5.4 Measuring the length of a curved line
  kind: text
  q: |-
    How would they have measured the required length of string lights?
  sol: |
    The lights hang along curved arches, so a straight scale will not do. Either use a **flexible measuring tape** laid along the curve, or lay a **thread** along the curved line, mark its two ends, straighten it and measure that length with a metre scale (Fig. 5.8).
  check: none

- id: ncert6-it-5-7
  lvl: ncert-intext
  num: "VI 5 · §5.5"
  source: NCERT Grade 6 Science · Ch 5 · §5.5 Describing Position
  kind: text
  q: |-
    Who do you think is correct?
  sol: |
    The question follows the argument among Deepa, Anish, Hardeep, Tasneem and Padma about whether the garden is closer than the school (Fig. 5.9). The book's answer is that **all of them are correct**. Each child is comparing distances from his or her own house, and the houses are in different places. If everyone measured from the same point, say the bus stand, they would all agree.
  check: none

- id: ncert6-it-5-8
  lvl: ncert-intext
  num: "VI 5 · §5.5"
  source: NCERT Grade 6 Science · Ch 5 · §5.5 Describing Position (kilometre stone)
  kind: text
  q: |-
    What do such kilometre stones indicate? How could Padma conclude that she was getting closer to her destination?
  sol: |
    A kilometre stone such as "Delhi 70 km" states the **distance of that spot from Delhi**; Delhi is the reference point. Padma first read 70 km and then 60 km. The number written on the stone, her distance from the reference point, was decreasing, so she was getting closer to her grandparents' house.
  check: none

- id: ncert6-it-5-9
  lvl: ncert-intext
  num: "VI 5 · §5.5"
  source: NCERT Grade 6 Science · Ch 5 · §5.5 Describing Position
  kind: text
  q: |-
    Does this mean that the position of Padma, with respect to the reference point, is changing with time? When does the position of an object change with respect to a reference point? Does it change when an object is moving?
  sol: |
    Yes. Her distance from Delhi changed from 70 km to 60 km as time passed, so her position with respect to the reference point (Delhi) is changing with time.

    The position of an object changes with respect to a reference point when the object **moves**. If it is not moving, its distance and direction from the reference point stay the same.
  check: none

- id: ncert6-it-5-10
  lvl: ncert-intext
  num: "VI 5 · §5.6"
  source: NCERT Grade 6 Science · Ch 5 · §5.6 Moving Things (after Activity 5.2)
  kind: text
  q: |-
    Compare and analyse your justifications. How can one decide if an object is in motion or at rest?
  sol: |
    Pick a **reference point**, then watch whether the object's position with respect to it changes with time. If the position changes, the object is in motion; if it does not, the object is at rest. For example, a grazing cow keeps changing its position relative to the fence over the day (in motion), while a tree stays at the same distance and direction from the fence (at rest).
  check: none

- id: ncert6-it-5-11
  lvl: ncert-intext
  num: "VI 5 · Think it over!"
  source: NCERT Grade 6 Science · Ch 5 · §5.6 Moving Things, Think it over!
  kind: text
  q: |-
    Suppose you are travelling on a ship which is moving at a constant speed along a straight line on a calm sea. Suppose there is no window on the ship. Is there any way that you can determine whether the ship is moving or is stationary?
  sol: |
    Inside a closed cabin you cannot tell. Everything in the cabin, including you, moves with the ship, so your position with respect to the walls, the floor and the objects around you does not change either way. Only a reference point outside the ship (the shore, a star, a passing ship) can show whether the ship is moving.

    This is the idea that rest and motion depend on the reference point. [Inference] Physics later turns this into the statement that no experiment inside a room moving steadily in a straight line can show that it moves; the book only hints at this idea here.
  check: none

