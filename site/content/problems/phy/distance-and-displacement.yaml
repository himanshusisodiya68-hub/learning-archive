- id: ncert6-ex-5-6
  lvl: ncert-ex
  num: "VI 5 · Q6"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q6
  kind: text
  q: |-
    Take a tumbler or a bottle. Measure the length of the curved part of the base of glass or bottle and record it.
  sol: |
    The base is curved, so a straight scale cannot follow it. Method (Fig. 5.8): wrap a thread once round the curved part of the base, mark the point where it meets itself, straighten the thread and measure it against a metre scale or 15-cm scale. Or wrap a flexible measuring tape round it.

    Record the result as a number with a unit, with a space between them, for example "22.0 cm". Your value depends on your tumbler or bottle.

    Check: the curved length of a circular base is the circumference $= \pi d$. For a base of diameter 7 cm it would be about $3.14\times7 = 22$ cm. (This example value is ours, not from the book.)
