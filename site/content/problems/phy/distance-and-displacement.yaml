- id: ncert6-ex-5-4
  lvl: ncert-ex
  num: "VI 5 · Q4"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q4
  kind: text
  q: |-
    Search for the different scales or measuring tapes at your home and school. Find out the smallest value that can be measured using each of these scales. Record your observations in a tabular form.
  sol: |
    This is a hands-on task, so your table will depend on what you find. The smallest value a scale can measure is the length between two neighbouring marks (its **least count**). A typical table:

    | Scale or tape | Unit marked | Smallest value it can measure |
    |---|---|---|
    | 15-cm geometry-box scale | cm and mm | 1 mm (0.1 cm) |
    | Metre scale (wooden or steel) | cm and mm | 1 mm |
    | Tailor's tape | cm (and inches) | usually 1 mm or 0.5 cm |
    | Carpenter's steel tape | cm and mm | 1 mm |

    The values in this table are typical, not taken from the book; check against the scales you actually have. Look at the markings on each one and count how many divisions fit between two numbered marks.
  check: none

