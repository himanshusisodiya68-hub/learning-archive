- id: ncert6-ex-5-2
  lvl: ncert-ex
  num: "VI 5 · Q2"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q2
  kind: text
  q: |-
    Read the following statements and mark True (T) or False (F) against each.
    (i) The motion of a car moving on a straight road is an example of linear motion.
    (ii) Any object which is changing its position with respect to a reference point with time is said to be in motion.
    (iii) 1 km = 100 cm
  sol: |
    (i) **True.** Motion along a straight line is linear motion.

    (ii) **True.** This is the definition of motion in the chapter.

    (iii) **False.** 1 km = 1000 m and 1 m = 100 cm, so 1 km = 1000 × 100 cm = 100 000 cm.
  check: none

- id: ncert6-ex-5-3
  lvl: ncert-ex
