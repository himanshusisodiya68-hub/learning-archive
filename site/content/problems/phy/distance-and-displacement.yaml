- id: ncert6-ex-5-7
  lvl: ncert-ex
  num: "VI 5 · Q7"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q7
  kind: text
  q: |-
    Measure the height of your friend and express it in (i) metres (ii) centimetres and (iii) millimetres.
  sol: |
    Stand your friend straight against a wall, mark the top of the head, and measure from the floor to the mark. Then convert using 1 m = 100 cm and 1 cm = 10 mm.

    Worked pattern (the height 1.45 m is an example of ours, not the book's):

    (i) 1.45 m
    (ii) $1.45\times100 = 145$ cm
    (iii) $145\times10 = 1450$ mm

    The same height, three numbers: the smaller the unit, the larger the number.
  check: none

- id: ncert6-ex-5-8
  lvl: ncert-ex
  num: "VI 5 · Q8"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q8
  kind: text
  q: |-
    You are given a coin. Estimate how many coins are required to be placed one after the other lengthwise, without leaving any gap between them, to cover the whole length of the chosen side of a notebook. Verify your estimate by measuring the same side of the notebook and the size of the coin using a 15-cm scale.
  sol: |
    **Estimate:** lay a coin on the notebook edge and judge how many such widths fit, say about 8.

    **Verify:** measure the side of the notebook (it may be longer than 15 cm, so measure it in two steps using a mark, or use a metre scale), and measure the diameter of the coin. Then

    $$\text{number of coins} = \frac{\text{length of the side}}{\text{diameter of one coin}}.$$

    Example with numbers of ours (not the book's): side 21.0 cm, coin diameter 2.5 cm, so $21.0/2.5 = 8.4$, about 8 coins with a small gap left over. Your values will differ.
  check: none

- id: ncert6-ex-5-9
  lvl: ncert-ex
  num: "VI 5 · Q9"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q9
  kind: text
  q: |-
    Give two examples each for linear, circular and oscillatory motion.
  sol: |
    | Type | Meaning | Examples |
    |---|---|---|
    | Linear | along a straight line | a car on a straight road; an apple falling straight down |
    | Circular | along a circular path | the tip of a clock's hand; a merry-go-round |
    | Oscillatory | to and fro about a fixed position | a swing; a pendulum bob |

    Both circular and oscillatory motion are also **periodic**: they repeat after a fixed interval of time.
