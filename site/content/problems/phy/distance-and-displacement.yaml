- id: ncert6-ex-5-12
  lvl: ncert-ex
  num: "VI 5 · Q12"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q12
  kind: text
  q: |-
    Tasneem wants to make a metre scale by herself. She considers the following materials for it—plywood, paper, cloth, stretchable rubber and steel. Which of these should she not use and why?
  sol: |
    She should not use **stretchable rubber**. It stretches when pulled or even when handled, so the distance between two marks would change from one measurement to the next and the readings would not be reliable. (Cloth and paper also stretch or sag a little and tear easily, so they are poor choices for a long-lasting rigid metre scale, but rubber is the clear failure.) Plywood and steel hold their length and keep their markings.
  check: none

- id: ncert6-ex-5-13
  lvl: ncert-ex
  num: "VI 5 · Q13"
  source: NCERT Grade 6 Science · Ch 5 · Let us enhance our learning Q13
  kind: text
  q: |-
    Think, design and develop a card game on conversion of units of length to play with your friends.
  sol: |
    This is a design task with no single answer. One simple design:

    - Make cards in pairs: one card shows a length such as "2.5 km", its partner shows the same length in another unit, "2500 m".
    - Mix the cards face down. Players turn over two cards in turn; if they show the same length, the player keeps the pair, otherwise both go back.
    - The player with most pairs wins.

    Use only these conversions: 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm. Add harder pairs such as 0.35 m and 350 mm for a second round.
