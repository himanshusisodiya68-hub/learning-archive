- id: ncert9-it-4-2b
  lvl: ncert-intext
  num: "IX 4 · §4.1.2"
  source: NCERT Grade 9 Science · Ch 4 · §4.1.2 Distance travelled and displacement
  kind: text
  q: |-
    We find that between these two instants, the total distance travelled and the magnitude of displacement are not equal. Can these quantities ever be equal?
  sol: |
    Yes. The magnitude of displacement is the straight-line separation of the end points, and the distance is the length of the path actually followed. They are equal when the object moves along a straight line without turning back, that is, when it keeps moving in one direction (the book's margin note says the same). If the object ever reverses or curves, the path is longer than the straight-line separation, so distance exceeds the magnitude of displacement.
  check: none

- id: ncert9-it-4-3
  lvl: ncert-intext
  num: "IX 4 · Activity 4.1"
  source: |
    NCERT Grade 9 Science · Ch 4 · Activity 4.1: Let us analyse
  kind: mcq
  q: |-
    As shown in Fig. 4.5, a ball is thrown vertically upwards from O. It moves up straight till B and then falls back to O. Can this be considered a motion in a straight line? For this motion, fill up the values in Table 4.1. Analyse the data filled in Table 4.1 and choose which of the following is true for displacement:
    (i) It is never zero.
    (ii) Its magnitude can be greater than the total distance travelled.
    (iii) Its magnitude is less than or equal to the total distance travelled.
    (iv) Its magnitude is less than the total distance travelled in all cases.
  opts: ["It is never zero.", "Its magnitude can be greater than the total distance travelled.", "Its magnitude is less than or equal to the total distance travelled.", "Its magnitude is less than the total distance travelled in all cases."]
  ans: 2
  sol: |
    Yes, the ball goes up and comes back along the same straight line, so this is motion in a straight line.

    From Fig. 4.5 the points are O at 0 cm, A at 40 cm, C at 80 cm and B at 140 cm (the top). Table 4.1:

    | Position | Total distance travelled from O | Displacement from O |
    |---|---|---|
    | O | 0 cm | 0 cm |
    | A (going up) | 40 cm | 40 cm upward |
    | B | 140 cm | 140 cm upward |
    | C (coming down) | 140 + 60 = 200 cm | 80 cm upward |
    | O (back) | 140 + 140 = 280 cm | 0 cm |

    Look at the rows. At A (going up) the magnitude of displacement equals the distance, which kills (iv). At O (back) the displacement is zero, which kills (i). Distance is never smaller than the magnitude of displacement, which kills (ii). So **(iii)** is true: the magnitude of displacement is less than or equal to the distance, with equality only when the object does not turn back.
  check: none

- id: ncert9-it-4-4
  lvl: ncert-intext
  num: "IX 4 · Pause 1"
  source: NCERT Grade 9 Science · Ch 4 · Pause and Ponder Q1
  kind: text
  q: |-
    In the example of an athlete running back and forth on a straight track (Fig. 4.4), when will the displacement of the athlete be zero? What will be the total distance travelled in that case?
  sol: |
    The displacement is zero whenever the athlete is back at her starting position O, because displacement is the net change in position. If she runs from O to A (100 m) and back to O, the total distance travelled is $100 + 100 = 200$ m while the displacement is 0.

    In general, if she makes any number of trips and ends at O, the distance travelled is a positive number (here 200 m, 400 m, ...) but the displacement is zero.
  check: none

- id: ncert9-it-4-5
  lvl: ncert-intext
  num: "IX 4 · Pause 2"
  source: NCERT Grade 9 Science · Ch 4 · Pause and Ponder Q2
  kind: mcq
  q: |-
    Fuel used up in a vehicle depends on which of the following? Justify your answer.
    (i) Total distance travelled
    (ii) Displacement
  opts: ["Total distance travelled", "Displacement"]
  ans: 0
  sol: |
    **(i) Total distance travelled.** The engine burns fuel all along the path actually driven, whatever its shape. A car that goes 20 km out and 20 km back has a displacement of zero, yet it has used fuel for 40 km. The odometer reading (distance) is what matters, not the net change in position.
  check: none

- id: ncert9-it-4-6
  lvl: ncert-intext
  num: "IX 4 · Pause 3"
  source: NCERT Grade 9 Science · Ch 4 · Pause and Ponder Q3
  kind: text
  q: |-
    A ball rolls down an inclined track as shown in Fig. 4.6. Is its motion, a straight line motion? Assuming the starting point of the ball (O) to be the origin, can its motion from O to D be depicted using a horizontal line as shown in Fig. 4.3? Are the values of total distance travelled and magnitude of displacement from O equal or different at positions A, B, C and D?
  sol: |
    The track is a straight (sloping) line, so the ball moves in a straight line. Yes, its position can be shown on a straight number line like Fig. 4.3: only the distance along the track from O matters, so the slope does not need to be drawn.

    From Fig. 4.6 the ball's positions are A at 40 cm, B at 50 cm (10 cm further), C at 70 cm (20 cm further) and D at 100 cm (30 cm further) along the track from O. The ball never turns back, so at every one of A, B, C and D the **total distance travelled equals the magnitude of displacement**: 40 cm, 50 cm, 70 cm and 100 cm respectively.

    [Inference] The segment lengths 40, 10, 20 and 30 cm are read from the printed figure.
  check: none

- id: ncert9-ex-4-1
  lvl: ncert-ex
  num: "IX 4 · Q1"
  source: NCERT Grade 9 Science · Ch 4 · Revise, Reflect, Refine Q1
  kind: num
  q: |-
    My father went to a shop from home which is located at a distance of 250 m on a straight road. On reaching there, he discovered that he forgot to carry a cloth bag. He came home to take it, went to the shop again, bought provisions and came back home. How much was the total distance travelled by him? What was his displacement from home?
  ask: Total distance travelled
  unit: m
  ans: 1000
  tol: 1
  verify: 4*250
  sol: |
    The journey has four legs, each 250 m: home to shop, shop to home, home to shop, shop to home.

    Total distance $= 4\times250 = 1000$ m.

    He ends at the place where he started, so his net change in position is zero: **displacement = 0**.
  check: code

- id: ncert9-ex-4-2
  lvl: ncert-ex
  num: "IX 4 · Q2"
  source: NCERT Grade 9 Science · Ch 4 · Revise, Reflect, Refine Q2
  kind: num
  q: |-
    A student runs from the ground floor to the fourth floor of a school building to collect a book and then comes down to their classroom on the second floor. If the height of each floor is 3 m, find:
    (i) the total vertical distance travelled, and
    (ii) their displacement from the starting point.
  ask: Total vertical distance travelled
  unit: m
  ans: 18
  tol: 0.1
  verify: 4*3+2*3
  sol: |
    Take upward as positive, origin at the ground floor.

    (i) Up to the fourth floor: $4\times3 = 12$ m. Down to the second floor: $2\times3 = 6$ m. Total distance $= 12 + 6 = 18$ m.

    (ii) The student ends at the second floor, which is 6 m above the start. Displacement $= +6$ m, that is **6 m upward**.
  check: code

- id: ncert9-ex-4-11
  lvl: ncert-ex
  num: "IX 4 · Q11"
  source: NCERT Grade 9 Science · Ch 4 · Revise, Reflect, Refine Q11
  kind: text
  q: |-
    A student said, "The Earth moves around the Sun". In this context, discuss whether an object kept on the Earth can be considered to be at rest.
  sol: |
    Rest or motion depends on the reference point. Take the surface of the Earth (a table, the classroom) as the reference: an object kept on the Earth does not change its position with respect to it, so it is **at rest** relative to the Earth.

    Take the Sun as the reference: the Earth moves around the Sun, and the object moves with it, so its position with respect to the Sun keeps changing and it is **in motion**.

    So an object on the Earth is at rest relative to the Earth and in motion relative to the Sun. Neither statement is wrong; they use different reference points. There is no reference point that is "really" at rest.
  check: none

- id: ncert11-ex-2-1
  lvl: ncert-ex
  num: "XI 2.1"
  source: NCERT XI Physics · Ch 2 · Exercise 2.1
  kind: text
  q: |-
    In which of the following examples of motion, can the body be considered approximately a point object:
    (a) a railway carriage moving without jerks between two stations.
    (b) a monkey sitting on top of a man cycling smoothly on a circular track.
    (c) a spinning cricket ball that turns sharply on hitting the ground.
    (d) a tumbling beaker that has slipped off the edge of a table.
  sol: |
    A body can be treated as a point object when its size is much smaller than the distance it moves, and when we do not care about how it turns or spins.

    (a) **Yes.** A carriage a few tens of metres long between stations that are many kilometres apart: its size is negligible compared with the distance, and it moves without jerks.

    (b) **Yes.** The monkey moves with the cyclist along a smooth circular track much larger than the monkey.

    (c) **No.** The ball's spin and its sharp turn on hitting the ground depend on its extended size and rotation; its motion cannot be described by one point.

    (d) **No.** A tumbling beaker rotates as it falls, and different parts of it move differently, so one point does not describe it.

    **Answer: (a) and (b).**
  answer_key: (a), (b)
  check: ncert-key

- id: ncert11-ex-2-9
  lvl: ncert-ex
  num: "XI 2.9"
  source: NCERT XI Physics · Ch 2 · Exercise 2.9
  kind: text
  q: |-
    Explain clearly, with examples, the distinction between :
    (a) magnitude of displacement (sometimes called distance) over an interval of time, and the total length of path covered by a particle over the same interval;
    (b) magnitude of average velocity over an interval of time, and the average speed over the same interval. [Average speed of a particle over an interval of time is defined as the total path length divided by the time interval]. Show in both (a) and (b) that the second quantity is either greater than or equal to the first. When is the equality sign true ? [For simplicity, consider one-dimensional motion only].
  sol: |
    **(a)** The **magnitude of displacement** is the straight-line gap $|x_2 - x_1|$ between the final and initial positions, and it ignores what happened in between. The **total path length** is the sum of the lengths of all the pieces of the path, however the particle moved. Example: a particle goes from $x = 0$ to $x = 5$ m and back to $x = 2$ m. The magnitude of displacement is $|2 - 0| = 2$ m, the path length is $5 + 3 = 8$ m.

    In one dimension the path is broken into pieces $|\Delta x_1|, |\Delta x_2|, \dots$, and the displacement is the algebraic sum $\Delta x_1 + \Delta x_2 + \dots$. By the triangle inequality
    $$\left|\sum \Delta x_i\right| \le \sum |\Delta x_i|,$$
    so **path length $\ge$ magnitude of displacement**. Equality holds when all the $\Delta x_i$ have the same sign, that is, when the particle never turns back (it moves in one direction only).

    **(b)** The **magnitude of average velocity** is $\dfrac{|\text{displacement}|}{\Delta t}$ and the **average speed** is $\dfrac{\text{path length}}{\Delta t}$. Both share the same $\Delta t > 0$, so dividing the inequality in (a) by $\Delta t$ gives
    $$\text{average speed} \ge |\text{average velocity}|.$$
    Equality again holds only when the particle moves in one direction without turning back.

    Example: the particle above takes 4 s. Average velocity magnitude $= 2/4 = 0.5$ m s$^{-1}$, average speed $= 8/4 = 2$ m s$^{-1}$. A particle that goes once round a closed track has average velocity 0 but a non-zero average speed.
  check: none

- id: f1
  lvl: found
  kind: num
  q: A particle on the x-axis moves from x = +2 m to x = +9 m, and then from x = +9 m to x = −3 m. Find the total distance it travels. (Original problem.)
  ask: Total distance travelled
  unit: m
  ans: 19
  tol: 0.01
  verify: Math.abs(9-2)+Math.abs(-3-9)
  sol: |
    Distance adds up every piece of the path, whichever way it goes: $|9-2| + |-3-9| = 7 + 12 = 19$ m.

    For comparison, the displacement is final minus initial position, $-3 - 2 = -5$ m: 5 m in the negative direction. The distance (19 m) is larger because the particle turned back.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: A body moves along a straight line. Which statement is always true? (Original problem.)
  opts: ["The magnitude of its displacement is equal to the distance it travels.", "The distance it travels is never less than the magnitude of its displacement.", "Its displacement is zero whenever the distance it has travelled is zero, and only then.", "Its displacement is never zero if it is moving."]
  ans: 1
  sol: |
    The distance is the total path length and the displacement is the straight-line gap between start and end, so **distance ≥ |displacement|** always (second option).

    The first option holds only if the body never turns back. The third is wrong: a body can return to its start (displacement zero) after travelling a lot of distance. The fourth is wrong for the same reason: a moving body that comes back to its start has zero displacement.
  check: none

