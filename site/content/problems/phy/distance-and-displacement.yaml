  q: A ball is thrown vertically upwards from a point 2 m above the ground. It rises 8 m, comes back down, passes the starting point and lands on the ground. Find the total distance it travels. (Original problem.)
  ask: Total distance travelled
  unit: m
  ans: 18
  tol: 0.01
  verify: 8+(8+2)
  sol: |
    Up from the starting point: 8 m. Down to the starting point: 8 m, and then a further 2 m to the ground. Total distance $= 8 + 8 + 2 = 18$ m.

    Displacement from the starting point: the ball ends 2 m below it, so the displacement is 2 m downward. The distance (18 m) is much larger than the magnitude of displacement (2 m).
