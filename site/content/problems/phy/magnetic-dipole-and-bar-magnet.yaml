- id: m1
  lvl: main
  kind: num
  q: A bar magnet of moment 1.5 J/T and moment of inertia 1.2 × 10⁻⁵ kg m² about its centre oscillates in a uniform field of 0.2 T. Find the period of small oscillations. (Original problem.)
  ask: Period
  unit: s
  ans: 0.0397
  tol: 0.0002
  verify: 2*Math.PI*Math.sqrt(1.2e-5/(1.5*0.2))
  sol: |
    For small angles $\tau = -mB\theta$, so $I\ddot\theta = -mB\theta$: simple harmonic motion with $T = 2\pi\sqrt{\dfrac{I}{mB}} = 2\pi\sqrt{\dfrac{1.2\times10^{-5}}{1.5\times0.2}} = 3.97\times10^{-2}$ s.
  check: code

- id: m2
  lvl: main
  kind: text
  q: Explain why the magnetic field at a point on the axis of a short bar magnet is twice that at an equal distance on the equatorial line. (Original problem.)
  sol: |
    By analogy with the electric dipole, the axial field is $\dfrac{\mu_0}{4\pi}\dfrac{2m}{r^3}$ and the equatorial field is $\dfrac{\mu_0}{4\pi}\dfrac{m}{r^3}$ (opposite in direction). On the axis the fields of the two poles are in the same direction and the nearer pole dominates; on the equatorial line they have components that partly cancel, so the field is half as large.
  check: none
