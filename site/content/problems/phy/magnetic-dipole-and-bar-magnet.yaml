- id: ncert12-ex-5-5
  lvl: ncert-ex
  num: "XII 5.5"
  source: NCERT XII Physics · Ch 5 · Exercise 5.5
  kind: num
  q: |-
    A bar magnet of magnetic moment 1.5 J T⁻¹ lies aligned with the direction of a uniform magnetic field of 0.22 T.
    (a) What is the amount of work required by an external torque to turn the magnet so as to align its magnetic moment: (i) normal to the field direction, (ii) opposite to the field direction?
    (b) What is the torque on the magnet in cases (i) and (ii)?
  ask: Work to turn the magnet opposite to the field, part (a)(ii)
  unit: J
  ans: 0.66
  tol: 0.001
  verify: 2*1.5*0.22
  sol: |
    The work done equals the change in potential energy, $W = U_f - U_i$ with $U = -mB\cos\theta$ and $U_i = -mB$.

    (a)(i) Normal to the field: $U_f = 0$, so $W = mB = 1.5\times0.22 = 0.33$ J. (ii) Opposite to the field: $U_f = +mB$, so $W = 2mB = 0.66$ J.

    (b)(i) The torque is $mB\sin90^\circ = 0.33$ N m, in a direction that tends to align $\mathbf m$ with $\mathbf B$. (ii) The torque is $mB\sin180^\circ = 0$ (an unstable equilibrium).
  answer_key: "(a) (i) 0.33 J (ii) 0.66 J (b) (i) Torque of magnitude 0.33 J in a direction that tends to align the magnetic moment vector along B. (ii) Zero."
  check: both

- id: ncert12-ex-5-6
  lvl: ncert-ex
  num: "XII 5.6"
  source: NCERT XII Physics · Ch 5 · Exercise 5.6
  kind: num
  q: |-
    A closely wound solenoid of 2000 turns and area of cross-section 1.6 × 10⁻⁴ m², carrying a current of 4.0 A, is suspended through its centre allowing it to turn in a horizontal plane.
    (a) What is the magnetic moment associated with the solenoid?
    (b) What is the force and torque on the solenoid if a uniform horizontal magnetic field of 7.5 × 10⁻² T is set up at an angle of 30° with the axis of the solenoid?
  ask: Magnitude of the torque, part (b)
  unit: N m
  ans: 0.048
  tol: 0.0005
  verify: 2000*4.0*1.6e-4*7.5e-2*Math.sin(Math.PI/6)
  sol: |
    (a) $m = NIA = 2000\times4.0\times1.6\times10^{-4} = 1.28$ A m², along the axis in the direction given by the right-hand screw rule from the current's sense.

    (b) In a uniform field the net force is **zero**. The torque is $\tau = mB\sin30^\circ = 1.28\times7.5\times10^{-2}\times0.5 = 0.048$ N m, in a direction that tends to align the axis (the moment) with the field.
  answer_key: "(a) 1.28 A m² along the axis in the direction related to the sense of current via the right-handed screw rule. (b) Force is zero in uniform field; torque = 0.048 N m in a direction that tends to align the axis of the solenoid (i.e., its magnetic moment vector) along B."
  check: both

- id: ncert12-ex-5-7
  lvl: ncert-ex
  num: "XII 5.7"
  source: NCERT XII Physics · Ch 5 · Exercise 5.7
  kind: num
  q: A short bar magnet has a magnetic moment of 0.48 J T⁻¹. Give the direction and magnitude of the magnetic field produced by the magnet at a distance of 10 cm from the centre of the magnet on (a) the axis, (b) the equatorial lines (normal bisector) of the magnet.
  ask: Field on the axis, part (a)
  unit: G
  ans: 0.96
  tol: 0.001
  verify: 1e-7*2*0.48/0.1**3*1e4
  sol: |
    (a) On the axis: $B = \dfrac{\mu_0}{4\pi}\dfrac{2m}{r^3} = 10^{-7}\times\dfrac{2\times0.48}{(0.1)^3} = 9.6\times10^{-5}$ T $= 0.96$ G, directed along the moment, i.e. from the south pole towards the north pole side (the S–N direction).

    (b) On the equatorial line: $B = \dfrac{\mu_0}{4\pi}\dfrac{m}{r^3} = 4.8\times10^{-5}$ T $= 0.48$ G, directed opposite to the moment (the N–S direction).
  answer_key: "(a) 0.96 G along S–N direction. (b) 0.48 G along N–S direction."
  check: both

