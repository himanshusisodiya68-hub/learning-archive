  q: A uniform beam 4 m long with mass 20 kg rests on supports at its two ends. A 60 kg person stands 1 m from the left end. Find the reaction at the left support. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Reaction at the left support
