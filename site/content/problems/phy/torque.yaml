- id: b1
  lvl: board
  kind: num
  q: On a see-saw, a 25 kg child sits 1.8 m from the pivot. Where must a 30 kg child sit on the other side to balance it? (Original problem.)
  ask: Distance of the 30 kg child from the pivot
  unit: m
  ans: 1.5
  tol: 0.01
  verify: 25*1.8/30
  sol: |
    Balance requires clockwise moment = anticlockwise moment about the pivot (the plank is taken as uniform and pivoted at its centre, so its own weight has no moment): $25g(1.8)=30g\,d$, so $d=25\times1.8/30=1.5$ m. The heavier child sits closer to the pivot. (Original problem.)
