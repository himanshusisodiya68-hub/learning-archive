- id: f3
  lvl: found
  kind: mcq
  q: A force acts on a rigid body. The torque of the force about a point P is zero when (Original problem)
  opts: ["the force is very small", "the line of action of the force passes through P", "the force is perpendicular to the line joining P to its point of application", "the body is at rest"]
  ans: 1
  sol: The magnitude of the torque is $rF\sin\theta$, which is zero when $r=0$ or $\sin\theta=0$, that is, when the force acts along the line through P. A perpendicular force gives the maximum torque, not zero. (Original problem.)
