  q: A 10 N force acts at the end of a 0.25 m spanner. The force makes an angle of 30° with the spanner. Find the torque about the nut at the other end. (Original problem.)
  ask: Torque
  unit: N m
  ans: 1.25
  tol: 0.01
  verify: 0.25*10*sin(rad(30))
  sol: |
    $\tau=rF\sin\theta=0.25\times10\times\sin30^\circ=0.25\times10\times0.5=1.25$ N m. Only the component of the force perpendicular to the spanner, $F\sin\theta=5$ N, turns the nut; the component along the spanner has no moment about the nut. (Original problem.)
