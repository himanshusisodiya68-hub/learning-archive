- id: b2
  lvl: board
  kind: num
  q: In a balanced Wheatstone bridge the arms are AB = 10 Ω, BC = 15 Ω, AD = 20 Ω and DC = 30 Ω, with a 6 V battery across AC and a galvanometer across BD. Find the current drawn from the battery. (Original problem.)
  ask: Battery current
  unit: A
  ans: 0.36
  tol: 0.005
  verify: 6/((10+15)*(20+30)/(10+15+20+30))
  sol: $10/15 = 20/30$, so the bridge is balanced and the galvanometer arm carries no current. The two arms AB + BC = 25 Ω and AD + DC = 50 Ω are in parallel, giving $25\times50/75 = 16.7\ \Omega$. $I = 6/16.7 = 0.36$ A.
  check: code

- id: m1
  lvl: main
  kind: num
  q: In a Wheatstone bridge, AB = 2 Ω, BC = 4 Ω, AD = 3 Ω and DC = 3 Ω. A galvanometer of resistance 1 Ω joins B and D, and 6 V is applied across AC. Find the galvanometer current. (Original problem.)
  ask: Galvanometer current
  unit: A
  ans: 0.2609
  tol: 0.0005
  verify: (x=>x[0]-x[1])(((A,b)=>{const n=b.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i]}return x})([[1/2+1/4+1,-1],[-1,1/3+1/3+1]],[3,2]))
  sol: |
    Take $V_A = 6$ V, $V_C = 0$. Node B: $(6 - V_B)/2 = V_B/4 + (V_B - V_D)/1$, so $3 = 1.75V_B - V_D$. Node D: $(6 - V_D)/3 = V_D/3 + (V_D - V_B)/1$, so $2 = \tfrac53V_D - V_B$. Solving: $V_D = 78/23$ V, $V_B = 84/23$ V. The galvanometer current is $(V_B - V_D)/1 = 6/23 = 0.26$ A from B to D. Here $2/4 \ne 3/3$, so the bridge is unbalanced.
  check: code

- id: m2
  lvl: main
  kind: text
  q: Show that if the battery and the galvanometer of a balanced Wheatstone bridge are interchanged, the bridge is still balanced. (Original problem.)
  sol: |
    The balance condition is $P/Q = R/S$, that is $PS = QR$. Interchanging the battery and galvanometer swaps the roles of the two diagonals: the battery now joins the old galvanometer points, and the galvanometer the old battery points. In the new arrangement the arms adjacent to the new battery arm form the ratios $P/R$ and $Q/S$, and the new balance condition is $P/R = Q/S$, that is $PS = QR$, the same condition. So a bridge balanced one way stays balanced after the interchange.
  check: none

- id: a1
  lvl: adv
  kind: num
  q: |
    In a metre bridge an unknown resistance X is in the left gap and a 10.0 Ω resistor in the right gap; balance is at 40.0 cm from the left end. A second unknown resistance Y is now joined in series with X in the left gap, and the balance point moves to 60.0 cm. Find Y. (Original problem.)
  ask: Y
  unit: Ω
  ans: 8.333
  tol: 0.005
  verify: 10*60/40 - 10*40/60
  hints: ["Write X/10 = l/(100 − l) for each balance.", "The second balance gives X + Y, not Y."]
  sol: |
    First balance: $X/10 = 40/60$, so $X = 6.667\ \Omega$.

    Second balance: $(X + Y)/10 = 60/40$, so $X + Y = 15.0\ \Omega$.

    Hence $Y = 15.0 - 6.667 = 8.33\ \Omega$. (Note that both balance points are 10 cm from the centre, which keeps the reading error small in both measurements.)
  check: code

- id: a2
  lvl: adv
  kind: num
  q: |
    A Wheatstone bridge has arms AB = 20 Ω, BC = 30 Ω, AD = 40 Ω and DC = 50 Ω. An ideal 5.0 V battery is connected across AC (A positive) and a galvanometer of resistance 10 Ω across BD. Find the galvanometer current. (Original problem.)
  ask: Galvanometer current
  unit: mA
  ans: 5.025
  tol: 0.005
  verify: (5*30/50-5*50/90)/(20*30/50+40*50/90+10)*1000
  hints: ["Find the open-circuit potentials of B and D with the galvanometer removed.", "With the ideal battery replaced by a wire, the resistance seen by the galvanometer is (20 ∥ 30) + (40 ∥ 50)."]
  sol: |
    **Thevenin.** Take $V_C = 0$, $V_A = 5$ V. With G removed, $V_B = 5 \times \tfrac{30}{50} = 3.000$ V and $V_D = 5 \times \tfrac{50}{90} = 2.778$ V, so $V_{\text{th}} = 0.2222$ V with B higher.

    Shorting the ideal battery joins A and C, so $R_{\text{th}} = \tfrac{20 \times 30}{50} + \tfrac{40 \times 50}{90} = 12.00 + 22.22 = 34.22\ \Omega$.

    $$I_g = \frac{0.2222}{34.22 + 10} = 5.03 \times 10^{-3}\ \text{A} = 5.03\ \text{mA},$$

    flowing from B to D. The bridge is unbalanced because $20/30 \ne 40/50$.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: |
    The balance length in a metre bridge can be read to ±0.1 cm. Find the percentage error in the unknown resistance when the balance point is at 20.0 cm. (For comparison, work out the error for a balance at 50.0 cm.) (Original problem.)
  ask: Percentage error
  unit: "%"
  ans: 0.625
  tol: 0.002
  verify: 100*0.1/(20*80)*100
  hints: ["S = R(100 − l)/l. Take logarithms and differentiate.", "Both terms add in magnitude because increasing l decreases 100 − l."]
  sol: |
    $\ln S = \ln R + \ln(100 - l) - \ln l$, so

    $$\frac{\delta S}{S} = \delta l\left(\frac{1}{l} + \frac{1}{100 - l}\right) = \frac{100\,\delta l}{l(100 - l)} .$$

    At $l = 20$ cm: $\dfrac{100 \times 0.1}{20 \times 80} = 0.00625 = 0.625\%$.

    At $l = 50$ cm: $\dfrac{100 \times 0.1}{50 \times 50} = 0.4\%$, the smallest possible, since $l(100 - l)$ is greatest at the middle. So the known resistance should be chosen close to the unknown.
  check: code

- id: a4
  lvl: adv
  kind: num
  q: |
    In a Carey Foster bridge, with a 0.500 Ω standard in gap X and a thick copper strip (zero resistance) in gap Y, interchanging X and Y shifts the balance point by 25.0 cm. The copper strip is then replaced by a 0.100 Ω standard and the 0.500 Ω standard by an unknown resistance. Interchanging these now shifts the balance point by 12.0 cm in the same sense as before. Find the unknown resistance. (Original problem.)
  ask: Unknown resistance
  unit: Ω
  ans: 0.34
  tol: 0.001
  verify: 0.1 + 0.5/25*12
  hints: ["Carey Foster: X − Y = λ(l₂ − l₁).", "The first experiment gives λ, the resistance per cm of the wire."]
  sol: |
    The Carey Foster result is $X - Y = \lambda(l_2 - l_1)$, with end corrections cancelled.

    **Calibration.** $0.500 - 0 = \lambda \times 25.0$, so $\lambda = 0.0200\ \Omega/\text{cm}$.

    **Measurement.** The shift has the same sense, so $X - Y$ is positive: $X - 0.100 = 0.0200 \times 12.0 = 0.240$, giving $X = 0.340\ \Omega$.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: |
    A metre bridge has unknown end corrections: α cm at the left end and β cm at the right end. With a standard 2.000 Ω resistor in the left gap and a standard 1.000 Ω resistor in the right gap, balance is at 67.2 cm from the left end. With the two resistors interchanged, balance is at 33.2 cm. Find β. (Original problem.)
  ask: β
  unit: cm
  ans: 1.2
  tol: 0.01
  verify: (67.2-2*33.2)/(2-1) + 67.2 + 33.2 - 100
  hints: ["Write R_left/R_right = (l + α)/(100 − l + β) for each balance.", "Adding the two equations in the form l + α = kL/(1 + k) gives l + l′ = 100 + β − α.", "Dividing them gives k = (l + α)/(l′ + α)."]
  sol: |
    Let $k = 2$ and $L = 100 + \alpha + \beta$ (effective length). The two balances are

    $$\frac{l + \alpha}{100 - l + \beta} = k, \qquad \frac{l' + \alpha}{100 - l' + \beta} = \frac1k .$$

    Since numerator plus denominator is $L$ in both, $l + \alpha = \tfrac{k}{1+k}L$ and $l' + \alpha = \tfrac{1}{1+k}L$.

    **Ratio:** $(l + \alpha)/(l' + \alpha) = k$, so $\alpha = \dfrac{l - kl'}{k - 1} = \dfrac{67.2 - 66.4}{1} = 0.8$ cm.

    **Sum:** $l + l' + 2\alpha = L = 100 + \alpha + \beta$, so $\beta = l + l' - 100 + \alpha = 0.4 + 0.8 = 1.2$ cm.

    **Check:** $(67.2 + 0.8)/(100 - 67.2 + 1.2) = 68/34 = 2$ ✓ and $(33.2 + 0.8)/(100 - 33.2 + 1.2) = 34/68 = \tfrac12$ ✓.

    Note that the swap alone fixes only $\beta - \alpha = 0.4$ cm; the known ratio is what pins down each correction.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: |
    Two identical strain gauges (resistance R, gauge factor 2.0) are bonded to the top and bottom faces of a cantilever and wired into adjacent arms AB and BC of a Wheatstone bridge; arms AD and DC are fixed resistors equal to R. An ideal 10.0 V supply is across AC. When the beam is loaded, the top gauge sees a tensile strain of +400 × 10⁻⁶ and the bottom gauge −400 × 10⁻⁶. At the same time the room warms, so that both gauges' resistances rise by 0.50% for reasons unrelated to strain. Find the magnitude of the bridge output voltage between B and D. (Original problem.)
  ask: Output voltage
  unit: mV
  ans: 4
  tol: 0.001
  verify: 10*2*400e-6/2*1000
  hints: ["Write the gauges as R(1 + t)(1 + x) and R(1 + t)(1 − x) with x = G_F ε.", "V_B depends only on the ratio of the two gauge resistances."]
  sol: |
    Let $x = G_F\varepsilon = 2.0 \times 400 \times 10^{-6} = 8.0 \times 10^{-4}$ and $t = 0.0050$. The gauges are $R_{AB} = R(1 + t)(1 + x)$ and $R_{BC} = R(1 + t)(1 - x)$.

    With $V_A = 10$ V and $V_C = 0$:

    $$V_B = E\,\frac{R_{BC}}{R_{AB} + R_{BC}} = E\,\frac{(1 + t)(1 - x)}{(1 + t)\left[(1 + x) + (1 - x)\right]} = \frac{E(1 - x)}{2}.$$

    The temperature factor $(1 + t)$ cancels exactly, and so does the non-linearity: the denominator is $2$ for any $x$. $V_D = E/2$, so

    $$|V_D - V_B| = \frac{Ex}{2} = \frac{10 \times 8.0\times10^{-4}}{2} = 4.0 \times 10^{-3}\ \text{V} = 4.0\ \text{mV}.$$

    A single active gauge (quarter bridge) would give only about 2 mV, and it would also respond to the temperature change: $x_{\text{eff}} \approx 0.0058$, an error several times larger than the strain signal itself.
  check: code

- id: o3
  lvl: oly
  kind: num
  q: |
    A platinum resistance thermometer with R = R₀(1 + αT), R₀ = 100.0 Ω and α = 0.00385 per °C (take these values as given), forms arm AB of a Wheatstone bridge. The other three arms are 100.0 Ω each and an ideal 2.00 V supply is across AC. A high-resistance voltmeter between B and D reads 45.0 mV. Find T, and state how wrong the answer would be if the linear approximation V ≈ E·ΔR/(4R) were used. (Original problem.)
  ask: Temperature T
  unit: °C
  ans: 24.48
  tol: 0.02
  verify: (4*0.045/(2-2*0.045))/0.00385
  hints: ["With x = αT, show that V_out = Ex/[2(2 + x)].", "Solve for x: x = 4V/(E − 2V)."]
  sol: |
    Let $x = \alpha T$, so $R_{AB} = 100(1 + x)$. With $V_C = 0$, $V_A = E$:

    $V_B = E\cdot\dfrac{100}{100(1 + x) + 100} = \dfrac{E}{2 + x}$ and $V_D = \dfrac{E}{2}$. The voltmeter draws no current, so

    $$V = V_D - V_B = \frac{E x}{2(2 + x)} .$$

    Solving: $2V(2 + x) = Ex$, so $x = \dfrac{4V}{E - 2V} = \dfrac{0.180}{2.00 - 0.090} = 0.09424$.

    $T = x/\alpha = 0.09424/0.00385 = 24.5$ °C.

    The linear formula gives $x = 4V/E = 0.0900$ and $T = 23.4$ °C, about 1.1 °C too low. The quarter bridge's non-linearity, the factor $1/(1 + x/2)$, already matters at room temperature.
  check: code

- id: o4
  lvl: oly
  kind: proof
  q: |
    In the Carey Foster bridge, the inner gaps hold P and Q and the outer gaps hold X and Y, in series with the two ends of a uniform wire of resistance λ per cm with unknown end corrections α and β. Balance is at l₁; with X and Y interchanged it is at l₂. Prove that X − Y = λ(l₂ − l₁) even when P ≠ Q. Then explain why, in practice, P, Q, X and Y are nevertheless all chosen nearly equal. (Original problem.)
  hints: ["Write both balance conditions as fractions equal to P/Q.", "Compare the sums numerator + denominator in the two fractions.", "If a/b = c/d = k and a + b = c + d, then a = c."]
  sol: |
    **Proof.** The balance conditions are

    $$\frac{P}{Q} = \frac{X + \lambda(l_1 + \alpha)}{Y + \lambda(100 - l_1 + \beta)} = \frac{Y + \lambda(l_2 + \alpha)}{X + \lambda(100 - l_2 + \beta)} .$$

    Call the numerators $a$, $c$ and the denominators $b$, $d$. Then $a + b = X + Y + \lambda(100 + \alpha + \beta) = c + d = T$. From $a/b = P/Q$ we get $a = T\cdot\dfrac{P}{P + Q}$, and likewise $c = T\cdot\dfrac{P}{P + Q}$. So $a = c$:

    $$X + \lambda(l_1 + \alpha) = Y + \lambda(l_2 + \alpha) \implies X - Y = \lambda(l_2 - l_1).$$

    Neither $\alpha$, $\beta$ nor $P/Q$ survives, so $P = Q$ was never needed.

    **Why choose them nearly equal anyway.**

    1. *Balance on the wire.* The balance point satisfies $a = TP/(P + Q)$, that is, $X + \lambda(l_1 + \alpha)$ must equal a fixed share of the total. The wire contributes at most $100\lambda$, typically a fraction of an ohm. If $P/Q$ or $X$ and $Y$ were very different, the required share could not be reached anywhere on the wire, and there would be no balance point.
    2. *Sensitivity.* The bridge responds best when the ratio of arms on each path is close to 1, since the imbalance signal is proportional to $p/(1 + p)^2$, greatest at $p = 1$.
    3. *Precision of a difference.* With $X \approx Y$, the shift $l_2 - l_1$ is a modest length measured on the wire, and the absolute error $\lambda\,\delta(l_2 - l_1)$ is small compared with $X$ itself. The method measures a small **difference** accurately, which is ideal for comparing a resistance with a standard of nearly the same value.
  check: none
