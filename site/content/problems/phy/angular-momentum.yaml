- id: b2
  lvl: board
  kind: num
  q: A merry-go-round is a uniform disc of mass 200 kg and radius 2.0 m, turning at 1.5 rad/s. A 40 kg child runs up from outside, jumps on at the rim moving radially (no angular momentum about the axis) and stays on it. Find the new angular speed. (Original problem.)
  ask: New angular speed
  unit: rad/s
  ans: 1.07
  tol: 0.01
  verify: (0.5*200*2**2*1.5)/(0.5*200*2**2+40*2**2)
  sol: |
    There is no external torque about the axis, so the angular momentum is conserved. $I_1=\tfrac12MR^2=\tfrac12(200)(4)=400$ kg m$^2$. After the child lands, $I_2=400+mR^2=400+40(4)=560$ kg m$^2$.
    $$\omega_2=\frac{I_1\omega_1}{I_2}=\frac{400\times1.5}{560}=1.07\ \text{rad/s}.$$
    The kinetic energy falls from 450 J to 321 J: the missing energy is dissipated while the child's feet are brought up to speed, by friction. (Original problem.)
  check: code

- id: b3
  lvl: board
  kind: num
  q: A constant torque of 12 N m acts on a wheel of moment of inertia 3.0 kg m$^2$, starting from rest, for 5.0 s. Find the rotational kinetic energy at the end, and check it against the work done by the torque. (Original problem.)
  ask: Rotational kinetic energy
  unit: J
  ans: 600
  tol: 0.5
  verify: 0.5*3*(12/3*5)**2
  sol: |
    $\alpha=\tau/I=12/3=4$ rad/s$^2$. After 5.0 s, $\omega=\alpha t=20$ rad/s and $K=\tfrac12I\omega^2=\tfrac12(3)(400)=600$ J. The angle turned is $\theta=\tfrac12\alpha t^2=\tfrac12(4)(25)=50$ rad, and the work is $W=\tau\theta=12\times50=600$ J. They agree: the work done by the torque equals the gain in rotational kinetic energy. (Original problem.)
  check: code

- id: m1
  lvl: main
  kind: num
  q: A person sits on a stool that can turn freely about a vertical axis, holding a bicycle wheel whose axle is vertical. The wheel has moment of inertia 0.50 kg m$^2$ about its axle and spins at 20 rad/s relative to the person, who is at rest. The moment of inertia of person, stool and wheel taken together about the vertical axis is 3.0 kg m$^2$ (this includes the wheel treated as a rigid body turning with the stool). The person turns the wheel over so that its axle is vertical again but the spin is reversed. Find the angular speed of the person and stool afterwards. (Original problem.)
  ask: Angular speed of person and stool
  unit: rad/s
  ans: 6.667
  tol: 0.02
  verify: 2*0.5*20/3
  sol: |
    There is no external torque about the vertical axis, so the vertical component of the total angular momentum is conserved. Initially the person and stool are at rest and the wheel carries $L_i=I_w\omega_w=0.50\times20=10$ kg m$^2$/s.

    Afterwards the wheel's spin relative to the person is $-20$ rad/s. Let the person and stool turn at $\omega$. The total is $L_f=I_w(-20)+I_{tot}\,\omega=-10+3.0\,\omega$.
    $$-10+3.0\omega=10\ \Rightarrow\ \omega=\frac{20}{3.0}=6.67\ \text{rad/s}$$
    in the direction the wheel used to spin. The person and stool gain $+20$ kg m$^2$/s from the wheel, whose angular momentum changed by $-20$ kg m$^2$/s (twice its original value). [Inference] The wheel's own contribution through the stool's rotation is included in $I_{tot}$, which is how the problem was set. (Original problem.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: A skater spins at 2.0 rad/s with moment of inertia 3.0 kg m$^2$. She pulls her arms in until the moment of inertia is 1.2 kg m$^2$. Find the work done by her muscles. (Original problem.)
  ask: Work done by the skater
  unit: J
  ans: 9
  tol: 0.05
  verify: 0.5*1.2*(3*2/1.2)**2-0.5*3*2**2
  sol: |
    Angular momentum is conserved: $\omega_2=I_1\omega_1/I_2=3.0\times2.0/1.2=5.0$ rad/s. Kinetic energies: $K_1=\tfrac12(3.0)(2.0)^2=6.0$ J and $K_2=\tfrac12(1.2)(5.0)^2=15.0$ J. By the work-energy theorem the work done by her muscles is $W=K_2-K_1=9.0$ J. (Original problem.)
  check: code

- id: m3
  lvl: main
  kind: num
  q: A planet moves round a star under the star's gravity. At its closest approach it is $1.0\times10^{11}$ m from the star and moves at $3.0\times10^{4}$ m/s, perpendicular to the line joining them. At its farthest point it is $1.5\times10^{11}$ m from the star. Find its speed there. (Original problem.)
  ask: Speed at the farthest point
  unit: m/s
  ans: 20000
  tol: 50
  verify: 1.0e11*3.0e4/1.5e11
  sol: |
    Gravity is a central force, so its torque about the star is zero ($\mathbf r\parallel\mathbf F$) and the planet's angular momentum about the star is conserved. At the nearest and farthest points the velocity is perpendicular to the radius, so $L=mvr$ at both:
    $$v_2=\frac{v_1r_1}{r_2}=\frac{(3.0\times10^4)(1.0\times10^{11})}{1.5\times10^{11}}=2.0\times10^4\ \text{m/s}.$$
    The planet is slowest when it is farthest away. This is Kepler's second law (equal areas in equal times, $dA/dt=L/2m$) seen as conservation of angular momentum. (Original problem.)
  check: code

- id: m4
  lvl: main
  kind: num
  q: A uniform rod of mass 2.0 kg and length 1.2 m hangs vertically from a frictionless pivot at its upper end. A 0.050 kg bullet moving horizontally at 200 m/s strikes the lower end and embeds in it. Find the angular speed of the rod and bullet just after the impact. (Original problem.)
  ask: Angular speed just after the impact
  unit: rad/s
  ans: 11.63
  tol: 0.02
  verify: 0.05*200*1.2/(2*1.2**2/3+0.05*1.2**2)
  sol: |
    During the very short impact the pivot's force and the weights have no moment about the pivot (the pivot force acts at the pivot, and the weights act along the vertical line through it), so the angular momentum about the pivot is conserved. Linear momentum is *not* conserved, because the pivot exerts an impulsive force.

    Before: $L=mvL=0.050\times200\times1.2=12$ kg m$^2$/s.
    After: $I=\tfrac13ML^2+mL^2=\tfrac13(2.0)(1.44)+0.050(1.44)=0.960+0.072=1.032$ kg m$^2$.
    $$\omega=\frac LI=\frac{12}{1.032}=11.63\ \text{rad/s}.$$
    The rod's lower end then moves at $\omega L=13.95$ m/s, much slower than the bullet's 200 m/s, and the kinetic energy afterwards ($\tfrac12I\omega^2=69.8$ J) is only 7% of the bullet's initial 1000 J. The rest is lost in the inelastic collision. (Original problem.)
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A person of mass 50 kg stands at the rim of a horizontal uniform disc platform of mass 100 kg and radius 2.0 m, which turns freely about its vertical axis at 2.0 rad/s. The person walks slowly to the centre. Treat the person as a point mass. Find the angular speed of the platform when the person is at the centre. (Original problem.)
  ask: Final angular speed
  unit: rad/s
  ans: 4.0
  tol: 0.02
  verify: 2*(0.5*100*4+50*4)/(0.5*100*4)
  sol: |
    There is no external torque about the vertical axis, so $L$ is conserved. At the start the moment of inertia is that of the disc plus the person at the rim: $I_1=\tfrac12(100)(2.0)^2+50(2.0)^2=200+200=400$ kg m$^2$, so $L=400\times2.0=800$ kg m$^2$/s. At the end the person is on the axis and adds nothing: $I_2=200$ kg m$^2$. Then $\omega_2=800/200=4.0$ rad/s.

    The kinetic energy has doubled, from $\tfrac12(400)(4)=800$ J to $\tfrac12(200)(16)=1600$ J: the person's muscles did 800 J of work walking inwards against the rotation. (Original problem.)
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A uniform disc of mass 2.0 kg and radius 0.50 m is free to turn about a fixed vertical axis through its centre, initially at rest. A 20 g bullet moving horizontally at 300 m/s, along a line tangent to the rim, hits the disc at the rim and sticks. Find the total kinetic energy of the disc and bullet just after the impact. (Original problem.)
  ask: Kinetic energy just after impact
  unit: J
  ans: 17.65
  tol: 0.02
  verify: (0.02*300*0.5)**2/(2*(0.5*2*0.5**2+0.02*0.5**2))
  sol: |
    Angular momentum about the axis is conserved through the impact (the axle's force has no torque about the axis). Before: $L=mvR=0.020\times300\times0.50=3.0$ kg m$^2$/s. After: $I=\tfrac12MR^2+mR^2=\tfrac12(2.0)(0.25)+0.020(0.25)=0.25+0.005=0.255$ kg m$^2$, so $\omega=L/I=11.8$ rad/s.

    Then $K=\tfrac12I\omega^2=L^2/2I=9.0/(2\times0.255)=17.6$ J. The bullet had $\tfrac12(0.020)(300)^2=900$ J before, so about 98% of its energy has gone into heat and deformation. (Original problem.)
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A uniform rod of length 1.5 m and mass $m$ is hinged at one end and released from rest in a horizontal position. Find its angular speed when it passes through the vertical. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Angular speed at the vertical
  unit: rad/s
  ans: 4.43
  tol: 0.02
  verify: sqrt(3*9.8/1.5)
  sol: |
    The hinge does no work, so energy is conserved. The centre of mass falls by $L/2$: $mg\,\dfrac L2=\tfrac12I\omega^2$ with $I=\tfrac13mL^2$ about the hinge. Then $\omega^2=\dfrac{mgL}{(1/3)mL^2}=\dfrac{3g}{L}$, so $\omega=\sqrt{3g/L}=\sqrt{3\times9.8/1.5}=4.43$ rad/s.

    Check by work: the gravitational torque is $mg(L/2)\cos\phi$ at angle $\phi$ below the horizontal, and its work from 0 to 90° is $mg(L/2)\int_0^{\pi/2}\cos\phi\,d\phi=mgL/2$, the same. (Original problem.)
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A uniform rod of length 1.2 m and mass $M$ lies on a smooth horizontal table. It is struck by a short horizontal impulse, at right angles to the rod, at one of its ends. Immediately afterwards, one point of the rod is instantaneously at rest. How far from the centre of the rod is that point? (Original problem.)
  ask: Distance of the point at rest from the centre
  unit: m
  ans: 0.2
  tol: 0.005
  verify: 1.2/6
  sol: |
    Let the impulse be $J$, applied at distance $x=L/2$ from the centre. Linear: $Mv_{cm}=J$. About the centre of mass, angular momentum equals the moment of the impulse: $I_{cm}\omega=Jx$ with $I_{cm}=\tfrac1{12}ML^2$, so $\omega=\dfrac{12Jx}{ML^2}$.

    A point on the opposite side of the centre, at distance $d$, moves at $v_{cm}-\omega d$ (the spin carries it backwards). It is at rest when $d=\dfrac{v_{cm}}{\omega}=\dfrac{J/M}{12Jx/ML^2}=\dfrac{L^2}{12x}$. With $x=L/2$: $d=L/6=1.2/6=0.20$ m, on the side opposite the blow. This point is the instantaneous centre of rotation; for a pivot placed there the hand feels no jolt, the "centre of percussion" idea. (Original problem.)
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A toy gyroscope has a wheel of moment of inertia 0.020 kg m$^2$ about its axle, spinning at 300 rad/s. The axle is horizontal and pivoted at one end. The total mass is 1.2 kg and the centre of mass is 0.15 m from the pivot. Find the angular speed at which the axle precesses about the vertical. Take $g=9.8$ m/s$^2$ and assume the spin is much faster than the precession. (Original problem.)
  ask: Precession rate
  unit: rad/s
  ans: 0.294
  tol: 0.003
  verify: 1.2*9.8*0.15/(0.02*300)
  sol: |
    The weight acts at the centre of mass, a distance $r=0.15$ m from the pivot, so its torque about the pivot is $\tau=mgr=1.2\times9.8\times0.15=1.76$ N m, horizontal and perpendicular to the axle. The spin angular momentum is $L=I\omega=0.020\times300=6.0$ kg m$^2$/s, along the axle.

    The torque turns the direction of $\vec L$ without changing its size: in a short time $dt$ the tip of $\vec L$ moves by $\tau\,dt$, a turn of $d\phi=\tau\,dt/L$. So the precession rate is $\Omega=\dfrac{\tau}{L}=\dfrac{mgr}{I\omega}=\dfrac{1.76}{6.0}=0.294$ rad/s, about one turn in 21 s. This is valid when $\omega\gg\Omega$ (here 300 against 0.29). [Standard result; the neglected extra term from the precession's own angular momentum is small in this limit.] (Original problem.)
  check: code
