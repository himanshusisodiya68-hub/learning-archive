- id: f2
  lvl: found
  kind: mcq
  q: A rod moves parallel to its own length in a uniform magnetic field. The motional emf across it is
  opts: ["Blv", "zero", "Bl²", "B/lv"]
  ans: 1
  sol: |
    The Lorentz force $q\mathbf v\times\mathbf B$ is perpendicular to the rod, so it does not push charges along the rod: no emf.
  check: none

- id: b1
  lvl: board
  kind: num
  q: A rod of length 20 cm slides on frictionless rails 20 cm apart, in a 0.5 T field normal to the rails, at 3 m/s. The rails are joined by a 0.6 Ω resistor. Find the current and the force needed to keep the rod moving uniformly. (Original problem.) Give the force.
  ask: Force needed
  unit: N
  ans: 0.05
  tol: 0.0001
  verify: (0.5*0.2*3/0.6)*0.5*0.2
  sol: |
    $\varepsilon = Blv = 0.5\times0.2\times3 = 0.3$ V, $I = \varepsilon/R = 0.5$ A. The magnetic force on the rod is $BIl = 0.5\times0.5\times0.2 = 0.05$ N, opposing the motion, so an equal applied force of 0.05 N is needed. (Check with power: $Fv = 0.05\times3 = 0.15$ W $= I^2R = 0.25\times0.6$.)
  check: code

- id: b2
  lvl: board
  kind: text
  q: Where does the energy come from that appears as heat in a resistor connected to a rod moving in a magnetic field? (Original problem.)
  sol: |
    From the agent that pushes the rod. The induced current in the rod experiences a magnetic force $BIl$ opposing the motion (Lenz's law), so the agent must do work at a rate $Fv$, equal to the electrical power $\varepsilon I = I^2R$ dissipated in the circuit. The magnetic field itself does no net work; it only transfers energy from mechanical to electrical form.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A rod of length 1 m rotates about one end at 10 rev/s in a plane perpendicular to a 0.2 T field. Find the potential difference between the ends. (Original problem.)
  ask: Potential difference
  unit: V
  ans: 6.283
  tol: 0.005
  verify: 0.5*0.2*2*Math.PI*10*1
  sol: $\varepsilon = \tfrac12B\omega L^2 = \tfrac12\times0.2\times(2\pi\times10)\times1 = 6.28$ V.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A rectangular loop of width 10 cm and resistance 4 Ω is partly in a 0.5 T field and pulled out at 2 m/s. Find the power needed to pull it at constant speed. (Original problem.)
  ask: Power
  unit: mW
  ans: 2.5
  tol: 0.01
  verify: (0.5*0.1*2)**2/4*1000
  sol: |
    $\varepsilon = Blv = 0.5\times0.1\times2 = 0.1$ V, $I = 0.1/4 = 0.025$ A. The power is $\varepsilon I = I^2R = (0.025)^2\times4 = 2.5\times10^{-3}$ W. Then it equals $Fv$ with $F = BIl = 0.5\times0.025\times0.1 = 1.25\times10^{-3}$ N and $v = 2$ m/s: $2.5\times10^{-3}$ W.
  check: code
