- id: b1
  lvl: board
  kind: num
  q: A football is kicked with a speed of 20 m/s at $45^\circ$ above the horizontal. Find the maximum height it reaches (take $g = 9.8$ m/s²). (The range is also asked in the solution.) (Original problem.)
  ask: Maximum height
