- id: f3
  lvl: found
  kind: num
  q: A marble rolls off a table 0.80 m high with a horizontal speed of 3.0 m/s. How far from the foot of the table does it land (take $g = 9.8$ m/s²)? (Original problem.)
  ask: Horizontal distance from the table
  unit: m
  ans: 1.21
  tol: 0.01
  verify: 3.0*sqrt(2*0.80/9.8)
  sol: |
    Fall time from $0.80 = \tfrac12(9.8)t^2$: $t = \sqrt{1.6/9.8} = 0.404$ s. Horizontal distance $= 3.0\times0.404 = 1.21$ m. The fall time does not depend on the horizontal speed.
