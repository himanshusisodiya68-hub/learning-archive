# Projectile motion. NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27) Ch 3 (Motion in a Plane; Examples 3.6–3.8 and Exercises 3.12–3.13). Found, board and main problems are original.

- id: ncert11-eg-3-6
  lvl: ncert-intext
  num: "XI Ex 3.6"
  source: NCERT XI Physics · Ch 3 · Example 3.6
  kind: proof
  q: |-
    Galileo, in his book *Two new sciences*, stated that "for elevations which exceed or fall short of 45° by equal amounts, the ranges are equal". Prove this statement.
  hints:
    - Start from R = v₀² sin 2θ₀ / g.
    - Write the two angles as 45° + α and 45° − α, so that 2θ₀ is 90° + 2α and 90° − 2α.
    - Use sin(90° + x) = sin(90° − x) = cos x.
  sol: |
    For a projectile launched with speed $v_0$ at angle $\theta_0$ to the horizontal on level ground, the range is
    $$R = \frac{v_0^2\sin2\theta_0}{g}.$$
    For elevations $45^\circ + \alpha$ and $45^\circ - \alpha$, the doubled angles are $2\theta_0 = 90^\circ + 2\alpha$ and $90^\circ - 2\alpha$. Since
    $$\sin(90^\circ + 2\alpha) = \sin(90^\circ - 2\alpha) = \cos2\alpha,$$
    both give $R = \dfrac{v_0^2\cos2\alpha}{g}$. Hence the ranges are equal for elevations that exceed or fall short of $45^\circ$ by equal amounts $\alpha$. The two angles are complementary ($\theta_0 + \theta_0' = 90^\circ$), and the maximum range $v_0^2/g$ occurs at $\alpha = 0$.

    The statement assumes the same launch speed, the same level for launch and landing, and negligible air resistance.
  check: none

- id: ncert11-eg-3-7
  lvl: ncert-intext
  num: "XI Ex 3.7"
  source: NCERT XI Physics · Ch 3 · Example 3.7
  kind: num
  q: |-
    A hiker stands on the edge of a cliff 490 m above the ground and throws a stone horizontally with an initial speed of 15 m s⁻¹. Neglecting air resistance, find the time taken by the stone to reach the ground, and the speed with which it hits the ground. (Take $g = 9.8$ m s⁻²).
  ask: Speed with which the stone hits the ground
  unit: m/s
  ans: 99
  tol: 0.5
  verify: sqrt(15**2+(9.8*sqrt(2*490/9.8))**2)
  sol: |
    Choose the origin at the cliff edge, $t = 0$ when the stone is thrown, $+x$ along the initial velocity and $+y$ vertically upward. The components move independently: $x = v_{0x}t$ with $v_{0x} = 15$ m s⁻¹ and $v_{0y} = 0$, and $y = -\tfrac12 g t^2$.

    The stone reaches the ground when $y = -490$ m:
    $$-490 = -\tfrac12(9.8)t^2 \Rightarrow t = \sqrt{\frac{2\times490}{9.8}} = 10\ \text{s}.$$

    At that instant $v_x = 15$ m s⁻¹ and $v_y = 0 - 9.8\times10 = -98$ m s⁻¹, so
    $$v = \sqrt{15^2 + 98^2} = \sqrt{9829} \approx 99\ \text{m s}^{-1},$$
    directed at $\tan^{-1}(98/15) \approx 81^\circ$ below the horizontal. The stone lands $15\times10 = 150$ m from the foot of the cliff.
  answer_key: "t = 10 s; speed ≈ 99 m s⁻¹ (printed in the example)"
  check: both

- id: ncert11-eg-3-8
  lvl: ncert-intext
  num: "XI Ex 3.8"
  source: NCERT XI Physics · Ch 3 · Example 3.8
  kind: num
  q: |-
    A cricket ball is thrown at a speed of 28 m s⁻¹ in a direction $30^\circ$ above the horizontal. Calculate (a) the maximum height, (b) the time taken by the ball to return to the same level, and (c) the distance from the thrower to the point where the ball returns to the same level.
  ask: Distance from the thrower to where the ball returns to the same level, part (c)
  unit: m
  ans: 69
  tol: 0.5
  verify: 28*28*sin(rad(60))/9.8
  sol: |
    With $v_0 = 28$ m s⁻¹, $\theta_0 = 30^\circ$, $g = 9.8$ m s⁻²:

    (a) $h_m = \dfrac{(v_0\sin\theta_0)^2}{2g} = \dfrac{(28\sin30^\circ)^2}{2(9.8)} = \dfrac{14^2}{19.6} = 10.0$ m.

    (b) $T_f = \dfrac{2v_0\sin\theta_0}{g} = \dfrac{2\times28\times0.5}{9.8} = \dfrac{28}{9.8} = 2.9$ s.

    (c) $R = \dfrac{v_0^2\sin2\theta_0}{g} = \dfrac{28\times28\times\sin60^\circ}{9.8} = 69$ m. (Check: $v_0\cos30^\circ\times T_f = 24.25\times2.857 = 69.3$ m.)
  answer_key: "(a) 10.0 m; (b) 2.9 s; (c) 69 m (printed in the example)"
  check: both

- id: ncert11-ex-3-12
  lvl: ncert-ex
  num: "XI 3.12"
  source: NCERT XI Physics · Ch 3 · Exercise 3.12
  kind: num
  q: |-
    The ceiling of a long hall is 25 m high. What is the maximum horizontal distance that a ball thrown with a speed of 40 m s⁻¹ can go without hitting the ceiling of the hall?
  ask: Maximum horizontal distance
  unit: m
  ans: 150.5
  tol: 0.5
  verify: 2*sqrt(40**2-2*9.8*25)*sqrt(2*9.8*25)/9.8
  sol: |
    [Inference] The ball is assumed to be thrown from floor level with $g = 9.8$ m s⁻²; the problem does not state either, but the key's 150.5 m follows from them.

    The ball must not rise above 25 m, so $\dfrac{(v_0\sin\theta)^2}{2g} \le 25$. The range $R = \dfrac{v_0^2\sin2\theta}{g}$ grows with $\theta$ up to $45^\circ$, but at $45^\circ$ the height would be $\dfrac{40^2\times\frac12}{19.6} = 40.8$ m, above the ceiling. So the best throw is the steepest one that just grazes the ceiling:
    $$v_0\sin\theta = \sqrt{2\times9.8\times25} = 22.14\ \text{m s}^{-1}\Rightarrow \sin\theta = 0.553,\ \theta = 33.6^\circ.$$
    Then $v_0\cos\theta = \sqrt{40^2 - 22.14^2} = 33.32$ m s⁻¹, and
    $$R = \frac{2(v_0\cos\theta)(v_0\sin\theta)}{g} = \frac{2\times33.32\times22.14}{9.8} = 150.5\ \text{m}.$$
    The unconstrained maximum range would be $v_0^2/g = 163$ m; the ceiling costs about 13 m.
  answer_key: "150.5 m"
  check: both

- id: ncert11-ex-3-13
  lvl: ncert-ex
  num: "XI 3.13"
  source: NCERT XI Physics · Ch 3 · Exercise 3.13
  kind: num
  q: |-
    A cricketer can throw a ball to a maximum horizontal distance of 100 m. How much high above the ground can the cricketer throw the same ball?
  ask: Maximum height
  unit: m
  ans: 50
  tol: 0.1
  verify: 100/2
  sol: |
    The maximum range comes from a $45^\circ$ throw: $R_{\max} = v_0^2/g = 100$ m, so $v_0^2 = 100g$.

    The highest throw is vertical, giving
    $$h_{\max} = \frac{v_0^2}{2g} = \frac{100g}{2g} = 50\ \text{m}.$$
    The answer does not depend on the value of $g$, and assumes the cricketer can throw at the same speed at any angle.
  answer_key: "50 m"
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: At the highest point of its flight, a projectile (no air resistance) has zero
  opts: ["acceleration", "horizontal component of velocity", "vertical component of velocity", "speed"]
  ans: 2
  sol: At the top, $v_y = v_0\sin\theta - gt = 0$. The horizontal component $v_0\cos\theta$ never changes, so the speed there is $v_0\cos\theta$ (not zero for $\theta<90^\circ$), and the acceleration is still $g$ downward. (Original problem.)
