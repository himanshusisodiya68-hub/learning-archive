- id: f3
  lvl: found
  kind: mcq
  q: The Earth pulls the Moon with a force F. The force with which the Moon pulls the Earth is
  opts: ["much smaller than F, because the Moon is lighter", "exactly F, in the opposite direction", "much larger than F, because the Earth is heavier"]
  ans: 1
  sol: Newton's third law applies to gravity. The two forces are an action-reaction pair, $\mathbf F_{12} = -\mathbf F_{21}$, equal in size and opposite in direction. The Moon's acceleration is larger only because its mass is smaller.
  check: none

- id: b2
  lvl: board
  kind: num
  q: Find the gravitational force between the Earth ($6.0\times10^{24}$ kg) and the Moon ($7.4\times10^{22}$ kg), whose centres are $3.84\times10^8$ m apart.
  ask: Force
  unit: × 10²⁰ N
  ans: 2.008
  tol: 0.01
  verify: 6.67e-11*6e24*7.4e22/(3.84e8)**2/1e20
  sol: $F = GM_EM_M/r^2 = 6.67\times10^{-11}\times6.0\times10^{24}\times7.4\times10^{22}/(3.84\times10^{8})^2 = 2.0\times10^{20}$ N. This single force keeps the Moon on its curved path.
  check: code

- id: m2
  lvl: main
  kind: num
  q: Two point masses $m$ and $4m$ are $1.2$ m apart. At what distance from the mass $m$, on the line joining them, does a third small mass feel zero net gravitational force?
  ask: Distance from the mass m
  unit: m
  ans: 0.4
  tol: 0.005
  verify: 1.2/(1+sqrt(4))
  sol: |
    The pulls cancel only between the masses. Let the distance from $m$ be $x$. Then $Gm/x^2 = G(4m)/(1.2-x)^2$, so $(1.2-x) = 2x$ and $x = 0.4$ m. In general the null point divides the line in the ratio $1 : \sqrt{M_2/M_1}$, here $1:2$.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: The Moon's mass is 1/81 of the Earth's and the centre-to-centre distance is 3.84 × 10⁵ km. How far from the Earth's centre is the point where their pulls on a spacecraft balance?
  ask: Distance from the Earth's centre
  unit: × 10⁵ km
  ans: 3.456
  tol: 0.003
  verify: 3.84*9/10
  sol: Balance needs $M/x^2 = (M/81)/(d - x)^2$, so $d - x = x/9$ and $x = 9d/10 = 3.46\times10^5$ km, 90% of the way to the Moon.
  check: code
