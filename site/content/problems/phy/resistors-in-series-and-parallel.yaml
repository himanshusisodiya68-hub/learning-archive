# Resistors in series and parallel. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 11, §11.6. Found, board and main problems are original.

- id: ncert-eg11-7
  lvl: ncert-intext
  num: "Ex 11.7"
  source: NCERT X Science · Ch 11 · Example 11.7
  kind: num
  q: An electric lamp, whose resistance is 20 Ω, and a conductor of 4 Ω resistance are connected to a 6 V battery (Fig. 11.9). Calculate (a) the total resistance of the circuit, (b) the current through the circuit, and (c) the potential difference across the electric lamp and conductor.
  ask: Current through the circuit, part (b)
  unit: A
  ans: 0.25
  tol: 0.001
  verify: 6/(20+4)
  sol: |
    The lamp and the conductor are in series (Fig. 11.9).

    (a) $R_s = 20 + 4 = 24\ \Omega$.

    (b) $I = V/R_s = 6/24 = 0.25$ A.

    (c) Across the lamp, $V_1 = 20\times0.25 = 5$ V. Across the conductor, $V_2 = 4\times0.25 = 1$ V. Check: $5 + 1 = 6$ V.
  check: code

- id: ncert-it11-6a-1
  lvl: ncert-intext
