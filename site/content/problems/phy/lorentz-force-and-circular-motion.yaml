# Lorentz force and circular motion of charged particles. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 4, §4.2–4.3 and Exercises. The printed text gives e = 1.5 × 10⁻¹⁹ C in Exercise 4.11; this is discussed in that solution. Found, board and main problems are original.

- id: ncert12-eg-4-2
  lvl: ncert-intext
  num: "XII Ex 4.2"
  source: NCERT XII Physics · Ch 4 · Example 4.2
  kind: text
  q: If the magnetic field is parallel to the positive y-axis and the charged particle is moving along the positive x-axis (Fig. 4.4), which way would the Lorentz force be for (a) an electron (negative charge), (b) a proton (positive charge).
  sol: |
    The velocity is along $x$ and $\mathbf B$ along $y$, so $\mathbf v\times\mathbf B$ is along $\hat x\times\hat y = +\hat z$ (screw rule / right-hand rule). (a) For the electron the force $q\mathbf v\times\mathbf B$ is along $-z$. (b) For the proton (positive charge) the force is along $+z$.
  check: none

- id: ncert12-eg-4-3
  lvl: ncert-intext
  num: "XII Ex 4.3"
  source: NCERT XII Physics · Ch 4 · Example 4.3
  kind: num
  q: What is the radius of the path of an electron (mass 9 × 10⁻³¹ kg and charge 1.6 × 10⁻¹⁹ C) moving at a speed of 3 × 10⁷ m/s in a magnetic field of 6 × 10⁻⁴ T perpendicular to it? What is its frequency? Calculate its energy in keV. ( 1 eV = 1.6 × 10⁻¹⁹ J).
  ask: Radius of the path
  unit: cm
  ans: 28
  tol: 0.2
  verify: 9e-31*3e7/(1.6e-19*6e-4)*100
  sol: |
    The magnetic force provides the centripetal force, $qvB = mv^2/r$, so

    $$r = \frac{mv}{qB} = \frac{9\times10^{-31}\times3\times10^{7}}{1.6\times10^{-19}\times6\times10^{-4}} = 0.28\ \text{m} = 28\ \text{cm}.$$

    Frequency: $\nu = \dfrac{v}{2\pi r} = \dfrac{qB}{2\pi m} = 1.7\times10^{7}$ Hz $= 17$ MHz.

    Energy: $E = \tfrac12mv^2 = \tfrac12\times9\times10^{-31}\times9\times10^{14} = 4.05\times10^{-16}$ J $\approx 2.5$ keV.
  check: code

- id: ncert12-ex-4-11
  lvl: ncert-ex
  num: "XII 4.11"
  source: NCERT XII Physics · Ch 4 · Exercise 4.11
  kind: num
  q: In a chamber, a uniform magnetic field of 6.5 G (1 G = 10⁻⁴ T ) is maintained. An electron is shot into the field with a speed of 4.8 × 10⁶ m s⁻¹ normal to the field. Explain why the path of the electron is a circle. Determine the radius of the circular orbit. (e = 1.5 × 10⁻¹⁹ C, m_e = 9.1×10⁻³¹ kg )
  ask: Radius of the orbit
  unit: cm
  ans: 4.2
  tol: 0.01
  verify: 9.1e-31*4.8e6/(1.6e-19*6.5e-4)*100
  sol: |
    The magnetic force $-e\mathbf v\times\mathbf B$ is always perpendicular to the velocity, so it changes the direction but not the magnitude of $\mathbf v$. Since $\mathbf v\perp\mathbf B$, the force has constant magnitude $evB$ and is always directed towards a fixed centre in the plane perpendicular to $\mathbf B$: that is uniform circular motion.

    $$r = \frac{mv}{eB} = \frac{9.1\times10^{-31}\times4.8\times10^{6}}{1.6\times10^{-19}\times6.5\times10^{-4}} = 4.2\times10^{-2}\ \text{m} = 4.2\ \text{cm}.$$

    **Discrepancy:** the question as printed gives $e = 1.5\times10^{-19}$ C, which would give $r = 4.5$ cm. The answer key (4.2 cm) corresponds to $e = 1.6\times10^{-19}$ C, the true value, so the "1.5" looks like a typographical error. [Inference] I use $1.6\times10^{-19}$ C.
  answer_key: 4.2 cm
  check: both

- id: ncert12-ex-4-12
  lvl: ncert-ex
  num: "XII 4.12"
  source: NCERT XII Physics · Ch 4 · Exercise 4.12
  kind: num
  q: In Exercise 4.11 obtain the frequency of revolution of the electron in its circular orbit. Does the answer depend on the speed of the electron? Explain.
  ask: Frequency
  unit: MHz
  ans: 18.2
  tol: 0.1
  verify: 1.6e-19*6.5e-4/(2*Math.PI*9.1e-31)/1e6
  sol: |
    $\nu = \dfrac{eB}{2\pi m} = \dfrac{1.6\times10^{-19}\times6.5\times10^{-4}}{2\pi\times9.1\times10^{-31}} = 1.8\times10^{7}$ Hz $\approx 18$ MHz.

    It does **not** depend on the speed. A faster electron moves on a bigger circle ($r\propto v$) but covers it proportionally faster ($T = 2\pi r/v = 2\pi m/eB$), so the time for one revolution is the same. This is the principle of the cyclotron. (The printed $e = 1.5\times10^{-19}$ C is again taken as $1.6\times10^{-19}$ C; see Exercise 4.11.)
  answer_key: 18 MHz
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: The work done by the magnetic force on a moving charged particle is
  opts: ["always positive", "always negative", "zero", "depends on the speed"]
  ans: 2
  sol: |
    The force $q\mathbf v\times\mathbf B$ is perpendicular to $\mathbf v$, so $\mathbf F\cdot\mathbf v = 0$ and no work is done: the kinetic energy and speed are unchanged.
  check: none

