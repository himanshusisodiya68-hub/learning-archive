- id: b2
  lvl: board
  kind: num
  q: Find the time period of revolution of a proton in a 1.0 T magnetic field. (m = 1.67 × 10⁻²⁷ kg, e = 1.6 × 10⁻¹⁹ C.) (Original problem.)
  ask: Period
  unit: ns
  ans: 65.58
  tol: 0.05
  verify: 2*Math.PI*1.67e-27/(1.6e-19*1.0)*1e9
  sol: $T = 2\pi m/(eB) = 2\pi\times1.67\times10^{-27}/(1.6\times10^{-19}\times1.0) = 6.56\times10^{-8}$ s $\approx 66$ ns, independent of the speed.
  check: code

- id: m1
  lvl: main
  kind: num
  q: An electron accelerated from rest through 100 V enters a uniform field of 1.0 × 10⁻³ T perpendicular to its velocity. Find the radius of its orbit. (m = 9.11 × 10⁻³¹ kg, e = 1.6 × 10⁻¹⁹ C.) (Original problem.)
  ask: Radius
  unit: cm
  ans: 3.375
  tol: 0.01
  verify: 9.11e-31*Math.sqrt(2*1.6e-19*100/9.11e-31)/(1.6e-19*1.0e-3)*100
  sol: |
    Speed: $\tfrac12mv^2 = eV$ gives $v = \sqrt{2eV/m} = 5.9\times10^{6}$ m/s. Radius: $r = mv/(eB) = 9.11\times10^{-31}\times5.93\times10^{6}/(1.6\times10^{-19}\times10^{-3}) = 3.4\times10^{-2}$ m $= 3.4$ cm.
  check: code

- id: m2
  lvl: main
  kind: text
  q: A charged particle moves in a region with uniform electric field E and uniform magnetic field B, both perpendicular to its velocity and to each other, and goes straight. Find its speed and say whether it depends on the particle's charge and mass. (Original problem.)
  sol: |
    For straight-line motion the electric force $qE$ must balance the magnetic force $qvB$: $v = E/B$. The charge and mass cancel, so the speed does not depend on them (a velocity selector).
  check: none
