- id: b1
  lvl: board
  kind: num
  q: A 60 kg student runs up a staircase and rises 4.5 m in the process. Find her gain in gravitational potential energy. Take $g = 9.8\ \text{m s}^{-2}$. Does the answer depend on how quickly she runs? (Original problem.)
  ask: Gain in potential energy
  unit: J
  ans: 2646
  tol: 2
  verify: 60*9.8*4.5
  sol: |
    $\Delta U = mgh = 60\times9.8\times4.5 = 2646$ J ($\approx 2.6$ kJ).

    No. The gain in potential energy depends only on the mass and the change in height. Running faster changes the *power* she needs, not the energy gained.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A car of mass 1000 kg speeds up from 36 km/h to 72 km/h. By how much does its kinetic energy increase, and by what factor? Give the increase in joules. (Original problem.)
  ask: Increase in kinetic energy
  unit: J
  ans: 150000
  tol: 100
  verify: 0.5*1000*(20**2-10**2)
  sol: |
    36 km/h = 10 m/s and 72 km/h = 20 m/s.
    $$K_i = \tfrac12(1000)(10)^2 = 5.0\times10^4\ \text{J},\qquad K_f = \tfrac12(1000)(20)^2 = 2.0\times10^5\ \text{J}.$$
    The increase is $1.5\times10^5$ J. The kinetic energy becomes **4 times** as large for a doubled speed. Note the second 10 m/s costs three times as much energy as the first.
  check: code

- id: b3
  lvl: board
  kind: text
  q: Why is kinetic energy never negative, while potential energy can be negative? (Original problem.)
  sol: |
    Kinetic energy $\tfrac12mv^2$ is a product of a positive mass and a squared speed, so it can never be below zero; zero means the body is at rest.

    Potential energy is measured *from a reference position that we choose*, and only its changes have physical meaning. If we set $U = 0$ at the ground, an object in a well below ground level has $U = mgh < 0$ with $h$ negative. Likewise, for a spring $U = \tfrac12kx^2$ is zero at the natural length by choice. A negative $U$ simply means the energy is lower than at the reference position.
  check: none

- id: m1
  lvl: main
  kind: num
  q: Two bodies A and B of masses $m$ and $4m$ have the same linear momentum. Find the ratio $K_A/K_B$ of their kinetic energies. (Original problem.)
  ask: $K_A/K_B$
  unit: ""
  ans: 4
  tol: 0.01
  verify: (1/1)/(1/4)
  sol: |
    Write $K$ in terms of momentum $p = mv$: $K = \dfrac{p^2}{2m}$. For equal $p$, $K \propto 1/m$, so
    $$\frac{K_A}{K_B} = \frac{4m}{m} = 4.$$
    The lighter body has 4 times the kinetic energy for the same momentum.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A 1.5 kg book sits on a shelf 2.0 m above the floor. A table top is 0.8 m above the floor. Find the change in the book's gravitational potential energy when it is moved from the shelf to the table. Take $g = 9.8\ \text{m s}^{-2}$, and comment on how the answer changes if the reference level is moved to the table top. (Original problem.)
  ask: Change in potential energy (shelf to table)
  unit: J
  ans: -17.64
  tol: 0.05
  verify: -1.5*9.8*(2.0-0.8)
  sol: |
    The height falls by $2.0 - 0.8 = 1.2$ m, so
    $$\Delta U = -mg\,\Delta h = -1.5\times9.8\times1.2 = -17.6\ \text{J}.$$
    With the floor as reference, $U_{\text{shelf}} = 29.4$ J and $U_{\text{table}} = 11.8$ J. With the table top as reference, $U_{\text{shelf}} = 17.6$ J and $U_{\text{table}} = 0$. The values of $U$ change with the reference, but the *difference*, $-17.6$ J, does not. Only differences of potential energy are physical.
  check: code

- id: m3
  lvl: main
  kind: num
  q: The kinetic energy of a particle is increased by 44%. By what percentage does the magnitude of its momentum increase? (Original problem.)
  ask: Percentage increase in momentum
  unit: "%"
  ans: 20
  tol: 0.05
  verify: (sqrt(1.44)-1)*100
  sol: |
    $p = \sqrt{2mK}$, so $p \propto \sqrt K$. If $K' = 1.44K$ then $p'/p = \sqrt{1.44} = 1.2$, an increase of **20%**.
  check: code

- id: m4
  lvl: main
  kind: num
  q: From what height must a car be dropped from rest to have the same kinetic energy it has when moving at 72 km/h? Take $g = 9.8\ \text{m s}^{-2}$ and ignore air resistance. (Original problem.)
  ask: Height
  unit: m
  ans: 20.4
  tol: 0.1
  verify: 20**2/(2*9.8)
  sol: |
    72 km/h = 20 m/s. Equating $mgh = \tfrac12mv^2$, the mass cancels:
    $$h = \frac{v^2}{2g} = \frac{20^2}{2\times9.8} = 20.4\ \text{m}.$$
    This is about a six-storey building, which makes the danger of a 72 km/h crash easy to picture.
  check: code
