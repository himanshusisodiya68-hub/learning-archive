  q: Find the gain in gravitational potential energy of a 5 kg bag lifted 2 m above the floor. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Gain in potential energy
  unit: J
  ans: 98
  tol: 0.5
