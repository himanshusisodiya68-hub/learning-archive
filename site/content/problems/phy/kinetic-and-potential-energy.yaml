- id: f2
  lvl: found
  kind: mcq
  q: A body's mass is doubled and its speed is halved. Its kinetic energy then (Original problem.)
  opts: ["doubles", "is halved", "is unchanged", "becomes one-quarter"]
  ans: 1
  sol: |
    $K' = \tfrac12(2m)(v/2)^2 = \tfrac12\cdot\tfrac{2}{4}mv^2 = \tfrac12\left(\tfrac12 mv^2\right)$, so the kinetic energy is **halved**. The factor 2 from the mass is beaten by the factor $\tfrac14$ from the squared speed.
  check: none

- id: f3
  lvl: found
