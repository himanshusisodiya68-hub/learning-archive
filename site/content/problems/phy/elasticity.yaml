- id: f3
  lvl: found
  kind: mcq
  q: Within the elastic limit, the extension of a wire is doubled by doubling the load. This is a statement of
  opts: ["Pascal's law", "Hooke's law", "Archimedes' principle", "Bernoulli's principle"]
  ans: 1
  sol: Hooke's law says stress is proportional to strain (equivalently, extension is proportional to load) within the elastic limit. (Original problem.)
