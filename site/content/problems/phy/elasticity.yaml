- id: b1
  lvl: board
  kind: num
  q: A steel wire of length 2.0 m and diameter 1.0 mm carries a load of 20 kg. Find its elongation. Take $Y = 2.0\times10^{11}$ N/m² and g = 9.8 m/s². (Original problem.)
  ask: Elongation
  unit: mm
  ans: 2.50
  tol: 0.02
  verify: (20*9.8*2.0/(PI*(0.5e-3)**2*2.0e11))*1e3
  sol: |
    $F = 20\times9.8 = 196$ N, $A = \pi(0.5\times10^{-3})^2 = 7.85\times10^{-7}$ m$^2$.
    $$\Delta L = \frac{FL}{AY} = \frac{196\times2.0}{7.85\times10^{-7}\times2.0\times10^{11}} = 2.5\times10^{-3}\ \text{m} = 2.5\ \text{mm}.$$
  check: code

- id: b2
  lvl: board
  kind: num
  q: Find the elastic potential energy stored in the wire of the previous problem (steel, 2.0 m long, 1.0 mm diameter, load 20 kg). (Original problem.)
  ask: Stored energy
  unit: mJ
  ans: 245
  tol: 2
  verify: 0.5*(20*9.8)*(20*9.8*2.0/(PI*(0.5e-3)**2*2.0e11))*1e3
  sol: |
    Work done in stretching is $\tfrac12F\,\Delta L$ (the force grows from 0 to $F$): $U = \tfrac12\times196\times2.5\times10^{-3} = 0.245$ J $=245$ mJ. Equivalently $U = \tfrac12\times\text{stress}\times\text{strain}\times\text{volume}$.
  check: code

- id: b3
  lvl: board
  kind: text
  q: Rubber stretches far more than steel under the same load. Which has the larger Young's modulus, and which is called more elastic? Explain. (Original problem.)
  sol: |
    Steel has the larger Young's modulus ($\approx2\times10^{11}$ N m$^{-2}$ against $\sim10^{6}$ to $10^{7}$ for rubber). $Y = $ stress/strain, so a material that gives a small strain for a large stress has a large $Y$. In physics, the more elastic material is the one that resists deformation more strongly, and returns to its shape, so steel is the more elastic. Everyday language says the opposite because we call the stretchier material "elastic". (Original problem; compare Point to ponder 6 of the chapter.)
  check: none

- id: m1
  lvl: main
  kind: num
  q: A copper wire of uniform cross-section hangs vertically from a fixed support. Its density is 8900 kg/m³ and it breaks when the stress at the top reaches 2.5 × 10⁸ N/m². What is the greatest length of wire that can hang without breaking under its own weight? Take g = 9.8 m/s². (Original problem.)
  ask: Greatest length
  unit: km
  ans: 2.87
  tol: 0.02
  verify: 2.5e8/(8900*9.8)/1e3
  sol: |
    At the top, the tension equals the whole weight, $\rho A L g$, so the stress there is $\sigma = \rho g L$, independent of $A$. Setting $\sigma = 2.5\times10^{8}$:
    $$L = \frac{\sigma}{\rho g} = \frac{2.5\times10^{8}}{8900\times9.8} = 2.87\times10^{3}\ \text{m}.$$
  check: code

- id: m2
  lvl: main
  kind: num
  q: A steel rod and a copper rod, identical in length and cross-section, are joined side by side and together carry a total tensile load of 1000 N so that they stretch by the same amount. What load does the steel rod carry? Take $Y_{steel} = 2.0\times10^{11}$ and $Y_{Cu} = 1.1\times10^{11}$ N/m². (Original problem.)
  ask: Load on steel
  unit: N
  ans: 645
  tol: 1
  verify: 1000*2.0/(2.0+1.1)
  sol: |
    Equal extension, length and area mean the load shares are in the ratio of the Young's moduli: $F = YA\,\Delta L/L$, so $F_s/F_c = Y_s/Y_c = 2.0/1.1$. With $F_s + F_c = 1000$ N,
    $$F_s = 1000\times\frac{2.0}{3.1} = 645\ \text{N},\qquad F_c = 355\ \text{N}.$$
  check: code

- id: m3
  lvl: main
  kind: num
  q: A steel rod is held rigidly between two fixed walls with no slack at 20 °C. It is then heated by 50 °C. Find the compressive stress that develops. Take $Y = 2.0\times10^{11}$ N/m² and the coefficient of linear expansion $\alpha = 1.2\times10^{-5}$ per °C. (Original problem.)
  ask: Stress
  unit: MPa
  ans: 120
  tol: 0.5
  verify: 2.0e11*1.2e-5*50/1e6
  sol: |
    Free expansion would be $\Delta L = \alpha L\,\Delta T$, a strain of $\alpha\,\Delta T = 6\times10^{-4}$. The walls forbid it, so they squeeze the rod back by that same strain, creating a stress $\sigma = Y\alpha\,\Delta T = 2.0\times10^{11}\times6\times10^{-4} = 1.2\times10^{8}$ N m$^{-2}$ $=120$ MPa. It does not depend on the rod's length or area.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A steel wire of uniform cross-section hangs vertically from a fixed support. Its length is 200 m. By how much does it stretch under its own weight alone? The density of steel is 7800 kg/m³, $Y = 2.0\times10^{11}$ N/m² and $g = 9.8$ m/s². (Original problem.)
  ask: Extension under its own weight
  unit: mm
  ans: 7.644
  tol: 0.02
  verify: 7800*9.8*200**2/(2*2.0e11)*1e3
  sol: |
    At a distance $x$ above the free end, the wire carries the weight of the length $x$ below it, so the stress is $\rho gx$ and the strain is $\rho gx/Y$. A small piece $dx$ stretches by $(\rho gx/Y)\,dx$. Adding all pieces from $x = 0$ to $L$:
    $$\Delta L = \int_0^L\frac{\rho gx}{Y}\,dx = \frac{\rho gL^2}{2Y} = \frac{7800\times9.8\times200^2}{2\times2.0\times10^{11}} = 7.64\times10^{-3}\ \text{m}.$$
    This is half of what a *light* wire of the same length would stretch under a load equal to its total weight, because the stress falls steadily from the top to zero at the bottom. The area cancels, so the thickness does not matter.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A steel wire of length 1.0 m and diameter 1.0 mm is fixed at the top and carries a mass of 2.0 kg at the bottom. If the mass is pulled down slightly and released, it oscillates up and down. Treating the wire as a spring obeying Hooke's law and ignoring the wire's own mass, find the frequency. Take $Y = 2.0\times10^{11}$ N/m². (Original problem.)
  ask: Frequency of vertical oscillation
  unit: Hz
  ans: 44.6
  tol: 0.2
  verify: sqrt(2.0e11*PI*(0.5e-3)**2/1.0/2.0)/(2*PI)
  sol: |
    Pulling the mass down by a small $x$ stretches the wire by $x$ more, so the restoring force is $F = (YA/L)\,x$: the wire is a spring with $k = YA/L$.
    $$k = \frac{2.0\times10^{11}\times\pi(0.5\times10^{-3})^2}{1.0} = 1.57\times10^{5}\ \text{N/m}.$$
    A mass on a spring oscillates with $\nu = \dfrac1{2\pi}\sqrt{k/m}$, so
    $$\nu = \frac{1}{2\pi}\sqrt{\frac{1.57\times10^{5}}{2.0}} = 44.6\ \text{Hz}.$$
    The static stretch under the 2 kg weight is only $19.6/1.57\times10^5 = 0.125$ mm, so the oscillations are tiny and quick. The period of a mass on a spring is derived in the leaf on springs and pendulums.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A steel wire of length 3.0 m and cross-section 1.0 mm² is stretched until it stores 0.90 J of elastic energy, still within the elastic limit. By how much has it been stretched? Take $Y = 2.0\times10^{11}$ N/m². (Original problem.)
  ask: Extension
  unit: mm
  ans: 5.196
  tol: 0.02
  verify: sqrt(2*0.9*3.0/(2.0e11*1.0e-6))*1e3
  sol: |
    The wire behaves as a spring of constant $k = YA/L = 2.0\times10^{11}\times1.0\times10^{-6}/3.0 = 6.67\times10^{4}$ N/m, and stores $U = \tfrac12k\,\Delta L^2$. So
    $$\Delta L = \sqrt{\frac{2U}{k}} = \sqrt{\frac{2\times0.90\times3.0}{2.0\times10^{11}\times1.0\times10^{-6}}} = 5.2\times10^{-3}\ \text{m}.$$
    Check: the force is $k\,\Delta L = 346$ N, the stress is $3.5\times10^{8}$ N/m², just below the breaking stress of ordinary steel ($\sim4\times10^8$) and above its usual elastic limit, so in practice 0.90 J is already close to the most this wire could store.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A solid cone of steel, of height 100 m, hangs with its flat base fixed to a ceiling and its tip pointing down. Find how much longer it becomes under its own weight. Compare with a cylinder of the same height. Density of steel 7800 kg/m³, $Y = 2.0\times10^{11}$ N/m², $g = 9.8$ m/s². (Original problem.)
  ask: Elongation of the cone
  unit: mm
  ans: 0.637
  tol: 0.005
  verify: 7800*9.8*100**2/(6*2.0e11)*1e3
  sol: |
    Measure $x$ from the tip. The part of the cone below a section at $x$ is a smaller cone of volume $\tfrac13A(x)\,x$, where $A(x)$ is the section area there, so the stress at that section is
    $$\sigma(x) = \frac{\rho g\cdot\tfrac13A(x)\,x}{A(x)} = \frac{\rho gx}{3}.$$
    The area cancels, as it did for the uniform wire. A slice $dx$ stretches by $\sigma\,dx/Y$, so
    $$\Delta L = \int_0^L\frac{\rho gx}{3Y}\,dx = \frac{\rho gL^2}{6Y} = \frac{7800\times9.8\times100^2}{6\times2.0\times10^{11}} = 6.4\times10^{-4}\ \text{m}.$$
    The cylinder of the same height stretches by $\rho gL^2/2Y$, three times as much. A cone has only a third of the mass of the cylinder, and the weight below any section is a third as well.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A thin steel ring spins in its own plane about its centre. Show that the tensile stress in the ring is $\rho v^2$, where $v$ is the speed of the rim, and find the greatest rim speed before the ring breaks if steel fails at a stress of $5.0\times10^8$ N/m² and has density 7800 kg/m³. Ignore any other forces. (Original problem.)
  ask: Greatest rim speed
  unit: m/s
  ans: 253.2
  tol: 0.5
  verify: sqrt(5.0e8/7800)
  sol: |
    Take a small arc of the ring subtending an angle $\Delta\theta$ at the centre. Its mass is $\Delta m = \rho A r\,\Delta\theta$ ($A$ = cross-section area of the wire of the ring, $r$ = radius). The tensions $T$ at its two ends are each at an angle $\Delta\theta/2$ from the line to the centre, so their inward resultant is $2T\sin(\Delta\theta/2)\approx T\,\Delta\theta$. That must supply the centripetal force:
    $$T\,\Delta\theta = \Delta m\,\omega^2r = \rho Ar\,\Delta\theta\,\omega^2r\;\Rightarrow\;T = \rho A\omega^2r^2 = \rho Av^2.$$
    The stress is $T/A = \rho v^2$, independent of the ring's size and of its thickness. Setting $\rho v^2 = 5.0\times10^{8}$:
    $$v_{\max} = \sqrt{\frac{5.0\times10^{8}}{7800}} = 253\ \text{m/s}.$$
    This is why flywheels and turbine rotors are limited by rim speed, and why strong, light materials such as carbon fibre (large strength divided by density) allow faster ones.
  check: code
