# Prism and dispersion. NCERT questions copied word for word from NCERT Physics Class XII (reprint 2026-27), Ch 9.

- id: ncert12-ex-9-6
  lvl: ncert-ex
  num: "XII 9.6"
  source: NCERT XII Physics · Ch 9 · Exercise 9.6
  kind: num
  q: A prism is made of glass of unknown refractive index. A parallel beam of light is incident on a face of the prism. The angle of minimum deviation is measured to be 40°. What is the refractive index of the material of the prism? The refracting angle of the prism is 60°. If the prism is placed in water (refractive index 1.33), predict the new angle of minimum deviation of a parallel beam of light.
  ask: Refractive index of the glass
  unit: ""
  ans: 1.532
  tol: 0.005
  verify: sin(rad(50))/sin(rad(30))
  hints: ["n = sin((A + δm)/2) / sin(A/2).", "In water, use the relative index n/1.33."]
  sol: |
    $n = \sin 50^\circ/\sin 30^\circ = 1.532$.
    In water the relative index is $1.532/1.33 = 1.152$, so $\sin\frac{60^\circ + \delta_m'}{2} = 1.152 \times 0.5 = 0.576$, giving $\frac{60^\circ + \delta_m'}{2} = 35.2^\circ$ and $\delta_m' \approx 10^\circ$.
  answer_key: n ≅ 1.53 and Dm for prism in water ≅ 10°
  check: both

- id: ncert12-ex-9-21
  lvl: ncert-ex
  num: "XII 9.21"
  source: NCERT XII Physics · Ch 9 · Exercise 9.21
  kind: num
  q: At what angle should a ray of light be incident on the face of a prism of refracting angle 60° so that it just suffers total internal reflection at the other face? The refractive index of the material of the prism is 1.524.
  ask: Angle of incidence
  unit: "°"
  ans: 30
  tol: 0.5
  verify: deg(asin(1.524*sin(rad(60)-asin(1/1.524))))
  hints: ["At the second face the ray must meet the surface exactly at the critical angle: r₂ = ic.", "Then r₁ = 60° − ic."]
  sol: $i_c = \sin^{-1}(1/1.524) \approx 41^\circ$, so $r_1 = 60^\circ - 41^\circ = 19^\circ$. Then $\sin i = 1.524\sin 19^\circ = 0.496$, so $i \approx 30^\circ$. For smaller angles of incidence the light is totally reflected at the second face.
  answer_key: ic = sin–1 (1/1.524) ~ 41°; r = 19°; sin i = 0.4962; i ~ 30°
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: In the spectrum formed by a glass prism, which colour is deviated the least?
  opts: ["Violet", "Green", "Red"]
  ans: 2
  sol: Glass has the smallest refractive index for red light, so red is deviated least.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: A second, identical prism is placed upside down just after a prism that has split white light into a spectrum. What emerges?
  opts: ["A wider spectrum", "White light", "Only red light"]
  ans: 1
  sol: The inverted prism undoes the first prism's dispersion and deviation, recombining the colours into white light. This was Newton's proof that the colours were already present in white light.
  check: none

- id: b1
  lvl: board
  kind: num
  q: A ray passes through an equilateral prism (A = 60°) at minimum deviation. What is the angle of refraction at the first face?
  ask: r₁
  unit: "°"
  ans: 30
  tol: 0.1
  verify: 60/2
  sol: At minimum deviation the path is symmetric, so $r_1 = r_2 = A/2 = 30^\circ$.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A thin glass prism of angle 4° has refractive index 1.5. Find the deviation it produces.
  ask: Deviation
  unit: "°"
  ans: 2
  tol: 0.01
  verify: (1.5-1)*4
  sol: $\delta = (n - 1)A = 0.5 \times 4^\circ = 2^\circ$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: An equilateral glass prism gives a minimum deviation of 38°. Find the refractive index of the glass.
  ask: n
  unit: ""
  ans: 1.509
  tol: 0.002
  verify: sin(rad(49))/sin(rad(30))
  sol: $n = \sin\frac{60^\circ + 38^\circ}{2}/\sin 30^\circ = \sin 49^\circ/0.5 = 1.509$.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A thin prism of angle 5° has refractive indices 1.532 for violet and 1.514 for red light. Find the angular spread of the spectrum.
  ask: Angular dispersion
  unit: "°"
  ans: 0.09
  tol: 0.001
  verify: (1.532-1.514)*5
  sol: $\theta = (n_V - n_R)A = 0.018 \times 5^\circ = 0.09^\circ$.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A glass has refractive indices 1.532 (violet), 1.523 (yellow) and 1.514 (red). Find its dispersive power.
  ask: ω
  unit: ""
  ans: 0.0344
  tol: 0.0005
  verify: (1.532-1.514)/(1.523-1)
  sol: $\omega = \frac{n_V - n_R}{n_Y - 1} = \frac{0.018}{0.523} = 0.0344$.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: What is the largest prism angle for which some light can still emerge from the second face, for glass of refractive index 1.5?
  ask: Maximum A
  unit: "°"
  ans: 83.6
  tol: 0.1
  verify: 2*deg(asin(1/1.5))
  hints: ["Both r₁ and r₂ can be at most the critical angle."]
  sol: Since $r_1 \le \theta_c$ and emergence needs $r_2 \le \theta_c$, we need $A = r_1 + r_2 \le 2\theta_c = 2 \times 41.8^\circ = 83.6^\circ$.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A thin crown-glass prism of angle 6° ($n_Y = 1.52$, $n_V - n_R = 0.02$) is combined with an inverted thin flint-glass prism ($n_Y = 1.65$, $n_V - n_R = 0.04$) so that the pair produces no dispersion. Find the net deviation of yellow light.
  ask: Net deviation
  unit: "°"
  ans: 1.17
  tol: 0.01
  verify: 0.52*6-0.65*(0.02*6/0.04)
  hints: ["Zero dispersion: 0.02 × 6° = 0.04 × A₂.", "Net deviation = (n₁ − 1)A₁ − (n₂ − 1)A₂."]
  sol: Zero dispersion requires $0.02 \times 6^\circ = 0.04 \times A_2$, so $A_2 = 3^\circ$. Net deviation $= 0.52 \times 6^\circ - 0.65 \times 3^\circ = 3.12^\circ - 1.95^\circ = 1.17^\circ$.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: For an equilateral prism of refractive index 1.5, find the smallest angle of incidence for which light emerges from the second face.
  ask: Minimum angle of incidence
  unit: "°"
  ans: 27.9
  tol: 0.2
  verify: deg(asin(1.5*sin(rad(60)-asin(1/1.5))))
  sol: Emergence needs $r_2 \le \theta_c = 41.8^\circ$, so $r_1 \ge 60^\circ - 41.8^\circ = 18.2^\circ$. Then $\sin i \ge 1.5\sin 18.2^\circ = 0.468$, so $i \ge 27.9^\circ$.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: Find the angle between the primary rainbow and the point directly opposite the Sun, for water of refractive index 1.333.
  ask: Rainbow angle
  unit: "°"
  ans: 42.1
  tol: 0.2
  verify: "(function(){ var n=1.333, i=acos(sqrt((n*n-1)/3)), r=asin(sin(i)/n); return 180-(180+2*deg(i)-4*deg(r)); })()"
  hints: ["Deviation after one internal reflection D = 180° + 2i − 4r.", "Minimum deviation where cos² i = (n² − 1)/3."]
  sol: $\cos^2 i = (1.777 - 1)/3 = 0.259$, so $i = 59.4^\circ$ and $r = \sin^{-1}(\sin 59.4^\circ/1.333) = 40.2^\circ$. Then $D_{\min} = 180^\circ + 118.8^\circ - 160.9^\circ = 137.9^\circ$, and the bow lies at $180^\circ - 137.9^\circ \approx 42^\circ$ from the antisolar point.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: Find the angle of the secondary rainbow (two internal reflections) from the antisolar point, for water of refractive index 1.333.
  ask: Secondary bow angle
  unit: "°"
  ans: 50.9
  tol: 0.3
  verify: "(function(){ var n=1.333, i=acos(sqrt((n*n-1)/8)), r=asin(sin(i)/n); return 2*(deg(i)-deg(r))+2*(180-2*deg(r))-180; })()"
  hints: ["D₂ = 2(i − r) + 2(180° − 2r).", "Minimum where cos² i = (n² − 1)/8."]
  sol: $\cos^2 i = 0.777/8 = 0.0971$, so $i = 71.8^\circ$ and $r = 45.5^\circ$. Then $D_2 = 2(26.4^\circ) + 2(89.1^\circ) = 230.9^\circ$, which is $230.9^\circ - 180^\circ \approx 51^\circ$ from the antisolar point, on the other side of the axis, so the colour order is reversed.
  check: code
