- id: ncert12-ex-9-9
  lvl: ncert-ex
  num: "XII 9.9"
  source: NCERT XII Physics · Ch 9 · Exercise 9.9
  kind: num
  q: An object of size 3.0 cm is placed 14 cm in front of a concave lens of focal length 21 cm. Describe the image produced by the lens. What happens if the object is moved further away from the lens?
  ask: Image distance v, with sign
  unit: cm
  ans: -8.4
  tol: 0.05
  verify: 1/(1/(-21)+1/(-14))
  sol: |
    $\frac1v = -\frac{1}{21} - \frac{1}{14} = -\frac{5}{42}$, so $v = -8.4$ cm: virtual, erect, on the object's side. $m = v/u = 0.6$, so the image is 1.8 cm tall. As the object moves away, the image moves towards the focus (never beyond) and shrinks towards zero. With the object at the focus (21 cm) the image is at 10.5 cm, not at infinity.
  answer_key: v = 8.4 cm, image is erect and virtual. It is diminished to a size 1.8 cm. As u → ∞, v → f (but never beyond f while m → 0).
  check: both

- id: ncert12-ex-9-10
  lvl: ncert-ex
  num: "XII 9.10"
  source: NCERT XII Physics · Ch 9 · Exercise 9.10
  kind: num
  q: What is the focal length of a convex lens of focal length 30 cm in contact with a concave lens of focal length 20 cm? Is the system a converging or a diverging lens? Ignore thickness of the lenses.
  ask: Focal length, with sign
  unit: cm
  ans: -60
  tol: 0.1
  verify: 1/(1/30-1/20)
  sol: |
    $\frac1F = \frac{1}{30} - \frac{1}{20} = -\frac{1}{60}$, so $F = -60$ cm: a diverging lens.
  answer_key: A diverging lens of focal length 60 cm
  check: both

- id: ncert12-ex-9-18
  lvl: ncert-ex
  num: "XII 9.18"
  source: NCERT XII Physics · Ch 9 · Exercise 9.18
  kind: num
  q: The image of a small electric bulb fixed on the wall of a room is to be obtained on the opposite wall 3 m away by means of a large convex lens. What is the maximum possible focal length of the lens required for the purpose?
  ask: Maximum focal length
  unit: m
  ans: 0.75
  tol: 0.005
  verify: 3/4
  sol: For a fixed object–screen distance $D$, a real image is possible only if $D \ge 4f$. So $f_{\max} = D/4 = 0.75$ m.
  answer_key: fmax = 0.75 m
  check: both

- id: ncert12-ex-9-19
  lvl: ncert-ex
  num: "XII 9.19"
  source: NCERT XII Physics · Ch 9 · Exercise 9.19
  kind: num
  q: A screen is placed 90 cm from an object. The image of the object on the screen is formed by a convex lens at two different locations separated by 20 cm. Determine the focal length of the lens.
  ask: Focal length
  unit: cm
  ans: 21.4
  tol: 0.05
  verify: (90**2-20**2)/(4*90)
  sol: $f = \frac{D^2 - x^2}{4D} = \frac{8100 - 400}{360} = 21.4$ cm.
  answer_key: 21.4 cm
  check: both

- id: ncert12-ex-9-20
  lvl: ncert-ex
  num: "XII 9.20"
  source: NCERT XII Physics · Ch 9 · Exercise 9.20
  kind: num
  q: (a) Determine the 'effective focal length' of the combination of the two lenses in Exercise 9.10, if they are placed 8.0 cm apart with their principal axes coincident. Does the answer depend on which side of the combination a beam of parallel light is incident? Is the notion of effective focal length of this system useful at all? (b) An object 1.5 cm in size is placed on the side of the convex lens in the arrangement (a) above. The distance between the object and the convex lens is 40 cm. Determine the magnification produced by the two-lens system, and the size of the image.
  ask: Size of the image in part (b)
  unit: cm
  ans: 0.98
  tol: 0.01
  verify: "1.5*(120/40)*(20/92)"
  sol: |
    (a) Light from the left onto the convex lens first: $v_1 = 30$ cm, a virtual object at $u_2 = +22$ cm for the concave lens, giving $v_2 = -220$ cm, so the beam appears to diverge from 216 cm from the centre of the system. Light onto the concave lens first: $v_1 = -20$ cm, $u_2 = -28$ cm for the convex lens, giving $v_2 = -420$ cm, a point 416 cm on the left of the centre. The answers differ, so no single effective focal length describes this separated pair.
    (b) Convex lens: $u_1 = -40$, $v_1 = +120$ cm, magnification 3. Concave lens: $u_2 = +112$ cm, $\frac{1}{v_2} = -\frac{1}{20} + \frac{1}{112}$, $v_2 = -\frac{112 \times 20}{92}$ cm, magnification $20/92$. Net magnification $3 \times 20/92 = 0.652$, image size $1.5 \times 0.652 = 0.98$ cm.
  answer_key: "(a) 216 cm (light first on convex lens), 416 cm (light first on concave lens); the notion of effective focal length is not meaningful here. (b) Net magnification 0.652; size of the image 0.98 cm."
  check: both

- id: ncert12-ex-9-31
  lvl: ncert-ex
  num: "XII 9.31"
  source: NCERT XII Physics · Ch 9 · Exercise 9.31
  kind: num
  q: Figure 9.30 shows an equiconvex lens (of refractive index 1.50) in contact with a liquid layer on top of a plane mirror. A small needle with its tip on the principal axis is moved along the axis until its inverted image is found at the position of the needle. The distance of the needle from the lens is measured to be 45.0 cm. The liquid is removed and the experiment is repeated. The new distance is measured to be 30.0 cm. What is the refractive index of the liquid?
  ask: Refractive index of liquid
  unit: ""
  ans: 1.33
  tol: 0.01
  verify: 1+30*(1/30-1/45)
  hints: ["The image coincides with the needle when the needle sits at the focus of the lens system, so light returns along itself from the mirror.", "Without liquid f = 30 cm; with liquid the combination has F = 45 cm. The liquid forms a plano-concave lens."]
  sol: |
    Without liquid, the needle is at the lens's focus: $f_1 = 30$ cm, so for the equiconvex lens $\frac{1}{30} = 0.5 \times \frac{2}{R}$ and $R = 30$ cm.
    With liquid, $F = 45$ cm, so $\frac{1}{f_2} = \frac{1}{45} - \frac{1}{30} = -\frac{1}{90}$. The liquid is a plano-concave lens with one face of radius 30 cm: $-\frac{1}{90} = (n - 1)\left(-\frac{1}{30}\right)$, so $n - 1 = \frac13$ and $n = 1.33$.
  answer_key: n = 1.33
  check: both
