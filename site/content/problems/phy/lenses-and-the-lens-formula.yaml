- id: ncert-ex-9
  lvl: ncert-ex
  num: 9
  source: NCERT X Science · Ch 9 · Exercise 9 · p. 160
  kind: text
  q: One-half of a convex lens is covered with a black paper. Will this lens produce a complete image of the object? Verify your answer experimentally. Explain your observations.
  sol: |
    **Yes.** Each point of the object sends rays to every part of the lens, and every part of the lens bends those rays to the same image point. Covering half the lens blocks half the rays from each object point, but the uncovered half still brings the rest together at the same image points. So the complete image forms, only with less brightness.

    Experiment: focus the image of a distant window or candle on a screen with a convex lens, then cover the upper half of the lens with black paper. The whole image remains, dimmer.
  answer_key: "Yes"
  check: ncert-key

- id: ncert-ex-10
  lvl: ncert-ex
  num: 10
  source: NCERT X Science · Ch 9 · Exercise 10 · p. 160
  kind: num
  q: An object 5 cm in length is held 25 cm away from a converging lens of focal length 10 cm. Draw the ray diagram and find the position, size and the nature of the image formed.
  ask: Image distance v, with sign
  unit: cm
  ans: 16.7
  tol: 0.05
  verify: 1/(1/10+1/(-25))
  hints: ["u = −25 cm, f = +10 cm.", "h′ = (v/u) h."]
  sol: |
    $\frac1v = \frac{1}{10} - \frac{1}{25} = \frac{3}{50}$, so $v = +16.7$ cm. $m = v/u = 16.7/(-25) = -0.67$, so $h' = -3.3$ cm.
    The image is 16.7 cm on the other side of the lens, real, inverted and diminished, 3.3 cm long.
    Ray diagram: object beyond $2F_1$; draw a ray parallel to the axis refracting through $F_2$ and a ray through O going straight; they meet between $F_2$ and $2F_2$, below the axis. The lens bench in the lesson shows this with u = 25, f = 10.
  answer_key: 16.7 cm from the lens on the other side; 3.3 cm, reduced; real, inverted.
  check: both

