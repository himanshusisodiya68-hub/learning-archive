- id: m1
  lvl: main
  kind: num
  q: A biconvex lens is made of glass of refractive index 1.5. Both surfaces have radius of curvature 20 cm. Find its focal length in air.
  ask: Focal length
  unit: cm
  ans: 20
  tol: 0.1
  verify: 1/(0.5*(1/20+1/20))
  hints: ["Lens maker's formula with R₁ = +20 cm, R₂ = −20 cm."]
  sol: $\frac1f = (1.5 - 1)\left(\frac{1}{20} - \frac{1}{-20}\right) = 0.5 \times \frac{2}{20} = \frac{1}{20}$, so $f = 20$ cm.
  check: code

- id: m2
  lvl: main
  kind: num
  q: The same lens (n = 1.5, R₁ = +20 cm, R₂ = −20 cm) is immersed in water of refractive index 1.33. Find its focal length.
  ask: Focal length
