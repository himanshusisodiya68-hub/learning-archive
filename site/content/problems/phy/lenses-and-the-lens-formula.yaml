- id: m3
  lvl: main
  kind: num
  q: One end of a long glass rod ($n = 1.5$) is ground into a convex hemispherical surface of radius 10 cm. An object in air is on the axis 30 cm from that surface. Where is the image formed inside the rod?
  ask: Image distance from the surface
  unit: cm
