  hints: ["P is a virtual object on the far side of the lens: u = +12 cm."]
  sol: |
    $u = +12$ cm (virtual object).
    (a) $\frac1v = \frac{1}{20} + \frac{1}{12} = \frac{8}{60}$, so $v = +7.5$ cm: the beam converges 7.5 cm beyond the lens.
    (b) $\frac1v = -\frac{1}{16} + \frac{1}{12} = \frac{1}{48}$, so $v = +48$ cm: the beam converges 48 cm beyond the lens.
  answer_key: "u = +12 cm (object virtual). (a) Image real, at 7.5 cm from the lens on its right side. (b) Image real, at 48 cm from the lens on its right side."
