- id: a2
  lvl: adv
  kind: num
  q: A plano-convex lens of radius of curvature 15 cm and refractive index 1.5 is silvered on its curved surface. What is the focal length of the resulting mirror?
  ask: Focal length (magnitude)
  unit: cm
  ans: 5
  tol: 0.05
  verify: 15/(2*1.5)
  hints: ["P_eq = 2 P_lens + P_mirror (converging powers).", "Lens focal length R/(n − 1); the silvered curved face is a concave mirror of focal length R/2."]
  sol: |
    $f_{\text{lens}} = R/(n - 1) = 30$ cm and the curved mirror has $f_m = R/2 = 7.5$ cm. Converging powers: $\frac{1}{F} = \frac{2}{30} + \frac{1}{7.5} = \frac{2 + 4}{30} = \frac{1}{5}$, so $F = 5$ cm, which matches $R/2n = 15/3$.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A convex lens of focal length 20 cm and a concave lens of focal length 10 cm are placed coaxially 15 cm apart. Find the focal length of the combination.
  ask: Focal length, with sign
  unit: cm
  ans: 40
  tol: 0.1
  verify: 1/(1/20+1/(-10)-15/(20*(-10)))
  hints: ["1/F = 1/f₁ + 1/f₂ − d/(f₁f₂), with f₂ = −10 cm."]
  sol: $\frac1F = \frac{1}{20} - \frac{1}{10} - \frac{15}{20 \times (-10)} = 0.05 - 0.1 + 0.075 = 0.025$, so $F = +40$ cm. The pair is converging overall even though the concave lens is stronger.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: An achromatic doublet of focal length +40 cm is made from a crown-glass lens (dispersive power 0.02) in contact with a flint-glass lens (dispersive power 0.04). Find the focal length of the crown-glass lens.
  ask: Focal length of crown lens
  unit: cm
  ans: 20
  tol: 0.1
  verify: 40*(1-0.02/0.04)
  hints: ["Achromatism: ω₁/f₁ + ω₂/f₂ = 0.", "Combine with 1/f₁ + 1/f₂ = 1/F."]
  sol: From $\omega_1/f_1 = -\omega_2/f_2$, $f_2 = -2f_1$. Then $\frac1{f_1} - \frac{1}{2f_1} = \frac{1}{2f_1} = \frac{1}{40}$, so $f_1 = +20$ cm (crown, converging) and $f_2 = -40$ cm (flint, diverging).
  check: code

- id: o2
  lvl: oly
  kind: num
  q: Using Newton's form $xx' = f^2$, find the smallest possible distance between a real object and its real image formed by a convex lens of focal length 12 cm.
  ask: Minimum distance
  unit: cm
  ans: 48
  tol: 0.1
  verify: 4*12
  hints: ["Object-to-image distance = 2f + x + x′.", "Minimise x + x′ subject to xx′ = f² (AM–GM)."]
  sol: The distance is $2f + x + x'$. With $xx' = f^2$, AM–GM gives $x + x' \ge 2\sqrt{xx'} = 2f$, with equality at $x = x' = f$. So the minimum is $4f = 48$ cm, with the object at $2F_1$.
  check: code

- id: ncert12-eg-9-5
