- id: ncert-it158-2
  lvl: ncert-intext
  num: "p158 Q2"
  source: NCERT X Science · Ch 9 · In-text questions · p. 158 · Q2
  kind: num
  q: A convex lens forms a real and inverted image of a needle at a distance of 50 cm from it. Where is the needle placed in front of the convex lens if the image is equal to the size of the object? Also, find the power of the lens.
  ask: Power of the lens
  unit: D
  ans: 4
  tol: 0.01
  verify: 1/(50/2/100)
  hints: ["A same-size real image forms when the object is at 2F₁ and the image at 2F₂.", "So 2f = 50 cm."]
  sol: |
    Same size, real and inverted means the object is at $2F_1$ and the image at $2F_2$. So $v = +50$ cm $= 2f$, giving $f = 25$ cm, and the needle is at $u = -50$ cm, 50 cm in front of the lens.
    Check: $\frac1v - \frac1u = \frac{1}{50} + \frac{1}{50} = \frac{1}{25}$ ✓. Power $P = 1/0.25 = +4$ D.
  check: code

