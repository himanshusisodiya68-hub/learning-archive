- id: ncert12-eg-9-6
  lvl: ncert-intext
  num: "XII Ex 9.6"
  source: NCERT XII Physics · Ch 9 · Example 9.6
  kind: text
  q: A magician during a show makes a glass lens with n = 1.47 disappear in a trough of liquid. What is the refractive index of the liquid? Could the liquid be water?
  sol: The lens vanishes when it does not bend light at all, which happens when its refractive index equals the liquid's, so the liquid has $n = 1.47$. Then $\frac1f = (n_{\text{rel}} - 1)(\dots) = 0$ and the lens acts like a plain sheet of the liquid. It cannot be water ($n = 1.33$); glycerine is a possibility.
  check: none

- id: ncert12-eg-9-7
  lvl: ncert-intext
  num: "XII Ex 9.7"
  source: NCERT XII Physics · Ch 9 · Example 9.7
  kind: num
  q: (i) If f = 0.5 m for a glass lens, what is the power of the lens? (ii) The radii of curvature of the faces of a double convex lens are 10 cm and 15 cm. Its focal length is 12 cm. What is the refractive index of glass? (iii) A convex lens has 20 cm focal length in air. What is focal length in water? (Refractive index of air-water = 1.33, refractive index for air-glass = 1.5.)
  ask: Refractive index of glass in part (ii)
  unit: ""
  ans: 1.5
  tol: 0.01
  verify: 1+(1/12)/(1/10+1/15)
  sol: |
    (i) $P = 1/0.5 = +2$ D.
    (ii) $\frac{1}{12} = (n - 1)\left(\frac{1}{10} + \frac{1}{15}\right) = \frac{n - 1}{6}$, so $n = 1.5$.
    (iii) $\frac{f_w}{f_a} = \frac{n_g - 1}{n_g/n_w - 1} = \frac{0.5}{0.128}$, so $f_w \approx 78$ cm, about four times the focal length in air.
  check: code

- id: ncert12-eg-9-8
  lvl: ncert-intext
  num: "XII Ex 9.8"
  source: NCERT XII Physics · Ch 9 · Example 9.8
  kind: num
  q: "Find the position of the image formed by the lens combination given in the Fig. 9.20. [Fig. 9.20: three thin lenses on one axis with focal lengths +10 cm, −10 cm and +30 cm; the second lens is 5 cm beyond the first, the third further along; the object is 30 cm to the left of the first lens.]"
  ask: Distance of final image to the right of the third lens
  unit: cm
  ans: 30
  tol: 0.1
  verify: 1/(1/30+0)
  hints: ["First lens: u = −30 cm, f = +10 cm.", "Its image is a virtual object 10 cm to the right of the second lens."]
  sol: |
    Lens 1: $\frac{1}{v_1} = \frac{1}{10} - \frac{1}{30}$, so $v_1 = 15$ cm. This is $15 - 5 = 10$ cm to the right of lens 2: a virtual object, $u_2 = +10$ cm.
    Lens 2: $\frac{1}{v_2} = \frac{1}{-10} + \frac{1}{10} = 0$, so the light leaves parallel ($v_2 = \infty$).
    Lens 3: parallel light focuses at its focal point, $v_3 = +30$ cm. The final image is 30 cm to the right of the third lens, wherever that lens is placed.
  check: code

- id: ncert12-ex-9-7
  lvl: ncert-ex
  num: "XII 9.7"
  source: NCERT XII Physics · Ch 9 · Exercise 9.7
  kind: num
  q: Double-convex lenses are to be manufactured from a glass of refractive index 1.55, with both faces of the same radius of curvature. What is the radius of curvature required if the focal length is to be 20 cm?
