- id: o1
  lvl: oly
  kind: num
  q: Quartz has nₑ − nₒ = 0.0091 for light of 589 nm. Find the minimum thickness of a quartz quarter-wave plate for this light.
  ask: Thickness
  unit: µm
  ans: 16.18
  tol: 0.02
