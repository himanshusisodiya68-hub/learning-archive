- id: m2
  lvl: main
  kind: num
  q: A middle polaroid between two crossed polaroids is at 30° to the first. Unpolarised light of intensity I enters. What fraction of I emerges?
  ask: Fraction
  unit: ""
  ans: 0.09375
  tol: 0.0005
  verify: 0.5*cos(rad(30))**2*sin(rad(30))**2
  sol: $\tfrac12 \times \cos^2 30° \times \cos^2 60° = \tfrac12 \times \tfrac34 \times \tfrac14 = \tfrac{3}{32} \approx 0.094$.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A beam is a mixture of unpolarised light of intensity I_u and linearly polarised light of intensity I_p. Rotating a polaroid in it, the maximum transmitted intensity is 3 times the minimum. Find I_p/I_u.
  ask: I_p / I_u
  unit: ""
  ans: 1
  tol: 0.001
  verify: (3-1)/2
  sol: $I_{\max} = I_u/2 + I_p$ and $I_{\min} = I_u/2$. $I_{\max} = 3I_{\min}$ gives $I_p = I_u$, a ratio of 1.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: Polarised light passes through 6 polaroids, each turned 15° from the previous one, so that the last is at 90° to the original polarisation. What fraction of the intensity is transmitted?
  ask: Fraction
  unit: ""
  ans: 0.6597
  tol: 0.001
  verify: cos(rad(15))**12
  sol: Each sheet passes $\cos^2 15°$, so the total is $(\cos^2 15°)^6 = (0.933)^6 \approx 0.66$. Compare with zero for a single sheet at 90°.
  check: code

