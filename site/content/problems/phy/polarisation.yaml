- id: f2
  lvl: found
  kind: num
  q: Unpolarised light of intensity 40 W/m² falls on an ideal polaroid. What intensity comes out?
  ask: Intensity
  unit: W/m²
  ans: 20
  tol: 0.01
  verify: 40/2
  sol: A polaroid passes the component along its axis; averaged over all random directions, $\overline{\cos^2} = \tfrac12$, so 20 W/m².
  check: code

- id: b1
  lvl: board
  kind: num
  q: Unpolarised light of intensity 32 W/m² passes through two polaroids whose axes are at 60°. Find the transmitted intensity.
  ask: Intensity
  unit: W/m²
  ans: 4
  tol: 0.001
  verify: 32/2*cos(rad(60))**2
  sol: After the first, 16 W/m². After the second, $16\cos^2 60° = 16 \times \tfrac14 = 4$ W/m².
  check: code

