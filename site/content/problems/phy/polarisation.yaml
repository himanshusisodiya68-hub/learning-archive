# Polarisation. NCERT question copied word for word from NCERT Physics Class XII (reprint 2026-27), Ch 10. The rationalised chapter has no exercises on polarisation.

- id: ncert12-eg-10-2
  lvl: ncert-intext
  num: "XII Ex 10.2"
  source: NCERT XII Physics · Ch 10 · Example 10.2
  kind: num
  q: Discuss the intensity of transmitted light when a polaroid sheet is rotated between two crossed polaroids?
  ask: Maximum transmitted intensity, as a fraction of the intensity I₀ leaving the first polaroid
  unit: × I₀
  ans: 0.25
  tol: 0.001
  verify: cos(PI/4)**2*sin(PI/4)**2
  sol: |
    Let $I_0$ be the intensity of polarised light after the first polariser $P_1$. After the middle polaroid $P_2$, at angle $\theta$ to $P_1$, the intensity is $I_0\cos^2\theta$.
    $P_1$ and $P_3$ are crossed, so the angle between $P_2$ and $P_3$ is $(\pi/2 - \theta)$. The intensity emerging from $P_3$ is
    $$I = I_0\cos^2\theta\cos^2(\pi/2 - \theta) = I_0\cos^2\theta\sin^2\theta = (I_0/4)\sin^2 2\theta.$$
    The transmitted intensity is maximum, $I_0/4$, when $\theta = \pi/4$, and zero when $\theta = 0$ or $\pi/2$.
  check: both

- id: f1
