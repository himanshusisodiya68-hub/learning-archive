- id: o2
  lvl: oly
  kind: num
  q: Show that N polaroids, each turned π/(2N) from the last, transmit (cos²(π/2N))ᴺ of polarised light, and evaluate it for N = 30.
  ask: Transmitted fraction for N = 30
  unit: ""
  ans: 0.9211
  tol: 0.001
  verify: cos(PI/60)**60
  sol: Each sheet passes $\cos^2(\pi/2N)$ by Malus' law, giving $T = \cos^{2N}(\pi/2N)$. For large $N$, $\ln T = 2N\ln\cos(\pi/2N) \approx -2N\cdot\tfrac12(\pi/2N)^2 = -\pi^2/(4N)$, so $T \to 1$. For $N = 30$, $T = \cos^{60}(3°) = 0.921$ (the approximation gives $e^{-\pi^2/120} = 0.921$).
  check: code

- id: o3
  lvl: oly
  kind: proof
  q: Using Snell's law, prove that at Brewster's angle the reflected and refracted rays are perpendicular, and show tan θ_B = n.
  hints: ["Assume the rays are perpendicular, so r = 90° − θ_B.", "Substitute into sin θ_B = n sin r."]
  sol: The field in the plane of incidence cannot be reflected when the reflected direction lies along the oscillation of the surface electrons, which oscillate perpendicular to the refracted ray. This happens when the reflected and refracted rays are perpendicular, i.e. $\theta_B + r = 90°$. Then $\sin r = \cos\theta_B$, and Snell's law $\sin\theta_B = n\sin r$ gives $\sin\theta_B = n\cos\theta_B$, so $\tan\theta_B = n$. Conversely, if $\tan\theta_B = n$, then $\sin r = \sin\theta_B/n = \cos\theta_B$, so $r = 90° - \theta_B$ and the rays are perpendicular.
  check: none
