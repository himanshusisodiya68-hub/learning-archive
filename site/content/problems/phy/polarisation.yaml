- id: b4
  lvl: board
  kind: mcq
  q: Why do polaroid sunglasses cut glare from a wet road?
  opts: ["They absorb all blue light", "Reflected light is partly polarised horizontally, and their pass axis is vertical", "They reflect sunlight back"]
  ans: 1
  sol: Light reflected from a horizontal surface is partly polarised parallel to it (fully at Brewster's angle). A vertical pass axis blocks that component.
  check: none

- id: m1
  lvl: main
