  q: Light is reflected from a liquid surface at the polarising angle, and the angle of refraction is 35°. Find the refractive index of the liquid.
  ask: Refractive index
  unit: ""
  ans: 1.428
  tol: 0.002
  verify: tan(rad(55))
  sol: At Brewster's angle $\theta_B + r = 90°$, so $\theta_B = 55°$ and $n = \tan 55° = 1.43$.
