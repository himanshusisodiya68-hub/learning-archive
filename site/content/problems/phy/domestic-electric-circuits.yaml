- id: f2
  lvl: found
  kind: num
  q: A 100 W bulb is used on a 220 V supply. What fuse rating (1 A, 2 A, 5 A) is suitable? Give the current it draws. (Original problem.)
  ask: Current drawn
  unit: A
  ans: 0.4545
  tol: 0.001
  verify: 100/220
  sol: $I = P/V = 100/220 = 0.45$ A. A 1 A fuse is the smallest standard rating that is above this and protects the wiring.
