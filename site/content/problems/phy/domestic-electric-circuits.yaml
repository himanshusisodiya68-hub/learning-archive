- id: b1
  lvl: board
  kind: num
  q: A room has four 60 W bulbs, two 75 W fans and a 1000 W heater, all on a 220 V supply and all switched on. What is the total current? Would a 5 A fuse suffice? (Original problem.) Give the total current.
  ask: Total current
  unit: A
  ans: 6.32
  tol: 0.01
  verify: (4*60+2*75+1000)/220
  sol: Total power $= 4\times60 + 2\times75 + 1000 = 1390$ W, so $I = 1390/220 = 6.32$ A. This is more than 5 A, so a 5 A fuse would blow; the 1000 W heater should be on the 15 A circuit.
  check: code

- id: b2
  lvl: board
  kind: text
  q: Why are the appliances in a house connected in parallel and not in series? (Original problem.)
  sol: |
    In parallel every appliance gets the full 220 V and draws the current it needs; each can be switched on and off independently; and a fault or fuse failure in one does not stop the others. In series the same current would pass through all, the voltage would be shared, and one failure would break the circuit.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A geyser rated 2 kW, 220 V is connected through a copper wire of resistance 0.5 Ω to the mains. Find the power actually delivered to the geyser, taking its resistance as constant. (Original problem.)
  ask: Power delivered
  unit: W
  ans: 1920
  tol: 1
  verify: (220/(220*220/2000+0.5))**2*(220*220/2000)
  sol: |
    The geyser's resistance is $R = V^2/P = 220^2/2000 = 24.2\ \Omega$. With the wire in series the total is $24.7\ \Omega$ and $I = 220/24.7 = 8.9$ A. The power in the geyser is $I^2R = (8.906)^2\times24.2 \approx 1920$ W, about 80 W less than the rating, because the wire takes part of the supply voltage.
  check: code

- id: m2
  lvl: main
  kind: text
  q: A metallic-bodied appliance's live wire comes loose and touches the body, and the appliance is not earthed. Explain what happens when a person touches it, and what changes if it is earthed through a fuse. (Original problem.)
  sol: |
    Not earthed: the body is at the mains (live) potential, so touching it with feet on the ground gives a large potential difference across the person's body and a dangerous current through them. Earthed: the fault current flows through the low-resistance earth wire. This is large enough to blow the fuse, which disconnects the live wire, and the body stays near earth potential.
  check: none

- id: a1
  lvl: adv
  kind: num
  q: "A metal-bodied heater develops a fault in which the live wire touches its body. The resistance of the live side of the fault loop (supply transformer, cables and house wiring) is 1 Ω, and the earth path from the body back to the substation's earthed neutral (earth wire, earth electrode, soil) is 40 Ω. The supply is 220 V and the circuit is protected by a 15 A fuse. Treat the fault loop as purely resistive. Find the potential of the heater body relative to the ground at the electrode, and say whether the fuse blows. (Original problem.)"
  ask: Potential of the body
  unit: V
  ans: 214.6
  tol: 0.2
  verify: 220*40/(1+40)
  sol: |
    The fault current flows round the loop live wiring → body → earth path → earthed neutral:
    $$I_f = \frac{220}{1 + 40} = 5.37\ \text{A}.$$
    The body is above ground by the drop across the earth path:
    $$V_{\text{body}} = I_fR_E = 5.37\times40 = 214.6\ \text{V}.$$
    The fault current (5.4 A, flowing in addition to the heater's normal current only if the heater is on) is well below what a 15 A fuse needs to blow quickly, so the fault persists and the body sits at nearly full mains potential. A person touching it is a path of a few kilohms in parallel with the earth path and would carry a dangerous current. The earth is too poor to operate the fuse; the remedy is a better earth electrode and a residual-current device.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: "A 2 kW, 220 V heater is run from a 25 m two-core extension lead whose copper cores each have a cross-section of 0.75 mm². Take the resistivity of copper as 1.7 × 10⁻⁸ Ω m, the supply as exactly 220 V and the heater's resistance as constant. Find the power dissipated in the lead, and comment on using it while still wound on its drum. (Original problem.)"
  ask: Power dissipated in the lead
  unit: W
  ans: 85.5
  tol: 0.2
  verify: (220/(220*220/2000 + 1.7e-8*50/0.75e-6))**2*(1.7e-8*50/0.75e-6)
  sol: |
    Heater: $R_h = 220^2/2000 = 24.2\ \Omega$. The current goes out along one core and back along the other, so the conductor length is $50$ m:
    $$R_\ell = \frac{\rho l}{A} = \frac{1.7\times10^{-8}\times50}{0.75\times10^{-6}} = 1.133\ \Omega.$$
    $$I = \frac{220}{24.2 + 1.133} = 8.684\ \text{A},\qquad P_\ell = I^2R_\ell = 8.684^2\times1.133 = 85.5\ \text{W}.$$
    The heater gets $8.684\times24.2 = 210.2$ V and delivers $1825$ W instead of 2000 W.
    85 W spread over 25 m of straight cable is about 3.4 W per metre, which is tolerable. Wound on a drum, the turns insulate each other and 85 W is trapped in a small volume, like a small heater element: the temperature keeps rising and the insulation can soften or melt. Heavy loads need a fully unwound lead (or one with thicker cores).
  check: code

- id: a3
  lvl: adv
  kind: num
  q: "A residual-current device on a 220 V supply trips when the difference between the live and neutral currents exceeds 30 mA. A person touches a live terminal while standing on the ground; the only path to earth is through their body and shoes. What is the largest total resistance of this path for which the RCD still trips? Would a 6 A circuit breaker on the same circuit help? (Original problem.)"
  ask: Largest resistance for which the RCD trips
  unit: Ω
  ans: 7333
  tol: 2
  verify: 220/0.03
  sol: |
    The current through the person goes out along the live wire and returns through the ground, not the neutral, so the RCD sees an imbalance $I_L - I_N = 220/R$ (rms). It trips if $220/R > 0.030$ A, that is if
    $$R < \frac{220}{0.030} = 7333\ \Omega.$$
    With a wet floor or bare feet the path resistance is typically far below this, so the RCD trips. (With a higher resistance the current is below 30 mA, which is less dangerous; in practice RCDs often trip somewhat below their rated value.)
    A 6 A breaker is no help: 30 mA, or even 200 mA, is a tiny fraction of its rating, and it only responds to the size of the live current, not to where that current goes.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: "In a short circuit, a copper fuse wire of radius 0.10 mm carries a current of 200 A. Treat the current as steady (rms values give the same average heating over whole cycles) and assume the heating is adiabatic, with no heat lost to the surroundings. Taking for copper a density of 8900 kg m⁻³, specific heat 385 J kg⁻¹ K⁻¹, constant resistivity 1.7 × 10⁻⁸ Ω m and melting point 1085 °C, find the time for the wire to reach its melting point from 25 °C. Explain how the time would change if the current were doubled, and discuss the two main approximations. (Original problem.)"
  ask: Time to reach the melting point
  unit: ms
  ans: 5.27
  tol: 0.02
  verify: 8900*385*1060*(PI*(1e-4)**2)**2/(1.7e-8*200**2)*1000
  sol: |
    Per unit volume the heating rate is $\rho J^2 = \rho I^2/A^2$, and the heat needed is $d\,c\,\Delta T$. So
    $$t = \frac{d\,c\,\Delta T\,A^2}{\rho I^2}.$$
    Here $A = \pi(10^{-4})^2 = 3.142\times10^{-8}$ m², $A^2 = 9.87\times10^{-16}$ m⁴, $d\,c\,\Delta T = 8900\times385\times1060 = 3.632\times10^9$ J m⁻³, and $\rho I^2 = 1.7\times10^{-8}\times4\times10^4 = 6.8\times10^{-4}$ Ω m A².
    $$t = \frac{3.632\times10^9\times9.87\times10^{-16}}{6.8\times10^{-4}} = 5.27\times10^{-3}\ \text{s} \approx 5.3\ \text{ms}.$$
    Since $I^2t$ is fixed, doubling the current reduces the time four times, to about 1.3 ms.
    Approximations: (i) the resistivity of copper rises strongly with temperature, so the true heating rate grows as the wire warms and melting comes sooner than estimated; (ii) the wire must also absorb the latent heat of fusion before it parts, which delays the break. Also, 5 ms is only a quarter of a 50 Hz cycle, so the instantaneous AC current matters and "steady rms current" is itself a rough model over such short times. [Inference] The estimate is good for the order of magnitude and the $A^2/I^2$ scaling, not for a precise time.
  check: code
