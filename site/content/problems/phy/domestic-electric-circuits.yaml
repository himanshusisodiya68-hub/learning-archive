# Domestic electric circuits. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 12, §12.4 and Exercises. Found, board and main problems are original.

- id: ncert-it12-5-1
  lvl: ncert-intext
  num: "§12.4 Q1"
  source: NCERT X Science · Ch 12 · In-text questions after §12.4 · Q1
  kind: text
  q: Name two safety measures commonly used in electric circuits and appliances.
  sol: |
    1. **Electric fuse** (or a circuit breaker): it melts and breaks the circuit when the current is unduly large.
    2. **Earthing** (the earth wire connected to the metallic body of an appliance): it gives leakage current a low-resistance path to the ground so the user does not get a shock.
  check: none

- id: ncert-it12-5-2
  lvl: ncert-intext
  num: "§12.4 Q2"
  source: NCERT X Science · Ch 12 · In-text questions after §12.4 · Q2
  kind: num
  q: An electric oven of 2 kW power rating is operated in a domestic electric circuit (220 V) that has a current rating of 5 A. What result do you expect? Explain.
  ask: Current drawn by the oven
  unit: A
  ans: 9.09
  tol: 0.01
  verify: 2000/220
  sol: |
    The oven draws $I = P/V = 2000/220 = 9.1$ A. This is more than the 5 A rating of the circuit, so the circuit is overloaded: the fuse in the 5 A circuit will melt and break the circuit (or a breaker will trip) and the oven will not work. Such an oven must be connected to the 15 A circuit meant for high-power appliances.
  check: code

- id: ncert-it12-5-3
  lvl: ncert-intext
  num: "§12.4 Q3"
  source: NCERT X Science · Ch 12 · In-text questions after §12.4 · Q3
  kind: text
  q: What precaution should be taken to avoid the overloading of domestic electric circuits?
  sol: |
    Do not connect too many appliances to a single socket; use the 15 A circuit for high-power appliances; fit a fuse of the correct rating in the live wire; do not let the live and neutral wires touch (keep the insulation in good condition); and do not overload the circuit by raising the supply voltage.
  check: none

- id: ncert-ex12-2
  lvl: ncert-ex
  num: 2
  source: NCERT X Science · Ch 12 · Exercise 2
  kind: mcq
  q: At the time of short circuit, the current in the circuit
  opts: ["reduces substantially.", "does not change.", "increases heavily.", "vary continuously."]
  ans: 2
  sol: In a short circuit the live and neutral wires touch, so the resistance of the circuit falls to almost zero and the current ($I = V/R$) increases enormously.
  answer_key: (c)
  check: ncert-key

- id: ncert-ex12-8
  lvl: ncert-ex
  num: 8
  source: NCERT X Science · Ch 12 · Exercise 8
  kind: text
  q: When does an electric short circuit occur?
  sol: |
    A short circuit occurs when the live wire and the neutral wire come into direct contact, for example when their insulation is damaged or there is a fault in an appliance. The resistance of the circuit drops to a very low value and the current increases abruptly.
  check: none

- id: ncert-ex12-9
  lvl: ncert-ex
  num: 9
  source: NCERT X Science · Ch 12 · Exercise 9
  kind: text
  q: What is the function of an earth wire? Why is it necessary to earth metallic appliances?
  sol: |
    The earth wire (green insulation) is connected to a metal plate deep in the ground. It is joined to the metallic body of an appliance and gives any leakage current a low-resistance path to the earth. This keeps the body of the appliance at the potential of the earth, so a user touching it does not get a severe electric shock. Metallic appliances (toaster, electric press, refrigerator, table fan) need it because a fault that connects the live wire to the body would otherwise make the body live.
  check: none

