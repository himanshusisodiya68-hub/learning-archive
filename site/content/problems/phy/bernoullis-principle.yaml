- id: f3
  lvl: found
  kind: mcq
  q: In the steady flow of a non-viscous liquid through a horizontal pipe, the pressure is lowest where
  opts: ["the speed is lowest", "the speed is highest", "the pipe is widest", "the liquid is coldest"]
  ans: 1
  sol: From Bernoulli's equation at constant height, $P+\tfrac12\rho v^2$ is constant, so the pressure is lowest where $v$ is highest (which is also where the pipe is narrowest). (Original problem.)
  check: none

- id: b1
  lvl: board
  kind: num
  q: A tank is filled with water and open to the air at the top. A small hole is made in its side 1.25 m below the water surface. With what speed does the water leave the hole? Take g = 9.8 m/s². (Original problem.)
  ask: Speed of efflux
  unit: m/s
  ans: 4.95
  tol: 0.02
  verify: sqrt(2*9.8*1.25)
  sol: |
    Apply Bernoulli between the surface (speed $\approx0$, pressure $P_a$) and the hole (pressure $P_a$): $\rho gh = \tfrac12\rho v^2$, so $v = \sqrt{2gh} = \sqrt{2\times9.8\times1.25} = 4.95$ m/s (Torricelli's theorem). It equals the speed of a body falling freely through $h$.
  check: code

- id: b2
  lvl: board
  kind: text
  q: A strong wind blows over a house with a flat roof. Explain why the roof may be lifted off. (Original problem.)
  sol: |
    The wind moving fast over the roof lowers the air pressure just above it (Bernoulli's principle), while the air inside the house is nearly still, at about atmospheric pressure. The pressure difference acts upward on the whole area of the roof, $F = \Delta P\times A$. For a large roof area and a storm wind of 40 m/s, $\Delta P\approx\tfrac12\times1.2\times40^2\approx1000$ Pa, over 100 m$^2$ gives $10^{5}$ N, enough to lift the roof.
  check: none

- id: b3
  lvl: board
  kind: num
  q: Water flows at 2.0 m/s in a wide horizontal pipe and 8.0 m/s in a narrow part of it. Find the difference in pressure between the two sections. (Original problem.)
  ask: Pressure difference
  unit: kPa
  ans: 30
  tol: 0.1
  verify: 0.5*1000*(8.0**2-2.0**2)/1e3
  sol: At the same height, $P_1-P_2 = \tfrac12\rho(v_2^2-v_1^2) = \tfrac12\times1000\times(64-4) = 3.0\times10^{4}$ Pa $=30$ kPa. The pressure is lower in the narrow, faster section.
