# Equation of continuity, Bernoulli's principle and applications. NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27), Ch 9 Mechanical Properties of Fluids: Example 9.7 and Exercises 9.4, 9.11, 9.12, 9.14, 9.15, 9.16. keph1an covers Part 1 only, so no NCERT answer key exists for this chapter: every solution is ours (check: code for numeric items, none otherwise). Exercise 9.15 depends on Fig. 9.20, which we read from the page image. Found, board and main problems are original.

- id: ncert11-eg-9-7
  lvl: ncert-intext
  num: "XI Ex 9.7"
  source: NCERT XI Physics · Ch 9 · Example 9.7
  kind: num
  q: A fully loaded Boeing aircraft has a mass of 3.3 × 10^5 kg. Its total wing area is 500 m^2. It is in level flight with a speed of 960 km/h. (a) Estimate the pressure difference between the lower and upper surfaces of the wings (b) Estimate the fractional increase in the speed of the air on the upper surface of the wing relative to the lower surface. [The density of air is ρ = 1.2 kg m^-3]
  ask: Pressure difference, part (a)
  unit: Pa
  ans: 6468
  tol: 40
  verify: 3.3e5*9.8/500
  sol: |
    (a) In level flight the weight is balanced by the upward force from the pressure difference: $\Delta P\times A = 3.3\times10^{5}\times9.8$, so
    $$\Delta P = \frac{3.3\times10^{5}\times9.8}{500} = 6.5\times10^{3}\ \text{N m}^{-2}.$$

    (b) Ignoring the small height difference in Bernoulli's equation, $\Delta P = \tfrac12\rho(v_2^2-v_1^2) = \rho\,(v_2-v_1)\,v_{av}$, where $v_2$ is the speed over the upper surface, $v_1$ under the wing and $v_{av} = (v_1+v_2)/2 = 960$ km/h $=267$ m s$^{-1}$. Therefore
    $$\frac{v_2-v_1}{v_{av}} = \frac{\Delta P}{\rho v_{av}^2} = \frac{6468}{1.2\times267^2} \approx0.08 .$$
    The air above the wing needs to be only about 8% faster than that below. (Our arithmetic gives 7.6%, which the book rounds to 8%.)
  check: code

- id: ncert11-ex-9-4
  lvl: ncert-ex
  num: "XI 9.4"
  source: NCERT XI Physics · Ch 9 · Exercise 9.4
  kind: text
  q: |-
    Explain why
    (a) To keep a piece of paper horizontal, you should blow over, not under, it
    (b) When we try to close a water tap with our fingers, fast jets of water gush through the openings between our fingers
    (c) The size of the needle of a syringe controls flow rate better than the thumb pressure exerted by a doctor while administering an injection
    (d) A fluid flowing out of a small hole in a vessel results in a backward thrust on the vessel
    (e) A spinning cricket ball in air does not follow a parabolic trajectory
  sol: |
    (a) Blowing over the paper makes the air above it move fast, so by Bernoulli's principle the pressure above falls below the atmospheric pressure underneath, and the net upward push supports the paper. Blowing under it would lower the pressure below and press the paper down.

    (b) The water is the same flow, $Q = Av$ (equation of continuity). Closing the tap with fingers leaves only narrow gaps, a small total area $A$, so the speed $v = Q/A$ through them is large: fast jets.

    (c) The flow rate through a narrow tube depends very strongly on its radius (Poiseuille's law, $Q\propto r^4$ for a given pressure difference), so the needle's bore matters far more than modest changes in thumb pressure, which only change $Q$ in proportion.

    (d) The jet leaves with momentum in one direction, so the vessel gains an equal momentum the other way (Newton's third law, momentum conservation). Equivalently, the pressure on the wall opposite the hole is not balanced by one at the hole.

    (e) A spinning ball drags a layer of air around with it. On the side where the surface moves with the airstream the relative air speed is low and the pressure is high. On the other side the relative speed is high and the pressure low. This pressure difference gives a sideways force (the Magnus effect), so the path is curved, not a parabola.
  check: none

- id: ncert11-ex-9-11
  lvl: ncert-ex
  num: "XI 9.11"
  source: NCERT XI Physics · Ch 9 · Exercise 9.11
  kind: text
  q: Can Bernoulli's equation be used to describe the flow of water through a rapid in a river ? Explain.
  sol: |
    **No.** Bernoulli's equation assumes steady, streamline (laminar) flow of an incompressible, non-viscous fluid, so that mechanical energy is conserved along a streamline. In a rapid the flow is turbulent: the speed and pressure at a point fluctuate irregularly, eddies form, and a lot of mechanical energy is dissipated as heat through viscosity. The conditions fail, so the equation cannot be used.
  check: none

- id: ncert11-ex-9-12
  lvl: ncert-ex
  num: "XI 9.12"
  source: NCERT XI Physics · Ch 9 · Exercise 9.12
  kind: text
  q: Does it matter if one uses gauge instead of absolute pressures in applying Bernoulli's equation ? Explain.
  sol: |
    **No, as long as the same kind is used on both sides.** Bernoulli's equation $P_1+\tfrac12\rho v_1^2+\rho gh_1 = P_2+\tfrac12\rho v_2^2+\rho gh_2$ involves the pressures at two points. Gauge pressure $=$ absolute pressure $-P_a$, and the atmospheric pressure $P_a$ is the same constant on both sides of the equation (provided the two points are at about the same atmospheric level), so it cancels. Mixing gauge pressure at one point with absolute pressure at the other would be an error.
  check: none

- id: ncert11-ex-9-14
  lvl: ncert-ex
  num: "XI 9.14"
  source: NCERT XI Physics · Ch 9 · Exercise 9.14
  kind: num
  q: In a test experiment on a model aeroplane in a wind tunnel, the flow speeds on the upper and lower surfaces of the wing are 70 m s^-1 and 63 m s^-1 respectively. What is the lift on the wing if its area is 2.5 m^2 ? Take the density of air to be 1.3 kg m^-3.
  ask: Lift
  unit: N
  ans: 1513
  tol: 5
  verify: 0.5*1.3*(70**2-63**2)*2.5
  sol: |
    By Bernoulli (same height), the pressure difference between the lower and upper surfaces is
    $$\Delta P = \tfrac12\rho(v_1^2-v_2^2) = \tfrac12\times1.3\times(70^2-63^2) = 0.65\times931 = 605\ \text{Pa}.$$
    The lift is $\Delta P\times A = 605\times2.5 = 1.5\times10^{3}$ N (1513 N).
  check: code

- id: ncert11-ex-9-15
  lvl: ncert-ex
  num: "XI 9.15"
  source: NCERT XI Physics · Ch 9 · Exercise 9.15
  kind: mcq
  q: Figures 9.20(a) and (b) refer to the steady flow of a (non-viscous) liquid. Which of the two figures is incorrect ? Why ?
  opts: ["Figure 9.20(a)", "Figure 9.20(b)"]
  ans: 0
  sol: |
    **Figure (a) is incorrect.** [Inference] Both figures show a horizontal pipe with a constriction and two vertical tubes measuring the pressure, one in the wide part and one at the throat. In (a) the liquid stands higher in the tube at the throat than in the tube at the wide part; in (b) it stands lower there.

    By the equation of continuity the liquid moves faster in the narrow throat, and by Bernoulli's principle (horizontal pipe) the pressure is then lower there. The liquid level in the tube at the constriction must therefore be lower, as drawn in (b). In (a) the throat tube shows a higher pressure, which is impossible for steady non-viscous flow.
  check: none

- id: ncert11-ex-9-16
  lvl: ncert-ex
  num: "XI 9.16"
  source: NCERT XI Physics · Ch 9 · Exercise 9.16
  kind: num
  q: The cylindrical tube of a spray pump has a cross-section of 8.0 cm^2 one end of which has 40 fine holes each of diameter 1.0 mm. If the liquid flow inside the tube is 1.5 m min^-1, what is the speed of ejection of the liquid through the holes ?
  ask: Speed of ejection
  unit: m/s
  ans: 0.637
  tol: 0.005
  verify: (8.0e-4*(1.5/60))/(40*PI*(0.5e-3)**2)
  sol: |
    Equation of continuity: $A_1v_1 = A_2v_2$, where $A_2$ is the total area of the holes.

    $A_1 = 8.0\times10^{-4}$ m$^2$ and $v_1 = 1.5\ \text{m/min} = 0.025$ m s$^{-1}$. $A_2 = 40\times\pi(0.5\times10^{-3})^2 = 3.14\times10^{-5}$ m$^2$. So
    $$v_2 = \frac{A_1v_1}{A_2} = \frac{8.0\times10^{-4}\times0.025}{3.14\times10^{-5}} = 0.64\ \text{m s}^{-1}.$$
  check: code

- id: f1
  lvl: found
  kind: mcq
  q: Water flows steadily through a pipe that narrows. Where is the water speed greatest?
  opts: ["in the wide part", "in the narrow part", "equal everywhere", "it depends on the pipe's colour"]
  ans: 1
  sol: The volume flowing past every section per second is the same, $Av = $ constant (equation of continuity). A smaller area $A$ forces a larger speed $v$. (Original problem.)
