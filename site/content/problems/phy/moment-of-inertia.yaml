# Moment of inertia, rotation about a fixed axis, parallel and perpendicular axes theorems. NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27), Ch 6 (Examples 6.10 and 6.11; Exercises 6.10 and 6.13). Rotational kinematics and the law tau = I alpha are filed here. Found, board and main problems are original.

- id: ncert11-eg-6-10
  lvl: ncert-intext
  num: "XI Ex 6.10"
  source: NCERT XI Physics · Ch 6 · Example 6.10
  kind: proof
  q: Obtain Eq. (6.36) from first principles.
  hints:
    - Eq. (6.36) is $\omega=\omega_0+\alpha t$ (rotation with uniform angular acceleration). Start from the definition $\alpha=d\omega/dt$ with $\alpha$ constant.
    - Integrate both sides with respect to $t$ and call the constant of integration $c$.
    - Use the initial condition $\omega=\omega_0$ at $t=0$ to find $c$.
  sol: |
    Eq. (6.36) is $\omega=\omega_0+\alpha t$, for rotation about a fixed axis with uniform angular acceleration. Here $\omega$ is the angular velocity at time $t$ and $\omega_0$ its value at $t=0$.

    The angular acceleration is uniform, hence
    $$\frac{d\omega}{dt}=\alpha=\text{constant}.$$
    Integrating with respect to $t$,
    $$\omega=\int\alpha\,dt+c=\alpha t+c\quad(\alpha\ \text{constant}).$$
    At $t=0$, $\omega=\omega_0$ (given), so $\omega_0=c$. Thus $\omega=\omega_0+\alpha t$, as required.

    Integrating $\omega=d\theta/dt$ once more gives $\theta=\omega_0t+\tfrac12\alpha t^2$ (Eq. 6.37), and eliminating $t$ gives $\omega^2=\omega_0^2+2\alpha\theta$ (Eq. 6.38), the exact analogues of the linear equations of motion.
  check: none

- id: ncert11-eg-6-11
  lvl: ncert-intext
  num: "XI Ex 6.11"
  source: NCERT XI Physics · Ch 6 · Example 6.11
  kind: num
  q: The angular speed of a motor wheel is increased from 1200 rpm to 3120 rpm in 16 seconds. (i) What is its angular acceleration, assuming the acceleration to be uniform? (ii) How many revolutions does the engine make during this time?
  ask: Angular acceleration, part (i)
  unit: rad/s²
  ans: 12.57
  tol: 0.02
  verify: (2*PI*3120/60-2*PI*1200/60)/16
  sol: |
    (i) Use $\omega=\omega_0+\alpha t$. Convert to rad/s: $\omega_0=\dfrac{2\pi\times1200}{60}=40\pi$ rad/s and $\omega=\dfrac{2\pi\times3120}{60}=104\pi$ rad/s. Then
    $$\alpha=\frac{\omega-\omega_0}{t}=\frac{104\pi-40\pi}{16}=4\pi\ \text{rad/s}^2\approx12.57\ \text{rad/s}^2.$$

    (ii) The angular displacement in time $t$ is
    $$\theta=\omega_0t+\tfrac12\alpha t^2=\left(40\pi\times16+\tfrac12\times4\pi\times16^2\right)\text{rad}=(640\pi+512\pi)\ \text{rad}=1152\pi\ \text{rad}.$$
    Number of revolutions $=\dfrac{1152\pi}{2\pi}=576$.
  check: code

- id: ncert11-ex-6-10
  lvl: ncert-ex
  num: "XI 6.10"
  source: NCERT XI Physics · Ch 6 · Exercise 6.10
  kind: text
  q: |-
    Torques of equal magnitude are applied to a hollow cylinder and a solid sphere, both having the same mass and radius. The cylinder is free to rotate about its standard axis of symmetry, and the sphere is free to rotate about an axis passing through its centre. Which of the two will acquire a greater angular speed after a given time.
  sol: |
    The **solid sphere** acquires the greater angular speed.

    Both start from rest and feel the same torque $\tau$, so $\alpha=\tau/I$ and, after time $t$, $\omega=\alpha t=\tau t/I$. The angular speed is larger for the body with the smaller moment of inertia.

    For the same mass $M$ and radius $R$: hollow cylinder about its axis, $I_c=MR^2$ (all the mass is at distance $R$); solid sphere about a diameter, $I_s=\tfrac25MR^2$. The sphere's $I$ is smaller, so
    $$\frac{\omega_s}{\omega_c}=\frac{I_c}{I_s}=\frac52 .$$
    After the same time the sphere spins 2.5 times as fast. The sphere has its mass nearer the axis, so it is "easier to spin up".
  answer_key: Sphere
  check: ncert-key

- id: ncert11-ex-6-13
  lvl: ncert-ex
  num: "XI 6.13"
  source: NCERT XI Physics · Ch 6 · Exercise 6.13
  kind: num
  q: |-
    A rope of negligible mass is wound round a hollow cylinder of mass 3 kg and radius 40 cm. What is the angular acceleration of the cylinder if the rope is pulled with a force of 30 N? What is the linear acceleration of the rope? Assume that there is no slipping.
  ask: Angular acceleration of the cylinder
  unit: rad/s²
  ans: 25
  tol: 0.05
  verify: 30*0.4/(3*0.4**2)
  sol: |
    The rope pulls tangentially at the rim, so the torque about the axis is $\tau=FR=30\times0.40=12$ N m. The hollow cylinder has $I=MR^2=3\times0.40^2=0.48$ kg m$^2$. Then
    $$\alpha=\frac{\tau}{I}=\frac{12}{0.48}=25\ \text{rad/s}^2.$$
    With no slipping, a point on the rope moves with the rim: $a=\alpha R=25\times0.40=10\ \text{m/s}^2$.
  answer_key: 25 s-2; 10 m s-2
  check: both

- id: f1
  lvl: found
  kind: num
  q: Two 2 kg masses are fixed at the two ends of a light rod 1 m long. Find the moment of inertia about an axis through the midpoint of the rod, perpendicular to it. (Original problem.)
  ask: Moment of inertia
  unit: kg m²
  ans: 1
  tol: 0.005
  verify: 2*2*0.5**2
  sol: |
    Each mass is 0.5 m from the axis: $I=\sum m r^2=2(2)(0.5)^2=1.0$ kg m$^2$. The rod is light, so it adds nothing. (Original problem.)
  check: code

- id: f2
