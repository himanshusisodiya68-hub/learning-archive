- id: f3
  lvl: found
  kind: mcq
  q: A ring and a solid disc have the same mass and radius. The same torque is applied to each about its own axis. Which one gets the greater angular acceleration? (Original problem.)
  opts: ["the ring", "the disc", "both equally", "it depends on the direction of the torque"]
  ans: 1
  sol: $\alpha=\tau/I$. The ring has $I=MR^2$ and the disc has $I=\tfrac12MR^2$, so the disc has the smaller $I$ and the larger $\alpha$ (twice as large). (Original problem.)
