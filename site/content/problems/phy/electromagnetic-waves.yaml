# Electromagnetic waves and the electromagnetic spectrum. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 8, §8.3 and Exercises 8.3–8.10. Found, board and main problems are original.

- id: ncert12-eg-8-1
  lvl: ncert-intext
  num: "XII Ex 8.1"
  source: NCERT XII Physics · Ch 8 · Example 8.1
  kind: num
  q: A plane electromagnetic wave of frequency 25 MHz travels in free space along the x-direction. At a particular point in space and time, E = 6.3 ĵ V/m. What is B at this point?
  ask: Magnitude of B
  unit: T
  ans: 2.1e-8
  tol: 1e-10
  verify: 6.3/3e8
  sol: |
    In an electromagnetic wave in vacuum $E/B = c$, so $B = E/c = \dfrac{6.3}{3\times10^{8}} = 2.1\times10^{-8}$ T. For the direction: $\mathbf E\times\mathbf B$ must point along the direction of propagation, $+x$. With $\mathbf E$ along $+y$, $(+\hat j)\times(+\hat k) = \hat i$, so $\mathbf B$ is along $+z$: $\mathbf B = 2.1\times10^{-8}\,\hat k$ T.
  check: code

- id: ncert12-eg-8-2
  lvl: ncert-intext
  num: "XII Ex 8.2"
  source: NCERT XII Physics · Ch 8 · Example 8.2
  kind: num
  q: |-
    The magnetic field in a plane electromagnetic wave is given by B_y = (2 × 10⁻⁷) T sin (0.5×10³x + 1.5×10¹¹t).
    (a) What is the wavelength and frequency of the wave?
    (b) Write an expression for the electric field.
  ask: Wavelength, part (a)
  unit: cm
  ans: 1.2566
  tol: 0.005
  verify: 2*Math.PI/0.5e3*100
  sol: |
    (a) Comparing with $B_y = B_0\sin2\pi\left(\dfrac{x}{\lambda} + \dfrac tT\right)$, i.e. $\sin(kx + \omega t)$ with $k = 0.5\times10^{3}$ m⁻¹ and $\omega = 1.5\times10^{11}$ s⁻¹:

    $$\lambda = \frac{2\pi}{k} = \frac{2\pi}{0.5\times10^{3}} = 1.26\ \text{cm},\qquad \nu = \frac{\omega}{2\pi} = \frac{1.5\times10^{11}}{2\pi} = 23.9\ \text{GHz}.$$

    (b) $E_0 = B_0c = 2\times10^{-7}\times3\times10^{8} = 60$ V/m. The electric field is perpendicular to both the direction of propagation ($-x$, since the phase is $kx + \omega t$) and $\mathbf B$ (along $y$), so it is along $z$:

    $$E_z = 60\sin(0.5\times10^{3}x + 1.5\times10^{11}t)\ \text{V/m}.$$
  check: code

- id: ncert12-ex-8-3
  lvl: ncert-ex
  num: "XII 8.3"
  source: NCERT XII Physics · Ch 8 · Exercise 8.3
  kind: text
  q: What physical quantity is the same for X-rays of wavelength 10⁻¹⁰ m, red light of wavelength 6800 Å and radiowaves of wavelength 500m?
  sol: |
    The **speed in vacuum** is the same for all electromagnetic waves: $c = 3\times10^{8}$ m s⁻¹. (Their wavelengths, frequencies and photon energies differ.)
  answer_key: The speed in vacuum is the same for all, c = 3 × 10⁸ m s⁻¹.
  check: ncert-key

- id: ncert12-ex-8-4
  lvl: ncert-ex
  num: "XII 8.4"
  source: NCERT XII Physics · Ch 8 · Exercise 8.4
  kind: num
  q: A plane electromagnetic wave travels in vacuum along z-direction. What can you say about the directions of its electric and magnetic field vectors? If the frequency of the wave is 30 MHz, what is its wavelength?
  ask: Wavelength
  unit: m
  ans: 10
  tol: 0.01
  verify: 3e8/30e6
  sol: |
    The electric and magnetic field vectors are perpendicular to each other and to the direction of propagation, so both lie in the $x$–$y$ plane (the wave is transverse), with $\mathbf E\times\mathbf B$ along $+z$. $\lambda = c/\nu = 3\times10^{8}/(30\times10^{6}) = 10$ m.
  answer_key: E and B in x-y plane and are mutually perpendicular, 10 m.
  check: both

- id: ncert12-ex-8-5
  lvl: ncert-ex
  num: "XII 8.5"
  source: NCERT XII Physics · Ch 8 · Exercise 8.5
  kind: num
  q: A radio can tune in to any station in the 7.5 MHz to 12 MHz band. What is the corresponding wavelength band?
  ask: Shortest wavelength
  unit: m
  ans: 25
  tol: 0.01
  verify: 3e8/12e6
  sol: |
    $\lambda = c/\nu$: for 7.5 MHz, $\lambda = 3\times10^{8}/7.5\times10^{6} = 40$ m; for 12 MHz, $\lambda = 25$ m. The wavelength band is 40 m to 25 m.
  answer_key: |
    Wavelength band: 40 m – 25 m.
  check: both

- id: ncert12-ex-8-6
  lvl: ncert-ex
  num: "XII 8.6"
  source: NCERT XII Physics · Ch 8 · Exercise 8.6
  kind: text
  q: A charged particle oscillates about its mean equilibrium position with a frequency of 10⁹ Hz. What is the frequency of the electromagnetic waves produced by the oscillator?
  sol: |
    **10⁹ Hz.** An oscillating charge is an accelerated charge that radiates electromagnetic waves of the same frequency as its oscillation.
  answer_key: 10⁹ Hz
  check: ncert-key

