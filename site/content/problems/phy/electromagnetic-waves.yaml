- id: m2
  lvl: main
  kind: text
  q: |
    Arrange the following in order of increasing wavelength: X-rays, radio waves, visible light, γ-rays, microwaves, ultraviolet. State what stays constant. (Original problem.)
  sol: |
    Increasing wavelength: γ-rays < X-rays < ultraviolet < visible light < microwaves < radio waves. The speed in vacuum, $c$, stays constant for all of them. Photon energy $E = hc/\lambda$ decreases in the same order.
  check: none
