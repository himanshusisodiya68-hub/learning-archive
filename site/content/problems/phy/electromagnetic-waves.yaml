- id: m1
  lvl: main
  kind: num
  q: Sunlight falls on a perfectly absorbing surface with an intensity of 1000 W/m². Find the radiation pressure on it, p = I/c. (Original problem.)
  ask: Radiation pressure
  unit: µPa
  ans: 3.333
  tol: 0.005
  verify: 1000/3e8*1e6
  sol: For a perfect absorber, $p = I/c = 1000/(3\times10^{8}) = 3.3\times10^{-6}$ Pa. For a perfect reflector the pressure is twice this.
