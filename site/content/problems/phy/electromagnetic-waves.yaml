- id: ncert12-ex-8-8
  lvl: ncert-ex
  num: "XII 8.8"
  source: NCERT XII Physics · Ch 8 · Exercise 8.8
  kind: num
  q: Suppose that the electric field amplitude of an electromagnetic wave is E₀ = 120 N/C and that its frequency is ν = 50.0 MHz. (a) Determine, B₀, ω, k, and λ. (b) Find expressions for E and B.
  ask: Amplitude of the magnetic field
  unit: nT
  ans: 400
  tol: 0.5
  verify: 120/3e8*1e9
  sol: |
    (a) $B_0 = E_0/c = \dfrac{120}{3\times10^{8}} = 4.0\times10^{-7}$ T $= 400$ nT. $\omega = 2\pi\nu = 2\pi\times50.0\times10^{6} = 3.14\times10^{8}$ rad/s. $k = \omega/c = 1.05$ rad/m. $\lambda = c/\nu = 6.00$ m.

    (b) Take the wave travelling along $+x$ with $\mathbf E$ along $\hat j$ (so $\mathbf B$ is along $\hat k$):
    $$\mathbf E = (120\ \text{N/C})\sin[(1.05\ \text{rad/m})x - (3.14\times10^{8}\ \text{rad/s})t]\,\hat j,$$
    $$\mathbf B = (400\ \text{nT})\sin[(1.05\ \text{rad/m})x - (3.14\times10^{8}\ \text{rad/s})t]\,\hat k.$$
    (The direction of travel and of the fields is a choice: the question does not specify it, and the key makes this one.)
  answer_key: "(a) 400 nT, 3.14 × 10⁸ rad/s, 1.05 rad/m, 6.00 m. (b) E = {(120 N/C) sin[(1.05 rad/m)x − (3.14 × 10⁸ rad/s)t]} ĵ; B = {(400 nT) sin[(1.05 rad/m)x − (3.14 × 10⁸ rad/s)t]} k̂"
  check: both

- id: ncert12-ex-8-9
  lvl: ncert-ex
  num: "XII 8.9"
  source: NCERT XII Physics · Ch 8 · Exercise 8.9
  kind: num
  q: |
    The terminology of different parts of the electromagnetic spectrum is given in the text. Use the formula E = hν (for energy of a quantum of radiation: photon) and obtain the photon energy in units of eV for different parts of the electromagnetic spectrum. In what way are the different scales of photon energies that you obtain related to the sources of electromagnetic radiation?
  ask: Photon energy for λ = 1 m
  unit: µeV
  ans: 1.24
  tol: 0.005
  verify: 6.63e-34*3e8/1/1.6e-19*1e6
  sol: |
    $E = h\nu = hc/\lambda$. For $\lambda = 1$ m: $E = \dfrac{6.63\times10^{-34}\times3\times10^{8}}{1.6\times10^{-19}}$ eV $= 1.24\times10^{-6}$ eV. For other wavelengths multiply by the appropriate power of ten: $E\ (\text{eV}) \approx 1.24\times10^{-6}/\lambda\ (\text{m})$.

    **Relation to the sources.** The photon energy shows the spacing of the energy levels of the source that emits it. For example, $\lambda = 10^{-12}$ m corresponds to $1.24\times10^{6}$ eV $= 1.24$ MeV: nuclear energy levels (transitions between which give $\gamma$-rays) are typically spaced by about 1 MeV. A visible wavelength $\lambda = 5\times10^{-7}$ m corresponds to 2.5 eV: the levels in atoms that give visible light are typically spaced by a few eV.
  answer_key: Photon energy (for λ = 1 m) = 6.63 × 10⁻³⁴ × 3 × 10⁸/1.6 × 10⁻¹⁹ eV = 1.24 × 10⁻⁶ eV; λ = 10⁻¹² m corresponds to 1.24 MeV (nuclear levels); λ = 5 × 10⁻⁷ m corresponds to 2.5 eV (levels of a few eV).
  check: both

- id: ncert12-ex-8-10
  lvl: ncert-ex
  num: "XII 8.10"
  source: NCERT XII Physics · Ch 8 · Exercise 8.10
  kind: num
  q: |-
    In a plane electromagnetic wave, the electric field oscillates sinusoidally at a frequency of 2.0 × 10¹⁰ Hz and amplitude 48 V m⁻¹.
    (a) What is the wavelength of the wave?
    (b) What is the amplitude of the oscillating magnetic field?
    (c) Show that the average energy density of the E field equals the average energy density of the B field. [c = 3 × 10⁸ m s⁻¹.]
  ask: Amplitude of the magnetic field
  unit: nT
  ans: 160
  tol: 0.1
  verify: 48/3e8*1e9
  sol: |
    (a) $\lambda = c/\nu = \dfrac{3\times10^{8}}{2.0\times10^{10}} = 1.5\times10^{-2}$ m.

    (b) $B_0 = E_0/c = \dfrac{48}{3\times10^{8}} = 1.6\times10^{-7}$ T $= 160$ nT.

    (c) The energy density in the electric field is $u_E = \tfrac12\varepsilon_0E^2$ and in the magnetic field $u_B = \dfrac{1}{2\mu_0}B^2$. Using $E = cB$ and $c^2 = \dfrac{1}{\mu_0\varepsilon_0}$: $u_E = \tfrac12\varepsilon_0c^2B^2 = \tfrac12\varepsilon_0\dfrac{1}{\mu_0\varepsilon_0}B^2 = \dfrac{B^2}{2\mu_0} = u_B$. (The same holds for the time averages.)
  answer_key: "(a) λ = c/ν = 1.5 × 10⁻² m (b) B₀ = E₀/c = 1.6 × 10⁻⁷ T (c) u_E = ½ε₀E², u_B = B²/2µ₀; with E = cB and c = 1/√(µ₀ε₀), u_E = u_B"
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: Electromagnetic waves in vacuum
  opts: ["are longitudinal", "travel at c with E and B perpendicular to each other and to the direction of travel", "need a medium", "have E parallel to B"]
  ans: 1
  sol: Electromagnetic waves are transverse, need no medium, and travel at $c$ with $\mathbf E\perp\mathbf B\perp$ direction of propagation.
  check: none

