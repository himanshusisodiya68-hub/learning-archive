- id: f3
  lvl: found
  kind: text
  q: |-
    A ball rolls down a smooth inclined plane at angle $\theta$. Describe the free-body diagram of the ball and write the equation of motion along the plane. (Original problem.)
  sol: |
    Two forces act on the ball: its weight $mg$, vertically downward, and the normal force $N$ of the plane, perpendicular to the plane and away from it (the surface is smooth, so there is no friction). Choose axes along and perpendicular to the plane and resolve the weight into $mg\sin\theta$ along the plane (down the slope) and $mg\cos\theta$ into the plane.

    Perpendicular to the plane there is no acceleration: $N = mg\cos\theta$. Along the plane: $mg\sin\theta = ma$, so $a = g\sin\theta$ down the slope, independent of the mass.
  check: none

- id: b1
  lvl: board
  kind: num
  q: |-
    A block of mass 10 kg slides down a smooth plane inclined at $30^\circ$ to the horizontal. Find the normal force on it. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Normal force
  unit: N
  ans: 84.9
  tol: 0.1
  verify: 10*9.8*cos(rad(30))
  sol: |
    There is no acceleration perpendicular to the plane, so $N = mg\cos 30^\circ = 10 \times 9.8 \times 0.866 = 84.9$ N. (The acceleration along the plane is $g\sin 30^\circ = 4.9$ m s$^{-2}$.)
  check: code

- id: b2
  lvl: board
  kind: num
  q: |-
    A 60 kg person stands on a weighing scale in a lift accelerating upward at 1.5 m s$^{-2}$. What force does the scale show? Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Normal force on the person
  unit: N
  ans: 678
  tol: 0.5
  verify: 60*(9.8+1.5)
  sol: |
    Free-body diagram of the person: normal force $N$ upward, weight $mg$ downward. Taking up as positive, $N - mg = ma$, so $N = m(g + a) = 60 \times 11.3 = 678$ N. The scale shows 678 N, which is more than the true weight of 588 N.
  check: code

- id: b3
  lvl: board
  kind: num
  q: |-
    A 3 kg lamp hangs from the ceiling by two identical light ropes, each making $30^\circ$ with the horizontal. Find the tension in each rope. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Tension in each rope
  unit: N
  ans: 29.4
  tol: 0.1
  verify: 3*9.8/(2*sin(rad(30)))
  sol: |
    By symmetry the two tensions are equal. The horizontal components cancel. Vertically, $2T\sin 30^\circ = mg$, so $T = mg/(2\sin 30^\circ) = mg = 3 \times 9.8 = 29.4$ N.
  check: code

- id: b4
  lvl: board
  kind: text
  q: |-
    A man stands on a scale in a lift. Draw (describe) the free-body diagram of the man and state, with reasons, whether the scale reading is larger than, equal to or smaller than his true weight when the lift (a) moves up at constant speed, (b) speeds up while going up, (c) speeds up while going down, (d) is in free fall. (Original problem.)
  sol: |
    Only two forces act on the man: weight $mg$ downward and the normal force $N$ upward from the scale, and the reading is $N$. Taking up as positive, $N - mg = ma$.

    (a) Constant speed: $a = 0$, so $N = mg$: equal.

    (b) Speeding up while going up: $a > 0$, so $N = m(g + a) > mg$: larger.

    (c) Speeding up while going down: $a < 0$, so $N = m(g - |a|) < mg$: smaller.

    (d) Free fall: $a = -g$, so $N = 0$: the scale reads zero (apparent weightlessness), though the Earth's pull on the man is unchanged.
  check: none

- id: m1
  lvl: main
  kind: num
  q: |-
    A 2 kg block is held at rest on a smooth plane inclined at $30^\circ$ by a horizontal force $F$ pushing it into the slope. Find $F$. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Horizontal force F
  unit: N
  ans: 11.3
  tol: 0.05
  verify: 2*9.8*tan(rad(30))
  sol: |
    Three forces: weight $mg$ (down), normal force $N$ (perpendicular to the plane) and $F$ (horizontal). Resolve along and perpendicular to the plane. Along the plane, there is no acceleration: $F\cos 30^\circ = mg\sin 30^\circ$, so $F = mg\tan 30^\circ = 2 \times 9.8 \times 0.577 = 11.3$ N. (Perpendicular to the plane, $N = mg\cos 30^\circ + F\sin 30^\circ = 22.6$ N.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: |-
    A 5 kg mass hangs from a knot O. The knot is held by two light strings: one is horizontal, the other makes $60^\circ$ with the vertical. Find the tension in the inclined string. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Tension in the inclined string
  unit: N
  ans: 98
  tol: 0.2
  verify: 5*9.8/cos(rad(60))
  sol: |
    Free-body diagram of the knot O: $T_2$ pulling down (equal to the weight $mg = 49$ N, as the mass hangs at rest), $T_1$ along the inclined string, $T_h$ along the horizontal string. Vertical balance: $T_1\cos 60^\circ = mg = 49$ N, so $T_1 = 49/0.5 = 98$ N. Horizontal balance: $T_h = T_1\sin 60^\circ = 84.9$ N.
  check: code

- id: m3
  lvl: main
  kind: num
  q: |-
    A 3 kg block sits on a 5 kg block, which sits on a table. A downward push of 20 N is applied on the top block. Find the normal force the table exerts on the lower block. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Normal force of the table
  unit: N
  ans: 98.4
  tol: 0.1
  verify: (3+5)*9.8+20
  sol: |
    Take both blocks as the system. External forces: weights $(3+5) \times 9.8 = 78.4$ N down, the push 20 N down and the table's normal force $N$ up. Equilibrium: $N = 78.4 + 20 = 98.4$ N. (Forces between the blocks are internal and drop out; for the top block alone, the lower block pushes up with $3 \times 9.8 + 20 = 49.4$ N, and by the third law the top block pushes down on the lower one with 49.4 N.)
  check: code

- id: m4
  lvl: main
  kind: num
  q: |-
    A man of mass 70 kg sits on a chair of mass 10 kg hung from a light rope that passes over a fixed pulley; the other end of the rope is in his hands. He pulls the rope with a force of 500 N. Find the force the chair exerts on him. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Force of the chair on the man
  unit: N
  ans: 375
  tol: 0.5
  verify: 70*(9.8+(2*500-80*9.8)/80)-500
  sol: |
    System: man plus chair (80 kg). The rope pulls up on the chair with $T = 500$ N and on the man's hands with $T = 500$ N. So $2T - (70+10)g = 80a$: $1000 - 784 = 80a$, $a = 2.7$ m s$^{-2}$ upward.

    Free-body diagram of the man alone: rope force $T = 500$ N up on his hands, normal force $N$ up from the chair, weight $mg$ down. $T + N - mg = ma$ gives $N = 70(9.8 + 2.7) - 500 = 875 - 500 = 375$ N. (Third law: the man pushes down on the chair with 375 N.)
  check: code
