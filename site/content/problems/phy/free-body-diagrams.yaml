# Free-body diagrams (isolating a body and listing every force on it). NCERT questions copied word for word from NCERT Science Grade 8 (Curiosity, reprint 2026-27) Ch 5, and NCERT Physics Class XI (reprint 2026-27) Ch 4. Grade 8 has no answer key, so those solutions are ours. Found, board and main problems are original.

- id: ncert8-it-5-1
  lvl: ncert-intext
  num: "VIII 5 · Probe"
  source: NCERT Grade 8 Science · Ch 5 · Probe and ponder 1
  kind: text
  q: |-
    Why does it feel harder to pedal a bicycle going uphill than on flat ground?
  sol: |
    Draw the forces on the cycle and rider. On flat ground the weight is balanced by the road's normal force, and you push only against friction and air drag. On a slope of angle $\theta$ the weight $mg$ has a component $mg\sin\theta$ pointing down the slope. This extra backward force acts on top of friction and drag, so to keep going at the same speed the forward force from the road (friction on the driving wheel, which you create by pedalling) must be larger. The steeper the slope, the larger $\sin\theta$ and the harder it is.
  check: none

- id: ncert8-ex-5-4
  lvl: ncert-ex
  num: "VIII 5 · Q4"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q4
  kind: text
  q: |-
    When you drop a coin in a glass of water, it sinks, but when you place a bigger wooden block in water, it floats. Explain.
  sol: |
    Two forces act on each object: its weight downward and the upthrust (buoyant force) of the water upward. The upthrust equals the weight of the water displaced. The coin is made of a material denser than water, so even when it is completely under water, the upthrust is less than its weight: the net force is downward and it sinks. The wooden block is less dense than water, so it only needs to sink partly to displace water equal to its own weight; there the upthrust equals the weight and the block floats. What matters is the material (density), not the size.
  check: none

- id: ncert8-ex-5-5
  lvl: ncert-ex
  num: "VIII 5 · Q5"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q5
  kind: text
  q: |-
    If a ball is thrown upwards, it slows down, stops momentarily, and then falls back to the ground. Name the forces acting on the ball and specify their directions.
    (i) During its upward motion
    (ii) During its downward motion
    (iii) At its topmost position
  sol: |
    After the ball leaves the hand only two forces can act on it:

    (i) Upward motion: the gravitational force (weight), vertically downward, and a small air resistance (friction with the air), which opposes the motion and so acts downward as well. The hand's push is gone once the ball is released.

    (ii) Downward motion: the weight, downward, and the air resistance, now upward (opposite to the motion), which is small.

    (iii) At the top: the weight, downward. The air resistance is zero at that instant (the ball is momentarily at rest). The ball is at rest only for an instant; the net force is still its weight, which is why it starts falling.

    If air resistance is neglected, the only force in all three cases is the weight, downward.
  check: none

- id: ncert8-ex-5-10
  lvl: ncert-ex
  num: "VIII 5 · Q10"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q10
  kind: mcq
  q: |-
    Three objects 1, 2, and 3 of the same size and shape but made of different materials are placed in the water. They dip to different depths as shown in Fig. 5.17. If the weights of the three objects 1, 2, and 3 are $w_1$, $w_2$, and $w_3$, respectively, then
  opts: ["w1 = w2 = w3", "w1 > w2 > w3", "w2 > w3 > w1", "w3 > w1 > w2"]
  ans: 1
  sol: |
    From the figure (checked on the rendered page): object 1 is immersed deepest, object 2 less, object 3 the least.

    Each object floats at rest, so its weight equals the upthrust, which equals the weight of the water displaced. The objects have the same size and shape, so the volume displaced is proportional to the depth of immersion. The deepest one displaces the most water and therefore weighs the most: $w_1 > w_2 > w_3$, option (ii).
  check: none

- id: ncert11-eg-4-6
  lvl: ncert-intext
  num: "XI Ex 4.6"
  source: NCERT XI Physics · Ch 4 · Example 4.6
  kind: num
  q: |-
    See Fig. 4.8. A mass of 6 kg is suspended by a rope of length 2 m from the ceiling. A force of 50 N in the horizontal direction is applied at the mid-point P of the rope, as shown. What is the angle the rope makes with the vertical in equilibrium ? (Take $g$ = 10 m s$^{-2}$). Neglect the mass of the rope.
  ask: Angle of the upper rope with the vertical
  unit: °
  ans: 40
  tol: 0.5
  verify: deg(atan(5/6))
  sol: |
    Free-body diagram of the weight W: tension $T_2$ (the lower half of the rope) upward and $mg = 60$ N downward. In equilibrium $T_2 = 6 \times 10 = 60$ N.

    Free-body diagram of the point P: three forces, $T_1$ along the upper half of the rope at angle $\theta$ to the vertical, $T_2 = 60$ N pulling down, and the 50 N horizontal force. The horizontal and vertical components must vanish separately:
    $T_1\cos\theta = T_2 = 60$ N and $T_1\sin\theta = 50$ N.

    Dividing, $\tan\theta = 5/6$, so $\theta = \tan^{-1}(5/6) = 39.8^\circ \approx 40^\circ$. Also $T_1 = \sqrt{60^2 + 50^2} = 78$ N. The answer does not depend on the length of the rope (taken massless) or on where along it the horizontal force is applied.
  answer_key: θ = tan⁻¹(5/6) = 40° (worked answer of Example 4.6).
  check: both

- id: ncert11-eg-4-12
  lvl: ncert-intext
  num: "XI Ex 4.12"
  source: NCERT XI Physics · Ch 4 · Example 4.12
  kind: num
  q: |-
    See Fig. 4.15. A wooden block of mass 2 kg rests on a soft horizontal floor. When an iron cylinder of mass 25 kg is placed on top of the block, the floor yields steadily and the block and the cylinder together go down with an acceleration of 0.1 m s$^{-2}$. What is the action of the block on the floor (a) before and (b) after the floor yields ? Take $g$ = 10 m s$^{-2}$. Identify the action-reaction pairs in the problem.
  ask: Force of the block and cylinder on the floor in case (b)
  unit: N
  ans: 267.3
  tol: 0.1
  verify: 27*10-27*0.1
  sol: |
    (a) The block alone is at rest. Free-body diagram: its weight $2 \times 10 = 20$ N downward and the normal force $R$ of the floor upward. By the first law $R = 20$ N. By the third law the block pushes down on the floor with 20 N.

    (b) Take block plus cylinder as the system (mass 27 kg). The free-body diagram shows only external forces: the weight $270$ N downward and the normal force $R'$ from the floor upward. The forces between block and cylinder are internal and do not appear. Taking downward as positive, $270 - R' = 27 \times 0.1$, so $R' = 267.3$ N. By the third law the system pushes down on the floor with 267.3 N.

    Action-reaction pairs. For (a): (i) force of gravity on the block by the Earth (20 N) and the force of gravity on the Earth by the block (20 N, upward); (ii) the force on the floor by the block and the force on the block by the floor. For (b): (i) the force of gravity on the system by the Earth (270 N) and on the Earth by the system; (ii) the force on the floor by the system and on the system by the floor; (iii) the force on the block by the cylinder and on the cylinder by the block.

    The weight and the normal force on the same body are not an action-reaction pair. They happen to be equal in (a) because the body is at rest, but not in (b): the weight is 270 N while the normal force is 267.3 N.
  answer_key: (a) R = 20 N; the action of the block on the floor is 20 N directed vertically downwards. (b) R′ = 267.3 N; the action of the system on the floor is 267.3 N vertically downward (worked answer of Example 4.12).
  check: both

- id: ncert11-ex-4-13
  lvl: ncert-ex
  num: "XI 4.13"
  source: NCERT XI Physics · Ch 4 · Exercise 4.13
  kind: num
  q: |-
    A man of mass 70 kg stands on a weighing scale in a lift which is moving
    (a) upwards with a uniform speed of 10 m s$^{-1}$,
    (b) downwards with a uniform acceleration of 5 m s$^{-2}$,
    (c) upwards with a uniform acceleration of 5 m s$^{-2}$.
    What would be the readings on the scale in each case?
    (d) What would be the reading if the lift mechanism failed and it hurtled down freely under gravity ?
  ask: Scale reading in case (c)
  unit: kg
  ans: 105
  tol: 0.5
  verify: 70*(10+5)/10
  sol: |
    The scale reads the force the man exerts on it, which by the third law equals the normal force $N$ on the man by the scale. Take $g = 10$ m s$^{-2}$ (as the exercise says), and quote the reading as mass $= N/g$, as the book's key does.

    (a) Uniform speed: $a = 0$, so $N = mg = 700$ N. Reading 70 kg.

    (b) Accelerating downward at 5 m s$^{-2}$: $mg - N = ma$, so $N = 70(10 - 5) = 350$ N. Reading 35 kg.

    (c) Accelerating upward at 5 m s$^{-2}$: $N - mg = ma$, so $N = 70(10 + 5) = 1050$ N. Reading 105 kg.

    (d) Free fall: $a = g$, so $N = m(g - g) = 0$. The scale reads zero.
  answer_key: (a) N = 70 × 10 = 700 N; Reading is 70 kg. (b) 70 × 10 − N = 70 × 5; Reading is 35 kg. (c) N − 70 × 10 = 70 × 5; Reading is 105 kg. (d) 70 × 10 − N = 70 × 10; Reading would be zero; the scale would read zero.
  check: both


- id: ncert8-it-5-3
  lvl: ncert-intext
  num: "VIII 5 · Probe"
  source: NCERT Grade 8 Science · Ch 5 · Probe and ponder 3
  kind: text
  q: |-
    Why do we feel 'light' or like we are 'floating' just after our swing reaches its highest point and begins to come down?
  sol: |
    Draw the forces on the rider: the weight $mg$ downward and the pull (support) of the seat and ropes. At the highest point the swing is momentarily at rest and the ropes make an angle $\theta$ with the vertical. Along the rope there is no need for any centripetal force (the speed is zero), so the rope pull is only $mg\cos\theta$, which is less than $mg$. The seat therefore pushes up on you with less force than your weight, and you accelerate downward along the arc. The 'weight' you feel is the push of the seat on you, so you feel light. Near the bottom of the swing the rope has to supply the weight plus the centripetal force, and you feel heavy.
  check: none


- id: ncert11-ex-4-15
  lvl: ncert-ex
  num: "XI 4.15"
  source: NCERT XI Physics · Ch 4 · Exercise 4.15
  kind: num
  q: |-
    Two bodies of masses 10 kg and 20 kg respectively kept on a smooth, horizontal surface are tied to the ends of a light string. A horizontal force $F$ = 600 N is applied to (i) A, (ii) B along the direction of string. What is the tension in the string in each case?
  ask: Tension when F is applied to A (the 10 kg body), case (i)
  unit: N
  ans: 400
  tol: 2
  verify: 600*20/(10+20)
  sol: |
    [Inference] The figure is not reproduced in the text: A is taken as the 10 kg body and B as the 20 kg body, following the order "10 kg and 20 kg respectively".

    The string is light and the surface smooth, so both bodies move together with $a = F/(m_A+m_B) = 600/30 = 20$ m s$^{-2}$ in both cases. Draw a free-body diagram of the body that is not pulled; the only horizontal force on it is the tension $T$.

    (i) $F$ applied to A (10 kg): $T = m_B a = 20 \times 20 = 400$ N.

    (ii) $F$ applied to B (20 kg): $T = m_A a = 10 \times 20 = 200$ N.

    Check with the pulled body in (i): $F - T = m_A a$, so $600 - 400 = 200 = 10 \times 20$.

    [Note] The printed answer key states the two cases as "20 kg mass pulled: T = 200 N; 10 kg mass pulled: T = 400 N", which agrees with the above.
  answer_key: "If the 20 kg mass is pulled, 600 - T = 20a, T = 10a; a = 20 m s-2, T = 200 N. If the 10 kg mass is pulled, a = 20 m s-2, T = 400 N."
  check: both

- id: ncert11-ex-4-16
  lvl: ncert-ex
  num: "XI 4.16"
  source: NCERT XI Physics · Ch 4 · Exercise 4.16
  kind: num
  q: |-
    Two masses 8 kg and 12 kg are connected at the two ends of a light inextensible string that goes over a frictionless pulley. Find the acceleration of the masses, and the tension in the string when the masses are released.
  ask: Acceleration of the masses
  unit: m s⁻²
  ans: 2
  tol: 0.01
  verify: (12-8)*10/(12+8)
  sol: |
    Take $g = 10$ m s$^{-2}$ as the exercise instructs. The string is light and inextensible and the pulley is frictionless, so the tension $T$ is the same on both sides and both masses have the same acceleration $a$, the heavier mass going down.

    Free-body diagram of the 8 kg mass (moving up): $T - 8g = 8a$.
    Free-body diagram of the 12 kg mass (moving down): $12g - T = 12a$.

    Adding, $4g = 20a$, so $a = 2$ m s$^{-2}$. Then $T = 8(g + a) = 8 \times 12 = 96$ N.
  answer_key: "T - 8 x 10 = 8a, 12 x 10 - T = 12a, i.e. a = 2 m s-2, T = 96 N"
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: |-
    How many forces act on a book that lies at rest on a horizontal table (ignore air)? Which are they? (Original problem.)
  opts: ["One: its weight.", "Two: its weight and the normal force of the table.", "Three: its weight, the normal force and its inertia.", "Two: its weight and the force of the book on the table."]
  ans: 1
  sol: |
    Only forces on the book count in its free-body diagram: its weight (Earth on book) and the normal force (table on book). They are equal and opposite because the book is at rest. "Inertia" is not a force, and the force of the book on the table acts on the table, not on the book.
  check: none

