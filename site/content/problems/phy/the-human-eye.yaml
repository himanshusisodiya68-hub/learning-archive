- id: b1
  lvl: board
  kind: num
  q: A person's near point is 50 cm. What lens power lets him read a book held at 25 cm?
  ask: Power, with sign
  unit: D
  ans: 2
  tol: 0.01
  verify: 1/(-0.5)-1/(-0.25)
  sol: $P = \frac1v - \frac1u = -\frac{1}{0.50} + \frac{1}{0.25} = -2 + 4 = +2$ D.
  check: code

- id: b2
  lvl: board
  kind: mcq
  q: An elderly person cannot see far objects clearly and also cannot read without glasses. What lenses help?
  opts: ["Concave lenses", "Convex lenses", "Bifocal lenses"]
  ans: 2
  sol: |
    Bifocals: the upper part is concave for distance (myopia) and the lower part convex for reading (presbyopia).
  check: none

- id: m1
  lvl: main
  kind: num
  q: A person wears glasses of power −2.5 D and sees distant objects clearly. Where is her far point without glasses?
  ask: Far point
  unit: cm
  ans: 40
  tol: 0.1
  verify: 100/2.5
  sol: $f = 1/P = -0.40$ m, and this equals minus the far point distance, so the far point is 40 cm.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A hypermetropic person reads comfortably at 25 cm with glasses of power +2.0 D. Where is his near point without glasses?
  ask: Near point
  unit: cm
  ans: 50
  tol: 0.1
  verify: -100/(2+1/(-0.25))
  sol: |
    The lens images an object at $u = -0.25$ m at his near point: $\frac1v = P + \frac1u = 2 - 4 = -2$, so $v = -0.50$ m. His near point is 50 cm.
  check: code

- id: m3
  lvl: main
  kind: num
  q: Model the eye as a single thin lens 2.0 cm in front of the retina. By how many dioptres must its power increase to switch from focusing on a very distant object to an object at 25 cm?
  ask: Increase in power
  unit: D
  ans: 4
  tol: 0.01
  verify: (1/0.02+1/0.25)-1/0.02
  sol: |
    Distant object: $P = 1/0.02 = 50$ D. Object at 25 cm: $P = \frac{1}{0.02} + \frac{1}{0.25} = 54$ D. The increase is 4 D, the amplitude of accommodation.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: Estimate the diffraction-limited angular resolution of an eye with a 3.0 mm pupil, for light of wavelength 550 nm, in minutes of arc.
  ask: Resolution
  unit: arcmin
  ans: 0.77
  tol: 0.02
  verify: 1.22*550e-9/3e-3*180/PI*60
  sol: $\theta = 1.22\lambda/D = 1.22 \times 5.5 \times 10^{-7}/3.0 \times 10^{-3} = 2.24 \times 10^{-4}$ rad $\approx 0.77$ arcmin.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: Taking the eye's resolution as 1 minute of arc, how far away can you just tell apart two car headlights 1.5 m apart?
  ask: Distance
  unit: km
  ans: 5.16
  tol: 0.05
  verify: 1.5/(PI/180/60)/1000
  sol: $1' = 2.91 \times 10^{-4}$ rad, so $d = 1.5/2.91 \times 10^{-4} \approx 5.2$ km.
