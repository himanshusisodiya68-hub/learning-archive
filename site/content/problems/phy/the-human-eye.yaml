- id: o1
  lvl: oly
  kind: num
  q: A myopic person's far point is 50 cm from the eye. What power of spectacle lens is needed if the spectacles are worn 2.0 cm in front of the eye?
  ask: Power, with sign
  unit: D
  ans: -2.08
  tol: 0.01
  verify: -1/0.48
  hints: ["The spectacle lens must image infinity at the far point, which is 48 cm from the lens."]
  sol: The far point is $50 - 2 = 48$ cm from the spectacle lens, so $f = -0.48$ m and $P = -2.08$ D. A contact lens on the eye would need only −2.00 D.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: "The cornea is a curved surface of radius 7.8 mm and refractive index 1.376. Using P = (n₂ − n₁)/R for a single surface, by how many dioptres does the cornea's power fall when the eye goes from air (n = 1.00) to water (n = 1.33)?"
  ask: Loss of power
  unit: D
  ans: 42.3
  tol: 0.3
  verify: (1.376-1)/0.0078-(1.376-1.33)/0.0078
  sol: In air $P = 0.376/0.0078 = 48.2$ D; in water $P = 0.046/0.0078 = 5.9$ D. The loss is about 42.3 D, far more than the lens can make up, so underwater vision is badly blurred without goggles.
  check: code
