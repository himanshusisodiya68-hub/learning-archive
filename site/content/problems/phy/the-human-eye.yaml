- id: ncert-ex10-5
  lvl: ncert-ex
  num: 5
  source: NCERT X Science · Ch 10 · Exercise 5 · p. 170
  kind: num
  q: A person needs a lens of power –5.5 dioptres for correcting his distant vision. For correcting his near vision he needs a lens of power +1.5 dioptre. What is the focal length of the lens required for correcting (i) distant vision, and (ii) near vision?
  ask: Focal length for distant vision, with sign
  unit: m
  ans: -0.18
  tol: 0.005
  verify: 1/(-5.5)
  sol: $f = 1/P$. (i) $f = 1/(-5.5) = -0.18$ m (concave lens). (ii) $f = 1/1.5 = +0.67$ m (convex lens).
  answer_key: (i) –0.18 m; (ii) +0.67 m
  check: both

- id: ncert-ex10-6
  lvl: ncert-ex
  num: 6
  source: NCERT X Science · Ch 10 · Exercise 6 · p. 170
  kind: num
  q: The far point of a myopic person is 80 cm in front of the eye. What is the nature and power of the lens required to correct the problem?
  ask: Power, with sign
  unit: D
  ans: -1.25
  tol: 0.01
  verify: -1/0.8
  sol: The lens must image infinity at the far point, so $f = -0.80$ m and $P = 1/f = -1.25$ D. It is a concave lens.
  answer_key: Concave lens; –1.25 D
  check: both

- id: ncert-ex10-7
  lvl: ncert-ex
  num: 7
  source: NCERT X Science · Ch 10 · Exercise 7 · p. 170
  kind: num
  q: Make a diagram to show how hypermetropia is corrected. The near point of a hypermetropic eye is 1 m. What is the power of the lens required to correct this defect? Assume that the near point of the normal eye is 25 cm.
  ask: Power, with sign
  unit: D
  ans: 3
  tol: 0.01
  verify: 1/(-1)-1/(-0.25)
  hints: ["The lens must form a virtual image at 1 m of an object held at 25 cm: u = −0.25 m, v = −1 m."]
  sol: |
    $P = \frac1v - \frac1u = \frac{1}{-1} - \frac{1}{-0.25} = -1 + 4 = +3.0$ D, a convex lens.
    Diagram: without the lens, light from a book at 25 cm focuses behind the retina. A convex lens in front of the eye bends the rays so they appear to come from the near point, 1 m away, and the eye then focuses them on the retina.
  answer_key: Convex lens; +3.0 D
  check: both

- id: ncert-ex10-8
  lvl: ncert-ex
  num: 8
  source: NCERT X Science · Ch 10 · Exercise 8 · p. 170
  kind: text
  q: Why is a normal eye not able to see clearly the objects placed closer than 25 cm?
  sol: To focus a nearer object, the eye lens would have to become more curved than it can. At about 25 cm the ciliary muscles have already made the lens as thick as possible, so for closer objects the image forms behind the retina and looks blurred.
  check: none

- id: ncert-ex10-9
  lvl: ncert-ex
  num: 9
  source: NCERT X Science · Ch 10 · Exercise 9 · p. 170
  kind: text
  q: What happens to the image distance in the eye when we increase the distance of an object from the eye?
  sol: Nothing; it stays the same. The image must always fall on the retina, about 2 cm behind the lens. The eye keeps the image distance fixed by changing the focal length of its lens (accommodation).
  check: none

