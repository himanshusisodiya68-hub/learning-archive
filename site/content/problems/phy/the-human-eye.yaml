# The human eye. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 10.

- id: ncert-it164-1
  lvl: ncert-intext
  num: "p164 Q1"
  source: NCERT X Science · Ch 10 · In-text questions · p. 164 · Q1
  kind: text
  q: What is meant by power of accommodation of the eye?
  sol: It is the ability of the eye lens to adjust its focal length, by the action of the ciliary muscles, so that objects at different distances, from the near point (about 25 cm) to the far point (infinity), are focused sharply on the retina.
  check: none

- id: ncert-it164-2
  lvl: ncert-intext
  num: "p164 Q2"
  source: NCERT X Science · Ch 10 · In-text questions · p. 164 · Q2
  kind: text
  q: A person with a myopic eye cannot see objects beyond 1.2 m distinctly. What should be the type of the corrective lens used to restore proper vision?
  sol: A **concave (diverging) lens**. It must image distant objects at the far point, 1.2 m, so $f = -1.2$ m and $P = -1/1.2 \approx -0.83$ D.
  check: none

- id: ncert-it164-3
  lvl: ncert-intext
  num: "p164 Q3"
  source: NCERT X Science · Ch 10 · In-text questions · p. 164 · Q3
  kind: text
  q: What is the far point and near point of the human eye with normal vision?
  sol: Far point — infinity. Near point — about 25 cm from the eye.
  check: none

- id: ncert-it164-4
  lvl: ncert-intext
  num: "p164 Q4"
  source: NCERT X Science · Ch 10 · In-text questions · p. 164 · Q4
  kind: text
  q: A student has difficulty reading the blackboard while sitting in the last row. What could be the defect the child is suffering from? How can it be corrected?
  sol: The child cannot see distant objects clearly, so they have **myopia (near-sightedness)**. It is corrected with spectacles having a **concave lens** of suitable power.
  check: none

