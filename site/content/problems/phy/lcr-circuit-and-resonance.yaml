  q: At resonance in a series LCR circuit the impedance is
  opts: ["maximum", "equal to R", "equal to X_L + X_C", "zero"]
  ans: 1
  sol: At resonance $X_L = X_C$, so $Z = \sqrt{R^2 + 0} = R$, the minimum, and the current is maximum.
