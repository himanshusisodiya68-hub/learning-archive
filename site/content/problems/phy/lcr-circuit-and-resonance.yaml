- id: b1
  lvl: board
  kind: num
  q: A series circuit has R = 30 Ω and an inductive reactance of 40 Ω and no capacitor. Find the power factor. (Original problem.)
  ask: Power factor
  unit: ""
  ans: 0.6
  tol: 0.001
  verify: 30/Math.sqrt(30**2+40**2)
  sol: $Z = \sqrt{30^2 + 40^2} = 50\ \Omega$ and $\cos\phi = R/Z = 30/50 = 0.6$.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A series LCR circuit has L = 0.1 H, R = 10 Ω and resonates at ω₀ = 1000 rad/s. Find the quality factor Q = ω₀L/R. (Original problem.)
  ask: Q
  unit: ""
  ans: 10
  tol: 0.001
  verify: 1000*0.1/10
  sol: $Q = \omega_0L/R = 1000\times0.1/10 = 10$. At resonance the voltage across the inductor or the capacitor is $Q$ times the source voltage.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A series circuit has R = 100 Ω, L = 0.5 H, C = 20 µF and is connected to a 220 V, 50 Hz supply. Find the rms current. (Original problem.)
  ask: rms current
  unit: A
  ans: 2.2
  tol: 0.005
  verify: 220/Math.sqrt(100**2+(2*Math.PI*50*0.5-1/(2*Math.PI*50*20e-6))**2)
  sol: $X_L = 2\pi\times50\times0.5 = 157.1\ \Omega$, $X_C = 1/(2\pi\times50\times20\times10^{-6}) = 159.2\ \Omega$. $Z = \sqrt{100^2 + (157.1 - 159.2)^2} = 100.02\ \Omega$, so $I = 220/100.02 = 2.2$ A. The circuit is very close to resonance at 50 Hz.
  check: code

- id: m2
  lvl: main
  kind: num
  q: In a series LCR circuit with R = 10 Ω and L = 0.1 H, find the width (in rad/s) of the resonance curve between the half-power points, Δω = R/L. (Original problem.)
  ask: Half-power bandwidth
  unit: rad/s
  ans: 100
  tol: 0.01
  verify: 10/0.1
  sol: The half-power points are at $\omega_{1,2}$ where $|X_L - X_C| = R$. For a sharp resonance their separation is $\Delta\omega = R/L = 10/0.1 = 100$ rad/s. Smaller $R$ means a sharper peak (larger $Q = \omega_0/\Delta\omega$).
  check: code
