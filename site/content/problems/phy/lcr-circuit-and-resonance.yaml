# The series LCR circuit, resonance, power and power factor. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 7, §7.6–7.7 and Exercises 7.6–7.8. The printed text writes Ω as "W" and µF as "mF" in places; Ω and µF are used here. Found, board and main problems are original.

- id: ncert12-eg-7-6
  lvl: ncert-intext
  num: "XII Ex 7.6"
  source: NCERT XII Physics · Ch 7 · Example 7.6
  kind: num
  q: A resistor of 200 Ω and a capacitor of 15.0 µF are connected in series to a 220 V, 50 Hz ac source. (a) Calculate the current in the circuit; (b) Calculate the voltage (rms) across the resistor and the capacitor. Is the algebraic sum of these voltages more than the source voltage? If yes, resolve the paradox.
  ask: Current in the circuit
  unit: A
  ans: 0.755
  tol: 0.002
  verify: 220/Math.sqrt(200**2+(1/(2*Math.PI*50*15.0e-6))**2)
  sol: |
    $X_C = 1/(2\pi\nu C) = 212.3\ \Omega$ and $R = 200\ \Omega$.

    (a) $Z = \sqrt{R^2 + X_C^2} = \sqrt{200^2 + 212.3^2} = 291.7\ \Omega$ and $I = V/Z = 220/291.7 = 0.754$ A, which the book rounds to 0.755 A.

    (b) $V_R = IR = 0.755\times200 = 151$ V and $V_C = IX_C = 0.755\times212.3 = 160.3$ V. Their algebraic sum is 311.3 V, more than the 220 V of the source. **Resolution:** $V_R$ and $V_C$ are not in phase: $V_R$ is in phase with the current and $V_C$ lags it by $90^\circ$, so they must be added like perpendicular vectors, $\sqrt{V_R^2 + V_C^2} = \sqrt{151^2 + 160.3^2} \approx 220$ V, which equals the source voltage.

    [Note] The printed solution writes $Z = 291.67\ \Omega$ in one line and $291.5\ \Omega$ in the next; the correct value is 291.7 Ω, and the small difference explains the book's 0.755 A (exact: 0.754 A).
  check: code

- id: ncert12-eg-7-7
  lvl: ncert-intext
  num: "XII Ex 7.7"
  source: NCERT XII Physics · Ch 7 · Example 7.7
  kind: text
  q: |-
    (a) For circuits used for transporting electric power, a low power factor implies large power loss in transmission. Explain.
    (b) Power factor can often be improved by the use of a capacitor of appropriate capacitance in the circuit. Explain.
  sol: |
    (a) $P = IV\cos\phi$, where $\cos\phi$ is the power factor. To supply a given power at a given voltage, a small $\cos\phi$ needs a correspondingly larger current. The power lost in the transmission line is $I^2R$, so a larger current means a much larger loss.

    (b) Suppose the current lags the voltage by $\phi$. Resolve $I$ into a component $I_p$ in phase with $V$ (the power component) and $I_q$ perpendicular to $V$ (the wattless component: it carries no net power). To improve the power factor we must cancel the lagging $I_q$ by an equal **leading** wattless current $I_q'$. A capacitor of suitable value connected in parallel provides a leading current, so that $I_q$ and $I_q'$ cancel and the power is effectively $I_pV$, with power factor $\to1$.
  check: none

- id: ncert12-eg-7-8
  lvl: ncert-intext
  num: "XII Ex 7.8"
  source: NCERT XII Physics · Ch 7 · Example 7.8
  kind: num
  q: A sinusoidal voltage of peak value 283 V and frequency 50 Hz is applied to a series LCR circuit in which R = 3 Ω, L = 25.48 mH, and C = 796 µF. Find (a) the impedance of the circuit; (b) the phase difference between the voltage across the source and the current; (c) the power dissipated in the circuit; and (d) the power factor.
  ask: Power dissipated, part (c)
  unit: W
  ans: 4800
  tol: 10
  verify: (283/Math.SQRT2/Math.sqrt(3**2+(2*Math.PI*50*25.48e-3-1/(2*Math.PI*50*796e-6))**2))**2*3
  sol: |
    $X_L = 2\pi\nu L = 8\ \Omega$ and $X_C = 1/(2\pi\nu C) = 4\ \Omega$.

    (a) $Z = \sqrt{R^2 + (X_L - X_C)^2} = \sqrt{3^2 + 4^2} = 5\ \Omega$.

    (b) $\phi = \tan^{-1}\dfrac{X_C - X_L}{R} = \tan^{-1}\left(\dfrac{4 - 8}{3}\right) = -53.1^\circ$. The negative sign means the current **lags** the source voltage (the circuit is inductive).

    (c) $I_{rms} = \dfrac{i_m}{\sqrt2} = \dfrac{1}{\sqrt2}\dfrac{283}{5} = 40$ A, so $P = I^2R = (40)^2\times3 = 4800$ W.

    (d) Power factor $= \cos\phi = \cos(-53.1^\circ) = 0.6$.
  check: code

- id: ncert12-eg-7-9
  lvl: ncert-intext
  num: "XII Ex 7.9"
  source: NCERT XII Physics · Ch 7 · Example 7.9
  kind: num
  q: Suppose the frequency of the source in the previous example can be varied. (a) What is the frequency of the source at which resonance occurs? (b) Calculate the impedance, the current, and the power dissipated at the resonant condition.
  ask: Resonant frequency, part (a)
  unit: Hz
  ans: 35.34
  tol: 0.05
  verify: 1/(2*Math.PI*Math.sqrt(25.48e-3*796e-6))
  sol: |
    (a) $\omega_0 = \dfrac{1}{\sqrt{LC}} = \dfrac{1}{\sqrt{25.48\times10^{-3}\times796\times10^{-6}}} = 222.1$ rad/s, so $\nu_r = \dfrac{\omega_0}{2\pi} = 35.3$ Hz.

    (b) At resonance $X_L = X_C$, so $Z = R = 3\ \Omega$. The rms current is $I = V/Z = \dfrac{283}{\sqrt2}\cdot\dfrac13 = 66.7$ A, and the power is $P = I^2R = (66.7)^2\times3 = 13.35$ kW, much more than in Example 7.8.

    [Note] The printed solution gives $\omega_0 = 222.1$ rad/s and then divides "221.1" by $2\pi$ to get 35.4 Hz. The correct arithmetic ($222.1/2\pi$) gives 35.3 Hz; the book's 35.4 Hz looks like a typographical slip. [Inference]
  check: code

- id: ncert12-eg-7-10
  lvl: ncert-intext
  num: "XII Ex 7.10"
  source: NCERT XII Physics · Ch 7 · Example 7.10
  kind: text
  q: At an airport, a person is made to walk through the doorway of a metal detector, for security reasons. If she/he is carrying anything made of metal, the metal detector emits a sound. On what principle does this detector work?
  sol: |
    It works on the principle of **resonance in ac circuits**. The doorway contains a coil of many turns, connected to a capacitor so that the circuit is tuned to resonance. When a person carrying metal walks through, the inductance of the coil, and so the impedance of the circuit, changes. The current in the circuit therefore changes significantly, and the electronic circuitry detects this change and sounds an alarm.
  check: none

- id: ncert12-ex-7-6
