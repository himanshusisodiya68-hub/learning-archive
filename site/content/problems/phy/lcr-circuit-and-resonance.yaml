- id: ncert12-ex-7-7
  lvl: ncert-ex
  num: "XII 7.7"
  source: NCERT XII Physics · Ch 7 · Exercise 7.7
  kind: num
  q: A series LCR circuit with R = 20 Ω, L = 1.5 H and C = 35 µF is connected to a variable-frequency 200 V ac supply. When the frequency of the supply equals the natural frequency of the circuit, what is the average power transferred to the circuit in one complete cycle?
  ask: Average power
  unit: W
  ans: 2000
  tol: 0.5
  verify: 200**2/20
  sol: |
    At the natural frequency $\omega_0 = 1/\sqrt{LC}$ the circuit is at resonance: $X_L = X_C$, $Z = R$ and the current is $V/R$. Taking the 200 V as the rms value, $P = I^2R = V^2/R = (200)^2/20 = 2000$ W.
  answer_key: 2,000 W
  check: both

- id: ncert12-ex-7-8
  lvl: ncert-ex
  num: "XII 7.8"
  source: NCERT XII Physics · Ch 7 · Exercise 7.8
  kind: num
  q: |-
    Figure 7.17 shows a series LCR circuit connected to a variable frequency 230 V source. L = 5.0 H, C = 80 µF, R = 40 Ω.
    (a) Determine the source frequency which drives the circuit in resonance.
    (b) Obtain the impedance of the circuit and the amplitude of current at the resonating frequency.
    (c) Determine the rms potential drops across the three elements of the circuit. Show that the potential drop across the LC combination is zero at the resonating frequency.
  ask: Amplitude of the current at resonance, part (b)
  unit: A
  ans: 8.13
  tol: 0.02
  verify: 230*Math.SQRT2/40
  sol: |
    (a) $\omega_0 = \dfrac{1}{\sqrt{LC}} = \dfrac{1}{\sqrt{5.0\times80\times10^{-6}}} = 50$ rad/s, i.e. a frequency $\nu_0 = \omega_0/2\pi = 7.96$ Hz.

    (b) At resonance $Z = R = 40\ \Omega$. The rms current is $230/40 = 5.75$ A, so the amplitude is $I_0 = \sqrt2\times5.75 = 8.13$ A.

    (c) $V_{R} = I_{rms}R = 230$ V. $V_L = I_{rms}\omega_0L = 5.75\times50\times5.0 = 1437.5$ V and $V_C = I_{rms}/(\omega_0C) = 5.75/(50\times80\times10^{-6}) = 1437.5$ V. The inductor and capacitor voltages are equal in magnitude and opposite in phase, so $V_{LC} = I_{rms}\left(\omega_0L - \dfrac{1}{\omega_0C}\right) = 0$ at resonance.

    **Note on the answer key.** The question asks for the source *frequency*, but the key gives only the angular frequency, 50 rad s⁻¹ (i.e. $\nu_0 = 7.96$ Hz). The values in (b) and (c) agree with the key.
  answer_key: "(a) 50 rad s⁻¹ (b) 40 Ω, 8.1 A (c) V_Lrms = 1437.5 V, V_Crms = 1437.5 V, V_Rrms = 230 V; V_LCrms = I_rms(ω₀L − 1/ω₀C) = 0"
  check: both

