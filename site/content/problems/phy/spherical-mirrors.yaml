  q: "In a museum, a woman walks towards a large concave mirror (Fig. 10.26). She will see that:"
  opts: ["her erect image keeps decreasing in size.", "her inverted image keeps decreasing in size.", "her inverted image keeps increasing in size and eventually it becomes erect and magnified.", "her erect image keeps increasing in size."]
