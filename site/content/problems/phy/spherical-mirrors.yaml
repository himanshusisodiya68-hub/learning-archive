  source: NCERT XII Physics · Ch 9 · Example 9.4
  kind: num
  q: Suppose while sitting in a parked car, you notice a jogger approaching towards you in the side view mirror of R = 2 m. If the jogger is running at a speed of 5 m s$^{-1}$, how fast the image of the jogger appear to move when the jogger is (a) 39 m, (b) 29 m, (c) 19 m, and (d) 9 m away.
  ask: Image speed in case (d), m/s
  unit: m/s
  ans: 0.05
  tol: 0.001
  verify: (1/(1+9))**2*5
  hints: ["Side mirror is convex: f = +1 m.", "Image speed = (v/u)² × object speed, and v/u = f/(f − u)."]
  sol: |
    $f = +1$ m and $v = \frac{fu}{u - f}$, so $\frac{dv}{dt} = -\frac{f^2}{(u - f)^2}\frac{du}{dt}$, with speed factor $\left(\frac{1}{|u| + 1}\right)^2$.
    (a) $u = -39$: $5/40^2 = 1/320 \approx 0.0031$ m/s. (b) $5/30^2 = 1/180 \approx 0.0056$ m/s. (c) $5/20^2 = 1/80 = 0.0125$ m/s. (d) $5/10^2 = 0.05$ m/s.
    The jogger runs at a steady 5 m/s, yet the image speeds up as the jogger approaches.
  check: code

- id: ncert12-ex-9-1
  lvl: ncert-ex
  num: "XII 9.1"
  source: NCERT XII Physics · Ch 9 · Exercise 9.1
  kind: num
  q: A small candle, 2.5 cm in size is placed at 27 cm in front of a concave mirror of radius of curvature 36 cm. At what distance from the mirror should a screen be placed in order to obtain a sharp image? Describe the nature and size of the image. If the candle is moved closer to the mirror, how would the screen have to be moved?
  ask: Image distance v, with sign
  unit: cm
  ans: -54
  tol: 0.1
  verify: 1/(1/(-18)-1/(-27))
  sol: |
    $f = -18$ cm, $u = -27$ cm: $\frac1v = -\frac{1}{18} + \frac{1}{27} = -\frac{1}{54}$, so $v = -54$ cm. $m = -v/u = -2$, so the image is 5.0 cm tall, real, inverted and magnified. As the candle moves towards F, the image moves farther away, so the screen must be moved back; once the candle is inside F, the image is virtual and no screen can catch it.
  answer_key: v = –54 cm. The image is real, inverted and magnified. The size of the image is 5.0 cm. As u → f, v → ∞; for u < f, image is virtual.
  check: both

- id: ncert12-ex-9-2
  lvl: ncert-ex
  num: "XII 9.2"
  source: NCERT XII Physics · Ch 9 · Exercise 9.2
  kind: num
  q: A 4.5 cm needle is placed 12 cm away from a convex mirror of focal length 15 cm. Give the location of the image and the magnification. Describe what happens as the needle is moved farther from the mirror.
  ask: Image distance v, with sign
  unit: cm
  ans: 6.7
  tol: 0.05
  verify: 1/(1/15-1/(-12))
  sol: $\frac1v = \frac{1}{15} + \frac{1}{12} = \frac{9}{60}$, so $v = +6.7$ cm behind the mirror. $m = -v/u = 6.7/12 = 5/9$, so the image is 2.5 cm, virtual and erect. As the needle moves away, the image moves towards F (never beyond) and shrinks towards zero.
  answer_key: v = 6.7 cm. Magnification = 5/9, i.e., the size of the image is 2.5 cm. As u → ∞; v → f (but never beyond) while m → 0.
  check: both

- id: ncert12-ex-9-15
  lvl: ncert-ex
  num: "XII 9.15"
  source: NCERT XII Physics · Ch 9 · Exercise 9.15
  kind: proof
  q: |
    Use the mirror equation to deduce that:
    (a) an object placed between f and 2 f of a concave mirror produces a real image beyond 2 f.
    (b) a convex mirror always produces a virtual image independent of the location of the object.
    (c) the virtual image produced by a convex mirror is always diminished in size and is located between the focus and the pole.
    (d) an object placed between the pole and focus of a concave mirror produces a virtual and enlarged image.
  sol: |
    Write $\frac1v = \frac1f - \frac1u$.
    (a) Concave: $f < 0$ and $2f < u < f$. Then $\frac{1}{2f} > \frac1u > \frac1f$ (all negative), so $\frac1v = \frac1f - \frac1u$ lies between $\frac1f - \frac1f = 0$ and $\frac1f - \frac{1}{2f} = \frac{1}{2f}$. So $v < 2f$ (more negative): a real image beyond $2f$.
    (b) Convex: $f > 0$, $u < 0$. Both terms $\frac1f$ and $-\frac1u$ are positive, so $v > 0$: always behind the mirror, virtual.
    (c) From (b), $\frac1v > \frac1f$, so $0 < v < f$: between pole and focus. Using $v = \frac{fu}{u - f}$, $m = -\frac{v}{u} = \frac{f}{f - u} = \frac{f}{f + |u|}$, which lies between 0 and 1: erect and diminished.
    (d) Concave, $f < u < 0$: $\frac1u < \frac1f < 0$, so $\frac1v = \frac1f - \frac1u > 0$: $v > 0$, virtual. $m = \frac{f}{f - u}$ with $f < 0$ and $|u| < |f|$ gives $m = \frac{|f|}{|f| - |u|} > 1$: enlarged.
  answer_key: "Apply mirror equation and the condition: (a) f < 0; u < 0 (b) f > 0; u < 0 (c) f > 0 and u < 0 (d) f < 0; f < u < 0, to deduce the desired result."
  check: none

- id: ncert12-ex-9-29
  lvl: ncert-ex
  num: "XII 9.29"
  source: NCERT XII Physics · Ch 9 · Exercise 9.29
  kind: num
  q: A Cassegrain telescope uses two mirrors as shown in Fig. 9.26. Such a telescope is built with the mirrors 20 mm apart. If the radius of curvature of the large mirror is 220 mm and the small mirror is 140 mm, where will the final image of an object at infinity be?
  ask: Distance of final image from the small mirror
  unit: mm
  ans: 315
  tol: 0.5
  verify: 1/(1/70-1/90)
  hints: ["The large mirror alone would focus the rays 110 mm from it, which is 90 mm beyond the small mirror: a virtual object for it.", "Small convex mirror: f = +70 mm, u = +90 mm (taking the direction of the light reaching it as positive)."]
  sol: |
    Large mirror: $f_1 = 110$ mm, so the rays converge towards a point 110 mm from it, $110 - 20 = 90$ mm beyond the small mirror. For the small convex mirror ($f_2 = +70$ mm), this is a virtual object at $u = +90$ mm:
    $$\frac1v = \frac{1}{70} - \frac{1}{90} = \frac{2}{630} \Rightarrow v = 315 \text{ mm}.$$
    The final image is 315 mm from the small mirror, as NCERT's key states. Note the sign: $v$ comes out positive, the same side as the virtual object, so by the formula the reflected rays diverge from a point behind the small mirror. In a working Cassegrain design the virtual object lies inside the secondary's focal length, which gives a real image behind the primary; compare the Olympiad problem on this page.
  answer_key: Parallel rays focus at 110 mm from the larger mirror; virtual object for the smaller mirror at (110 – 20) = 90 mm; focal length of smaller mirror 70 mm; image formed at 315 mm from the smaller mirror.
  check: both
