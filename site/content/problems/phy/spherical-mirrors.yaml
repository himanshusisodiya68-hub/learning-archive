- id: m3
  lvl: main
  kind: num
  q: A concave mirror of focal length 10 cm and a plane mirror face each other. An object is placed 15 cm from the concave mirror, between the two mirrors. How far from the concave mirror must the plane mirror be so that the images formed by the two mirrors coincide?
  ask: Distance of plane mirror from concave mirror
  unit: cm
  ans: 22.5
  tol: 0.1
  verify: (30+15)/2
  hints: ["Find the concave mirror's image first: it is 30 cm in front of that mirror.", "The plane mirror's image is as far behind it as the object is in front."]
  sol: |
    Concave mirror: $u = -15$, $f = -10$ gives $v = -30$ cm. Let the plane mirror be $d$ from the concave mirror. The object is $d - 15$ from the plane mirror, so its image there lies at $d + (d - 15) = 2d - 15$ from the concave mirror. Setting $2d - 15 = 30$ gives $d = 22.5$ cm.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A small object moves along the axis towards a concave mirror of focal length 10 cm at 2 cm/s. How fast is its image moving when the object is 30 cm from the mirror?
  ask: Image speed
  unit: cm/s
  ans: 0.5
  tol: 0.01
  verify: (15/30)**2*2
  hints: ["Find v first: v = −15 cm.", "Image speed = m² × object speed."]
  sol: |
    $\dfrac1v = -\dfrac{1}{10} + \dfrac{1}{30}$ gives $v = -15$ cm, so $m = -v/u = -0.5$.
    Image speed $= m^2 \times 2 = 0.25 \times 2 = 0.5$ cm/s, moving away from the mirror as the object approaches.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A concave mirror has radius of curvature 40 cm. A ray parallel to the axis strikes it at a height of 12 cm. At what distance from the pole does the reflected ray cross the axis?
  ask: Distance from pole
  unit: cm
  ans: 19.03
  tol: 0.05
  verify: 40-20/sqrt(1-0.09)
  hints: ["sin θ = h/R, where θ is the angle of incidence.", "The crossing point is at R − R/(2 cos θ) from the pole."]
  sol: |
    $\sin\theta = 12/40 = 0.3$, so $\cos\theta = 0.954$. The crossing point is at
    $$R - \frac{R}{2\cos\theta} = 40 - \frac{20}{0.954} = 19.03 \text{ cm},$$
    about 1 mm closer than the paraxial focus at 20 cm. This is spherical aberration.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: An object is 4 cm beyond the focus of a concave mirror of focal length 12 cm. Use Newton's form to find the distance of the image from the mirror.
  ask: Distance of image from mirror
  unit: cm
  ans: 48
  tol: 0.1
  verify: 12+12*12/4
  hints: ["x x′ = f² with distances measured from the focus."]
  sol: $x' = f^2/x = 144/4 = 36$ cm beyond the focus, so the image is $12 + 36 = 48$ cm from the mirror. Check with the mirror formula ($u = -16$, $f = -12$) gives $v = -48$ cm.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: In a Cassegrain telescope, a concave primary mirror of focal length 100 cm faces a distant star. A convex secondary mirror of focal length 25 cm is placed on the axis 80 cm in front of the primary, facing it. Where is the final image of the star?
  ask: Distance of final image behind the primary mirror
  unit: cm
  ans: 20
  tol: 0.1
  verify: -(1/(1/25-1/20))-80
  hints: ["The primary alone would form the image 100 cm from it, which is 20 cm behind the secondary. That point is a virtual object for the secondary.", "For the secondary, take the direction of the light reaching it as positive: u = +20 cm, f = +25 cm."]
  sol: |
    The primary converges the starlight towards a point 100 cm from it, 20 cm beyond the secondary. For the secondary this is a virtual object at $u = +20$ cm. With $f = +25$ cm,
    $$\frac1v = \frac{1}{25} - \frac{1}{20} = -\frac{1}{100} \Rightarrow v = -100 \text{ cm},$$
    a real image 100 cm in front of the secondary, back towards the primary: $100 - 80 = 20$ cm behind the primary, through a hole in its centre. The secondary magnifies by $m = -v/u = 5$, so the telescope behaves like a single mirror of focal length 500 cm packed into an 80 cm tube.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: Prove that every ray parallel to the axis of the parabolic mirror $y^2 = 4ax$ passes through the point $(a, 0)$ after reflection.
  hints: ["The slope of the parabola at (x, y) is 2a/y.", "Alternatively, use Fermat: compare path lengths to the directrix x = −a."]
  sol: |
    Use the focus–directrix property: every point P on the parabola is equally far from the focus S $(a, 0)$ and from the directrix $x = -a$. Take a ray arriving parallel to the axis. Draw a reference line perpendicular to the axis far to the right, at $x = L$. The path from that line to P and then to S has length $(L - x_P) + PS = (L - x_P) + (x_P + a) = L + a$, the same for every point P. Since all such paths take equal time, Fermat's principle says each is a possible light path, and the reflected rays all reach S. (Directly: the tangent at P bisects the angle between PS and the line through P parallel to the axis, which is the law of reflection.)
  check: none
