- id: m1
  lvl: main
  kind: num
  q: Where should an object be placed in front of a concave mirror of focal length 20 cm to obtain a real image twice the size of the object?
  ask: Object distance u, with sign
  unit: cm
  ans: -30
  tol: 0.1
  verify: 1/((1/(-20))*2/3)
  hints: ["Real image means m = −2, so v = 2u.", "Substitute v = 2u in the mirror formula."]
  sol: |
    $m = -v/u = -2 \Rightarrow v = 2u$. Then $\dfrac{1}{2u} + \dfrac1u = \dfrac{3}{2u} = -\dfrac{1}{20}$, so $u = -30$ cm.
  check: code

- id: m2
  lvl: main
  kind: num
  q: Where should the object be placed in front of the same mirror (f = 20 cm) to obtain a virtual image twice the size of the object?
  ask: Object distance u, with sign
  unit: cm
  ans: -10
  tol: 0.1
  verify: -20/2
  hints: ["Virtual image means m = +2, so v = −2u."]
  sol: $m = -v/u = +2 \Rightarrow v = -2u$. Then $-\dfrac{1}{2u} + \dfrac1u = \dfrac{1}{2u} = -\dfrac{1}{20}$, so $u = -10$ cm.
