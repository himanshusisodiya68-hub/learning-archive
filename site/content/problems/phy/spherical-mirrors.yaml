  num: "p142 Q4"
  source: NCERT X Science · Ch 9 · In-text questions · p. 142 · Q4
  kind: text
  q: Why do we prefer a convex mirror as a rear-view mirror in vehicles?
  sol: A convex mirror always forms an erect, diminished image of objects behind the vehicle, so the driver sees traffic the right way up. Because the image is diminished, the mirror shows a much wider field of view than a plane mirror of the same size.
