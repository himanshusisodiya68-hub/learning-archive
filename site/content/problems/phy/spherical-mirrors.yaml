# Spherical mirrors. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 9.

- id: ncert-it142-1
  lvl: ncert-intext
  num: "p142 Q1"
  source: NCERT X Science · Ch 9 · In-text questions · p. 142 · Q1
  kind: text
  q: Define the principal focus of a concave mirror.
  sol: The principal focus of a concave mirror is the point on its principal axis at which rays of light parallel to the principal axis meet after reflection from the mirror.
  check: none

- id: ncert-it142-2
  lvl: ncert-intext
  num: "p142 Q2"
  source: NCERT X Science · Ch 9 · In-text questions · p. 142 · Q2
  kind: num
  q: The radius of curvature of a spherical mirror is 20 cm. What is its focal length?
  ask: Focal length (magnitude)
  unit: cm
  ans: 10
  tol: 0.05
  verify: 20/2
  hints: ["f = R/2."]
  sol: $f = R/2 = 20/2 = 10$ cm. With signs, $f = -10$ cm for a concave mirror and $+10$ cm for a convex mirror.
  check: code

- id: ncert-it142-3
  lvl: ncert-intext
  num: "p142 Q3"
  source: NCERT X Science · Ch 9 · In-text questions · p. 142 · Q3
  kind: text
  q: Name a mirror that can give an erect and enlarged image of an object.
  sol: A **concave mirror**, when the object is placed between its pole and principal focus.
  check: none

- id: ncert-it142-4
  lvl: ncert-intext
  num: "p142 Q4"
  source: NCERT X Science · Ch 9 · In-text questions · p. 142 · Q4
  kind: text
  q: Why do we prefer a convex mirror as a rear-view mirror in vehicles?
  sol: A convex mirror always forms an erect, diminished image of objects behind the vehicle, so the driver sees traffic the right way up. Because the image is diminished, the mirror shows a much wider field of view than a plane mirror of the same size.
  check: none

- id: ncert-it145-1
  lvl: ncert-intext
  num: "p145 Q1"
  source: NCERT X Science · Ch 9 · In-text questions · p. 145 · Q1
  kind: num
  q: Find the focal length of a convex mirror whose radius of curvature is 32 cm.
  ask: Focal length, with sign
  unit: cm
  ans: 16
  tol: 0.05
  verify: 32/2
  hints: ["f = R/2; for a convex mirror the focus is behind the mirror."]
