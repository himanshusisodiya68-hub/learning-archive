  verify: 12+12*12/4
  hints: ["x x′ = f² with distances measured from the focus."]
  sol: $x' = f^2/x = 144/4 = 36$ cm beyond the focus, so the image is $12 + 36 = 48$ cm from the mirror. Check with the mirror formula ($u = -16$, $f = -12$) gives $v = -48$ cm.
