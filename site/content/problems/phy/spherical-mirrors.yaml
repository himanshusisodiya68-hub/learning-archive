- id: ncert-it145-2
  lvl: ncert-intext
  num: "p145 Q2"
  source: NCERT X Science · Ch 9 · In-text questions · p. 145 · Q2
  kind: num
  q: A concave mirror produces three times magnified (enlarged) real image of an object placed at 10 cm in front of it. Where is the image located?
  ask: Image distance v, with sign
  unit: cm
  ans: -30
  tol: 0.1
  verify: "-(-3)*(-10)"
  hints: ["A real image from a mirror is inverted, so m = −3.", "m = −v/u, so v = −m u."]
  sol: |
    Real image, so inverted: $m = -3$. With $u = -10$ cm,
    $$m = -\frac{v}{u} \Rightarrow v = -m\,u = -(-3)(-10) = -30 \text{ cm}.$$
    The image is 30 cm in front of the mirror.
  check: code

- id: ncert-ex9-1
  lvl: ncert-intext
  num: "Ex 9.1"
  source: NCERT X Science · Ch 9 · Example 9.1
  kind: num
  q: A convex mirror used for rear-view on an automobile has a radius of curvature of 3.00 m. If a bus is located at 5.00 m from this mirror, find the position, nature and size of the image.
  ask: Image distance v, with sign
  unit: m
  ans: 1.15
  tol: 0.01
  verify: 1/(1/1.5+1/5)
  hints: ["f = R/2 = +1.50 m and u = −5.00 m.", "Then use m = −v/u for the size."]
  sol: |
    $f = +1.50$ m, $u = -5.00$ m. $\dfrac1v = \dfrac{1}{1.50} + \dfrac{1}{5.00}$, so $v = +1.15$ m.
    $m = -v/u = -1.15/(-5.00) = +0.23$. The image is 1.15 m behind the mirror, virtual, erect and 0.23 times the size of the bus.
  check: code

- id: ncert-ex9-2
  lvl: ncert-intext
  num: "Ex 9.2"
  source: NCERT X Science · Ch 9 · Example 9.2
  kind: num
  q: An object, 4.0 cm in size, is placed at 25.0 cm in front of a concave mirror of focal length 15.0 cm. At what distance from the mirror should a screen be placed in order to obtain a sharp image? Find the nature and the size of the image.
  ask: Image distance v, with sign
  unit: cm
  ans: -37.5
  tol: 0.1
  verify: 1/(1/(-15)-1/(-25))
  hints: ["u = −25.0 cm, f = −15.0 cm.", "Image height h′ = −(v/u) h."]
  sol: |
    $\dfrac1v = -\dfrac{1}{15.0} + \dfrac{1}{25.0} = -\dfrac{2}{75}$, so $v = -37.5$ cm: place the screen 37.5 cm in front of the mirror.
    $h' = -(v/u)h = -(-37.5/-25.0)(4.0) = -6.0$ cm. The image is real, inverted and enlarged.
  check: code

- id: ncert-ex-2
  lvl: ncert-ex
  num: 2
  source: NCERT X Science · Ch 9 · Exercise 2 · p. 159
  kind: mcq
  q: The image formed by a concave mirror is observed to be virtual, erect and larger than the object. Where should be the position of the object?
  opts: ["Between the principal focus and the centre of curvature", "At the centre of curvature", "Beyond the centre of curvature", "Between the pole of the mirror and its principal focus."]
  ans: 3
  sol: Only an object between the pole and the principal focus gives a virtual, erect, enlarged image with a concave mirror. Every other position gives a real, inverted image.
  answer_key: (d)
  check: ncert-key

- id: ncert-ex-4
  lvl: ncert-ex
  num: 4
  source: NCERT X Science · Ch 9 · Exercise 4 · p. 159
  kind: mcq
  q: A spherical mirror and a thin spherical lens have each a focal length of –15 cm. The mirror and the lens are likely to be
  opts: ["both concave.", "both convex.", "the mirror is concave and the lens is convex.", "the mirror is convex, but the lens is concave."]
  ans: 0
  sol: In the New Cartesian convention a negative focal length means a concave mirror (focus in front) and a concave, diverging lens (focus on the object side). So both are concave.
  answer_key: (a)
  check: ncert-key

- id: ncert-ex-5
  lvl: ncert-ex
  num: 5
  source: NCERT X Science · Ch 9 · Exercise 5 · p. 160
  kind: mcq
  q: No matter how far you stand from a mirror, your image appears erect. The mirror is likely to be
  opts: ["only plane.", "only concave.", "only convex.", "either plane or convex."]
  ans: 3
  sol: Plane and convex mirrors always form erect, virtual images at every distance. A concave mirror forms an inverted image once you stand beyond its focus.
  answer_key: (d)
  check: ncert-key

- id: ncert-ex-7
  lvl: ncert-ex
  num: 7
  source: NCERT X Science · Ch 9 · Exercise 7 · p. 160
  kind: text
  q: We wish to obtain an erect image of an object, using a concave mirror of focal length 15 cm. What should be the range of distance of the object from the mirror? What is the nature of the image? Is the image larger or smaller than the object? Draw a ray diagram to show the image formation in this case.
  sol: |
    The object must be **between the pole and the focus**, at a distance less than 15 cm from the mirror. The image is **virtual and erect**, formed behind the mirror, and **larger** than the object.

    Ray diagram: draw a ray from the top of the object parallel to the axis, reflecting through F; and a ray that strikes the pole, reflecting symmetrically. The reflected rays diverge; extend them behind the mirror (dashed) to meet at the top of the enlarged, erect image. Set the bench in the lesson to a concave mirror with |u| < |f| to see it.
  answer_key: Distance less than 15 cm; virtual; Enlarged.
  check: ncert-key

- id: ncert-ex-8
  lvl: ncert-ex
  num: 8
  source: NCERT X Science · Ch 9 · Exercise 8 · p. 160
  kind: text
  q: |
    Name the type of mirror used in the following situations.
    (a) Headlights of a car. (b) Side/rear-view mirror of a vehicle. (c) Solar furnace.
    Support your answer with reason.
  sol: |
    (a) **Concave mirror.** The bulb sits at the principal focus, so reflected light leaves as a strong parallel beam.

    (b) **Convex mirror.** It always forms an erect, diminished image and gives a wide field of view.

    (c) **Concave mirror.** It brings sunlight to a focus, concentrating heat at one point.
  check: none

- id: ncert-ex-12
  lvl: ncert-ex
  num: 12
  source: NCERT X Science · Ch 9 · Exercise 12 · p. 160
  kind: num
  q: An object is placed at a distance of 10 cm from a convex mirror of focal length 15 cm. Find the position and nature of the image.
  ask: Image distance v, with sign
  unit: cm
  ans: 6
  tol: 0.05
  verify: 1/(1/15-1/(-10))
  hints: ["u = −10 cm, f = +15 cm for a convex mirror."]
  sol: |
    $\dfrac1v = \dfrac1f - \dfrac1u = \dfrac{1}{15} + \dfrac{1}{10} = \dfrac{1}{6}$, so $v = +6.0$ cm.
    The image is 6.0 cm behind the mirror, virtual and erect, with $m = -v/u = +0.6$ (diminished).
  answer_key: 6.0 cm, behind the mirror; virtual, erect
  check: both

- id: ncert-ex-14
  lvl: ncert-ex
  num: 14
  source: NCERT X Science · Ch 9 · Exercise 14 · p. 160
  kind: num
  q: An object 5.0 cm in length is placed at a distance of 20 cm in front of a convex mirror of radius of curvature 30 cm. Find the position of the image, its nature and size.
  ask: Image distance v, with sign
  unit: cm
  ans: 8.6
  tol: 0.05
  verify: 1/(1/15-1/(-20))
  hints: ["f = +R/2 = +15 cm, u = −20 cm.", "h′ = −(v/u) h."]
  sol: |
    $\dfrac1v = \dfrac{1}{15} + \dfrac{1}{20} = \dfrac{7}{60}$, so $v = +8.6$ cm.
    $m = -v/u = 8.57/20 = +0.43$, so $h' = 0.43 \times 5.0 = 2.1$ cm. The image is 8.6 cm behind the mirror, virtual, erect and diminished.
  answer_key: 8.6 cm, behind the mirror; virtual, erect; 2.2 cm, reduced.
  check: both

- id: ncert-ex-15
  lvl: ncert-ex
  num: 15
  source: NCERT X Science · Ch 9 · Exercise 15 · p. 160
  kind: num
  q: An object of size 7.0 cm is placed at 27 cm in front of a concave mirror of focal length 18 cm. At what distance from the mirror should a screen be placed, so that a sharp focussed image can be obtained? Find the size and the nature of the image.
  ask: Image distance v, with sign
  unit: cm
  ans: -54
  tol: 0.1
  verify: 1/(1/(-18)-1/(-27))
  hints: ["u = −27 cm, f = −18 cm.", "h′ = −(v/u) h."]
  sol: |
    $\dfrac1v = -\dfrac{1}{18} + \dfrac{1}{27} = -\dfrac{1}{54}$, so $v = -54$ cm: place the screen 54 cm in front of the mirror.
    $m = -v/u = -(-54)/(-27) = -2$, so $h' = -14$ cm. The image is real, inverted and magnified, 14 cm tall.
  answer_key: 54 cm on the object side; 14 cm, magnified; real, inverted.
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: What kind of image does a convex mirror form of a real object?
  opts: ["Real, inverted", "Virtual, erect, diminished", "Virtual, erect, magnified"]
  ans: 1
  sol: A convex mirror diverges light, so reflected rays never meet; they only appear to come from a point behind the mirror. The image is always virtual, erect and diminished.
  check: none

