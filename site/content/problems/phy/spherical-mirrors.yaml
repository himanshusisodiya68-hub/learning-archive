- id: o1
  lvl: oly
  kind: num
  q: In a Cassegrain telescope, a concave primary mirror of focal length 100 cm faces a distant star. A convex secondary mirror of focal length 25 cm is placed on the axis 80 cm in front of the primary, facing it. Where is the final image of the star?
  ask: Distance of final image behind the primary mirror
  unit: cm
  ans: 20
  tol: 0.1
  verify: -(1/(1/25-1/20))-80
  hints: ["The primary alone would form the image 100 cm from it, which is 20 cm behind the secondary. That point is a virtual object for the secondary.", "For the secondary, take the direction of the light reaching it as positive: u = +20 cm, f = +25 cm."]
  sol: |
    The primary converges the starlight towards a point 100 cm from it, 20 cm beyond the secondary. For the secondary this is a virtual object at $u = +20$ cm. With $f = +25$ cm,
    $$\frac1v = \frac{1}{25} - \frac{1}{20} = -\frac{1}{100} \Rightarrow v = -100 \text{ cm},$$
    a real image 100 cm in front of the secondary, back towards the primary: $100 - 80 = 20$ cm behind the primary, through a hole in its centre. The secondary magnifies by $m = -v/u = 5$, so the telescope behaves like a single mirror of focal length 500 cm packed into an 80 cm tube.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: Prove that every ray parallel to the axis of the parabolic mirror $y^2 = 4ax$ passes through the point $(a, 0)$ after reflection.
  hints: ["The slope of the parabola at (x, y) is 2a/y.", "Alternatively, use Fermat: compare path lengths to the directrix x = −a."]
  sol: |
    Use the focus–directrix property: every point P on the parabola is equally far from the focus S $(a, 0)$ and from the directrix $x = -a$. Take a ray arriving parallel to the axis. Draw a reference line perpendicular to the axis far to the right, at $x = L$. The path from that line to P and then to S has length $(L - x_P) + PS = (L - x_P) + (x_P + a) = L + a$, the same for every point P. Since all such paths take equal time, Fermat's principle says each is a possible light path, and the reflected rays all reach S. (Directly: the tangent at P bisects the angle between PS and the line through P parallel to the axis, which is the law of reflection.)
  check: none

- id: ncert12-eg-9-1
  lvl: ncert-intext
  num: "XII Ex 9.1"
  source: NCERT XII Physics · Ch 9 · Example 9.1
  kind: text
  q: Suppose that the lower half of the concave mirror's reflecting surface in Fig. 9.6 is covered with an opaque (non-reflective) material. What effect will this have on the image of an object placed in front of the mirror?
  sol: The whole image still forms, because every part of the mirror reflects rays from every point of the object to the corresponding image point. With half the reflecting area covered, only half as much light reaches the image, so it is less bright.
  check: none

- id: ncert12-eg-9-2
  lvl: ncert-intext
  num: "XII Ex 9.2"
  source: NCERT XII Physics · Ch 9 · Example 9.2
  kind: text
  q: A mobile phone lies along the principal axis of a concave mirror, as shown in Fig. 9.7. Show by suitable diagram, the formation of its image. Explain why the magnification is not uniform. Will the distortion of image depend on the location of the phone with respect to the mirror?
  sol: Each point of the phone is at a different distance from the mirror, so each forms its image at a different distance with a different magnification $m = -v/u$. The part nearer the focus is magnified far more than the part farther away, so the image is distorted (along the axis the magnification is $-m^2$). Yes, the distortion depends on the location; it is largest when the phone is close to the focus.
  check: none

