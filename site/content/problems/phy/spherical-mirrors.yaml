- id: a2
  lvl: adv
  kind: num
  q: A concave mirror has radius of curvature 40 cm. A ray parallel to the axis strikes it at a height of 12 cm. At what distance from the pole does the reflected ray cross the axis?
  ask: Distance from pole
  unit: cm
  ans: 19.03
  tol: 0.05
  verify: 40-20/sqrt(1-0.09)
  hints: ["sin θ = h/R, where θ is the angle of incidence.", "The crossing point is at R − R/(2 cos θ) from the pole."]
  sol: |
    $\sin\theta = 12/40 = 0.3$, so $\cos\theta = 0.954$. The crossing point is at
    $$R - \frac{R}{2\cos\theta} = 40 - \frac{20}{0.954} = 19.03 \text{ cm},$$
    about 1 mm closer than the paraxial focus at 20 cm. This is spherical aberration.
  check: code

- id: a3
