- id: o2
  lvl: oly
  kind: proof
  q: Show that a compound microscope in normal adjustment has magnifying power $m \approx \dfrac{L}{f_o}\cdot\dfrac{D}{f_e}$, where $L$ is the distance between the second focal point of the objective and the first focal point of the eyepiece.
  hints: ["In normal adjustment the objective's image lies at the eyepiece's first focal point.", "Use Newton's form for the objective: the image is L beyond F₂ of the objective."]
  sol: In normal adjustment the final image is at infinity, so the objective's image lies at the eyepiece's first focal point, a distance $L$ beyond the objective's second focal point. Newton's form for the objective gives linear magnification $m_o = x'/f_o = L/f_o$ (magnitude), since $x' = L$. The eyepiece then acts as a magnifier with its object at its focus, giving angular magnification $m_e = D/f_e$. The total is $m = m_o m_e = \frac{L}{f_o}\cdot\frac{D}{f_e}$.
  check: none
