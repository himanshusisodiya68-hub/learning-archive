- id: o1
  lvl: oly
  kind: num
  q: A telescope has an aperture of 20 cm. Taking the eye's resolution as 1 arcminute and λ = 550 nm, estimate the largest useful magnification, beyond which no further detail is revealed.
  ask: Largest useful magnification
  unit: ""
  ans: 86.7
  tol: 1
  verify: (PI/180/60)/(1.22*550e-9/0.2)
  sol: The telescope resolves $1.22 \times 5.5 \times 10^{-7}/0.20 = 3.36 \times 10^{-6}$ rad. Magnifying this to the eye's $2.91 \times 10^{-4}$ rad needs $m \approx 87$. Beyond that, the image just gets larger and blurrier.
