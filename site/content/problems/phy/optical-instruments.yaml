- id: a3
  lvl: adv
  kind: num
  q: A Galilean telescope uses a convex objective of focal length 30 cm and a concave eyepiece of focal length 5 cm. Find its length in normal adjustment.
  ask: Length
  unit: cm
  ans: 25
  tol: 0.1
  verify: 30-5
  sol: In normal adjustment the focal points coincide, so the length is $f_o - |f_e| = 25$ cm. The magnifying power is $30/5 = 6$, and the image is erect, which is why opera glasses use this design.
