  q: Where is the eye ring of a telescope with $f_o = 100$ cm and $f_e = 5$ cm in normal adjustment, measured from the eyepiece?
  ask: Distance behind eyepiece
  unit: cm
  ans: 5.25
  tol: 0.01
  verify: 5*(100+5)/100
  hints: ["The eye ring is the eyepiece's image of the objective, which is fₒ + fₑ in front of the eyepiece."]
  sol: With $u = -(f_o + f_e) = -105$ cm and $f = 5$ cm, $\frac1v = \frac15 - \frac{1}{105}$, giving $v = \frac{5 \times 105}{100} = 5.25$ cm behind the eyepiece.
