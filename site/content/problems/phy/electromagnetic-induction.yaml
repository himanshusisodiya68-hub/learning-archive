- id: b1
  lvl: board
  kind: num
  q: A circular loop of radius 5 cm is placed perpendicular to a magnetic field that rises uniformly from 0 to 0.4 T in 2 s. Find the induced emf. (Original problem.)
  ask: Induced emf
  unit: mV
  ans: 1.571
  tol: 0.005
  verify: Math.PI*0.05**2*0.4/2*1000
  sol: $\varepsilon = A\,dB/dt = \pi(0.05)^2\times(0.4/2) = 1.57\times10^{-3}$ V $= 1.6$ mV.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A coil of resistance 10 Ω has an induced emf of 0.5 V while the flux through it changes. Find the charge that flows through the coil while the flux changes by 0.05 Wb. (Original problem.)
  ask: Charge
  unit: C
  ans: 0.005
  tol: 0.00001
  verify: 0.05/10
  sol: $q = \int I\,dt = \int\dfrac{\varepsilon}{R}dt = \dfrac{\Delta\Phi}{R} = \dfrac{0.05}{10} = 5\times10^{-3}$ C. The charge depends only on the total flux change and the resistance, not on how fast it changes.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A square loop of side 10 cm with resistance 2 Ω is pulled out of a uniform 0.5 T field (perpendicular to it) in 0.1 s. Find the total heat dissipated, assuming a constant emf. (Original problem.)
  ask: Heat dissipated
  unit: mJ
  ans: 0.125
  tol: 0.001
  verify: (0.5*0.1**2/0.1)**2/2*0.1*1000
  sol: The flux falls from $BA = 0.5\times10^{-2} = 5\times10^{-3}$ Wb to zero in 0.1 s, so $\varepsilon = 0.05$ V (constant). The current is $I = 0.05/2 = 0.025$ A. The heat is $I^2Rt = (0.025)^2\times2\times0.1 = 1.25\times10^{-4}$ J $= 0.125$ mJ.
  check: code

- id: m2
  lvl: main
  kind: text
  q: A conducting ring is held at rest in a region where a uniform magnetic field (normal to the ring) increases linearly with time. Explain, by symmetry, why the induced electric field lines are circles centred on the axis, and find the induced electric field at radius r inside the field region. (Original problem.)
  sol: |
    By the symmetry of the situation the induced field $E$ has the same magnitude at all points of a circle of radius $r$ concentric with the field region, and is tangential. Faraday's law in the form $\oint\mathbf E\cdot d\mathbf l = -d\Phi/dt$ gives $E(2\pi r) = \pi r^2\,dB/dt$, so $E = \dfrac r2\dfrac{dB}{dt}$ (in magnitude). The field lines are closed circles, so this electric field is not electrostatic: it is non-conservative.
  check: none

- id: a1
  lvl: adv
  kind: num
  q: "A flip coil of 50 turns and area 2.0 cm² is connected to a ballistic galvanometer; the total resistance of the circuit is 40 Ω. The coil is placed with its plane perpendicular to an unknown uniform magnetic field and then quickly turned through 180°. The galvanometer records a charge of 5.0 µC. Find the magnetic field. (Original problem.)"
  ask: Magnetic field
  unit: T
  ans: 0.01
  tol: 0.0001
  verify: 5.0e-6*40/(2*50*2.0e-4)
  sol: |
    Turning through 180° takes the flux per turn from $+BA$ to $-BA$, a change of $2BA$. The charge driven round the circuit is
    $$q = \frac{N\,\Delta\Phi}{R} = \frac{2NBA}{R}\quad\Rightarrow\quad B = \frac{qR}{2NA} = \frac{5.0\times10^{-6}\times40}{2\times50\times2.0\times10^{-4}} = 1.0\times10^{-2}\ \text{T}.$$
    The speed of the flip does not enter: a faster flip gives a larger but shorter current pulse carrying the same charge.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: "A long solenoid of radius 2.0 cm has a uniform field inside it that increases at a steady 0.50 T/s. Find the magnitude of the induced electric field at a point 5.0 cm from the axis, outside the solenoid. (Original problem.)"
  ask: Induced electric field
  unit: mV/m
  ans: 2.0
  tol: 0.02
  verify: 0.02**2/(2*0.05)*0.5*1000
  sol: |
    By symmetry the induced field circles the axis with the same magnitude at all points at distance $r$. Take a circle of radius $r = 5.0$ cm as the loop. Outside the solenoid $B = 0$, so the enclosed flux is only $\pi R^2B$:
    $$E\cdot2\pi r = \pi R^2\frac{dB}{dt}\quad\Rightarrow\quad E = \frac{R^2}{2r}\frac{dB}{dt} = \frac{(0.020)^2}{2\times0.050}\times0.50 = 2.0\times10^{-3}\ \text{V/m}.$$
    The field is non-zero although $\vec B$ at the point is zero and never changes; it is set by the enclosed changing flux.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: "A rectangular coil of 100 turns, each of area 0.010 m², rotates at 50 revolutions per second about an axis in its plane that is perpendicular to a uniform 0.20 T field. Find the peak emf, and state the orientation of the coil at which it occurs. (Original problem.)"
  ask: Peak emf
  unit: V
  ans: 62.83
  tol: 0.1
  verify: 100*0.20*0.010*2*Math.PI*50
  sol: |
    With the normal at angle $\theta = \omega t$ to $\vec B$, the flux linkage is $NBA\cos\omega t$, so
    $$\varepsilon = NBA\omega\sin\omega t,\qquad \varepsilon_0 = NBA\omega = 100\times0.20\times0.010\times(2\pi\times50) \approx 62.8\ \text{V}.$$
    The peak occurs when $\sin\omega t = \pm1$, that is, when the plane of the coil is **parallel** to $\vec B$ and the flux through it is zero (but changing fastest).
  check: code

- id: a4
  lvl: adv
  kind: num
  q: "A fixed loop of area 0.020 m² and resistance 0.10 Ω lies perpendicular to a uniform magnetic field that varies as B = 0.30t − 0.050t² (B in tesla, t in seconds). Find the total charge that passes any cross-section of the wire between t = 0 and t = 6.0 s, counting charge that passes in either direction. (Neglect self-inductance.) (Original problem.)"
  ask: Total charge
  unit: C
  ans: 0.18
  tol: 0.002
  verify: 2*0.020*(0.30*3-0.050*9)/0.10
  sol: |
    The emf is $\varepsilon = A\,dB/dt = A(0.30 - 0.10t)$, which changes sign at $t = 3$ s. So the current flows one way for $0<t<3$ s and the other way for $3<t<6$ s, and the charge must be found for each stretch separately.

    $B(0) = 0$, $B(3) = 0.90 - 0.45 = 0.45$ T, $B(6) = 1.80 - 1.80 = 0$.

    First stretch: $q_1 = A\,|\Delta B|/R = 0.020\times0.45/0.10 = 0.090$ C. Second stretch: the same, $0.090$ C, in the opposite direction.

    Total charge passing, either direction: $0.18$ C. The **net** charge is zero, because the flux returns to its starting value; $q = \Delta\Phi/R$ alone would wrongly give zero.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: "A thin insulating ring of mass 5.0 g carries a charge of 10 µC spread uniformly round it. It hangs at rest, free to rotate about its own axis, in a uniform magnetic field of 2.0 T along that axis. The field is switched off (in any manner whatever). Find the final angular speed of the ring. Neglect the ring's own magnetic field. (Original problem.)"
  ask: Final angular speed
  unit: mrad/s
  ans: 2.0
  tol: 0.02
  verify: 10e-6*2.0/(2*5.0e-3)*1000
  sol: |
    While $B$ falls, an induced electric field circles the axis. On the ring (radius $a$), by symmetry,
    $$E\cdot2\pi a = -\frac{d}{dt}(\pi a^2B)\quad\Rightarrow\quad E = -\frac a2\frac{dB}{dt}.$$
    This tangential field exerts a torque $\tau = QEa$ on the ring's charge. The angular impulse is
    $$\int\tau\,dt = -\frac{Qa^2}{2}\int\frac{dB}{dt}dt = \frac{Qa^2B_0}{2}.$$
    The ring starts at rest with moment of inertia $ma^2$, so
    $$ma^2\omega = \frac{Qa^2B_0}{2}\quad\Rightarrow\quad\omega = \frac{QB_0}{2m} = \frac{10\times10^{-6}\times2.0}{2\times5.0\times10^{-3}} = 2.0\times10^{-3}\ \text{rad/s}.$$
    The radius cancels and so does the time profile: only the total change of $B$ matters, just as $q = \Delta\Phi/R$ does not depend on the time. The angular momentum the ring gains is supplied by the electromagnetic field (it was stored in the field of the charges and the magnet).
  check: code

- id: o2
  lvl: oly
  kind: num
  q: "A circular ring is made of two semicircular resistors, R₁ = 100 Ω on the left half and R₂ = 300 Ω on the right half, joined at the top and bottom points P and Q. A long thin solenoid along the ring's axis produces a changing flux that induces an emf of 1.0 V round the ring. An ideal voltmeter is connected to P and Q with its leads running on the left side of the ring, so that the loop formed by the voltmeter and R₁ encloses no part of the solenoid. Find the magnitude of the voltmeter reading. What would a second voltmeter read with its leads on the right? (Original problem.)"
  ask: Reading with leads on the left
  unit: V
  ans: 0.25
  tol: 0.002
  verify: 1.0/(100+300)*100
  sol: |
    The ideal voltmeter draws no current, so the ring current is $I = \varepsilon/(R_1+R_2) = 1.0/400 = 2.5$ mA.

    The loop formed by the left-hand voltmeter and $R_1$ encloses no changing flux, so $\oint\vec E\cdot d\vec l = 0$ round it and Kirchhoff's loop rule holds for it. The meter therefore reads the drop across $R_1$:
    $$|V_{\text{left}}| = IR_1 = 2.5\times10^{-3}\times100 = 0.25\ \text{V}.$$
    For a voltmeter with leads on the right, the loop "meter + $R_2$" encloses no flux, so it reads $IR_2 = 0.75$ V, with the opposite sign when both meters are connected with the same terminal at P.

    Two ideal meters on the same two points disagree because the induced field has no potential: $\int_P^Q\vec E\cdot d\vec l$ depends on the path. The difference in their signed readings, $0.25 - (-0.75) = 1.0$ V, is exactly the emf enclosed between the two lead paths.
  check: code

- id: o3
  lvl: oly
  kind: num
  q: "A thin copper disc of radius 5.0 cm and thickness 1.0 mm lies perpendicular to a uniform magnetic field that increases at a steady 1.0 T/s. Take the conductivity of copper as 6.0 × 10⁷ S/m. Neglecting the magnetic field of the eddy currents themselves, find the power dissipated as heat in the disc. (Original problem.)"
  ask: Power dissipated
  unit: W
  ans: 0.1473
  tol: 0.001
  verify: 6.0e7*1.0e-3*Math.PI*0.05**4*1.0**2/8
  sol: |
    By symmetry the induced field circles the axis, and at radius $r$ it has magnitude $E = \dfrac r2\dfrac{dB}{dt}$ (from $E\cdot2\pi r = \pi r^2\,dB/dt$). The eddy-current density is $J = \sigma E$ and the power per unit volume is $JE = \sigma E^2$. Integrate over thin rings of radius $r$, width $dr$ and thickness $h$:
    $$P = \int_0^a\sigma\left(\frac r2\frac{dB}{dt}\right)^2 h\,2\pi r\,dr = \frac{\pi\sigma h a^4}{8}\left(\frac{dB}{dt}\right)^2.$$
    Numbers: $P = \dfrac{\pi\times6.0\times10^{7}\times1.0\times10^{-3}\times(0.050)^4\times1.0^2}{8} \approx 0.147$ W.

    The $a^4$ dependence explains lamination: cutting the disc into $n$ smaller pieces of the same total area reduces the loss roughly by a factor $n$ (each piece has $a^4$ smaller by $n^2$). The conductivity value is a standard figure for copper, given in the problem. Neglecting the eddy currents' own field is valid when that field is much smaller than the applied one, which holds here for slow changes.
  check: code

- id: o4
  lvl: oly
  kind: proof
  q: "In a betatron an electron moves on a circle of fixed radius r in a plane perpendicular to an axially symmetric magnetic field that increases with time. Show that the orbit can stay fixed only if the field at the orbit is always half the average field over the area enclosed by the orbit (starting from rest with zero field). Then find the energy gained per turn when r = 0.50 m and the average field inside the orbit increases at 100 T/s, in eV. (Original problem.)"
  hints:
    - "The induced electric field on the orbit is E = (1/2πr) dΦ/dt with Φ = πr²B̄."
    - "Newton's law along the orbit: dp/dt = eE. The radius condition: p = eB_orb r."
    - "Energy per turn = charge × emf of one loop round the orbit."
  sol: |
    **Tangential force.** By symmetry the induced field is tangential and equal all round the orbit: $E\cdot2\pi r = \dfrac{d\Phi}{dt} = \pi r^2\dfrac{d\bar B}{dt}$, where $\bar B$ is the average field inside the orbit. So $\dfrac{dp}{dt} = eE = \dfrac{er}{2}\dfrac{d\bar B}{dt}$ (in magnitude). This holds for relativistic momentum too.

    **Radius condition.** The magnetic force supplies the centripetal force: $p = eB_{\text{orb}}r$ for fixed $r$. Differentiating, $\dfrac{dp}{dt} = er\dfrac{dB_{\text{orb}}}{dt}$.

    Equating, $\dfrac{dB_{\text{orb}}}{dt} = \dfrac12\dfrac{d\bar B}{dt}$. Starting with both fields zero (and $p = 0$), integration gives $B_{\text{orb}} = \tfrac12\bar B$ at all times.

    **Energy per turn.** One trip round the orbit is a closed loop with emf $d\Phi/dt = \pi r^2\,d\bar B/dt = \pi\times(0.50)^2\times100 \approx 78.5$ V, so the electron gains about **78.5 eV** per turn. (Over a few milliseconds of rise the electron makes very many turns, which is how the energy builds up to MeV values. [Inference: illustrative numbers, not a specific machine.])
  check: none
