- id: m1
  lvl: main
  kind: num
  q: A solid insulating sphere of radius 10 cm carries a uniform volume charge of total charge 6 nC. Find the electric field at 5 cm from the centre. (Original problem.)
  ask: Electric field at 5 cm
  unit: N/C
  ans: 2700
  tol: 5
  verify: 9e9*6e-9*0.05/0.1**3
  sol: |
    Inside a uniformly charged sphere only the charge within radius $r$ counts: $q_{enc} = Q(r/R)^3$. So $E = \dfrac{1}{4\pi\varepsilon_0}\dfrac{Qr}{R^3} = 9\times10^{9}\times\dfrac{6\times10^{-9}\times0.05}{(0.1)^3} = 2700$ N/C, radially outward.
  check: code

- id: m2
  lvl: main
  kind: num
  q: Two large parallel conducting plates each carry a net charge of +4 µC per square metre. Find the field just outside the pair. (The field between the plates is also asked about in the solution.) (Original problem.)
  ask: Field just outside the plates
  unit: N/C
  ans: 4.52e5
  tol: 1e3
  verify: 4e-6/8.854e-12
  sol: |
    For two parallel conducting plates with like charges, the charge settles on the two outer faces, $\sigma_{outer} = 4\ \mu$C/m² each, and none stays on the inner faces. Between the plates the fields of the two equal sheets cancel, so $E = 0$ there. Just outside, $E = \sigma_{outer}/\varepsilon_0 = \dfrac{4\times10^{-6}}{8.854\times10^{-12}} = 4.5\times10^{5}$ N/C, directed away from the plates. (Equivalent to two sheets of total $8\ \mu$C/m²: $E = \dfrac{8\times10^{-6}}{2\varepsilon_0}$.)
  check: code
