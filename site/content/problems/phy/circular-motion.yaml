# Circular motion. NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27) Ch 3 (Motion in a Plane; Example 3.9 and Exercises 3.14–3.16). The Grade 9 treatment of uniform circular motion is covered under the Grade 9 chapter files. Found, board and main problems are original.

- id: ncert11-eg-3-9
  lvl: ncert-intext
  num: "XI Ex 3.9"
  source: NCERT XI Physics · Ch 3 · Example 3.9
  kind: num
  q: |-
    An insect trapped in a circular groove of radius 12 cm moves along the groove steadily and completes 7 revolutions in 100 s. (a) What is the angular speed, and the linear speed of the motion? (b) Is the acceleration vector a constant vector? What is its magnitude?
  ask: Magnitude of the acceleration, part (b)
  unit: cm/s²
  ans: 2.3
  tol: 0.05
  verify: (2*PI*7/100)**2*12
  sol: |
    This is uniform circular motion with $R = 12$ cm. The period is $T = 100/7$ s.

    (a) Angular speed: $\omega = \dfrac{2\pi}{T} = \dfrac{2\pi\times7}{100} = 0.44\ \text{rad s}^{-1}$.
    Linear speed: $v = \omega R = 0.44\times12 = 5.3\ \text{cm s}^{-1}$, directed along the tangent to the groove at every point.

    (b) The acceleration points toward the centre of the circle, and this direction changes continuously, so the acceleration is **not** a constant vector. Its magnitude is constant:
    $$a = \omega^2R = (0.44)^2\times12 = 2.3\ \text{cm s}^{-2}.$$
    (Check: $v^2/R = 5.3^2/12 = 2.3$ cm s⁻².)
  answer_key: "ω = 0.44 rad/s, v = 5.3 cm s⁻¹; a is not constant in direction; magnitude 2.3 cm s⁻² (printed in the example)"
  check: both

- id: ncert11-ex-3-14
  lvl: ncert-ex
  num: "XI 3.14"
  source: NCERT XI Physics · Ch 3 · Exercise 3.14
  kind: num
  q: |-
    A stone tied to the end of a string 80 cm long is whirled in a horizontal circle with a constant speed. If the stone makes 14 revolutions in 25 s, what is the magnitude and direction of acceleration of the stone?
  ask: Magnitude of the acceleration
  unit: m/s²
  ans: 9.9
  tol: 0.1
  verify: (2*PI*14/25)**2*0.80
  sol: |
    Radius $R = 80\ \text{cm} = 0.80$ m. Frequency $\nu = 14/25 = 0.56\ \text{s}^{-1}$, so $\omega = 2\pi\nu = 3.52\ \text{rad s}^{-1}$ and the speed is $v = \omega R = 2.81\ \text{m s}^{-1}$.

    The acceleration is centripetal:
    $$a_c = \omega^2R = (3.52)^2\times0.80 = 9.9\ \text{m s}^{-2}\quad\Big(=\frac{v^2}{R} = \frac{2.81^2}{0.80}\Big).$$
    Its direction is **along the radius, toward the centre of the circle, at every point** of the motion.
  answer_key: "9.9 m s⁻², along the radius at every point towards the centre."
  check: both

- id: ncert11-ex-3-15
  lvl: ncert-ex
  num: "XI 3.15"
  source: NCERT XI Physics · Ch 3 · Exercise 3.15
  kind: num
  q: |-
    An aircraft executes a horizontal loop of radius 1.00 km with a steady speed of 900 km/h. Compare its centripetal acceleration with the acceleration due to gravity.
  ask: Centripetal acceleration as a multiple of g
  unit: g
  ans: 6.4
  tol: 0.05
  verify: (900/3.6)**2/1000/9.8
  sol: |
    $v = 900\ \text{km/h} = 900/3.6 = 250\ \text{m s}^{-1}$ and $R = 1000$ m. Then
    $$a_c = \frac{v^2}{R} = \frac{250^2}{1000} = 62.5\ \text{m s}^{-2}.$$
    With $g = 9.8$ m s⁻², $a_c/g = 62.5/9.8 = 6.4$, so the centripetal acceleration is about **6.4 times** the acceleration due to gravity ($a_c \approx 6.4\,g$).
  answer_key: "6.4 g"
  check: both

- id: ncert11-ex-3-16
  lvl: ncert-ex
  num: "XI 3.16"
  source: NCERT XI Physics · Ch 3 · Exercise 3.16
  kind: text
  q: |-
    Read each statement below carefully and state, with reasons, if it is true or false:
    (a) The net acceleration of a particle in circular motion is always along the radius of the circle towards the centre
    (b) The velocity vector of a particle at a point is always along the tangent to the path of the particle at that point
    (c) The acceleration vector of a particle in uniform circular motion averaged over one cycle is a null vector
  sol: |
    (a) **False.** The net acceleration points to the centre only in *uniform* circular motion. If the speed changes, there is also a tangential component $a_t = dv/dt$ along the tangent, and the net acceleration $\sqrt{a_c^2 + a_t^2}$ points inside the circle but not through the centre.

    (b) **True.** The velocity is $d\mathbf r/dt$, the limit of $\Delta\mathbf r/\Delta t$ as the chord $\Delta\mathbf r$ shrinks onto the curve, which is the tangent direction. This holds for any path.

    (c) **True.** Over one full cycle the velocity returns to its initial value, so $\mathbf a_{\text{avg}} = \Delta\mathbf v/T = 0$. Equivalently, the centripetal acceleration vectors point in all directions around the circle in equal measure and sum to zero.
  answer_key: "(a) False (true only for uniform circular motion); (b) True; (c) True."
  check: ncert-key

- id: f1
  lvl: found
  kind: mcq
  q: A stone is whirled in a horizontal circle at constant speed. The direction of its acceleration is
  opts: ["along the velocity", "opposite to the velocity", "toward the centre of the circle", "away from the centre of the circle"]
  ans: 2
  sol: In uniform circular motion the speed is constant but the direction of the velocity keeps changing, so there is an acceleration $v^2/R$ perpendicular to the velocity, always toward the centre. (Original problem.)
  check: none

