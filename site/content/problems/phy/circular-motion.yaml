- id: b1
  lvl: board
  kind: num
  q: The Moon goes round the Earth in a nearly circular orbit of radius $3.84\times10^8$ m with a period of 27.3 days. Find its centripetal acceleration. (Original problem.)
  ask: Centripetal acceleration of the Moon
  unit: m/s²
  ans: 0.00272
  tol: 0.00003
  verify: 4*PI**2*3.84e8/(27.3*86400)**2
  sol: |
    $T = 27.3\times86400 = 2.36\times10^6$ s. Then
    $$a_c = \frac{4\pi^2R}{T^2} = \frac{4\pi^2\times3.84\times10^8}{(2.36\times10^6)^2} = 2.72\times10^{-3}\ \text{m s}^{-2}.$$
    This is about $1/3600$ of $g$ at the Earth's surface, as expected from the inverse-square law because the Moon is about 60 Earth radii away ($60^2 = 3600$).
  check: code

- id: b2
  lvl: board
  kind: num
  q: A car goes round a bend of radius 50 m at a steady 36 km/h. Find its centripetal acceleration. (Original problem.)
  ask: Centripetal acceleration
  unit: m/s²
  ans: 2
  tol: 0.01
  verify: (36/3.6)**2/50
  sol: $v = 36\ \text{km/h} = 10$ m/s. $a_c = v^2/R = 100/50 = 2.0\ \text{m s}^{-2}$, directed toward the centre of the bend. (The friction between the tyres and the road must supply the force $ma_c$.)
  check: code

- id: b3
  lvl: board
  kind: num
  q: A point on the equator takes part in the Earth's rotation. Taking the Earth's radius as $6.4\times10^6$ m and the period of rotation as 24 h, find the centripetal acceleration of the point. (Original problem.)
  ask: Centripetal acceleration at the equator
  unit: m/s²
  ans: 0.0337
  tol: 0.0003
  verify: (2*PI/86400)**2*6.4e6
  sol: |
    $\omega = \dfrac{2\pi}{86400} = 7.27\times10^{-5}\ \text{rad s}^{-1}$. Then $a_c = \omega^2R = (7.27\times10^{-5})^2\times6.4\times10^6 = 0.0338\ \text{m s}^{-2}$, about $0.3\%$ of $g$, directed toward the Earth's axis. This is why the apparent weight at the equator is slightly less than at the poles.
  check: code

- id: m1
  lvl: main
  kind: num
  q: The tip of a clock's second hand of length 12 cm and the tip of its minute hand of length 10 cm move in circles. Find the ratio of the centripetal acceleration of the second hand's tip to that of the minute hand's tip. (Original problem.)
  ask: |
    Ratio of accelerations (second hand : minute hand)
  unit: ratio
  ans: 4320
  tol: 1
  verify: (60**2)*(12/10)
  sol: |
    $a_c = \omega^2R$. The second hand turns once in 60 s and the minute hand once in 3600 s, so $\omega_s/\omega_m = 60$. Then
    $$\frac{a_s}{a_m} = \left(\frac{\omega_s}{\omega_m}\right)^2\frac{R_s}{R_m} = 60^2\times\frac{12}{10} = 3600\times1.2 = 4320.$$
  check: code

- id: m2
  lvl: main
  kind: num
  q: A particle moves on a circle of radius 2.0 m with speed $v = 3t$ (in m/s, with $t$ in seconds). Find the magnitude of its total acceleration at $t = 2.0$ s. (Original problem.)
  ask: Magnitude of total acceleration at t = 2.0 s
  unit: m/s²
  ans: 18.2
  tol: 0.1
  verify: hypot(3, (3*2.0)**2/2.0)
  sol: |
    The speed changes, so the motion is not uniform and the acceleration has two perpendicular parts.

    Tangential: $a_t = \dfrac{dv}{dt} = 3.0\ \text{m s}^{-2}$ (along the velocity).

    Radial (centripetal): at $t = 2$ s, $v = 6$ m/s, so $a_c = \dfrac{v^2}{R} = \dfrac{36}{2.0} = 18\ \text{m s}^{-2}$ (toward the centre).

    Magnitude: $a = \sqrt{a_t^2 + a_c^2} = \sqrt{3^2 + 18^2} = \sqrt{333} = 18.2\ \text{m s}^{-2}$, at $\tan^{-1}(a_t/a_c) = 9.5^\circ$ from the radius toward the direction of motion. It does not point at the centre (compare Exercise 3.16(a)).
  check: code

- id: m3
  lvl: main
  kind: num
  q: A particle moves in a circle of radius 5.0 m at a constant speed of 10 m/s. Find the magnitude of its average acceleration over one quarter of a revolution. (Original problem.)
  ask: Magnitude of average acceleration over a quarter turn
  unit: m/s²
  ans: 18
  tol: 0.1
  verify: 10*sqrt(2)/(2*PI*5.0/10/4)
  sol: |
    Over a quarter turn the velocity vector turns through $90^\circ$ while keeping its magnitude, so
    $$|\Delta\mathbf v| = \sqrt{v^2 + v^2} = v\sqrt2 = 14.14\ \text{m/s}.$$
    The period is $T = \dfrac{2\pi R}{v} = \dfrac{2\pi\times5.0}{10} = 3.14$ s, so a quarter of a revolution takes $\Delta t = T/4 = 0.785$ s. Then
    $$|\mathbf a_{\text{avg}}| = \frac{14.14}{0.785} = 18.0\ \text{m s}^{-2}.$$
    The instantaneous centripetal acceleration is $v^2/R = 20$ m s⁻², larger by the factor $\pi/(2\sqrt2) \approx 1.11$. Average and instantaneous accelerations differ here because the direction of $\mathbf a$ changes during the interval; over a full revolution the average is zero.
  check: code
