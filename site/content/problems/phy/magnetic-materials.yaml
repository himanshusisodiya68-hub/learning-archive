# Magnetisation, magnetic intensity and the magnetic properties of materials. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 5, §5.4–5.5. Found, board and main problems are original.

- id: ncert12-eg-5-5
  lvl: ncert-intext
  num: "XII Ex 5.5"
  source: NCERT XII Physics · Ch 5 · Example 5.5
  kind: num
  q: A solenoid has a core of a material with relative permeability 400. The windings of the solenoid are insulated from the core and carry a current of 2A. If the number of turns is 1000 per metre, calculate (a) H, (b) M, (c) B and (d) the magnetising current I_M.
  ask: Magnetic field B in the core
  unit: T
  ans: 1.0
  tol: 0.01
  verify: 400*4e-7*Math.PI*1000*2
  sol: |
    (a) $H = nI = 1000\times2.0 = 2\times10^{3}$ A m⁻¹, independent of the core material.

    (c) $B = \mu_r\mu_0H = 400\times4\pi\times10^{-7}\times2\times10^{3} = 1.0$ T.

    (b) $M = \dfrac{B - \mu_0H}{\mu_0} = (\mu_r - 1)H = 399\times H \approx 8\times10^{5}$ A m⁻¹.

    (d) The magnetising current is the extra current that would be needed in the windings, in the absence of the core, to give the same $B$: $B = \mu_0n(I + I_M)$. With $B = 1$ T and $I = 2$ A this gives $I_M \approx 794$ A.

    **Notes on the printed text.** (1) The question lists the parts as (b) M and (c) B, but the book's solution labels B as (b) and M as (c); I follow the order of the question above. (2) The book's expression for the magnetising current is printed as $B = \mu_r n(I + I_M)$; the numbers (794 A) correspond to $\mu_0$, not $\mu_r$, so "$\mu_r$" looks like a typographical error. [Inference]
  check: code

- id: f1
  lvl: found
