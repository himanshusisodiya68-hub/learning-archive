- id: m2
  lvl: main
  kind: num
  q: By Curie's law the susceptibility of a paramagnetic sample is inversely proportional to the absolute temperature. If χ = 1.2 × 10⁻⁵ at 300 K, find χ at 200 K. (Original problem.)
  ask: χ at 200 K
  unit: ""
  ans: 1.8e-5
  tol: 1e-8
  verify: 1.2e-5*300/200
  sol: $\chi\propto 1/T$, so $\chi_{200} = 1.2\times10^{-5}\times\dfrac{300}{200} = 1.8\times10^{-5}$.
