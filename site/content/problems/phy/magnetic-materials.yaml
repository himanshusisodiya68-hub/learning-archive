- id: b1
  lvl: board
  kind: num
  q: A material has susceptibility χ = 2 × 10⁻⁵. Find its relative permeability. (Original problem.)
  ask: Relative permeability
  unit: ""
  ans: 1.00002
  tol: 0.000001
  verify: 1+2e-5
  sol: $\mu_r = 1 + \chi = 1.00002$. A small positive χ means a paramagnetic material, with $\mu_r$ barely above 1.
  check: code

- id: b2
  lvl: board
  kind: text
  q: Distinguish diamagnetic, paramagnetic and ferromagnetic substances by their susceptibility and behaviour in a non-uniform field. (Original problem.)
  sol: |
    Diamagnetic: χ small and negative; weakly repelled (moves towards the weaker field). Paramagnetic: χ small and positive; weakly attracted (towards the stronger field); χ falls as temperature rises (Curie's law). Ferromagnetic: χ large and positive; strongly attracted, and shows hysteresis; loses its ferromagnetism above the Curie temperature.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A solenoid with 2000 turns per metre carries 1 A. With an iron core the field inside is 0.8 T. Find the relative permeability of the core. (Original problem.)
  ask: Relative permeability
  unit: ""
  ans: 318.3
  tol: 0.5
  verify: 0.8/(4e-7*Math.PI*2000*1)
  sol: $B = \mu_r\mu_0nI$, so $\mu_r = \dfrac{B}{\mu_0nI} = \dfrac{0.8}{4\pi\times10^{-7}\times2000\times1} = 318$.
  check: code

- id: m2
  lvl: main
  kind: num
  q: By Curie's law the susceptibility of a paramagnetic sample is inversely proportional to the absolute temperature. If χ = 1.2 × 10⁻⁵ at 300 K, find χ at 200 K. (Original problem.)
  ask: χ at 200 K
  unit: ""
  ans: 1.8e-5
  tol: 1e-8
  verify: 1.2e-5*300/200
  sol: $\chi\propto 1/T$, so $\chi_{200} = 1.2\times10^{-5}\times\dfrac{300}{200} = 1.8\times10^{-5}$.
  check: code
