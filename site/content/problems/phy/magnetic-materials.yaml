  q: A material with a small positive susceptibility that is weakly attracted by a magnet is
  opts: ["diamagnetic", "paramagnetic", "ferromagnetic", "an insulator"]
  ans: 1
  sol: Paramagnetic materials have small positive χ and are weakly attracted; diamagnetic materials have negative χ and are weakly repelled; ferromagnetic materials have large positive χ.
