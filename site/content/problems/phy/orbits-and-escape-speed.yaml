# Orbits and escape speed (satellites, orbital speed, energy, geostationary orbit, escape speed). NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27), Ch 7 (Example 7.4; Exercises 7.6, 7.7, 7.9, 7.18, 7.19); the book has no in-text questions. Found, board and main problems are original.

- id: ncert11-eg-7-4
  lvl: ncert-intext
  num: "XI Ex 7.4"
  source: NCERT XI Physics · Ch 7 · Example 7.4
  kind: proof
  q: Two uniform solid spheres of equal radii $R$, but mass $M$ and $4M$ have a centre to centre separation $6R$, as shown in Fig. 7.10. The two spheres are held fixed. A projectile of mass $m$ is projected from the surface of the sphere of mass $M$ directly towards the centre of the second sphere. Obtain an expression for the minimum speed $v$ of the projectile so that it reaches the surface of the second sphere.
  hints:
    - The projectile feels two opposite pulls. Find the neutral point N where they cancel; beyond N the heavier sphere wins.
    - The projectile only needs to reach N with (almost) zero speed. Compare the mechanical energy at the surface of $M$ with that at N.
    - Distances: N is $2R$ from the centre of $M$ and $4R$ from the centre of $4M$; the surface of $M$ is $5R$ from the centre of $4M$.
  sol: |
    **Neutral point.** If N is at distance $r$ from the centre of $M$, the pulls cancel when
    $$\frac{GMm}{r^2} = \frac{4GMm}{(6R-r)^2}\;\Rightarrow\;(6R-r)^2 = 4r^2\;\Rightarrow\;6R - r = \pm2r,$$
    so $r = 2R$ or $r = -6R$. The root $-6R$ lies on the far side of $M$ and does not matter here: $r = 2R$.

    Up to N the lighter sphere's pull dominates (it slows the projectile); beyond N the heavier sphere's pull dominates. So the projectile only needs enough speed to *reach* N; after that the pull of $4M$ carries it on to the second sphere.

    **Energy at the surface of $M$** (distance $R$ from $M$'s centre and $5R$ from $4M$'s centre):
    $$E_i = \tfrac12mv^2 - \frac{GMm}{R} - \frac{4GMm}{5R}.$$
    **Energy at N** (speed approaches zero; $2R$ from $M$, $4R$ from $4M$):
    $$E_N = -\frac{GMm}{2R} - \frac{4GMm}{4R}.$$
    Setting $E_i = E_N$:
    $$\tfrac12v^2 = \frac{GM}{R}\left(1 + \frac45 - \frac12 - 1\right) = \frac{GM}{R}\left(\frac45 - \frac12\right) = \frac{3GM}{10R},$$
    $$\boxed{\,v = \sqrt{\frac{3GM}{5R}}\,}.$$

    **Extension (ours, not in the book).** The book notes that the speed on reaching the heavier sphere is non-zero and leaves it as an exercise. At the surface of $4M$ the projectile is $5R$ from $M$'s centre and $R$ from $4M$'s centre, so $\tfrac12v'^2 - \dfrac{GM}{5R} - \dfrac{4GM}{R} = -\dfrac{3GM}{2R}$, giving $v' = \sqrt{27GM/5R}$, which is three times the launch speed.
  check: none

- id: ncert11-ex-7-6
  lvl: ncert-ex
  num: "XI 7.6"
  source: NCERT XI Physics · Ch 7 · Exercise 7.6
  kind: text
  q: |-
    Choose the correct alternative:
    (a) If the zero of potential energy is at infinity, the total energy of an orbiting satellite is negative of its kinetic/potential energy.
    (b) The energy required to launch an orbiting satellite out of earth's gravitational influence is more/less than the energy required to project a stationary object at the same height (as the satellite) out of earth's influence.
  sol: |
    **(a) kinetic energy.** For a circular orbit, gravity supplies the centripetal force: $mv^2/r = GMm/r^2$, so $K = \tfrac12mv^2 = GMm/2r$. The potential energy is $U = -GMm/r = -2K$. The total is $E = K + U = -K$, the negative of the kinetic energy (and half the potential energy).

    **(b) less.** To escape, the total energy must reach zero. The orbiting satellite has $E = -GMm/2r$, so it needs only $GMm/2r$. A stationary object at the same height has $E = -GMm/r$ and needs twice that, $GMm/r$. The satellite already carries some energy in its motion.
  answer_key: "(a) Kinetic energy, (b) less,"
  check: ncert-key

- id: ncert11-ex-7-7
  lvl: ncert-ex
  num: "XI 7.7"
  source: NCERT XI Physics · Ch 7 · Exercise 7.7
  kind: text
  q: Does the escape speed of a body from the earth depend on (a) the mass of the body, (b) the location from where it is projected, (c) the direction of projection, (d) the height of the location from where the body is launched?
  sol: |
    The escape speed comes from $\tfrac12mv^2 = GMm/r$ at the launch point, so $v_e = \sqrt{2GM/r}$.

    - **(a) No.** $m$ cancels from both sides.
    - **(b) No** (in the book's sense): it does not depend on *where on the Earth's surface* you launch, apart from tiny effects below.
    - **(c) No.** Energy is a scalar, so the direction of projection does not matter (as long as the path does not hit the Earth).
    - **(d) Yes.** It depends on the distance $r$ from the Earth's centre, so it decreases with height.

    [Note] The book's key adds that escape speed depends on the gravitational potential at the launch point; since this varies slightly with latitude and height, the escape speed varies slightly too. So (b) is "No" to a good approximation, and (d) is "Yes" because height changes $r$.
  answer_key: |-
    (a) No, (b) No, (c) No, (d) Yes
    [The escape velocity is independent of mass of the body and the direction of projection. It depends upon the gravitational potential at the point from where the body is launched. Since this potential depends (slightly) on the latitude and height of the point, the escape velocity (speed) depends (slightly) on these factors.]
  check: ncert-key

- id: ncert11-ex-7-9
  lvl: ncert-ex
  num: "XI 7.9"
  source: NCERT XI Physics · Ch 7 · Exercise 7.9
  kind: text
  q: Which of the following symptoms is likely to afflict an astronaut in space (a) swollen feet, (b) swollen face, (c) headache, (d) orientational problem.
  sol: |
    Likely: **(b) swollen face, (c) headache, (d) orientational problem.** Not likely: (a) swollen feet.

    In orbit the astronaut and the craft are in free fall, so there is no "weight" pressing the body down. On Earth, gravity pulls blood and body fluid towards the feet; in space the fluid shifts towards the head, causing a puffy face and headache. The inner ear (which senses up and down through gravity) gets no usual signal, so orientation and balance are confused. Swollen feet, caused by fluid pooling downwards, do not occur.
  answer_key: (b), (c) and (d)
  check: ncert-key

- id: ncert11-ex-7-18
  lvl: ncert-ex
  num: "XI 7.18"
  source: NCERT XI Physics · Ch 7 · Exercise 7.18
  kind: num
  q: The escape speed of a projectile on the earth's surface is 11.2 km s⁻¹. A body is projected out with thrice this speed. What is the speed of the body far away from the earth? Ignore the presence of the sun and other planets.
  ask: Speed far away from the Earth
  unit: km/s
  ans: 31.68
  tol: 0.05
  verify: sqrt(9-1)*11.2
  sol: |
    Let $v_e$ be the escape speed, so $\tfrac12mv_e^2 = GMm/R$. Launched with $v_i = 3v_e$, the energy is $\tfrac12mv_i^2 - GMm/R = \tfrac12m(9v_e^2) - \tfrac12mv_e^2 = \tfrac12m(8v_e^2)$. Far away the potential energy is zero, so
    $$\tfrac12mv_f^2 = \tfrac12m\,(v_i^2 - v_e^2)\;\Rightarrow\;v_f = \sqrt{8}\,v_e = 2.83\times11.2 = 31.7\ \text{km s}^{-1}.$$
    Note that the answer is not $3v_e - v_e = 2v_e$: speeds do not subtract, energies do.
  answer_key: 31.7 km/s
  check: both

- id: ncert11-ex-7-19
  lvl: ncert-ex
  num: "XI 7.19"
  source: NCERT XI Physics · Ch 7 · Exercise 7.19
  kind: num
  q: A satellite orbits the earth at a height of 400 km above the surface. How much energy must be expended to rocket the satellite out of the earth's gravitational influence? Mass of the satellite = 200 kg; mass of the earth = 6.0×10²⁴ kg; radius of the earth = 6.4 × 10⁶ m; $G$ = 6.67 × 10⁻¹¹ N m² kg⁻².
  ask: Energy required
  unit: × 10⁹ J
  ans: 5.885
  tol: 0.01
  verify: 6.67e-11*6e24*200/(2*(6.4e6+4e5))/1e9
  sol: |
    The orbit radius is $r = R + h = 6.4\times10^6 + 0.4\times10^6 = 6.8\times10^6$ m. For a circular orbit $K = GMm/2r$ and $U = -GMm/r$, so $E = -GMm/2r$. To escape, the total energy must become zero, so the energy to be supplied is
    $$\frac{GMm}{2r} = \frac{6.67\times10^{-11}\times6.0\times10^{24}\times200}{2\times6.8\times10^{6}} = 5.9\times10^{9}\ \text{J}.$$
  answer_key: 5.9 × 10⁹ J
  check: both

- id: f1
  lvl: found
  kind: mcq
  q: A satellite is moved from a circular orbit of radius $r$ to a circular orbit of radius $4r$. Its orbital speed becomes
  opts: ["twice as large", "the same", "half as large", "one quarter"]
  ans: 2
  sol: For a circular orbit $v = \sqrt{GM/r}$, so quadrupling $r$ halves $v$. The satellite moves more slowly in a higher orbit, even though it had to speed up to climb there.
  check: none

- id: f2
  lvl: found
  kind: mcq
  q: A geostationary satellite stays over the same point of the ground because it
  opts: ["has no gravity acting on it", "orbits above the equator in the Earth's rotation direction with a period of about 24 hours", "orbits over the poles"]
  ans: 1
  sol: Its orbit lies in the equatorial plane, goes the same way as the Earth turns, and takes one sidereal day (about 23 h 56 min). At that period it keeps pace with the ground below it. The orbit radius that gives this period is about 42,000 km from the Earth's centre.
  check: none

- id: f3
  lvl: found
  kind: mcq
  q: The escape speed of a rocket from the Earth's surface depends on
  opts: ["the rocket's mass", "the Earth's mass and radius, not the rocket's mass", "the direction in which the rocket is fired, always"]
  ans: 1
  sol: $v_e = \sqrt{2GM/R}$ depends only on the Earth's mass and radius. The rocket's mass cancels, and the direction does not matter because energy is a scalar.
  check: none

- id: b1
  lvl: board
  kind: num
  q: Find the orbital speed of a satellite orbiting very close to the Earth's surface. Take $g = 9.8$ m/s² and $R = 6.4\times10^6$ m.
  ask: Orbital speed
  unit: km/s
  ans: 7.92
  tol: 0.01
  verify: sqrt(9.8*6.4e6)/1000
  sol: |
    Gravity provides the centripetal force: $mg = mv^2/R$, so $v = \sqrt{gR} = \sqrt{9.8\times6.4\times10^6} = 7.9\times10^3$ m/s. This is the first cosmic speed. The period is $2\pi R/v \approx 85$ minutes.
  check: code

- id: b2
  lvl: board
  kind: num
  q: Find the period of a satellite in a circular orbit 400 km above the Earth's surface. Take $g = 9.8$ m/s² and $R = 6.4\times10^6$ m.
  ask: Period
  unit: minutes
  ans: 92.68
  tol: 0.1
  verify: 2*PI*sqrt((6.8e6)**3/(9.8*(6.4e6)**2))/60
  sol: $GM = gR^2$ and $T = 2\pi\sqrt{r^3/GM}$ with $r = 6.8\times10^6$ m, so $T = 2\pi\sqrt{(6.8\times10^6)^3/(9.8\times(6.4\times10^6)^2)} = 5560$ s $\approx 92.7$ minutes. A space station at this height sees about 15.5 sunrises a day.
  check: code

- id: b3
  lvl: board
  kind: num
  q: A geostationary satellite has a period of 86164 s (one sidereal day). Using $GM_E = 3.986\times10^{14}$ m³/s² and $R_E = 6378$ km, find its height above the Earth's surface.
  ask: Height above the surface
  unit: km
  ans: 35786
  tol: 30
  verify: (cbrt(3.986e14*86164**2/(4*PI**2))-6.378e6)/1000
  sol: |
    Gravity gives the centripetal force: $GM/r^2 = (2\pi/T)^2 r$, so $r^3 = GMT^2/4\pi^2 = 3.986\times10^{14}\times(86164)^2/39.48 = 7.495\times10^{22}$ m³ and $r = 4.216\times10^7$ m. The height is $r - R_E = 4.216\times10^7 - 0.638\times10^7 = 3.58\times10^7$ m $= 35{,}786$ km.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A 1000 kg satellite is in a circular orbit of radius $7.0\times10^6$ m about the Earth. Using $GM_E = 3.986\times10^{14}$ m³/s², find its total mechanical energy, with zero potential energy at infinity.
  ask: Total energy
  unit: × 10¹⁰ J
  ans: -2.847
  tol: 0.005
  verify: -3.986e14*1000/(2*7e6)/1e10
  sol: $E = -GMm/2r = -3.986\times10^{14}\times1000/(2\times7.0\times10^6) = -2.85\times10^{10}$ J. The kinetic energy is $+2.85\times10^{10}$ J and the potential energy is $-5.69\times10^{10}$ J. The negative total says the satellite is bound.
  check: code

- id: m2
  lvl: main
  kind: num
  q: The Moon has 1/81 of the Earth's mass and 0.27 of its radius. If the Earth's escape speed is 11.2 km/s, find the escape speed from the Moon's surface.
  ask: Escape speed from the Moon
  unit: km/s
  ans: 2.395
  tol: 0.01
  verify: 11.2*sqrt((1/81)/0.27)
  sol: $v_e \propto \sqrt{M/R}$, so $v_{Moon} = 11.2\times\sqrt{(1/81)/0.27} = 11.2\times0.2138 = 2.4$ km/s. This is low enough that the Moon cannot hold gas molecules whose speeds in the upper tail exceed it, which is why it has no atmosphere.
  check: code

- id: m3
  lvl: main
  kind: text
  q: A satellite in a low circular orbit slowly loses energy to air drag. Explain why its speed increases as it spirals inward, and why this does not break the law of conservation of energy.
  sol: |
    In a circular orbit $v = \sqrt{GM/r}$, so a smaller radius means a larger speed. The total energy is $E = -GMm/2r$. Drag does negative work, so $E$ becomes more negative, which means $r$ becomes smaller.

    As $r$ shrinks, the potential energy $-GMm/r$ drops by *twice* as much as the total energy does, since $U = 2E$. Half of that fall in $U$ is lost to drag (heat in the air) and the other half appears as extra kinetic energy: $K = -E$ grows when $E$ becomes more negative. Gravity does more positive work than drag takes away.

    Energy is conserved: the loss of orbital energy goes into heating the air. The speed rises because the satellite falls deeper into the potential well.
  check: none

- id: m4
  lvl: main
  kind: num
  q: A satellite orbits just above the Earth's surface in a circular orbit. By how much must its speed be increased for it to escape? Take $g = 9.8$ m/s² and $R = 6.4\times10^6$ m.
  ask: Increase in speed
  unit: km/s
  ans: 3.28
  tol: 0.01
  verify: (sqrt(2)-1)*sqrt(9.8*6.4e6)/1000
  sol: The circular speed is $v_c = \sqrt{gR} = 7.92$ km/s and the escape speed is $v_e = \sqrt{2gR} = \sqrt2\,v_c = 11.2$ km/s, so the extra speed needed is $(\sqrt2 - 1)v_c = 0.414\times7.92 = 3.28$ km/s. In any circular orbit, the escape speed is always $\sqrt2$ times the orbital speed there.
  check: code
