  q: Find the field at the centre of a single circular loop of radius 5 cm carrying 2 A. (Original problem.)
  ask: Field
  unit: µT
  ans: 25.13
  tol: 0.02
  verify: 4e-7*Math.PI*2/(2*0.05)*1e6
  sol: $B = \dfrac{\mu_0I}{2R} = \dfrac{4\pi\times10^{-7}\times2}{2\times0.05} = 2.5\times10^{-5}$ T $= 25$ µT.
