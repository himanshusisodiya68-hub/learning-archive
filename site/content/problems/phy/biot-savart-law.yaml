# Biot–Savart law. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 4, §4.4–4.5 and Exercise 4.1. Figure details in [brackets] were added by the archive. Found, board and main problems are original.

- id: ncert12-eg-4-4
  lvl: ncert-intext
  num: "XII Ex 4.4"
  source: NCERT XII Physics · Ch 4 · Example 4.4
  kind: num
  q: An element ∆l = ∆x î is placed at the origin and carries a large current I = 10 A (Fig. 4.8). What is the magnetic field on the y-axis at a distance of 0.5 m. ∆x = 1 cm.
  ask: Magnitude of the field
  unit: T
  ans: 4e-8
  tol: 1e-10
  verify: 1e-7*10*1e-2/0.5**2
  sol: |
    By the Biot–Savart law, $|d\mathbf B| = \dfrac{\mu_0}{4\pi}\dfrac{I\,dl\sin\theta}{r^2}$. Here $dl = 10^{-2}$ m, $I = 10$ A, $r = y = 0.5$ m, $\theta = 90^\circ$, and $\mu_0/4\pi = 10^{-7}$ T m/A:

    $$dB = \frac{10^{-7}\times10\times10^{-2}}{(0.5)^2} = 4\times10^{-8}\ \text{T}.$$

    The direction is $+z$, since $d\mathbf l\times\mathbf r = \Delta x\,\hat i\times y\,\hat j = y\Delta x\,\hat k$. The field of one small element is small.
  check: code

- id: ncert12-eg-4-5
  lvl: ncert-intext
  num: "XII Ex 4.5"
  source: NCERT XII Physics · Ch 4 · Example 4.5
  kind: num
  q: A straight wire carrying a current of 12 A is bent into a semi-circular arc of radius 2.0 cm as shown in Fig. 4.11(a). Consider the magnetic field B at the centre of the arc. (a) What is the magnetic field due to the straight segments? (b) In what way the contribution to B from the semicircle differs from that of a circular loop and in what way does it resemble? (c) Would your answer be different if the wire were bent into a semi-circular arc of the same radius but in the opposite way as shown in Fig. 4.11(b)?
  ask: Field at the centre due to the semicircle, part (b)
  unit: T
  ans: 1.9e-4
  tol: 1e-5
  verify: 4e-7*Math.PI*12/(4*0.02)
  sol: |
    (a) For every element of the straight segments, $d\mathbf l$ and $\mathbf r$ are parallel (the centre lies on their line), so $d\mathbf l\times\mathbf r = 0$: the straight parts contribute **nothing**.

    (b) For all elements of the semicircle $d\mathbf l\times\mathbf r$ points the same way (into the page in Fig. 4.11(a)), so the contributions add. The magnitude is half that of a full circular loop, $B = \dfrac12\cdot\dfrac{\mu_0I}{2R} = \dfrac{\mu_0I}{4R} = \dfrac{4\pi\times10^{-7}\times12}{4\times0.02} = 1.9\times10^{-4}$ T, directed normal to the plane, into it (by the right-hand rule). It resembles the loop in direction and in the $\mu_0I/R$ dependence.

    (c) The magnitude is the same but the direction is opposite, since the current in the arc circulates the other way: out of the page.
  check: code

- id: ncert12-eg-4-6
  lvl: ncert-intext
  num: "XII Ex 4.6"
  source: NCERT XII Physics · Ch 4 · Example 4.6
  kind: num
  q: Consider a tightly wound 100 turn coil of radius 10 cm, carrying a current of 1 A. What is the magnitude of the magnetic field at the centre of the coil?
  ask: Field at the centre
  unit: T
  ans: 6.28e-4
  tol: 1e-6
  verify: 4e-7*Math.PI*100*1/(2*0.1)
  sol: |
    The coil is tightly wound, so each turn has the same radius $R = 0.1$ m, and the field of $N$ turns is $N$ times that of one: $B = \dfrac{\mu_0NI}{2R} = \dfrac{4\pi\times10^{-7}\times100\times1}{2\times0.1} = 2\pi\times10^{-4} = 6.28\times10^{-4}$ T.
  check: code

