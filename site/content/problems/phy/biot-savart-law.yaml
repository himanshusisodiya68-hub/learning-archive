- id: b1
  lvl: board
  kind: num
  q: A circular loop of radius 10 cm carries 5 A. Find the magnetic field on its axis at 10 cm from the centre. (Original problem.)
  ask: Field on the axis
  unit: µT
  ans: 11.107
  tol: 0.01
  verify: 4e-7*Math.PI*5*0.1**2/(2*(0.1**2+0.1**2)**1.5)*1e6
  sol: $B = \dfrac{\mu_0IR^2}{2(R^2+x^2)^{3/2}} = \dfrac{4\pi\times10^{-7}\times5\times(0.1)^2}{2(0.02)^{3/2}} = 1.1\times10^{-5}$ T $= 11$ µT, along the axis.
  check: code

