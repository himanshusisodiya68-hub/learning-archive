# Power. NCERT questions copied word for word from NCERT Exploration Grade 9 Science (2026-27) Ch 7 §7.5 and Revise, Reflect, Refine, and NCERT Physics Class XI (reprint 2026-27) Ch 5 (§5.10 and Exercises). Found, board and main problems are original.

- id: ncert9-eg-7-10
  lvl: ncert-intext
  num: "IX Ex 7.10"
  source: NCERT Grade 9 Science · Ch 7 · Example 7.10
  kind: num
  q: A weightlifter lifts a 75 kg mass by 2 m in 5 seconds. How much power would she require for this task?
  ask: Power required
  unit: W
  ans: 300
  tol: 0.5
  verify: 75*10*2/5
  sol: |
    Taking $g = 10\ \text{m s}^{-2}$, the work done is $mgh = 75\times10\times2 = 1500$ J. The power is
    $$P = \frac{W}{t} = \frac{1500}{5} = 300\ \text{W}.$$
  check: code

- id: ncert9-eg-7-11
  lvl: ncert-intext
  num: "IX Ex 7.11"
  source: NCERT Grade 9 Science · Ch 7 · Example 7.11
  kind: num
  q: A car of mass 1000 kg starts from rest and reaches a speed of 72 km h$^{-1}$ in 10 seconds. Calculate the power of the engine required to achieve this start.
  ask: Power of the engine
  unit: W
  ans: 20000
  tol: 10
  verify: (0.5*1000*20**2)/10
  sol: |
    $v = 72\ \text{km h}^{-1} = 20\ \text{m s}^{-1}$, $u = 0$. By the work-energy theorem the work done by the engine in 10 s equals the gain in kinetic energy:
    $$W = \tfrac12(1000)(20)^2 - 0 = 200\,000\ \text{J}.$$
    $$P = \frac{W}{t} = \frac{200\,000}{10} = 20\,000\ \text{W} = 20\ \text{kW}.$$
    This is the *average* power. The power needed at the end, when $v = 20$ m/s, is higher if the acceleration is constant (here, $F v = 2000\times20 = 40$ kW).
  check: code

- id: ncert9-ex-7-6
  lvl: ncert-ex
  num: "IX 7 · Q6"
  source: NCERT Grade 9 Science · Ch 7 · Revise, Reflect, Refine Q6
  kind: text
  q: A crane lifts a mass $m$ to the 10th floor of a building in a certain time. It then raises the same mass to the 20th floor of the same building in double the time. How much more energy and power are required? Assume that the height of all floors is equal.
  sol: |
    Let each floor be of height $a$, and the first lift take time $t$.

    **Energy.** The potential energy gained is $mgh$ with $h$ proportional to the number of floors. Lifting to the 20th floor needs $mg(20a)$, which is **twice** the $mg(10a)$ needed for the 10th floor. So twice the energy is required (that is, $10mga$ more).

    **Power.** For the first lift $P_1 = \dfrac{10mga}{t}$. For the second, $P_2 = \dfrac{20mga}{2t} = \dfrac{10mga}{t}$. The power is the **same**; no more power is required. The work doubles, but so does the time.

    [Inference] Both lifts are taken to start from the ground floor; if the second lift only covered the 10 floors from the 10th to the 20th, the energy would equal that of the first lift and the power would be half, but the wording ("raises the same mass to the 20th floor") points to a fresh lift from the ground.
  check: none

- id: ncert11-eg-5-10
  lvl: ncert-intext
  num: "XI Ex 5.10"
  source: NCERT XI Physics · Ch 5 · Example 5.10
  kind: num
  q: An elevator can carry a maximum load of 1800 kg (elevator + passengers) is moving up with a constant speed of 2 m s$^{-1}$. The frictional force opposing the motion is 4000 N. Determine the minimum power delivered by the motor to the elevator in watts as well as in horse power.
  ask: Minimum power delivered by the motor
  unit: W
  ans: 44000
  tol: 50
  verify: (1800*10+4000)*2
  sol: |
    The elevator moves at constant speed, so the net force on it is zero. The motor's pull must balance the weight and the friction. The downward force on the elevator is
    $$F = mg + F_f = (1800\times10) + 4000 = 22\,000\ \text{N}.$$
    The power is
    $$P = \mathbf F\cdot\mathbf v = 22\,000\times2 = 44\,000\ \text{W} = \frac{44\,000}{746}\ \text{hp} \approx 59\ \text{hp}.$$
    (Taking $g = 10\ \text{m s}^{-2}$ as the book does; 1 hp = 746 W.)
  check: code

- id: ncert11-ex-5-9
  lvl: ncert-ex
  num: "XI 5.9"
  source: NCERT XI Physics · Ch 5 · Exercise 5.9
  kind: mcq
  q: A body is initially at rest. It undergoes one-dimensional motion with constant acceleration. The power delivered to it at time $t$ is proportional to
  opts: ["$t^{1/2}$", "$t$", "$t^{3/2}$", "$t^2$"]
  ans: 1
  sol: |
    With constant acceleration $a$ from rest, $v = at$ and the force $F = ma$ is constant. The instantaneous power is
    $$P = Fv = (ma)(at) = ma^2t \ \propto\ t.$$
    The answer is **(ii) $t$**.
  answer_key: (b) t
  check: ncert-key

- id: ncert11-ex-5-10
  lvl: ncert-ex
  num: "XI 5.10"
  source: NCERT XI Physics · Ch 5 · Exercise 5.10
  kind: mcq
  q: A body is moving unidirectionally under the influence of a source of constant power. Its displacement in time $t$ is proportional to
  opts: ["$t^{1/2}$", "$t$", "$t^{3/2}$", "$t^2$"]
  ans: 2
  sol: |
    Constant power $P$ means $P = Fv = mv\,\dfrac{dv}{dt}$, so $\dfrac{d}{dt}\left(\tfrac12mv^2\right) = P$ and, starting from rest, $\tfrac12mv^2 = Pt$, i.e. $v = \sqrt{2P/m}\;t^{1/2}$.

    The displacement is $x = \int v\,dt = \sqrt{2P/m}\int t^{1/2}dt = \tfrac23\sqrt{2P/m}\;t^{3/2}$, so $x \propto t^{3/2}$. The answer is **(iii) $t^{3/2}$**.

    [Inference] The body is taken to start from rest; the question does not say so, but without it the proportionality does not hold.
  answer_key: (c) t3/2
  check: ncert-key

- id: ncert11-ex-5-15
  lvl: ncert-ex
  num: "XI 5.15"
  source: NCERT XI Physics · Ch 5 · Exercise 5.15
  kind: num
  q: A pump on the ground floor of a building can pump up water to fill a tank of volume 30 m$^3$ in 15 min. If the tank is 40 m above the ground, and the efficiency of the pump is 30%, how much electric power is consumed by the pump ?
  ask: Electric power consumed
  unit: kW
  ans: 43.6
  tol: 0.1
  verify: 30*1000*9.8*40/900/0.3/1000
  sol: |
    Mass of water: $m = 30\ \text{m}^3\times1000\ \text{kg m}^{-3} = 3\times10^4$ kg (assuming the density of water, 1000 kg m$^{-3}$).

    Work done against gravity: $W = mgh = 3\times10^4\times9.8\times40 = 1.176\times10^7$ J.

    Useful (output) power: $P_{out} = W/t = \dfrac{1.176\times10^7}{900} = 1.307\times10^4$ W.

    The efficiency is $0.30 = P_{out}/P_{in}$, so
    $$P_{in} = \frac{1.307\times10^4}{0.30} = 4.36\times10^4\ \text{W} = 43.6\ \text{kW}.$$
  answer_key: 43.6 kW
  check: both

- id: ncert11-ex-5-21
  lvl: ncert-ex
  num: "XI 5.21"
  source: NCERT XI Physics · Ch 5 · Exercise 5.21
  kind: num
  q: The blades of a windmill sweep out a circle of area $A$. (a) If the wind flows at a velocity $v$ perpendicular to the circle, what is the mass of the air passing through it in time $t$ ? (b) What is the kinetic energy of the air ? (c) Assume that the windmill converts 25% of the wind's energy into electrical energy, and that $A = 30\ \text{m}^2$, $v = 36$ km/h and the density of air is 1.2 kg m$^{-3}$. What is the electrical power produced ?
  ask: Electrical power produced (part c)
  unit: W
  ans: 4500
  tol: 5
  verify: 0.25*0.5*1.2*30*(36/3.6)**3
  sol: |
    (a) In time $t$ the air that passes through the circle fills a cylinder of base area $A$ and length $vt$, so its volume is $Avt$ and its mass is
    $$m = \rho A v t.$$

    (b) All of this air moves with speed $v$, so
    $$K = \tfrac12mv^2 = \tfrac12\rho A v^3 t.$$

    (c) The wind's power is $K/t = \tfrac12\rho Av^3$. With $v = 36\ \text{km/h} = 10\ \text{m s}^{-1}$:
    $$\tfrac12(1.2)(30)(10)^3 = 1.8\times10^4\ \text{W}.$$
    At 25% conversion the electrical power is $P = 0.25\times1.8\times10^4 = 4.5\times10^3\ \text{W} = 4.5$ kW.

    Note the $v^3$ dependence: doubling the wind speed gives 8 times the power.
  answer_key: "(a) m = ρ A v t (b) K = ρ A v³ t / 2 (c) P = 4.5 kW"
  check: both

- id: ncert11-ex-5-22
  lvl: ncert-ex
  num: "XI 5.22"
  source: NCERT XI Physics · Ch 5 · Exercise 5.22
  kind: num
  q: A person trying to lose weight (dieter) lifts a 10 kg mass, one thousand times, to a height of 0.5 m each time. Assume that the potential energy lost each time she lowers the mass is dissipated. (a) How much work does she do against the gravitational force ? (b) Fat supplies $3.8\times10^7$ J of energy per kilogram which is converted to mechanical energy with a 20% efficiency rate. How much fat will the dieter use up?
  ask: Fat used up (part b)
  unit: g
  ans: 6.45
  tol: 0.01
  verify: 1000*10*9.8*0.5/0.2/3.8e7*1000
  sol: |
    (a) Each lift does $mgh = 10\times9.8\times0.5 = 49$ J, so for 1000 lifts
    $$W = 1000\times49 = 4.9\times10^4\ \text{J}.$$
    (The potential energy lost on lowering is dissipated, so it is not recovered.)

    (b) Fat provides $3.8\times10^7$ J/kg but only 20% of it becomes mechanical energy, so the chemical energy needed is
    $$\frac{4.9\times10^4}{0.20} = 2.45\times10^5\ \text{J}.$$
    Mass of fat: $\dfrac{2.45\times10^5}{3.8\times10^7} = 6.45\times10^{-3}\ \text{kg} = 6.45\ \text{g}.$
  answer_key: "(a) 49,000 J (b) 6.45 × 10-3 kg"
  check: both

- id: ncert11-ex-5-23
  lvl: ncert-ex
  num: "XI 5.23"
  source: NCERT XI Physics · Ch 5 · Exercise 5.23
  kind: num
  q: A family uses 8 kW of power. (a) Direct solar energy is incident on the horizontal surface at an average rate of 200 W per square meter. If 20% of this energy can be converted to useful electrical energy, how large an area is needed to supply 8 kW? (b) Compare this area to that of the roof of a typical house.
  ask: Area needed (part a)
  unit: m²
  ans: 200
  tol: 0.5
  verify: 8000/(0.2*200)
  sol: |
    (a) Useful electrical power per square metre: $0.20\times200 = 40\ \text{W m}^{-2}$. The area needed is
    $$A = \frac{8000}{40} = 200\ \text{m}^2.$$

    (b) This is about the size of the roof of a large house, say $14\ \text{m}\times14\ \text{m} = 196\ \text{m}^2$. So in principle the solar energy falling on a roof of that size could supply the family's needs, though the sun does not shine at night and the average rate varies with weather and season.
  answer_key: "(a) 200 m² (b) comparable to the roof of a large house of dimension 14m × 14m."
  check: both

