- id: m1
  lvl: main
  kind: num
  q: A 2.0 kW motor of efficiency 60% is used to lift water from a well 15 m deep. What mass of water can it lift in one minute? Take $g = 9.8\ \text{m s}^{-2}$ and ignore the kinetic energy of the water. (Original problem.)
  ask: Mass of water lifted per minute
  unit: kg
  ans: 490
  tol: 1
  verify: 2000*0.6*60/(9.8*15)
  sol: |
    Useful power $= 0.60\times2000 = 1200$ W, so in 60 s the useful work is $1200\times60 = 72\,000$ J. This equals $mgh$:
    $$m = \frac{72\,000}{9.8\times15} = 490\ \text{kg}.$$
  check: code

- id: m2
  lvl: main
  kind: num
  q: A car of mass 1200 kg accelerates from rest with a constant engine power of 30 kW. Ignoring all resistive forces, how long does it take to reach 20 m/s? (Original problem.)
  ask: Time to reach 20 m/s
  unit: s
  ans: 8
  tol: 0.01
  verify: 0.5*1200*20**2/30000
  sol: |
    With constant power and no resistance, the work done in time $t$ is $Pt$, which equals the kinetic energy gained:
    $$Pt = \tfrac12mv^2\ \Rightarrow\ t = \frac{\tfrac12(1200)(20)^2}{30\,000} = \frac{240\,000}{30\,000} = 8\ \text{s}.$$
    (The acceleration is not constant here: it is very large at the start, when $v$ is small, because $F = P/v$.)
  check: code

- id: m3
  lvl: main
  kind: num
  q: A constant force of 10 N acts on a 5 kg body, initially at rest. Find the instantaneous power delivered by the force at $t = 3.0$ s. What is the average power over these 3.0 s? (Original problem.)
  ask: Instantaneous power at t = 3 s
  unit: W
  ans: 60
  tol: 0.1
  verify: 10*(10/5*3)
  sol: |
    $a = F/m = 10/5 = 2\ \text{m s}^{-2}$, so at $t = 3$ s the speed is $v = at = 6\ \text{m s}^{-1}$ and
    $$P = Fv = 10\times6 = 60\ \text{W}.$$
    The distance covered is $\tfrac12at^2 = 9$ m, so the work done is $90$ J and the average power is $90/3 = 30$ W, half the final instantaneous value (since $P$ grows linearly with time).
  check: code

