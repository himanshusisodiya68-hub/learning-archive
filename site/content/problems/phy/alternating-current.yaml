# Alternating current and the AC generator; rms values. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 6 §6.8 (Example 6.10) and Ch 7 §7.1–7.3 and Exercises 7.1–7.2. Found, board and main problems are original.

- id: ncert12-eg-6-10
  lvl: ncert-intext
  num: "XII Ex 6.10"
  source: NCERT XII Physics · Ch 6 · Example 6.10
  kind: num
  q: Kamla peddles a stationary bicycle. The pedals of the bicycle are attached to a 100 turn coil of area 0.10 m². The coil rotates at half a revolution per second and it is placed in a uniform magnetic field of 0.01 T perpendicular to the axis of rotation of the coil. What is the maximum voltage generated in the coil?
  ask: Maximum voltage
  unit: V
  ans: 0.314
  tol: 0.001
  verify: 100*0.01*0.1*2*Math.PI*0.5
  sol: $\varepsilon_0 = NBA\omega = NBA(2\pi\nu) = 100\times0.01\times0.1\times2\times3.14\times0.5 = 0.314$ V. The emf varies as $\varepsilon_0\sin\omega t$, so 0.314 V is its peak value.
  check: code

- id: ncert12-eg-7-1
  lvl: ncert-intext
  num: "XII Ex 7.1"
  source: NCERT XII Physics · Ch 7 · Example 7.1
  kind: num
  q: A light bulb is rated at 100W for a 220 V supply. Find (a) the resistance of the bulb; (b) the peak voltage of the source; and (c) the rms current through the bulb.
  ask: Resistance of the bulb
  unit: Ω
  ans: 484
  tol: 0.5
  verify: 220**2/100
  sol: |
    (a) $R = V^2/P = (220)^2/100 = 484\ \Omega$.

    (b) The rated voltage is the rms value, so the peak voltage is $v_m = \sqrt2V = 311$ V.

    (c) $I = P/V = 100/220 = 0.454$ A (rms).
  check: code

- id: ncert12-ex-7-1
  lvl: ncert-ex
  num: "XII 7.1"
  source: NCERT XII Physics · Ch 7 · Exercise 7.1
  kind: num
  q: |-
    A 100 Ω resistor is connected to a 220 V, 50 Hz ac supply.
    (a) What is the rms value of current in the circuit?
    (b) What is the net power consumed over a full cycle?
  ask: rms current
  unit: A
  ans: 2.2
  tol: 0.001
  verify: 220/100
  sol: |
    (a) $I_{rms} = V_{rms}/R = 220/100 = 2.20$ A.

    (b) $P = I_{rms}^2R = (2.2)^2\times100 = 484$ W (equal to $V_{rms}^2/R$).
  answer_key: "(a) 2.20 A (b) 484 W"
  check: both

- id: ncert12-ex-7-2
  lvl: ncert-ex
  num: "XII 7.2"
  source: NCERT XII Physics · Ch 7 · Exercise 7.2
  kind: num
  q: |-
    (a) The peak voltage of an ac supply is 300 V. What is the rms voltage?
    (b) The rms value of current in an ac circuit is 10 A. What is the peak current?
  ask: rms voltage
  unit: V
  ans: 212.13
  tol: 0.05
  verify: 300/Math.SQRT2
  sol: |
    (a) $V_{rms} = V_0/\sqrt2 = 300/\sqrt2 = 212.1$ V.

    (b) $I_0 = \sqrt2I_{rms} = 10\sqrt2 = 14.1$ A.
  answer_key: "(a) 300/√2 = 212.1 V (b) 10√2 = 14.1 A"
  check: both

