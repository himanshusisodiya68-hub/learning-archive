- id: b2
  lvl: board
  kind: text
  q: An alternating current i = 5 sin(100πt) A flows in a resistor. State the frequency, the rms current and the current at t = 1/300 s. (Original problem.)
  sol: |
    $\omega = 100\pi$ rad/s, so $f = \omega/2\pi = 50$ Hz. $I_{rms} = 5/\sqrt2 = 3.54$ A. At $t = 1/300$ s: $i = 5\sin(100\pi/300) = 5\sin(\pi/3) = 4.33$ A.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A half-wave rectifier passes only the positive half of a sinusoidal current of peak 10 A. Find the rms value of the output. (Original problem.)
  ask: rms current
  unit: A
  ans: 5
  tol: 0.001
  verify: 10/2
  sol: |
    The mean square over a full period is $\tfrac12\times\overline{i^2}_{\text{positive half}}$: the current is zero for half the cycle, and over the other half the mean of $I_0^2\sin^2$ is $I_0^2/2$. So $\overline{i^2} = I_0^2/4$ and $I_{rms} = I_0/2 = 5$ A.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A heater draws the same heat from a 2 A direct current as from an alternating current of what peak value? (Original problem.)
  ask: Peak value
  unit: A
  ans: 2.828
  tol: 0.002
  verify: 2*Math.SQRT2
  sol: The rms value of the AC must equal the DC value, $I_{rms} = 2$ A, so the peak value is $I_0 = 2\sqrt2 = 2.83$ A. The rms value is defined as the DC that gives the same heating.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A generator coil has 50 turns, each 20 cm × 20 cm, and turns at 1500 rpm about an axis perpendicular to a uniform 0.5 T field. It drives a circuit whose total resistance (coil plus load) is 100 Ω. Ignoring friction, find the average mechanical power the turbine must supply. (Original problem.)
  ask: Average mechanical power
  unit: W
  ans: 123.37
  tol: 0.1
  verify: (50*0.5*0.04*2*Math.PI*25)**2/(2*100)
  sol: |
    $\omega = 2\pi \times 1500/60 = 50\pi$ rad/s and $A = 0.04$ m², so $\varepsilon_0 = NBA\omega = 50 \times 0.5 \times 0.04 \times 50\pi = 50\pi = 157.1$ V.

    The current $i = \varepsilon/R$ feels a torque $NiAB\sin\omega t$ opposing the rotation (Lenz's law). The turbine's power $\tau\omega = \varepsilon i = \varepsilon^2/R$, averaged over a cycle, is
    $$\bar P = \frac{\varepsilon_0^2}{2R} = \frac{(157.1)^2}{200} = 123.4\ \text{W}.$$
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A periodic voltage is +12 V for 2 ms and then −4 V for 6 ms, repeating. (a) Find its average value. (b) Find its rms value. (c) What would a rectifier-type meter, calibrated to read rms correctly for sine waves, show? (Original problem.)
  ask: rms value (b)
  unit: V
  ans: 6.928
  tol: 0.005
  verify: Math.sqrt((144*2+16*6)/8)
  sol: |
    Period $T = 8$ ms.

    (a) $\bar v = (12 \times 2 + (-4) \times 6)/8 = 0$.

    (b) $\overline{v^2} = (144 \times 2 + 16 \times 6)/8 = 384/8 = 48$ V², so $V_{rms} = \sqrt{48} = 6.93$ V.

    (c) The meter measures $\overline{|v|} = (12 \times 2 + 4 \times 6)/8 = 6$ V and multiplies by the sine form factor $\pi/(2\sqrt2) = 1.111$, showing $6.66$ V, about 4% below the true rms.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: Two AC sources of the same frequency, v₁ = 100 sin ωt V and v₂ = 100 sin(ωt + π/3) V, are connected in series. Find the rms value of the total voltage. (Original problem.)
  ask: rms of the sum
  unit: V
  ans: 122.47
  tol: 0.05
  verify: 2*100*Math.cos(Math.PI/6)/Math.SQRT2
  sol: |
    Add phasors: $A^2 = 100^2 + 100^2 + 2 \times 100 \times 100\cos60° = 30\,000$, so $A = 173.2$ V. (For equal phasors, $A = 2A_1\cos(\varphi/2) = 200\cos30°$.)

    The sum is $173.2\sin(\omega t + \pi/6)$ V, with rms $173.2/\sqrt2 = 122.5$ V. Adding the two rms values (141 V) would be wrong, because the sources are not in phase.
  check: code

- id: a4
  lvl: adv
  kind: num
  q: A voltage v = 6 + 8 sin ωt volts is applied across a 10 Ω resistor. Find the average power dissipated. (Original problem.)
  ask: Average power
  unit: W
  ans: 6.8
  tol: 0.001
  verify: (36+64/2)/10
  sol: |
    $\overline{v^2} = 6^2 + 2 \times 6 \times 8\,\overline{\sin\omega t} + 8^2\,\overline{\sin^2\omega t} = 36 + 0 + 32 = 68$ V².

    $\bar P = \overline{v^2}/R = 68/10 = 6.8$ W. The DC part alone gives 3.6 W and the AC part alone 3.2 W; they add because the cross term averages to zero. (Using $V_{rms} = 6 + 8/\sqrt2$ would give a wrong 16.0 W.)
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A full-wave rectifier delivers v = |10 sin ωt| volts. Regard this as a steady (DC) part plus a ripple whose average is zero. Find the rms value of the ripple. (Original problem.)
  ask: rms of the ripple
  unit: V
  ans: 3.0776
  tol: 0.002
  verify: 10*Math.sqrt(0.5-4/Math.PI**2)
  hints: ["The DC part is the average, 2V₀/π.", "The ripple r = v − v̄ has zero mean, so the cross term 2v̄·r̄ vanishes: mean of v² = v̄² + mean of r²."]
  sol: |
    DC part: $\bar v = 2V_0/\pi = 20/\pi = 6.366$ V. Full-wave rectification does not change $v^2$, so $\overline{v^2} = V_0^2/2 = 50$ V².

    Write $v = \bar v + r$ with $\bar r = 0$. Then $\overline{v^2} = \bar v^2 + 2\bar v\,\bar r + \overline{r^2} = \bar v^2 + \overline{r^2}$, so
    $$r_{rms} = \sqrt{\overline{v^2} - \bar v^2} = V_0\sqrt{\tfrac12 - \tfrac{4}{\pi^2}} = 10\sqrt{0.5 - 0.40528} = 3.08\ \text{V}.$$
    The ripple factor $r_{rms}/\bar v = 3.08/6.37 = 0.483$.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A balanced three-phase supply with 230 V rms per phase feeds three 46 Ω resistors connected in star, with the star point joined to the neutral wire. The fuse in one line blows, so that resistor carries no current. Find the rms current in the neutral wire. (Original problem.)
  ask: Neutral current (rms)
  unit: A
  ans: 5
  tol: 0.001
  verify: 230/46
  hints: ["Before the fuse blows, the three current phasors sum to zero.", "The neutral carries the phasor sum of the remaining two currents."]
  sol: |
    With the neutral connected, each remaining resistor still has its phase voltage across it, so each carries $230/46 = 5$ A rms, and the two currents are 120° apart.

    The neutral returns their phasor sum: $I_N^2 = 5^2 + 5^2 + 2 \times 5 \times 5\cos120° = 25$, so $I_N = 5$ A. Equivalently: the three balanced phasors summed to zero, so the sum of the remaining two equals minus the missing one, which has length 5 A.

    (If the neutral were also broken, the two resistors would be in series across the line voltage $\sqrt3 \times 230 = 398$ V, and each would get only 199 V.)
  check: code

- id: o3
  lvl: oly
  kind: num
  q: A 100-turn coil of area 0.01 m² rotates at 50 rev/s about an axis perpendicular to a magnetic field that is itself alternating, B = B₀ sin ωt with B₀ = 0.2 T and ω = 100π rad/s, the same ω as the rotation. The angle between the coil's normal and the field direction is ωt. Find the peak emf, and state its frequency. (Original problem.)
  ask: Peak emf
  unit: V
  ans: 62.83
  tol: 0.02
  verify: 100*0.01*0.2*2*Math.PI*50
  hints: ["Write the flux linkage as N A B₀ sin ωt cos ωt and use a double-angle identity.", "Does the answer depend on the phase between the rotation and the field?"]
  sol: |
    Flux linkage: $N\Phi = NAB_0\sin\omega t\cos\omega t = \tfrac12NAB_0\sin2\omega t$.

    $\varepsilon = -\dfrac{d(N\Phi)}{dt} = -NAB_0\omega\cos2\omega t$, so the peak is $NAB_0\omega = 100 \times 0.01 \times 0.2 \times 100\pi = 62.8$ V, at frequency $2\omega/2\pi = 100$ Hz.

    The peak is the same as for a steady field $B_0$, but the frequency is doubled. With any phase offset δ between rotation and field, $\sin\omega t\cos(\omega t + \delta) = \tfrac12[\sin(2\omega t + \delta) - \sin\delta]$; the constant term does not contribute to the emf, so the peak is still $NAB_0\omega$.
  check: code

- id: o4
  lvl: oly
  kind: num
  q: A lamp dimmer switches the 220 V (rms), 50 Hz mains on to a 484 Ω lamp only from phase angle 60° to 180° in each half-cycle (and from 240° to 360°), and off otherwise. Treating the lamp's resistance as constant, find the average power. (Original problem.)
  ask: Average power
  unit: W
  ans: 80.45
  tol: 0.05
  verify: 220**2/484*(Math.PI-Math.PI/3+Math.sin(2*Math.PI/3)/2)/Math.PI
  hints: ["By symmetry, average v² over one half-cycle, 0 to π.", "Integrate sin²x = ½(1 − cos 2x) from α to π."]
  sol: |
    $V_0^2 = 2 \times 220^2$. By symmetry average over $0 \le x \le \pi$ ($x = \omega t$), with conduction from $\alpha = \pi/3$:
    $$\overline{v^2} = \frac{V_0^2}{\pi}\int_\alpha^\pi\sin^2x\,dx = \frac{V_0^2}{2\pi}\Big[\pi - \alpha + \tfrac12\sin2\alpha\Big].$$
    So
    $$\bar P = \frac{\overline{v^2}}{R} = \frac{220^2}{484}\cdot\frac{\pi - \alpha + \tfrac12\sin2\alpha}{\pi} = 100 \times \frac{2.0944 + 0.4330}{3.1416} = 80.4\ \text{W}.$$
    Note the lamp is on for $2/3$ of the time but gets 80% of full power, because the part cut off is near the zero crossing, where little power flows. At $\alpha = 90°$ the formula gives exactly 50 W, as symmetry requires.
  check: code
