- id: b2
  lvl: board
  kind: text
  q: An alternating current i = 5 sin(100πt) A flows in a resistor. State the frequency, the rms current and the current at t = 1/300 s. (Original problem.)
  sol: |
    $\omega = 100\pi$ rad/s, so $f = \omega/2\pi = 50$ Hz. $I_{rms} = 5/\sqrt2 = 3.54$ A. At $t = 1/300$ s: $i = 5\sin(100\pi/300) = 5\sin(\pi/3) = 4.33$ A.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A half-wave rectifier passes only the positive half of a sinusoidal current of peak 10 A. Find the rms value of the output. (Original problem.)
  ask: rms current
  unit: A
  ans: 5
  tol: 0.001
  verify: 10/2
  sol: |
    The mean square over a full period is $\tfrac12\times\overline{i^2}_{\text{positive half}}$: the current is zero for half the cycle, and over the other half the mean of $I_0^2\sin^2$ is $I_0^2/2$. So $\overline{i^2} = I_0^2/4$ and $I_{rms} = I_0/2 = 5$ A.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A heater draws the same heat from a 2 A direct current as from an alternating current of what peak value? (Original problem.)
  ask: Peak value
  unit: A
  ans: 2.828
  tol: 0.002
  verify: 2*Math.SQRT2
  sol: The rms value of the AC must equal the DC value, $I_{rms} = 2$ A, so the peak value is $I_0 = 2\sqrt2 = 2.83$ A. The rms value is defined as the DC that gives the same heating.
  check: code
