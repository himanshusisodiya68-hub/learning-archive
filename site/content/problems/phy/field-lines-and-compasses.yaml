- id: b1
  lvl: board
  kind: text
  q: Describe an activity that shows that a current-carrying wire produces a magnetic field. How can the direction of that field be found? (Original problem.)
  sol: |
    Place a small compass near a straight wire connected to a battery through a key. When the key is closed the needle is deflected, showing a magnetic field around the wire (Oersted's observation). Reversing the current reverses the deflection. The direction of the field at a point is that of the north pole of the compass there, or can be found from the right-hand thumb rule. Iron filings sprinkled on a card through which the wire passes line up in concentric circles.
  check: none

- id: b2
  lvl: board
  kind: text
  q: How does the magnetic field of a solenoid compare with that of a bar magnet? What is an electromagnet? (Original problem.)
  sol: |
    The field pattern of a current-carrying solenoid is like that of a bar magnet: one end behaves as a north pole and the other as a south pole, and the lines inside are parallel straight lines (uniform field). An electromagnet is a soft-iron core placed inside a solenoid: the strong field of the coil magnetises the core, and it loses most of its magnetism when the current is switched off.
  check: none

- id: m1
  lvl: main
  kind: text
  q: Two long parallel straight wires carry equal currents in opposite directions. Sketch or describe the magnetic field at a point midway between them, and say how it differs from the case where the currents are in the same direction. (Original problem.)
  sol: |
    Midway between the wires, each wire's field points the same way for opposite currents (they add), so the field there is double that of one wire at that distance. For currents in the same direction, the fields at the midpoint are equal and opposite, so the field is zero at the midpoint. Use the right-hand rule for each wire.
  check: none

- id: m2
  lvl: main
  kind: mcq
  q: The direction of magnetic field lines is defined as the direction in which
  opts: ["a free north pole would tend to move", "a free south pole would tend to move", "a positive charge at rest would move", "a current element would move"]
  ans: 0
  sol: By convention the field direction at a point is that in which a north pole (of a compass needle) would be pushed.
  check: none
