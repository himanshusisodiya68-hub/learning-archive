  q: A current flows through a vertical straight wire towards the ceiling. Looking down from the ceiling, the field lines around it run
  opts: ["clockwise", "anticlockwise", "radially outward", "parallel to the wire"]
  ans: 1
  sol: |
    Right-hand thumb rule: thumb along the current (upward); the fingers curl anticlockwise when viewed from above (from the tip of the thumb).
