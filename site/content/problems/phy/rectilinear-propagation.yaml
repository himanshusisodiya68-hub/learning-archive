- id: c7-11-9
  lvl: ncert-ex
  num: "VII Q9"
  source: NCERT VII Curiosity · Ch 11 · Q9
  kind: text
  q: |
    Measure the length of your shadow at 9 AM, 12 PM, and 4 PM with the help of your friend. Write down your observations:
    (i) At which of the given times is your shadow the shortest?
    (ii) Why do you think this happens?
  sol: (i) At **12 PM**. (ii) Around noon the Sun is highest in the sky, so its rays come down most steeply and the shadow is shortest. In the morning and late afternoon the Sun is low, rays arrive at a shallow angle, and shadows are long.
  check: none

- id: c7-11-12
  lvl: ncert-ex
  num: "VII Q12"
  source: NCERT VII Curiosity · Ch 11 · Q12
  kind: text
  q: We do not see the shadow on the ground of a bird flying high in the sky. However, the shadow is seen on the ground when the bird swoops near the ground. Think and explain why it is so.
  sol: The Sun is not a point source; it is a large disc. A bird blocks the whole Sun only within a short cone behind it (the umbra), roughly 100 times the bird's size, a few tens of metres for a bird. Higher up, the ground sees most of the Sun around the bird, so there is only a faint, spread-out partial shadow (penumbra) that we do not notice. Near the ground the full, dark shadow reaches the ground.
  check: none

