- id: c7-11-5
  lvl: ncert-ex
  num: "VII Q5"
  source: NCERT VII Curiosity · Ch 11 · Q5
  kind: text
  q: "The shadow of a ball is formed on a wall by placing the ball in front of a fixed torch as shown in Fig. 11.18. In scenario (i) the ball is closer to the torch, while in scenario (ii) the ball is closer to the wall. Choose the most accurate representation of the shadows formed in both scenarios from the options provided (a and b). [Option (a) is a smaller shadow, option (b) a larger shadow.]"
  sol: Scenario (i), ball near the torch → (b), the larger shadow. Scenario (ii), ball near the wall → (a), the smaller shadow. Near the torch the ball blocks a wider cone of rays.
