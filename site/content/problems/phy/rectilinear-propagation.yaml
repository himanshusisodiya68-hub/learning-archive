- id: m1
  lvl: main
  kind: num
  q: A small bulb is 1.0 m from a ball 10 cm in diameter. A wall is 3.0 m from the bulb. What is the diameter of the ball's shadow on the wall?
  ask: Shadow diameter
  unit: cm
  ans: 30
  tol: 0.1
  verify: 10*3/1
  sol: Rays from a point source spread out in proportion to distance, so the shadow is $10 \times 3.0/1.0 = 30$ cm across.
  check: code

- id: m2
