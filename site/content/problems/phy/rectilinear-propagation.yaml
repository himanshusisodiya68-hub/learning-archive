  kind: text
  q: Suppose you view the tree shown in Fig. 11.19 through a pinhole camera. Sketch the outline of the image of the tree formed in the pinhole camera.
  sol: The image is the same outline turned upside down (and left–right swapped), with the crown at the bottom and the trunk at the top. Rays from the top of the tree pass straight through the hole to the bottom of the screen.
