# Rectilinear propagation. NCERT questions copied word for word from NCERT Curiosity, Grade 7 (reprint 2026-27), Ch 11.
# Figure-based questions carry a bracketed description of the figure, written from the printed page.

- id: c7-11-1
  lvl: ncert-ex
  num: "VII Q1"
  source: NCERT VII Curiosity · Ch 11 Light Shadows and Reflections · Q1
  kind: text
  q: Which of the following are luminous objects? Mars, Moon, Pole Star, Sun, Venus, Mirror
  sol: The **Pole Star** and the **Sun** are luminous; they are stars and give out their own light. Mars, the Moon and Venus only reflect sunlight, and a mirror only reflects light falling on it, so they are non-luminous.
  check: none

- id: c7-11-2
  lvl: ncert-ex
  num: "VII Q2"
  source: NCERT VII Curiosity · Ch 11 · Q2
  kind: text
  q: |
    Match the items in Column A with those in Column B.
    Column A: Pinhole camera; Opaque object; Transparent object; Shadow
    Column B: Blocks light completely; The dark region formed behind the object; Forms an inverted image; Light passes almost completely through it
  sol: Pinhole camera — forms an inverted image. Opaque object — blocks light completely. Transparent object — light passes almost completely through it. Shadow — the dark region formed behind the object.
  check: none

