- id: a1
  lvl: adv
  kind: num
  q: A bird 0.30 m across flies between you and the Sun. The Sun's diameter is $1.39 \times 10^9$ m and its distance $1.50 \times 10^{11}$ m. How long is the bird's umbra?
  ask: Umbra length
  unit: m
  ans: 32.4
  tol: 0.2
  verify: 0.3*1.5e11/1.39e9
  hints: ["The umbra is a cone with the bird as its base, tapering away from the Sun.", "Its half-angle equals the Sun's angular radius."]
  sol: $\ell = d\,L/D = 0.30 \times 1.50 \times 10^{11}/1.39 \times 10^9 \approx 32$ m. Above about 30 m, the bird casts no full shadow on the ground.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A lamp of luminous intensity 100 cd hangs 2.0 m above the floor. Find the illuminance on the floor at a point 2.0 m to the side of the point directly below the lamp.
  ask: Illuminance
  unit: lux
  ans: 8.84
  tol: 0.05
  verify: 100*cos(rad(45))/8
  hints: ["E = I cos θ / r², with r measured from the lamp to the point.", "Here r = 2√2 m and θ = 45°."]
  sol: $r^2 = 2^2 + 2^2 = 8$ m², $\theta = 45^\circ$, so $E = 100 \times 0.707/8 = 8.8$ lux.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A pinhole camera has its screen 10 cm behind the hole and is used with green light of wavelength 550 nm. Estimate the pinhole diameter that gives the sharpest image, by balancing geometric blur ($\approx d$) against diffraction blur ($\approx 2.44\lambda L/d$).
  ask: Optimum diameter
  unit: mm
  ans: 0.37
  tol: 0.03
  verify: sqrt(2.44*550e-9*0.10)*1000
  hints: ["Set d = 2.44 λ L / d."]
  sol: $d \approx \sqrt{2.44\lambda L} = \sqrt{2.44 \times 5.5 \times 10^{-7} \times 0.10} \approx 3.7 \times 10^{-4}$ m $\approx 0.4$ mm. This is an estimate; a more careful treatment by Rayleigh gives a similar fraction of a millimetre.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: Eclipses of Jupiter's moon Io are seen about 1000 s later when the Earth is on the far side of its orbit from Jupiter than when it is on the near side. The diameter of the Earth's orbit is $3.0 \times 10^{11}$ m. Estimate the speed of light.
  ask: Speed, in units of 10⁸ m/s
  unit: × 10⁸ m/s
  ans: 3
  tol: 0.01
  verify: 3.0e11/1000/1e8
  sol: The extra light path is about the orbit's diameter, so $c \approx 3.0 \times 10^{11}/1000 = 3.0 \times 10^8$ m/s. Rømer's 1676 timing (about 22 minutes) gave a value about a quarter too low, but proved that light has a finite speed.
  check: code
