# Electric field (including the electric dipole). NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 1, §1.7–1.12 and Exercises. The symbol µ (micro) is written as µ, as printed. Found, board, main problems are original.

- id: ncert12-eg-1-7
  lvl: ncert-intext
  num: "XII Ex 1.7"
  source: NCERT XII Physics · Ch 1 · Example 1.7
  kind: num
  q: An electron falls through a distance of 1.5 cm in a uniform electric field of magnitude 2.0 × 10⁴ N C⁻¹ [Fig. 1.10(a)]. The direction of the field is reversed keeping its magnitude unchanged and a proton falls through the same distance [Fig. 1.10(b)]. Compute the time of fall in each case. Contrast the situation with that of 'free fall under gravity'.
  ask: Time of fall of the electron
  unit: s
  ans: 2.9e-9
  tol: 5e-11
  verify: Math.sqrt(2*1.5e-2*9.11e-31/(1.6e-19*2.0e4))
  sol: |
    In Fig. 1.10(a) the field is upward, so the negative electron feels a downward force $eE$ and has acceleration $a_e = eE/m_e$. Starting from rest, $h = \tfrac12 a_et^2$, so

    $$t_e = \sqrt{\frac{2h}{a_e}} = \sqrt{\frac{2hm_e}{eE}} = \sqrt{\frac{2\times1.5\times10^{-2}\times9.11\times10^{-31}}{1.6\times10^{-19}\times2.0\times10^{4}}} = 2.9\times10^{-9}\ \text{s}.$$

    For the proton (field downward), $t_p = \sqrt{2hm_p/(eE)} = 1.3\times10^{-7}$ s. The heavier proton takes longer, in contrast to free fall under gravity where the time is independent of mass. Gravity can be ignored: $a_p = eE/m_p = 1.9\times10^{12}$ m s⁻², enormous compared with $g = 9.8$ m s⁻² (and the electron's acceleration is even larger).
  check: code

- id: ncert12-eg-1-8
  lvl: ncert-intext
  num: "XII Ex 1.8"
  source: NCERT XII Physics · Ch 1 · Example 1.8
  kind: num
  q: Two point charges q₁ and q₂, of magnitude +10⁻⁸ C and –10⁻⁸ C, respectively, are placed 0.1 m apart. Calculate the electric fields at points A, B and C shown in Fig. 1.11.
  ask: Electric field at A, the midpoint
  unit: N/C
  ans: 7.2e4
  tol: 100
  verify: 2*9e9*1e-8/0.05**2
  sol: |
    [Reading of Fig. 1.11, consistent with the book's numbers: A is the midpoint of the line joining the charges; B is on the line, 0.05 m from $q_1$ on the side away from $q_2$ (so 0.15 m from $q_2$); C is 0.10 m from each charge, forming an equilateral triangle with them.]

    **A.** Both fields point from $q_1$ towards $q_2$: $E_{1A} = \dfrac{9\times10^{9}\times10^{-8}}{(0.05)^2} = 3.6\times10^{4}$ N/C, and $E_{2A}$ is the same, so $E_A = 7.2\times10^{4}$ N/C towards the right (towards the negative charge).

    **B.** $E_{1B} = 3.6\times10^{4}$ N/C (away from $q_1$, to the left) and $E_{2B} = \dfrac{9\times10^{9}\times10^{-8}}{(0.15)^2} = 4\times10^{3}$ N/C (towards $q_2$, to the right). $E_B = 3.6\times10^{4} - 4\times10^{3} = 3.2\times10^{4}$ N/C, directed to the left.

    **C.** $E_{1C} = E_{2C} = \dfrac{9\times10^{9}\times10^{-8}}{(0.10)^2} = 9\times10^{3}$ N/C. Their components perpendicular to the line add to zero and those along it add: $E_C = 2\times9\times10^{3}\cos60^\circ = 9\times10^{3}$ N/C, parallel to the line joining the charges, pointing in the direction from $q_1$ to $q_2$.
  check: code

- id: ncert12-eg-1-9
  lvl: ncert-intext
  num: "XII Ex 1.9"
  source: NCERT XII Physics · Ch 1 · Example 1.9
  kind: num
  q: Two charges ±10 µC are placed 5.0 mm apart. Determine the electric field at (a) a point P on the axis of the dipole 15 cm away from its centre O on the side of the positive charge, as shown in Fig. 1.18(a), and (b) a point Q, 15 cm away from O on a line passing through O and normal to the axis of the dipole, as shown in Fig. 1.18(b).
  ask: Electric field at P, part (a)
  unit: N/C
  ans: 2.7e5
  tol: 1e4
  verify: 1e-5/(4*Math.PI*8.854e-12)*(1/0.1475**2-1/0.1525**2)
  sol: |
    **(a)** The positive charge is at 14.75 cm from P and the negative at 15.25 cm. $E_+ = \dfrac{10^{-5}}{4\pi(8.854\times10^{-12})(0.1475)^2} = 4.13\times10^{6}$ N/C along BP, $E_- = 3.86\times10^{6}$ N/C along PA. The resultant is $\approx2.7\times10^{5}$ N/C along BP (i.e. along the dipole moment).

    Check with the far-field formula, since $r/a = 60 \gg 1$. With $p = 10^{-5}\times5\times10^{-3} = 5\times10^{-8}$ C m, $E = \dfrac{2p}{4\pi\varepsilon_0 r^3} = 2.6\times10^{5}$ N/C along the dipole moment, close to the exact sum.

    **(b)** Each charge is at distance $\sqrt{15^2 + 0.25^2}$ cm from Q and gives a field $3.99\times10^{6}$ N/C. The components along OQ cancel and the components parallel to the axis add: $E = 2\times\dfrac{0.25}{\sqrt{15^2+0.25^2}}\times3.99\times10^{6} = 1.33\times10^{5}$ N/C, directed opposite to the dipole moment (parallel to BA). The far-field formula $E = \dfrac{p}{4\pi\varepsilon_0r^3} = 1.33\times10^{5}$ N/C agrees.
  check: code

- id: ncert12-ex-1-7
  lvl: ncert-ex
  num: "XII 1.7"
  source: NCERT XII Physics · Ch 1 · Exercise 1.7
  kind: text
  q: |-
    (a) An electrostatic field line is a continuous curve. That is, a field line cannot have sudden breaks. Why not?
    (b) Explain why two field lines never cross each other at any point?
  sol: |
    (a) A field line shows the direction of the force on a positive test charge. If a line broke suddenly, a charge placed at the break would have to jump from one point to another, with no force on it in the gap: the force on a charge changes smoothly from point to point in an electrostatic field, so the lines must be continuous (they begin on positive charges and end on negative charges, or go to infinity).

    (b) The tangent to a field line at a point gives the direction of the electric field there. If two lines crossed, there would be two different tangents, so the field at the crossing point would have two directions, which is impossible because the field has a single value at each point.
  check: none

- id: ncert12-ex-1-8
  lvl: ncert-ex
  num: "XII 1.8"
  source: NCERT XII Physics · Ch 1 · Exercise 1.8
  kind: num
  q: |-
    Two point charges q_A = 3 µC and q_B = –3 µC are located 20 cm apart in vacuum.
    (a) What is the electric field at the midpoint O of the line AB joining the two charges?
    (b) If a negative test charge of magnitude 1.5 × 10⁻⁹ C is placed at this point, what is the force experienced by the test charge?
  ask: Electric field at O
  unit: N/C
  ans: 5.4e6
  tol: 1e4
  verify: 2*9e9*3e-6/0.1**2
  sol: |
    (a) O is 10 cm from each charge. Both fields point from A towards B (away from the positive charge and towards the negative one), each of magnitude $\dfrac{9\times10^{9}\times3\times10^{-6}}{(0.1)^2} = 2.7\times10^{6}$ N/C. The total is $5.4\times10^{6}$ N/C along OB.

    (b) $F = qE = 1.5\times10^{-9}\times5.4\times10^{6} = 8.1\times10^{-3}$ N. The test charge is negative, so the force is opposite to the field: along OA.
  answer_key: "(a) 5.4 × 10⁶ N C⁻¹ along OB (b) 8.1 × 10⁻³ N along OA"
  check: both

- id: ncert12-ex-1-9
  lvl: ncert-ex
  num: "XII 1.9"
  source: NCERT XII Physics · Ch 1 · Exercise 1.9
  kind: num
  q: |
    A system has two charges q_A = 2.5 × 10⁻⁷ C and q_B = –2.5 × 10⁻⁷ C located at points A: (0, 0, –15 cm) and B: (0,0, +15 cm), respectively. What are the total charge and electric dipole moment of the system?
  ask: Dipole moment magnitude
  unit: C m
  ans: 7.5e-8
  tol: 1e-10
  verify: 2.5e-7*0.30
  sol: |
    The total charge is $2.5\times10^{-7} - 2.5\times10^{-7} = 0$. The dipole moment points from the negative to the positive charge, i.e. from B (at $z = +15$ cm) to A (at $z = -15$ cm), and has magnitude $p = q\times2a = 2.5\times10^{-7}\times0.30 = 7.5\times10^{-8}$ C m. 

    The answer key gives the direction as "along z-axis". Strictly the positive charge A is at $z = -15$ cm, so the moment points along $-z$.

    [Inference] The key's direction may refer to the axis only, not the sign; the magnitude matches.
  answer_key: Total charge is zero. Dipole moment = 7.5 × 10⁻⁸ C m along z-axis.
  check: both

- id: ncert12-ex-1-10
  lvl: ncert-ex
  num: "XII 1.10"
  source: NCERT XII Physics · Ch 1 · Exercise 1.10
  kind: num
  q: An electric dipole with dipole moment 4 × 10⁻⁹ C m is aligned at 30° with the direction of a uniform electric field of magnitude 5 × 10⁴ NC⁻¹. Calculate the magnitude of the torque acting on the dipole.
  ask: Torque
  unit: N m
  ans: 1e-4
  tol: 1e-7
  verify: 4e-9*5e4*Math.sin(Math.PI/6)
