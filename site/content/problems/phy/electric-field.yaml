- id: ncert12-ex-1-13
  lvl: ncert-ex
  num: "XII 1.13"
  source: NCERT XII Physics · Ch 1 · Exercise 1.13
  kind: text
  q: |
    Figure 1.30 shows tracks of three charged particles in a uniform electrostatic field. Give the signs of the three charges. Which particle has the highest charge to mass ratio? [Fig. 1.30 as printed: a horizontal positively charged plate above and a negatively charged plate below; three tracks enter from the left with the same horizontal velocity. Tracks 1 and 2 bend upwards, track 1 more than track 2; track 3 bends downwards, more than either.]
  sol: |
    The upper plate is positive and the lower plate is negative, so the field points downward. A positive charge is pushed along the field (downward) and a negative charge against it (upward).

    Tracks 1 and 2 bend upward, so charges 1 and 2 are **negative**. Track 3 bends downward, so charge 3 is **positive**.

    All three enter with similar horizontal speed, so the time to cross a given length is the same, and the sideways deflection is $y = \tfrac12\dfrac{qE}{m}t^2$, proportional to $q/m$. Particle 3 is deflected most, so it has the **highest charge-to-mass ratio**.

    [Inference] The track ordering was read from the printed figure; it agrees with the answer key.
  answer_key: Charges 1 and 2 are negative, charge 3 is positive. Particle 3 has the highest charge to mass ratio.
  check: ncert-key

