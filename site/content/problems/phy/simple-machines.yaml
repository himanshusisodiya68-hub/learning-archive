- id: f3
  lvl: found
  kind: num
  q: A 4 m long smooth ramp rises 1 m. What minimum force along the ramp is needed to push an 80 kg box up it at constant speed? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Force along the ramp
  unit: N
  ans: 196
  tol: 0.5
  verify: 80*9.8*1/4
  sol: |
    $F' L = mgh$, so $F' = mgh/L = 80\times9.8\times1/4 = 196$ N. The mechanical advantage is $L/h = 4$, so the effort is a quarter of the weight (784 N).
  check: code

- id: b1
  lvl: board
  kind: num
  q: A crowbar is used to lift a load of 1200 N with an effort of 200 N applied 1.5 m from the fulcrum. How far from the fulcrum is the load? Give the load arm in cm. (Original problem.)
  ask: Load arm
  unit: cm
  ans: 25
  tol: 0.1
  verify: 150/(1200/200)
  sol: |
    Mechanical advantage $= \dfrac{\text{load}}{\text{effort}} = \dfrac{1200}{200} = 6$, and also $= \dfrac{\text{effort arm}}{\text{load arm}}$. Hence
    $$\text{load arm} = \frac{150\ \text{cm}}{6} = 25\ \text{cm}.$$
  check: code

- id: b2
  lvl: board
  kind: num
  q: A 100 kg drum is rolled up a smooth 5.0 m long plank into a truck whose bed is 1.2 m above the ground. What effort force is needed along the plank (ignore friction)? Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Effort
  unit: N
  ans: 235.2
  tol: 0.5
  verify: 100*9.8*1.2/5
  sol: |
    The work done by the effort equals the potential energy gained: $F' L = mgh$.
    $$F' = \frac{100\times9.8\times1.2}{5.0} = 235\ \text{N}.$$
    Lifting it straight up would need 980 N, so the plank gives a mechanical advantage of $5.0/1.2 = 4.2$.
  check: code

- id: b3
  lvl: board
  kind: num
  q: A lever lifts a 500 N load through 0.10 m using an effort of 100 N. Ignoring friction, through what distance must the effort end move? How much work do you do? Give the distance. (Original problem.)
  ask: Distance moved by the effort end
  unit: m
  ans: 0.5
  tol: 0.001
  verify: 500*0.10/100
  sol: |
    The work put in equals the work got out: $F_1d_1 = F_2d_2$, so
    $$d_1 = \frac{500\times0.10}{100} = 0.50\ \text{m}.$$
    The work done is $100\times0.50 = 50$ J, the same as the work done on the load ($500\times0.10 = 50$ J). The lever trades force for distance; it does not save work.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A 6.0 m long ramp is used to raise a 90 kg crate through 1.5 m. The effort needed along the ramp is actually 300 N because of friction. Find the efficiency of the ramp, that is (useful work output) / (work input), as a percentage. Take $g = 9.8\ \text{m s}^{-2}$. (Original problem.)
  ask: Efficiency
  unit: "%"
  ans: 73.5
  tol: 0.1
  verify: 90*9.8*1.5/(300*6)*100
  sol: |
    Useful work (the potential energy gained): $mgh = 90\times9.8\times1.5 = 1323$ J.

    Work input: $F'L = 300\times6.0 = 1800$ J.

    $$\text{efficiency} = \frac{1323}{1800} = 0.735 = 73.5\%.$$
    The remaining 477 J is the work done against friction. The *actual* mechanical advantage is $882/300 = 2.94$, below the ideal value $L/h = 4$.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A wheelbarrow carries a load of 600 N whose line of action is 0.40 m from the axle of the wheel (the fulcrum). The handles are held 1.2 m from the axle. What upward force must the gardener apply to the handles to just lift the load? (Original problem.)
  ask: Effort
  unit: N
  ans: 200
  tol: 0.5
  verify: 600*0.40/1.2
  sol: |
    This is a class II lever: the load lies between the fulcrum and the effort. Balance requires effort $\times$ effort arm = load $\times$ load arm:
    $$F\times1.2 = 600\times0.40\ \Rightarrow\ F = 200\ \text{N}.$$
    The mechanical advantage is $1.2/0.40 = 3$, so the gardener lifts one third of the load's weight.
  check: code

- id: m3
  lvl: main
  kind: num
  q: A uniform plank 4.0 m long and of mass 20 kg is pivoted at a point 1.0 m from one end A. A child of mass 30 kg sits at A. Where, measured from the pivot on the long side, must a second child of mass 20 kg sit to balance the plank? (Original problem.)
  ask: Distance of the 20 kg child from the pivot
  unit: m
  ans: 0.5
  tol: 0.001
  verify: (30*1-20*1)/20
  sol: |
    The weight of a uniform plank acts at its centre, 2.0 m from A, which is $2.0 - 1.0 = 1.0$ m from the pivot on the long side. Balance about the pivot (load $\times$ arm on each side; $g$ cancels):

    - on the short side: child at A, $30\times1.0 = 30$ kg m;
    - on the long side: plank, $20\times1.0 = 20$ kg m, and the second child, $20\times x$.

    $$30 = 20 + 20x\ \Rightarrow\ x = 0.5\ \text{m}.$$
    The second child sits 0.50 m from the pivot, on the side away from A.
  check: code

- id: m4
  lvl: main
  kind: num
  q: A pulley system (block and tackle) has an ideal mechanical advantage of 4. To raise a load of 1000 N through 0.50 m, how long a length of rope must be pulled, and what effort is needed ideally? Give the length of rope pulled. (Original problem.)
  ask: Length of rope pulled
  unit: m
  ans: 2
  tol: 0.001
  verify: 4*0.50
  sol: |
    With an ideal mechanical advantage of 4, the effort is $1000/4 = 250$ N, and the rope must be pulled 4 times as far as the load rises:
    $$s = 4\times0.50 = 2.0\ \text{m}.$$
    Check with work: $250\times2.0 = 500$ J $= 1000\times0.50$ J. The machine saves force, not work. With friction, more effort than 250 N is needed.
  check: code
