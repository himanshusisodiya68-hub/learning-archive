- id: b1
  lvl: board
  kind: num
  q: An ice block of density 917 kg/m³ floats in sea water of density 1030 kg/m³. What percentage of its volume is below the surface? (Original problem.)
  ask: Percentage submerged
  unit: "%"
  ans: 89
  tol: 0.5
  verify: 917/1030*100
  sol: |
    For floating, weight $=$ buoyant force: $\rho_{ice}Vg = \rho_{sea}V_{sub}g$, so $V_{sub}/V = \rho_{ice}/\rho_{sea} = 917/1030 = 0.89$, i.e. 89% is submerged and 11% stands above the water.
  check: code

