  tol: 0.5
  verify: 15000*(2.0/20)**2
  sol: Pressure is transmitted undiminished, so $F_1 = F_2\,A_1/A_2 = 15\,000\times(2/20)^2 = 15\,000/100 = 150$ N. The force is multiplied 100 times, but the small piston moves 100 times as far, so the work is the same.
  check: code

- id: b3
  lvl: board
  kind: text
  q: A steel nail sinks in water but a steel ship floats. Explain. (Original problem.)
  sol: |
    A body floats when the water it displaces weighs as much as the body itself. The nail is solid steel, about 8 times denser than water, so even fully submerged it displaces only 1/8 of its weight of water and sinks. The ship's hull is hollow and encloses a lot of air, so its *average* density (total mass divided by the whole volume below the waterline) is below that of water. It sinks only until the displaced water weighs as much as the ship, and then floats.
  check: none

- id: m1
  lvl: main
  kind: num
  q: A metal cube of side 10 cm and mass 2.7 kg hangs from a spring balance and is fully immersed in water. What does the balance read? Take g = 9.8 m/s². (Original problem.)
  ask: Reading of the spring balance
  unit: N
  ans: 16.66
  tol: 0.05
  verify: 2.7*9.8-1000*9.8*1e-3
  sol: |
    Weight $=2.7\times9.8 = 26.46$ N. Volume $=(0.1)^3 = 10^{-3}$ m$^3$, so the buoyant force is $\rho_wVg = 1000\times10^{-3}\times9.8 = 9.8$ N (Archimedes). The balance reads $26.46-9.8 = 16.66$ N (the apparent weight).
  check: code

- id: m2
  lvl: main
  kind: num
  q: A helium balloon has volume 10 m³. The helium has density 0.18 kg/m³, the surrounding air 1.2 kg/m³, and the balloon fabric and basket have mass 4.0 kg. What is the largest mass it can lift off the ground? (Original problem.)
  ask: Maximum load
  unit: kg
  ans: 6.2
  tol: 0.05
  verify: (1.2-0.18)*10-4.0
  sol: |
    The buoyant force equals the weight of the displaced air, $\rho_{air}Vg$. The weight pulling down is that of the helium ($\rho_{He}Vg$), the fabric and basket (4.0 kg) and the load $m$. At the limit, $\rho_{air}V = \rho_{He}V + 4.0 + m$:
    $$m = (1.2-0.18)\times10 - 4.0 = 6.2\ \text{kg}.$$
  check: code

- id: m3
  lvl: main
  kind: num
  q: A vertical dam wall is 100 m wide and holds back water 20 m deep. Find the total horizontal force of the water on the wall. (Take g = 9.8 m/s²; ignore atmospheric pressure, which acts on both sides.) (Original problem.)
  ask: Total force
  unit: 10^8 N
  ans: 1.96
  tol: 0.01
  verify: 0.5*1000*9.8*20*20*100/1e8
  sol: |
    The gauge pressure grows linearly from 0 at the surface to $\rho g h$ at the bottom, so the average pressure is $\tfrac12\rho g h$. Force $=$ average pressure $\times$ area:
    $$F = \tfrac12\rho g h\times(h\,w) = \tfrac12\times1000\times9.8\times20\times(20\times100) = 1.96\times10^{8}\ \text{N}.$$
    Using the pressure at the bottom ($\rho g h$) would overestimate the force twofold. This is why dams are thicker at the base.
  check: code
