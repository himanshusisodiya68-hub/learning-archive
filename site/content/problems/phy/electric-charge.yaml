- id: m1
  lvl: main
  kind: num
  q: A copper cube of side 1 cm contains about 8.5 × 10²² atoms, each with one free electron. If one electron in every 10¹⁰ is removed, what charge does the cube acquire? (Original problem; the atom count is the value implied by the density and atomic mass of copper.)
  ask: Charge
  unit: C
  ans: 1.36e-6
  tol: 1e-8
  verify: 8.5e22/1e10*1.6e-19
  sol: |
    Number of electrons removed $= 8.5\times10^{22}/10^{10} = 8.5\times10^{12}$. Charge $= 8.5\times10^{12}\times1.6\times10^{-19} = 1.36\times10^{-6}$ C, about $+1.4\ \mu\text{C}$. Even this tiny fraction of the electrons gives a charge of the size seen in rubbing experiments.
  check: code

- id: m2
  lvl: main
  kind: text
  q: A charged rod is brought near, but not touching, an insulated neutral metal sphere. The sphere is briefly earthed with the rod still in place, then the earth connection is removed, then the rod is taken away. What is the sign of the charge on the sphere if the rod was positive? Explain. (Original problem.)
  sol: |
    **Negative.** The positive rod attracts free electrons to the near side of the sphere. Earthing lets more electrons flow from the earth onto the sphere (they are drawn in by the rod). After the earth connection is removed, the sphere has an excess of electrons that cannot leave, and when the rod is removed these spread over the sphere. This is charging by induction: the sphere ends up with the sign opposite to the rod's.
  check: none
