- id: f3
  lvl: found
  kind: num
  q: Three equal masses are placed at $(0,0)$, $(4,0)$ and $(0,3)$ (all in metres). How far is their centre of mass from the origin? (Original problem.)
  ask: Distance from the origin
  unit: m
  ans: 1.667
  tol: 0.005
  verify: sqrt(((0+4+0)/3)**2+((0+0+3)/3)**2)
  sol: |
    For equal masses the centre of mass is the average of the positions: $x_{cm}=(0+4+0)/3=4/3$ m and $y_{cm}=(0+0+3)/3=1$ m. The distance from the origin is $\sqrt{(4/3)^2+1^2}=\sqrt{25/9}=5/3\approx1.67$ m. (Original problem.)
  check: code

- id: b1
  lvl: board
  kind: num
  q: A 4 kg body moves east at 6 m/s and a 2 kg body moves west at 3 m/s. Find the velocity of the centre of mass of the two bodies, taking east as positive. (Original problem.)
  ask: Velocity of the centre of mass
  unit: m/s
  ans: 3
  tol: 0.01
  verify: (4*6+2*(-3))/(4+2)
  sol: |
    $v_{cm}=\dfrac{m_1v_1+m_2v_2}{m_1+m_2}=\dfrac{4(6)+2(-3)}{6}=\dfrac{18}{6}=3$ m/s, towards the east. This is the total momentum divided by the total mass. If no external force acts, it stays constant even if the bodies collide. (Original problem.)
  check: code

- id: b2
  lvl: board
  kind: num
  q: A 60 kg man stands at the stern of a 120 kg boat that floats at rest on still water. He walks 4 m towards the bow, relative to the boat. Neglecting water resistance, by how much does the boat move, relative to the water? (Original problem.)
  ask: Distance moved by the boat
  unit: m
  ans: 1.333
  tol: 0.01
  verify: 60*4/(60+120)
  sol: |
    No horizontal external force acts on the (man + boat) system, so the centre of mass stays where it is. Let the boat move back by $s$ in the water. The man then moves forward $4-s$ in the water. Equating the shift of $x_{cm}$ to zero:
    $$60(4-s)-120\,s=0\ \Rightarrow\ s=\frac{240}{180}=1.33\ \text{m}.$$
    The boat moves 1.33 m backwards (opposite to the man's walk). The man moves 2.67 m forward relative to the water. (Original problem.)
  check: code

- id: b3
  lvl: board
  kind: num
  q: A uniform square plate has side 20 cm. A square of side 10 cm is cut out of one corner, leaving an L-shaped plate. Find the distance of the centre of mass of the L-shaped plate from each of the two edges that meet at the corner opposite to the cut-out. (By symmetry the two distances are equal.) (Original problem.)
  ask: Distance from each of those two edges
  unit: cm
  ans: 8.33
  tol: 0.02
  verify: (400*10-100*15)/300
  sol: |
    Take the origin at the corner **opposite** the cut-out, so the plate occupies $0\le x,y\le20$ cm and the cut-out square occupies $10\le x,y\le20$ cm. Use areas for masses (uniform plate): whole plate 400 cm$^2$ with centre at $(10,10)$; removed square 100 cm$^2$ with centre at $(15,15)$; remaining 300 cm$^2$.
    $$400(10)=300\,x+100(15)\ \Rightarrow\ x=\frac{4000-1500}{300}=8.33\ \text{cm}.$$
    By symmetry $y=8.33$ cm too, so the centre of mass is at $(8.33,\,8.33)$ cm: it lies on the diagonal and is shifted from the plate's centre $(10,10)$ away from the hole, as it should be. (Original problem.)
  check: code

- id: m1
  lvl: main
  kind: num
  q: A thin straight rod of length $L=1.0$ m lies along the $x$-axis from $x=0$ to $x=L$. Its mass per unit length is $\lambda=\lambda_0(1+x/L)$, so it is twice as dense at the far end. Find the position of its centre of mass. (Original problem.)
  ask: Position of the centre of mass
  unit: m
  ans: 0.5556
  tol: 0.002
  verify: (1/2+1/3)/(1+1/2)
  sol: |
    $$x_{cm}=\frac{\int_0^L x\,\lambda\,dx}{\int_0^L\lambda\,dx}=\frac{\int_0^L x(1+x/L)\,dx}{\int_0^L(1+x/L)\,dx}=\frac{L^2/2+L^2/3}{L+L/2}=\frac{5L^2/6}{3L/2}=\frac{5L}{9}.$$
    For $L=1.0$ m, $x_{cm}=0.556$ m: beyond the midpoint (0.5 m), towards the denser end, as expected. (Original problem.)
  check: code

- id: m2
  lvl: main
  kind: num
  q: A thin uniform wire is bent into a semicircle of radius $R=0.20$ m. How far is its centre of mass from the centre of the circle? (Original problem.)
  ask: Distance of the CM from the centre of the circle
  unit: m
  ans: 0.1273
  tol: 0.0005
  verify: 2*0.2/PI
  sol: |
    Put the centre of the circle at the origin with the semicircle in the upper half-plane. An element at angle $\theta$ from the $x$-axis has length $R\,d\theta$ and height $R\sin\theta$. The mass per unit length is uniform, so
    $$y_{cm}=\frac{\int_0^\pi R\sin\theta\,(R\,d\theta)}{\int_0^\pi R\,d\theta}=\frac{R^2[-\cos\theta]_0^\pi}{\pi R}=\frac{2R}{\pi}.$$
    For $R=0.20$ m, $y_{cm}=0.127$ m. The centre of mass lies on the symmetry axis, and not on the wire itself. (Original problem.)
  check: code

- id: m3
  lvl: main
  kind: num
  q: The Earth has mass about $5.97\times10^{24}$ kg and the Moon about $7.35\times10^{22}$ kg; their centres are about $3.84\times10^{8}$ m apart. Find how far the centre of mass of the Earth-Moon system is from the centre of the Earth, and decide whether it lies inside the Earth (radius about 6370 km). (Original problem; the astronomical data are approximate textbook values.)
  ask: Distance of the CM from the centre of the Earth
  unit: km
  ans: 4670
  tol: 10
  verify: 7.35e22*3.84e8/(5.97e24+7.35e22)/1000
  sol: |
    $$d=\frac{m_{M}\,r}{m_E+m_M}=\frac{7.35\times10^{22}\times3.84\times10^{8}}{5.97\times10^{24}+7.35\times10^{22}}\ \text{m}=4.67\times10^{6}\ \text{m}\approx4670\ \text{km}.$$
    This is smaller than the Earth's radius, so the centre of mass of the pair lies about 1700 km below the Earth's surface. The Earth and the Moon both revolve about this point, so the Earth's centre traces a small circle of radius about 4670 km each month. [Unverified] The masses and the distance are rounded values quoted from memory. (Original problem.)
  check: code

- id: m4
  lvl: main
  kind: num
  q: Masses $m_1=3$ kg and $m_2=2$ kg are joined by a light string over a smooth fixed pulley. Released from rest, they accelerate with $a=1.96$ m/s$^2$ ($m_1$ down, $m_2$ up). Using the centre of mass of the two-mass system, find the magnitude of its acceleration and confirm it with the net external force. Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Magnitude of the acceleration of the centre of mass
  unit: m/s²
  ans: 0.392
  tol: 0.002
  verify: (3*1.96-2*1.96)/(3+2)
  sol: |
    Take down as positive. $m_1$ has acceleration $+a$ and $m_2$ has $-a$, so
    $$a_{cm}=\frac{m_1a-m_2a}{m_1+m_2}=\frac{(3-2)(1.96)}{5}=0.392\ \text{m/s}^2\ \text{(downwards)}.$$
    Check with Newton's second law for the system, $M a_{cm}=F_{ext}$. Tension in the string: $T=m_1(g-a)=3(9.8-1.96)=23.52$ N. The external forces on the system are the weights $5g=49$ N (down) and the pull of the pulley support, $2T=47.04$ N (up). Net $=49-47.04=1.96$ N, down, and $1.96/5=0.392$ m/s$^2$. The pulley support is an external force; without it the CM would accelerate at $g$. The centre of mass accelerates even though the string tension is internal. (Original problem.)
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A shell is fired from level ground at 50 m/s at 60° above the horizontal. At the top of its flight it explodes into two equal pieces. One piece falls vertically downwards, starting from rest just after the explosion. How far from the gun does the other piece land? Take $g=9.8$ m/s$^2$ and neglect air resistance. (Original problem.)
  ask: Landing distance of the second piece
  unit: m
  ans: 331.4
  tol: 0.5
  verify: 1.5*50**2*sin(rad(120))/9.8
  sol: |
    **Where would the unbroken shell land?** The range is $R=\dfrac{u^2\sin2\theta}{g}=\dfrac{2500\times\sin120^\circ}{9.8}=220.9$ m. The top of the flight is at $R/2=110.5$ m.

    **After the burst.** Just before it, the shell moves horizontally at $u\cos60^\circ=25$ m/s and has no vertical speed. The burst forces are internal, so the horizontal momentum is unchanged: $2m(25)=m(0)+mv_2$, giving $v_2=50$ m/s, horizontal. Both pieces start from the same height with zero vertical speed, so both reach the ground at the same instant.

    **Use the centre of mass.** While both are in the air the centre of mass follows the original parabola, so when both land it is at $R=220.9$ m:
    $$\frac{110.5+x_2}{2}=220.9\ \Rightarrow\ x_2=331.4\ \text{m}=\tfrac32R.$$

    Check directly: the top is at height $H=(u\sin60^\circ)^2/2g=95.7$ m, the fall takes $t=\sqrt{2H/g}=4.42$ s, and the second piece travels $50\times4.42=221$ m beyond $110.5$ m, which gives $331$ m. (Original problem.)
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A uniform rod of length 2.0 m stands vertically on a perfectly smooth horizontal floor and is released from rest at a slight tilt, so that it falls. When the rod makes 60° with the floor, how far has its lower end slid along the floor from its starting point? (Original problem.)
  ask: Distance slid by the lower end
  unit: m
  ans: 0.5
  tol: 0.005
  verify: 1.0*cos(rad(60))
  sol: |
    The floor is smooth, so the only outside forces are gravity and the vertical normal reaction. There is **no horizontal outside force**, and the rod starts at rest, so the centre of mass does not move sideways: it falls straight down.

    At the start the lower end is directly below the centre of mass. When the rod makes angle $\theta$ with the floor, the lower end is at horizontal distance $\dfrac L2\cos\theta$ from the vertical line through the centre of mass. That distance is how far the end has slid:
    $$s=\frac L2\cos\theta=1.0\times\cos60^\circ=0.50\ \text{m}.$$

    When the rod finally lies flat ($\theta=0$), the end has slid $L/2=1.0$ m. The upper end traces a quarter of an ellipse. (Original problem.)
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A uniform chain of mass 0.60 kg and length 1.2 m hangs from a hand with its lowest link just touching the pan of a scale. The hand lets go and the chain falls freely onto the pan, link by link, piling up at rest. At the instant when a length 0.40 m of the chain has landed, what does the scale read, as a force? Take $g=9.8$ m/s$^2$. (Original problem.)
  ask: Force on the scale pan
  unit: N
  ans: 5.88
  tol: 0.02
  verify: 3*(0.4/1.2)*0.6*9.8
  sol: |
    Let $\lambda=M/L=0.5$ kg/m, and let $x$ be the length already landed ($x=0.40$ m).

    **Speed of the arriving link.** The whole chain is in free fall, so the link reaching the pan has fallen a height $x$ and arrives at $v=\sqrt{2gx}$.

    **Push needed to stop the stream.** The chain lands at the rate $dx/dt=v$, so the mass arriving per second is $\lambda v$, and stopping it takes a force (mass per second) × (speed) $=\lambda v^2=2\lambda gx$.

    **Weight of the part already on the pan:** $\lambda xg$.

    $$N=2\lambda gx+\lambda gx=3\lambda gx=3\left(\frac xL\right)Mg=3\times\frac13\times0.60\times9.8=5.88\ \text{N}.$$

    The reading is three times the weight of the chain already on the pan. At the end ($x=L$) the peak reading is $3Mg$, 17.6 N. (Original problem.)
  check: code

- id: o2
  lvl: oly
  kind: num
  q: Two blocks of masses 1.0 kg and 3.0 kg are joined by a light spring of stiffness 300 N/m and lie on a smooth horizontal table. They are pulled apart a little and released. Find the angular frequency of their oscillation, as seen from the centre of mass. (Original problem.)
  ask: Angular frequency of oscillation
  unit: rad/s
  ans: 20
  tol: 0.05
  verify: sqrt(300/(1*3/(1+3)))
  sol: |
    The spring force is internal, so the centre of mass moves uniformly (or stays still); only the stretch $x$ of the spring changes. With the spring pulling each block towards the other, $m_1a_1=kx$ and $m_2a_2=-kx$. Subtracting, the relative acceleration is
    $$\ddot x=a_2-a_1=-kx\left(\frac1{m_1}+\frac1{m_2}\right)=-\frac k\mu\,x,\qquad \mu=\frac{m_1m_2}{m_1+m_2}=\frac{3}{4}\ \text{kg}.$$
    This is simple harmonic motion with $\omega=\sqrt{k/\mu}=\sqrt{300/0.75}=\sqrt{400}=20$ rad/s, a period of $2\pi/20=0.31$ s. Using the 3 kg mass alone would give the wrong answer $\sqrt{100}=10$ rad/s. (Original problem.)
  check: code
