# Centre of mass. NCERT questions copied word for word from NCERT Physics Class XI (reprint 2026-27), Ch 6 (Examples 6.1-6.3, Exercises 6.1-6.3 and 6.15). Found, board and main problems are original.

- id: ncert11-eg-6-1
  lvl: ncert-intext
  num: "XI Ex 6.1"
  source: NCERT XI Physics · Ch 6 · Example 6.1
  kind: num
  q: Find the centre of mass of three particles at the vertices of an equilateral triangle. The masses of the particles are 100g, 150g, and 200g respectively. Each side of the equilateral triangle is 0.5m long.
  ask: x-coordinate of the centre of mass (axes as in Fig. 6.9, O at the origin and A on the x-axis)
  unit: m
  ans: 0.278
  tol: 0.001
  verify: (100*0+150*0.5+200*0.25)/450
  sol: |
    Choose axes as in Fig. 6.9: the vertices O, A, B of the triangle are at $(0,0)$, $(0.5,0)$ and $(0.25,\ 0.25\sqrt3)$ m, carrying 100 g, 150 g and 200 g.

    $$X=\frac{m_1x_1+m_2x_2+m_3x_3}{m_1+m_2+m_3}=\frac{100(0)+150(0.5)+200(0.25)}{450}\ \text{m}=\frac{125}{450}\ \text{m}=\frac{5}{18}\ \text{m}\approx0.278\ \text{m}$$

    $$Y=\frac{100(0)+150(0)+200(0.25\sqrt3)}{450}\ \text{m}=\frac{50\sqrt3}{450}\ \text{m}=\frac{\sqrt3}{9}\ \text{m}\approx0.192\ \text{m}$$

    So the centre of mass is at $(5/18,\ \sqrt3/9)$ m, about $0.28$ m along OA and $0.19$ m above it.

    It is not the geometric centre (centroid) of triangle OAB because the masses are unequal: the centre of mass is pulled toward the heavier particles. The centroid, at $(0.25,\ 0.25/\sqrt3)=(0.25,\ 0.144)$ m, would be the answer only for three equal masses.
  check: code

- id: ncert11-eg-6-2
  lvl: ncert-intext
  num: "XI Ex 6.2"
  source: NCERT XI Physics · Ch 6 · Example 6.2
  kind: proof
  q: Find the centre of mass of a triangular lamina.
  hints:
    - Cut the lamina into thin strips parallel to the base. Where is the centre of mass of one strip?
    - The strip midpoints lie on a median. What does that tell you about the centre of mass of the whole triangle?
    - Repeat the argument with strips parallel to another side. Where do the medians meet?
  sol: |
    Divide the triangular lamina LMN into narrow strips parallel to the base MN. Each strip is (almost) a thin uniform rod, so by symmetry its centre of mass is at its midpoint. The midpoints of all the strips lie on the median LP (P the midpoint of MN). The whole lamina is a collection of strips, so its centre of mass has to lie on the median LP.

    Repeat with strips parallel to LN: the centre of mass lies on the median MQ. Repeat with strips parallel to LM: it lies on the median NR. A point lying on all three medians is their point of concurrence, the **centroid** G of the triangle. Hence the centre of mass of a uniform triangular lamina is its centroid, at one third of the height of the triangle above any side (two thirds of the way from a vertex down the median).

    Check with an integral. Put the apex at height $h$ and the base at $y=0$. A strip at height $y$ has width $b(1-y/h)$, so its mass is proportional to $(1-y/h)\,dy$ and
    $$y_{cm}=\frac{\int_0^h y(1-y/h)\,dy}{\int_0^h(1-y/h)\,dy}=\frac{h^2/2-h^2/3}{h/2}=\frac h3 .$$
  check: none

- id: ncert11-eg-6-3
  lvl: ncert-intext
  num: "XI Ex 6.3"
  source: NCERT XI Physics · Ch 6 · Example 6.3
  kind: num
  q: |-
    Find the centre of mass of a uniform L-shaped lamina (a thin flat plate) with dimensions as shown. The mass of the lamina is 3 kg.
    [Fig. 6.11: the L is made of three squares, each 1 m × 1 m, with O at the outer corner and the axes along the two outer edges.]
  ask: x-coordinate of the centre of mass
  unit: m
  ans: 0.8333
  tol: 0.002
  verify: (1*0.5+1*1.5+1*0.5)/3
  sol: |
    Take axes along the two outer edges with the origin at the outer corner O (Fig. 6.11). Think of the L as three squares of side 1 m. The lamina is uniform, so each square has mass 1 kg and its centre of mass at its geometric centre: $C_1(1/2,\,1/2)$, $C_2(3/2,\,1/2)$, $C_3(1/2,\,3/2)$ m. Treat each square as a point mass at its centre.

    $$X=\frac{1(1/2)+1(3/2)+1(1/2)}{1+1+1}\ \text{m}=\frac56\ \text{m},\qquad Y=\frac{1(1/2)+1(1/2)+1(3/2)}{3}\ \text{m}=\frac56\ \text{m}.$$

    The centre of mass is at $(5/6,\,5/6)$ m $\approx(0.83,\,0.83)$ m.

    Since $X=Y$, it lies on the line OD, the diagonal of symmetry: reflecting the L about that diagonal maps it onto itself, so the centre of mass must be on the mirror line.

    If the three squares had different masses $m_1,m_2,m_3$, use the same formula with those masses: $X=\dfrac{m_1(1/2)+m_2(3/2)+m_3(1/2)}{m_1+m_2+m_3}$, $Y=\dfrac{m_1(1/2)+m_2(1/2)+m_3(3/2)}{m_1+m_2+m_3}$, and the point would no longer lie on OD in general.
  check: code

- id: ncert11-ex-6-1
  lvl: ncert-ex
  num: "XI 6.1"
  source: NCERT XI Physics · Ch 6 · Exercise 6.1
  kind: text
  q: |-
    Give the location of the centre of mass of a (i) sphere, (ii) cylinder, (iii) ring, and (iv) cube, each of uniform mass density. Does the centre of mass of a body necessarily lie inside the body?
  sol: |
    For each of these bodies, the origin placed at the geometric centre is a point of reflection symmetry: for every mass element at $(x,y,z)$ there is an equal element at $(-x,-y,-z)$. The integrals $\int x\,dm$, $\int y\,dm$, $\int z\,dm$ vanish, so the centre of mass is the geometric centre in each case:

    (i) sphere: its centre; (ii) cylinder: the midpoint of its axis; (iii) ring: the centre of the circle (the point where the axis passes through the plane of the ring); (iv) cube: the point where the body diagonals meet.

    **No**, the centre of mass need not lie inside the body. For the ring the centre of mass is at the centre of the hole, where there is no material. The same holds for a hollow sphere, a hollow cylinder, a hollow cube, a boomerang or a bent rod.
  answer_key: The geometrical centre of each. No, the CM may lie outside the body, as in case of a ring, a hollow sphere, a hollow cylinder, a hollow cube etc.
  check: ncert-key

- id: ncert11-ex-6-2
  lvl: ncert-ex
  num: "XI 6.2"
  source: NCERT XI Physics · Ch 6 · Exercise 6.2
  kind: num
  q: |-
    In the HCl molecule, the separation between the nuclei of the two atoms is about 1.27 Å (1 Å = $10^{-10}$ m). Find the approximate location of the CM of the molecule, given that a chlorine atom is about 35.5 times as massive as a hydrogen atom and nearly all the mass of an atom is concentrated in its nucleus.
  ask: Distance of the CM from the hydrogen nucleus
  unit: Å
  ans: 1.235
  tol: 0.006
  verify: 35.5*1.27/36.5
  sol: |
    Put the H nucleus at $x=0$ (mass $m$) and the Cl nucleus at $x=1.27$ Å (mass $35.5\,m$). Since nearly all the mass is in the nuclei, treat the atoms as two point masses.

    $$x_{cm}=\frac{m(0)+35.5m(1.27)}{m+35.5m}=\frac{35.5}{36.5}\times1.27\ \text{Å}=1.235\ \text{Å}\approx1.24\ \text{Å}.$$

    The CM lies on the line joining the two nuclei, 1.24 Å from the H nucleus, i.e. only about $0.035$ Å from the Cl nucleus. It sits almost on the heavy atom, as it should.

    [Note] The printed answer key writes the chlorine nucleus as "C1" (digit one) instead of "Cl"; its value, 1.24 Å from the H end, agrees with the result above.
  answer_key: Located on the line joining H and C1 nuclei at a distance of 1.24 Å from the H end.
  check: both

- id: ncert11-ex-6-3
  lvl: ncert-ex
  num: "XI 6.3"
  source: NCERT XI Physics · Ch 6 · Exercise 6.3
  kind: text
  q: |-
    A child sits stationary at one end of a long trolley moving uniformly with a speed V on a smooth horizontal floor. If the child gets up and runs about on the trolley in any manner, what is the speed of the CM of the (trolley + child) system?
  sol: |
    The speed of the centre of mass stays equal to $V$.

    Take the system (trolley + child). The floor is smooth, so the only external forces are gravity and the normal reaction, both vertical, and they cancel. The horizontal external force is zero. From $M\,\mathbf a_{cm}=\mathbf F_{ext}$, the acceleration of the CM is zero, so its velocity does not change.

    The push of the child's feet on the trolley and the trolley's push on the child are internal forces (an action-reaction pair). They can change the speed of the child and of the trolley separately, but the total momentum $M\mathbf v_{cm}$ of the system is unchanged. If the child runs forward, the trolley slows; if the child runs backward, it speeds up; the CM keeps moving at $V$.
  answer_key: The speed of the CM of the (trolley + child) system remains unchanged (equal to v) because no external force acts on the system. The forces involved in running on the trolley are internal to this system.
  check: ncert-key

- id: ncert11-ex-6-15
  lvl: ncert-ex
  num: "XI 6.15"
  source: NCERT XI Physics · Ch 6 · Exercise 6.15
  kind: num
  q: |-
    From a uniform disk of radius $R$, a circular hole of radius $R/2$ is cut out. The centre of the hole is at $R/2$ from the centre of the original disc. Locate the centre of gravity of the resulting flat body.
  ask: Distance of the centre of gravity from the centre of the original disc, in units of R (on the side opposite to the hole)
  unit: R
  ans: 0.1667
  tol: 0.001
  verify: (0.25*0.5)/(1-0.25)
  sol: |
    Use the "negative mass" trick. Let the original disc have mass $M$ and its centre at the origin. The hole has radius $R/2$, so its area, and hence its mass, is $\left(\tfrac12\right)^2=\tfrac14$ of the full disc: $m=M/4$. The remaining body has mass $3M/4$ and its centre of mass is at $x$.

    The full disc is the remaining body plus the removed piece, so
    $$M(0)=\tfrac34M\,x+\tfrac14M\left(\tfrac R2\right)\ \Rightarrow\ x=-\frac{R/8}{3/4}=-\frac R6 .$$

    The centre of gravity is $R/6$ from the centre of the original disc, on the side opposite to the hole. (The body is small, so the centre of gravity coincides with the centre of mass.)
  answer_key: at R/6 from the center of original disc opposite to the center of cut portion.
  check: both

- id: f1
  lvl: found
  kind: num
  q: A 2 kg mass is at $x=0$ and a 3 kg mass is at $x=5$ m on a straight line. How far from the 2 kg mass is the centre of mass of the pair? (Original problem.)
  ask: Distance from the 2 kg mass
  unit: m
  ans: 3
  tol: 0.01
  verify: (2*0+3*5)/(2+3)
  sol: |
    $x_{cm}=\dfrac{2(0)+3(5)}{2+3}=3$ m from the 2 kg mass. The centre of mass lies on the line joining the two masses, closer to the heavier one (it is 2 m from the 3 kg mass). Check: the distances are in the inverse ratio of the masses, $3:2$ against $2:3$. (Original problem.)
  check: code

