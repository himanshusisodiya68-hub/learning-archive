- id: ncert9-ex-6-3
  lvl: ncert-ex
  num: "IX 6 · Q3"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q3
  kind: mcq
  q: |-
    Two blocks P and Q on a smooth horizontal surface are shown in Fig. 6.36a and Fig. 6.36b. Two forces of magnitudes 4 N and 5 N are acting in opposite directions on block P, while block Q is moving with a constant velocity.
    Which of the following statement is correct?
  opts: ["P experiences a net force and Q does not experience a net force.", "P does not experience a net force and Q experiences a net force.", "Both P and Q experience a net force.", "Neither P nor Q experiences a net force."]
  ans: 0
  sol: |
    On P the forces are unequal and opposite: the net force is $5 - 4 = 1$ N, so P accelerates. Q moves with constant velocity, so its acceleration is zero and the net force is zero. Option (i) is correct.
