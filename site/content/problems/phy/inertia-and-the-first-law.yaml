- id: f3
  lvl: found
  kind: text
  q: |-
    A passenger standing in a stationary bus is thrown backwards when the driver starts suddenly. Explain this using inertia and friction. (Original problem.)
  sol: |
    The bus floor drags the passenger's feet forward by friction, so the feet accelerate with the bus. The rest of the body is not directly driven and, by inertia, tends to stay at rest, so relative to the bus it appears thrown backwards. Muscular forces on the body (through the feet) then bring it along with the bus. With no friction (a very slippery floor) the feet would slide and the passenger would stay at rest relative to the ground while the bus moved forward under him.
