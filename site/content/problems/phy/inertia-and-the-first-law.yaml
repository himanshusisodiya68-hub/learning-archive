- id: ncert9-eg-6-2
  lvl: ncert-intext
  num: "IX Ex 6.2"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.2
  kind: text
  q: |-
    A person is exerting a force on a moving box in the forward direction which is equal to the force of friction acting between the bottom surface of the box and the floor. Will the box continue moving or will it come to rest after some time?
  sol: |
    Friction acts on the box backwards. The person's forward force is equal to it, so the two are balanced and the net force is zero. By the first law the box keeps moving with constant velocity; it does not come to rest.
  check: none

- id: ncert9-eg-6-3
  lvl: ncert-intext
  num: "IX Ex 6.3"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.3
  kind: text
  q: |-
    Draw (i) position-time, and (ii) velocity-time graphs for an object on which no net force is acting.
  sol: |
    With no net force the object is either at rest or moves with constant velocity.

    At rest: the position-time graph is a horizontal straight line (position does not change); the velocity-time graph is a horizontal line lying on the time axis ($v = 0$).

    Constant velocity: the position-time graph is a straight line sloping upwards (or downwards for negative velocity), whose slope is the velocity; the velocity-time graph is a horizontal straight line at the height $v$.
  check: none

- id: ncert9-it-6-3
  lvl: ncert-intext
  num: "IX 6 · PP3"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 3
  kind: text
  q: |-
    An object is moving with a constant velocity. Is there a net force acting upon it?
  sol: |
    No. Constant velocity means zero acceleration, so by the first law the net force is zero. Individual forces may still act (for example a push and an equal friction), but they add up to zero.
  check: none

- id: ncert9-it-6-4
  lvl: ncert-intext
  num: "IX 6 · PP4"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 4
  kind: text
  q: |-
    Suppose, no net force is acting on an object. Which of the following situations are possible?
    (i) Object remains at rest if at rest.
    (ii) Object keeps moving with a constant velocity if already moving.
    (iii) Object is moving with a constant acceleration.
  sol: |
    (i) and (ii) are possible; (iii) is not. With zero net force the acceleration is zero, so a body at rest stays at rest and a moving body keeps its velocity. A constant non-zero acceleration would need a constant net force.
  check: none

- id: ncert9-it-6-5
  lvl: ncert-intext
  num: "IX 6 · PP5"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 5
  kind: text
  q: |-
    In the real world, it is difficult to find a situation where no forces are acting on an object. But by applying additional forces, a condition can be achieved where the net force on the object is zero. Explain with the help of an example.
  sol: |
    Take a box being pushed along a floor. Friction acts on it backwards, so with no push it slows down. If the person pushes forward with a force equal to the friction, the two forces cancel: the net force is zero and the box moves at constant velocity, as if no force acted. Other examples: a book on a table (weight balanced by the table's push), or a parachutist falling at constant speed (weight balanced by air resistance).
  check: none

- id: ncert9-ex-6-1
  lvl: ncert-ex
  num: "IX 6 · Q1"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q1
  kind: text
  q: |-
    Using a horizontal force F, a table is moved across the floor at a constant velocity. How much is the frictional force exerted by the floor on the table?
  sol: |
    Constant velocity means zero acceleration, so the net horizontal force on the table is zero. The pushing force $F$ is balanced by friction, so the frictional force has magnitude $F$ and acts opposite to the motion.
  check: none

- id: ncert9-ex-6-2
  lvl: ncert-ex
  num: "IX 6 · Q2"
  source: NCERT Grade 9 Science · Ch 6 · Revise, Reflect, Refine Q2
  kind: text
  q: |-
    For a ball moving on a smooth frictionless surface, choose the appropriate option that will make the following statements physically correct.
    (i) If no net force is applied on the ball, the velocity of the ball will remain the same/increase/decrease.
    (ii) If a net force is applied on the ball in the direction of its motion, the magnitude of the velocity of the ball will remain the same/increase/decrease.
    (iii) If a net force is applied on the ball in a direction opposite to the direction of its motion, the magnitude of the velocity of the ball will remain the same/increase/decrease.
  sol: |
    (i) remain the same (first law).

    (ii) increase: the acceleration is along the velocity, so the speed grows.

    (iii) decrease: the acceleration is opposite to the velocity, so the speed falls.
