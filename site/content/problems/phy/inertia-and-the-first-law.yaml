# Inertia and the first law. NCERT questions copied word for word from NCERT Science Grade 8 (Curiosity, reprint 2026-27) Ch 5, NCERT Science Grade 9 (Exploration, 2026-27) Ch 6 and NCERT Physics Class XI (reprint 2026-27) Ch 4. Grades 8 and 9 have no answer key, so those solutions are ours. Found, board and main problems are original.

- id: ncert8-it-5-4
  lvl: ncert-intext
  num: "VIII 5 · Think"
  source: NCERT Grade 8 Science · Ch 5 · §5.2 in-text question
  kind: text
  q: |-
    What do you conclude from these examples? Does a force cause a moving object to stop? Can it change speed, or direction of motion, or change the shape of an object?
  sol: |
    Yes to all three. A force can bring a moving object to rest (a hand holding a moving bicycle), change its speed (brakes), change its direction (a bat hitting a ball) and change its shape (pressing a balloon, stretching a rubber band). A force can also set a body at rest into motion. These are the four effects of a force listed in the chapter.
  check: none

- id: ncert8-it-5-5
  lvl: ncert-intext
  num: "VIII 5 · Think"
  source: NCERT Grade 8 Science · Ch 5 · §5.2 in-text question
  kind: text
  q: |-
    Does this mean that whenever there is a change in speed or direction, or change in shape, a force is acting on the object?
  sol: |
    Yes. A change in speed or direction is a change in velocity, that is, an acceleration, and by the first law a body that is not accelerating has no net force on it. So a changing velocity always signals a net force. A change of shape needs a push or pull as well (to squeeze a balloon you must press on it). The book's own reply is: "Yes, none of these take place without the action of force."
  check: none

- id: ncert8-it-5-6
  lvl: ncert-intext
  num: "VIII 5 · A step further"
  source: NCERT Grade 8 Science · Ch 5 · §5.2 in-text question
  kind: text
  q: |-
    Suppose an object is at rest. Does it mean that no force is acting on this object?
  sol: |
    No. An object at rest may have several forces acting on it that cancel one another. A book lying on a table feels its weight downward and the table's upward push, equal in size, so the net force is zero. "At rest" tells us the net force is zero, not that every force is absent.
  check: none

- id: ncert8-ex-5-1
  lvl: ncert-ex
  num: "VIII 5 · Q1"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q1
  kind: text
  q: |-
    Match items in Column A with the items in Column B.
    Column A (Type of force): (i) Muscular force; (ii) Magnetic force; (iii) Frictional force; (iv) Gravitational force; (v) Electrostatic force.
    Column B (Example): (a) A cricket ball stopping on its own just before touching the boundary line; (b) A child lifting a school bag; (c) A fruit falling from a tree; (d) Balloon rubbed on woollen cloth attracting hair strands; (e) A compass needle pointing North.
  sol: |
    (i) Muscular force matches (b): the child's muscles lift the bag.
    (ii) Magnetic force matches (e): the Earth's magnetism turns the compass needle.
    (iii) Frictional force matches (a): the ground slows the rolling ball.
    (iv) Gravitational force matches (c): the Earth pulls the fruit down.
    (v) Electrostatic force matches (d): the rubbed balloon is charged and attracts hair.
  check: none

- id: ncert8-ex-5-2
  lvl: ncert-ex
  num: "VIII 5 · Q2"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q2
  kind: text
  q: |-
    State whether the following statements are True or False.
    (i) A force is always required to change the speed of motion of an object.
    (ii) Due to friction, the speed of the ball rolling on a flat ground increases.
    (iii) There is no force between two charged objects placed at a small distance apart.
  sol: |
    (i) True. A change of speed is an acceleration, and an acceleration needs a net force.

    (ii) False. Friction acts opposite to the motion, so it makes the ball slow down.

    (iii) False. Charged objects exert electrostatic forces on each other even without touching: attraction for unlike charges, repulsion for like charges.
  check: none

- id: ncert8-ex-5-3
  lvl: ncert-ex
  num: "VIII 5 · Q3"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q3
  kind: text
  q: |-
    Two balloons rubbed with a woollen cloth are brought near each other. What would happen and why?
  sol: |
    The balloons move apart. Rubbing with the same cloth gives both balloons the same kind of electric charge, and like charges repel. This repulsion is an electrostatic force, a non-contact force, so the balloons push each other away without touching.
  check: none

- id: ncert8-ex-5-8
  lvl: ncert-ex
  num: "VIII 5 · Q8"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q8
  kind: text
  q: |-
    Is any force being applied to an object in a non-uniform motion?
  sol: |
    Yes. Non-uniform motion means the speed, the direction or both are changing, so the velocity changes and the object accelerates. A body that is not accelerating has zero net force (first law), so an accelerating body must have a net force acting on it.
  check: none

- id: ncert8-ex-5-9
  lvl: ncert-ex
  num: "VIII 5 · Q9"
  source: NCERT Grade 8 Science · Ch 5 · Keep the curiosity alive Q9
  kind: text
  q: |-
    The weight of an object on the Moon becomes one-sixth of its weight on the Earth. What causes this change? Does the mass of the object also become one-sixth of its mass on the Earth?
  sol: |
    Weight is the gravitational force a planet exerts on the object, $W = mg$. The Moon's pull at its surface is about one-sixth of the Earth's, so the weight becomes about one-sixth. The mass is the amount of matter in the object and does not depend on where it is, so it stays the same. Mass is also the measure of the object's inertia, which is why it cannot change just because the object moves to the Moon.
  check: none

- id: ncert9-it-6-1
  lvl: ncert-intext
  num: "IX 6 · PP1"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 1
  kind: text
  q: |-
    A weightlifter lifts a barbell (Fig. 6.8). List two forces that are acting on the barbell. Are these forces balanced if the weightlifter keeps the barbell steady?
  sol: |
    The two forces are the weight of the barbell, acting downwards (the Earth's pull), and the upward force exerted by the weightlifter's hands. If the weightlifter holds the barbell steady, its velocity stays zero, so its acceleration is zero and the net force is zero: the two forces are equal and opposite, that is, balanced.
  check: none

- id: ncert9-it-6-2
  lvl: ncert-intext
  num: "IX 6 · PP2"
  source: NCERT Grade 9 Science · Ch 6 · Pause and Ponder 2
  kind: text
  q: |-
    Two players R and S are participating in an arm-wrestling match (Fig. 6.9). At the instant, when the arms tilt to the front direction (out of the page towards you), are the forces exerted by the players balanced? If not, which player exerted the larger force?
  sol: |
    The arms are moving, so their velocity is changing: the forces on the arms are not balanced, there is a net force in the direction of the tilt.

    [Unverified] The picture is a front view with R on the left and S on the right, and the tilt is out of the page, so it does not show which hand is being pushed back. The question cannot be answered from the figure alone; the intended reading is that the player whose arm is pushing the other's arm over is exerting the larger force.

    [Note] Do not confuse this with Newton's third law, met later in the chapter: the two hands always exert equal and opposite forces on each other at every instant. The unbalanced force is on each arm, from all the forces acting on it (the other hand, the muscles, the shoulder), not between the two hands.
