- id: b1
  lvl: board
  kind: num
  q: |-
    A lift of mass 500 kg moves upward at a constant speed of 2 m s$^{-1}$. Find the tension in the cable. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Tension in the cable
  unit: N
  ans: 4900
  tol: 5
  verify: 500*9.8
  sol: |
    Constant velocity means zero acceleration, so the net force is zero: $T - mg = 0$ and $T = mg = 500 \times 9.8 = 4900$ N. The speed of 2 m s$^{-1}$ plays no part, because only a change in velocity needs a net force.
  check: code

- id: b2
  lvl: board
  kind: text
  q: |-
    (a) State Newton's first law of motion. (b) What is inertia? (c) A 10 kg trolley and a 2 kg trolley are at rest on a level floor. Which has more inertia, and how would you show it by pushing them? (Original problem.)
  sol: |
    (a) Every body continues in its state of rest or of uniform motion in a straight line unless a net external force acts on it.

    (b) Inertia is the property of a body by which it resists any change in its state of rest or of uniform straight-line motion. Its measure is the mass.

    (c) The 10 kg trolley has more inertia since it has the greater mass. For the same push for the same time the 2 kg trolley picks up five times the speed; to bring both to the same speed in the same time you need a five times larger force on the 10 kg trolley.
  check: none

- id: b3
  lvl: board
  kind: num
  q: |-
    A particle is in equilibrium under three forces in a horizontal plane. One is 6 N towards the east and another is 8 N towards the north. Find the magnitude of the third force. (Original problem.)
  ask: Third force
  unit: N
  ans: 10
  tol: 0.05
  verify: sqrt(6**2+8**2)
  sol: |
    In equilibrium the three forces add up to zero, so the third force is equal and opposite to the resultant of the other two. The resultant is $\sqrt{6^2 + 8^2} = 10$ N, so the third force has magnitude 10 N. It points towards the south-west, at $\tan^{-1}(8/6) = 53^\circ$ south of west.
  check: code

- id: m1
  lvl: main
  kind: num
  q: |-
    A particle moves with constant velocity under three forces (in newton) $\vec F_1 = 3\hat i + 4\hat j$, $\vec F_2 = -7\hat i + 2\hat j$ and an unknown $\vec F_3$. Find the magnitude of $\vec F_3$. (Original problem.)
  ask: Magnitude of the third force
  unit: N
  ans: 7.21
  tol: 0.02
  verify: sqrt(4**2+6**2)
  sol: |
    Constant velocity means zero acceleration, so $\vec F_1 + \vec F_2 + \vec F_3 = 0$. Then $\vec F_3 = -(\vec F_1 + \vec F_2) = -(-4\hat i + 6\hat j) = 4\hat i - 6\hat j$. Its magnitude is $\sqrt{16 + 36} = \sqrt{52} = 7.21$ N.
  check: code

- id: m2
  lvl: main
  kind: num
  q: |-
    A train moves along a straight level track at a constant 20 m s$^{-1}$. A passenger throws a ball straight up, at 5 m s$^{-1}$ relative to the train, and catches it at the same height. Take $g = 10$ m s$^{-2}$ and ignore air resistance. How far does the ball move horizontally, as seen from the ground, while it is in the air? Where does it land relative to the passenger? (Original problem.)
  ask: Horizontal distance moved relative to the ground
  unit: m
  ans: 20
  tol: 0.1
  verify: 20*(2*5/10)
  sol: |
    The ball's time of flight is $t = 2u/g = 2 \times 5/10 = 1$ s. After release there is no horizontal force on the ball (air resistance neglected), so by the first law it keeps the 20 m s$^{-1}$ horizontal velocity it shared with the train. As seen from the ground it moves $20 \times 1 = 20$ m horizontally.

    The train, being at constant velocity, also moves 20 m in that time, so the ball lands back in the passenger's hand: relative to the passenger it goes straight up and down. (This is why constant-velocity motion is indistinguishable from rest in mechanics.)
  check: code

- id: m3
  lvl: main
  kind: num
  q: |-
    Galileo's double incline: a smooth ball is released from rest at a height of 0.5 m on one smooth incline and rolls onto a second smooth incline of angle $\theta$. Ignoring friction, how far along the second incline does it travel before stopping when $\theta = 5^\circ$? What does the pattern tell you about the limit $\theta \to 0$? (Original problem.)
  ask: Distance along the second incline for θ = 5°
  unit: m
  ans: 5.74
  tol: 0.02
  verify: 0.5/sin(rad(5))
  sol: |
    Without friction the ball rises to its starting height, $h = 0.5$ m, whatever the slope. The distance along the incline is $d = h/\sin\theta$. For $\theta = 5^\circ$, $d = 0.5/\sin 5^\circ = 0.5/0.0872 = 5.74$ m. For $\theta = 30^\circ$ it would be only $1.0$ m.

    As $\theta$ is reduced, $d$ grows without limit: when the second plane is horizontal the ball would never reach the height it started from and would travel for ever at constant velocity. This is Galileo's argument for the law of inertia: with no unbalanced force, motion needs no cause to continue.
  check: code

- id: a1
  lvl: adv
  kind: num
  q: |-
    A 4 kg lamp hangs from the ceiling by a string. A horizontal string pulls it sideways until the upper string makes an angle $\theta$ with the vertical, where $\tan\theta = 3/4$. The lamp is at rest. Find the tension in the upper string. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Tension in the upper string
  unit: N
  ans: 49
  tol: 0.05
  verify: 4*9.8/0.8
  sol: |
    The lamp is in equilibrium, so the forces add to zero along each axis. Since $\tan\theta = 3/4$, we have $\cos\theta = 0.8$ and $\sin\theta = 0.6$.

    Vertical: the upper string's upward pull $T\cos\theta$ must balance the weight, $T\cos\theta = mg = 4 \times 9.8 = 39.2$ N. So $T = 39.2/0.8 = 49$ N.

    Horizontal (for completeness): the sideways string pulls with $T\sin\theta = 49 \times 0.6 = 29.4$ N, which equals $mg\tan\theta = 39.2 \times 0.75$. The upper string carries more than the weight because it also supports the sideways pull.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: |-
    A uniform rope of mass 6 kg hangs between two supports at the same height. At each support the rope makes an angle of $30^\circ$ with the horizontal. Find the tension in the rope at its lowest point. Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Tension at the lowest point
  unit: N
  ans: 50.9
  tol: 0.1
  verify: 3*9.8/tan(rad(30))
  sol: |
    Cut the rope at its lowest point and consider the right-hand half, of mass 3 kg. Three forces act on it: its weight $3 \times 9.8 = 29.4$ N, the pull $T_e$ of the support along the rope at $30^\circ$ above horizontal, and the horizontal pull $T_0$ of the left half at the lowest point (the tension there is horizontal because, by symmetry, the rope is level).

    Vertical balance: $T_e \sin 30^\circ = 29.4$, so $T_e = 58.8$ N.
    Horizontal balance: $T_0 = T_e\cos 30^\circ = 58.8 \times 0.866 = 50.9$ N.

    Equivalently $T_0 = 29.4/\tan 30^\circ = 50.9$ N. The tension is largest at the supports and smallest at the bottom.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: |-
    A 5 kg ball hangs from the ceiling by string A. A second string B is tied to the bottom of the ball. Each string breaks when its tension reaches 100 N. String B is pulled vertically downward with a force that increases slowly from zero. At what value of the pull does a string break, and which one? Take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Pull at which a string breaks
  unit: N
  ans: 51
  tol: 0.05
  verify: 100-5*9.8
  sol: |
    With a slow pull the ball is always in equilibrium. String B carries the pull $F$, so its tension is $F$. String A must hold the weight and the pull: $T_A = mg + F = 49 + F$.

    $T_A$ reaches 100 N when $F = 100 - 49 = 51$ N, long before $T_B = F$ reaches 100 N. So the **upper** string A breaks, at a pull of 51 N.

    If instead B is jerked sharply, the ball's inertia keeps it from moving at once, so A hardly stretches and its tension barely changes, while B stretches and its tension shoots to 100 N: then **B** breaks. This is the classic demonstration of inertia with two strings.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: |-
    A helium balloon is tied by a light string to the floor of a closed car. When the car is at rest the string is vertical. The car then accelerates forward on a level road at a constant 2.0 m s$^{-2}$. In the steady state, find the angle the string makes with the vertical. Ignore the mass of the balloon and the helium compared with the air it displaces, and take $g = 9.8$ m s$^{-2}$. (Original problem.)
  ask: Angle of the string from the vertical
  unit: degrees
  ans: 11.5
  tol: 0.1
  verify: deg(atan(2/9.8))
  sol: |
    Pick a small parcel of air of volume $V$ and density $\rho$, sitting in the car. The air in the car accelerates forward at $a = 2.0$ m s$^{-2}$ with the car, so the surrounding air must push it with a net force $\rho V a$ forward, apart from cancelling its own weight. The pressure force on the parcel is therefore
    $$\vec F_p = \rho V\,(g\,\hat y + a\,\hat x),$$
    that is, upward by $\rho Vg$ (the usual buoyancy) and forward by $\rho V a$ (the push that accelerates the air).

    A balloon of negligible mass in the same place feels the same pressure force. With negligible weight, the only other force on it is the string tension, so the tension must be exactly opposite: it pulls the balloon back and down along the string, which means the balloon sits forward of and above its anchor, with
    $$\tan\theta = \frac{\rho V a}{\rho V g} = \frac{a}{g} = \frac{2.0}{9.8}, \qquad \theta = 11.5^\circ.$$
    The balloon leans **forward**, the opposite way to a hanging weight, which would lean backward by the same angle. The air is heavy and lags backwards; the high pressure at the rear pushes the light balloon forward.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: |-
    Frame S is inertial. Frame S$'$ moves relative to S with a constant velocity $\vec u$. Show that the first law also holds in S$'$. Then show that it fails in a frame S$''$ that moves with constant acceleration $\vec a_0$ relative to S, and find the apparent acceleration of a force-free body in S$''$. (Original problem.)
  hints:
    - A force-free body has a constant velocity $\vec v$ in S. Write its velocity as seen from S$'$ (subtract the frame's velocity).
    - In S$''$ the frame's velocity is $\vec u(t) = \vec u_0 + \vec a_0 t$. Differentiate the relative velocity.
  sol: |
    **Constant velocity frame.** A body with no net force moves in S with constant velocity $\vec v$. In S$'$ its velocity is $\vec v' = \vec v - \vec u$. Both $\vec v$ and $\vec u$ are constant, so $\vec v'$ is constant: the body still moves in a straight line at constant speed. The first law holds in S$'$, so S$'$ is also an inertial frame. Any frame moving uniformly relative to an inertial frame is inertial (this is Galileo's relativity).

    **Accelerating frame.** In S$''$ the frame has velocity $\vec u(t) = \vec u_0 + \vec a_0 t$, so the force-free body has velocity $\vec v'' = \vec v - \vec u_0 - \vec a_0 t$. This changes with time. The apparent acceleration is
    $$\vec a'' = \frac{d\vec v''}{dt} = -\vec a_0.$$
    A body with no force on it appears to accelerate, at $-\vec a_0$, so the first law fails in S$''$. This is exactly the lurch of a passenger in a braking bus. To keep $F = ma$ usable in S$''$ one adds a pseudo force $-m\vec a_0$.
  check: none
