- id: ncert9-it-6-ts1
  lvl: ncert-intext
  num: "IX 6 · Think as a Scientist"
  source: NCERT Grade 9 Science · Ch 6 · §6.3 Think as a Scientist
  kind: text
  q: |-
    Suppose, you find an object and a horizontal floor having such smooth surfaces that the force of friction between them is zero. Imagine, what will happen if you repeat steps 3 and 4 of Activity 6.1 with such an object and a horizontal floor? Will the velocity of the object decrease? Will the object ever come to rest or continue moving forever?
  sol: |
    Once the stack of coins leaves the rubber band there would be no horizontal force on it: friction is zero and the weight is balanced by the normal force. With zero net force the velocity cannot change, so the object would keep moving in a straight line at constant velocity for ever. This is Galileo's thought experiment, and it leads to Newton's first law.
  check: none

- id: ncert9-eg-6-1
  lvl: ncert-intext
  num: "IX Ex 6.1"
  source: NCERT Grade 9 Science · Ch 6 · Example 6.1
  kind: num
  q: |-
    Two forces of 10 N and 6 N are acting on a block lying on the table as shown in Fig. 6.6. What is the magnitude and the direction of the net force acting on the block in each case?
  ask: Net force in case (a)
  unit: N
  ans: 16
  tol: 0.1
  verify: 10+6
  sol: |
    [Inference] The figure is not reproduced in the extracted text; the directions below are the ones implied by the book's own answers.

    (a) The two forces point the same way, so they add: $10 + 6 = 16$ N, towards the right.

    (b) The forces are opposite, so the net force is the difference, $10 - 6 = 4$ N, in the direction of the larger force (to the right).

    (c) Again opposite, with the 10 N force the other way round: $10 - 6 = 4$ N, towards the left.
