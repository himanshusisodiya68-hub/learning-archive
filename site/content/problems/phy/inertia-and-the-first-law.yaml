  q: |-
    A coin rests on a card laid across the top of a glass. The card is flicked sharply sideways and the coin drops into the glass. Which statement explains this best? (Original problem.)
  opts: ["The coin has inertia, so it tends to stay at rest while the card is pulled away.", "The card pushes the coin downward as it leaves.", "Gravity acts on the coin only after the card is removed.", "Air pushes the coin down into the glass."]
