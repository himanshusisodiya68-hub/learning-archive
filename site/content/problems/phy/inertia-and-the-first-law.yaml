- id: ncert11-eg-4-1
  lvl: ncert-intext
  num: "XI Ex 4.1"
  source: NCERT XI Physics · Ch 4 · Example 4.1
  kind: num
  q: |-
    An astronaut accidentally gets separated out of his small spaceship accelerating in inter stellar space at a constant rate of 100 m s$^{-2}$. What is the acceleration of the astronaut the instant after he is outside the spaceship? (Assume that there are no nearby stars to exert gravitational force on him.)
  ask: Acceleration of the astronaut
  unit: m s⁻²
  ans: 0
  tol: 0.001
  verify: "0"
  sol: |
    Once outside, the astronaut has no force on him: no stars are nearby and the small spaceship's gravity is negligible. By the first law his acceleration is zero. He keeps the velocity he had at that instant, so he moves on in a straight line at constant velocity while the spaceship, still accelerating, leaves him behind.
  answer_key: Acceleration of the astronaut is zero (worked answer of Example 4.1).
  check: both

- id: ncert11-ex-4-1
  lvl: ncert-ex
  num: "XI 4.1"
  source: NCERT XI Physics · Ch 4 · Exercise 4.1
  kind: text
  q: |-
    Give the magnitude and direction of the net force acting on
    (a) a drop of rain falling down with a constant speed,
    (b) a cork of mass 10 g floating on water,
    (c) a kite skillfully held stationary in the sky,
    (d) a car moving with a constant velocity of 30 km/h on a rough road,
    (e) a high-speed electron in space far from all material objects, and free of electric and magnetic fields.
  sol: |
    In (a) to (d) the body is not accelerating (constant velocity or at rest), so the net force is zero by the first law. The separate forces cancel:

    (a) weight downward balanced by air drag upward;

    (b) weight $0.010 \times 10 = 0.1$ N balanced by the buoyant force 0.1 N;

    (c) weight and air drag/lift balanced by the tension in the string;

    (d) the engine's forward force balanced by friction and air drag.

    (e) The electron has no force on it at all, since it is far from every gravitating or charged body and there are no fields: the net force is zero and it moves with constant velocity.

    So the answer is zero net force in every case.
  answer_key: (a) to (d) No net force according to the First Law. (e) No force, since it is far away from all material agencies producing electromagnetic and gravitational forces.
  check: ncert-key

- id: ncert11-ex-4-11
  lvl: ncert-ex
  num: "XI 4.11"
  source: NCERT XI Physics · Ch 4 · Exercise 4.11
  kind: num
  q: |-
    A truck starts from rest and accelerates uniformly at 2.0 m s$^{-2}$. At $t$ = 10 s, a stone is dropped by a person standing on the top of the truck (6 m high from the ground). What are the (a) velocity, and (b) acceleration of the stone at $t$ = 11 s? (Neglect air resistance.)
  ask: Speed of the stone at t = 11 s
  unit: m s⁻¹
  ans: 22.4
  tol: 0.1
  verify: sqrt(20**2+(10*1)**2)
  sol: |
    At $t = 10$ s the truck's speed is $v = 2.0 \times 10 = 20$ m s$^{-1}$, so the stone leaves the hand with horizontal velocity 20 m s$^{-1}$.

    (a) Once released, the only force on the stone is its weight (no air resistance), which is vertical. By the first law, the horizontal velocity stays 20 m s$^{-1}$. The vertical velocity after 1 s is $v_y = g t = 10 \times 1 = 10$ m s$^{-1}$ downward. Speed $= \sqrt{20^2 + 10^2} = \sqrt{500} = 22.4$ m s$^{-1}$, at an angle $\tan^{-1}(10/20) = \tan^{-1}(1/2) \approx 26.6^\circ$ below the horizontal, in the direction of the truck's motion.

    (b) Acceleration is $g = 10$ m s$^{-2}$ vertically downward; the horizontal acceleration is zero because there is no horizontal force on the stone after release, although the truck keeps accelerating.

    Check that the stone is still in the air at $t = 11$ s: the fall time from 6 m is $\sqrt{2 \times 6/10} = 1.1$ s, which is more than 1 s, so it has not yet landed.
  answer_key: (a) 22.4 m s⁻¹ at an angle of tan⁻¹(1/2) with the horizontal. (b) 10 m s⁻² vertically downwards.
  check: both

- id: ncert11-ex-4-12
  lvl: ncert-ex
  num: "XI 4.12"
  source: NCERT XI Physics · Ch 4 · Exercise 4.12
  kind: text
  q: |-
    A bob of mass 0.1 kg hung from the ceiling of a room by a string 2 m long is set into oscillation. The speed of the bob at its mean position is 1 m s$^{-1}$. What is the trajectory of the bob if the string is cut when the bob is (a) at one of its extreme positions, (b) at its mean position.
  sol: |
    When the string is cut, the only force left is gravity, vertical. The bob keeps whatever horizontal velocity it had (first law) and accelerates downward.

    (a) At an extreme position the bob is momentarily at rest, so its velocity is zero. It falls vertically downwards in a straight line.

    (b) At the mean position the velocity is 1 m s$^{-1}$ horizontal. The bob keeps that horizontal motion while falling under gravity, so its path is a parabola (a horizontal projectile).
  answer_key: (a) At the extreme position, the speed of the bob is zero. If the string is cut, it will fall vertically downwards. (b) At the mean position, the bob has a horizontal velocity. If the string is cut, it will fall along a parabolic path.
  check: ncert-key

- id: f1
  lvl: found
