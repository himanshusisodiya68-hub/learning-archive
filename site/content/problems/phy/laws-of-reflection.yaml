- id: c7-11-11
  lvl: ncert-ex
  num: "VII Q11"
  source: NCERT VII Curiosity · Ch 11 · Q11
  kind: text
  q: "Suppose you are given a tube of the shape shown in the Fig. 11.20 and two plane mirrors smaller than the diameter of the tube. Can this tube be used to make a periscope? If yes, mark where you will fix the plane mirrors. [Fig. 11.20 shows a tube bent at right angles twice, like a square bracket: a top arm, a vertical section and a bottom arm, both arms pointing the same way.]"
  sol: Yes. Fix one plane mirror at each of the two corners, each inclined at 45° to the tube's arms and parallel to each other. Light entering the top arm reflects down the vertical section from the first mirror, then reflects out along the bottom arm from the second mirror. That is exactly a periscope.
  check: none

- id: c8-10-1
  lvl: ncert-ex
  num: "VIII Q1"
  source: NCERT VIII Curiosity · Ch 10 Light Mirrors and Lenses · Q1
  kind: mcq
  q: A light ray is incident on a mirror and gets reflected by it (Fig. 10.21). The angle made by the incident ray with the normal to the mirror is 40°. What is the angle made by the reflected ray with the mirror?
  opts: ["40°", "50°", "45°", "60°"]
  ans: 1
  sol: The angle of reflection equals the angle of incidence, 40°, measured from the normal. The angle with the mirror itself is $90^\circ - 40^\circ = 50^\circ$.
  check: none

