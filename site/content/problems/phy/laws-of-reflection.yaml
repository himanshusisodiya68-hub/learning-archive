- id: ncert-ex-13
  lvl: ncert-ex
  num: 13
  source: NCERT X Science · Ch 9 · Exercise 13 · p. 160
  kind: text
  q: The magnification produced by a plane mirror is +1. What does this mean?
  sol: |
    Magnification $m = h'/h$, the ratio of image height to object height.
    - $|m| = 1$: the image is the **same size** as the object.
    - The **positive sign** means the image is **erect** and, for a mirror, **virtual** (it forms behind the mirror).
  answer_key: m = 1 indicates that image formed by a plane mirror is of the same size as the object. Further, the positive sign of m indicates that the image is virtual and erect.
  check: ncert-key

- id: f1
  lvl: found
  kind: mcq
  q: A ray strikes a plane mirror at 30° to the mirror surface. What is the angle of reflection?
  opts: ["30°", "60°", "90°", "120°"]
  ans: 1
  hints: ["Angles are measured from the normal, which is perpendicular to the mirror."]
  sol: The angle with the normal is $90^\circ - 30^\circ = 60^\circ$, and the angle of reflection equals the angle of incidence, so it is $60^\circ$.
  check: none

