- id: b2
  lvl: board
  kind: text
  q: Why does a plane mirror seem to swap left and right, but not up and down?
  hints: ["Which direction does the mirror actually reverse: the one along the mirror or the one perpendicular to it?"]
  sol: |
    A mirror reverses only the direction perpendicular to its surface (front–back). Up stays up and the left side of the scene stays on the left. The image faces you, though, so when you imagine yourself standing in its place you turn around a vertical axis, and that turn is what swaps left and right. If you imagined turning head over heels instead, you would say the mirror swaps up and down.
  check: none

