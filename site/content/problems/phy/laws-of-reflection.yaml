- id: c7-11-8
  lvl: ncert-ex
  num: "VII Q8"
  source: NCERT VII Curiosity · Ch 11 Light Shadows and Reflections · Q8
  kind: text
  q: Write your name on a piece of paper and hold it in front of a plane mirror such that the paper is parallel to the mirror. Sketch the image. What difference do you notice? Explain the reason for the difference.
  sol: The letters appear in reverse order and each letter is mirror-reversed left to right (lateral inversion); the image stays the same size and upright. The mirror reverses only the direction perpendicular to itself, so the side of the paper nearer your left hand appears on the image's right as you face it.
