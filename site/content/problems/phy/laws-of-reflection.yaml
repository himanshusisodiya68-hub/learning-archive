- id: a1
  lvl: adv
  kind: num
  q: A ray reflects once from each of two plane mirrors inclined at 70°. Find the total deviation of the ray, as an angle between 180° and 360°.
  ask: Deviation
  unit: "°"
  ans: 220
  tol: 0.1
  verify: 360-2*70
  hints: ["Deviation at one mirror is 180° − 2i. Add the two and use the triangle formed by the ray and the mirrors.", "The result does not depend on the angle of incidence."]
  sol: |
    Use glancing angles (angles with the mirror surface). A reflection with glancing angle $\alpha$ turns the ray by $2\alpha$. Let the ray between the mirrors make glancing angles $\alpha$ with the first mirror and $\beta$ with the second. That ray and the two mirrors form a triangle, so $\alpha + \beta + \theta = 180^\circ$. The total deviation is
    $$\delta = 2\alpha + 2\beta = 2(180^\circ - \theta) = 360^\circ - 2\theta = 360^\circ - 140^\circ = 220^\circ.$$
    Equivalently, the ray ends up turned $140^\circ$ in the other sense.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A ray travelling along the unit vector $(2, -3, 6)/7$ enters a corner reflector made of three mutually perpendicular mirrors and reflects once from each. What is the $z$-component of its final direction?
  ask: z-component
  unit: ""
  ans: -0.857
  tol: 0.005
  verify: -6/7
  hints: ["Each mirror flips exactly one component of the direction vector."]
  sol: Each mirror reverses one component, so after all three the direction is $(-2, 3, -6)/7$. The $z$-component is $-6/7 \approx -0.857$. The ray goes straight back.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A mirror rotates at 10 rad/s, reflecting a fixed laser beam onto a wall 5 m away (measured perpendicular to the wall). How fast does the spot move when it is at the foot of the perpendicular from the mirror?
  ask: Speed
  unit: m/s
  ans: 100
  tol: 0.5
  verify: 2*10*5
  hints: ["The reflected beam turns at twice the mirror's angular speed.", "x = d tan φ; differentiate and set φ = 0."]
  sol: The beam turns at $2\omega = 20$ rad/s. With $x = d\tan\phi$, $v = d\sec^2\phi \cdot 2\omega$, which at $\phi = 0$ is $2\omega d = 2 \times 10 \times 5 = 100$ m/s.
  check: code

- id: o2
  lvl: oly
  kind: proof
  q: Points A and B lie on the same side of a plane mirror. Prove that among all paths from A to the mirror and then to B, the one obeying the law of reflection is the shortest.
  hints: ["Reflect B in the mirror to get B′.", "Compare AP + PB with AP + PB′ for any point P on the mirror."]
  sol: |
    Let B′ be the reflection of B in the mirror. For any point P on the mirror, PB = PB′, because the mirror is the perpendicular bisector of BB′. So the path length is AP + PB′. By the triangle inequality this is smallest when A, P and B′ are collinear. For that P, the angle APB′ is a straight line, and the vertical angles at P show that AP and PB make equal angles with the normal. Hence the reflecting path is the shortest.
  check: none
