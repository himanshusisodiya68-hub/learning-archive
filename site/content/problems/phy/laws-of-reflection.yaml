- id: m2
  lvl: main
  kind: num
  q: A plane mirror is turned through 12° while the incident ray stays fixed. Through what angle does the reflected ray turn?
  ask: Angle
  unit: "°"
  ans: 24
  tol: 0.1
  verify: 2*12
  hints: ["The normal turns with the mirror, changing both i and r."]
  sol: Turning the mirror by $\theta$ changes both the angle of incidence and the angle of reflection by $\theta$, so the reflected ray turns by $2\theta = 24^\circ$.
