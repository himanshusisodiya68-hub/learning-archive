- id: b2
  lvl: board
  kind: num
  q: A household uses three 100 W bulbs for 5 hours a day and a 1.5 kW heater for 2 hours a day. At Rs 6 per unit, find the electricity bill for 30 days. (Original problem; the tariff is assumed.)
  ask: Bill
  unit: Rs
  ans: 810
  tol: 0.5
  verify: (0.3*5+1.5*2)*30*6
  sol: |
    Daily energy $= 0.3\ \text{kW}\times5\ \text{h} + 1.5\ \text{kW}\times2\ \text{h} = 1.5 + 3.0 = 4.5$ kW h. For 30 days: $135$ kW h. Bill $= 135\times6 = \text{Rs}\ 810$.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A bulb marked 100 W, 220 V and another marked 25 W, 220 V are connected in series across a 220 V supply. Taking each resistance as constant, find the power consumed by the 100 W bulb. (Original problem.)
  ask: Power in the 100 W bulb
  unit: W
  ans: 4
  tol: 0.01
  verify: (220/(220*220/100+220*220/25))**2*(220*220/100)
  sol: |
    $R_1 = 220^2/100 = 484\ \Omega$ and $R_2 = 220^2/25 = 1936\ \Omega$. Total $2420\ \Omega$, so $I = 220/2420 = 0.0909$ A. Power in the 100 W bulb $= I^2R_1 = (1/11)^2\times484 = 4$ W (and 16 W in the 25 W bulb). The lower-rated bulb glows brighter in series because it has the larger resistance.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A fuse wire melts when the power it dissipates raises it to its melting point, which needs 5 W from a 1 A current. What power does it dissipate at 3 A, assuming constant resistance? (Original problem.)
  ask: Power at 3 A
  unit: W
  ans: 45
  tol: 0.01
  verify: 5*3*3
  sol: With $R$ constant, $P = I^2R$ is proportional to $I^2$. At 3 A the power is $5\times3^2 = 45$ W, nine times larger. (In a real fuse $R$ rises with temperature, so this is an idealisation.)
  check: code
