# Heating effect of current and electric power. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 11, §11.7–11.8. Found, board and main problems are original.

- id: ncert-eg11-10
  lvl: ncert-intext
  num: "Ex 11.10"
  source: NCERT X Science · Ch 11 · Example 11.10
  kind: num
  q: An electric iron consumes energy at a rate of 840 W when heating is at the maximum rate and 360 W when the heating is at the minimum. The voltage is 220 V. What are the current and the resistance in each case?
  ask: Resistance at maximum heating
  unit: Ω
  ans: 57.6
  tol: 0.1
  verify: 220*220/840
  sol: |
    From $P = VI$, $I = P/V$.

    (a) Maximum heating: $I = 840/220 = 3.82$ A, and $R = V/I = 220/3.82 = 57.60\ \Omega$.

    (b) Minimum heating: $I = 360/220 = 1.64$ A, and $R = 220/1.64 = 134.15\ \Omega$.

    [Inference] Using exact values, $R = V^2/P$ gives $57.62\ \Omega$ and $134.44\ \Omega$. The book's numbers come from rounding the currents to three significant figures first, so the small differences are rounding, not a different method.
  check: code

- id: ncert-eg11-11
  lvl: ncert-intext
  num: "Ex 11.11"
  source: NCERT X Science · Ch 11 · Example 11.11
  kind: num
  q: 100 J of heat is produced each second in a 4 Ω resistance. Find the potential difference across the resistor.
  ask: Potential difference
  unit: V
  ans: 20
  tol: 0.01
  verify: Math.sqrt(100/(4*1))*4
  sol: |
    $H = I^2Rt$ gives $I = \sqrt{H/Rt} = \sqrt{100/(4\times1)} = 5$ A. Then $V = IR = 5\times4 = 20$ V.
  check: code

- id: ncert-it11-7-1
  lvl: ncert-intext
  num: "§11.7 Q1"
  source: NCERT X Science · Ch 11 · In-text questions after §11.7 · Q1
  kind: text
  q: Why does the cord of an electric heater not glow while the heating element does?
  sol: |
    The cord and the element carry the **same current** in series, and the heat produced is $H = I^2Rt$. The element is made of a high-resistivity alloy, so its $R$ is large and it produces a lot of heat and glows. The cord is thick copper or aluminium wire with a very small resistance, so $I^2R$ in it is small and it hardly warms up.
  check: none

- id: ncert-it11-7-2
  lvl: ncert-intext
  num: "§11.7 Q2"
  source: NCERT X Science · Ch 11 · In-text questions after §11.7 · Q2
  kind: num
  q: Compute the heat generated while transferring 96000 coulomb of charge in one hour through a potential difference of 50 V.
  ask: Heat generated
  unit: J
  ans: 4.8e6
  tol: 1000
  verify: 50*96000
  sol: |
    The energy dissipated is $H = VIt = V(It) = VQ = 50\ \text{V}\times96000\ \text{C} = 4.8\times10^{6}$ J. The time (one hour) is not needed, because $It$ is already the charge $Q$.
  check: code

- id: ncert-it11-7-3
  lvl: ncert-intext
  num: "§11.7 Q3"
  source: NCERT X Science · Ch 11 · In-text questions after §11.7 · Q3
  kind: num
  q: An electric iron of resistance 20 Ω takes a current of 5 A. Calculate the heat developed in 30 s.
  ask: Heat developed
  unit: J
  ans: 15000
  tol: 1
  verify: 5*5*20*30
  sol: $H = I^2Rt = 5^2\times20\times30 = 15\,000$ J $= 15$ kJ.
