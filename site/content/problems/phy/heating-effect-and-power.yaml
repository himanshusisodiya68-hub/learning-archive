- id: m1
  lvl: main
  kind: num
  q: A bulb marked 100 W, 220 V and another marked 25 W, 220 V are connected in series across a 220 V supply. Taking each resistance as constant, find the power consumed by the 100 W bulb. (Original problem.)
  ask: Power in the 100 W bulb
  unit: W
  ans: 4
  tol: 0.01
  verify: (220/(220*220/100+220*220/25))**2*(220*220/100)
  sol: |
    $R_1 = 220^2/100 = 484\ \Omega$ and $R_2 = 220^2/25 = 1936\ \Omega$. Total $2420\ \Omega$, so $I = 220/2420 = 0.0909$ A. Power in the 100 W bulb $= I^2R_1 = (1/11)^2\times484 = 4$ W (and 16 W in the 25 W bulb). The lower-rated bulb glows brighter in series because it has the larger resistance.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A fuse wire melts when the power it dissipates raises it to its melting point, which needs 5 W from a 1 A current. What power does it dissipate at 3 A, assuming constant resistance? (Original problem.)
  ask: Power at 3 A
  unit: W
  ans: 45
  tol: 0.01
  verify: 5*3*3
  sol: With $R$ constant, $P = I^2R$ is proportional to $I^2$. At 3 A the power is $5\times3^2 = 45$ W, nine times larger. (In a real fuse $R$ rises with temperature, so this is an idealisation.)
  check: code

- id: a1
  lvl: adv
  kind: num
  q: A cell of emf 6 V and unknown internal resistance r delivers exactly the same power to a 2 Ω resistor as to an 8 Ω resistor (each connected alone). Find r, and the power in either resistor. (Original problem.)
  ask: Internal resistance r
  unit: Ω
  ans: 4
  tol: 0.01
  verify: Math.sqrt(2*8)
  sol: |
    Equal powers: $\dfrac{\mathcal E^2R_1}{(R_1+r)^2} = \dfrac{\mathcal E^2R_2}{(R_2+r)^2}$, so $R_1(R_2+r)^2 = R_2(R_1+r)^2$. Expanding, $R_1R_2^2 + R_1r^2 = R_2R_1^2 + R_2r^2$, i.e. $R_1R_2(R_2-R_1) = r^2(R_2-R_1)$, so $r = \sqrt{R_1R_2} = \sqrt{16} = 4\ \Omega$.

    Power: $P = 36\times2/(2+4)^2 = 2$ W (check: $36\times8/12^2 = 2$ W). The maximum, at $R = r = 4\ \Omega$, would be $\mathcal E^2/4r = 2.25$ W; the two loads sit on either side of the peak of $P(R)$.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: A heater rated 1000 W at 220 V boils a pan of water, starting from room temperature, in 10 min. When the supply drops to 198 V the same job takes 13 min. Assuming the heater resistance is constant and the pan loses heat to the room at the same average rate in both cases, find that rate of heat loss. (Original problem.)
  ask: Rate of heat loss
  unit: W
  ans: 176.7
  tol: 0.2
  verify: (0.81*1000*780-1000*600)/(780-600)
  sol: |
    At 198 V the power is $1000\times(198/220)^2 = 810$ W. The heat $Q$ needed by the water is the same both times, so with loss rate $L$:

    $$(1000 - L)\times600 = (810 - L)\times780.$$

    $600\,000 - 600L = 631\,800 - 780L \Rightarrow 180L = 31\,800 \Rightarrow L = 176.7$ W.

    Then $Q = 823.3\times600 \approx 4.94\times10^5$ J. Note that a 10% voltage drop raised the time by 30%: the power fell by 19%, and the fixed loss takes a larger share of the smaller power.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: A fuse wire of radius 0.10 mm melts at 3 A. What radius of wire of the same material is needed for a 12 A fuse? Assume heat is lost only from the curved surface, at a rate proportional to its area and to the temperature excess. (Original problem.)
  ask: Radius
  unit: mm
  ans: 0.252
  tol: 0.002
  verify: 0.1*Math.pow(12/3, 2/3)
  sol: |
    At melting, heat produced per second $I^2\rho l/\pi r^2$ equals heat lost $h(2\pi rl)\Delta T$ with the same $\Delta T$, so $I^2\propto r^3$ and $r\propto I^{2/3}$.

    $r = 0.10\times4^{2/3} = 0.10\times2.52 = 0.252$ mm. Not 0.40 mm, which would be the (wrong) answer from $I\propto r^2$.
  check: code

- id: a4
  lvl: adv
  kind: num
  q: A 60 W, 220 V bulb and a 40 W, 220 V bulb are connected in series across a 440 V supply. Taking each resistance as constant, find the voltage across the 40 W bulb, and say what happens. (Original problem.)
  ask: Voltage across the 40 W bulb
  unit: V
  ans: 264
  tol: 0.5
  verify: 440*(220*220/40)/(220*220/40+220*220/60)
  sol: |
    $R_{60} = 220^2/60 = 806.7\ \Omega$, $R_{40} = 220^2/40 = 1210\ \Omega$. The voltage divides in proportion to resistance:

    $$V_{40} = 440\times\frac{1210}{2016.7} = 264\ \text{V},\qquad V_{60} = 176\ \text{V}.$$

    The 40 W bulb gets 20% above its rating, so it dissipates $(1.2)^2\times40 = 57.6$ W and is likely to burn out; then the circuit breaks and both go dark. Two bulbs in series on double voltage is safe only if they are identical.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A 10 Ω resistor of heat capacity 20 J/K carries a steady current of 2 A. It loses heat to the surroundings at the rate k(T − T₀) with k = 0.5 W/K, and starts at the room temperature T₀. Neglecting the change of resistance with temperature, find its temperature rise after 40 s. (Original problem.)
  ask: Temperature rise after 40 s
  unit: K
  ans: 50.57
  tol: 0.05
  verify: (2*2*10/0.5)*(1-Math.exp(-40/(20/0.5)))
  sol: |
    Energy balance: $C\,\dfrac{d\theta}{dt} = P - k\theta$ with $\theta = T - T_0$ and $P = I^2R = 40$ W. Separating variables with $\theta(0) = 0$:

    $$\theta(t) = \frac{P}{k}\left(1 - e^{-kt/C}\right).$$

    Steady rise $P/k = 80$ K, time constant $\tau = C/k = 40$ s. At $t = 40$ s, $\theta = 80(1 - e^{-1}) = 80\times0.632 = 50.6$ K.

    Without cooling the rise would have been $Pt/C = 80$ K; cooling has already cut it by more than a third.
  check: code

- id: o2
  lvl: oly
  kind: num
  q: A metal wire has resistance R = R₀[1 + α(T − T₀)] with R₀ = 2 Ω and α = 4 × 10⁻³ K⁻¹. It loses heat at the rate k(T − T₀) with k = 0.05 W/K. It is driven by a constant-current source. Above what current does no steady temperature exist (thermal runaway)? Explain why the same wire on a constant-voltage source always reaches a steady temperature. (Original problem.)
  ask: Critical current
  unit: A
  ans: 2.5
  tol: 0.01
  verify: Math.sqrt(0.05/(4e-3*2))
  sol: |
    Let $\theta = T - T_0$. Steady state at constant current: $k\theta = I^2R_0(1 + \alpha\theta)$, so

    $$\theta = \frac{I^2R_0}{k - \alpha I^2R_0}.$$

    A positive finite $\theta$ exists only if $\alpha I^2R_0 < k$. The critical current is $I_c = \sqrt{k/\alpha R_0} = \sqrt{0.05/0.008} = \sqrt{6.25} = 2.5$ A. Physically: each kelvin of warming adds $k$ watts of cooling but $\alpha I^2R_0$ watts of extra heating; above $I_c$ heating wins and the temperature runs away.

    At constant voltage, $P = V^2/R_0(1+\alpha\theta)$ falls as $\theta$ rises, while the loss $k\theta$ rises from zero. A falling curve and a rising line starting below it cross exactly once, and the crossing is stable (a little extra warming gives less heating and more cooling). So a steady temperature always exists.
  check: code

- id: o3
  lvl: oly
  kind: num
  q: Two concentric metal spheres of radii a and 3a have the space between them filled with a weakly conducting material of uniform conductivity σ. A steady current flows radially from the inner sphere to the outer. What fraction of the total Joule heat is produced in the region a < r < 2a? (Original problem.)
  ask: Fraction
  ans: 0.75
  tol: 0.001
  verify: (1/1-1/2)/(1/1-1/3)
  sol: |
    By symmetry the current spreads radially: $J(r) = I/4\pi r^2$. The local power density is $p = J^2/\sigma = I^2/(16\pi^2\sigma r^4)$. Heat in a shell $(r, r+dr)$:

    $$dP = p\,4\pi r^2\,dr = \frac{I^2}{4\pi\sigma}\frac{dr}{r^2}.$$

    So the heat between radii $r_1$ and $r_2$ is proportional to $1/r_1 - 1/r_2$. Fraction in $a<r<2a$:

    $$\frac{1/a - 1/2a}{1/a - 1/3a} = \frac{1/2}{2/3} = \frac34.$$

    Three quarters of the heat appears in the inner shell, although it holds only $7/26$ of the volume. Current crowding near a small electrode concentrates the heating there; spot welding uses exactly this. (The total, $I^2(1/a - 1/3a)/4\pi\sigma$, is $I^2R$ with $R$ the resistance of the shell.)
  check: code
