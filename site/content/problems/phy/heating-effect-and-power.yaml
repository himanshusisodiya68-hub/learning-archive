- id: ncert-ex11-2
  lvl: ncert-ex
  num: 2
  source: NCERT X Science · Ch 11 · Exercise 2
  kind: mcq
  q: Which of the following terms does not represent electrical power in a circuit?
  opts: ["I²R", "IR²", "VI", "V²/R"]
  ans: 1
  sol: $P = VI$, and with $V = IR$ this becomes $I^2R$ or $V^2/R$. $IR^2$ has the wrong units (A·Ω², not watts), so it is not power.
  answer_key: (b)
  check: ncert-key

- id: ncert-ex11-3
  lvl: ncert-ex
  num: 3
  source: NCERT X Science · Ch 11 · Exercise 3
  kind: mcq
  q: An electric bulb is rated 220 V and 100 W. When it is operated on 110 V, the power consumed will be –
  opts: ["100 W", "75 W", "50 W", "25 W"]
  ans: 3
  sol: |
    The rating gives $R = V^2/P = 220^2/100 = 484\ \Omega$. At 110 V, $P = 110^2/484 = 25$ W. Halving the voltage quarters the power (taking $R$ as constant).
  answer_key: (d)
  check: ncert-key

- id: ncert-ex11-12
  lvl: ncert-ex
  num: 12
  source: NCERT X Science · Ch 11 · Exercise 12
  kind: num
  q: Several electric bulbs designed to be used on a 220 V electric supply line, are rated 10 W. How many lamps can be connected in parallel with each other across the two wires of 220 V line if the maximum allowable current is 5 A?
  ask: Number of lamps
  unit: ""
  ans: 110
  tol: 0.01
  verify: 5/(10/220)
  sol: |
    Each lamp draws $I = P/V = 10/220 = 1/22$ A. The number that keeps the total at 5 A is $5\div(1/22) = 110$. (Equivalently $1100\ \text{W}/10\ \text{W} = 110$.)
  answer_key: 110 bulbs
  check: both

- id: ncert-ex11-14
  lvl: ncert-ex
  num: 14
  source: NCERT X Science · Ch 11 · Exercise 14
  kind: num
  q: |-
    Compare the power used in the 2 Ω resistor in each of the following circuits:
    (i) a 6 V battery in series with 1 Ω and 2 Ω resistors, and (ii) a 4 V battery in parallel with 12 Ω and 2 Ω resistors.
  ask: Power in the 2 Ω resistor, circuit (i)
  unit: W
  ans: 8
  tol: 0.01
  verify: (6/(1+2))**2*2
  sol: |
    (i) Series: $I = 6/(1+2) = 2$ A, so $P = I^2R = 2^2\times2 = 8$ W.

    (ii) Parallel: the 2 Ω resistor has the full 4 V across it, so $P = V^2/R = 4^2/2 = 8$ W.

    The power used in the 2 Ω resistor is the **same, 8 W**, in both circuits.
  answer_key: (i) 8 W; (ii) 8 W
  check: both

- id: ncert-ex11-15
  lvl: ncert-ex
  num: 15
  source: NCERT X Science · Ch 11 · Exercise 15
  kind: num
  q: Two lamps, one rated 100 W at 220 V, and the other 60 W at 220 V, are connected in parallel to electric mains supply. What current is drawn from the line if the supply voltage is 220 V?
  ask: Current drawn
  unit: A
  ans: 0.727
  tol: 0.003
  verify: (100+60)/220
  sol: |
    Each lamp works at its rated 220 V in parallel, so the powers add: $P = 100 + 60 = 160$ W. Then $I = P/V = 160/220 = 0.73$ A.
  answer_key: 0.73 A
  check: both

- id: ncert-ex11-16
  lvl: ncert-ex
  num: 16
  source: NCERT X Science · Ch 11 · Exercise 16
  kind: text
  q: Which uses more energy, a 250 W TV set in 1 hr, or a 1200 W toaster in 10 minutes?
  sol: |
    TV set: $250\ \text{W}\times1\ \text{h} = 250$ W h. Toaster: $1200\ \text{W}\times\tfrac16\ \text{h} = 200$ W h.

    The **250 W TV set in 1 hour** uses more energy (250 W h against 200 W h), although the toaster has the larger power.
  answer_key: 250 W TV set in 1 hour
  check: ncert-key

- id: ncert-ex11-17
  lvl: ncert-ex
  num: 17
  source: NCERT X Science · Ch 11 · Exercise 17
  kind: num
  q: An electric heater of resistance 44 Ω draws 5 A from the service mains for 2 hours. Calculate the rate at which heat is developed in the heater.
  ask: Rate of heat production
  unit: W
  ans: 1100
  tol: 0.5
  verify: 5*5*44
  sol: |
    The rate of heat production is the power, $P = I^2R = 5^2\times44 = 1100$ W $= 1100$ J/s. (The two hours are not needed; the heat produced in that time would be $1100\times7200 = 7.92\times10^{6}$ J.)
  answer_key: 1100 W
  check: both

- id: ncert-ex11-18
  lvl: ncert-ex
  num: 18
  source: NCERT X Science · Ch 11 · Exercise 18
  kind: text
  q: |-
    Explain the following.
    (a) Why is the tungsten used almost exclusively for filament of electric lamps?
    (b) Why are the conductors of electric heating devices, such as bread-toasters and electric irons, made of an alloy rather than a pure metal?
    (c) Why is the series arrangement not used for domestic circuits?
    (d) How does the resistance of a wire vary with its area of cross-section?
    (e) Why are copper and aluminium wires usually employed for electricity transmission?
  sol: |
    (a) Tungsten has a very high melting point (3380 °C), so the filament can be heated white-hot to give light without melting.

    (b) An alloy has a higher resistivity than its constituent metals, so it produces more heat for the same current, and it does not oxidise (burn) readily at high temperatures, so it lasts.

    (c) In series the same current passes through every appliance, and if one fails or is switched off the circuit breaks and all stop working. Appliances also need different currents and the full supply voltage, which only a parallel arrangement gives.

    (d) $R = \rho l/A$, so the resistance varies **inversely** with the area of cross-section: doubling the area halves the resistance.

    (e) Copper and aluminium have very low resistivity (of the order $10^{-8}\ \Omega\,\text{m}$), so little energy is lost as heat $I^2R$ in the lines.
  answer_key: "(b) High resistivity of alloys; (d) inversely."
  check: ncert-key

