- id: b2
  lvl: board
  kind: num
  q: A proton is accelerated from rest through a potential difference of 2000 V. What is its final speed? Take m = 1.67 × 10⁻²⁷ kg. (Original problem.)
  ask: Speed
  unit: m/s
  ans: 6.2e5
  tol: 5e3
  verify: Math.sqrt(2*1.6e-19*2000/1.67e-27)
  sol: $\tfrac12mv^2 = eV$ so $v = \sqrt{2eV/m} = \sqrt{2\times1.6\times10^{-19}\times2000/1.67\times10^{-27}} = 6.2\times10^{5}$ m/s.
  check: code

- id: m1
  lvl: main
  kind: num
  q: Four equal charges of +2 µC each are placed at the corners of a square of side 10 cm. Find the electric potential at the centre and the work needed to bring a +1 µC charge there from infinity. Give the work. (Original problem.)
  ask: Work
  unit: J
  ans: 1.02
  tol: 0.01
  verify: 1e-6*4*9e9*2e-6/(0.1/Math.SQRT2*1)
  sol: Each corner is at distance $d/\sqrt2 = 7.07$ cm from the centre. $V = 4\times9\times10^{9}\times\dfrac{2\times10^{-6}}{0.0707} = 1.02\times10^{6}$ V. Work $= q'V = 10^{-6}\times1.02\times10^{6} = 1.02$ J.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A charge of +3 µC is held fixed at the origin. A small particle of mass 2 g and charge +1 µC is released from rest at 3 cm from it. Find the speed of the particle when it is very far away. (Original problem.)
  ask: Speed at infinity
  unit: m/s
  ans: 30
  tol: 0.05
  verify: Math.sqrt(2*9e9*3e-6*1e-6/0.03/2e-3)
  sol: Energy conservation. $U_i = \dfrac{1}{4\pi\varepsilon_0}\dfrac{q_1q_2}{r} = 9\times10^{9}\times\dfrac{3\times10^{-6}\times10^{-6}}{0.03} = 0.9$ J, and $U_f = 0$ at infinity. So $\tfrac12mv^2 = 0.9$ J and $v = \sqrt{2\times0.9/(2\times10^{-3})} = 30$ m/s.
  check: code
