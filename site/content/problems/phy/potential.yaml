  verify: 1-Math.pow(2,-2/3)
  sol: |
    **Self-energy of a uniform ball.** Build it in thin layers. When the radius is $r$, the charge is $Qr^3/R^3$ and the surface potential is $kQr^2/R^3$. A layer $dq = 3Qr^2dr/R^3$ costs $kQr^2/R^3\cdot dq$. So
    $$U_0 = \int_0^R \frac{3kQ^2r^4}{R^6}\,dr = \frac{3kQ^2}{5R}.$$

    **After the split.** Each piece has charge $Q/2$ and half the volume, so radius $R/2^{1/3}$. The two are far apart, so there is no interaction energy:
    $$U_1 = 2\times\frac{3k(Q/2)^2}{5R/2^{1/3}} = \frac{3kQ^2}{5R}\cdot\frac{2^{1/3}}{2} = U_0\,2^{-2/3}.$$

    **Released:** $1 - 2^{-2/3} = 1 - 0.630 = 0.370$ of $U_0$, i.e. 37 %.

    This is the electrostatic part of the energy argument for why heavy nuclei can release energy by splitting; in a real nucleus the attractive nuclear (surface) energy works the other way. [Inference: the nuclear remark is qualitative context, not part of the calculation.]
  check: code

- id: o3
  lvl: oly
  kind: num
  q: "An uncharged, isolated metal sphere of radius 10 cm has a point charge of +5 nC held 30 cm from its centre. (a) What is the potential of the sphere? (b) The sphere is now connected to earth. How much charge flows through the earth wire? Give the magnitude for (b). (Original problem.)"
  ask: Magnitude of charge through the earth wire
  unit: nC
  ans: 1.667
  tol: 0.005
  verify: 5*10/30
  sol: |
    **Key idea.** The whole sphere, including its centre, is at one potential. So compute the potential **at the centre**, where the unknown induced charge is easy to handle: all of it lies at distance $R$ from the centre, so it contributes $kQ_{\text{ind}}/R$, however it is distributed.

    **(a)** The sphere is uncharged, so $Q_{\text{ind}} = 0$ in total and contributes nothing at the centre:
    $$V = \frac{kq}{a} = \frac{9\times10^9\times5\times10^{-9}}{0.30} = 150\ \text{V}.$$

    **(b)** Earthed, the sphere is at $V = 0$ with some net charge $Q$:
    $$\frac{kq}{a} + \frac{kQ}{R} = 0 \;\Rightarrow\; Q = -q\frac{R}{a} = -5\times\frac{10}{30} = -1.67\ \text{nC}.$$
    So 1.67 nC of negative charge (electrons) flows up from the earth onto the sphere.

    This agrees with the image method: the image of $q$ in an earthed sphere is $-qR/a$, and by Gauss's law it equals the total induced charge.
  check: code

- id: o4
  lvl: oly
  kind: num
  q: "A proton with kinetic energy 1.0 MeV moves straight towards an alpha particle that is initially at rest and free to move. Treat both as point charges, take the alpha particle's mass as 4 times the proton's, and use e²/4πε₀ = 1.44 MeV fm. Find the distance of closest approach. (Original problem.)"
  ask: Distance of closest approach
  unit: fm
  ans: 3.6
  tol: 0.01
  verify: 2*1.44/(1.0*4/5)
  sol: |
    **Momentum.** At closest approach the separation stops changing, so both particles move with the same velocity, the centre-of-mass velocity $V = \dfrac{mv}{m + M}$.

    **Energy.** The kinetic energy left at that moment is $\tfrac12(m+M)V^2 = K\,\dfrac{m}{m+M}$. The remainder became potential energy:
    $$\frac{k(e)(2e)}{r_{\min}} = K\,\frac{M}{m+M} = 1.0\times\frac45 = 0.80\ \text{MeV}.$$

    $$r_{\min} = \frac{2\times1.44\ \text{MeV fm}}{0.80\ \text{MeV}} = 3.6\ \text{fm}.$$

    A fixed target would give $2\times1.44/1.0 = 2.88$ fm: the recoil keeps the proton further away. (At such distances the nuclear force would matter in reality; the problem asks for the electrostatic answer only.)
  check: code
