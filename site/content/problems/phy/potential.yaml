- id: a1
  lvl: adv
  kind: num
  q: "A thin ring of radius 10 cm carries +1 µC spread uniformly and is held fixed. A small bead of mass 1 g and charge +1 µC is on the ring's axis, 10 cm from its centre, and can move only along the axis. What is the least speed with which it must be projected towards the ring so that it passes through the centre? Ignore gravity. (Original problem.)"
  ask: Least projection speed
  unit: m/s
  ans: 7.26
  tol: 0.02
  verify: Math.sqrt(2*9e9*1e-12/0.1*(1-1/Math.SQRT2)/1e-3)
  sol: |
    On the axis every element of the ring is at distance $\sqrt{R^2+x^2}$, so $V(x) = \dfrac{kQ}{\sqrt{R^2+x^2}}$. This increases steadily as $x$ falls to 0, so the highest point of the potential "hill" on the path is the centre itself. The bead just gets there if its speed falls to zero at $x = 0$.

    $kqQ/R = 9\times10^{9}\times10^{-6}\times10^{-6}/0.1 = 0.09$ J. Start at $x = R$: $U_i = 0.09/\sqrt2 = 0.0636$ J. At the centre $U_f = 0.09$ J.

    $\tfrac12mv_0^2 = U_f - U_i = 0.09\,(1 - 1/\sqrt2) = 0.02636$ J, so $v_0 = \sqrt{2\times0.02636/10^{-3}} = 7.26$ m/s.

    Once past the centre it is pushed out the other side and escapes.
  check: code

- id: a2
  lvl: adv
  kind: num
  q: "Two small balls, of masses 2 g and 6 g and charges +2 µC and +3 µC, are held 10 cm apart on a smooth horizontal insulating table and released together. Find the speed of the lighter ball when they are very far apart. (Original problem.)"
  ask: Final speed of the 2 g ball
  unit: m/s
  ans: 20.12
  tol: 0.05
  verify: Math.sqrt(2*6e-3*(9e9*6e-12/0.1)/(2e-3*8e-3))
  sol: |
    No external horizontal force acts, so momentum stays zero: $m_1v_1 = m_2v_2$. Energy: $U_i = \dfrac{kq_1q_2}{r} = \dfrac{9\times10^9\times6\times10^{-12}}{0.1} = 0.54$ J becomes kinetic energy.

    $\tfrac12m_1v_1^2 + \tfrac12m_2v_2^2 = U$ with $v_2 = m_1v_1/m_2$ gives $\tfrac12m_1v_1^2\left(1 + \dfrac{m_1}{m_2}\right) = U$, so
    $$v_1 = \sqrt{\frac{2m_2U}{m_1(m_1+m_2)}} = \sqrt{\frac{2\times6\times10^{-3}\times0.54}{2\times10^{-3}\times8\times10^{-3}}} = \sqrt{405} = 20.1\ \text{m/s}.$$

    The light ball takes $\tfrac{3}{4}$ of the energy (0.405 J), the heavy one $\tfrac14$: the shares are in the inverse ratio of the masses.
  check: code

- id: a3
  lvl: adv
  kind: num
  q: "Two thin concentric metal shells have radii 10 cm and 20 cm. The outer shell carries +6 nC; the inner shell is initially uncharged. The inner shell is now connected to earth by a fine insulated wire passing through a tiny hole in the outer shell. Find the potential of the outer shell afterwards. (Original problem.)"
  ask: Potential of the outer shell
  unit: V
  ans: 135
  tol: 0.5
  verify: 9e9*(6e-9-6e-9*0.1/0.2)/0.2
  sol: |
    Earthing fixes the inner shell's **potential** at zero, not its charge. Let it acquire $q$. The inner shell is inside the outer one, so the outer shell's charge contributes the constant $kQ/b$ there:
    $$\frac{kq}{a} + \frac{kQ}{b} = 0 \;\Rightarrow\; q = -Q\frac{a}{b} = -6\times\frac{10}{20} = -3\ \text{nC}.$$

    For the outer shell both charges act as if at the centre:
    $$V_b = \frac{k(q + Q)}{b} = \frac{9\times10^9\times3\times10^{-9}}{0.2} = 135\ \text{V}.$$

    Before earthing it was $9\times10^9\times6\times10^{-9}/0.2 = 270$ V; earthing the inner shell halves it.
  check: code

- id: a4
  lvl: adv
  kind: num
  q: "In a region of space the electric potential is V = 4x²y − 3yz volts, with x, y, z in metres. Find the magnitude of the electric field at the point (1 m, 2 m, 1 m). (Original problem.)"
  ask: Magnitude of E
  unit: V/m
  ans: 17.12
  tol: 0.02
  verify: Math.sqrt((8*1*2)**2+(4*1-3*1)**2+(3*2)**2)
  sol: |
    $\vec E = -\nabla V$:
    $E_x = -\partial V/\partial x = -8xy = -16$, $E_y = -\partial V/\partial y = -(4x^2 - 3z) = -1$, $E_z = -\partial V/\partial z = 3y = 6$ (V/m).

    $|\vec E| = \sqrt{256 + 1 + 36} = \sqrt{293} = 17.1$ V/m.

    (Since $\nabla^2V = 8y \ne 0$, this region contains charge, of density $\rho = -\varepsilon_0\nabla^2V$; the potential is a valid one, just not charge-free.)
  check: code

- id: o1
  lvl: oly
  kind: num
  q: "A small ball carrying +2 µC is held 3 cm from a large flat earthed metal plate. How much work must an external agent do to carry the ball slowly away to a very large distance? (Original problem.)"
  ask: Work required
  unit: J
  ans: 0.3
  tol: 0.002
  verify: 9e9*(2e-6)**2/(4*0.03)
  sol: |
    **Image.** Above the plate, the field is that of the charge $q$ together with an image $-q$ at the mirror point. When the ball is at distance $x$ from the plate, the image is $2x$ away, so the attraction is
    $$F(x) = \frac{kq^2}{(2x)^2} = \frac{kq^2}{4x^2}.$$

    **Work.** The image moves as the ball moves, so we must integrate the force, not use a two-charge energy formula:
    $$W = \int_d^\infty \frac{kq^2}{4x^2}\,dx = \frac{kq^2}{4d} = \frac{9\times10^9\times(2\times10^{-6})^2}{4\times0.03} = 0.30\ \text{J}.$$

    **Trap.** $kq^2/(2d) = 0.60$ J is wrong: that would be the energy to separate two real charges $q$ and $-q$ from $2d$, where the field fills all space. Here the field exists only above the plate, so the energy is half.
  check: code

