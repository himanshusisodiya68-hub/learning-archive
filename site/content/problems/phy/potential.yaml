  sol: Energy conservation. $U_i = \dfrac{1}{4\pi\varepsilon_0}\dfrac{q_1q_2}{r} = 9\times10^{9}\times\dfrac{3\times10^{-6}\times10^{-6}}{0.03} = 0.9$ J, and $U_f = 0$ at infinity. So $\tfrac12mv^2 = 0.9$ J and $v = \sqrt{2\times0.9/(2\times10^{-3})} = 30$ m/s.
