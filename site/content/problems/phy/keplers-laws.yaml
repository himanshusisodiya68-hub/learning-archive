- id: f3
  lvl: found
  kind: mcq
  q: Kepler's second law (equal areas in equal times) is a direct consequence of
  opts: ["conservation of energy", "conservation of angular momentum, because the force is central", "the inverse-square nature of the force"]
  ans: 1
  sol: A central force exerts no torque about the Sun, so angular momentum is conserved, and the areal speed is $L/2m$. The result holds for any central force; the inverse-square law matters for the first and third laws.
