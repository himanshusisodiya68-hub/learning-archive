- id: b3
  lvl: board
  kind: num
  q: A comet has its nearest point to the Sun at 0.5 AU and its farthest at 31.5 AU. Find its period in years.
  ask: Period
  unit: years
  ans: 64
  tol: 0.1
  verify: ((0.5+31.5)/2)**1.5
  sol: The major axis is the sum of the nearest and farthest distances, so $2a = 0.5 + 31.5 = 32$ AU and $a = 16$ AU. Then $T = a^{3/2} = 16^{3/2} = 64$ years.
