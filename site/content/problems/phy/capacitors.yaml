# Capacitors and dielectrics. NCERT questions copied word for word from NCERT Physics Class XII Part I (reprint 2026-27), Ch 2, §2.10–2.15 and Exercises 2.5–2.11. The symbols µ (micro) are written as µ, as printed. Found, board, main problems are original.

- id: ncert12-eg-2-8
  lvl: ncert-intext
  num: "XII Ex 2.8"
  source: NCERT XII Physics · Ch 2 · Example 2.8
  kind: text
  q: A slab of material of dielectric constant K has the same area as the plates of a parallel-plate capacitor but has a thickness (3/4)d, where d is the separation of the plates. How is the capacitance changed when the slab is inserted between the plates?
  sol: |
    Let the field without the dielectric be $E_0 = V_0/d$ for charge $Q_0$ on the plates. With the slab inserted, the field inside the dielectric is $E_0/K$, and in the remaining air gap $\tfrac14d$ it is still $E_0$. The potential difference is

    $$V = E_0\cdot\frac d4 + \frac{E_0}{K}\cdot\frac{3d}{4} = E_0d\left(\frac14 + \frac{3}{4K}\right) = V_0\,\frac{K+3}{4K}.$$

    The free charge $Q_0$ is unchanged, so the capacitance becomes

    $$C = \frac{Q_0}{V} = \frac{4K}{K+3}\,\frac{Q_0}{V_0} = \frac{4K}{K+3}\,C_0.$$

    It increases by the factor $4K/(K+3)$ (which is greater than 1 for $K > 1$ and tends to 4 for a conductor, $K\to\infty$).
  check: none

- id: ncert12-eg-2-9
  lvl: ncert-intext
  num: "XII Ex 2.9"
  source: NCERT XII Physics · Ch 2 · Example 2.9
  kind: num
  q: |
    A network of four 10 µF capacitors is connected to a 500 V supply, as shown in Fig. 2.29. Determine (a) the equivalent capacitance of the network and (b) the charge on each capacitor. (Note, the charge on a capacitor is the charge on the plate with higher potential, equal and opposite to the charge on the plate with lower potential.) [Fig. 2.29 as printed, consistent with the solution: C₁, C₂ and C₃ in series, and that chain in parallel with C₄, across the 500 V supply.]
  ask: Equivalent capacitance
  unit: µF
  ans: 13.33
  tol: 0.01
  verify: 10/3+10
  sol: |
    (a) $C_1$, $C_2$, $C_3$ are in series: $\dfrac1{C'} = \dfrac1{10} + \dfrac1{10} + \dfrac1{10}$, so $C' = \dfrac{10}{3}\ \mu$F. This is in parallel with $C_4$: $C = C' + C_4 = \left(\dfrac{10}{3} + 10\right)\mu\text{F} = 13.3\ \mu$F.

    (b) The three series capacitors carry the same charge $Q$ and their potential differences add to 500 V: $\dfrac{Q}{C_1} + \dfrac{Q}{C_2} + \dfrac{Q}{C_3} = 500$ V, so $Q = 500\times\dfrac{10}{3}\ \mu\text{F} = 1.7\times10^{-3}$ C on each of $C_1, C_2, C_3$. $C_4$ has the full 500 V: $Q' = C_4\times500 = 10\times10^{-6}\times500 = 5\times10^{-3}$ C.
  check: code

- id: ncert12-eg-2-10
  lvl: ncert-intext
  num: "XII Ex 2.10"
  source: NCERT XII Physics · Ch 2 · Example 2.10
  kind: num
  q: (a) A 900 pF capacitor is charged by 100 V battery [Fig. 2.31(a)]. How much electrostatic energy is stored by the capacitor? (b) The capacitor is disconnected from the battery and connected to another 900 pF capacitor [Fig. 2.31(b)]. What is the electrostatic energy stored by the system?
  ask: Energy stored by the system, part (b)
  unit: µJ
  ans: 2.25
  tol: 0.005
  verify: 0.25*900e-12*100**2*1e6
  sol: |
    (a) $Q = CV = 900\times10^{-12}\times100 = 9\times10^{-8}$ C and $U = \tfrac12CV^2 = \tfrac12QV = 4.5\times10^{-6}$ J.

    (b) In the steady state the capacitors are in parallel, with the same potential difference $V'$. Charge is conserved: $2CV' = Q$, so each has $Q' = Q/2$ and $V' = V/2 = 50$ V. The total energy is $2\times\tfrac12Q'V' = \tfrac14QV = 2.25\times10^{-6}$ J.

    Though no charge is lost, the energy has halved. During the brief transient a current flows from the first capacitor to the second, and the missing energy is lost as heat and electromagnetic radiation.
  check: code

- id: ncert12-ex-2-5
  lvl: ncert-ex
  num: "XII 2.5"
  source: NCERT XII Physics · Ch 2 · Exercise 2.5
  kind: num
  q: A parallel plate capacitor with air between the plates has a capacitance of 8 pF (1pF = 10⁻¹² F). What will be the capacitance if the distance between the plates is reduced by half, and the space between them is filled with a substance of dielectric constant 6?
  ask: New capacitance
  unit: pF
  ans: 96
  tol: 0.01
  verify: 8*2*6
  sol: |
    $C = K\varepsilon_0A/d$. Halving $d$ doubles $C$, and filling with $K = 6$ multiplies it by 6: $C' = 8\times2\times6 = 96$ pF.
  answer_key: 96 pF
  check: both

- id: ncert12-ex-2-6
  lvl: ncert-ex
  num: "XII 2.6"
  source: NCERT XII Physics · Ch 2 · Exercise 2.6
  kind: num
  q: |-
    Three capacitors each of capacitance 9 pF are connected in series.
    (a) What is the total capacitance of the combination?
    (b) What is the potential difference across each capacitor if the combination is connected to a 120 V supply?
  ask: Potential difference across each capacitor
  unit: V
  ans: 40
  tol: 0.01
  verify: 120/3
  sol: |
    (a) In series, $\dfrac1C = \dfrac19 + \dfrac19 + \dfrac19 = \dfrac13$, so $C = 3$ pF.

    (b) Identical capacitors in series carry the same charge and share the potential difference equally: $V = 120/3 = 40$ V each.
  answer_key: "(a) 3 pF (b) 40 V"
  check: both

- id: ncert12-ex-2-7
  lvl: ncert-ex
  num: "XII 2.7"
  source: NCERT XII Physics · Ch 2 · Exercise 2.7
  kind: num
  q: |-
    Three capacitors of capacitances 2 pF, 3 pF and 4 pF are connected in parallel.
    (a) What is the total capacitance of the combination?
    (b) Determine the charge on each capacitor if the combination is connected to a 100 V supply.
  ask: Total capacitance
  unit: pF
  ans: 9
  tol: 0.001
  verify: 2+3+4
  sol: |
    (a) In parallel the capacitances add: $C = 2 + 3 + 4 = 9$ pF.

    (b) Each capacitor has the full 100 V: $Q_1 = 2\times10^{-12}\times100 = 2\times10^{-10}$ C, $Q_2 = 3\times10^{-10}$ C, $Q_3 = 4\times10^{-10}$ C.
  answer_key: "(a) 9 pF (b) 2 × 10⁻¹⁰ C, 3 × 10⁻¹⁰ C, 4 × 10⁻¹⁰ C"
  check: both

- id: ncert12-ex-2-8
  lvl: ncert-ex
  num: "XII 2.8"
  source: NCERT XII Physics · Ch 2 · Exercise 2.8
  kind: num
  q: In a parallel plate capacitor with air between the plates, each plate has an area of 6 × 10⁻³ m² and the distance between the plates is 3 mm. Calculate the capacitance of the capacitor. If this capacitor is connected to a 100 V supply, what is the charge on each plate of the capacitor?
  ask: Capacitance
  unit: pF
  ans: 17.7
  tol: 0.05
  verify: 8.854e-12*6e-3/3e-3*1e12
  sol: |
    $C = \dfrac{\varepsilon_0A}{d} = \dfrac{8.854\times10^{-12}\times6\times10^{-3}}{3\times10^{-3}} = 1.77\times10^{-11}$ F $= 17.7$ pF, which the answer key rounds to 18 pF. The charge on each plate is $Q = CV = 1.77\times10^{-11}\times100 = 1.8\times10^{-9}$ C, with $+Q$ on one plate and $-Q$ on the other.
  answer_key: 18 pF, 1.8 × 10⁻⁹ C
  check: both

- id: ncert12-ex-2-9
  lvl: ncert-ex
  num: "XII 2.9"
  source: NCERT XII Physics · Ch 2 · Exercise 2.9
  kind: num
  q: |-
    Explain what would happen if in the capacitor given in Exercise 2.8, a 3 mm thick mica sheet (of dielectric constant = 6) were inserted between the plates,
    (a) while the voltage supply remained connected.
    (b) after the supply was disconnected.
  ask: Potential difference after the supply is disconnected and the mica inserted, part (b)
  unit: V
  ans: 16.7
  tol: 0.05
  verify: 100/6
  sol: |
    The mica fills the whole gap, so the capacitance becomes $C' = KC_0 = 6\times17.7 = 106$ pF (the key uses the rounded $C_0 = 18$ pF and quotes 108 pF).

    (a) **Supply connected:** $V$ stays at 100 V. The capacitance rises to 106 pF, so more charge is drawn from the battery: $Q' = C'V = 106\times10^{-12}\times100 = 1.06\times10^{-8}$ C (the key: $1.08\times10^{-8}$ C), six times the original charge.

    (b) **Supply disconnected:** the charge cannot change, $Q = 1.77\times10^{-9}$ C (the key: $1.8\times10^{-9}$ C). The capacitance rises to 106 pF, so the potential difference falls to $V' = Q/C' = V/K = 100/6 = 16.7$ V (the key quotes 16.6 V).

    [Inference] The small differences from the key (108 pF, $1.08\times10^{-8}$ C, 16.6 V) come from the key rounding $C_0$ to 18 pF.
  answer_key: "(a) V = 100 V, C = 108 pF, Q = 1.08 × 10⁻⁸ C (b) Q = 1.8 × 10⁻⁹ C, C = 108 pF, V = 16.6 V"
  check: both

