- id: ncert12-ex-2-11
  lvl: ncert-ex
  num: "XII 2.11"
  source: NCERT XII Physics · Ch 2 · Exercise 2.11
  kind: num
  q: A 600pF capacitor is charged by a 200V supply. It is then disconnected from the supply and is connected to another uncharged 600 pF capacitor. How much electrostatic energy is lost in the process?
  ask: Energy lost
  unit: J
  ans: 6e-6
  tol: 1e-8
  verify: 0.5*600e-12*200**2-0.5*2*600e-12*100**2
  sol: |
    Initial energy $U_i = \tfrac12CV^2 = \tfrac12\times600\times10^{-12}\times(200)^2 = 1.2\times10^{-5}$ J. After connection the charge $Q = CV$ is shared equally, $V' = 100$ V on each, and $U_f = 2\times\tfrac12\times600\times10^{-12}\times(100)^2 = 6\times10^{-6}$ J. The energy lost is $U_i - U_f = 6\times10^{-6}$ J, half of the initial energy (dissipated as heat and radiation).
  answer_key: 6 × 10⁻⁶ J
  check: both

