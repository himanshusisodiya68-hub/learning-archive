- id: b2
  lvl: board
  kind: num
  q: Capacitors of 6 µF and 3 µF are connected in series across a 90 V supply. Find the potential difference across the 3 µF capacitor. (Original problem.)
  ask: Potential difference across 3 µF
  unit: V
  ans: 60
  tol: 0.01
  verify: 90*6/(6+3)
  sol: Both carry the same charge $Q = C_{eq}V = 2\ \mu\text{F}\times90 = 180\ \mu$C. The 3 µF capacitor has $V = Q/C = 180/3 = 60$ V (and the 6 µF has 30 V). In a series pair the smaller capacitor takes the larger share.
  check: code

- id: m1
  lvl: main
  kind: num
  q: A parallel-plate capacitor of capacitance 20 µF is charged to 100 V and disconnected. A dielectric slab of K = 4 then fills the space between the plates. Find the work done by the external agent in inserting the slab (negative means the capacitor does work). (Original problem.)
  ask: Work done by the external agent
  unit: mJ
  ans: -75
  tol: 0.05
  verify: (0.5*(20e-6*100)**2/(4*20e-6)-0.5*20e-6*100**2)*1e3
  sol: |
    The charge is fixed at $Q = CV = 2\times10^{-3}$ C. Initial energy $\tfrac12Q^2/C = 0.1$ J. With the slab, $C' = KC = 80\ \mu$F, so $U' = \tfrac12Q^2/C' = 0.025$ J. The change is $-0.075$ J: the work done by the external agent is $-75$ mJ. The slab is pulled into the capacitor by the field, so the capacitor does 75 mJ of work.
  check: code

- id: m2
  lvl: main
  kind: num
  q: A 4 µF capacitor charged to 200 V is connected in parallel with an uncharged 6 µF capacitor. Find the final common potential and the energy lost. Give the energy lost. (Original problem.)
  ask: Energy lost
  unit: mJ
  ans: 48
  tol: 0.05
  verify: (0.5*4e-6*200**2-0.5*(4e-6+6e-6)*(4e-6*200/(10e-6))**2)*1e3
  sol: |
    Charge $Q = 4\times10^{-6}\times200 = 8\times10^{-4}$ C is shared: $V' = Q/(C_1+C_2) = 80$ V. $U_i = \tfrac12\times4\times10^{-6}\times200^2 = 0.08$ J and $U_f = \tfrac12\times10\times10^{-6}\times80^2 = 0.032$ J. The energy lost is $0.048$ J $= 48$ mJ, as heat and radiation in the connecting wires.
  check: code
