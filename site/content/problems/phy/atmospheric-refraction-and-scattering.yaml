  q: The sky appears blue because
  opts: ["the oceans reflect blue light upwards", "air molecules scatter blue light more than red", "the Sun emits mostly blue light"]
  ans: 1
  sol: Molecules much smaller than the wavelength scatter short wavelengths far more strongly, so the scattered light filling the sky is blue.
