  q: Why do clouds look white?
  opts: ["Their droplets are large enough to scatter all colours about equally", "They contain white dust", "They absorb blue light"]
  ans: 0
  sol: Cloud droplets are larger than the wavelength of light, so they scatter all colours roughly equally and the mixture looks white.
