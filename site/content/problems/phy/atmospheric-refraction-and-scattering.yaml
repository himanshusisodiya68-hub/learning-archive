- id: b1
  lvl: board
  kind: mcq
  q: Why does the Sun appear reddish at sunrise?
  opts: ["It is cooler in the morning", "Its light crosses a long path of air that scatters away most of the blue", "Clouds reflect red light"]
  ans: 1
  sol: Near the horizon sunlight travels through much more air. Most short-wavelength light is scattered out on the way, leaving mainly red and orange in the direct beam.
  check: none

