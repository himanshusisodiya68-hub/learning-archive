- id: f2
  lvl: found
  kind: mcq
  q: Why are danger and stop signals red?
  opts: ["Red is scattered least, so it is seen from far away", "Red light travels faster", "The eye is most sensitive to red"]
  ans: 0
  sol: Red light is scattered least by fog, smoke and dust, so it penetrates them best and is visible from the greatest distance.
