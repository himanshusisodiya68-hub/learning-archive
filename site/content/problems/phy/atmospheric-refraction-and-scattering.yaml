# Atmospheric refraction and scattering. NCERT questions copied word for word from NCERT Science Class X (reprint 2026-27), Ch 10.

- id: ncert-ex10-10
  lvl: ncert-ex
  num: 10
  source: NCERT X Science · Ch 10 · Exercise 10 · p. 170
  kind: text
  q: Why do stars twinkle?
  sol: |
    Starlight travels through the Earth's atmosphere, whose density and refractive index keep changing from moment to moment. The light is refracted by varying amounts, so the apparent position of the star shifts slightly and the amount of light entering the eye fluctuates. Because a star is so far away that it is effectively a point source, these fluctuations are noticeable: the star twinkles.
  check: none

- id: ncert-ex10-11
  lvl: ncert-ex
  num: 11
  source: NCERT X Science · Ch 10 · Exercise 11 · p. 170
  kind: text
  q: Explain why the planets do not twinkle.
  sol: Planets are much nearer than stars and appear as small discs, so they act as extended sources, a collection of many point sources. The variations in light from the different points are random and cancel out on average, so the total light reaching the eye stays steady and the planet does not twinkle.
  check: none

- id: ncert-ex10-12
  lvl: ncert-ex
  num: 12
  source: NCERT X Science · Ch 10 · Exercise 12 · p. 170
  kind: text
  q: Why does the sky appear dark instead of blue to an astronaut?
  sol: The blue colour of the sky is sunlight scattered by molecules of the atmosphere. Above the atmosphere there are no particles to scatter light, so no scattered light reaches the astronaut's eyes from directions away from the Sun, and the sky looks dark.
  check: none

