- id: b1
  lvl: board
  kind: num
  q: What does `-17 % 5` give in Python?
  ask: Value
  unit: ""
  ans: 3
  tol: 0.1
  verify: ((-17 % 5) + 5) % 5
  sol: Python floors the division, so `-17 // 5` is `-4`. The remainder is whatever rebuilds the number, $-17 = (-4)\times 5 + r$, so $r = 3$.
