# Values and types. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A shop bill is ₹249.75. The app stores money as a whole number of paise. What whole number does it store?
  ask: Stored value
  unit: paise
  ans: 24975
  tol: 0.5
  verify: round(249.75*100)
  sol: One rupee is 100 paise, so $249.75 \times 100 = 24975$. Whole numbers add and compare exactly, which is why payment systems prefer them to binary floats.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: What is the type of the value of `10 / 5` in Python?
  opts: ["int, since 10 and 5 are whole numbers", "float, since / is true division and always gives a float", "str"]
  ans: 1
  sol: In Python 3 the `/` operator always returns a float, so `10 / 5` is `2.0`, not `2`. Use `//` when you want a whole number.
