# Native vs cross-platform apps. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A food app takes 8 person-months to build natively on one platform. Building natively for both Android and iPhone takes about twice that. How many person-months is that?
  ask: Total effort
  unit: person-months
  ans: 16
  tol: 0.1
  verify: 2*8
  sol: One app per platform means the work is repeated, so $2 \times 8 = 16$ person-months. This is the simple model from the lesson, cost of about $n$ times one app; real projects share designs and the server, so treat it as an estimate.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which approach draws every pixel of the screen with its own engine?
  opts: ["Flutter", "React Native", "A native Swift app"]
  ans: 0
  sol: Flutter ships its own drawing engine. React Native asks the platform to draw real native views, and a Swift app uses the iPhone's own controls.
  check: none

- id: b1
  lvl: board
  kind: num
  q: Using the model "shared cost = one app + glue", a team builds one app in 8 person-months and adds 3 person-months of platform glue and testing for two platforms. By how many person-months does this beat building two native apps (16 person-months)?
  ask: Saving
  unit: person-months
  ans: 5
  tol: 0.1
  verify: 16-(8+3)
  sol: Shared cost is $8 + 3 = 11$ person-months. Saving is $16 - 11 = 5$ person-months, about 31% of the native cost. Note that the model ignores later costs such as plugin bugs and framework upgrades.
  check: code

- id: b2
  lvl: board
  kind: mcq
  q: Which of these is a real limit of a progressive web app (PWA) compared with a native app?
  opts: ["It cannot be installed to the home screen", "Some device features and background abilities may be weaker or missing", "It cannot work offline in any way"]
  ans: 1
  sol: A PWA can be installed and can work offline through a service worker. The usual limits are device access and background features, which vary between browsers and platforms.
