# Relational model and SQL. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A customers table has 1,000 rows and an orders table has 5,000 rows. You write a join but forget the ON condition. How many rows does the database return?
  ask: Rows
  unit: ""
  ans: 5000000
  tol: 1
  verify: 1000*5000
  sol: Without a matching condition every customer pairs with every order, a cross product. That is $1000 \times 5000 = 5{,}000{,}000$ rows.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: A school keeps a students table. Which column is the best primary key?
  opts: ["name", "city", "roll_number (different for every student)", "class"]
  ans: 2
  sol: A primary key must be different in every row. Names repeat, many students share a city and a class, but a roll number is issued once per student.
