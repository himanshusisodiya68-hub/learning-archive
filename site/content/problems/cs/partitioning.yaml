# Partitioning and sharding. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A service must store 1 billion posts, and one machine can hold 50 million. What is the smallest number of machines (ignoring replicas) that can hold all the posts?
  ask: Machines
  unit: ""
  ans: 20
  tol: 0.1
  verify: ceil(1e9/50e6)
  sol: $10^9 / (5 \times 10^7) = 20$ exactly, so 20 machines. In practice you would use more, to leave room for growth and uneven sizes, and each would also be replicated.
  check: code

