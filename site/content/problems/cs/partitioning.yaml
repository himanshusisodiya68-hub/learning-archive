  q: Which query is cheap under hash partitioning of orders by order id?
  opts: ["Fetch order 90412", "List all orders placed between 1 and 7 October", "List orders in order-id sequence"]
  ans: 0
  sol: Hashing sends order 90412 to one known partition. Range and ordered queries need the neighbours of a key, and hashing scatters neighbours across all partitions, so those must ask every partition.
