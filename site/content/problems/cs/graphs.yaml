# Graphs and their representations. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A group of 10 people. Every pair of them could be friends. What is the largest number of friendship edges the undirected graph can have, with no repeated pairs?
  ask: Edges
  unit: ""
  ans: 45
  tol: 0.1
  verify: 10 * 9 / 2
  sol: "Each of the 10 people can be paired with the 9 others, giving $10 \\times 9 = 90$ ordered pairs. A friendship is the same edge in both directions, so each unordered pair was counted twice, and the maximum is $90 / 2 = 45$. In general $V(V-1)/2$."
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which of these is best modelled as a directed graph?
  opts: ["Two cities joined by a two-way highway", "Web pages linking to other web pages", "Classmates who are in the same class"]
  ans: 1
  sol: A page A can link to page B without B linking back, so each link needs a direction. A two-way highway and "in the same class" are the same in both directions, so undirected edges suffice.
