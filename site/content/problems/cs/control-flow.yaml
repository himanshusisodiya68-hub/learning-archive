- id: f2
  lvl: found
  kind: mcq
  q: "Which loop never stops?"
  opts: ["`i = 0` then `while i < 5: i += 1`", "`i = 0` then `while i < 5: print(i)`", "`for i in range(5): print(i)`"]
  ans: 1
  sol: "In the second loop nothing changes `i`, so `i < 5` stays True for ever. The first loop moves `i` towards 5 on every pass, and the `for` loop runs out of numbers."
