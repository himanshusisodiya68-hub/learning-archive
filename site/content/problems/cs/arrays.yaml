  q: An array of 8-byte numbers starts at memory address 1000. At what address does item number 5 (counting from 0) begin?
  ask: Address
  unit: ""
  ans: 1040
  tol: 0.1
  verify: 1000 + 5*8
  sol: The address of item $i$ is $\text{start} + i \times s$. Here $1000 + 5 \times 8 = 1040$.
