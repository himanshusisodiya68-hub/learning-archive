- id: f2
  lvl: found
  kind: mcq
  q: Which problem has overlapping sub-problems, so that remembering answers pays off?
  opts: ["Merge sort of a list", "Fibonacci by plain recursion", "Binary search in a sorted list"]
  ans: 1
  sol: In plain Fibonacci recursion, fib(n-2) is needed by both fib(n) and fib(n-1), so the same sub-problem is solved many times. Merge sort's two halves are separate pieces, and binary search follows a single path.
