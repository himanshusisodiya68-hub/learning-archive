- id: m1
  lvl: main
  kind: num
  q: 'How many contiguous stretches of [3, 4, 7, 2, -3, 1, 4, 2] have a sum of exactly 7?'
  ask: Number of stretches
  unit: ""
  ans: 4
  tol: 0.01
  verify: '(()=>{const a=[3,4,7,2,-3,1,4,2];let c=0;for(let i=0;i<a.length;i++){let s=0;for(let j=i;j<a.length;j++){s+=a[j];if(s===7)c++}}return c})()'
  sol: |
    The stretches are $[3, 4]$, $[7]$, $[7, 2, -3, 1]$ and $[1, 4, 2]$. With prefix sums and a hash map the walk is: the running total goes 3, 7, 14, 16, 13, 14, 18, 20; at each step add the count of earlier totals equal to (current total - 7), then record the current total. The additions happen at totals 7 (finds 0), 14 (finds 7), 14 (finds 7), and 20 (finds 13), which gives 4.
    ```python
    count_sum_k([3, 4, 7, 2, -3, 1, 4, 2], 7)   # 4
    ```
  check: code

- id: m2
  lvl: main
  kind: text
  q: A list contains only 0s and 1s. Find the length of the longest contiguous stretch that has the same number of 0s and 1s. Describe an O(n) method.
  sol: |
    Replace every 0 by $-1$. A stretch with equally many 0s and 1s now has sum 0, which means two equal prefix sums enclose it. Walk with a running total and a dictionary `first` mapping each total to the first index at which it occurred, starting with `first[0] = -1`. At each index $i$, if the total was seen before at $j$, the stretch $j+1..i$ is balanced and has length $i - j$; keep the largest. Never overwrite `first` (we want the earliest index).
    ```python
    def longest_balanced(bits):
        first = {0: -1}
        s = best = 0
        for i, b in enumerate(bits):
            s += 1 if b else -1
            if s in first: best = max(best, i - first[s])
            else: first[s] = i
        return best
    ```
  check: none

- id: m3
  lvl: main
  kind: num
  q: 'How many contiguous stretches of [4, 5, 0, -2, -3, 1, 10, 5] have a sum divisible by 5 (a sum of 0 counts)?'
  ask: Number of stretches
  unit: ""
  ans: 12
  tol: 0.01
  verify: '(()=>{const a=[4,5,0,-2,-3,1,10,5];let c=0;for(let i=0;i<a.length;i++){let s=0;for(let j=i;j<a.length;j++){s+=a[j];if(s%5===0)c++}}return c})()'
  sol: |
    Prefix remainders mod 5 (with the leading 0) are 0, 4, 4, 4, 2, 4, 0, 0, 0. Two equal remainders enclose a stretch whose sum is a multiple of 5, so count pairs inside each group: remainder 0 occurs 4 times, giving $\binom{4}{2} = 6$; remainder 4 occurs 4 times, giving 6; remainder 2 occurs once, giving 0. Total $6 + 6 = 12$.
  check: code

- id: m4
  lvl: main
  kind: text
  q: There are 100,000 meetings, each with a start minute and an end minute (end not included), all between 0 and 1,440 in one day. How do you find the largest number of meetings that overlap at any moment, in about O(n + 1440)?
  sol: |
    Use a difference array over the minutes: for each meeting do `d[start] += 1` and `d[end] -= 1`. A prefix sum of `d` gives, for every minute, the number of meetings running at that minute; the answer is the maximum of that running total. Building `d` is $O(n)$ and the sweep is $O(1440)$.
    ```python
    def busiest(meetings, T=1441):
        d = [0] * (T + 1)
        for s, e in meetings:
            d[s] += 1; d[e] -= 1
        cur = best = 0
        for x in d:
            cur += x; best = max(best, cur)
        return best
    ```
    If the times were huge (up to $10^9$), sort the $2n$ start and end events instead: same idea in $O(n \log n)$.
  check: none

- id: a1
  lvl: adv
  kind: text
  q: A grid has R rows and C columns of integers, possibly negative, with R, C ≤ 300. Count the sub-rectangles whose sum is exactly k. A fourfold loop is too slow. Give an O(R² · C) method.
  sol: |
    Fix a top row $t$ and a bottom row $b$ ($O(R^2)$ choices). Add the rows $t..b$ column by column to get a 1D array `col[j]`. A sub-rectangle with those top and bottom rows is now just a stretch of `col`, so the number of such rectangles with sum $k$ is `count_sum_k(col, k)` (prefix sums plus hash map, $O(C)$). Summing over all $(t, b)$ gives $O(R^2 C)$, about $2.7\times10^7$ for 300, which is heavy for Python and fine for C++. Maintain `col` incrementally while $b$ grows, so that squashing costs $O(C)$ per $(t, b)$, not $O(RC)$.
  check: none

- id: a2
