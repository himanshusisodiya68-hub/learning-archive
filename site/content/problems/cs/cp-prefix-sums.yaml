  kind: num
  q: 'How many contiguous stretches of [5, 1, 4, 2, 3, 6, 7, 1] have a xor of 0?'
  ask: Number of stretches
  unit: ""
  ans: 4
  tol: 0.01
  verify: '(()=>{const a=[5,1,4,2,3,6,7,1];let c=0;for(let i=0;i<a.length;i++){let s=0;for(let j=i;j<a.length;j++){s^=a[j];if(s===0)c++}}return c})()'
  sol: |
    Prefix xors (with the leading 0) are 0, 5, 4, 0, 2, 1, 7, 0, 1. A stretch has xor 0 exactly when two prefix xors are equal. The value 0 appears at prefix positions 0, 3 and 7, giving 3 pairs: the stretches $[5,1,4]$, $[2,3,6,7]$ and the whole first seven numbers $[5,1,4,2,3,6,7]$. The value 1 appears at positions 5 and 8, giving the stretch $[6,7,1]$. Every other value appears once. Total 4.
  check: code

- id: o1
  lvl: oly
  kind: text
  q: Updates "add v to every cell from l to r" and questions "what is the sum from l to r?" are now mixed in any order, with 100,000 of each. Why do plain prefix sums and plain difference arrays both fail, and what can you say about the structure that does work?
  sol: |
    A prefix array answers sums in $O(1)$ but a single update changes up to $n$ of its cells, so $10^5$ updates cost about $10^{10}$. A difference array applies an update in $O(1)$ but a sum question then needs a full rebuild, $O(n)$ each. Both are fast at one half of the job and slow at the other.

    The way out is a structure that makes both operations $O(\log n)$: a **segment tree with lazy propagation**, or two Fenwick trees. The Fenwick version rests on this identity: if $d$ is the difference array, the prefix sum of the array up to $i$ equals $(i+1)\sum_{j \le i} d_j - \sum_{j \le i} j\, d_j$, so two Fenwick trees (one over $d_j$, one over $j\,d_j$) support range update and range sum. This is the subject of the range-queries lesson.
  check: none
