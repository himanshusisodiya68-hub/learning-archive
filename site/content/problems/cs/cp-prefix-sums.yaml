- id: b1
  lvl: board
  kind: num
  q: 'A difference array is used on 8 cells (positions 0 to 7), all starting at 0. First we add 5 to positions 2 to 5, then we add 3 to positions 4 to 7. What is the final value at position 4?'
  ask: Value
  unit: ""
  ans: 8
  tol: 0.01
  verify: '(()=>{const a=Array(8).fill(0);for(let i=2;i<=5;i++)a[i]+=5;for(let i=4;i<=7;i++)a[i]+=3;return a[4]})()'
  sol: 'The difference array gets d[2] += 5, d[6] -= 5, d[4] += 3 and d[8] -= 3 (the last write is outside the 8 cells, which is why the array needs 9 cells). Its running total gives [0, 0, 5, 5, 8, 8, 3, 3], so position 4 holds 8 (position 4 is inside both stretches: 5 + 3).'
  check: code

