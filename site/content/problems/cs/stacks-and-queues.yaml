- id: b1
  lvl: board
  kind: num
  q: A ring buffer has 8 slots, numbered 0 to 7. Its oldest item is in slot 6 (head = 6) and it currently holds 5 items. Which slot number is the next free slot where a new item will be written?
  ask: Slot number
  unit: ""
  ans: 3
  tol: 0.1
  verify: (6 + 5) % 8
  sol: The next free slot is $(\text{head} + \text{size}) \bmod m = (6 + 5) \bmod 8 = 11 \bmod 8 = 3$. The 5 items occupy slots 6, 7, 0, 1, 2, so slot 3 is next. The index has wrapped around the end of the array.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A program stores 100,000 jobs in a Python list and processes them with pop(0), taking the front item each time until the list is empty. Each pop(0) moves every item behind it one place forward. How many item moves happen in total?
  ask: Item moves
  unit: ""
  ans: 4999950000
  tol: 1
  verify: 100000 * 99999 / 2
  sol: The first pop(0) moves 99,999 items, the next 99,998, and so on down to 0. The total is $99999 + 99998 + \dots + 1 = \frac{100000 \times 99999}{2} = 4{,}999{,}950{,}000$, about five billion moves. Using `collections.deque` and `popleft()` makes each removal O(1), so the whole drain costs about 100,000 steps.
  check: code

- id: m1
  lvl: main
  kind: text
  q: Given a string made only of the characters ( ) [ ] { }, decide whether it is well formed, meaning every opener is closed by the matching closer in the right order. Explain the method, say what the two failure cases are, and give its cost.
  sol: |
    Scan left to right with a stack. Push each opener. For a closer, pop the top of the stack and check that it is the matching opener.
    ```python
    def balanced(s):
        pairs = {")": "(", "]": "[", "}": "{"}
        st = []
        for ch in s:
            if ch in "([{":
                st.append(ch)
            elif not st or st.pop() != pairs[ch]:
                return False
        return not st
    ```
    The most recently opened bracket must be the first one closed, which is last in, first out. Two failures: a closer meets an empty stack or a mismatched opener (for example `([)]` fails at the `)`), or the scan ends with openers still on the stack (for example `((`). Each character is pushed and popped at most once: O(n) time, O(n) memory in the worst case.
  check: none

- id: m2
  lvl: main
  kind: text
  q: Build a queue using only two stacks. Show how enqueue and dequeue work, and explain why dequeue costs O(1) amortised even though one dequeue can move many items.
  sol: |
    Keep `inbox` and `outbox`. Enqueue pushes onto `inbox`. Dequeue pops from `outbox`; if `outbox` is empty, first pop everything from `inbox` and push it onto `outbox`, which reverses the order so the oldest item ends on top.

    For example enqueue 1, 2, 3 gives inbox [1,2,3]. A dequeue pours them to outbox [3,2,1] and pops 1. Enqueue 4 goes to inbox [4]. The next dequeues pop 2 and 3 from outbox without any pouring; only when outbox is empty does 4 move.

    Each item is pushed onto `inbox` once, moved to `outbox` at most once and popped from `outbox` once: at most 4 stack operations per item in its lifetime. So $n$ operations cost at most about $4n$ in total, and the average per operation is constant even though a single dequeue can cost O(n).
  check: none

- id: a1
  lvl: adv
  kind: text
  q: For each day's temperature, find how many days you must wait until a warmer day (0 if none). Give an O(n) method using a stack, trace it on [30, 32, 31, 29, 35, 28], and explain why the work is O(n) even though there is a loop inside a loop.
  sol: |
    Keep a stack of **indexes** of days still waiting for a warmer day; the temperatures at those indexes are non-increasing from bottom to top (a monotonic stack). For day $i$, while the stack is not empty and today is warmer than the day at the top, pop that day $j$ and record `wait[j] = i - j`. Then push $i$.
    ```python
    def waits(t):
        wait, st = [0] * len(t), []
        for i, x in enumerate(t):
            while st and t[st[-1]] < x:
                j = st.pop()
                wait[j] = i - j
            st.append(i)
        return wait
    ```
    Trace on [30, 32, 31, 29, 35, 28]: i=0 push 0. i=1 (32) pops 0, wait[0]=1, push 1. i=2 (31) push 2. i=3 (29) push 3. i=4 (35) pops 3 (wait 1), 2 (wait 2), 1 (wait 3), push 4. i=5 (28) push 5. Result: [1, 3, 2, 1, 0, 0]; days 4 and 5 never meet a warmer day.

    Cost: each index is pushed exactly once and popped at most once, so the inner `while` runs at most $n$ times in total over the whole run, not $n$ times per day. Total O(n) time, O(n) memory.
  check: none

- id: o1
  lvl: oly
  kind: text
  q: Stretch question. Given a list of n numbers and a window size k, report the largest number in every window of k consecutive items, in O(n) total time. Describe the structure, trace it on [4, 2, 12, 3, 8, 1] with k = 3, and say why each item is handled a constant number of times.
  sol: |
    Use a **deque of indexes** whose values are decreasing from front to back. For each new index $i$: (1) pop from the back while the value at the back is not larger than the new value, because it can never be the maximum of any later window that also contains the new item; (2) push $i$ at the back; (3) pop from the front if that index is no longer inside the window (index at most $i - k$); (4) once $i \ge k - 1$, the front is the index of the window maximum.
    ```python
    from collections import deque
    def window_max(a, k):
        dq, out = deque(), []
        for i, x in enumerate(a):
            while dq and a[dq[-1]] <= x:
                dq.pop()
            dq.append(i)
            if dq[0] <= i - k:
                dq.popleft()
            if i >= k - 1:
                out.append(a[dq[0]])
        return out
    ```
    Trace with k = 3. i=0: deque [0]. i=1: 2 is smaller, so [0,1]. i=2: 12 pops 2 and 4, so [2]; window full, output 12. i=3: [2,3], output 12. i=4: 8 pops 3, so [2,4]; index 2 is still in the window, output 12. i=5: [2,4,5]; index 2 is now outside (2 <= 5 - 3), drop it, so [4,5], output 8. Result: [12, 12, 12, 8].

    Each index is appended once and removed at most once (from the back or the front), so the total work is O(n), against O(nk) for rescanning every window. The deque is a monotonic stack that also allows removal from the old end.
  check: none
