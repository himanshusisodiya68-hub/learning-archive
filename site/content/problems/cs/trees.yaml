- id: m1
  lvl: main
  kind: text
  q: Write a function that decides whether a binary tree is a valid binary search tree. A colleague proposes checking only that each node is greater than its left child and smaller than its right child. Give a tree that fools that check, and say how to fix it.
  sol: |
    Take a root 5 with left child 3, and let 3 have a right child 7. Locally, 3 < 5, and 7 > 3, so every parent-child check passes. But 7 sits in the left subtree of 5, so it must be smaller than 5. The tree is not a valid BST.

    The fix is to pass **bounds** down: every key in a subtree must lie strictly between the nearest ancestor on the left and the nearest on the right.

    ```python
    def valid(node, lo=float("-inf"), hi=float("inf")):
        if node is None:
            return True
        if not lo < node.key < hi:
            return False
        return (valid(node.left, lo, node.key)
                and valid(node.right, node.key, hi))
    ```

    It visits each node once, so it is O(n) time, and O(h) stack. An alternative is to do an inorder traversal and check the keys are strictly increasing.
  check: none

- id: m2
  lvl: main
  kind: text
  q: Given a BST and two keys that are both in it, find their lowest common ancestor (the deepest node that has both as descendants, where a node counts as its own descendant). Describe an O(h) method without recursion.
  sol: |
    Start at the root and repeat:

    - if both keys are smaller than the current node, move to its left child;
    - if both are larger, move to its right child;
    - otherwise the keys are on different sides (or one equals the current node), so the current node is the answer.

    ```python
    def lca(root, a, b):
        node = root
        while node:
            if a < node.key and b < node.key:
                node = node.left
            elif a > node.key and b > node.key:
                node = node.right
            else:
                return node
    ```

    At the split point the two keys go different ways, so no deeper node can contain both. Each step goes one level down, so the cost is O(h), and the extra space is O(1).
  check: none

- id: a1
  lvl: adv
  kind: num
  q: The keys 1, 2, 3, ..., 1000 are inserted in this order into an empty plain BST (no balancing). Counting one comparison for each existing node a new key is compared with, how many comparisons are made in total?
  ask: Comparisons
  unit: ""
  ans: 499500
  tol: 0.5
  verify: 1000*999/2
  sol: |
    Each new key is larger than all earlier keys, so it is compared with every node on the single right-going chain. The key $i$ (counting from 1) meets $i - 1$ existing nodes. The total is $0 + 1 + 2 + \dots + 999 = 999 \times 1000 / 2 = 499{,}500$. With a balanced tree, about $1000 \times 10 = 10{,}000$ comparisons would suffice, so the line-shaped tree costs about 50 times more.
  check: code

- id: o1
  lvl: oly
  kind: text
  q: You are given the preorder traversal of a binary search tree with distinct keys, as a list. Rebuild the tree in O(n) time. Explain why one pass is enough.
  sol: |
    In a preorder list, the first key is the root, then come all keys of the left subtree (all smaller than the root), then all keys of the right subtree (all larger). So we can build the tree in a single left-to-right pass if each recursive call knows the range `(lo, hi)` of keys it may accept. The next key in the list belongs to the current call exactly when it lies inside that range.

    ```python
    def build(pre):
        i = 0
        def go(lo, hi):
            nonlocal i
            if i == len(pre) or not lo < pre[i] < hi:
                return None
            node = Node(pre[i])
            i += 1
            node.left = go(lo, node.key)
            node.right = go(node.key, hi)
            return node
        return go(float("-inf"), float("inf"))
    ```

    Each key is consumed once, at the single call whose range contains it, and every call either consumes a key or returns None straight away; the number of None-returning calls is at most $n + 1$. So the work is O(n). The naive approach, which searches the list for where the right subtree starts, costs O(n²) for a line-shaped tree. The recursion depth can be n, so a very deep tree needs an explicit stack in Python.
  check: none
