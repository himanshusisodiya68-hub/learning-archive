  q: Which traversal of a binary search tree visits the keys in increasing order?
  opts: ["Preorder", "Inorder", "Postorder"]
  ans: 1
  sol: Inorder visits the left subtree (all smaller keys), then the node, then the right subtree (all larger keys). By the BST rule, that is increasing order.
