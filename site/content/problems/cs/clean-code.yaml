# Clean code and abstraction. All problems are original.

- id: f1
  lvl: found
  kind: mcq
  q: A variable holds the number of seconds before a login session expires. Which name is best?
  opts: ["t", "session_timeout_seconds", "data"]
  ans: 1
  sol: The best name says what the value is and its unit, so no reader has to guess or open the definition. `t` and `data` could mean anything.
