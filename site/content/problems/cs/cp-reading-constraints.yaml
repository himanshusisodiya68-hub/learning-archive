- id: o1
  lvl: oly
  kind: text
  q: A statement allows n ≤ 5,000 and you plan a 2D table of n × n integers for a quadratic DP. Time passes, but your Python solution runs out of memory. Estimate the memory and describe how to fix it without changing the idea.
  sol: |
    The table has $5000 \times 5000 = 25\times10^6$ cells. A Python list of lists stores a pointer (8 bytes) per cell, so about 200 MB for the pointers alone, and more once the integer objects are counted [Inference: exact figure depends on the Python build and on how many integers are small cached ones].

    Most quadratic DPs only look at the previous row to fill the current one. Keep two rows (or one row updated in place) and memory drops to $O(n)$, about 40 KB. If the answer needs the *path* and not just its value, store only the decisions in a compact form (a `bytearray` has 1 byte a cell, 25 MB), or use the `array` module.
  check: none
