  q: A statement says n ≤ 20 and asks you to choose the best subset of items. Which approach is intended?
  opts: ["Try every subset with a bitmask", "Sort and use binary search", "A formula in O(1)"]
  ans: 0
  sol: There are $2^{20} \approx 10^6$ subsets, each checked in about $n$ steps, so about $2\times10^7$ steps. That is the signature of "try everything". Sorting and formulas need structure that the statement did not hint at.
