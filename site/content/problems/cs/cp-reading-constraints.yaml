# Reading constraints. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A solution checks every pair of numbers with two nested loops. The input has n = 200,000 numbers. About how many loop steps does it take, in billions (n times n)?
  ask: Steps
  unit: billion
  ans: 40
  tol: 0.1
  verify: (2e5)**2/1e9
  sol: Two nested loops do $n \times n$ steps, which is $(2\times10^5)^2 = 4\times10^{10}$, or 40 billion. At about $10^8$ steps a second that is 400 seconds, far above a 2 second limit.
  check: code

- id: f2
