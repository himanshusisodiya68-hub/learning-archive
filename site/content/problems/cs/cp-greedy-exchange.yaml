  opts: ["Shortest meeting first", "Earliest start first", "Earliest finish first"]
  ans: 2
  sol: |
    Earliest finish first. Counterexample for shortest-first: A = 0 to 5, B = 4 to 6, C = 5 to 10. B is the shortest, but it overlaps both A and C, so shortest-first gets one meeting while A and C make two. Counterexample for earliest-start-first: one meeting from 0 to 100 starts first and blocks ten tiny meetings between 1 and 20.
