- id: b1
  lvl: board
  kind: num
  q: Coins of 1, 3 and 4 are available and the target is 6. The greedy rule takes the largest coin that still fits, repeatedly. How many more coins does greedy use than the best possible answer?
  ask: Extra coins
  unit: ""
  ans: 1
  tol: 0.1
  verify: '(() => { const c=[1,3,4], t=6; let g=0,r=t; for (const x of [4,3,1]) { g+=Math.floor(r/x); r%=x; } const d=[0]; for (let i=1;i<=t;i++){ d[i]=Infinity; for (const x of c) if (x<=i) d[i]=Math.min(d[i],d[i-x]+1);} return g-d[t]; })()'
  sol: |
    Greedy takes 4, then 1, then 1: three coins. The best is 3 + 3: two coins. Greedy uses 1 extra. The 4 blocked the better pair, so no exchange argument can rescue the rule, and this problem needs dynamic programming.
  check: code

