- id: f1
  lvl: found
  kind: num
  q: |
    A hall receives five booking requests (start, end): (1, 3), (2, 5), (4, 7), (6, 9), (8, 10). A booking that ends at time t does not clash with one starting at t. What is the largest number of bookings that can be accepted?
  ask: Bookings
  unit: ""
  ans: 3
  tol: 0.1
  verify: '(() => { const iv=[[1,3],[2,5],[4,7],[6,9],[8,10]].sort((a,b)=>a[1]-b[1]); let c=0,l=-Infinity; for (const [s,e] of iv) if (s>=l){c++;l=e;} return c; })()'
  sol: |
    Sort by finish time: (1,3), (2,5), (4,7), (6,9), (8,10). Take (1,3). Skip (2,5), which starts before 3. Take (4,7). Skip (6,9), which starts before 7. Take (8,10). That is 3 bookings, and the exchange argument says no set can be larger.
  check: code

