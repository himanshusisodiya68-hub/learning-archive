- id: f2
  lvl: found
  kind: mcq
  q: What is the binary number 110101 in ordinary decimal?
  opts: ["43", "53", "63"]
  ans: 1
  sol: The place values from the right are 1, 2, 4, 8, 16, 32. The bits 110101 switch on 32, 16, 4 and 1, and $32 + 16 + 4 + 1 = 53$.
