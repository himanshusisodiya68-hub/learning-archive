- id: f1
  lvl: found
  kind: num
  q: One byte is 8 bits. How many different patterns can one byte hold?
  ask: Patterns
  unit: ""
  ans: 256
  tol: 0.1
  verify: 2**8
  sol: Each bit doubles the number of patterns, so 8 bits give $2^8 = 256$. These are the numbers 0 to 255 if the byte is read as a plain whole number.
