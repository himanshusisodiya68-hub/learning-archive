- id: f1
  lvl: found
  kind: num
  q: A binary heap holds 1,000,000 items, stored with no gaps level by level (the top level has 1 item, the next 2, then 4, and so on). How many levels does the tree have?
  ask: Levels
  unit: ""
  ans: 20
  tol: 0.1
  verify: floor(log2(1e6)) + 1
  sol: Levels 1 to $L$ hold $1 + 2 + 4 + \dots + 2^{L-1} = 2^L - 1$ items. Since $2^{19} - 1 = 524{,}287$ is too few and $2^{20} - 1 = 1{,}048{,}575$ is enough, $L = 20$. In formula form, $\lfloor \log_2 10^6 \rfloor + 1 = 19 + 1 = 20$.
  check: code

