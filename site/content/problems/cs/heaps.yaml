  q: Which of these questions can a min-heap answer in a single step?
  opts: ["Which item is the smallest?", "Which item is the largest?", "Is the item with the name 'asha' in the heap?"]
  ans: 0
  sol: The parent-beats-child rule puts the smallest item at the top, index 0. The largest is somewhere among the leaves, so finding it means looking at about half the items, and a heap has no way to look up an item by name without scanning.
