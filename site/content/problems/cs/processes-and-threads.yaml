- id: f2
  lvl: found
  kind: num
  q: A phone has 4 cores and 12 CPU-hungry threads that are all ready to run. If the OS shares the cores fairly, how many cores' worth of CPU does each thread get on average?
  ask: Share per thread
  unit: cores
  ans: 0.333
  tol: 0.01
  verify: 4/12
  sol: There are 4 cores of capacity to split among 12 threads, so each gets $4/12 = 1/3$ of a core. Each thread runs about a third of the time, taking turns.
