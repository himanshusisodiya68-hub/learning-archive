# Processes and threads. All problems are original.

- id: f1
  lvl: found
  kind: mcq
  q: Two threads belong to the same process. Which of these do they share?
  opts: ["Their heap memory (the process's data)", "Their call stacks", "Their saved registers"]
  ans: 0
  sol: Threads of one process share the same address space, so they see the same heap variables and open files. Each thread keeps its own stack (the calls it is in the middle of) and its own registers, otherwise they would overwrite each other's progress.
