# Sorting. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: Insertion sort is run on 10 cards that start in exactly reverse order. How many times does a card have to be shifted one place to the right in total?
  ask: Shifts
  unit: ""
  ans: 45
  tol: 0.1
  verify: 10*9/2
  sol: The second card shifts past 1 card, the third past 2, and so on up to the tenth past 9. The total is $1 + 2 + \dots + 9 = 9 \times 10 / 2 = 45$. In general, $n(n-1)/2$ shifts, which is why the worst case is $O(n^2)$.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: A stable sort is one that
  opts: ["always runs in O(n log n)", "keeps equal items in the same relative order as in the input", "never uses extra memory", "sorts without comparing items"]
  ans: 1
  sol: Stability is about ties only. Items that compare equal come out in the order they went in. It says nothing about speed, memory or whether comparisons are used.
