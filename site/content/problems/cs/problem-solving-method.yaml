  opts: ["Start coding the most likely reading", "Restate it in your own words and work two or three tiny examples by hand", "Look for the fastest known algorithm"]
  ans: 1
  sol: Restating and working small examples exposes misunderstandings cheaply, often reveals the pattern, and gives you test cases for later. Coding a guess or hunting for an algorithm before you understand the question wastes the most time.
