  q: A method needs n × n steps with n = 200,000. A machine does 10^8 steps per second. How many seconds does it take?
  ask: Time
  unit: seconds
  ans: 400
  tol: 1
  verify: (2e5*2e5)/1e8
  sol: Steps $= 200{,}000^2 = 4\times10^{10}$. Time $= 4\times10^{10} / 10^{8} = 400$ seconds, over six minutes. We needed an $O(n\log n)$ or $O(n)$ method; this estimate costs ten seconds and saves a wrong program.
