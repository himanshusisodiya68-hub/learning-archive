# A method for any problem. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A dispatcher tries every way of pairing 10 orders with 10 riders (each order gets a different rider). How many pairings is that?
  ask: Pairings
  unit: ""
  ans: 3628800
  tol: 0.5
  verify: (function(){ let f=1; for(let i=2;i<=10;i++) f*=i; return f; })()
  sol: The first order has 10 choices of rider, the next 9, then 8, and so on, so the count is $10! = 10\times9\times8\times\cdots\times1 = 3{,}628{,}800$. At 10 orders that is fine for a computer; at 20 orders it is about $2.4\times10^{18}$, which is not.
  check: code

