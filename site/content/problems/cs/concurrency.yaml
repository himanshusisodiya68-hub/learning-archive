# Concurrency and locks. All problems are original.

- id: f1
  lvl: found
  kind: mcq
  q: Why can two threads running `count += 1` lose an update?
  opts: ["The operation is really read, add, write, and the threads can interleave between those steps", "Python cannot add numbers in threads", "Computers can only count to 100,000"]
  ans: 0
  sol: Adding 1 to a variable takes three steps. If both threads read the same old value before either writes, both write the same new value, so one increment disappears. This is a race condition.
