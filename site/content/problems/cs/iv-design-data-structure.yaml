- id: f1
  lvl: found
  kind: mcq
  q: A design needs "is this key present?" and "give me its value" in constant time. Which plain structure fits?
  opts: ["Hash map", "Sorted array", "Singly linked list"]
  ans: 0
  sol: A hash map computes where the key lives, so membership and lookup take $O(1)$ on average. A sorted array needs binary search ($O(\log n)$) and a linked list needs a scan ($O(n)$).
