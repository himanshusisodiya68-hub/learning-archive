- id: f2
  lvl: found
  kind: mcq
  q: An LRU cache of capacity 3 receives put 1, put 2, put 3, get 1, put 4, put 5. After the last put, which key was evicted by it?
  opts: ["1", "2", "3", "4"]
  ans: 2
  sol: |
    Order, newest first. After put 1, 2, 3 it is 3, 2, 1. get 1 gives 1, 3, 2. put 4 evicts 2 and gives 4, 1, 3. put 5 evicts the oldest, 3, and gives 5, 4, 1. So the last put evicts key 3.
  check: none

