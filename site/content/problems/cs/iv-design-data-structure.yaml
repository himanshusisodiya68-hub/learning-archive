  q: A min-stack receives push 5, push 3, push 7, push 3, push 8, then pop, pop. What does get_min return?
  ask: Minimum
  unit: ""
  ans: 3
  tol: 0.01
  verify: Math.min(5, 3, 7)
  sol: After the two pops (8, then the second 3) the stack holds 5, 3, 7. Each entry stores the minimum at or below it, and the top entry (7) stores min(5, 3, 7) = 3.
