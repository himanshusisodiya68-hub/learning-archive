- id: f2
  lvl: found
  kind: mcq
  q: Which of these runs by first compiling to bytecode and then having a virtual machine execute that bytecode?
  opts: ["A C program compiled with an optimising compiler", "A Java program", "A recipe written on paper"]
  ans: 1
  sol: Java source is compiled to bytecode for the Java Virtual Machine, which runs it (often compiling the hot parts to machine code with a JIT). CPython does something similar. A C program is normally compiled straight to machine code.
