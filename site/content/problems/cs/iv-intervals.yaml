- id: f1
  lvl: found
  kind: mcq
  q: Meeting P runs from 2 to 5 and meeting Q from 5 to 7, and a room is free the moment a meeting ends. Can P and Q share one room?
  opts: ["Yes, P ends exactly when Q starts", "No, they both use the time 5", "Only if Q is shorter than P"]
  ans: 0
  sol: |
    Reading each meeting as the half-open stretch from start up to but not including end, P is [2, 5) and Q is [5, 7). They overlap only if 2 < 7 and 5 < 5; the second part is false, so they do not. One room is enough. If a statement says that touching counts as a clash, use less-than-or-equal instead.
  check: none

- id: f2
  lvl: found
  kind: num
  q: The intervals [1, 4], [3, 7] and [10, 12] are merged into disjoint blocks. What is the total length covered by the blocks (end minus start, added up)?
  ask: Total length
  unit: ""
  ans: 8
  tol: 0.1
  verify: (7-1)+(12-10)
  sol: |
    Sorted by start, [1, 4] and [3, 7] overlap (3 is not past 4), so they merge into [1, 7], whose end is the larger of 4 and 7. [10, 12] starts after 7, so it is a separate block. Lengths: $(7 - 1) + (12 - 10) = 6 + 2 = 8$.
  check: code

- id: b1
  lvl: board
  kind: num
  q: Five meetings run (in hours) 9 to 10, 9.5 to 11, 10 to 12, 10.5 to 11.5 and 12 to 13. A room is free the instant its meeting ends. How many rooms are needed?
  ask: Rooms
  unit: ""
  ans: 3
  tol: 0.1
  verify: '(()=>{const iv=[[9,10],[9.5,11],[10,12],[10.5,11.5],[12,13]];const ev=[];iv.forEach(([s,e])=>{ev.push([s,1]);ev.push([e,-1])});ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let cur=0,best=0;for(const [,d] of ev){cur+=d;best=Math.max(best,cur)}return best})()'
  sol: |
    Sweep line with ends processed before starts at equal times. Between 10.5 and 11 the meetings 9.5 to 11, 10 to 12 and 10.5 to 11.5 are all on (the first meeting ended at 10), so three are active. At 11 the meeting 9.5 to 11 ends before anything new starts, so the total never exceeds 3. Three rooms are enough, and three are needed.
  check: code

- id: b2
  lvl: board
  kind: text
  q: A sorted list of disjoint intervals is [1, 2], [3, 5], [6, 7], [8, 10], [12, 16]. Insert [4, 9] using the three-phase method and give the result. Which interval is copied in each phase?
  sol: |
    Treat touching as overlap (closed intervals, as the list uses numbers).
    - **Wholly before** (end less than 4): [1, 2]. Copy it.
    - **Absorb** (start at most 9): [3, 5] gives [3, 9]; [6, 7] changes nothing; [8, 10] gives [3, 10]. The next interval [12, 16] starts at 12, which is past 9, so stop.
    - **Wholly after**: [12, 16]. Copy it.

    Result: [1, 2], [3, 10], [12, 16].
  check: none

- id: m1
  lvl: main
  kind: text
  q: Balloons float in a row, and each balloon is a horizontal stretch from a left x-value to a right x-value. One arrow fired straight up at some x bursts every balloon whose stretch contains that x. Describe how to find the fewest arrows, say which family it belongs to, and run it on the stretches [1, 6], [2, 8], [7, 12], [10, 16].
  sol: |
    This is the **max kept** family in disguise. Sort the stretches by right end. Fire an arrow at the right end of the first one; it bursts every balloon whose left end is at or before that x. Skip them, and when you meet a balloon whose left end is past the arrow, fire a new arrow at its right end.

    ```python
    def fewest_arrows(spans):
        spans.sort(key=lambda x: x[1])
        arrows, x = 0, float('-inf')
        for l, r in spans:
            if l > x:
                arrows += 1
                x = r
        return arrows
    ```
    On the example, sorted by right end: [1, 6], [2, 8], [7, 12], [10, 16]. The first arrow at x = 6 bursts [1, 6] and [2, 8] (left ends 1 and 2 are at most 6). [7, 12] has left end 7 which is past 6, so a second arrow at 12 bursts [7, 12] and [10, 16]. Answer: 2. Cost $O(n \log n)$. Why end order is right: an arrow at the earliest right end is as far right as possible without missing the first balloon, so it reaches the most others.
  check: none

- id: m2
  lvl: main
  kind: text
  q: A club has booked sessions [1, 2], [2, 3], [3, 4] and [1, 3] (a session ending at 3 leaves the room free at 3). What is the fewest number of sessions to cancel so that none overlap? Give the method and the answer.
  sol: |
    The fewest cancellations equal the total minus the most sessions that can stay. To find the most that can stay, sort by end and take greedily: sorted by end the order is [1, 2], [2, 3], [1, 3], [3, 4] (ties broken arbitrarily). Take [1, 2] (last end 2). [2, 3] starts at 2, which is at least 2, so take it (last end 3). [1, 3] starts at 1, less than 3, skip. [3, 4] starts at 3, take it. Three stay, so cancel $4 - 3 = 1$ session: [1, 3].
  check: none

