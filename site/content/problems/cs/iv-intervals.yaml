  verify: '(()=>{const iv=[[1,4],[3,5],[0,6],[5,7],[3,9],[5,9],[6,10],[8,11],[8,12],[2,14],[12,16]].sort((a,b)=>a[1]-b[1]);let c=0,last=-Infinity;for(const [s,e] of iv){if(s>=last){c++;last=e}}return c})()'
  sol: |
    Sort by end time: (1,4), (3,5), (0,6), (5,7), (3,9), (5,9), (6,10), (8,11), (8,12), (2,14), (12,16). Take (1,4); skip (3,5) and (0,6), which start before 4; take (5,7); skip (3,9), (5,9), (6,10); take (8,11); skip (8,12) and (2,14); take (12,16). That is 4 activities: (1,4), (5,7), (8,11), (12,16).
