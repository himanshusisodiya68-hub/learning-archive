- id: m4
  lvl: main
  kind: text
  q: Three employees each have a sorted list of busy intervals. Find every time when all three are free. Describe the method, its cost, and which variant it uses.
  sol: |
    Variant: **merge, then gaps**. Put all busy intervals from all employees into one list (size $n$), sort by start, and merge overlapping or touching ones. The merged blocks are the times when at least one person is busy. Anyone-busy is the opposite of everyone-free, so the free times are the gaps between consecutive merged blocks (plus, if wanted, the times before the first and after the last).

    ```python
    def common_free(lists):
        busy = sorted(iv for person in lists for iv in person)
        merged = []
        for s, e in busy:
            if merged and s <= merged[-1][1]:
                merged[-1][1] = max(merged[-1][1], e)
            else:
                merged.append([s, e])
        return [[merged[i][1], merged[i+1][0]] for i in range(len(merged) - 1)]
    ```
    Cost $O(n \log n)$ for the sort. Since each list is already sorted, a $k$-way merge with a heap would give the same order in $O(n \log k)$.
  check: none

- id: a1
  lvl: adv
  kind: text
  q: Design a calendar that accepts a booking request [s, e) only if it overlaps no existing booking, and answers many such requests online (one at a time). Give a method with fast checks and say what limits its speed in Python.
  sol: |
    Keep the booked intervals in a list sorted by start. For a new request [s, e), binary-search (with `bisect`) for the position where it would be inserted. It can only clash with its **two neighbours**: the interval just before (clash if that one's end is greater than s) and the interval just after (clash if that one's start is less than e). Since existing bookings are disjoint and sorted, no interval further away can overlap. If both checks pass, insert it.

    Finding the neighbours costs $O(\log n)$. A Python list insert shifts elements, so inserting costs $O(n)$, although with a very fast constant. For millions of bookings use a balanced tree or a skip list (for example a sorted container library, or a tree map in other languages) to make both the check and the insert $O(\log n)$. [Unverified: names of library types vary by language]
  check: none

- id: a2
  lvl: adv
  kind: text
  q: Given a target span from 0 to T and a list of intervals, find the fewest intervals that together cover every point of the span, or report that it is impossible. Describe the greedy rule, why it is correct, and its cost.
  sol: |
    Sort by start. Keep `reach`, the farthest point covered so far (initially 0). While `reach` is below T: among all intervals with start at most `reach`, pick the one with the largest end. If that end is not greater than `reach`, no interval extends the cover, so answer impossible. Otherwise take it, set `reach` to its end and count it.

    **Why correct (exchange argument):** any solution must cover the point just beyond `reach` with some interval that starts at or before `reach`. Replacing it by the one that goes farthest cannot uncover anything and gives at least as much reach for the next step, so the greedy choice is never worse.

    **Cost:** one sort, $O(n \log n)$, then a single left-to-right scan in which the pointer into the sorted list only moves forward, $O(n)$.
  check: none

- id: o1
  lvl: oly
  kind: text
  q: There are n closed intervals and q query numbers, with n and q both up to 200,000. For each query x, report how many intervals contain x (start at most x and end at least x). A loop over all intervals for each query is too slow. Give a method with a cost of about (n + q) log n and justify it.
  sol: |
    Count by complement. The intervals that contain $x$ are those that have started by $x$ (start at most $x$) minus those that have already ended **before** $x$ (end less than $x$). Every interval that ended before $x$ also started by $x$, so subtracting is valid and no interval is counted twice or missed.

    So sort the starts into one array and the ends into another. For a query $x$:
    $$\text{count}(x) = \#\{\text{starts} \le x\} - \#\{\text{ends} < x\}.$$
    Read it as: "how many have begun, minus how many are over".
    ```python
    from bisect import bisect_left, bisect_right
    def counts(intervals, queries):
        starts = sorted(s for s, e in intervals)
        ends = sorted(e for s, e in intervals)
        return [bisect_right(starts, x) - bisect_left(ends, x) for x in queries]
    ```
    `bisect_right(starts, x)` counts starts at most $x$; `bisect_left(ends, x)` counts ends strictly less than $x$. Two sorts cost $O(n \log n)$; each query is two binary searches, $O(\log n)$, so the total is $O((n + q) \log n)$. This is the sweep line answered at arbitrary moments instead of only at event times.
  check: none
