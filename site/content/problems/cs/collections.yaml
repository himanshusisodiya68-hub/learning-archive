- id: f2
  lvl: found
  kind: mcq
  q: Which of these can be used as a dictionary key in Python?
  opts: ["[1, 2]", "(1, 2)", "{1, 2}"]
  ans: 1
  sol: A key must be hashable, meaning it cannot change after it is stored. The tuple (1, 2) qualifies. A list and a set can both be changed, so Python raises TypeError (unhashable type).
