  sol: 'The k-th insert (k from 0) moves k items, so the total is $0 + 1 + 2 + \dots + 49999 = \frac{50000 \times 49999}{2} = 1{,}249{,}975{,}000$. About 1.25 billion moves for 50,000 items: the O(n²) cost of front inserts. A deque does the same in 50,000 steps.'
