- id: o1
  lvl: oly
  kind: text
  q: 'Design a collection that supports three operations, each in O(1) average time: insert(x) (ignore if present), delete(x), and get_random() (return one stored value, each equally likely). Explain why neither a plain list nor a plain set is enough.'
  sol: |
    A plain **list** gives a random element in O(1) (pick a random index), but finding x to delete takes O(n). A plain **set** finds and deletes x in O(1), but cannot pick a random member without going through it, which is O(n).

    Combine them: keep a list `items` of the values and a dict `pos` mapping each value to its index in the list.
    ```python
    import random

    class RandomSet:
        def __init__(self):
            self.items, self.pos = [], {}

        def insert(self, x):
            if x not in self.pos:
                self.pos[x] = len(self.items)
                self.items.append(x)

        def delete(self, x):
            if x in self.pos:
                i, last = self.pos.pop(x), self.items.pop()
                if i < len(self.items):    # x was not the last item
                    self.items[i] = last
                    self.pos[last] = i

        def get_random(self):
            return random.choice(self.items)
    ```
    The key trick in delete is to **swap the removed item with the last one**, so the list only ever loses its tail, which is O(1), rather than shifting everything. The dict is updated to point at the moved item's new place. Each operation touches a constant number of dict and list operations, so all three are O(1) on average, at the price of storing every value twice.
  check: none
