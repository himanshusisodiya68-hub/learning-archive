- id: b1
  lvl: board
  kind: num
  q: A program whose cost grows like n² takes 0.1 seconds on 2,000 records. Estimate how many seconds it takes on 8,000 records.
  ask: Time
  unit: s
  ans: 1.6
  tol: 0.05
  verify: 0.1*(8000/2000)**2
  sol: The data grew by a factor of $8000/2000 = 4$. For an $n^2$ cost the work grows by $4^2 = 16$. So the time is $0.1 \times 16 = 1.6$ seconds.
