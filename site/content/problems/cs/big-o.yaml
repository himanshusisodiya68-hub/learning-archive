  q: Binary search halves the remaining list at every step. At most how many halvings are needed to narrow a sorted list of 1,000,000 items down to one item?
  ask: Halvings
  unit: ""
  ans: 20
  tol: 0.1
  verify: ceil(log2(1e6))
  sol: We need the smallest $k$ with $2^k \ge 1{,}000{,}000$. Since $2^{19} = 524{,}288$ is too small and $2^{20} = 1{,}048{,}576$ is enough, $k = 20$.
