  sol: The arguments are 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1. That is $\log_2 1024 + 1 = 10 + 1 = 11$ calls. Halving each time gives a depth of $O(\log n)$, as in binary search.
