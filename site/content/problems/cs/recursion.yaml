- id: f2
  lvl: found
  kind: mcq
  q: A recursive function has no base case. What will Python do when it is called?
  opts: ["Return None", "Raise RecursionError after about 1000 nested calls", "Run forever using no extra memory"]
  ans: 1
  sol: Each call makes another call, so frames pile up on the call stack. Python stops at its recursion limit (about 1000 by default) with a RecursionError. The stack would not use "no memory"; every frame takes some.
  check: none

