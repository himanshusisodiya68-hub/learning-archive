  q: 'A recursive function f(n) returns immediately when n is 1, and otherwise calls f(n // 2) once (integer halving). Starting with n = 1024, how many calls are made in total, counting the first?'
  ask: Calls
  unit: ""
  ans: 11
  tol: 0.1
