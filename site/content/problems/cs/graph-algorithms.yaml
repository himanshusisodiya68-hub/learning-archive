- id: f1
  lvl: found
  kind: num
  q: A friendship network has 6 people and 7 friendships. It is stored as an adjacency list, where each person has a list of their friends and a friendship appears in both people's lists. How many names are stored in all the lists together?
  ask: Names stored
  unit: ""
  ans: 14
  tol: 0.1
  verify: 2*7
  sol: Each friendship is an undirected edge, so it is written twice, once in each person's list. With $E = 7$ edges that gives $2E = 14$ entries. This is why BFS and DFS cost $O(V+E)$, not $O(V\times E)$, on an adjacency list.
  check: code

