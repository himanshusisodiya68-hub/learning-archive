# What SDE-1, SDE-2 and SDE-3 are judged on. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A senior engineer's design review stops 3 teams from building the wrong thing. Each team would have lost 2 engineer-weeks to rework. How many engineer-weeks does the review save?
  ask: Saved
  unit: engineer-weeks
  ans: 6
  tol: 0.01
  verify: 3*2
  sol: $3\times 2 = 6$ engineer-weeks. The review took perhaps half a day, which is why influence across teams is worth more than the same hours spent on one's own task. The numbers are invented for illustration.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which of these is the best one-line description of a level?
  opts: ["How many years you have worked", "The size and vagueness of the problem you are trusted to own", "How fast you write code", "Your salary"]
  ans: 1
  sol: Levels reflect scope, ambiguity, influence and design ownership. Years, speed and salary are related at best, but they are not the definition.
