- id: f1
  lvl: found
  kind: num
  q: "Words are inserted into an empty trie in this order: tea, ten, to, inn. Not counting the top node, how many nodes does the trie have?"
  ask: Nodes
  unit: ""
  ans: 8
  tol: 0.1
  verify: 3 + 1 + 1 + 3
  sol: "Insert tea: three new nodes (t, e, a). Insert ten: it shares t and e, so only n is new (1). Insert to: it shares t, so only o is new (1). Insert inn: nothing is shared, so three new nodes (i, n, n). Total $3 + 1 + 1 + 3 = 8$. Storing the words separately would have used $3 + 3 + 2 + 3 = 11$ letters, so sharing saved 3."
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which question is a trie good at, and a plain hash table bad at?
  opts: ["Is 'cricket' a stored word?", "Which stored words start with 'cric'?", "How many words are stored in total?"]
  ans: 1
  sol: A hash table scatters words by their whole value, so words that share a beginning end up in unrelated places. A trie keeps them together under the node for the shared prefix, so "start with" is a walk to that node and a read of what hangs below. The first and third questions are easy for a hash table.
