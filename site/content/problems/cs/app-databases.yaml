# Using a database from an app. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: "A page shows 40 orders. The code loads the orders with one query, then loads each order's customer with a separate query inside a loop. How many database queries does one page view make?"
  ask: Queries
  unit: ""
  ans: 41
  tol: 0.1
  verify: 1+40
  sol: "One query for the list plus one per order: $1 + N = 1 + 40 = 41$. Fetching all the customers in one joined query would bring it down to 1 (or 2 with a second batched query)."
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: "Which is the safest way to look up a user by the name typed into a form?"
  opts: ["Build the SQL text by adding the typed name between quotes", "Use a query with a placeholder and pass the name as a separate parameter", "Remove all spaces from the name, then add it to the SQL text"]
  ans: 1
  sol: "A placeholder keeps the typed value apart from the SQL, so it is only ever treated as data. Gluing text, even after cleaning, depends on you thinking of every trick an attacker might use. Parameterised queries remove the whole class of attack."
  check: none

- id: b1
  lvl: board
  kind: num
  q: "An app starts 800 database queries each second. Each query holds a connection for 25 milliseconds. On average, how many connections are busy?"
  ask: Busy connections
  unit: ""
  ans: 20
  tol: 0.1
  verify: 800*0.025
  sol: "Busy connections $c \\approx \\lambda \\times t = 800 \\times 0.025 = 20$. A pool of about 20 would just keep up on average, so you would choose a larger pool (say 30 to 40) for bursts, while checking the database's total connection limit."
  check: code

- id: b2
  lvl: board
  kind: num
  q: "A cache hit takes 1 ms. A miss takes 1 ms to check the cache plus 20 ms for the database. With a 90 percent hit rate, what is the average time per read, in milliseconds?"
  ask: Average read time
  unit: ms
  ans: 3.0
  tol: 0.05
  verify: 0.9*1 + 0.1*(1+20)
  sol: "Average $= 0.9 \\times 1 + 0.1 \\times (1 + 20) = 0.9 + 2.1 = 3.0$ ms, compared with 20 ms without the cache. Raising the hit rate to 99 percent gives $0.99 + 0.21 = 1.2$ ms, so the last few percent of hits matter a lot."
  check: code

- id: m1
  lvl: main
  kind: text
  q: "You are building a small app for a school: students, classes, enrolments and marks. Would you choose SQL or a document store? Give two reasons, and one situation that would change your mind."
  sol: |
    **SQL.** Reasons:
    1. The data is full of relationships (a student enrols in many classes; a class has many students; marks belong to an enrolment). Joins answer "all marks for class 7B" or "average per student" in one query, whereas a document store would make you duplicate data or join in your own code.
    2. Correctness matters: moving a student between classes should be one transaction, so it either happens fully or not at all. Relational databases give this built in, and constraints (such as a foreign key from marks to a student) stop bad data entering.

    A situation that would change the answer: if the main job became storing millions of independent, differently shaped records read whole by key (for example, raw activity logs from many apps), a key-value or document store might scale and fit better. Even then, many teams keep the core records in SQL.
  check: none

- id: m2
  lvl: main
  kind: text
  q: "Your app has 20 server copies, each with a connection pool of 20. The database allows 300 connections. Traffic doubles and users see timeouts, while the database CPU is low. What is likely happening and what would you try?"
  sol: |
    The pools can hold up to $20 \times 20 = 400$ connections, more than the database's limit of 300, so some servers cannot get a connection and requests wait or fail. Low database CPU supports this: the database is not busy; clients are stuck waiting for connections.

    Things to try, in order:
    1. Lower each pool so the total stays under the limit with room for admin tools (for example 12 per server gives 240).
    2. Look for slow queries or transactions that hold connections too long, since $c \approx \lambda \times t$: shorten $t$ and fewer connections are needed.
    3. Fix N+1 patterns to reduce the queries per request.
    4. Put a connection proxy (a pooler) in front of the database that multiplexes many app connections onto fewer database ones.
    5. Cache hot reads so they never reach the database.
    [Inference: the exact cause would need metrics; this is the most likely explanation from the numbers given.]
  check: none

- id: a1
  lvl: adv
  kind: text
  q: "A home-page key in Redis has a 60-second TTL, and 5,000 requests per second read it. Explain what happens at the moment it expires, and give two ways to reduce the damage."
  sol: |
    At expiry the next requests all miss. Until the first one finishes rebuilding the value and writes it back, every request that arrives also misses and goes to the database. With 5,000 requests per second and a rebuild that takes 200 ms, around $5000 \times 0.2 = 1000$ identical expensive queries can hit the database at once. This is a **cache stampede**, and it can overload the database.

    Two remedies:
    1. **Single flight / lock:** the first request that misses takes a short lock (for example `SET key NX` in Redis) and rebuilds; the others wait briefly or serve the slightly old value.
    2. **Refresh early and add jitter:** a background job refreshes the key shortly before it expires, and each key gets a TTL like 60 plus or minus a random few seconds, so many keys do not expire together.
  check: none

- id: o1
  lvl: oly
  kind: text
  q: "Reader A misses the cache and reads a user's row from the database. Before A stores it, a writer updates the row and deletes the cache key. Then A stores the old row in the cache. Explain why the cache is now wrong, for how long, and how to reduce the chance."
  sol: |
    The writer's delete happened before A's store, so A's store re-creates the key with **old** data after the update. Nothing will delete it again until the next write or until the TTL runs out, so every reader sees stale data for up to the TTL (for example 5 minutes).

    This race is rare because it needs a slow read to overlap a write, but with enough traffic it does happen. Ways to reduce it:
    1. Keep TTLs short for data that changes, so a mistake heals quickly.
    2. Store a **version** (or the row's updated-at time) with the cached value and refuse to overwrite a newer version with an older one (for example, with a compare-and-set script).
    3. After a write, delete the key, then delete it once more after a short delay ("delayed double delete") to catch late stores.
    4. For data that must be exact, do not cache it: read the database.
    Which of these a particular company uses is not public. [Inference]
  check: none
