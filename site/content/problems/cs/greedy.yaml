  kind: num
  q: A shopkeeper has notes and coins of 1, 2, 5, 10, 20 and 50 and always hands back the biggest piece that fits. How many pieces does he use to give back 93?
  ask: Pieces
  unit: ""
  ans: 5
  tol: 0.1
  verify: 1+2+1+1
  sol: The biggest piece that fits is 50, leaving 43. Then 20 and 20 leave 3. Then 2 leaves 1, and 1 finishes. That is one 50, two 20s, one 2 and one 1, which is $1+2+1+1 = 5$ pieces.
