- id: f2
  lvl: found
  kind: mcq
  q: To fit the most meetings into one room, which rule is guaranteed to work?
  opts: ["Pick the meeting that starts earliest", "Pick the shortest meeting", "Pick the meeting that finishes earliest"]
  ans: 2
  sol: Finishing earliest leaves the most time for the remaining meetings, and an exchange argument proves it is optimal. Earliest start fails when a long meeting starts first; shortest fails when a short meeting sits across the boundary of two others that would both have fitted.
