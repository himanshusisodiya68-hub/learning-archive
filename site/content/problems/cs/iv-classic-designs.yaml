# Classic designs. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A chat app has 200 million active users. Each sends 40 messages a day on average. What is the average number of messages per second (a day has 86,400 seconds)? Assume nothing else.
  ask: Average messages
  unit: per second
  ans: 92593
  tol: 5
  verify: 200e6*40/86400
  sol: Messages per day $= 200\times10^{6}\times 40 = 8\times10^{9}$. Divide by 86,400 seconds, about $92{,}593$ per second. Traffic is uneven, so the peak may be two to four times this; that factor is an assumption. [Inference]
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which pair correctly matches a prompt with its hard problem?
  opts: ["Rate limiter and transcoding huge videos", "Payment system and never charging twice when a call times out", "Search autocomplete and electing a driver for a rider", "Chat app and choosing between 301 and 302 redirects"]
  ans: 1
  sol: A timeout leaves the caller not knowing whether the charge happened, so retries must be safe (idempotency keys). The other pairs mix up prompts, for example transcoding belongs to video streaming, and 301 versus 302 belongs to the URL shortener.
