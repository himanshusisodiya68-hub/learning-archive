- id: f1
  lvl: found
  kind: num
  q: A list has 10 distinct items. How many subsets does it have, counting the empty subset and the whole list?
  ask: Subsets
  unit: ""
  ans: 1024
  tol: 0.1
  verify: pow(2,10)
  sol: |
    Each of the 10 items is either in or out, two choices each, so the number of subsets is $2 \times 2 \times \dots = 2^{10} = 1024$. This is the number of leaves of the take-or-skip tree.
