# Objects and classes. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: A Batter object has runs = 45 and balls = 30. Its strike_rate method returns runs per 100 balls. What does it return?
  ask: Strike rate
  unit: ""
  ans: 150
  tol: 0.01
  verify: 100*45/30
  sol: The strike rate is $100 \times \text{runs} / \text{balls} = 100 \times 45 / 30 = 150$. The method reads the object's own state through self, so the caller does not pass runs or balls in.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: "Inside the method def score(self, runs): ... what does self refer to?"
  opts: ["The class Batter itself", "The particular object the method was called on", "The value of runs"]
  ans: 1
  sol: When you write asha.score(4), Python calls Batter.score with self set to asha. That is why asha and ravi can share one blueprint but keep separate state.
