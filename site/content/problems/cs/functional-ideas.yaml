- id: b1
  lvl: board
  kind: num
  q: Machine A processed 2 matches averaging 10 runs. Machine B processed 8 matches averaging 20 runs. What is the true average over all 10 matches?
  ask: Average runs per match
  unit: runs
  ans: 18
  tol: 0.01
  verify: (2*10+8*20)/10
  sol: The totals are $2 \times 10 = 20$ and $8 \times 20 = 160$ runs, so 180 runs in 10 matches, an average of 18. Averaging the two averages gives 15, which treats a machine with 2 matches the same as one with 8.
