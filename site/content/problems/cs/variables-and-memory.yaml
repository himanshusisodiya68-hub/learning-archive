# Variables and memory. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: "Python code: `a = [1, 2, 3]`, then `b = a`, then `b.append(4)`, then `b.append(5)`. What is `len(a)` at the end?"
  ask: len(a)
  unit: ""
  ans: 5
  tol: 0.1
  verify: 3+1+1
  sol: "`b = a` makes a second name for the same list, so both appends change the one list that `a` also points at. It started with 3 items and gained 2, so `len(a)` is 5."
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: Which of these Python values can be changed in place after it is created?
  opts: ["A tuple like (1, 2)", "A dictionary like {'x': 1}", "A piece of text like 'hello'"]
  ans: 1
  sol: Dictionaries are mutable, so `d['y'] = 2` changes the same object. Tuples and text are immutable, so any "change" builds a new object.
