# Designing a news feed. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: 500 million people each open a feed 10 times a day. Peak traffic is 3 times the average rate. What is the peak number of feed opens per second (a day has 86,400 seconds)?
  ask: Peak opens
  unit: per second
  ans: 173611
  tol: 5
  verify: 500e6*10/86400*3
  sol: Opens per day $= 5\times10^{9}$. Average per second $= 5\times10^{9}/86{,}400 \approx 57{,}870$. Peak $= 3\times 57{,}870 \approx 173{,}611$ per second. The 10 opens and the factor of 3 are assumptions. [Inference]
  check: code

- id: f2
