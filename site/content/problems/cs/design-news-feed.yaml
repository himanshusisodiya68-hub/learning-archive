  kind: mcq
  q: In which design is the work of building your feed done at the moment your friend posts?
  opts: ["Fan-out on read", "Fan-out on write", "Neither"]
  ans: 1
  sol: Fan-out on write copies the post id into each follower's inbox when the post is made. Fan-out on read leaves the work until you open the app.
