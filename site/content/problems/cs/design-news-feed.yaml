- id: b2
  lvl: board
  kind: num
  q: An account with 100 million followers posts once. The fan-out cluster can do 50,000 inbox writes per second for this job. How many minutes does that single post take to fan out, if it is pushed to every follower? Give one decimal place.
  ask: Fan-out time
  unit: minutes
  ans: 33.3
  tol: 0.1
  verify: 1e8/50000/60
  sol: Time $= 10^{8} / 50{,}000 = 2{,}000$ seconds, about 33.3 minutes. During that time every other fan-out job waits behind it. That is why accounts above a follower threshold are not pushed but merged at read time.
  check: code

- id: m1
  lvl: main
  kind: text
  q: A feed API returns pages using "skip N, take 20". Users complain about seeing the same post twice when they scroll. Explain the cause and give the fix, including what the client sends for the next page.
  sol: |
    **Cause.** New posts keep arriving at the top. If you loaded page one (positions 1 to 20) and then 3 new posts arrive, the old post at position 20 is now at position 23. "Skip 20, take 20" now returns positions 21 to 40, which begin with the old positions 18, 19 and 20: three repeats. A deletion has the opposite effect (a skipped post).

    **Fix.** Use a **cursor**. The server returns, with each page, the (time, post id) of the last item. The client sends it back as "give me 20 items older than this". Items added at the top cannot shift what is older than a fixed point. Include the id as well as the time so that two posts made in the same second keep a stable order.

    ```python
    # SQL idea: WHERE (created_at, id) < (:t, :id) ORDER BY created_at DESC, id DESC LIMIT 20
    ```
    This also uses an index, so each page is cheap, unlike "skip N", which must count past N rows.
  check: none

- id: m2
  lvl: main
  kind: text
  q: Describe the read path for a hybrid feed when the user follows 300 ordinary accounts and 3 accounts with over 10 million followers each. Say what is read, from where, and what is merged. Then say what happens when the user posts a photo.
  sol: |
    **Reading.**
    1. Fetch the user's inbox (a list of post ids) from the timeline cache. It already contains posts from the 300 ordinary accounts, pushed when they posted.
    2. For each of the 3 celebrities, fetch their latest few post ids from the post store or a cache. The three lookups can run in parallel.
    3. Merge the lists by (time, id), drop anything deleted, blocked or already seen, and take the first page of ids.
    4. Hydrate the page: fetch the posts by id in one batch call.
    5. Optionally rank before cutting to the page size.

    **Posting.** Save the post once in the post store, then queue a fan-out job. Workers push its id into the inbox of each follower. Because the user is an ordinary account, the push is acceptable. The user's own feed also merges their own recent posts at read time, so the post shows immediately even before the fan-out finishes (read your own writes).
  check: none

- id: a1
  lvl: adv
  kind: text
  q: Post A has 100 likes and is 6 hours old. Post B has 30 likes and is 1 hour old. Using score = e * 2^(-t/h) with half-life 3 hours and e equal to the likes, which ranks higher, and when would the order flip? Then explain one reason a pure engagement score can harm users.
  sol: |
    $A$: $100\cdot 2^{-6/3} = 100\cdot 0.25 = 25$. $B$: $30\cdot 2^{-1/3} \approx 30\cdot 0.794 \approx 23.8$. So $A$ ranks slightly higher now.

    The order flips when $B$'s score exceeds $A$'s. Both fade at the same rate, so the ratio of scores depends only on the age gap: $A/B = (100/30)\cdot 2^{-(6-1)/3} = 3.33 \cdot 2^{-5/3} \approx 3.33\cdot 0.315 \approx 1.05$. Since both decay at the same factor over time, the ratio stays about 1.05 as long as the age gap stays at 5 hours: $A$ stays on top for good. A flip needs $B$ to gain engagement (it is fresher and may collect more likes) or $A$ to be demoted by another rule.

    **Harm.** Pure engagement favours posts that make people angry or anxious, because those attract comments and shares. Real systems add other signals (quality, whether people regret the time, diversity of sources) and rules that limit repeated authors or topics. [Inference: common concerns discussed publicly, not a claim about any one company.]
  check: none

- id: o1
  lvl: oly
  kind: text
  q: Design the feed's failure behaviour. The ranking service takes 400 ms instead of 50 ms. The timeline cache loses one machine holding 2% of users' inboxes. A celebrity's fan-out job is stuck in the queue. For each fault, state what the user sees and what the system does.
  sol: |
    **Slow ranking service (400 ms against a 200 ms budget).** Put a timeout on the ranking call (say 100 ms). On timeout, return the light-ranked or newest-first list from the inbox, and mark the response as degraded. Use a **circuit breaker**: after repeated timeouts, stop calling the ranker for a few seconds, which also stops the slow service from piling up requests and collapsing. The user sees a plainer feed, not an error.

    **Cache machine lost (2% of users).** Their inboxes are gone from memory. On a read miss, rebuild from the follow graph: fetch recent posts of followed ordinary accounts and merge, as a one-off fan-out on read, then store the result. Limit concurrent rebuilds so thousands of misses do not overload the post store (protect against a stampede, for example with a lock per user or rate limiting). Those 2% of users see a slower first load; the rest are unaffected. Replication of inboxes (a second copy on another machine) avoids even that, at double the memory.

    **Stuck celebrity fan-out.** With the hybrid design, the celebrity is not pushed at all, so followers still get the post at read time. For the pushed accounts, a stuck job delays only that job if jobs are partitioned by author. Use separate queues or priority per account class so a large job cannot starve the rest, and make jobs resumable and idempotent so a retry does not duplicate ids.

    **Common principles.** Timeouts on every call, fallbacks that are tested regularly, isolation between failures, and monitoring that shows the share of degraded responses, which is itself a signal to page someone.
  check: none
