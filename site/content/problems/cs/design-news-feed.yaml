  q: 100 million posts are made per day and the average poster has 200 followers. With fan-out on write, how many timeline writes per day does posting cause, in billions?
  ask: Writes per day
  unit: billion
  ans: 20
  tol: 0.1
  verify: 100e6*200/1e9
  sol: $W = P \cdot f = 10^{8} \times 200 = 2\times10^{10}$, which is 20 billion timeline writes per day, or about 231,000 per second on average.
