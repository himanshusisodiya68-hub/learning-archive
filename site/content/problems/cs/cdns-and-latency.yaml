# CDNs and latency. All problems are original.

- id: f1
  lvl: found
  kind: num
  q: Light in glass fibre travels at about 200,000 km/s. How long, in milliseconds, does a signal take one way over a 1,150 km cable (about the Delhi to Mumbai distance)?
  ask: One-way time
  unit: ms
  ans: 5.75
  tol: 0.05
  verify: 1150/200000*1000
  sol: Time is distance over speed, $1150 / 200\,000 = 0.00575$ s, which is 5.75 ms. The round trip is twice that, 11.5 ms, before any routers add delay.
  check: code

- id: f2
  lvl: found
  kind: mcq
  q: You send a very short chat message to a server on another continent. Which change would reduce the delay the most?
  opts: ["Buying a plan with ten times the bandwidth", "Using a server closer to you", "Compressing the message by half"]
  ans: 1
  sol: A tiny message is limited by latency, the travel time over the distance. More bandwidth or compression changes how fast bits are poured, which hardly matters for a few bytes. A nearer server shortens the road.
  check: none

- id: b1
  lvl: board
  kind: num
  q: A server is 13,500 km away by cable. Signals travel at 200,000 km/s. What is the minimum possible round-trip time in milliseconds?
  ask: Minimum RTT
  unit: ms
  ans: 135
  tol: 0.5
  verify: 2*13500/200000*1000
  sol: $\text{RTT}_{\min} = 2d/v = 2 \times 13\,500 / 200\,000 = 0.135$ s, that is 135 ms. Real paths are slower because routers add queueing and the cable route is not a straight line.
  check: code

- id: b2
  lvl: board
  kind: num
  q: A CDN edge answers 95% of requests in 20 ms. The other 5% must go to the origin and take 220 ms. What is the average latency in milliseconds?
  ask: Average latency
  unit: ms
  ans: 30
  tol: 0.1
  verify: 0.95*20+0.05*220
  sol: $L = h L_{\text{edge}} + (1-h) L_{\text{origin}} = 0.95 \times 20 + 0.05 \times 220 = 19 + 11 = 30$ ms.
  check: code

- id: m1
  lvl: main
  kind: text
  q: A page needs DNS, a TCP handshake, a TLS 1.3 handshake and one request, each one round trip. Compare the time to the first byte for a user in India when the server is in the USA (RTT 220 ms) and when a CDN edge in Mumbai serves it (RTT 15 ms). State what you ignore.
  sol: |
    Four round trips. USA origin: $4 \times 220 = 880$ ms. Mumbai edge: $4 \times 15 = 60$ ms. (Assuming a cache hit at the edge and ignoring server processing, DNS being answered in one round trip to a resolver at the same distance, and the time to download the data.)

    The edge is about 15 times faster, which matches the ratio of the RTTs. Note that the CDN shortens every round trip because it also terminates the TCP and TLS connections near the user, not only because it holds the file.
  check: none

- id: m2
  lvl: main
  kind: text
  q: A shop changes a product's price, but customers still see the old page for up to an hour because the CDN caches it. List three ways to fix this and the downside of each.
  sol: |
    1. **Purge the page** from the CDN after each price change. Downside: takes seconds to reach every edge and needs an automated call from the price system; a failed purge leaves stale pages.
    2. **Short TTL** (for example 30 seconds) on the page. Downside: more misses, so more load on the origin and a lower hit ratio.
    3. **Serve the changeable part separately**: cache the page shell for long and fetch the price with a small API call that is not cached (or cached briefly). Downside: an extra request and more design work.

    For static files like images and scripts, use versioned file names instead (`logo.3fa9.png`), and cache them for a year.
  check: none

- id: a1
  lvl: adv
  kind: num
  q: A 5 MB file is downloaded over a 40 Mbit/s plan with a round-trip time of 150 ms. Three round trips are needed for setup and the request before data flows. Using T = n × RTT + S/B, how long does it take, in seconds? (1 byte = 8 bits.)
  ask: Download time
  unit: s
  ans: 1.45
  tol: 0.01
  verify: 3*0.15+5*8/40
  sol: Setup is $3 \times 0.15 = 0.45$ s. The data is $5 \times 8 = 40$ megabits, which at 40 Mbit/s takes $40/40 = 1.0$ s. Total $0.45 + 1.0 = 1.45$ s. With a CDN edge at RTT 15 ms the setup falls to 0.045 s, saving about 0.4 s.
  check: code

- id: o1
  lvl: oly
  kind: num
  q: A page view makes 30 independent backend calls, and each call is slow (above its p99 time) with probability 1%. What percentage of page views contain at least one slow call?
  ask: Page views affected
  unit: "%"
  ans: 26
  tol: 0.1
  verify: (1-0.99**30)*100
  sol: |
    The chance that all 30 calls are fast is $0.99^{30} \approx 0.740$, so at least one is slow with probability $1 - 0.740 = 0.260$, about 26%. A "one in a hundred" event per call becomes about one in four per page view.

    Consequences for design: track p99 (or p99.9) of each service and the whole page, send a hedged duplicate request when a call is slower than the usual p95, reduce the number of calls on the critical path, and run calls in parallel so that the page waits for the slowest rather than the sum.
  check: code
