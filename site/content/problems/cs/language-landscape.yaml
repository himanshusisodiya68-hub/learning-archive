  q: Which language is best known for enforcing memory safety through ownership rules checked by the compiler, with no garbage collector?
  opts: ["Java", "Rust", "Python"]
  ans: 1
  sol: Rust gives each value one owner and the compiler inserts the cleanup when the owner goes out of scope. Java and Python use garbage collection.
