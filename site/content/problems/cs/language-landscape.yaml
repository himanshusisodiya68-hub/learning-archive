# The language landscape. All problems are original.

- id: f1
  lvl: found
  kind: mcq
  q: Which of these is checked for type mistakes before the program runs?
  opts: ["Plain Python without any type checker", "A Java program", "A JavaScript function called from a web page"]
  ans: 1
  sol: Java is statically typed, so the compiler rejects a type mistake before the program starts. Plain Python and JavaScript check types while running (Python has optional hints that separate tools can check).
