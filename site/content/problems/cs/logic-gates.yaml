- id: f2
  lvl: found
  kind: mcq
  q: Which gate outputs 1 only when its two inputs are different?
  opts: ["AND", "OR", "XOR"]
  ans: 2
  sol: XOR (exclusive or) is 1 when exactly one input is 1. AND needs both to be 1, and OR is also 1 when both are 1.
