- id: f1
  lvl: found
  kind: num
  q: A program has 8 modules and each is allowed to depend directly on every other module. How many one-way dependencies can there be?
  ask: Dependencies
  unit: ""
  ans: 56
  tol: 0.1
  verify: 8*7
  sol: Each of the 8 modules can depend on the other 7, so there are $8 \times 7 = 56$ one-way links. If all 8 instead depend only on one shared interface, the number drops to 8.
