- id: b1
  lvl: board
  kind: mcq
  q: |
    A function decides a delivery charge with `if city == "Delhi": ... elif city == "Pune": ... elif ...`, and a new city means editing it. Which SOLID principle is most directly broken?
  opts: ["Open/closed", "Liskov substitution", "Interface segregation"]
  ans: 0
  sol: Adding a new case forces an edit to code that already works. Open/closed asks that new behaviour arrive as new code, for example a table of city rates (a strategy), leaving the old code untouched.
