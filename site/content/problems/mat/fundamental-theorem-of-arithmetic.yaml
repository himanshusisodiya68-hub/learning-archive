  q: Which of the following is the prime factorisation of 2520? (Original problem.)
  opts: ["$2^2 \\times 3^2 \\times 5 \\times 7$", "$2^3 \\times 3^2 \\times 5 \\times 7$", "$2^3 \\times 3 \\times 5^2 \\times 7$", "$2^3 \\times 3^2 \\times 5 \\times 7^2$"]
