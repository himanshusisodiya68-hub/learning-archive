- id: b2
  lvl: board
  kind: text
  q: |-
    Case-based. A florist has 60 red roses and 84 white roses. She wants to make identical bunches using all the flowers, so that no flower is left over and every bunch has the same number of red roses and the same number of white roses.
    (i) What is the greatest number of bunches she can make?
    (ii) How many red and how many white roses will each bunch contain?
    (Original problem.)
  sol: |
    (i) The number of bunches must divide both 60 and 84, and we want the greatest such number, so it is $\mathrm{HCF}(60, 84)$. With $60 = 2^2 \times 3 \times 5$ and $84 = 2^2 \times 3 \times 7$, the common part is $2^2 \times 3 = 12$. She can make **12 bunches**.

    (ii) Each bunch has $60/12 = 5$ red roses and $84/12 = 7$ white roses.
  check: none

- id: b3
  lvl: board
  kind: mcq
  q: |-
    Assertion (A): For no natural number $n$ does $12^n$ end with the digit 0.
    Reason (R): The prime factorisation of $12^n$ contains only the primes 2 and 3.
    (Original problem.)
  opts: ["Both A and R are true and R is the correct explanation of A", "Both A and R are true but R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"]
  ans: 0
  sol: |
    $12^n = (2^2 \times 3)^n = 2^{2n} \times 3^n$, so R is true. A number ends in 0 only if it is divisible by $10 = 2 \times 5$, so it needs the prime 5. By the uniqueness of prime factorisation, 5 cannot appear in $12^n$, so A is true. R is exactly the reason for A.
  check: none

- id: m1
  lvl: main
  kind: num
  q: How many positive divisors does 360 have? (Original problem.)
  ask: Number of positive divisors
  ans: 24
  tol: 0.01
  verify: (()=>{let c=0;for(let d=1;d<=360;d++)if(360%d===0)c++;return c})()
  sol: |
    $360 = 2^3 \times 3^2 \times 5$. By the Fundamental Theorem of Arithmetic every divisor has the form $2^a 3^b 5^c$ with $0 \le a \le 3$, $0 \le b \le 2$, $0 \le c \le 1$, and different choices give different divisors (uniqueness). The count is $(3+1)(2+1)(1+1) = 4 \times 3 \times 2 = 24$.
  check: both

- id: m2
  lvl: main
  kind: num
  q: Find the least positive number which leaves remainder 5 when divided by 6, by 15 and by 18. (Original problem.)
  ask: The number
  ans: 95
  tol: 0.01
  verify: (()=>{for(let n=6;;n++)if(n%6===5&&n%15===5&&n%18===5)return n})()
  sol: |
    If $n$ leaves remainder 5 each time, then $n - 5$ is divisible by 6, 15 and 18. The least positive such value of $n - 5$ is $\mathrm{LCM}(6, 15, 18)$. With $6 = 2 \times 3$, $15 = 3 \times 5$, $18 = 2 \times 3^2$, the LCM is $2 \times 3^2 \times 5 = 90$. So $n = 90 + 5 = 95$. (A remainder of 5 needs a divisor larger than 5, and 6, 15, 18 all exceed 5.)
  check: both

- id: m3
  lvl: main
  kind: num
  q: How many ordered pairs $(a, b)$ of positive integers have $\mathrm{HCF}(a, b) = 6$ and $\mathrm{LCM}(a, b) = 36$? (Original problem.)
  ask: Number of ordered pairs
  ans: 4
  tol: 0.01
  verify: (()=>{const g=(x,y)=>y?g(y,x%y):x;let c=0;for(let a=1;a<=36;a++)for(let b=1;b<=36;b++)if(g(a,b)===6&&a*b/g(a,b)===36)c++;return c})()
  sol: |
    Write $a = 6x$ and $b = 6y$ with $x, y$ coprime (that is what HCF = 6 means). Then $\mathrm{LCM} = 6xy = 36$, so $xy = 6$ with $\gcd(x, y) = 1$. The factorisations of 6 into coprime ordered pairs are $(1, 6), (6, 1), (2, 3), (3, 2)$. So there are 4 ordered pairs: $(6, 36), (36, 6), (12, 18), (18, 12)$.
  check: both
