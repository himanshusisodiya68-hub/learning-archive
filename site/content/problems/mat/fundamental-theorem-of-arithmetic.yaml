  sol: |
    $24 = 2^3 \times 3$ and $36 = 2^2 \times 3^2$. Greatest powers: $2^3$ and $3^2$, so $\mathrm{LCM} = 8 \times 9 = 72$. Smallest powers of the common primes give $\mathrm{HCF} = 2^2 \times 3 = 12$, and indeed $12 \times 72 = 864 = 24 \times 36$.
