  q: If $\alpha$ and $\beta$ are the zeroes of $2x^2 - 5x + 3$, find the value of $\alpha^2 + \beta^2$. (Original problem.)
  ask: Value of α² + β²
  ans: 3.25
  tol: 0.001
  verify: pow(5/2,2)-2*(3/2)
  sol: |
    Here $a = 2$, $b = -5$, $c = 3$, so $\alpha + \beta = \tfrac52$ and $\alpha\beta = \tfrac32$.

    Use the identity $\alpha^2 + \beta^2 = (\alpha+\beta)^2 - 2\alpha\beta$:
    $$\alpha^2 + \beta^2 = \frac{25}{4} - 3 = \frac{13}{4} = 3.25.$$

    **Check.** $2x^2 - 5x + 3 = (2x-3)(x-1)$ has zeroes $\tfrac32$ and $1$: $\tfrac94 + 1 = \tfrac{13}{4}$.
  check: both

- id: m3
  lvl: main
  kind: num
  q: The zeroes of the cubic polynomial $x^3 - 12x^2 + 44x - 48$ are in arithmetic progression. Find the largest zero. (Original problem.)
  ask: Largest zero
  ans: 6
  tol: 0.001
  verify: 4+sqrt(16-48/4)
  sol: |
    Let the zeroes be $a - d$, $a$, $a + d$ with $d > 0$. For $x^3 + bx^2 + cx + d_0$ with leading coefficient $1$: sum of zeroes $= -b = 12$, so $3a = 12$ and $a = 4$.

    Product of zeroes $= -d_0 = 48$:
    $$(a-d)\,a\,(a+d) = a(a^2 - d^2) = 4(16 - d^2) = 48 \Rightarrow d^2 = 4 \Rightarrow d = 2.$$

    So the zeroes are $2, 4, 6$ and the largest is $6$.

    **Check with the third relation.** Sum of products in pairs $= 2\cdot4 + 4\cdot6 + 2\cdot6 = 8 + 24 + 12 = 44 = c/a$. It matches.
  check: both

