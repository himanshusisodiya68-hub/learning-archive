- id: b1
  lvl: board
  kind: text
  q: Find a quadratic polynomial whose zeroes are $3$ and $-2$. Verify the relationship between the zeroes and the coefficients. (Original problem.)
  sol: |
    Sum of zeroes $= 3 + (-2) = 1$. Product $= 3 \times (-2) = -6$.

    The polynomial is $x^2 - (\text{sum})x + \text{product} = x^2 - x - 6$.

    **Verify.** Here $a = 1$, $b = -1$, $c = -6$. Then $-b/a = 1 =$ sum, and $c/a = -6 =$ product. Also $x^2 - x - 6 = (x-3)(x+2)$ has zeroes $3$ and $-2$. Any $k(x^2 - x - 6)$ with $k \neq 0$ also works.
  check: none

- id: b2
  lvl: board
  kind: text
  q: |-
    **Case study.** A garden fountain throws water in an arc. Taking the nozzle as the origin, the height $y$ (in metres) of the water at a horizontal distance $x$ (in metres) is $y = -x^2 + 4x$.

    (a) Find the zeroes of the polynomial $-x^2 + 4x$.
    (b) How far from the nozzle does the water land?
    (c) Does the graph open upwards or downwards? Give a reason using the coefficient of $x^2$.

    (Original problem.)
  sol: |
    (a) $-x^2 + 4x = -x(x - 4)$, so the zeroes are $x = 0$ and $x = 4$. (Check: sum $= 4 = -4/(-1)$; product $= 0 = 0/(-1)$.)

    (b) The water is at ground level ($y = 0$) at the zeroes. $x = 0$ is the nozzle itself, so it lands at $x = 4$ m.

    (c) The coefficient of $x^2$ is $-1 < 0$, so the parabola opens **downwards**, like an arch. That is the shape of the water's path, which rises and then falls.
  check: none

- id: b3
  lvl: board
  kind: mcq
  q: |-
    **Assertion (A):** The polynomial $x^2 + 1$ has no real zeroes.
    **Reason (R):** The graph of $y = x^2 + 1$ lies entirely above the x-axis.

    Choose the correct option. (Original problem.)
  opts: ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "A is false but R is true."]
  ans: 0
  sol: |
    $x^2 \geq 0$ for every real $x$, so $x^2 + 1 \geq 1 > 0$: the value is never zero, which is why $A$ holds. Equivalently, the graph is the parabola $y = x^2$ lifted by $1$, so every point has $y \geq 1$ and the graph never meets the x-axis. Zeroes are exactly the x-coordinates of points where the graph meets the x-axis, so $R$ is true and explains $A$. Option 1.
  check: none

- id: m1
  lvl: main
  kind: num
  q: The zeroes of the polynomial $x^2 - 8x + k$ differ by $2$. Find $k$. (Original problem.)
  ask: Value of k
  ans: 15
  tol: 0.001
  verify: ((8+2)/2)*((8-2)/2)
  sol: |
    Let the zeroes be $\alpha$ and $\beta$ with $\alpha - \beta = 2$. From the sum, $\alpha + \beta = 8$.

    Adding: $2\alpha = 10$, so $\alpha = 5$; then $\beta = 3$.

    Product $= k = \alpha\beta = 5 \times 3 = 15$.

    **Check.** $x^2 - 8x + 15 = (x-3)(x-5)$, zeroes $3$ and $5$, which differ by $2$.
  check: both

- id: m2
  lvl: main
