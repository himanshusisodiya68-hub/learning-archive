# Class 10 Maths Real Numbers: NCERT questions copied word for word from NCERT Mathematics Class X (reprint 2026-27), Ch 1, §1.3 and Exercise 1.2. Theorems 1.2 and 1.3 are stated as in the book and set as proof items. Originals marked found/board/main.

- id: ncert10-th-1-2
  lvl: ncert-intext
  num: "X Theorem 1.2"
  source: NCERT X Maths · Ch 1 · Theorem 1.2
  kind: proof
  q: |-
    Let $p$ be a prime number. If $p$ divides $a^2$, then $p$ divides $a$, where $a$ is a positive integer. [Prove this theorem.]
  hints: ["Write the prime factorisation of $a$ as $p_1 p_2 \\dots p_n$ and write down the factorisation of $a^2$.", "Use the uniqueness part of the Fundamental Theorem of Arithmetic: which primes can $a^2$ have?", "If $p$ is a prime factor of $a^2$, which of $p_1, \\dots, p_n$ must it be equal to?"]
  sol: |
    Let the prime factorisation of $a$ be $a = p_1 p_2 \dots p_n$, where $p_1, p_2, \dots, p_n$ are primes, not necessarily distinct. Then
    $$a^2 = (p_1 p_2 \dots p_n)(p_1 p_2 \dots p_n) = p_1^2 p_2^2 \dots p_n^2.$$
    This is a prime factorisation of $a^2$. By the **uniqueness** part of the Fundamental Theorem of Arithmetic, it is the only one (apart from order): the primes dividing $a^2$ are exactly $p_1, p_2, \dots, p_n$.

    We are given that $p$ divides $a^2$, so $p$ is a prime factor of $a^2$, hence $p$ is one of $p_1, p_2, \dots, p_n$. But these are exactly the prime factors of $a$. So $p$ divides $a$. $\blacksquare$

    Why it matters: it fails for composite divisors. For example $4$ divides $6^2 = 36$ but $4$ does not divide $6$. Primality of $p$ is what makes the argument work.

    [Note] The reprint marks this proof "Not from the examination point of view".
  check: none

- id: ncert10-th-1-3
  lvl: ncert-intext
  num: "X Theorem 1.3"
  source: NCERT X Maths · Ch 1 · Theorem 1.3
  kind: proof
  q: |-
    $\sqrt{2}$ is irrational. [Prove this theorem.]
  hints: ["Assume to the contrary that $\\sqrt{2} = a/b$ with $a$ and $b$ coprime integers, $b \\ne 0$.", "Square and rearrange to get $2b^2 = a^2$, then use Theorem 1.2 to show $2$ divides $a$.", "Write $a = 2c$, substitute, and show $2$ also divides $b$. What does that contradict?"]
  sol: |
    We use **proof by contradiction**. Assume that $\sqrt{2}$ is rational. Then $\sqrt{2} = r/s$ for integers $r, s$ with $s \ne 0$. If $r$ and $s$ have a common factor other than 1, divide it out. So we may write $\sqrt{2} = a/b$ where $a$ and $b$ are **coprime**.

    Then $b\sqrt{2} = a$. Squaring both sides gives $2b^2 = a^2$. So 2 divides $a^2$, and by Theorem 1.2 (with $p = 2$), 2 divides $a$.

    Write $a = 2c$ for some integer $c$. Substituting, $2b^2 = 4c^2$, that is $b^2 = 2c^2$. So 2 divides $b^2$, and by Theorem 1.2 again, 2 divides $b$.

    Now 2 divides both $a$ and $b$, so $a$ and $b$ have 2 as a common factor. This contradicts the fact that they are coprime. The contradiction arose from assuming that $\sqrt{2}$ is rational. Therefore $\sqrt{2}$ is irrational. $\blacksquare$
  check: none

- id: ncert10-eg-1-5
  lvl: ncert-intext
  num: "X Example 5"
  source: NCERT X Maths · Ch 1 · Example 5
  kind: proof
  q: |-
    Prove that $\sqrt{3}$ is irrational.
  hints: ["Assume $\\sqrt{3} = a/b$ with $a, b$ coprime, and square to get $3b^2 = a^2$.", "Apply Theorem 1.2 with $p = 3$ to $a$, then write $a = 3c$.", "Show 3 divides $b$ as well, contradicting that $a$ and $b$ are coprime."]
  sol: |
    Assume, to the contrary, that $\sqrt{3}$ is rational. Then $\sqrt{3} = a/b$ with integers $a, b$ ($b \ne 0$); dividing out any common factor, take $a$ and $b$ coprime.

    So $b\sqrt{3} = a$. Squaring: $3b^2 = a^2$. Thus 3 divides $a^2$, and by Theorem 1.2, 3 divides $a$. Write $a = 3c$. Then $3b^2 = 9c^2$, so $b^2 = 3c^2$. Hence 3 divides $b^2$, and by Theorem 1.2, 3 divides $b$.

    Then $a$ and $b$ have 3 as a common factor, contradicting that they are coprime. So the assumption is wrong, and $\sqrt{3}$ is irrational. $\blacksquare$
  check: none

- id: ncert10-eg-1-6
  lvl: ncert-intext
  num: "X Example 6"
  source: NCERT X Maths · Ch 1 · Example 6
  kind: proof
  q: |-
    Show that $5 - \sqrt{3}$ is irrational.
  hints: ["Assume $5 - \\sqrt{3} = a/b$ with $a, b$ integers, $b \\ne 0$.", "Rearrange to isolate $\\sqrt{3}$ on one side.", "The other side is a quotient of integers. What does that say about $\\sqrt{3}$, which Example 5 proved irrational?"]
  sol: |
    Assume, to the contrary, that $5 - \sqrt{3}$ is rational: $5 - \sqrt{3} = \dfrac{a}{b}$ for coprime integers $a, b$ with $b \ne 0$.

    Rearranging, $\sqrt{3} = 5 - \dfrac{a}{b} = \dfrac{5b - a}{b}$.

    Since $a$ and $b$ are integers, $5 - \dfrac{a}{b}$ is a rational number, so $\sqrt{3}$ would be rational. This contradicts Example 5 ($\sqrt{3}$ is irrational). So the assumption is false, and $5 - \sqrt{3}$ is irrational. $\blacksquare$
  check: none

- id: ncert10-eg-1-7
  lvl: ncert-intext
  num: "X Example 7"
  source: NCERT X Maths · Ch 1 · Example 7
  kind: proof
  q: |-
    Show that $3\sqrt{2}$ is irrational.
  hints: ["Assume $3\\sqrt{2} = a/b$ with $a, b$ integers, $b \\ne 0$.", "Divide both sides by 3 to isolate $\\sqrt{2}$.", "Compare with Theorem 1.3."]
  sol: |
    Assume, to the contrary, that $3\sqrt{2}$ is rational: $3\sqrt{2} = \dfrac{a}{b}$ with coprime integers $a, b$, $b \ne 0$.

    Rearranging, $\sqrt{2} = \dfrac{a}{3b}$. Since 3, $a$ and $b$ are integers (and $3b \ne 0$), $\dfrac{a}{3b}$ is rational, so $\sqrt{2}$ would be rational. This contradicts Theorem 1.3. Hence $3\sqrt{2}$ is irrational. $\blacksquare$
  check: none

- id: ncert10-ex-1.2-1
  lvl: ncert-ex
  num: "X Ex 1.2 Q1"
  source: NCERT X Maths · Ch 1 · Exercise 1.2
  kind: proof
  q: |-
    Prove that $\sqrt{5}$ is irrational.
  hints: ["Copy the proof for $\\sqrt{3}$ with 3 replaced by 5.", "From $5b^2 = a^2$, Theorem 1.2 with $p = 5$ gives $5 \\mid a$.", "Write $a = 5c$ to get $b^2 = 5c^2$, so $5 \\mid b$: a contradiction with coprimality."]
  sol: |
    Assume, to the contrary, that $\sqrt{5}$ is rational. Then $\sqrt{5} = a/b$ with $a, b$ coprime integers, $b \ne 0$.

    Squaring $b\sqrt{5} = a$ gives $5b^2 = a^2$. So 5 divides $a^2$, and by Theorem 1.2 (with $p = 5$), 5 divides $a$. Write $a = 5c$. Then $5b^2 = 25c^2$, so $b^2 = 5c^2$. So 5 divides $b^2$, and by Theorem 1.2, 5 divides $b$.

    Now 5 is a common factor of $a$ and $b$, contradicting that they are coprime. Therefore $\sqrt{5}$ is irrational. $\blacksquare$

    The NCERT answer key gives no entry for Exercise 1.2.
  check: none

- id: ncert10-ex-1.2-2
  lvl: ncert-ex
  num: "X Ex 1.2 Q2"
  source: NCERT X Maths · Ch 1 · Exercise 1.2
  kind: proof
  q: |-
    Prove that $3 + 2\sqrt{5}$ is irrational.
  hints: ["Assume $3 + 2\\sqrt{5} = a/b$ with $a, b$ integers, $b \\ne 0$.", "Isolate $\\sqrt{5}$: subtract 3 and divide by 2.", "Use Exercise 1.2 Q1 ($\\sqrt{5}$ is irrational) for the contradiction."]
  sol: |
    Assume, to the contrary, that $3 + 2\sqrt{5}$ is rational: $3 + 2\sqrt{5} = \dfrac{a}{b}$ with integers $a, b$, $b \ne 0$.

    Then $2\sqrt{5} = \dfrac{a}{b} - 3 = \dfrac{a - 3b}{b}$, so
    $$\sqrt{5} = \frac{a - 3b}{2b}.$$
    Since $a, b$ are integers and $2b \ne 0$, the right side is rational. So $\sqrt{5}$ would be rational, contradicting Q1. Hence $3 + 2\sqrt{5}$ is irrational. $\blacksquare$
  check: none

- id: ncert10-ex-1.2-3
  lvl: ncert-ex
  num: "X Ex 1.2 Q3"
  source: NCERT X Maths · Ch 1 · Exercise 1.2
  kind: proof
  q: |-
    Prove that the following are irrationals:
    (i) $\dfrac{1}{\sqrt{2}}$   (ii) $7\sqrt{5}$   (iii) $6 + \sqrt{2}$
  hints: ["Use the same method each time: assume the number equals $a/b$, then isolate $\\sqrt{2}$ or $\\sqrt{5}$.", "(i) Take the reciprocal of both sides. (ii) Divide by 7. (iii) Subtract 6.", "Each time you get $\\sqrt{2}$ or $\\sqrt{5}$ equal to a quotient of integers, contradicting Theorem 1.3 or Q1."]
  sol: |
    In each part assume the number is rational, say equal to $a/b$ with integers $a, b$, $b \ne 0$, and isolate the known irrational.

    (i) Suppose $\dfrac{1}{\sqrt{2}} = \dfrac{a}{b}$. The number is not 0, so $a \ne 0$. Taking reciprocals, $\sqrt{2} = \dfrac{b}{a}$, a quotient of integers with $a \ne 0$. So $\sqrt{2}$ would be rational, contradicting Theorem 1.3. Hence $\dfrac{1}{\sqrt{2}}$ is irrational.

    (ii) Suppose $7\sqrt{5} = \dfrac{a}{b}$. Then $\sqrt{5} = \dfrac{a}{7b}$ is rational, contradicting Q1. Hence $7\sqrt{5}$ is irrational.

    (iii) Suppose $6 + \sqrt{2} = \dfrac{a}{b}$. Then $\sqrt{2} = \dfrac{a}{b} - 6 = \dfrac{a - 6b}{b}$ is rational, contradicting Theorem 1.3. Hence $6 + \sqrt{2}$ is irrational. $\blacksquare$

    (Alternative for (i): $\dfrac{1}{\sqrt{2}} = \dfrac{\sqrt{2}}{2}$, which is $\dfrac12 \times \sqrt{2}$, a non-zero rational times an irrational.)
  check: none

