- id: f2
  lvl: found
  kind: text
  q: |-
    State whether each number is rational or irrational, with a reason:
    (i) $\sqrt{81}$   (ii) $0.1010010001\ldots$ (each block has one more 0)   (iii) $\dfrac{22}{7}$   (iv) $\sqrt{12}$
    (Original problem.)
  sol: |
    (i) $\sqrt{81} = 9 = 9/1$: rational.

    (ii) The decimal neither terminates nor repeats (the gaps between the 1s keep growing): irrational.

    (iii) $22/7$ is a quotient of integers: rational. (It is only an approximation to $\pi$, which is irrational.)

    (iv) $\sqrt{12} = 2\sqrt{3}$, and $\sqrt{3}$ is irrational, so $2\sqrt{3}$ is irrational (a non-zero rational times an irrational).
