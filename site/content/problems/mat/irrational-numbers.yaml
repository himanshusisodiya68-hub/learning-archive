- id: b2
  lvl: board
  kind: mcq
  q: |-
    Assertion (A): $3 + \sqrt{5}$ is an irrational number.
    Reason (R): The sum of a rational number and an irrational number is irrational.
    (Original problem.)
  opts: ["Both A and R are true and R is the correct explanation of A", "Both A and R are true but R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"]
  ans: 0
  sol: |
    R is true: if rational $r$ plus irrational $x$ were a rational $q$, then $x = q - r$ would be rational, a contradiction. Since 3 is rational and $\sqrt{5}$ is irrational (Exercise 1.2 Q1), A follows from R. So R correctly explains A.
  check: none

- id: b3
  lvl: board
  kind: text
  q: |-
    True or false: "The sum of two irrational numbers is always irrational." Justify your answer with an example. (Original problem.)
  sol: |
    **False.** Take the irrational numbers $2 + \sqrt{3}$ and $2 - \sqrt{3}$ (each is irrational, by the method of Example 6). Their sum is $4$, which is rational.

    Another example: $\sqrt{2}$ and $-\sqrt{2}$ have sum 0. Sums of irrationals can be rational or irrational ($\sqrt{2} + \sqrt{2} = 2\sqrt{2}$ is irrational); the rules in this chapter hold only for a rational plus an irrational.
  check: none

- id: m1
  lvl: main
  kind: num
  q: For how many integers $n$ with $1 \le n \le 100$ is $\sqrt{n}$ rational? (Original problem.)
  ask: Number of integers
  ans: 10
  tol: 0.01
  verify: (()=>{let c=0;for(let n=1;n<=100;n++){const r=Math.round(Math.sqrt(n));if(r*r===n)c++}return c})()
  sol: |
    If $\sqrt{n}$ is rational and $n$ is an integer, then $n$ must be a perfect square (if $n = p_1^{e_1}\cdots p_k^{e_k}$ had an odd exponent, the same style of argument as for $\sqrt{2}$ shows $\sqrt{n}$ is irrational). Conversely, a perfect square has a rational (integer) square root. The perfect squares from 1 to 100 are $1^2, 2^2, \dots, 10^2$: 10 integers.

    [Inference] The claim in brackets (a positive integer that is not a perfect square has an irrational square root) is proved in general by comparing exponents in the unique prime factorisation; the chapter itself proves it only for primes.
  check: both

- id: m2
  lvl: main
  kind: num
  q: If $a$ and $b$ are rational numbers and $\dfrac{1}{3 - 2\sqrt{2}} = a + b\sqrt{2}$, find $a + b$. (Original problem.)
  ask: a + b
  ans: 5
  tol: 0.0001
  verify: (()=>{const v=1/(3-2*Math.sqrt(2));const b=(v-3)/Math.sqrt(2);return 3+b})()
  sol: |
    Rationalise the denominator: multiply top and bottom by $3 + 2\sqrt{2}$.
    $$\frac{1}{3 - 2\sqrt{2}} = \frac{3 + 2\sqrt{2}}{9 - 8} = 3 + 2\sqrt{2}.$$
    So $a = 3$ and $b = 2$, giving $a + b = 5$. (Because $\sqrt{2}$ is irrational, $a$ and $b$ are uniquely determined: if $a + b\sqrt{2} = a' + b'\sqrt{2}$ with $b \ne b'$, then $\sqrt{2} = (a'-a)/(b-b')$ would be rational.)
  check: both

- id: m3
  lvl: main
  kind: proof
  q: Prove that $\sqrt{2} + \sqrt{3}$ is irrational. (Original problem.)
  hints: ["Assume $\\sqrt{2} + \\sqrt{3} = r$ with $r$ rational (and positive).", "Write $\\sqrt{3} = r - \\sqrt{2}$ and square both sides.", "Solve for $\\sqrt{2}$ in terms of $r$."]
  sol: |
    Assume $\sqrt{2} + \sqrt{3} = r$ for a rational $r$; clearly $r > 0$. Then $\sqrt{3} = r - \sqrt{2}$. Squaring, $3 = r^2 - 2r\sqrt{2} + 2$, so
    $$\sqrt{2} = \frac{r^2 - 1}{2r}.$$
    The right side is rational (as $r$ is rational and non-zero), so $\sqrt{2}$ would be rational, contradicting Theorem 1.3. Hence $\sqrt{2} + \sqrt{3}$ is irrational. $\blacksquare$
  check: none
