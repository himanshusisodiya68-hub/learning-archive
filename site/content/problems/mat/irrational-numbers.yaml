  q: Which of the following numbers is irrational? (Original problem.)
  opts: ["$\\sqrt{49}$", "$\\sqrt{25/9}$", "$\\sqrt{0.04}$", "$\\sqrt{7}$"]
  ans: 3
  sol: |
    $\sqrt{49} = 7$, $\sqrt{25/9} = 5/3$ and $\sqrt{0.04} = 0.2 = 1/5$ are all rational. $\sqrt{7}$ is irrational: the proof for $\sqrt{2}$ works for any prime $p$, here $p = 7$.
