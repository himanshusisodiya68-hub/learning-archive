  q: Prove that $\sqrt{7}$ is irrational. (Original problem.)
  hints: ["Assume $\\sqrt{7} = a/b$ with $a, b$ coprime.", "Show $7 \\mid a^2$, then $7 \\mid a$ by Theorem 1.2; write $a = 7c$.", "Then $7 \\mid b$ too, contradicting coprimality."]
