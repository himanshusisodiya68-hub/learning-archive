- id: b2
  lvl: board
  kind: mcq
  q: |-
    Assertion (A): $3 + \sqrt{5}$ is an irrational number.
    Reason (R): The sum of a rational number and an irrational number is irrational.
    (Original problem.)
  opts: ["Both A and R are true and R is the correct explanation of A", "Both A and R are true but R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"]
  ans: 0
  sol: |
    R is true: if rational $r$ plus irrational $x$ were a rational $q$, then $x = q - r$ would be rational, a contradiction. Since 3 is rational and $\sqrt{5}$ is irrational (Exercise 1.2 Q1), A follows from R. So R correctly explains A.
  check: none

- id: b3
  lvl: board
  kind: text
  q: |-
    True or false: "The sum of two irrational numbers is always irrational." Justify your answer with an example. (Original problem.)
  sol: |
    **False.** Take the irrational numbers $2 + \sqrt{3}$ and $2 - \sqrt{3}$ (each is irrational, by the method of Example 6). Their sum is $4$, which is rational.

    Another example: $\sqrt{2}$ and $-\sqrt{2}$ have sum 0. Sums of irrationals can be rational or irrational ($\sqrt{2} + \sqrt{2} = 2\sqrt{2}$ is irrational); the rules in this chapter hold only for a rational plus an irrational.
  check: none

- id: m1
  lvl: main
  kind: num
  q: For how many integers $n$ with $1 \le n \le 100$ is $\sqrt{n}$ rational? (Original problem.)
  ask: Number of integers
  ans: 10
  tol: 0.01
  verify: (()=>{let c=0;for(let n=1;n<=100;n++){const r=Math.round(Math.sqrt(n));if(r*r===n)c++}return c})()
  sol: |
    If $\sqrt{n}$ is rational and $n$ is an integer, then $n$ must be a perfect square (if $n = p_1^{e_1}\cdots p_k^{e_k}$ had an odd exponent, the same style of argument as for $\sqrt{2}$ shows $\sqrt{n}$ is irrational). Conversely, a perfect square has a rational (integer) square root. The perfect squares from 1 to 100 are $1^2, 2^2, \dots, 10^2$: 10 integers.

    [Inference] The claim in brackets (a positive integer that is not a perfect square has an irrational square root) is proved in general by comparing exponents in the unique prime factorisation; the chapter itself proves it only for primes.
  check: both

- id: m2
  lvl: main
  kind: num
  q: If $a$ and $b$ are rational numbers and $\dfrac{1}{3 - 2\sqrt{2}} = a + b\sqrt{2}$, find $a + b$. (Original problem.)
  ask: a + b
  ans: 5
  tol: 0.0001
  verify: (()=>{const v=1/(3-2*Math.sqrt(2));const b=(v-3)/Math.sqrt(2);return 3+b})()
  sol: |
    Rationalise the denominator: multiply top and bottom by $3 + 2\sqrt{2}$.
    $$\frac{1}{3 - 2\sqrt{2}} = \frac{3 + 2\sqrt{2}}{9 - 8} = 3 + 2\sqrt{2}.$$
    So $a = 3$ and $b = 2$, giving $a + b = 5$. (Because $\sqrt{2}$ is irrational, $a$ and $b$ are uniquely determined: if $a + b\sqrt{2} = a' + b'\sqrt{2}$ with $b \ne b'$, then $\sqrt{2} = (a'-a)/(b-b')$ would be rational.)
  check: both

- id: m3
  lvl: main
  kind: proof
  q: Prove that $\sqrt{2} + \sqrt{3}$ is irrational. (Original problem.)
  hints: ["Assume $\\sqrt{2} + \\sqrt{3} = r$ with $r$ rational (and positive).", "Write $\\sqrt{3} = r - \\sqrt{2}$ and square both sides.", "Solve for $\\sqrt{2}$ in terms of $r$."]
  sol: |
    Assume $\sqrt{2} + \sqrt{3} = r$ for a rational $r$; clearly $r > 0$. Then $\sqrt{3} = r - \sqrt{2}$. Squaring, $3 = r^2 - 2r\sqrt{2} + 2$, so
    $$\sqrt{2} = \frac{r^2 - 1}{2r}.$$
    The right side is rational (as $r$ is rational and non-zero), so $\sqrt{2}$ would be rational, contradicting Theorem 1.3. Hence $\sqrt{2} + \sqrt{3}$ is irrational. $\blacksquare$
  check: none

- id: a1
  lvl: adv
  source: Zeitz, The Art and Craft of Problem Solving · Problem 2.3.14
  kind: proof
  q: |-
    Prove that $\log_{10} 2$ is irrational.
  hints: ["$\\log_{10} 2$ is positive. Assume it equals $a/b$ with positive integers $a, b$.", "Undo the logarithm: $10^{a/b} = 2$. Raise both sides to the power $b$.", "Compare the prime 5 on both sides of $10^a = 2^b$."]
  sol: |
    Since $1 < 2 < 10$, we have $0 < \log_{10} 2 < 1$; in particular it is positive. Suppose it were rational: $\log_{10} 2 = \dfrac{a}{b}$ with positive integers $a, b$.

    By the definition of the logarithm, $10^{a/b} = 2$. Raising both sides to the power $b$:
    $$10^a = 2^b, \quad\text{that is}\quad 2^a\,5^a = 2^b.$$
    Because $a \ge 1$, the left side is divisible by 5. The right side is a power of 2, whose only prime factor is 2, so it is not divisible by 5. By the uniqueness of prime factorisation (the Fundamental Theorem of Arithmetic), one number cannot have two different prime recipes. Contradiction.

    Hence $\log_{10} 2$ is irrational. $\blacksquare$

    The same argument shows $\log_{10} n$ is irrational for every positive integer $n$ that is not a power of 10: $10^a = n^b$ forces $n$ to have only the primes 2 and 5, in equal numbers.
  check: none

- id: a2
  lvl: adv
  source: Zeitz, The Art and Craft of Problem Solving · Problem 5.4.12
  kind: text
  q: |-
    Find a polynomial with integral coefficients whose zeros include $\sqrt{2} + \sqrt{5}$.
  sol: |
    Let $x = \sqrt{2} + \sqrt{5}$. Remove the roots one at a time by squaring.

    $x^2 = 2 + 2\sqrt{10} + 5 = 7 + 2\sqrt{10}$, so $x^2 - 7 = 2\sqrt{10}$.

    Square again: $(x^2 - 7)^2 = 40$, that is $x^4 - 14x^2 + 49 = 40$, so
    $$x^4 - 14x^2 + 9 = 0.$$
    **Answer:** $P(x) = x^4 - 14x^2 + 9$ has integer coefficients and $P(\sqrt{2} + \sqrt{5}) = 0$. (Any integer multiple of it, or its product with another integer polynomial, also works.)

    Bonus: $P$ is monic, so by the rational root test any rational zero is an integer dividing 9. Since $\sqrt{2} + \sqrt{5} \approx 3.65$ is not an integer, it is irrational. Its four zeros are $\pm\sqrt{2} \pm \sqrt{5}$.
  check: none

- id: a3
  lvl: adv
  kind: num
  q: |-
    $a$ and $b$ are rational numbers with $a > 0$ and $(a + b\sqrt{3})^2 = 28 - 10\sqrt{3}$. Find $a - b$. (Original problem.)
  ask: a − b
  ans: 6
  tol: 0.0001
  verify: (()=>{const a=5,b=-1;return Math.abs((a+b*Math.sqrt(3))**2-(28-10*Math.sqrt(3)))<1e-9?a-b:NaN})()
  sol: |
    Expand: $(a + b\sqrt{3})^2 = (a^2 + 3b^2) + 2ab\sqrt{3}$.

    Because $\sqrt{3}$ is irrational and $a, b$ are rational, the rational parts and the $\sqrt{3}$ parts must match separately (if $2ab \ne -10$, $\sqrt{3}$ would equal a quotient of rationals):
    $$a^2 + 3b^2 = 28, \qquad 2ab = -10.$$
    From the second, $b = -5/a$. Substituting, $a^2 + 75/a^2 = 28$, so $a^4 - 28a^2 + 75 = 0$, giving $(a^2 - 25)(a^2 - 3) = 0$.

    $a^2 = 3$ would make $a = \sqrt{3}$, not rational. So $a^2 = 25$, and with $a > 0$, $a = 5$, $b = -1$.

    Check: $(5 - \sqrt{3})^2 = 25 - 10\sqrt{3} + 3 = 28 - 10\sqrt{3}$. ✓

    So $a - b = 5 - (-1) = 6$. (In other words, $\sqrt{28 - 10\sqrt{3}} = 5 - \sqrt{3}$.)
  check: code

- id: a4
  lvl: adv
  kind: num
  q: |-
    Let $r = \sqrt[3]{2} + \sqrt[3]{4}$. Find the value of $r^3 - 6r$, and use it to decide whether $r$ is rational. (Original problem.)
  ask: Value of r³ − 6r
  ans: 6
  tol: 0.0001
  verify: (()=>{const r=Math.cbrt(2)+Math.cbrt(4);return r**3-6*r})()
  sol: |
    Write $t = \sqrt[3]{2}$, so $t^3 = 2$ and $\sqrt[3]{4} = t^2$. Then $r = t + t^2$ and
    $$r^3 = t^3 + 3t^4 + 3t^5 + t^6.$$
    Using $t^3 = 2$: $t^4 = 2t$, $t^5 = 2t^2$, $t^6 = 4$. So
    $$r^3 = 2 + 6t + 6t^2 + 4 = 6 + 6(t + t^2) = 6 + 6r.$$
    Hence $r^3 - 6r = 6$.

    **Is $r$ rational?** $r$ is a zero of $x^3 - 6x - 6$, a monic polynomial with integer coefficients. By the rational root test, a rational zero would be an integer dividing 6, i.e. one of $\pm 1, \pm 2, \pm 3, \pm 6$. Checking $f(x) = x^3 - 6x - 6$: $f(1) = -11$, $f(-1) = -1$, $f(2) = -10$, $f(-2) = -2$, $f(3) = 3$, $f(-3) = -15$, $f(6) = 174$, $f(-6) = -186$. None is 0, so $r$ is irrational. (Quicker: $r \approx 2.85$ lies between 2 and 3, so it is not an integer.)
  check: code

- id: o1
  lvl: oly
  source: Zeitz, The Art and Craft of Problem Solving · Problem 2.3.18
  kind: text
  q: |-
    True or false and why: If $a$ and $b$ are irrational, then $a^b$ is irrational.
  sol: |
    **False.** Two counterexamples, one clever and one explicit.

    **Non-constructive argument.** Consider $x = \sqrt{2}^{\sqrt{2}}$. Either $x$ is rational or it is irrational.
    - If $x$ is rational, take $a = b = \sqrt{2}$: both irrational, and $a^b = x$ is rational.
    - If $x$ is irrational, take $a = x$ and $b = \sqrt{2}$: both irrational, and
    $$a^b = \left(\sqrt{2}^{\sqrt{2}}\right)^{\sqrt{2}} = \sqrt{2}^{\sqrt{2}\cdot\sqrt{2}} = \sqrt{2}^{\,2} = 2,$$
    which is rational.

    Either way a counterexample exists, although the argument does not tell us which case holds. (In fact $\sqrt{2}^{\sqrt{2}}$ is irrational, by the Gelfond–Schneider theorem, a deep result not proved here.)

    **Explicit counterexample.** Take $a = \sqrt{2}$ and $b = \log_2 9$. Then $a^b = 2^{\frac12 \log_2 9} = 2^{\log_2 3} = 3$, rational. Here $b$ is irrational: if $\log_2 9 = m/n$ with positive integers $m, n$, then $2^m = 9^n = 3^{2n}$, an even number equal to an odd number (or: two different prime recipes), which is impossible.
  check: none

- id: o2
  lvl: oly
  source: Zeitz, The Art and Craft of Problem Solving · Problem 7.1.33 (USAMO 1973)
  kind: proof
  q: |-
    Show that the cube roots of three distinct prime numbers cannot be three terms (not necessarily consecutive) of an arithmetic progression.
  hints: ["If $x, y, z$ are terms of an AP with common difference $d$, then $y - x$ and $z - x$ are integer multiples of $d$. What does that say about $(z - x)/(y - x)$?", "Clear denominators to get $Ax + By = Cz$ with non-zero integers $A, B, C$.", "Cube both sides and replace $Ax + By$ by $Cz$ in the cross term. Conclude that $xyz = \\sqrt[3]{pqr}$ would be rational."]
  sol: |
    Let the primes be $p, q, r$ (distinct) and $x = \sqrt[3]{p}$, $y = \sqrt[3]{q}$, $z = \sqrt[3]{r}$. These are three distinct positive numbers.

    Suppose they are terms of an arithmetic progression $t_k = t_0 + kd$: say $x = t_0 + kd$, $y = t_0 + ld$, $z = t_0 + jd$ with distinct integers $k, l, j$, and $d \ne 0$ since the terms differ. Then
    $$\frac{z - x}{y - x} = \frac{j - k}{l - k} = \frac{m}{n},$$
    with non-zero integers $m = j - k$, $n = l - k$, and $m \ne n$ (as $j \ne l$). So $n(z - x) = m(y - x)$, which rearranges to $nz = my + (n - m)x$. Put $A = n - m$, $B = m$, $C = n$, all non-zero integers:
    $$Ax + By = Cz.$$
    Cube both sides:
    $$A^3 x^3 + B^3 y^3 + 3ABxy\,(Ax + By) = C^3 z^3.$$
    Use $x^3 = p$, $y^3 = q$, $z^3 = r$ and $Ax + By = Cz$:
    $$A^3 p + B^3 q + 3ABC\,xyz = C^3 r \quad\Longrightarrow\quad xyz = \frac{C^3 r - A^3 p - B^3 q}{3ABC}.$$
    The right side is rational (the denominator is non-zero). So $xyz = \sqrt[3]{pqr}$ is rational.

    But $pqr$ is not a perfect cube. If $\sqrt[3]{pqr} = u/v$ with positive integers, then $pqr\,v^3 = u^3$. In $u^3$ the prime $p$ appears a multiple of 3 times; on the left it appears (multiple of 3) $+ 1$ times, because $p$ divides $pqr$ exactly once ($p, q, r$ distinct primes). This contradicts unique factorisation.

    Hence the cube roots of three distinct primes cannot lie in one arithmetic progression. $\blacksquare$
  check: none

- id: o3
  lvl: oly
  kind: num
  q: |-
    What is the smallest positive integer $q$ for which some fraction $\dfrac{p}{q}$ ($p$ a positive integer) satisfies $\left|\dfrac{p}{q} - \sqrt{2}\right| < \dfrac{1}{1000}$? (Original problem.)
  ask: Smallest q
  ans: 29
  tol: 0.01
  verify: (()=>{for(let q=1;q<1000;q++){const p=Math.round(q*Math.SQRT2);if(Math.abs(p/q-Math.SQRT2)<1e-3)return q}return NaN})()
  sol: |
    **Key identity.** For positive integers $p, q$,
    $$\left|\frac{p}{q} - \sqrt{2}\right| = \frac{|p^2 - 2q^2|}{q\,(p + q\sqrt{2})},$$
    and $p^2 - 2q^2$ is a non-zero integer because $\sqrt{2}$ is irrational. Call $N = |p^2 - 2q^2| \ge 1$.

    If the error is below $\frac{1}{1000}$, then $p < q\sqrt{2} + \frac{q}{1000}$, so $p + q\sqrt{2} < q(2\sqrt{2} + 0.001) < 2.83\,q$, and therefore
    $$\text{error} > \frac{N}{2.83\,q^2}.$$

    **No $q \le 18$ works.** Then $2.83\,q^2 \le 2.83 \times 324 < 917$, so the error exceeds $\frac{1}{917} > \frac{1}{1000}$.

    **No $19 \le q \le 28$ works.** Here we need $N \le 2$, since with $N \ge 3$ the error exceeds $\frac{3}{2.83 \times 784} > \frac{3}{2219} > \frac{1}{1000}$.
    - $N = 1$: the solutions of $p^2 - 2q^2 = \pm 1$ are $(1,1), (3,2), (7,5), (17,12), (41,29), \dots$ (each from the last by $p/q \to (p + 2q)/(p + q)$), with no $q$ from 19 to 28.
    - $N = 2$: then $p^2$ is even, so $p = 2s$ and $q^2 - 2s^2 = \mp 1$, so $q$ is a $p$-value of the list above: $1, 3, 7, 17, 41, \dots$, again none from 19 to 28.

    **$q = 29$ works.** $41^2 - 2 \cdot 29^2 = 1681 - 1682 = -1$, so the error of $\frac{41}{29}$ is $\frac{1}{29(41 + 29\sqrt{2})} \approx \frac{1}{2378} \approx 0.00042 < 0.001$.

    So the smallest $q$ is **29**, with $\frac{41}{29} \approx 1.41379$.

    [Note] That the list above contains every solution of $p^2 - 2q^2 = \pm 1$ is a standard fact about Pell equations, quoted here without proof. The answer does not depend on it: for each $q \le 28$ only the integer nearest to $q\sqrt{2}$ can be within $\frac{1}{1000}$, and checking those 28 fractions directly (as the `verify` expression does) confirms that none works.
  check: code

- id: o4
  lvl: oly
  kind: proof
  q: |-
    Prove that $\cos 20^\circ$ is irrational. (You may use $\cos 3\theta = 4\cos^3\theta - 3\cos\theta$.) (Original problem.)
  hints: ["Put $\\theta = 20^\\circ$, so $\\cos 3\\theta = \\tfrac12$. Write the cubic satisfied by $c = \\cos 20^\\circ$.", "Clear fractions and substitute $y = 2c$ to make the cubic monic.", "Apply the rational root test to the monic cubic in $y$."]
  sol: |
    Let $c = \cos 20^\circ$. With $\theta = 20^\circ$, $\cos 3\theta = \cos 60^\circ = \tfrac12$, so
    $$4c^3 - 3c = \tfrac12 \quad\Longrightarrow\quad 8c^3 - 6c - 1 = 0.$$
    Put $y = 2c$. Then $8c^3 = y^3$ and $6c = 3y$, so
    $$y^3 - 3y - 1 = 0.$$
    This is monic with integer coefficients. By the rational root test, a rational zero would be an integer dividing 1, so $y = \pm 1$. But $1 - 3 - 1 = -3 \ne 0$ and $-1 + 3 - 1 = 1 \ne 0$. So $y = 2\cos 20^\circ$ is irrational.

    If $c$ were rational, $y = 2c$ would be rational too. Hence $\cos 20^\circ$ is irrational. $\blacksquare$

    (The same equation shows why a $20^\circ$ angle cannot be constructed with straightedge and compass, so $60^\circ$ cannot be trisected that way; that deeper fact needs field theory and is only mentioned here.)
  check: none
