- id: f2
  lvl: found
  kind: text
  q: |-
    State whether each number is rational or irrational, with a reason:
    (i) $\sqrt{81}$   (ii) $0.1010010001\ldots$ (each block has one more 0)   (iii) $\dfrac{22}{7}$   (iv) $\sqrt{12}$
    (Original problem.)
  sol: |
    (i) $\sqrt{81} = 9 = 9/1$: rational.

    (ii) The decimal neither terminates nor repeats (the gaps between the 1s keep growing): irrational.

    (iii) $22/7$ is a quotient of integers: rational. (It is only an approximation to $\pi$, which is irrational.)

    (iv) $\sqrt{12} = 2\sqrt{3}$, and $\sqrt{3}$ is irrational, so $2\sqrt{3}$ is irrational (a non-zero rational times an irrational).
  check: none

- id: f3
  lvl: found
  kind: num
  q: Find the value of $(\sqrt{3} + \sqrt{2})(\sqrt{3} - \sqrt{2})$. Is it rational or irrational? (Original problem.)
  ask: Value
  ans: 1
  tol: 0.0001
  verify: (Math.sqrt(3)+Math.sqrt(2))*(Math.sqrt(3)-Math.sqrt(2))
  sol: |
    Using $(x + y)(x - y) = x^2 - y^2$: $(\sqrt{3})^2 - (\sqrt{2})^2 = 3 - 2 = 1$, which is rational. So the product of two irrational numbers ($\sqrt{3} + \sqrt{2}$ and $\sqrt{3} - \sqrt{2}$) can be rational.
  check: both

- id: b1
  lvl: board
  kind: proof
  q: Prove that $\sqrt{7}$ is irrational. (Original problem.)
  hints: ["Assume $\\sqrt{7} = a/b$ with $a, b$ coprime.", "Show $7 \\mid a^2$, then $7 \\mid a$ by Theorem 1.2; write $a = 7c$.", "Then $7 \\mid b$ too, contradicting coprimality."]
  sol: |
    Assume $\sqrt{7} = a/b$ with $a, b$ coprime integers, $b \ne 0$. Squaring, $7b^2 = a^2$, so 7 divides $a^2$ and, by Theorem 1.2, 7 divides $a$. Put $a = 7c$: $7b^2 = 49c^2$, so $b^2 = 7c^2$, and 7 divides $b^2$, hence $b$. So 7 is a common factor of $a$ and $b$, contradicting that they are coprime. Hence $\sqrt{7}$ is irrational. $\blacksquare$
