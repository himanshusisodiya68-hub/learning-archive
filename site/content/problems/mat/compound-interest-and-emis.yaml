# Maths in life · Compound interest and EMIs: original problems (no NCERT chapter is mapped to this leaf).
# All rates and amounts are made up for practice ("suppose the rate is ..."); none is a claim about any real bank, scheme or RBI rate.

- id: f1
  lvl: found
  kind: num
  q: Suppose a bank pays simple interest at 6% per year. Meera deposits ₹20,000 for 3 years. How much interest does she earn? (Original problem.)
  ask: Simple interest
  unit: ₹
  ans: 3600
  tol: 0.5
  verify: 20000*0.06*3
  sol: |
    **Simple interest** means the interest is always worked out on the original amount only. Each year you earn the same $6\%$ of ₹20,000.

    One year: $20000 \times 0.06 = \text{₹}1200$. Three years: $3 \times 1200 = \text{₹}3600$.

    In symbols, $SI = \dfrac{P \times r \times t}{100}$ with $r$ in percent, so $SI = \dfrac{20000 \times 6 \times 3}{100} = 3600$.
  check: both

- id: f2
  lvl: found
  kind: num
  q: Suppose a bank pays 8% per year, compounded annually. Ravi deposits ₹10,000 and leaves it untouched for 3 years. Find the amount he gets at the end. (Original problem.)
  ask: Amount after 3 years
  unit: ₹
  ans: 12597.12
  tol: 0.05
  verify: 10000*Math.pow(1.08,3)
  sol: |
    With **compound interest**, each year's interest is added to the money, so next year's interest is earned on the bigger amount: interest on interest.

    Each year the amount is multiplied by $1.08$. After 3 years: $A = P\left(1 + \dfrac{r}{100}\right)^t = 10000 \times 1.08^3$.

    Step by step: $10000 \to 10800 \to 11664 \to 12597.12$.

    Compare with simple interest: $10000 + 3 \times 800 = \text{₹}12400$. The extra ₹197.12 is interest earned on earlier interest.
  check: both

- id: f3
  lvl: found
  kind: num
  q: Suppose a bank offers 10% per year, compounded half-yearly (that is, 5% is added every six months). Find the compound interest on ₹50,000 for 1 year. (Original problem.)
  ask: Compound interest
  unit: ₹
  ans: 5125
  tol: 0.5
  verify: 50000*Math.pow(1.05,2)-50000
  sol: |
    In one year there are two compounding periods. The rate per period is half of $10\%$, which is $5\%$. So the number of periods is $n = 2$ and the amount is
    $$A = 50000 \times 1.05^2 = 50000 \times 1.1025 = ₹55125.$$

    Interest $= 55125 - 50000 = \text{₹}5125$.

    If the same $10\%$ were compounded only once a year, the interest would be ₹5000. The extra ₹125 comes from adding the first half-year's interest early, so that it too earns interest.
  check: both

- id: f4
  lvl: found
  kind: num
  q: A card company says "12% per year, charged 1% every month on the outstanding amount". If nothing is paid for a full year, by what percentage does the amount owed actually grow? (Give the effective annual rate, to two decimals.) (Original problem.)
  ask: Effective annual rate
  unit: "%"
  ans: 12.68
  tol: 0.01
  verify: (Math.pow(1.01,12)-1)*100
  sol: |
    Charging $1\%$ a month means multiplying the debt by $1.01$ twelve times, so after a year it is multiplied by $1.01^{12}$.

    $1.01^{12} \approx 1.126825$, so the debt grows by about $12.68\%$, not $12\%$.

    This is the **effective annual rate (EAR)**: the single yearly rate that gives the same result as the month-by-month compounding. The quoted $12\%$ is the **nominal** rate. The more often interest is added, the larger the gap between the two.
  check: both

- id: b1
  lvl: board
  kind: num
  q: |-
    **Case study.** Mrs Sharma puts her savings in a fixed deposit. Suppose the bank pays 7% per year. In the same year suppose prices rise by 5% (inflation), so a basket of groceries that cost ₹100 at the start costs ₹105 at the end.

    The real return is the percentage by which her money can buy more groceries. Find it, to two decimals. (Original problem.)
  ask: Real return
  unit: "%"
  ans: 1.9
  tol: 0.01
  verify: (1.07/1.05-1)*100
  sol: |
    Each ₹100 grows to ₹107 in the bank. But the groceries now cost $1.05$ times as much. So in terms of groceries, her money has grown by the factor
    $$\frac{1.07}{1.05} \approx 1.0190.$$

    The real return is about $1.90\%$.

    The tempting shortcut $7 - 5 = 2\%$ is close, but it is not exact: growth factors **divide**, they do not subtract. The shortcut works only when both rates are small. (The exact value is $1.9048\%$, which is why the tolerance accepts $1.90$.)

    **Lesson:** a deposit rate means little until you compare it with inflation. If inflation were 8%, the real return would be negative: her money would be growing but still losing buying power.
  check: both

- id: b2
  lvl: board
  kind: num
  q: |-
    **Case study.** Rohan takes a home loan of ₹5,00,000 at 9% per year, with interest charged every month on the outstanding balance. The bank tells him the EMI is ₹10,380 (rounded to the nearest ten).

    How much of his **first** EMI repays the loan itself (the principal part)? (Original problem.)
  ask: Principal repaid in first EMI
  unit: ₹
  ans: 6630
  tol: 1
  verify: 10380-500000*0.09/12
  sol: |
    An EMI (equated monthly instalment) is a fixed payment, but its two parts change every month.

    **Interest part.** Interest for the first month is charged on the whole balance: $500000 \times \dfrac{9}{100} \times \dfrac{1}{12} = \text{₹}3750$.

    **Principal part.** Whatever is left of the EMI repays the loan: $10380 - 3750 = \text{₹}6630$.

    So only about $64\%$ of the first EMI reduces the loan; about $36\%$ is interest. Next month the balance is smaller, so the interest part is a little smaller and the principal part a little bigger. In the last months the EMI is almost all principal. This is why paying a loan off early saves so much: the early EMIs are the most interest-heavy.
  check: both

- id: b3
  lvl: board
  kind: num
  q: |-
    **Case study.** Anita's credit-card bill is ₹30,000. The statement says "Minimum amount due: ₹1,500". Suppose the card charges 3% per month on whatever is unpaid at the end of the month. Anita pays only the minimum and spends nothing more on the card.

    What does she owe one month later? (Original problem.)
  ask: Amount owed after one month
  unit: ₹
  ans: 29355
  tol: 0.5
  verify: (30000-1500)*1.03
  sol: |
    After paying ₹1,500 she still owes $30000 - 1500 = \text{₹}28500$.

    Interest of $3\%$ is charged on this: $28500 \times 1.03 = \text{₹}29355$.

    **The trap.** She paid ₹1,500 but the debt fell by only ₹645, because ₹855 was interest. Over the year, $3\%$ a month compounds to $1.03^{12} - 1 \approx 42.6\%$ per year. If the minimum payment is only about as large as the monthly interest plus a sliver, the debt shrinks very slowly while the card looks "under control". The minimum payment keeps you in good standing; it does not make the debt go away.
  check: both

- id: b4
  lvl: board
  kind: mcq
  q: |-
    **Assertion (A):** For the same loan amount and the same interest rate, a longer repayment period gives a smaller EMI but a larger total interest paid.
    **Reason (R):** Interest is charged every month on the outstanding principal, so a longer loan keeps some principal outstanding for more months.

    Choose the correct option. (Original problem.)
  opts: ["Both A and R are true, and R is the correct explanation of A.", "Both A and R are true, but R is not the correct explanation of A.", "A is true but R is false.", "A is false but R is true."]
  ans: 0
  sol: |
    Take ₹1,00,000 at $12\%$ per year. Over 12 months the EMI is about ₹8,885 and the total paid is about ₹1,06,619. Over 24 months the EMI is about ₹4,707 and the total paid is about ₹1,12,976. The EMI is smaller (A is true) but the total interest is larger (about ₹12,976 against ₹6,619).

    Why? Each month's interest is $1\%$ of the principal still unpaid. A longer loan repays principal more slowly, so more rupees sit unpaid for more months, and each of those rupee-months is charged interest. So R is true and it explains A. Option 1.

    (The two sets of figures above are [Inference] hand-computed from the EMI formula; the rate and amounts are chosen only for practice.)
  check: none

- id: m1
  lvl: main
  kind: num
  q: The difference between the compound interest (compounded yearly) and the simple interest on a certain sum for 2 years at 8% per year is ₹64. Find the sum. (Original problem.)
  ask: The sum
  unit: ₹
  ans: 10000
  tol: 0.5
  verify: 64/Math.pow(0.08,2)
  sol: |
    Let the sum be $P$ and the rate $r = 0.08$.

    Simple interest for 2 years: $2Pr$.

    Compound interest for 2 years: $P(1+r)^2 - P = 2Pr + Pr^2$.

    The difference is exactly $Pr^2$: the interest earned in year 2 on the year-1 interest. So
    $$P \times 0.08^2 = 64 \implies P = \frac{64}{0.0064} = 10000.$$

    The sum is ₹10,000. (Check: $SI = 1600$, $CI = 1664$, difference $64$.)
  check: both

- id: m2
  lvl: main
  kind: num
  q: A sum amounts to ₹6,050 in 2 years and to ₹6,655 in 3 years at compound interest, compounded yearly. Find the rate of interest per year (in percent). (Original problem.)
  ask: Rate
  unit: "%"
  ans: 10
  tol: 0.001
  verify: (6655/6050-1)*100
  sol: |
    Each year the amount is multiplied by the same factor $1 + r$. So the amount at the end of year 3 divided by the amount at the end of year 2 is exactly that factor:
    $$1 + r = \frac{6655}{6050} = 1.1.$$

    So $r = 10\%$. The money earned in year 3 is $6655 - 6050 = \text{₹}605$, which is $10\%$ of ₹6,050. You do not need the principal at all.

    (If you want it: $P \times 1.1^2 = 6050$ gives $P = \text{₹}5000$.)
  check: both

- id: m3
  lvl: main
  kind: num
  q: |-
    A loan of ₹1,00,000 is repaid in 12 equal monthly instalments (EMIs), the first paid one month after the loan. Suppose interest is 12% per year, charged at 1% per month on the outstanding balance. Find the EMI, to the nearest rupee. (Original problem.)

    Use $1.01^{12} \approx 1.126825$.
  ask: EMI
  unit: ₹
  ans: 8885
  tol: 1
  verify: 100000*0.01*Math.pow(1.01,12)/(Math.pow(1.01,12)-1)
  sol: |
    Let the loan be $P$, the monthly rate $r = 0.01$, the number of EMIs $n$, and the EMI $E$.

    **Idea.** Today's loan must equal the worth today of all the EMIs. Money paid $k$ months from now is worth $E/(1+r)^k$ today, so
    $$P = E\left[\frac{1}{1+r} + \frac{1}{(1+r)^2} + \cdots + \frac{1}{(1+r)^n}\right].$$

    The bracket is a geometric series with first term $\dfrac{1}{1+r}$ and ratio $\dfrac{1}{1+r}$. Summing it gives $\dfrac{1 - (1+r)^{-n}}{r}$. Solve for $E$:
    $$E = \frac{P\,r\,(1+r)^n}{(1+r)^n - 1}.$$

    **Numbers.** $E = \dfrac{100000 \times 0.01 \times 1.126825}{0.126825} = \dfrac{1126.825}{0.126825} \approx 8884.88$.

    So the EMI is about ₹8,885. Total paid $= 12 \times 8884.88 \approx \text{₹}1,06,619$, so total interest is about ₹6,619: less than the ₹12,000 a naive "$12\%$ of ₹1,00,000" gives, because the balance shrinks each month.
  check: both

- id: m4
  lvl: main
  kind: num
  q: |-
    A loan of ₹2,00,000 is repaid in 24 equal monthly EMIs at 1% per month on the outstanding balance, the first EMI paid one month after the loan. How much of the loan is still unpaid (the outstanding principal) immediately after the 12th EMI? Give the answer to the nearest ₹100. (Original problem.)
  ask: Outstanding principal after 12 EMIs
  unit: ₹
  ans: 105963
  tol: 50
  verify: (200000*0.01*Math.pow(1.01,24)/(Math.pow(1.01,24)-1))*(1-Math.pow(1.01,-12))/0.01
  sol: |
    **Step 1: the EMI.** Using $E = \dfrac{P r (1+r)^n}{(1+r)^n - 1}$ with $P = 200000$, $r = 0.01$, $n = 24$ and $1.01^{24} \approx 1.269735$:
    $$E = \frac{2000 \times 1.269735}{0.269735} \approx ₹9414.69.$$

    **Step 2: a shortcut for the balance.** Right after the 12th EMI, the loan still unpaid must equal the worth today of the 12 EMIs yet to come. That is the same argument as for the original loan, with $n = 12$:
    $$B = E \cdot \frac{1 - 1.01^{-12}}{0.01}.$$

    With $1.01^{-12} \approx 0.887449$, the fraction is $\dfrac{0.112551}{0.01} = 11.2551$, so
    $$B \approx 9414.69 \times 11.2551 \approx ₹1{,}05{,}963.$$

    **What this shows.** Half the EMIs have been paid ($12 \times 9414.69 \approx \text{₹}1{,}12{,}976$), yet more than half the loan (₹1,05,963 of ₹2,00,000) is still owed: only about ₹94,037 of principal has been repaid. Early EMIs are mostly interest.
  check: both

- id: a1
  lvl: adv
  kind: num
  q: |-
    Suppose a bank lends ₹10,00,000 at 9.6% per year, charged at 0.8% per month on the outstanding balance. The borrower can afford ₹15,000 a month. Every EMI is ₹15,000 except the last, which is just enough to clear what remains. How many monthly payments are needed in all? (Original problem.)
  ask: Number of monthly payments
  ans: 96
  tol: 0
  verify: Math.ceil(-Math.log(1-1e6*0.008/15000)/Math.log(1.008))
  sol: |
    The loan equals the present value of the payments. If all $n$ payments were ₹15,000,
    $$P = E\,\frac{1-(1+r)^{-n}}{r} \implies (1+r)^{-n} = 1 - \frac{Pr}{E}.$$

    Here $Pr = 10^6 \times 0.008 = \text{₹}8000$ and $E = 15000$, so $1 - Pr/E = 1 - 0.5\overline{3} = 0.4\overline{6}$. Taking logarithms,
    $$n = \frac{-\ln(0.46667)}{\ln 1.008} = \frac{0.76214}{0.0079681} \approx 95.65.$$

    So 95 full EMIs are not enough and 96 are too many: the 96th payment is a smaller one. **Check:** after 95 EMIs the balance is $10^6 \times 1.008^{95} - 15000 \times \dfrac{1.008^{95}-1}{0.008}$. With $1.008^{95} \approx 2.13182$ this is about ₹9,657, so the 96th payment is $9657 \times 1.008 \approx \text{₹}9{,}735$.

    **Total: 96 payments.** Notice how sensitive $n$ is to $E$: the first month's interest (₹8,000) eats more than half of each EMI. At ₹8,000 a month the loan would never end.
  check: both

- id: a2
  lvl: adv
  kind: num
  q: |-
    A home loan is repaid in 240 equal monthly EMIs at 0.75% per month on the outstanding balance. Number the EMIs 1, 2, ..., 240. Find the number of the first EMI in which the part that repays principal is larger than the part that pays interest. Show that the answer does not depend on the amount borrowed. (Original problem.)
  ask: EMI number
  ans: 149
  tol: 0
  verify: 241-Math.floor(Math.log(2)/Math.log(1.0075))
  sol: |
    Just before EMI $k$, the balance equals the present value of the $n-k+1$ EMIs still to be paid:
    $$B_{k-1} = E\,\frac{1-(1+r)^{-(n-k+1)}}{r}.$$
    The interest part of EMI $k$ is $rB_{k-1} = E\left[1-(1+r)^{-(n-k+1)}\right]$, so the principal part is $E(1+r)^{-(n-k+1)}$.

    Principal exceeds interest when the principal part exceeds $E/2$:
    $$(1+r)^{-(n-k+1)} > \tfrac12 \iff n-k+1 < \frac{\ln 2}{\ln(1+r)} = \frac{0.693147}{0.0074720} \approx 92.77.$$

    So we need $n - k + 1 \le 92$, that is $k \ge 240 + 1 - 92 = 149$.

    **EMI number 149** (a little over 12 years into a 20-year loan). Neither $P$ nor $E$ appears in the condition, only $r$ and $n$, so the crossover is the same for a ₹5 lakh loan and a ₹5 crore loan. In fact, the crossover always comes about $\ln 2/r$ months **before the end**, about 92.8 months here, however long the loan.
  check: both

- id: a3
  lvl: adv
  kind: num
  q: |-
    Suppose a loan of ₹30,00,000 is taken at 0.75% per month for 240 monthly EMIs. Right after the 60th EMI, the borrower prepays a lump sum of ₹5,00,000 and keeps paying the same EMI until the loan is cleared. By how many months does the loan end earlier? Give the answer to the nearest whole month. (Original problem.)
  ask: Months saved
  unit: months
  ans: 57
  tol: 0.5
  verify: 180-(-Math.log(1-((3e6*0.0075/(1-Math.pow(1.0075,-240)))*(1-Math.pow(1.0075,-180))/0.0075-5e5)*0.0075/(3e6*0.0075/(1-Math.pow(1.0075,-240))))/Math.log(1.0075))
  sol: |
    **EMI.** $E = \dfrac{Pr}{1-(1+r)^{-n}} = \dfrac{22500}{1 - 1.0075^{-240}}$. With $1.0075^{240} \approx 6.00915$, $E \approx \text{₹}26{,}991.78$.

    **Balance after 60 EMIs.** It is the present value of the 180 EMIs still to come:
    $$B_{60} = E\,\frac{1 - 1.0075^{-180}}{0.0075} \approx 26991.78 \times 98.593 \approx ₹26{,}61{,}211.$$
    So five years of EMIs (about ₹16.2 lakh paid) have cut the loan by only about ₹3.4 lakh.

    **After the prepayment** the balance is $B' \approx \text{₹}21{,}61{,}211$. With the same EMI, the number of months $m$ left satisfies $(1+r)^{-m} = 1 - B'r/E$:
    $$1 - \frac{2161211 \times 0.0075}{26991.78} = 1 - 0.60052 = 0.39948, \qquad m = \frac{-\ln 0.39948}{\ln 1.0075} \approx \frac{0.91759}{0.0074720} \approx 122.8.$$

    The loan had 180 months to go; now it has about 122.8. **About 57 months (nearly 5 years) saved.** The interest saved is roughly $26992 \times 57.2 - 500000 \approx \text{₹}10.4$ lakh, about twice the prepayment, because the prepayment removes principal that would otherwise have been charged interest for the most interest-heavy years.
  check: both

- id: a4
  lvl: adv
  source: Zeitz, The Art and Craft of Problem Solving · Problem 2.3.28
  kind: proof
  q: "Prove the formula for the sum of a geometric series: a^(n−1) + a^(n−2) + ... + 1 = (a^n − 1)/(a − 1)."
  hints: ["The formula needs a ≠ 1. Check it for n = 1 first.", "Assume it for n and add the next term a^n to both sides.", "Put the right side over the common denominator a − 1."]
  sol: |
    (Our own solution.) Throughout, $a \neq 1$ so that the right side makes sense. Let $S_n = a^{n-1} + a^{n-2} + \cdots + a + 1$.

    **Base case**, $n = 1$: the left side is $1$ and the right side is $\dfrac{a - 1}{a - 1} = 1$.

    **Inductive step.** Suppose $S_n = \dfrac{a^n - 1}{a - 1}$ for some $n \ge 1$. Then $S_{n+1} = a^n + S_n$, so
    $$S_{n+1} = a^n + \frac{a^n - 1}{a - 1} = \frac{a^{n}(a-1) + a^n - 1}{a - 1} = \frac{a^{n+1} - 1}{a - 1}.$$
    That is the formula for $n + 1$, so by induction it holds for every positive integer $n$.

    **A one-line check without induction:** $(a-1)S_n = (a^n + a^{n-1} + \cdots + a) - (a^{n-1} + \cdots + 1) = a^n - 1$; everything else cancels in pairs.

    **Why it matters here.** With $a = 1 + r$, the penultimate-step argument for a loan gives $B_n = P(1+r)^n - E\,S_n$, and $S_n = \dfrac{(1+r)^n - 1}{r}$ by this formula. Setting $B_n = 0$ is exactly the EMI formula.
  check: none

- id: o1
  lvl: oly
  source: Zeitz, The Art and Craft of Problem Solving · Problem 2.3.33
  kind: proof
  q: "Prove Bernoulli's Inequality, which states that if x > −1, x ≠ 0 and n is a positive integer greater than 1, then (1 + x)^n > 1 + nx."
  hints: ["Start at n = 2 and expand.", "Multiply the inequality for n by (1 + x). Why is it safe to multiply both sides by this number?", "What is the leftover term, and what does it mean for money?"]
  sol: |
    (Our own solution.) Induction on $n \ge 2$.

    **Base case**, $n = 2$: $(1+x)^2 = 1 + 2x + x^2 > 1 + 2x$, because $x \neq 0$ makes $x^2 > 0$.

    **Inductive step.** Suppose $(1+x)^n > 1 + nx$ for some $n \ge 2$. Since $x > -1$, the number $1 + x$ is **positive**, so multiplying both sides by it keeps the direction of the inequality:
    $$(1+x)^{n+1} > (1 + nx)(1 + x) = 1 + (n+1)x + nx^2 > 1 + (n+1)x,$$
    the last step because $nx^2 > 0$. This is the statement for $n+1$, which completes the induction.

    **Where each hypothesis is used.** $x \neq 0$ makes the inequality strict (at $x = 0$ both sides equal 1). $x > -1$ is what lets us multiply by $1 + x$; without it the claim can fail: with $x = -3$, $n = 3$, the left side is $(-2)^3 = -8$ and the right side is $1 - 9 = -8$, equal, not greater.

    **Meaning for money.** With $x = r > 0$, $(1+r)^n$ is the compound-interest factor and $1 + nr$ the simple-interest factor, so compound interest beats simple interest for every $n \ge 2$. The discarded term $nx^2$ at each step is precisely interest earned on earlier interest. For $-1 < x < 0$ (a loss of $|x|$ per period) the inequality says repeated losses of $|x|$ leave you **more** than $n$ simple deductions of $|x|$ would, because each loss is taken from a shrinking amount: the same reason inflation erodes cash a little slower than "6% times the years".
  check: none

- id: o2
  lvl: oly
  kind: num
  q: |-
    Suppose a credit card charges interest at a rate $i$ per month on whatever is unpaid, and its "minimum amount due" is a fraction $m$ of the statement balance. A cardholder with balance $B_0$ stops using the card and, every month, pays exactly the minimum due on that month's statement; the rest is then charged interest and becomes next month's statement balance.

    (a) Find, in terms of $m$, $i$ and $B_0$, the total amount paid if this goes on for ever, and the condition on $m$ for the total to be finite.

    (b) Evaluate the total for $B_0 = \text{₹}30{,}000$, $m = 5\%$, $i = 3\%$. (Original problem.)
  ask: Total paid in (b)
  unit: ₹
  ans: 69767.44
  tol: 1
  verify: 0.05*30000/(1-0.95*1.03)
  sol: |
    **Recurrence.** On statement $k$ the balance is $B_k$. The payment is $mB_k$; what remains, $(1-m)B_k$, is charged interest, so
    $$B_{k+1} = (1-m)(1+i)\,B_k = qB_k, \qquad q = (1-m)(1+i).$$
    Hence $B_k = q^k B_0$: a geometric progression.

    **(a)** The payments are $mB_0, mqB_0, mq^2B_0, \ldots$, a geometric series. It converges exactly when $0 \le q < 1$, and then
    $$T = \frac{mB_0}{1-q} = \frac{mB_0}{m - i(1-m)}.$$
    The condition $q < 1$ is $(1-m)(1+i) < 1$, that is, $m > \dfrac{i}{1+i}$. If the minimum is at most $i/(1+i)$ of the balance, the debt never shrinks and the payments go on growing or stay level for ever. Note also $T/B_0 = \dfrac{m}{m - i(1-m)} > 1$ whenever $i > 0$: the closer $m$ is to the threshold, the larger the multiple.

    **(b)** $q = 0.95 \times 1.03 = 0.9785$, so
    $$T = \frac{0.05 \times 30000}{1 - 0.9785} = \frac{1500}{0.0215} \approx ₹69{,}767.44.$$
    The cardholder repays about 2.33 times the debt. The balance falls by only 2.15% a month, so it takes $\ln 30/(-\ln 0.9785) \approx 156$ months (13 years) just to fall below ₹1,000.

    **Contrast.** Paying a **fixed** ₹1,500 each month (the first minimum, never reduced) clears the debt in $\ln 2.5/\ln 1.03 \approx 31$ months for about ₹46,500. The minimum-payment rule is gentle precisely because it shrinks with the balance, and that is what makes it so expensive. (All rates here are made up; real cards also set a rupee floor on the minimum. [Inference])
  check: both

- id: o3
  lvl: oly
  kind: num
  q: |-
    Model a loan continuously. A borrower owes $B(t)$ rupees at time $t$ years. Interest accrues continuously at rate $R$ per year on the balance, and the borrower repays continuously at a constant rate of $p$ rupees per year, so that $\dfrac{dB}{dt} = RB - p$ with $B(0) = P$.

    (a) Show that the loan is cleared at time $T$ exactly when $p = \dfrac{RP}{1-e^{-RT}}$, and hence that the total repaid divided by $P$ depends only on the product $x = RT$.

    (b) Suppose $P = \text{₹}20$ lakh, $R = 0.08$ per year and $T = 25$ years. Find the total repaid, to the nearest hundred rupees. (Original problem.)
  ask: Total repaid in (b)
