  sol: |
    **(a)** The equation has the constant solution $B^* = p/R$ (interest equals payment). Let $u = B - p/R$. Then $du/dt = dB/dt = RB - p = Ru$, so $u = u(0)e^{Rt}$ and
    $$B(t) = \frac pR + \left(P - \frac pR\right)e^{Rt}.$$
    Setting $B(T) = 0$: $\left(\dfrac pR - P\right)e^{RT} = \dfrac pR$, so $\dfrac pR\left(1 - e^{-RT}\right) = P$, that is
    $$p = \frac{RP}{1 - e^{-RT}}.$$
    The total repaid is $pT$, so
    $$\frac{pT}{P} = \frac{RT}{1 - e^{-RT}} = \frac{x}{1-e^{-x}}, \qquad x = RT.$$
    Only the dimensionless product $RT$ appears. (This had to happen: $R$ has units of 1/year, so $RT$ is the only pure number that can be built from $R$ and $T$.) Note $p > RP$ always, matching the discrete fact that an EMI must beat one period's interest.

    **(b)** $x = 0.08 \times 25 = 2$, $e^{-2} \approx 0.135335$, so
    $$\frac{pT}{P} = \frac{2}{0.864665} \approx 2.31304, \qquad pT \approx 20{,}00{,}000 \times 2.31304 \approx ₹46{,}26{,}071.$$
    To the nearest hundred, **about ₹46,26,100**. The payment rate is $p \approx \text{₹}1{,}85{,}043$ a year, about ₹15,420 a month. A monthly EMI loan at $0.08/12$ per month for 300 months would give nearly the same total, because monthly steps are fine compared with the 12.5-year time scale $1/R$.

    **Limits as a check.** For small $x$, $\dfrac{x}{1-e^{-x}} \approx 1 + \dfrac x2$: on average you owe half the loan over the term. For large $x$ it tends to $x$: you pay interest on almost the whole loan for the whole term, so $p \to RP$, the perpetuity.
