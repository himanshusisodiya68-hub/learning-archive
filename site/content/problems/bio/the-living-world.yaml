- id: b1
  lvl: board
  kind: text
  q: |-
    (3 marks) What is binomial nomenclature? Who introduced it? Write the rules for writing a scientific name, with the example of mango. (Original problem.)
  sol: |
    **Binomial nomenclature** is the system of naming an organism with two components, the generic name (genus) and the specific epithet. It was given by **Carolus Linnaeus**. (1 mark)

    **Rules** (any four for 2 marks): (i) names are in Latin or Latinised and written in italics; (ii) the first word is the genus, the second the specific epithet; (iii) when handwritten, the two words are separately underlined, and printed in italics; (iv) the genus starts with a capital letter, the epithet with a small letter; (v) the author's name follows the epithet, abbreviated.

    Example: *Mangifera indica* Linn. (genus *Mangifera*, epithet *indica*, described first by Linnaeus). Marks: definition and Linnaeus, rules, and a correct example.
  check: none

- id: b2
  lvl: board
  kind: text
  q: |-
    (3 marks) Distinguish between taxonomy and systematics, and define a taxon. (Original problem.)
  sol: |
    **Taxonomy** is the process of classifying organisms into taxa; characterisation, identification, classification and nomenclature are basic to it. (1 mark)

    **Systematics** is the study of the arrangement and relationships of organisms; the word comes from the Latin *systema*. Its scope now includes identification, nomenclature and classification, and it takes evolutionary relationships into account. (1 mark)

    **Taxon**: a group of organisms at any rank in the hierarchy, a unit of classification, for example dogs, mammals or animals. (1 mark)
  check: none

