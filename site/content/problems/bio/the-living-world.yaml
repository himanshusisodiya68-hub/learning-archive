- id: ncert11-ex-1-6
  lvl: ncert-ex
  num: "XI 1 · Q6"
  source: NCERT XI Biology · Ch 1 · Exercise Q6
  kind: text
  q: |-
    Define a taxon. Give some examples of taxa at different hierarchical levels.
  sol: |
    A **taxon** (plural **taxa**) is a group of organisms of any rank in the classification, a unit of classification; it is a convenient category based on characters the members share. Taxa exist at different hierarchical levels, for example: *Mangifera indica* (a species), *Panthera* (a genus), Felidae (a family), Carnivora (an order), Mammalia (a class), Chordata (a phylum), Animalia (a kingdom). In plants: Solanaceae (family), Angiospermae (division), Plantae (kingdom). Everyday groups such as dogs, cats, mammals and animals are taxa at different levels: a dog is a mammal and mammals are animals.
  check: none

