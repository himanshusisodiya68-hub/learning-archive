- id: ncert11-ex-1-8
  lvl: ncert-ex
  num: "XI 1 · Q8"
  source: NCERT XI Biology · Ch 1 · Exercise Q8
  kind: text
  q: |-
    Try to collect all the currently accepted meanings for the word ‘species’. Discuss with your teacher the meaning of species in case of higher plants and animals on one hand, and bacteria on the other hand.
  sol: |
    [Unverified in part: the definitions beyond NCERT are from general biology.] Meanings: (1) NCERT §1.2.1: a group of individual organisms with fundamental similarities, distinguishable from closely related species by clear morphological differences (the morphological species). (2) The biological species concept, which NCERT credits to Ernst Mayr: a group of individuals that can interbreed in nature and produce fertile offspring and are isolated from other such groups. (3) Species is the lowest taxonomic category in both plants and animals. (4) Genetic meaning: a group whose members share a common gene pool and are genetically distinct from other groups.

    **Higher plants and animals:** a species is usually recognised by structure and by the ability to interbreed (a mango flower cannot normally breed with a wheat plant; a lion and a tiger are distinct species of *Panthera*). **Bacteria:** most reproduce asexually by division, with no mating, so the interbreeding test cannot be used. Bacterial species are defined by shared structure, biochemical features and DNA similarity instead, and the boundaries are less sharp. This is one reason the species concept is still discussed.
  check: none

- id: ncert11-ex-1-9
  lvl: ncert-ex
  num: "XI 1 · Q9"
  source: NCERT XI Biology · Ch 1 · Exercise Q9
  kind: text
  q: |-
    Define and understand the following terms:
    (i) Phylum (ii) Class (iii) Family (iv) Order (v) Genus
  sol: |
    **(i) Phylum:** the category above class; it groups related classes with common features. Fishes, amphibians, reptiles, birds and mammals form the phylum Chordata (notochord and dorsal hollow neural system). In plants the same rank is called a division.
    **(ii) Class:** the category above order; it groups related orders. The order Primata (monkey, gorilla, gibbon) and the order Carnivora (tiger, cat, dog) both belong to the class Mammalia.
    **(iii) Family:** a group of related genera with fewer similarities than a genus. Plants are placed in families by both vegetative and reproductive features: *Solanum*, *Petunia* and *Datura* are in Solanaceae. *Panthera* and *Felis* are in Felidae.
    **(iv) Order:** an assemblage of related families with a few similar characters, identified from aggregates of characters. The families Felidae and Canidae belong to the order Carnivora.
    **(v) Genus:** a group of closely related species with more characters in common than species of other genera. Potato (*S. tuberosum*) and brinjal (*S. melongena*) are species of *Solanum*; lion, tiger and leopard are species of *Panthera*.
  check: none

- id: ncert11-ex-1-10
  lvl: ncert-ex
  num: "XI 1 · Q10"
  source: NCERT XI Biology · Ch 1 · Exercise Q10
  kind: text
  q: |-
    Illustrate the taxonomical hierarchy with suitable examples of a plant and an animal.
  sol: |
    The hierarchy, from the broadest to the narrowest category, is kingdom, phylum (division in plants), class, order, family, genus, species. As we go down, the members share more characters.

    | Category | Man (animal) | Mango (plant) |
    |---|---|---|
    | Kingdom | Animalia | Plantae |
    | Phylum / Division | Chordata | Angiospermae |
    | Class | Mammalia | Dicotyledonae |
    | Order | Primata | Sapindales |
    | Family | Hominidae | Anacardiaceae |
    | Genus | *Homo* | *Mangifera* |
    | Species | *Homo sapiens* | *Mangifera indica* |

    Table 1.1 of NCERT gives the genus to phylum/division entries; the kingdoms (Animalia and Plantae) are from the text of §1.2.7. Another animal example: tiger, *Panthera tigris*, family Felidae, order Carnivora, class Mammalia, phylum Chordata, kingdom Animalia.
  check: none

