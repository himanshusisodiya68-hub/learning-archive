# The living world. NCERT questions copied word for word from NCERT Biology Class XI (reprint 2026-27) Ch 1 (Exercises 1 to 10) and NCERT Science Class IX Ch 12 "Patterns in Life: Diversity and Classification" (Think It Over, Pause and Ponder, Activity 12.2 and Revise, Reflect, Refine Q3, Q6, Q12; the other Class IX questions belong to biological-classification). No NCERT answer key exists for Biology: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert9-it-12-t1
  lvl: ncert-intext
  num: "IX 12 · Think It Over Q1"
  source: NCERT IX Science · Ch 12 · Think It Over (p. 228)
  kind: text
  q: |-
    What do you understand by biodiversity?
  sol: |
    **Biodiversity** is the immense variety of living organisms on Earth: the number and types of organisms present on the planet, from microscopic algae and bacteria to giant trees and large animals, living in habitats from the snow-clad Himalayas to the coral reefs of the Andaman Sea. About 1.7 to 1.8 million species are known and described, and new ones are still being found. Biodiversity keeps ecosystems stable (algae release oxygen, fungi and bacteria decompose waste, bees and birds pollinate) and gives people food, shelter, medicines and livelihoods.
  check: none

- id: ncert9-it-12-t2
  lvl: ncert-intext
  num: "IX 12 · Think It Over Q2"
  source: NCERT IX Science · Ch 12 · Think It Over (p. 228)
  kind: text
  q: |-
    How does the grouping of organisms help us understand diversity?
  sol: |
    Millions of kinds of organisms cannot be studied one at a time. Grouping them by shared characteristics turns the variety into a manageable system: organisms that share features are placed together, so we can see how they are similar and different, how they are related, and how they function. It also lets us predict (a newly found animal with a notochord, for example, is placed with the chordates and we immediately know much about it) and plan conservation and farming.
  check: none

- id: ncert9-it-12-t3
  lvl: ncert-intext
  num: "IX 12 · Think It Over Q3"
  source: NCERT IX Science · Ch 12 · Think It Over (p. 228)
  kind: text
  q: |-
    On what basis, are plants and animals classified?
  sol: |
    Scientists start with broad, easily visible features and then use finer ones. NCERT Class 9 lists seven kinds of characteristic: (1) external features (shape, size, body organisation); (2) mode of nutrition (autotrophic or heterotrophic); (3) internal structures (skeleton, organs, tissues); (4) cell structure (unicellular or multicellular, prokaryotic or eukaryotic, cell wall present or absent); (5) ecological role (producer, consumer, decomposer); (6) reproduction (asexual and/or sexual); (7) genetic similarity, studied with DNA. Similar features suggest descent from common ancestors.
  check: none

- id: ncert9-it-12-t4
  lvl: ncert-intext
  num: "IX 12 · Think It Over Q4"
  source: NCERT IX Science · Ch 12 · Think It Over (p. 228)
  kind: text
  q: |-
    How does classification help address problems in farming?
  sol: |
    [Unverified: NCERT poses this question without an answer.] The chapter notes that farmers have long conserved diverse crop varieties with useful characteristics such as drought tolerance, pest resistance and the ability to grow in nutrient-poor soil, because diversity reduces the risk of crop failure and strengthens food security. Classification helps by (i) identifying exactly which species and varieties exist and what traits they carry; (ii) allowing a breeder to look for a drought-tolerant or pest-resistant relative of a crop within the same genus or family; (iii) identifying pests and the beneficial insects that control them, so that the right control is used; and (iv) giving each crop one name so seed, research and trade information is shared without confusion.
  check: none

- id: ncert9-it-12-p1
  lvl: ncert-intext
  num: "IX 12 · Pause and Ponder 1"
  source: NCERT IX Science · Ch 12 · Pause and Ponder 1 (p. 231)
  kind: text
  q: |-
    If many organisms share common features, could they also share a common ancestry?
  sol: |
    Yes. Class 9 says that similar features in organisms suggest that they have evolved from common ancestors, and that organisms with similar DNA are considered to have a common ancestry. The closer the resemblance in structure, cell organisation and DNA, the more recently two groups probably shared an ancestor. This is why systematics takes evolutionary relationships into account. One caution: resemblance can also arise from similar environments, so modern classification checks many characters, including DNA, before concluding that two groups are related.
  check: none

- id: ncert9-it-12-a2
  lvl: ncert-intext
  num: "IX 12 · Activity 12.2"
  source: NCERT IX Science · Ch 12 · Activity 12.2 (Pakke Tiger Reserve case study, p. 232)
  kind: text
  q: |-
    Carefully read the given case study of Pakke Tiger Reserve.
    The Pakke Tiger Reserve in Arunachal Pradesh is a forest where scientists have recorded nearly 300 bird species, which is striking given that India as a whole has about 1,300 bird species. Pakke is also known for supporting four species of hornbills — the Rufous-necked Hornbill, the Oriental Pied Hornbill, the Great Hornbill, and the Wreathed Hornbill (Fig. 12.3). These large birds nest only in large, old trees with suitable cavities and feed on specific fruits. As a result, different hornbill species are found in different parts of the forest depending on tree size and fruit availability. Studying such patterns allows scientists to ask precise questions about biodiversity, such as —
    How are species distributed within a forest? Which plants and animals are closely linked?
    How does classifying the four hornbill species help us understand biodiversity?
    Think and discuss the case based on the following questions —
    (i) How can scientists keep track of so many species?
    (ii) The four hornbills look similar in some ways. What features can help scientists distinguish them from one another?
    (iii) What would happen if the large, old trees disappeared from the forest?
  sol: |
    The figure (photographs of the four hornbills) is not in the text layer, so the answer to (ii) uses the case text only. [Unverified for the picture details.]

    **(i)** By classifying and naming them: each species gets one standard scientific name and a place in the hierarchy, so records from different observers can be compared and counted without confusion.

    **(ii)** Hornbills share large size and cavity nesting, so scientists look for differences: size and colour pattern, the shape of the bill and casque, the food they eat, and where in the forest they live, since each species depends on particular tree sizes and fruits (the case itself says species are found in different parts of the forest according to tree size and fruit availability).

    **(iii)** The hornbills nest only in large, old trees with cavities and feed on specific fruits, so without such trees they would lose nesting sites and food. Their numbers would fall and some species could disappear. Plants that depend on them to spread seeds would be affected too, which shows how closely species in a forest are linked. This is also why classification supports conservation: it tells us which species are present and which are threatened.

    **How classifying the four hornbills helps:** it shows how species are distributed within the forest, which plants and animals are closely linked, and which species need which habitat.
  check: none

- id: ncert9-it-12-p7
  lvl: ncert-intext
  num: "IX 12 · Pause and Ponder 7"
  source: NCERT IX Science · Ch 12 · Pause and Ponder 7 (p. 247)
  kind: text
  q: |-
    Does the term ‘biodiversity’ relate only to the variety of organisms, or does it encompass other elements?
  sol: |
    It covers more than the count of species. Biodiversity also includes the **variety within a species** (different crop varieties and populations carry different genetic traits, such as drought tolerance or pest resistance), the **variety of habitats and ecosystems** (mountains, deserts, rainforests, coasts, wetlands) and the **interactions** among organisms and their surroundings (food webs, pollination, decomposition). [Unverified: the three-level scheme of genetic, species and ecosystem diversity is the standard framework taught in Class 12 Ecology; the Class 9 text hints at it through crop varieties and habitats.]
  check: none

- id: ncert9-it-12-p8
  lvl: ncert-intext
  num: "IX 12 · Pause and Ponder 8"
  source: NCERT IX Science · Ch 12 · Pause and Ponder 8 (p. 247)
  kind: text
  q: |-
    If you find a new organism in a pond, what features will you observe to classify it and why?
  sol: |
    Start with broad features and then go finer, as scientists do. (1) **Cell structure**: under a microscope, is it unicellular or multicellular, is there a membrane-bound nucleus, is there a cell wall? This separates the major groups. (2) **Mode of nutrition**: does it make its own food (green, chlorophyll) or does it ingest or absorb food? (3) **External features**: shape, size, body organisation, movement by cilia, flagella or pseudopodia. (4) **Internal structure**: tissues, organs, skeleton, if any. (5) **Reproduction**: asexual or sexual. (6) **Ecological role**: producer, consumer or decomposer. (7) **DNA** comparison with known species. We use many characters because one feature alone can mislead: the same organism fits different groups depending on the criterion.
  check: none

- id: ncert9-it-12-p9
  lvl: ncert-intext
  num: "IX 12 · Pause and Ponder 9"
  source: NCERT IX Science · Ch 12 · Pause and Ponder 9 (p. 247)
  kind: text
  q: |-
    Why do genetic studies provide deep information about living beings?
  sol: |
    Every living cell contains DNA, which carries the instructions for its growth and function. Because DNA is inherited, comparing it shows how closely organisms are related: organisms with similar DNA are considered to share a common ancestry. It does not depend on outward appearance, which can mislead, and it can be compared in tiny organisms that look alike. Genetic data led Carl Woese (1977) to propose the three domains Bacteria, Archaea and Eukarya, and showed that microscopic life is far more diverse than was thought.
  check: none

- id: ncert9-it-12-p10
  lvl: ncert-intext
  num: "IX 12 · Pause and Ponder 10"
  source: NCERT IX Science · Ch 12 · Pause and Ponder 10 (p. 247)
  kind: text
  q: |-
    How can changes in climate affect the biodiversity?
  sol: |
    Each species is adapted to a range of temperature, rainfall and habitat. When the climate changes faster than species can adapt or move, some decline: mountain species run out of higher ground, coral reefs bleach in warmer water, and plants that flower with the monsoon may flower out of step with their pollinators. When one species disappears, others that depend on it decline too, so the effect spreads through food webs. Class 9 lists climate change, together with pollution, deforestation and overuse of resources, among human activities that are reducing biodiversity.
  check: none

- id: ncert9-ex-12-3
  lvl: ncert-ex
  num: "IX 12 · Q3"
  source: NCERT IX Science · Ch 12 · Revise, Reflect, Refine Q3
  kind: text
  q: |-
    Observe two different animals in your immediate environment. What features help you distinguish between them? How do these features help place them into different groups?
  sol: |
    Model answer, using a crow and a cow (any two animals will do). **Distinguishing features:** the crow has feathers, a beak and wings and lays eggs; the cow has hair, four legs, horns and mammary glands and gives birth to young. Both have a backbone and a notochord at some stage, and both are warm-blooded. **Grouping:** both belong to Kingdom Animalia and the phylum Chordata because they have a backbone. They separate at class: the crow is a bird (Aves) because it has feathers, wings and lays eggs; the cow is a mammal (Mammalia) because it has hair and mammary glands. So an observable feature decides at which step of the ladder two animals part company. [Unverified: the animals are an illustration; this question has no fixed answer.]
  check: none

- id: ncert9-ex-12-6
  lvl: ncert-ex
  num: "IX 12 · Q6"
  source: NCERT IX Science · Ch 12 · Revise, Reflect, Refine Q6
  kind: text
  q: |-
    How does the diversity of organisms contribute to the balance and stability of an ecosystem?
  sol: |
    Each organism plays a role: plants and algae are producers and release oxygen; herbivores and carnivores are consumers that keep each other's numbers in check; fungi and bacteria decompose waste and return nutrients to the soil; bees, birds and bats pollinate and spread seeds. These roles are interconnected, so a diverse ecosystem has many species doing each job. If one species declines, another can partly take over its role, and the food webs keep working. In an ecosystem with few species, the loss of one can cause others that depend on it to decline, and the system may collapse. Diversity also reduces risk in farming: a mixture of crop varieties is less likely to fail altogether to one pest or drought.
  check: none

- id: ncert9-ex-12-12
  lvl: ncert-ex
  num: "IX 12 · Q12"
  source: NCERT IX Science · Ch 12 · Revise, Reflect, Refine Q12
  kind: text
  q: |-
    In the classification hierarchy, which group — class or genus — has fewer members but more features in common? Explain your answer.
  sol: |
    **Genus.** The hierarchy runs from broad groups to narrow ones; at each lower step the members share more features, and every lower group is part of the group above. A genus contains only closely related species (for example *Panthera tigris* and *Panthera leo* in *Panthera*), whereas a class contains many orders, families and genera (class Mammalia includes the orders Carnivora and Primata, and more). So the genus is small and its members have many characters in common, while the class is large and its members share only a few broad characters (for mammals: hair and mammary glands).
  check: none

- id: ncert11-ex-1-1
  lvl: ncert-ex
  num: "XI 1 · Q1"
  source: NCERT XI Biology · Ch 1 · Exercise Q1
  kind: text
  q: |-
    Why are living organisms classified?
  sol: |
    There are millions of kinds of organisms (about 1.7 to 1.8 million are known and described), and it is impossible to study each one separately. Classification groups organisms into convenient categories on the basis of easily observable characters, so that: (i) the study of organisms becomes easier, organised and systematic; (ii) similarities and differences are clear, and with them the relationships between organisms; (iii) a new organism can be placed, identified and named by comparing it with known ones; (iv) scientists everywhere share a common system; (v) the information supports use of bio-resources in agriculture, forestry and industry, and conservation.
  check: none

- id: ncert11-ex-1-2
  lvl: ncert-ex
  num: "XI 1 · Q2"
  source: NCERT XI Biology · Ch 1 · Exercise Q2
  kind: text
  q: |-
    Why are the classification systems changing every now and then?
  sol: |
    Classification is based on the knowledge and tools available at the time. As new characters are discovered, the grouping is revised: external features gave way to internal structure, cell structure, development, ecological information and then DNA. New tools (microscopes, staining techniques, genetic analysis) revealed things earlier systems could not explain. Examples from Class 9: the two-kingdom system could not place amoeba or bacteria, so Protista, Monera and Fungi were added (five kingdoms), and DNA comparison led to the three-domain system. Newly discovered organisms must also be fitted in. Modern systematics aims to reflect evolutionary relationships, which are still being worked out, so classification is a process of reasoning and change, not a final answer.
  check: none

- id: ncert11-ex-1-3
  lvl: ncert-ex
  num: "XI 1 · Q3"
  source: NCERT XI Biology · Ch 1 · Exercise Q3
  kind: text
  q: |-
    What different criteria would you choose to classify people that you meet often?
  sol: |
    There is no single correct answer; the point is that the choice of criterion decides the groups. Model answer: people can be grouped by (i) occupation: students, teachers, shopkeepers, doctors, farmers; (ii) age: children, adults, senior citizens; (iii) place: neighbours, classmates, relatives; (iv) language they speak; (v) relationship to you: family, friends, acquaintances. Each criterion cuts the same people into different groups, just as the same animal can be sorted by habitat, diet or body structure. A good criterion is easy to observe, applies to everyone, and gives groups that tell you something useful. Biologists likewise prefer characters that are observable and reflect real relationships rather than chance resemblance.
  check: none

- id: ncert11-ex-1-4
  lvl: ncert-ex
  num: "XI 1 · Q4"
  source: NCERT XI Biology · Ch 1 · Exercise Q4
  kind: text
  q: |-
    What do we learn from identification of individuals and populations?
  sol: |
    [Unverified: NCERT gives no answer.] Identification means recognising which organism, or which kind of organism, we have in front of us. Only after an organism is identified correctly can it be given the right scientific name (nomenclature), because a name can be attached only if we know to which organism it belongs. From identifying individuals and populations we learn: (i) which species are present in an area and how many kinds there are (biodiversity); (ii) how individuals of one population resemble each other and differ from related species; (iii) whether a species is new, rare or threatened; (iv) which species are useful (crops, medicines) or harmful (pests, disease carriers); and (v) the raw data for classification and for studying relationships.
