  kind: text
  q: |-
    (5 marks) Explain the taxonomic hierarchy. Illustrate it with an animal and a plant, and state how the number of shared characters changes from species to kingdom. (Original problem.)
  sol: |
    **Points an examiner looks for:**

    1. Classification is a hierarchy of steps; each step is a rank or taxonomic category. (1)
    2. The order from lowest to highest: species, genus, family, order, class, phylum (division in plants), kingdom. (1)
    3. An animal example in full, e.g. tiger *Panthera tigris*: genus *Panthera*, family Felidae, order Carnivora, class Mammalia, phylum Chordata, kingdom Animalia. (1)
    4. A plant example in full, e.g. mango *Mangifera indica*: genus *Mangifera*, family Anacardiaceae, order Sapindales, class Dicotyledonae, division Angiospermae, kingdom Plantae. (1)
    5. As you go up from species to kingdom, the number of common characters decreases; lower taxa share more characters, and higher categories make relationships harder to determine, so the problem of classification gets more complex. (1)
    A neat ladder or table diagram earns the presentation mark.
  check: none

- id: m1
  lvl: main
  kind: mcq
  q: |-
    Match Column I with Column II (original problem):
    Column I: (A) Felidae; (B) Carnivora; (C) Solanum; (D) Chordata.
    Column II: (1) Order; (2) Family; (3) Phylum; (4) Genus.
  opts: ["A-2, B-1, C-4, D-3", "A-2, B-3, C-4, D-1", "A-1, B-2, C-3, D-4", "A-4, B-1, C-2, D-3"]
  ans: 0
  sol: |
    Felidae ends in -idae and is a family (2). Carnivora is the animal order that includes Felidae and Canidae (1). *Solanum* is a genus (4), whose family is Solanaceae. Chordata is the phylum (3). So A-2, B-1, C-4, D-3.
  check: none

- id: m2
  lvl: main
  kind: mcq
  q: |-
    Assertion (A): Two species of the same genus share more characters than two genera of the same family.
    Reason (R): The genus is a lower taxonomic category than the family.
    (Original problem.)
  opts: ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"]
  ans: 0
  sol: |
    Lower categories share more characters, and the genus is below the family. Species of one genus are closely related (e.g. lion and tiger in *Panthera*), while different genera of a family (*Panthera* and *Felis* in Felidae) share fewer. Both statements are true and R explains A: option (a).
  check: none

- id: m3
  lvl: main
  kind: mcq
  q: |-
    Read the statements about taxonomy (original problem):
    (i) Species is the lowest taxonomic category in both plants and animals.
    (ii) The category called division is used for plants, and the corresponding rank in animals is phylum.
    (iii) In a scientific name the specific epithet starts with a capital letter.
    (iv) The author's name appears after the specific epithet, in abbreviated form.
    Which statements are correct?
  opts: ["(i), (ii) and (iv) only", "(i), (ii) and (iii) only", "(ii), (iii) and (iv) only", "(i) and (iii) only"]
  ans: 0
  sol: |
    (i) True. (ii) True: classes with a few similar characters in plants are assigned to a division; in animals the equivalent rank is phylum. (iii) False: the genus is capitalised; the epithet starts with a small letter. (iv) True: e.g. *Mangifera indica* Linn. So (i), (ii) and (iv).
  check: none

- id: m4
  lvl: main
  kind: mcq
  q: |-
    Mango (Mangifera indica) and wheat (Triticum aestivum) are placed in the same
    (Original problem; use Table 1.1 of NCERT.)
  opts: ["class but different divisions", "division but different classes", "order but different families", "family but different orders"]
  ans: 1
  sol: |
    Table 1.1: mango is in class Dicotyledonae, order Sapindales, family Anacardiaceae; wheat is in class Monocotyledonae, order Poales, family Poaceae. Both belong to the division Angiospermae. So they are in the same division but different classes (and different orders and families as well): option (b).
  check: none
