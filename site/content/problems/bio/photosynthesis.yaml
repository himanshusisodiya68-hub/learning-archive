- id: m3
  lvl: main
  kind: mcq
  q: |-
    Read the statements about the light reaction (original problem):
    (i) The stroma lamellae lack PS II and the NADP reductase enzyme.
    (ii) Cyclic photophosphorylation produces ATP and NADPH.
    (iii) The protons released by splitting of water accumulate in the thylakoid lumen.
    (iv) The Z scheme begins with excitation of PS I.
    Which statements are correct?
  opts: ["(i) and (iii) only", "(i), (ii) and (iii) only", "(ii) and (iv) only", "(iii) and (iv) only"]
  ans: 0
  sol: |
    (i) True: this is why only cyclic flow is thought to happen there. (ii) False: cyclic flow gives ATP only; the electron does not reach NADP+. (iii) True: water is split on the inner (lumen) side of the membrane. (iv) False: the scheme starts with PS II (P680), even though PS I was discovered first. So only (i) and (iii).
  check: none

- id: m4
  lvl: main
  kind: mcq
  q: |-
    A leaf of a C3 plant is in bright light at 25 °C with plenty of water, but the air has only about 0.03 per cent CO2. Which change would increase its rate of photosynthesis the most? (Original problem.)
  opts: ["Doubling the light intensity", "Raising the CO2 concentration to about 0.05 per cent", "Raising the temperature to 45 °C", "Keeping the plant in the dark for some hours"]
  ans: 1
  sol: |
    Blackman's law of limiting factors: the rate is set by the factor nearest its minimum. Light is already bright (saturation is near 10 per cent of full sunlight), and C3 plants are not saturated at today's CO2 level; they respond to CO2 up to about 0.05 per cent. A high temperature of 45 °C is beyond the optimum of a C3 plant and would reduce the rate. So raise the CO2: option (b). This is the principle behind CO2-enriched greenhouses for tomato and bell pepper.
  check: none

- id: m5
  lvl: main
  kind: num
  q: In non-cyclic photophosphorylation, 3 molecules of O2 are released. Assuming 2 electrons are needed to reduce one NADP+ to NADPH, how many molecules of NADPH are formed? (Original problem; uses 2H2O → 4H+ + O2 + 4e−.)
  ask: NADPH molecules
  unit: NADPH
  ans: 6
  tol: 0.01
  verify: 3*4/2
  sol: |
    Each O2 comes with 4 electrons from 2H2O, so 3 O2 mean $3\times4 = 12$ electrons passed along the Z scheme. These electrons end up on NADP+, 2 per NADPH, giving $12/2 = 6$ NADPH. [The count of 2 electrons per NADPH is standard biochemistry rather than stated in NCERT: Unverified.]
  check: code
