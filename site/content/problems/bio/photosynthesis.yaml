- id: f3
  lvl: found
  kind: num
  q: How many molecules of ATP does the Calvin cycle use to make 2 molecules of glucose? (Original problem. Use the NCERT count of 3 ATP per CO2 fixed.)
  ask: ATP molecules
  unit: ATP
  ans: 36
  tol: 0.01
  verify: 2*6*3
  sol: |
    One glucose needs 6 CO2, hence 6 turns of the cycle. Each CO2 fixed uses 3 ATP (2 for the reduction steps, 1 for regenerating RuBP), so one glucose needs $6\times3 = 18$ ATP (and 12 NADPH). Two glucose molecules need $2\times18 = 36$ ATP (and 24 NADPH).
  check: code

- id: f4
  lvl: found
  kind: text
  q: Why is it a misnomer to call the Calvin cycle the "dark reaction"? (Original problem.)
  sol: |
    The cycle does not need light *directly*, but it depends on the ATP and NADPH made in the light reaction. Experiments show that when light is cut off, the biosynthetic phase continues for a short time (until the ATP and NADPH run out) and then stops; when light returns, it restarts. In ordinary life it runs in the daytime, in the stroma of a leaf in sunlight, so it does not "happen in the dark". The better names are the *biosynthetic* or *carbon-fixation* phase.
  check: none

- id: b1
  lvl: board
  kind: text
  q: (2 marks) Distinguish between an absorption spectrum and an action spectrum. (Original problem.)
  sol: |
    - **Absorption spectrum** (1 mark): a graph of how much light a pigment absorbs at each wavelength (e.g. chlorophyll a peaks in the blue and red regions).
    - **Action spectrum** (1 mark): a graph of the rate of photosynthesis at each wavelength of light. It resembles the absorption spectra of chlorophyll a and b, which shows that these are the pigments of photosynthesis.
    Engelmann's experiment (a prism, the alga *Cladophora* and aerobic bacteria clustering where O2 was released) gave the first action spectrum. The two curves do not overlap exactly: some photosynthesis occurs at other wavelengths because accessory pigments pass energy to chlorophyll a.
  check: none

- id: b2
  lvl: board
  kind: text
  q: (3 marks) Name the three stages of the Calvin cycle and state what happens in each. (Original problem.)
  sol: |
    1. **Carboxylation** (1 mark): CO2 combines with the 5-carbon acceptor RuBP, catalysed by RuBisCO, to give 2 molecules of the 3-carbon acid 3-PGA.
    2. **Reduction** (1 mark): PGA is phosphorylated using ATP and reduced using NADPH to triose phosphate and finally sugar (glucose, starch, sucrose); 2 ATP and 2 NADPH per CO2 fixed.
    3. **Regeneration** (1 mark): RuBP is formed again from triose phosphates, using 1 ATP per CO2, so the cycle continues.
    Examiners also like: six turns for one glucose, 18 ATP and 12 NADPH in total, and that the cycle runs in the stroma of all photosynthetic plants (C3 and C4).
  check: none

- id: b3
  lvl: board
  kind: text
  q: (3 marks) What is photorespiration? Why does it not occur in C4 plants? (Original problem.)
  sol: |
    - **Definition** (1 mark): RuBisCO can bind O2 as well as CO2 (the two compete). When it binds O2, RuBP is split into one 3-carbon PGA and one 2-carbon phosphoglycolate in the photorespiratory pathway. No sugar and no ATP or NADPH is made; CO2 is released and ATP is used up.
    - **Why not in C4 plants** (2 marks): the mesophyll fixes CO2 with PEP carboxylase, which does not bind O2, and C4 acids carry the CO2 to the bundle sheath cells. Breaking these acids down raises the CO2 concentration at RuBisCO, so it acts as a carboxylase and the oxygenase activity is minimised.
    Add: this is why C4 plants have higher productivity and tolerate higher temperatures. NCERT states that the biological function of photorespiration is not known.
  check: none

- id: b4
  lvl: board
  kind: text
  q: (5 marks) Describe how ATP and NADPH are produced in the light reaction of photosynthesis, with the help of the Z scheme. (Original problem.)
  sol: |
    Points an examiner looks for (any five well-linked points; a neat labelled Z scheme earns marks):
    1. Two photosystems in the thylakoid membrane, **PS II (P680)** and **PS I (P700)**; each has a light-harvesting complex (antenna) that funnels energy to one chlorophyll a molecule, the reaction centre.
    2. PS II absorbs 680 nm light; its electrons are excited and picked up by an acceptor.
    3. They pass downhill along an electron transport chain (cytochromes) to PS I. The electrons are not used up. On the way, protons are pumped across the thylakoid membrane into the lumen.
    4. PS I is also excited (700 nm); its electron passes to another acceptor and then downhill to **NADP+**, which is reduced to **NADPH + H+** (enzyme NADP reductase, on the stroma side).
    5. PS II's lost electrons are replaced by **splitting of water** on the lumen side: 2H2O → 4H+ + O2 + 4e−. O2 is released; protons add to the lumen gradient.
    6. **Chemiosmosis:** the proton gradient (high in the lumen, with a lower pH) breaks down as protons flow through the CF0 channel of **ATP synthase** to the stroma; the energy changes CF1 and ADP + Pi becomes **ATP**.
    7. The zigzag shape of the carriers on the redox scale gives the name Z scheme.
  check: none

- id: m1
  lvl: main
  kind: mcq
  q: |-
    Assertion (A): C4 plants show little or no photorespiration.
    Reason (R): In the bundle sheath cells of C4 plants, C4 acids are broken down and release CO2, which raises the CO2 concentration at the RuBisCO site.
    (Original problem.)
  opts: ["Both A and R are true, and R is the correct explanation of A", "Both A and R are true, but R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"]
  ans: 0
  sol: |
    Photorespiration starts when O2 competes with CO2 at the active site of RuBisCO. Raising the CO2 level at the enzyme tips the competition towards carboxylation, so the oxygenase activity is minimised. Both statements are true and R explains A: option (a).
  check: none

