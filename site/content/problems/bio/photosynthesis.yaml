- id: ncert10-ex-5-7
  lvl: ncert-ex
  num: "X 5 · Q7"
  source: NCERT X Science · Ch 5 · Exercise Q7
  kind: text
  q: |-
    What are the necessary conditions for autotrophic nutrition and what are its by-products?
  sol: |
    **Necessary conditions:** carbon dioxide (from the air, through stomata), water (from the soil), **sunlight** (the energy source) and **chlorophyll** (in the chloroplasts) to absorb the light energy.

    **Products:** carbohydrates (glucose, stored as starch) are the food made. The **by-product is oxygen**, released when water is split; it leaves the leaf through the stomata. (The Class XI chapter shows that this O2 comes from water, not from CO2.)

    In words: carbon dioxide + water, in the presence of sunlight and chlorophyll, give carbohydrate + oxygen.
  check: none

