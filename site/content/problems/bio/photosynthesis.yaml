# Photosynthesis. NCERT questions copied word for word from NCERT Biology Class XI (reprint 2026-27) Ch 11 (Exercises 1 to 9) and Science Class X Ch 5 (in-text Questions p.87 Q1-Q2; Exercises Q3 and Q7). No NCERT answer key exists for Biology: all answers are model answers written for this archive. Found, board and main problems are original.

- id: ncert11-ex-11-1
  lvl: ncert-ex
  num: "XI 11 · Q1"
  source: NCERT XI Biology · Ch 11 · Exercise Q1
  kind: text
  q: |-
    By looking at a plant externally, can you tell whether a plant is C3 or C4? Why and how?
  sol: |
    **Not reliably.** The difference between C3 and C4 plants lies in the *internal* anatomy of the leaf (the Kranz arrangement of bundle sheath cells) and in the biochemistry of CO2 fixation (PEP carboxylase in the mesophyll, RuBisCO in the bundle sheath). Neither can be seen by looking at the outside of a leaf: both kinds have green leaves, stomata and veins.

    Only *indirect hints* are possible from the outside, and they are hints, not proof:
    - C4 plants are mostly tropical or dry-region plants that thrive in high light and high temperature, and show high biomass productivity (maize, sugarcane and sorghum are C4; wheat, rice and potato are C3).
    - A plant that keeps growing vigorously in the hottest, brightest part of the year is more likely to be C4.

    To be sure, cut a thin vertical section of the leaf and look under a microscope for Kranz anatomy (see Q2).
  check: none

- id: ncert11-ex-11-2
  lvl: ncert-ex
  num: "XI 11 · Q2"
  source: NCERT XI Biology · Ch 11 · Exercise Q2
  kind: text
  q: |-
    By looking at which internal structure of a plant you can tell whether a plant is C3 or C4? Explain.
  sol: |
    By looking at the **leaf anatomy** in a vertical section: C4 plants show **Kranz ("wreath") anatomy**.
    - Around each vascular bundle lies a ring of particularly large **bundle sheath cells**, with a large number of chloroplasts, thick walls impervious to gaseous exchange and no intercellular spaces. There may be several layers of them.
    - The mesophyll cells sit outside this ring and are in contact with the air spaces.

    In a C3 leaf, the bundle sheath is not specialised in this way (it has few or no chloroplasts), and the Calvin cycle runs in all the mesophyll cells. So a section of maize or sorghum shows the wreath of chloroplast-rich bundle sheath cells; a section of a C3 leaf does not.
  check: none

- id: ncert11-ex-11-3
  lvl: ncert-ex
  num: "XI 11 · Q3"
  source: NCERT XI Biology · Ch 11 · Exercise Q3
  kind: text
  q: |-
    Even though a very few cells in a C4 plant carry out the biosynthetic – Calvin pathway, yet they are highly productive. Can you discuss why?
  sol: |
    Because the few Calvin-cycle cells (the bundle sheath) are **supercharged with CO2**.
    1. In the mesophyll, **PEP carboxylase** (which has no oxygenase activity) fixes CO2 into the 4-carbon acid OAA, then malic or aspartic acid, even when atmospheric CO2 is scarce.
    2. These C4 acids are carried into the bundle sheath cells and broken down there, releasing CO2. This raises the CO2 concentration around RuBisCO far above that of the air.
    3. At high CO2, RuBisCO works almost only as a **carboxylase**; the wasteful **photorespiration** is minimised, so little fixed carbon, and no ATP, is thrown away.
    4. The system also tolerates high temperature and responds to high light intensity, so it keeps running at full speed when C3 plants slow down.

    In effect the mesophyll is a pump that delivers CO2 to a small, well-supplied factory. A small factory running flat out beats a large one that wastes part of its output. (The pump itself costs extra ATP [Unverified: not in NCERT], but in bright, hot, dry places the gain far outweighs this.)
  check: none

- id: ncert11-ex-11-4
  lvl: ncert-ex
  num: "XI 11 · Q4"
  source: NCERT XI Biology · Ch 11 · Exercise Q4
  kind: text
  q: |-
    RuBisCO is an enzyme that acts both as a carboxylase and oxygenase. Why do you think RuBisCO carries out more carboxylation in C4 plants?
  sol: |
    CO2 and O2 **compete** for the same active site of RuBisCO, so which reaction happens depends on the relative concentration of the two gases at the enzyme.

    In C4 plants RuBisCO is found only in the bundle sheath cells (the mesophyll lacks it). There, C4 acids from the mesophyll are broken down and release CO2, which increases the CO2 concentration at the enzyme site. With plenty of CO2 and little O2, almost every RuBP is carboxylated to 2 PGA; the oxygenase reaction (the start of photorespiration) is minimised. In C3 plants, RuBisCO sits in mesophyll cells exposed to the ordinary CO2 : O2 ratio of the leaf air, so some O2 does bind.
  check: none

- id: ncert11-ex-11-5
  lvl: ncert-ex
  num: "XI 11 · Q5"
  source: NCERT XI Biology · Ch 11 · Exercise Q5
  kind: text
  q: |-
    Suppose there were plants that had a high concentration of Chlorophyll b, but lacked chlorophyll a, would it carry out photosynthesis? Then why do plants have chlorophyll b and other accessory pigments?
  sol: |
    **No.** Chlorophyll a is the chief pigment of photosynthesis: the single chlorophyll a molecule at the reaction centre of each photosystem (P680 in PS II, P700 in PS I) is the one that actually gives up an excited electron. Chlorophyll b can absorb light but can only *pass the energy on* to chlorophyll a; it cannot start the electron transport itself. Without chlorophyll a there is no reaction centre, so no light reaction.

    Plants still have **chlorophyll b, xanthophylls and carotenoids** (accessory pigments) because they
    - absorb light of wavelengths that chlorophyll a absorbs poorly, so a wider range of the spectrum is used, and transfer the energy to chlorophyll a (they are part of the antenna);
    - protect chlorophyll a from **photo-oxidation** by excess light.
  check: none

- id: ncert11-ex-11-6
  lvl: ncert-ex
  num: "XI 11 · Q6"
  source: NCERT XI Biology · Ch 11 · Exercise Q6
  kind: text
  q: |-
    Why is the colour of a leaf kept in the dark frequently becomes yellow, or pale green? Which pigment do you think is more stable?
  sol: |
    In the dark the leaf cannot make new **chlorophyll**, while the chlorophyll it already has keeps breaking down. [Unverified: NCERT does not explain the mechanism; the standard account is that chlorophyll synthesis needs light and the molecule is degraded faster than it is renewed.] As the green fades, the **yellow to orange pigments (xanthophylls and carotenoids)**, which were hidden under the green, show through, so the leaf looks yellow or pale green.

    So the **carotenoids and xanthophylls are the more stable pigments**: they persist after chlorophyll has gone. This is also what you see in autumn leaves.
  check: none

- id: ncert11-ex-11-7
  lvl: ncert-ex
  num: "XI 11 · Q7"
  source: NCERT XI Biology · Ch 11 · Exercise Q7
  kind: text
  q: |-
    Look at leaves of the same plant on the shady side and compare it with the leaves on the sunny side. Or, compare the potted plants kept in the sunlight with those in the shade. Which of them has leaves that are darker green ? Why?
  sol: |
    This is an observation task; the expected result is that the **shade leaves are darker green**. [Unverified: the result of a real observation depends on the plant, and NCERT gives no answer.]

    Why: in dim light the plant is short of light, so it makes more chlorophyll per leaf (and per chloroplast) and often a larger, thinner leaf, to catch as many photons as possible. A dark green colour means a lot of chlorophyll. In strong sunlight, light is not limiting (saturation occurs at about 10 per cent of full sunlight), so extra chlorophyll gains little, and too much light can break down chlorophyll; sun leaves therefore tend to be lighter green, with more protective carotenoid-type pigments.
  check: none

- id: ncert11-ex-11-8
  lvl: ncert-ex
  num: "XI 11 · Q8"
  source: NCERT XI Biology · Ch 11 · Exercise Q8
  kind: text
  q: |-
    Figure 11.10 shows the effect of light on the rate of photosynthesis. Based on the graph, answer the following questions:
    (a) At which point/s (A, B or C) in the curve light is a limiting factor?
    (b) What could be the limiting factor/s in region A?
    (c) What do C and D represent on the curve?
  sol: |
    **[Unverified]** The figure itself is not in the text layer: only its letters A to E survive. From the chapter text, Fig. 11.10 plots the rate of photosynthesis (y-axis) against light intensity (x-axis): the rate rises roughly linearly at low light, bends over, and then levels off at high light. The answers below assume that standard shape and the usual positions (A on the rising part, B at the bend, C on the plateau, D on the light-intensity axis below the plateau). Check them against your textbook's figure.

    **(a)** Light is the limiting factor on the **rising part of the curve (A)**, where doubling the light roughly doubles the rate. At the bend (B) light is only just ceasing to limit, and at **C** it no longer limits.

    **(b)** In region A the limiting factor is the **light intensity** itself. Strictly, the rate there is set by whichever factor is nearest its minimum (Blackman's law), so if the curve is flat because of CO2 or temperature, those would be the limiting factors instead. The ones NCERT lists are CO2 concentration, temperature, water and the plant's own factors.

    **(c)** **C** represents the plateau: the **maximum rate** of photosynthesis, at **light saturation**, where more light no longer helps because another factor (CO2, temperature, enzymes) now limits. **D** marks the **light intensity at which saturation is reached** (about 10 per cent of full sunlight for most plants).
  check: none

- id: ncert11-ex-11-9
  lvl: ncert-ex
  num: "XI 11 · Q9"
  source: NCERT XI Biology · Ch 11 · Exercise Q9
  kind: text
  q: |-
    Give comparison between the following:
    (a) C3 and C4 pathways
    (b) Cyclic and non-cyclic photophosphorylation
    (c) Anatomy of leaf in C3 and C4 plants
  sol: |
    **(a) C3 and C4 pathways**

    | Feature | C3 pathway | C4 pathway |
    |---|---|---|
    | First stable product of CO2 fixation | 3-carbon acid, PGA | 4-carbon acid, OAA |
    | Primary CO2 acceptor | RuBP (5-carbon) | PEP (3-carbon) |
    | Enzyme of first fixation | RuBisCO | PEP carboxylase (PEPcase) |
    | Cells where CO2 is first fixed | Mesophyll | Mesophyll |
    | Cells where the Calvin cycle runs | Mesophyll | Bundle sheath only |
    | Photorespiration | Present | Negligible |
    | Temperature optimum | Lower (20 to 25 °C) | Higher (30 to 40 °C) [values from the choices in NCERT Table 11.1; Unverified] |
    | Response to high light and CO2 | Saturates at lower light; CO2 limiting even at present levels | Keeps responding to high light; CO2 saturation at about 360 µL/L |
    | Productivity | Lower | Higher |
    | Examples | Wheat, rice, potato | Maize, sugarcane, sorghum |

    **(b) Cyclic and non-cyclic photophosphorylation**

    | Feature | Cyclic | Non-cyclic |
    |---|---|---|
    | Photosystems | PS I only | PS II and PS I in series (Z scheme) |
    | Electron path | Excited electron returns to PS I through the electron transport chain | From water, through PS II, chain and PS I, to NADP+ |
    | Products | ATP only | ATP, NADPH + H+ and O2 |
    | Water splitting and O2 release | No | Yes |
    | Where | Stroma lamellae (lack PS II and NADP reductase) [possible location] | Grana lamellae |
    | When | Also when only light beyond 680 nm is available | Normal condition |

    **(c) Leaf anatomy of C3 and C4 plants**

    | Feature | C3 leaf | C4 leaf |
    |---|---|---|
    | Bundle sheath | Not specialised; few or no chloroplasts | Large cells in a wreath (Kranz anatomy), many chloroplasts, thick walls, no intercellular spaces |
    | Cell types that fix CO2 | One: mesophyll | Two: mesophyll and bundle sheath |
    | Calvin cycle | In all mesophyll cells | Only in bundle sheath cells |
    | RuBisCO | In mesophyll | In bundle sheath only (mesophyll has PEPcase) |
  check: none

- id: ncert10-it-5-1
  lvl: ncert-intext
  num: "X 5 · p.87 Q1"
  source: NCERT X Science · Ch 5 · In-text Questions (p.87) Q1. [Spans autotrophic and heterotrophic nutrition; also placed in the nutrition leaf.]
  kind: text
  q: |-
    What are the differences between autotrophic nutrition and heterotrophic nutrition?
  sol: |
    | Autotrophic nutrition | Heterotrophic nutrition |
    |---|---|
    | The organism makes its own food from simple inorganic raw materials (carbon dioxide and water) | The organism takes in complex organic substances made by other organisms |
    | Needs an external energy source, the Sun, and chlorophyll (photosynthesis) | Needs enzymes to break the food down into simpler substances |
    | Food stored as starch | Food stored as glycogen (in animals) [stated in NCERT for humans] |
    | Green plants and some bacteria | Animals and fungi |
    | Survives on its own | Depends directly or indirectly on autotrophs |
  check: none

- id: ncert10-it-5-2
  lvl: ncert-intext
  num: "X 5 · p.87 Q2"
  source: NCERT X Science · Ch 5 · In-text Questions (p.87) Q2
  kind: text
  q: |-
    Where do plants get each of the raw materials required for photosynthesis?
  sol: |
    - **Carbon dioxide**: from the air, through the **stomata** (tiny pores on the surface of leaves; the guard cells open and close them). Some gas also enters across the surface of stems and roots.
    - **Water**: taken up from the soil by the **roots** in terrestrial plants, and carried up to the leaves.
    - **Sunlight and chlorophyll** are not raw materials but are needed too: light comes from the Sun and chlorophyll is in the chloroplasts of the leaf cells.
    - Other materials (nitrogen, phosphorus, iron, magnesium) are taken up from the soil. Nitrogen is taken up as inorganic nitrates or nitrites, or as organic compounds made by bacteria from atmospheric nitrogen.
  check: none

